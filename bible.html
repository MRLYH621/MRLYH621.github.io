,"我们既因信称义，就藉着我们的主耶稣基督得与神相和。"],[2,"我们又藉着他，因信得进入现在所站的这恩典中，并且欢欢喜喜盼望神的荣耀。"],[3,"不但如此，就是在患难中也是欢欢喜喜的。因为知道患难生忍耐，"],[4,"忍耐生老练，老练生盼望；"],[5,"盼望不至于羞耻；因为所赐给我们的圣灵将神的爱浇灌在我们心里。"],[6,"因我们还软弱的时候，基督就按所定的日期为罪人死。"],[7,"为义人死，是少有的；为仁人死，或者有敢作的。"],[8,"惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。"],[9,"现在我们既靠着他的血称义，就更要藉着他免去神的忿怒。"],[10,"因为我们作仇敌的时候，且藉着神儿子的死得与神和好；既已和好，就更要因他的生得救了。"],[11,"不但如此，我们既藉着我主耶稣基督得与神和好，也就藉着他以神为乐。"],[12,"这就如罪是从一人入了世界，死又是从罪来的；于是死就临到众人，因为众人都犯了罪。"],[13,"没有律法之先，罪已经在世上；但没有律法，罪也不算罪。"],[14,"然而从亚当到摩西，死就作了王，连那些不与亚当犯一样罪过的，也在他的权下。亚当乃是那以后要来之人的预像。"],[15,"只是过犯不如恩赐。若因一人的过犯，众人都死了，何况神的恩典，与那因耶稣基督一人恩典中的赏赐，岂不更加倍地临到众人吗？"],[16,"因一人犯罪就定罪，也不如恩赐；原来审判是由一人而定罪，恩赐乃是由许多过犯而称义。"],[17,"若因一人的过犯，死就因这一人作了王；何况那些受洪恩又蒙所赐之义的，岂不更要因耶稣基督一人在生命中作王吗？"],[18,"如此说来，因一次的过犯，众人都被定罪；照样，因一次的义行，众人也就被称义得生命了。"],[19,"因一人的悖逆，众人成为罪人；照样，因一人的顺从，众人也成为义了。"],[20,"律法本是外添的，叫过犯显多；只是罪在哪里显多，恩典就更显多了。"],[21,"就如罪作王叫人死；照样，恩典也藉着义作王，叫人因我们的主耶稣基督得永生。"]]},{"n":6,"v":[[1,"这样，怎么说呢？我们可以仍在罪中，叫恩典显多吗？"],[2,"断乎不可！我们在罪上死了的人岂可仍在罪中活着呢？"],[3,"岂不知我们这受洗归入基督耶稣的人，是受洗归入他的死吗？"],[4,"所以我们藉着洗礼归入死，和他一同埋葬，原是叫我们一举一动有新生的样式，像基督藉着父的荣耀从死里复活一样。"],[5,"我们若在他死的形状上与他联合，也要在他复活的形状上与他联合。"],[6,"因为知道我们的旧人和他同钉十字架，使罪身灭绝，叫我们不再作罪的奴仆，"],[7,"因为已死的人是脱离了罪，"],[8,"我们若是与基督同死，就信必与他同活，"],[9,"因为知道基督既从死里复活，就不再死，死也不再作他的主了。"],[10,"他死是向罪死了，只有一次；他活是向神活着。"],[11,"这样，你们向罪也当看自己是死的；向神在基督耶稣里，却当看自己是活的。"],[12,"所以，不要容罪在你们必死的身上作王，使你们顺从身子的私欲。"],[13,"也不要将你们的肢体献给罪作不义的器具；倒要像从死里复活的人，将自己献给神，并将肢体作义的器具献给神。"],[14,"罪必不能作你们的主，因你们不在律法之下，乃在恩典之下。"],[15,"这却怎么样呢？我们在恩典之下，不在律法之下，就可以犯罪吗？断乎不可！"],[16,"岂不晓得你们献上自己作奴仆，顺从谁，就作谁的奴仆吗？或作罪的奴仆，以致于死；或作顺命的奴仆，以致成义。"],[17,"感谢神！因为你们从前虽然作罪的奴仆，现今却从心里顺服了所传给你们道理的模范。"],[18,"你们既从罪里得了释放，就作了义的奴仆。"],[19,"我因你们肉体的软弱，就照人的常话对你们说：你们从前怎样将肢体献给不洁、不法作奴仆，以致于不法；现今也要照样将肢体献给义作奴仆，以致于成圣。"],[20,"因为你们作罪之奴仆的时候，就不被义约束了。"],[21,"你们现今所看为羞耻的事，当日有什么果子呢？那些事的结局就是死；"],[22,"但现今你们既从罪里得了释放，作了神的奴仆，就有成圣的果子，那结局就是永生。"],[23,"因为罪的工价乃是死；惟有神的恩赐，在我们的主基督耶稣里，乃是永生。"]]},{"n":7,"v":[[1,"弟兄们，我现在对明白律法的人说：你们岂不晓得律法管人是在活着的时候吗？"],[2,"就如女人有了丈夫，丈夫还活着，就被律法约束；丈夫若死了，就脱离了丈夫的律法。"],[3,"所以丈夫活着，她若归于别人，便叫淫妇；丈夫若死了，她就脱离了丈夫的律法，虽然归于别人，也不是淫妇。"],[4,"我的弟兄们，这样说来，你们藉着基督的身体，在律法上也是死了，叫你们归于别人，就是归于那从死里复活的，叫我们结果子给神。"],[5,"因为我们属肉体的时候，那因律法而生的恶欲就在我们肢体中发动，以致结成死亡的果子。"],[6,"但我们既然在捆我们的律法上死了，现今就脱离了律法，叫我们服侍主，要按着心灵的新样（“心灵”或作“圣灵”），不按着仪文的旧样。"],[7,"这样，我们可说什么呢？律法是罪吗？断乎不是！只是非因律法，我就不知何为罪。非律法说，“不可起贪心”，我就不知何为贪心。"],[8,"然而罪趁着机会，就藉着诫命叫诸般的贪心在我里头发动，因为没有律法，罪是死的。"],[9,"我以前没有律法，是活着的；但是诫命来到，罪又活了，我就死了。"],[10,"那本来叫人活的诫命，反倒叫我死，"],[11,"因为罪趁着机会，就藉着诫命引诱我，并且杀了我。"],[12,"这样看来，律法是圣洁的，诫命也是圣洁、公义、良善的。"],[13,"既然如此，那良善的是叫我死吗？断乎不是！叫我死的乃是罪。但罪藉着那良善的叫我死，就显出真是罪，叫罪因着诫命更显出是恶极了。"],[14,"我们原晓得律法是属乎灵的，但我是属乎肉体的，是已经卖给罪了。"],[15,"因为我所作的，我自己不明白。我所愿意的，我并不作；我所恨恶的，我倒去作。"],[16,"若我所作的，是我所不愿意的，我就应承律法是善的。"],[17,"既是这样，就不是我作的，乃是住在我里头的罪作的。"],[18,"我也知道在我里头，就是我肉体之中，没有良善。因为立志为善由得我，只是行出来由不得我。"],[19,"故此，我所愿意的善，我反不作；我所不愿意的恶，我倒去作。"],[20,"若我去作所不愿意作的，就不是我作的，乃是住在我里头的罪作的。"],[21,"我觉得有个律，就是我愿意为善的时候，便有恶与我同在。"],[22,"因为按着我里面的意思（原文作“人”），我是喜欢神的律；"],[23,"但我觉得肢体中另有个律和我心中的律交战，把我掳去叫我附从那肢体中犯罪的律。"],[24,"我真是苦啊！谁能救我脱离这取死的身体呢？"],[25,"感谢神！靠着我们的主耶稣基督就能脱离了。这样看来，我以内心顺服神的律，我肉体却顺服罪的律了。"]]},{"n":8,"v":[[1,"如今那些在基督耶稣里的，就不定罪了。"],[2,"因为赐生命圣灵的律在基督耶稣里释放了我，使我脱离罪和死的律了。"],[3,"律法既因肉体软弱，有所不能行的，神就差遣自己的儿子成为罪身的形状，作了赎罪祭，在肉体中定了罪案，"],[4,"使律法的义成就在我们这不随从肉体，只随从圣灵的人身上。"],[5,"因为随从肉体的人体贴肉体的事；随从圣灵的人体贴圣灵的事。"],[6,"体贴肉体的就是死，体贴圣灵的乃是生命平安。"],[7,"原来体贴肉体的，就是与神为仇，因为不服神的律法，也是不能服。"],[8,"而且属肉体的人不能得神的喜欢。"],[9,"如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。人若没有基督的灵，就不是属基督的。"],[10,"基督若在你们心里，身体就因罪而死，心灵却因义而活。"],[11,"然而叫耶稣从死里复活者的灵，若住在你们心里，那叫基督耶稣从死里复活的，也必藉着住在你们心里的圣灵，使你们必死的身体又活过来。"],[12,"弟兄们，这样看来，我们并不是欠肉体的债，去顺从肉体活着。"],[13,"你们若顺从肉体活着必要死，若靠着圣灵治死身体的恶行必要活着。"],[14,"因为凡被神的灵引导的，都是神的儿子。"],[15,"你们所受的不是奴仆的心，仍旧害怕；所受的乃是儿子的心，因此我们呼叫：“阿爸，父！”"],[16,"圣灵与我们的心同证我们是神的儿女；"],[17,"既是儿女，便是后嗣，就是神的后嗣，和基督同作后嗣。如果我们和他一同受苦，也必和他一同得荣耀。"],[18,"我想，现在的苦楚若比起将来要显于我们的荣耀，就不足介意了。"],[19,"受造之物切望等候神的众子显出来，"],[20,"因为受造之物服在虚空之下，不是自己愿意，乃是因那叫他如此的。"],[21,"但受造之物仍然指望脱离败坏的辖制，得享神儿女自由的荣耀（“享”原文作“入”）。"],[22,"我们知道一切受造之物一同叹息、劳苦，直到如今。"],[23,"不但如此，就是我们这有圣灵初结果子的，也是自己心里叹息，等候得着儿子的名分，乃是我们的身体得赎。"],[24,"我们得救是在乎盼望；只是所见的盼望不是盼望，谁还盼望他所见的呢？（有古卷作“人所看见的何必再盼望呢？”）"],[25,"但我们若盼望那所不见的，就必忍耐等候。"],[26,"况且，我们的软弱有圣灵帮助，我们本不晓得当怎样祷告，只是圣灵亲自用说不出来的叹息替我们祷告。"],[27,"鉴察人心的，晓得圣灵的意思，因为圣灵照着神的旨意替圣徒祈求。"],[28,"我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。"],[29,"因为他预先所知道的人，就预先定下效法他儿子的模样，使他儿子在许多弟兄中作长子。"],[30,"预先所定下的人又召他们来，所召来的人又称他们为义，所称为义的人又叫他们得荣耀。"],[31,"既是这样，还有什么说的呢？神若帮助我们，谁能敌挡我们呢？"],[32,"神既不爱惜自己的儿子为我们众人舍了，岂不也把万物和他一同白白地赐给我们吗？"],[33,"谁能控告神所拣选的人呢？有神称他们为义了。（或作“是称他们为义的神吗？”）"],[34,"谁能定他们的罪呢？有基督耶稣已经死了，而且从死里复活，现今在神的右边，也替我们祈求。（“有基督云云”，或作“是已经死了，而且从死里复活，现今在神的右边，也替我们祈求的基督耶稣吗？”）"],[35,"谁能使我们与基督的爱隔绝呢？难道是患难吗？是困苦吗？是逼迫吗？是饥饿吗？是赤身露体吗？是危险吗？是刀剑吗？"],[36,"如经上所记：“我们为你的缘故终日被杀，人看我们如将宰的羊。”"],[37,"然而，靠着爱我们的主，在这一切的事上已经得胜有余了。"],[38,"因为我深信无论是死，是生，是天使，是掌权的，是有能的，是现在的事，是将来的事，"],[39,"是高处的，是低处的，是别的受造之物，都不能叫我们与神的爱隔绝；这爱是在我们的主基督耶稣里的。"]]},{"n":9,"v":[[1,"我在基督里说真话，并不谎言，有我良心被圣灵感动，给我作见证。"],[2,"我是大有忧愁，心里时常伤痛；"],[3,"为我弟兄、我骨肉之亲，就是自己被咒诅，与基督分离，我也愿意。"],[4,"他们是以色列人，那儿子的名分、荣耀、诸约、律法、礼仪、应许都是他们的。"],[5,"列祖就是他们的祖宗，按肉体说，基督也是从他们出来的，他是在万有之上，永远可称颂的神。阿们！"],[6,"这不是说神的话落了空，因为从以色列生的，不都是以色列人；"],[7,"也不因为是亚伯拉罕的后裔，就都作他的儿女；惟独“从以撒生的，才要称为你的后裔。”"],[8,"这就是说，肉身所生的儿女不是神的儿女；惟独那应许的儿女才算是后裔。"],[9,"因为所应许的话是这样说：“到明年这时候我要来，撒拉必生一个儿子。”"],[10,"不但如此，还有利百加，既从一个人，就是从我们的祖宗以撒怀了孕，"],[11,"（双子还没有生下来，善恶还没有作出来，只因要显明神拣选人的旨意，不在乎人的行为，乃在乎召人的主。）"],[12,"神就对利百加说：“将来大的要服侍小的。”"],[13,"正如经上所记：“雅各是我所爱的，以扫是我所恶的。”"],[14,"这样，我们可说什么呢？难道神有什么不公平吗？断乎没有！"],[15,"因他对摩西说：“我要怜悯谁，就怜悯谁；要恩待谁，就恩待谁。”"],[16,"据此看来，这不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。"],[17,"因为经上有话向法老说：“我将你兴起来，特要在你身上彰显我的权能，并要使我的名传遍天下。”"],[18,"如此看来，神要怜悯谁，就怜悯谁；要叫谁刚硬，就叫谁刚硬。"],[19,"这样，你必对我说：“他为什么还指责人呢？有谁抗拒他的旨意呢？”"],[20,"你这个人哪，你是谁，竟敢向神强嘴呢？受造之物岂能对造他的说：“你为什么这样造我呢？”"],[21,"窑匠难道没有权柄从一团泥里拿一块作成贵重的器皿，又拿一块作成卑贱的器皿吗？"],[22,"倘若神要显明他的忿怒，彰显他的权能，就多多忍耐宽容那可怒、预备遭毁灭的器皿；"],[23,"又要将他丰盛的荣耀彰显在那蒙怜悯、早预备得荣耀的器皿上。"],[24,"这器皿就是我们被神所召的，不但是从犹太人中，也是从外邦人中。这有什么不可呢？"],[25,"就像神在何西阿书上说：“那本来不是我子民的，我要称为我的子民；本来不是蒙爱的，我要称为蒙爱的。"],[26,"从前在什么地方对他们说，你们不是我的子民，将来就在那里称他们为永生神的儿子。”"],[27,"以赛亚指着以色列人喊着说：“以色列人虽多如海沙，得救的不过是剩下的余数。"],[28,"因为主要在世上施行他的话，叫他的话都成全，速速地完结。”"],[29,"又如以赛亚先前说过：“若不是万军之主给我们存留余种，我们早已像所多玛、蛾摩拉的样子了。”"],[30,"这样，我们可说什么呢？那本来不追求义的外邦人反得了义，就是因信而得的义；"],[31,"但以色列人追求律法的义，反得不着律法的义。"],[32,"这是什么缘故呢？是因为他们不凭着信心求，只凭着行为求，他们正跌在那绊脚石上。"],[33,"就如经上所记：“我在锡安放一块绊脚的石头，跌人的磐石，信靠他的人必不至于羞愧。”"]]},{"n":10,"v":[[1,"弟兄们，我心里所愿的，向神所求的，是要以色列人得救。"],[2,"我可以证明他们向神有热心，但不是按着真知识。"],[3,"因为不知道神的义，想要立自己的义，就不服神的义了。"],[4,"律法的总结就是基督，使凡信他的都得着义。"],[5,"摩西写着说：“人若行那出于律法的义，就必因此活着。”"],[6,"惟有出于信心的义如此说：“你不要心里说，谁要升到天上去呢？（就是要领下基督来。）"],[7,"谁要下到阴间去呢？（就是要领基督从死里上来。）”"],[8,"他到底怎么说呢？他说：“这道离你不远，正在你口里，在你心里。”就是我们所传信主的道。"],[9,"你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。"],[10,"因为人心里相信，就可以称义；口里承认，就可以得救。"],[11,"经上说：“凡信他的人，必不至于羞愧。”"],[12,"犹太人和希腊人并没有分别；因为众人同有一位主，他也厚待一切求告他的人。"],[13,"因为“凡求告主名的，就必得救。”"],[14,"然而人未曾信他，怎能求他呢？未曾听见他，怎能信他呢？没有传道的，怎能听见呢？"],[15,"若没有奉差遣，怎能传道呢？如经上所记：“报福音传喜信的人，他们的脚踪何等佳美！”"],[16,"只是人没有都听从福音。因为以赛亚说：“主啊，我们所传的有谁信呢？”"],[17,"可见信道是从听道来的，听道是从基督的话来的。"],[18,"但我说，人没有听见吗？诚然听见了。“他们的声音传遍天下，他们的言语传到地极。”"],[19,"我再说，以色列人不知道吗？先有摩西说：“我要用那不成子民的，惹动你们的愤恨；我要用那无知的民，触动你们的怒气。”"],[20,"又有以赛亚放胆说：“没有寻找我的，我叫他们遇见；没有访问我的，我向他们显现。”"],[21,"至于以色列人，他说：“我整天伸手招呼那悖逆、顶嘴的百姓。”"]]},{"n":11,"v":[[1,"我且说，神弃绝了他的百姓吗？断乎没有！因为我也是以色列人，亚伯拉罕的后裔，属便雅悯支派的。"],[2,"神并没有弃绝他预先所知道的百姓。你们岂不晓得经上论到以利亚是怎么说的呢？他在神面前怎样控告以色列人说："],[3,"“主啊，他们杀了你的先知，拆了你的祭坛，只剩下我一个人，他们还要寻索我的命。”"],[4,"神的回话是怎么说的呢？他说：“我为自己留下七千人，是未曾向巴力屈膝的。”"],[5,"如今也是这样，照着拣选的恩典，还有所留的余数。"],[6,"既是出于恩典，就不在乎行为；不然，恩典就不是恩典了。"],[7,"这是怎么样呢？以色列人所求的，他们没有得着，惟有蒙拣选的人得着了，其余的就成了顽梗不化的。"],[8,"如经上所记：“神给他们昏迷的心，眼睛不能看见，耳朵不能听见，直到今日。”"],[9,"大卫也说：“愿他们的筵席变为网罗，变为机槛，变为绊脚石，作他们的报应；"],[10,"愿他们的眼睛昏蒙，不得看见；愿你时常弯下他们的腰。”"],[11,"我且说，他们失脚是要他们跌倒吗？断乎不是！反倒因他们的过失，救恩便临到外邦人，要激动他们发愤。"],[12,"若他们的过失，为天下的富足，他们的缺乏，为外邦人的富足，何况他们的丰满呢？。"],[13,"我对你们外邦人说这话，因我是外邦人的使徒，所以敬重我的职分（“敬重”原文作“荣耀”）。"],[14,"或者可以激动我骨肉之亲发愤，好救他们一些人。"],[15,"若他们被丢弃，天下就得与神和好；他们被收纳，岂不是死而复生吗？"],[16,"所献的新面若是圣洁，全团也就圣洁了；树根若是圣洁，树枝也就圣洁了。"],[17,"若有几根枝子被折下来，你这野橄榄得接在其中，一同得着橄榄根的肥汁，"],[18,"你就不可向旧枝子夸口；若是夸口，当知道不是你托着根，乃是根托着你。"],[19,"你若说，那枝子被折下来是特为叫我接上。"],[20,"不错，他们因为不信，所以被折下来；你因为信，所以立得住。你不可自高，反要惧怕。"],[21,"神既不爱惜原来的枝子，也必不爱惜你。"],[22,"可见神的恩慈和严厉，向那跌倒的人是严厉的，向你是有恩慈的。只要你长久在他的恩慈里，不然，你也要被砍下来。"],[23,"而且他们若不是长久不信，仍要被接上，因为神能够把他们从新接上。"],[24,"你是从那天生的野橄榄上砍下来的，尚且逆着性得接在好橄榄上，何况这本树的枝子要接在本树上呢！"],[25,"弟兄们，我不愿意你们不知道这奥秘（恐怕你们自以为聪明），就是以色列人有几分是硬心的，等到外邦人的数目添满了，"],[26,"于是以色列全家都要得救。如经上所记：“必有一位救主从锡安出来，要消除雅各家的一切罪恶。”"],[27,"又说：“我除去他们罪的时候，这就是我与他们所立的约。”"],[28,"就着福音说，他们为你们的缘故是仇敌；就着拣选说，他们为列祖的缘故是蒙爱的。"],[29,"因为神的恩赐和选召是没有后悔的。"],[30,"你们从前不顺服神，如今因他们的不顺服，你们倒蒙了怜恤；"],[31,"这样，他们也是不顺服，叫他们因着施给你们的怜恤，现在也就蒙怜恤。"],[32,"因为神将众人都圈在不顺服之中，特意要怜恤众人。"],[33,"深哉！神丰富的智慧和知识。他的判断何其难测！他的踪迹何其难寻！"],[34,"谁知道主的心？谁作过他的谋士呢？"],[35,"谁是先给了他，使他后来偿还呢？"],[36,"因为万有都是本于他，倚靠他，归于他。愿荣耀归给他，直到永远。阿们！"]]},{"n":12,"v":[[1,"所以弟兄们，我以神的慈悲劝你们，将身体献上，当作活祭，是圣洁的，是神所喜悦的，你们如此侍奉，乃是理所当然的。"],[2,"不要效法这个世界，只要心意更新而变化，叫你们察验何为神的善良、纯全、可喜悦的旨意。"],[3,"我凭着所赐我的恩，对你们各人说：不要看自己过于所当看的，要照着神所分给各人信心的大小，看得合乎中道。"],[4,"正如我们一个身子上有好些肢体，肢体也不都是一样的用处。"],[5,"我们这许多人，在基督里成为一身，互相联络作肢体，也是如此。"],[6,"按我们所得的恩赐，各有不同。或说预言，就当照着信心的程度说预言；"],[7,"或作执事，就当专一执事；或作教导的，就当专一教导；"],[8,"或作劝化的，就当专一劝化；施舍的，就当诚实；治理的，就当殷勤；怜悯人的，就当甘心。"],[9,"爱人不可虚假，恶要厌恶，善要亲近。"],[10,"爱弟兄，要彼此亲热；恭敬人，要彼此推让。"],[11,"殷勤不可懒惰。要心里火热，常常服侍主。"],[12,"在指望中要喜乐，在患难中要忍耐，祷告要恒切。"],[13,"圣徒缺乏要帮补，客要一味地款待。"],[14,"逼迫你们的，要给他们祝福，只要祝福，不可咒诅。"],[15,"与喜乐的人要同乐，与哀哭的人要同哭。"],[16,"要彼此同心，不要志气高大，倒要俯就卑微的人（“人”或作“事”）。不要自以为聪明。"],[17,"不要以恶报恶。众人以为美的事，要留心去作。"],[18,"若是能行，总要尽力与众人和睦。"],[19,"亲爱的弟兄，不要自己伸冤，宁可让步，听凭主怒（或作“让人发怒”）。因为经上记着：“主说，伸冤在我，我必报应。”"],[20,"所以，“你的仇敌若饿了，就给他吃；若渴了，就给他喝。因为你这样行，就是把炭火堆在他的头上。”"],[21,"你不可为恶所胜，反要以善胜恶。"]]},{"n":13,"v":[[1,"在上有权柄的，人人当顺服他；因为没有权柄不是出于神的，凡掌权的都是神所命的。"],[2,"所以抗拒掌权的，就是抗拒神的命；抗拒的必自取刑罚。"],[3,"作官的原不是叫行善的惧怕，乃是叫作恶的惧怕。你愿意不惧怕掌权的吗？你只要行善，就可得他的称赞，"],[4,"因为他是神的用人，是与你有益的。你若作恶，却当惧怕，因为他不是空空地佩剑。他是神的用人，是伸冤的，刑罚那作恶的。"],[5,"所以你们必须顺服，不但是因为刑罚，也是因为良心。"],[6,"你们纳粮也为这个缘故；因他们是神的差役，常常特管这事。"],[7,"凡人所当得的，就给他；当得粮的，给他纳粮；当得税的，给他上税；当惧怕的，惧怕他；当恭敬的，恭敬他。"],[8,"凡事都不可亏欠人，惟有彼此相爱，要常以为亏欠，因为爱人的就完全了律法。"],[9,"像那不可奸淫，不可杀人，不可偷盗，不可贪婪，或有别的诫命，都包在“爱人如己”这一句话之内了。"],[10,"爱是不加害与人的，所以爱就完全了律法。"],[11,"再者，你们晓得现今就是该趁早睡醒的时候，因为我们得救，现今比初信的时候更近了。"],[12,"黑夜已深，白昼将近；我们就当脱去暗昧的行为，带上光明的兵器。"],[13,"行事为人要端正，好像行在白昼；不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒。"],[14,"总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。"]]},{"n":14,"v":[[1,"信心软弱的，你们要接纳，但不要辩论所疑惑的事。"],[2,"有人信百物都可吃，但那软弱的，只吃蔬菜。"],[3,"吃的人不可轻看不吃的人，不吃的人不可论断吃的人；因为神已经收纳他了。"],[4,"你是谁，竟论断别人的仆人呢？他或站住，或跌倒，自有他的主人在；而且他也必要站住，因为主能使他站住。"],[5,"有人看这日比那日强，有人看日日都是一样，只是各人心里要意见坚定。"],[6,"守日的人是为主守的；吃的人是为主吃的，因他感谢神；不吃的人是为主不吃的，也感谢神。"],[7,"我们没有一个人为自己活，也没有一个人为自己死。"],[8,"我们若活着，是为主而活；若死了，是为主而死。所以我们或活或死，总是主的人。"],[9,"因此基督死了，又活了，为要作死人并活人的主。"],[10,"你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？因我们都要站在神的台前。"],[11,"经上写着：“主说，‘我凭着我的永生起誓，万膝必向我跪拜，万口必向我承认。’”"],[12,"这样看来，我们各人必要将自己的事在神面前说明。"],[13,"所以我们不可再彼此论断，宁可定意，谁也不给弟兄放下绊脚跌人之物。"],[14,"我凭着主耶稣确知深信，凡物本来没有不洁净的；惟独人以为不洁净的，在他就不洁净了。"],[15,"你若因食物叫弟兄忧愁，就不是按着爱人的道理行。基督已经替他死，你不可因你的食物叫他败坏。"],[16,"不可叫你的善被人毁谤，"],[17,"因为神的国不在乎吃喝，只在乎公义、和平并圣灵中的喜乐。"],[18,"在这几样上服侍基督的，就为神所喜悦，又为人所称许。"],[19,"所以，我们务要追求和睦的事与彼此建立德行的事。"],[20,"不可因食物毁坏神的工程。凡物固然洁净，但有人因食物叫人跌倒，就是他的罪了。"],[21,"无论是吃肉，是喝酒，是什么别的事，叫弟兄跌倒，一概不作才好。"],[22,"你有信心，就当在神面前守着。人在自己以为可行的事上能不自责，就有福了。"],[23,"若有疑心而吃的，就必有罪。因为他吃，不是出于信心；凡不出于信心的都是罪。"]]},{"n":15,"v":[[1,"我们坚固的人应该担代不坚固人的软弱，不求自己的喜悦。"],[2,"我们各人务要叫邻舍喜悦，使他得益处，建立德行。"],[3,"因为基督也不求自己的喜悦。如经上所记：“辱骂你人的辱骂都落在我身上。”"],[4,"从前所写的圣经都是为教训我们写的，叫我们因圣经所生的忍耐和安慰，可以得着盼望。"],[5,"但愿赐忍耐、安慰的神，叫你们彼此同心，效法基督耶稣，"],[6,"一心一口荣耀神、我们主耶稣基督的父。"],[7,"所以你们要彼此接纳，如同基督接纳你们一样，使荣耀归与神。"],[8,"我说，基督是为神真理作了受割礼人的执事，要证实所应许列祖的话。"],[9,"并叫外邦人因他的怜悯荣耀神。如经上所记：“因此我要在外邦中称赞你，歌颂你的名。”"],[10,"又说：“你们外邦人当与主的百姓一同欢乐。”"],[11,"又说：“外邦啊，你们当赞美主；万民哪，你们都当颂赞他。”"],[12,"又有以赛亚说：“将来有耶西的根，就是那兴起来要治理外邦的，外邦人要仰望他。”"],[13,"但愿使人有盼望的神，因信，将诸般的喜乐平安充满你们的心，使你们藉着圣灵的能力大有盼望。"],[14,"弟兄们，我自己也深信你们是满有良善，充足了诸般的知识，也能彼此劝戒。"],[15,"但我稍微放胆写信给你们，是要提醒你们的记性，特因神所给我的恩典，"],[16,"使我为外邦人作基督耶稣的仆役，作神福音的祭司，叫所献上的外邦人，因着圣灵，成为圣洁，可蒙悦纳。"],[17,"所以论到神的事，我在基督耶稣里有可夸的。"],[18,"除了基督藉我作的那些事，我什么都不敢提；只提他藉我言语作为，用神迹奇事的能力，并圣灵的能力，使外邦人顺服。"],[19,"甚至我从耶路撒冷，直转到以利哩古，到处传了基督的福音。"],[20,"我立了志向，不在基督的名被称过的地方传福音，免得建造在别人的根基上。"],[21,"就如经上所记：“未曾闻知他信息的，将要看见；未曾听过的，将要明白。”"],[22,"我因多次被拦阻，总不得到你们那里去。"],[23,"但如今在这里再没有可传的地方，而且这好几年我切心想望到西班牙去的时候，可以到你们那里，"],[24,"盼望从你们那里经过，得见你们，先与你们彼此交往，心里稍微满足，然后蒙你们送行。"],[25,"但现在，我往耶路撒冷去供给圣徒。"],[26,"因为马其顿和亚该亚人乐意凑出捐项，给耶路撒冷圣徒中的穷人。"],[27,"这固然是他们乐意的，其实也算是所欠的债。因外邦人既然在他们属灵的好处上有份，就当把养身之物供给他们。"],[28,"等我办完了这事，把这善果向他们交付明白，我就要路过你们那里，往西班牙去。"],[29,"我也晓得去的时候，必带着基督丰盛的恩典而去。"],[30,"弟兄们，我藉着我们主耶稣基督，又藉着圣灵的爱，劝你们与我一同竭力为我祈求神。"],[31,"叫我脱离在犹太不顺从的人；也叫我为耶路撒冷所办的捐项可蒙圣徒悦纳；"],[32,"并叫我顺着神的旨意，欢欢喜喜地到你们那里，与你们同得安息。"],[33,"愿赐平安的神常和你们众人同在。阿们！"]]},{"n":16,"v":[[1,"我对你们举荐我们的姐妹非比，她是坚革哩教会中的女执事。"],[2,"请你们为主接待她，合乎圣徒的体统。她在何事上要你们帮助，你们就帮助她，因她素来帮助许多人，也帮助了我。"],[3,"问百基拉和亚居拉安。他们在基督耶稣里与我同工，"],[4,"也为我的命将自己的颈项置之度外。不但我感谢他们，就是外邦的众教会也感谢他们。"],[5,"又问在他们家中的教会安。问我所亲爱的以拜尼土安，他在亚细亚是归基督初结的果子。"],[6,"又问马利亚安，她为你们多受劳苦。"],[7,"又问我亲属与我一同坐监的安多尼古和犹尼亚安，他们在使徒中是有名望的，也是比我先在基督里。"],[8,"又问我在主里面所亲爱的暗伯利安。"],[9,"又问在基督里与我们同工的耳巴奴并我所亲爱的士大古安。"],[10,"又问在基督里经过试验的亚比利安。问亚利多布家里的人安。"],[11,"又问我亲属希罗天安。问拿其数家在主里的人安。"],[12,"又问为主劳苦的土非拿氏和土富撒氏安。问可亲爱为主多受劳苦的彼息氏安。"],[13,"又问在主蒙拣选的鲁孚和他母亲安，他的母亲就是我的母亲。"],[14,"又问亚逊其土、弗勒干、黑米、八罗巴、黑马，并与他们在一处的弟兄们安。"],[15,"又问非罗罗古和犹利亚、尼利亚和他姐妹，同阿林巴，并与他们在一处的众圣徒安。"],[16,"你们亲嘴问安，彼此务要圣洁。基督的众教会都问你们安。"],[17,"弟兄们，那些离间你们，叫你们跌倒，背乎所学之道的人，我劝你们要留意躲避他们。"],[18,"因为这样的人不服侍我们的主基督，只服侍自己的肚腹，用花言巧语诱惑那些老实人的心。"],[19,"你们的顺服已经传于众人，所以我为你们欢喜，但我愿意你们在善上聪明，在恶上愚拙。"],[20,"赐平安的神，快要将撒但践踏在你们脚下。愿我主耶稣基督的恩常和你们同在！"],[21,"与我同工的提摩太和我的亲属路求、耶孙、所西巴德问你们安。"],[22,"我这代笔写信的德丢，在主里面问你们安。"],[23,"那接待我，也接待全教会的该犹问你们安。"],[24,"城内管银库的以拉都和兄弟括土问你们安。"],[25,"惟有神能照我所传的福音和所讲的耶稣基督，并照永古隐藏不言的奥秘，坚固你们的心。"],[26,"这奥秘如今显明出来，而且按着永生神的命，藉众先知的书指示万国的民，使他们信服真道。"],[27,"愿荣耀因耶稣基督归与独一全智的神，直到永远。阿们！"]]}]},{"name":"哥林多前书","chapters":[{"n":1,"v":[[1,"奉神旨意，蒙召作耶稣基督使徒的保罗同兄弟所提尼，"],[2,"写信给在哥林多神的教会，就是在基督耶稣里成圣，蒙召作圣徒的，以及所有在各处求告我主耶稣基督之名的人。基督是他们的主，也是我们的主。"],[3,"愿恩惠、平安从神我们的父并主耶稣基督归与你们！"],[4,"我常为你们感谢我的神，因神在基督耶稣里所赐给你们的恩惠，"],[5,"又因你们在他里面凡事富足，口才、知识都全备。"],[6,"正如我为基督作的见证在你们心里得以坚固，"],[7,"以致你们在恩赐上没有一样不及人的，等候我们的主耶稣基督显现。"],[8,"他也必坚固你们到底，叫你们在我们主耶稣基督的日子无可责备。"],[9,"神是信实的，你们原是被他所召，好与他儿子我们的主耶稣基督一同得份。"],[10,"弟兄们，我藉我们主耶稣基督的名，劝你们都说一样的话。你们中间也不可分党，只要一心一意，彼此相合。"],[11,"因为革来氏家里的人曾对我提起弟兄们来，说你们中间有纷争。"],[12,"我的意思就是你们各人说：“我是属保罗的”，“我是属亚波罗的”，“我是属矶法的”，“我是属基督的”。"],[13,"基督是分开的吗？保罗为你们钉了十字架吗？你们是奉保罗的名受了洗吗？"],[14,"我感谢神，除了基利司布并该犹以外，我没有给你们一个人施洗，"],[15,"免得有人说，你们是奉我的名受洗。"],[16,"我也给司提反家施过洗；此外给别人施洗没有，我却记不清。"],[17,"基督差遣我，原不是为施洗，乃是为传福音，并不用智慧的言语，免得基督的十字架落了空。"],[18,"因为十字架的道理，在那灭亡的人为愚拙，在我们得救的人却为神的大能。"],[19,"就如经上所记：“我要灭绝智慧人的智慧，废弃聪明人的聪明。”"],[20,"智慧人在哪里？文士在哪里？这世上的辩士在哪里？神岂不是叫这世上的智慧变成愚拙吗？"],[21,"世人凭自己的智慧，既不认识神，神就乐意用人所当作愚拙的道理拯救那些信的人，这就是神的智慧了。"],[22,"犹太人是要神迹，希腊人是求智慧；"],[23,"我们却是传钉十字架的基督。在犹太人为绊脚石，在外邦人为愚拙，"],[24,"但在那蒙召的，无论是犹太人、希腊人，基督总为神的能力，神的智慧。"],[25,"因神的愚拙总比人智慧，神的软弱总比人强壮。"],[26,"弟兄们哪，可见你们蒙召的，按着肉体有智慧的不多，有能力的不多，有尊贵的也不多。"],[27,"神却拣选了世上愚拙的，叫有智慧的羞愧；又拣选了世上软弱的，叫那强壮的羞愧。"],[28,"神也拣选了世上卑贱的，被人厌恶的，以及那无有的，为要废掉那有的，"],[29,"使一切有血气的，在神面前一个也不能自夸。"],[30,"但你们得在基督耶稣里是本乎神，神又使他成为我们的智慧、公义、圣洁、救赎。"],[31,"如经上所记：“夸口的，当指着主夸口。”"]]},{"n":2,"v":[[1,"弟兄们，从前我到你们那里去，并没有用高言大智对你们宣传神的奥秘。"],[2,"因为我曾定了主意，在你们中间不知道别的，只知道耶稣基督并他钉十字架。"],[3,"我在你们那里，又软弱，又惧怕，又甚战兢。"],[4,"我说的话，讲的道，不是用智慧委婉的言语，乃是用圣灵和大能的明证，"],[5,"叫你们的信不在乎人的智慧，只在乎神的大能。"],[6,"然而，在完全的人中，我们也讲智慧。但不是这世上的智慧，也不是这世上有权有位将要败亡之人的智慧。"],[7,"我们讲的，乃是从前所隐藏、神奥秘的智慧，就是神在万世以前预定使我们得荣耀的。"],[8,"这智慧，世上有权有位的人没有一个知道的；他们若知道，就不把荣耀的主钉在十字架上了。"],[9,"如经上所记：“神为爱他的人所预备的，是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的。”"],[10,"只有神藉着圣灵向我们显明了，因为圣灵参透万事，就是神深奥的事也参透了。"],[11,"除了在人里头的灵，谁知道人的事？像这样，除了神的灵，也没有人知道神的事。"],[12,"我们所领受的，并不是世上的灵，乃是从神来的灵，叫我们能知道神开恩赐给我们的事。"],[13,"并且我们讲说这些事，不是用人智慧所指教的言语，乃是用圣灵所指教的言语，将属灵的话解释属灵的事（或作“将属灵的事讲与属灵的人”）。"],[14,"然而，属血气的人不领会神圣灵的事，反倒以为愚拙，并且不能知道，因为这些事惟有属灵的人才能看透。"],[15,"属灵的人能看透万事，却没有一人能看透了他。"],[16,"谁曾知道主的心去教导他呢？但我们是有基督的心了。"]]},{"n":3,"v":[[1,"弟兄们，我从前对你们说话，不能把你们当作属灵的，只得把你们当作属肉体、在基督里为婴孩的。"],[2,"我是用奶喂你们，没有用饭喂你们。那时你们不能吃，就是如今还是不能。"],[3,"你们仍是属肉体的，因为在你们中间有嫉妒、纷争，这岂不是属乎肉体、照着世人的样子行吗？"],[4,"有说：“我是属保罗的。”有说：“我是属亚波罗的。”这岂不是你们和世人一样吗？"],[5,"亚波罗算什么？保罗算什么？无非是执事，照主所赐给他们各人的，引导你们相信。"],[6,"我栽种了，亚波罗浇灌了，惟有神叫他生长。"],[7,"可见栽种的算不得什么，浇灌的也算不得什么，只在那叫他生长的神。"],[8,"栽种的和浇灌的，都是一样。但将来各人要照自己的工夫得自己的赏赐。"],[9,"因为我们是与神同工的；你们是神所耕种的田地，所建造的房屋。"],[10,"我照神所给我的恩，好象一个聪明的工头，立好了根基，有别人在上面建造，只是各人要谨慎怎样在上面建造。"],[11,"因为那已经立好的根基就是耶稣基督，此外没有人能立别的根基。"],[12,"若有人用金、银、宝石、草木、禾秸在这根基上建造，"],[13,"各人的工程必然显露，因为那日子要将它表明出来，有火发现，这火要试验各人的工程怎样。"],[14,"人在那根基上所建造的工程若存得住，他就要得赏赐；"],[15,"人的工程若被烧了，他就要受亏损，自己却要得救。虽然得救，乃象从火里经过的一样。"],[16,"岂不知你们是神的殿，神的灵住在你们里头吗？"],[17,"若有人毁坏神的殿，神必要毁坏那人，因为神的殿是圣的，这殿就是你们。"],[18,"人不可自欺。你们中间若有人在这世界自以为有智慧，倒不如变作愚拙，好成为有智慧的。"],[19,"因这世界的智慧，在神看是愚拙。如经上记着说：“主叫有智慧的，中了自己的诡计。”"],[20,"又说：“主知道智慧人的意念是虚妄的。”"],[21,"所以无论谁，都不可拿人夸口，因为万有全是你们的。"],[22,"或保罗，或亚波罗，或矶法，或世界，或生，或死，或现今的事，或将来的事，全是你们的。"],[23,"并且你们是属基督的；基督又是属神的。"]]},{"n":4,"v":[[1,"人应当以我们为基督的执事，为神奥秘事的管家。"],[2,"所求于管家的，是要他有忠心。"],[3,"我被你们论断，或被别人论断，我都以为极小的事，连我自己也不论断自己。"],[4,"我虽不觉得自己有错，却也不能因此得以称义，但判断我的乃是主。"],[5,"所以，时候未到，什么都不要论断，只等主来，他要照出暗中的隐情，显明人心的意念。那时，各人要从神那里得着称赞。"],[6,"弟兄们，我为你们的缘故，拿这些事转比自己和亚波罗，叫你们效法我们不可过于圣经所记，免得你们自高自大，贵重这个，轻看那个。"],[7,"使你与人不同的是谁呢？你有什么不是领受的呢？若是领受的，为何自夸，彷佛不是领受的呢？"],[8,"你们已经饱足了，已经丰富了，不用我们，自己就作王了。我愿意你们果真作王，叫我们也得与你们一同作王。"],[9,"我想神把我们使徒明明列在末后，好像定死罪的囚犯；因为我们成了一台戏，给世人和天使观看。"],[10,"我们为基督的缘故算是愚拙的，你们在基督里倒是聪明的；我们软弱，你们倒强壮；你们有荣耀，我们倒被藐视。"],[11,"直到如今，我们还是又饥、又渴、又赤身露体、又挨打、又没有一定的住处，"],[12,"并且劳苦，亲手作工。被人咒骂，我们就祝福；被人逼迫，我们就忍受；"],[13,"被人毁谤，我们就善劝。直到如今，人还把我们看作世界上的污秽，万物中的渣滓。"],[14,"我写这话，不是叫你们羞愧，乃是警戒你们，好像我所亲爱的儿女一样。"],[15,"你们学基督的，师傅虽有一万，为父的却是不多，因我在基督耶稣里用福音生了你们。"],[16,"所以，我求你们效法我。"],[17,"因此我已打发提摩太到你们那里去；他在主里面，是我所亲爱、有忠心的儿子，他必提醒你们，记念我在基督里怎样行事，在各处各教会中怎样教导人。"],[18,"有些人自高自大，以为我不到你们那里去；"],[19,"然而主若许我，我必快到你们那里去；并且我所要知道的，不是那些自高自大之人的言语，乃是他们的权能。"],[20,"因为神的国不在乎言语，乃在乎权能。"],[21,"你们愿意怎么样呢？是愿意我带着刑杖到你们那里去呢？还是要我存慈爱温柔的心呢？"]]},{"n":5,"v":[[1,"风闻在你们中间有淫乱的事。这样的淫乱连外邦人中也没有，就是有人收了他的继母。"],[2,"你们还是自高自大，并不哀痛，把行这事的人从你们中间赶出去。"],[3,"我身子虽不在你们那里，心却在你们那里，好像我亲自与你们同在，已经判断了行这事的人。"],[4,"就是你们聚会的时候，我的心也同在。奉我们主耶稣的名，并用我们主耶稣的权能，"],[5,"要把这样的人交给撒但，败坏他的肉体，使他的灵魂在主耶稣的日子可以得救。"],[6,"你们这自夸是不好的。岂不知一点面酵能使全团发起来吗？"],[7,"你们既是无酵的面，应当把旧酵除净，好使你们成为新团；因为我们逾越节的羔羊基督，已经被杀献祭了。"],[8,"所以我们守这节不可用旧酵，也不可用恶毒（或作“阴毒”）、邪恶的酵，只用诚实真正的无酵饼。"],[9,"我先前写信给你们说：不可与淫乱的人相交。"],[10,"此话不是指这世上一概行淫乱的，或贪婪的、勒索的，或拜偶像的，若是这样，你们除非离开世界方可。"],[11,"但如今我写信给你们说：若有称为弟兄是行淫乱的、或贪婪的、或拜偶像的、或辱骂的、或醉酒的、或勒索的，这样的人不可与他相交，就是与他吃饭都不可。"],[12,"因为审判教外的人与我何干？教内的人岂不是你们审判的吗？"],[13,"至于外人，有神审判他们。你们应当把那恶人从你们中间赶出去。"]]},{"n":6,"v":[[1,"你们中间有彼此相争的事，怎敢在不义的人面前求审，不在圣徒面前求审呢？"],[2,"岂不知圣徒要审判世界吗？若世界为你们所审，难道你们不配审判这最小的事吗？"],[3,"岂不知我们要审判天使吗？何况今生的事呢！"],[4,"既是这样，你们若有今生的事当审判，是派教会所轻看的人审判吗？"],[5,"我说这话是要叫你们羞耻。难道你们中间没有一个智慧人能审断弟兄们的事吗？"],[6,"你们竟是弟兄与弟兄告状，而且告在不信主的人面前。"],[7,"你们彼此告状，这已经是你们的大错了。为什么不情愿受欺呢？为什么不情愿吃亏呢？"],[8,"你们倒是欺压人、亏负人，况且所欺压、所亏负的就是弟兄。"],[9,"你们岂不知不义的人不能承受神的国吗？不要自欺。无论是淫乱的、拜偶像的、奸淫的、作娈童的、亲男色的、"],[10,"偷窃的、贪婪的、醉酒的、辱骂的、勒索的，都不能承受神的国。"],[11,"你们中间也有人从前是这样；但如今你们奉主耶稣基督的名，并藉着我们神的灵，已经洗净、成圣、称义了。"],[12,"凡事我都可行，但不都有益处；凡事我都可行，但无论哪一件，我总不受它的辖制。"],[13,"食物是为肚腹，肚腹是为食物；但神要叫这两样都废坏。身子不是为淫乱，乃是为主；主也是为身子。"],[14,"并且神已经叫主复活，也要用自己的能力叫我们复活。"],[15,"岂不知你们的身子是基督的肢体吗？我可以将基督的肢体作为娼妓的肢体吗？断乎不可！"],[16,"岂不知与娼妓联合的，便是与她成为一体吗？因为主说：“二人要成为一体。”"],[17,"但与主联合的，便是与主成为一灵。"],[18,"你们要逃避淫行。人所犯的，无论什么罪，都在身子以外；惟有行淫的，是得罪自己的身子。"],[19,"岂不知你们的身子就是圣灵的殿吗？这圣灵是从神而来，住在你们里头的；并且你们不是自己的人，"],[20,"因为你们是重价买来的，所以要在你们的身子上荣耀神。"]]},{"n":7,"v":[[1,"论到你们信上所提的事，我说男不近女倒好。"],[2,"但要免淫乱的事，男子当各有自己的妻子，女子也当各有自己的丈夫。"],[3,"丈夫当用合宜之份待妻子，妻子待丈夫也要如此。"],[4,"妻子没有权柄主张自己的身子，乃在丈夫；丈夫也没有权柄主张自己的身子，乃在妻子。"],[5,"夫妻不可彼此亏负，除非两相情愿，暂时分房，为要专心祷告方可；以后仍要同房，免得撒但趁着你们情不自禁引诱你们。"],[6,"我说这话，原是准你们的，不是命你们的。"],[7,"我愿意众人像我一样；只是各人领受神的恩赐，一个是这样，一个是那样。"],[8,"我对着没有嫁娶的和寡妇说，若他们常像我就好。"],[9,"倘若自己禁止不住，就可以嫁娶。与其欲火攻心，倒不如嫁娶为妙。"],[10,"至于那已经嫁娶的，我吩咐他们，其实不是我吩咐，乃是主吩咐说：“妻子不可离开丈夫，"],[11,"若是离开了，不可再嫁，或是仍同丈夫和好。丈夫也不可离弃妻子。”"],[12,"我对其余的人说，不是主说，倘若某弟兄有不信的妻子，妻子也情愿和他同住，他就不要离弃妻子；"],[13,"妻子有不信的丈夫，丈夫也情愿和她同住，她就不要离弃丈夫。"],[14,"因为，不信的丈夫就因着妻子成了圣洁，并且不信的妻子就因着丈夫成了圣洁（“丈夫”原文作“弟兄”）。不然，你们的儿女就不洁净，但如今他们是圣洁的了。"],[15,"倘若那不信的人要离去，就由他离去吧！无论是弟兄，是姐妹，遇着这样的事都不必拘束。神召我们原是要我们和睦。"],[16,"你这作妻子的，怎么知道不能救你的丈夫呢？你这作丈夫的，怎么知道不能救你的妻子呢？"],[17,"只要照主所分给各人的，和神所召各人的而行。我吩咐各教会都是这样。"],[18,"有人已受割礼蒙召呢，就不要废割礼；有人未受割礼蒙召呢，就不要受割礼。"],[19,"受割礼算不得什么，不受割礼也算不得什么，只要守神的诫命就是了。"],[20,"各人蒙召的时候是什么身份，仍要守住这身份。"],[21,"你是作奴隶蒙召的吗？不要因此忧虑。若能以自由，就求自由更好。"],[22,"因为作奴仆蒙召于主的，就是主所释放的人；作自由之人蒙召的，就是基督的奴仆。"],[23,"你们是重价买来的，不要作人的奴仆。"],[24,"弟兄们，你们各人蒙召的时候是什么身份，仍要在神面前守住这身份。"],[25,"论到童身的人，我没有主的命令，但我既蒙主怜恤能作忠心的人，就把自己的意见告诉你们。"],[26,"因现今的艰难，据我看来，人不如守素安常才好。"],[27,"你有妻子缠着呢，就不要求脱离；你没有妻子缠着呢，就不要求妻子。"],[28,"你若娶妻，并不是犯罪；处女若出嫁，也不是犯罪。然而这等人肉身必受苦难，我却愿意你们免这苦难。"],[29,"弟兄们，我对你们说，时候减少了。从此以后，那有妻子的，要像没有妻子；"],[30,"哀哭的，要像不哀哭；快乐的，要像不快乐；置买的，要像无有所得；"],[31,"用世物的，要像不用世物；因为这世界的样子将要过去了。"],[32,"我愿你们无所挂虑。没有娶妻的，是为主的事挂虑，想怎样叫主喜悦；"],[33,"娶了妻的，是为世上的事挂虑，想怎样叫妻子喜悦。"],[34,"妇人和处女也有分别。没有出嫁的，是为主的事挂虑，要身体、灵魂都圣洁；已经出嫁的，是为世上的事挂虑，想怎样叫丈夫喜悦。"],[35,"我说这话是为你们的益处，不是要牢笼你们，乃是要叫你们行合宜的事，得以殷勤服侍主，没有分心的事。"],[36,"若有人以为自己待他的女儿不合宜，女儿也过了年岁，事又当行，他就可随意办理，不算有罪，叫二人成亲就是了。"],[37,"倘若人心里坚定，没有不得已的事，并且由得自己作主，心里又决定了留下女儿不出嫁，如此行也好。"],[38,"这样看来，叫自己的女儿出嫁是好，不叫她出嫁更是好。"],[39,"丈夫活着的时候，妻子是被约束的；丈夫若死了，妻子就可以自由，随意再嫁，只是要嫁这在主里面的人。"],[40,"然而按我的意见，若常守节更有福气。我也想自己是被神的灵感动了。"]]},{"n":8,"v":[[1,"论到祭偶像之物，我们晓得我们都有知识；但知识是叫人自高自大，惟有爱心能造就人。"],[2,"若有人以为自己知道什么，按他所当知道的，他仍是不知道。"],[3,"若有人爱神，这人乃是神所知道的。"],[4,"论到吃祭偶像之物，我们知道偶像在世上算不得什么；也知道神只有一位，再没有别的神。"],[5,"虽有称为神的，或在天、或在地，就如那许多的神，许多的主。"],[6,"然而我们只有一位神，就是父，万物都本于他，我们也归于他；并有一位主，就是耶稣基督，万物都是藉着他有的，我们也是藉着他有的。"],[7,"但人不都有这等知识。有人到如今因拜惯了偶像，就以为所吃的是祭偶像之物，他们的良心既然软弱，也就污秽了。"],[8,"其实食物不能叫神看中我们，因为我们不吃也无损，吃也无益。"],[9,"只是你们要谨慎，恐怕你们这自由竟成了那软弱人的绊脚石。"],[10,"若有人见你这有知识的在偶像的庙里坐席，这人的良心若是软弱，岂不放胆去吃那祭偶像之物吗？"],[11,"因此，基督为他死的那软弱弟兄，也就因你的知识沉沦了。"],[12,"你们这样得罪弟兄们，伤了他们软弱的良心，就是得罪基督。"],[13,"所以，食物若叫我弟兄跌倒，我就永远不吃肉，免得叫我弟兄跌倒了。"]]},{"n":9,"v":[[1,"我不是自由的吗？我不是使徒吗？我不是见过我们的主耶稣吗？你们不是我在主里面所作之工吗？"],[2,"假若在别人，我不是使徒；在你们，我总是使徒。因为你们在主里正是我作使徒的印证。"],[3,"我对那盘问我的人就是这样分诉。"],[4,"难道我们没有权柄靠福音吃喝吗？"],[5,"难道我们没有权柄娶信主的姐妹为妻，带着一同往来，彷佛其余的使徒和主的弟兄，并矶法一样吗？"],[6,"独有我与巴拿巴没有权柄不作工吗？"],[7,"有谁当兵自备粮饷呢？有谁栽葡萄园不吃园里的果子呢？有谁牧养牛羊不吃牛羊的奶呢？"],[8,"我说这话，岂是照人的意见？律法不也是这样说吗？"],[9,"就如摩西的律法记着说：“牛在场上踹谷的时候，不可笼住它的嘴。”难道神所挂念的是牛吗？"],[10,"不全是为我们说的吗？分明是为我们说的。因为耕种的当存着指望去耕种，打场的也当存得粮的指望去打场。"],[11,"我们若把属灵的种子撒在你们中间，就是从你们收割奉养肉身之物，这还算大事吗？"],[12,"若别人在你们身上有这权柄，何况我们呢？然而，我们没有用过这权柄，倒凡事忍受，免得基督的福音被阻隔。"],[13,"你们岂不知为圣事劳碌的，就吃殿中的物吗？伺候祭坛的，就分领坛上的物吗？"],[14,"主也是这样命定，叫传福音的靠着福音养生。"],[15,"但这权柄我全没有用过。我写这话，并非要你们这样待我，因为我宁可死也不叫人使我所夸的落了空。"],[16,"我传福音原没有可夸的，因为我是不得已的；若不传福音，我便有祸了。"],[17,"我若甘心作这事，就有赏赐；若不甘心，责任却已经托付我了。"],[18,"既是这样，我的赏赐是什么呢？就是我传福音的时候，叫人不花钱得福音，免得用尽我传福音的权柄。"],[19,"我虽是自由的，无人辖管，然而我甘心作了众人的仆人，为要多得人。"],[20,"向犹太人，我就作犹太人，为要得犹太人；向律法以下的人，我虽不在律法以下，还是作律法以下的人，为要得律法以下的人；"],[21,"向没有律法的人，我就作没有律法的人，为要得没有律法的人。其实我在神面前，不是没有律法；在基督面前，正在律法之下。"],[22,"向软弱的人，我就作软弱的人，为要得软弱的人；向什么样的人，我就作什么样的人。无论如何总要救些人。"],[23,"凡我所行的，都是为福音的缘故，为要与人同得这福音的好处。"],[24,"岂不知在场上赛跑的都跑，但得奖赏的只有一人？你们也当这样跑，好叫你们得着奖赏。"],[25,"凡较力争胜的，诸事都有节制，他们不过是要得能坏的冠冕；我们却是要得不能坏的冠冕。"],[26,"所以，我奔跑，不像无定向的；我斗拳，不像打空气的。"],[27,"我是攻克己身，叫身服我，恐怕我传福音给别人，自己反被弃绝了。"]]},{"n":10,"v":[[1,"弟兄们，我不愿意你们不晓得，我们的祖宗从前都在云下，都从海中经过，"],[2,"都在云里、海里受洗归了摩西，"],[3,"并且都吃了一样的灵食，"],[4,"也都喝了一样的灵水；所喝的，是出于随着他们的灵磐石，那磐石就是基督。"],[5,"但他们中间，多半是神不喜欢的人，所以在旷野倒毙。"],[6,"这些事都是我们的鉴戒，叫我们不要贪恋恶事，像他们那样贪恋的；"],[7,"也不要拜偶像，像他们有人拜的。如经上所记：“百姓坐下吃喝，起来玩耍。”"],[8,"我们也不要行奸淫，像他们有人行的，一天就倒毙了二万三千人；"],[9,"也不要试探主（“主”有古卷作“基督”），像他们有人试探的，就被蛇所灭；"],[10,"你们也不要发怨言，像他们有发怨言的，就被灭命的所灭。"],[11,"他们遭遇这些事都要作为鉴戒，并且写在经上，正是警戒我们这末世的人。"],[12,"所以，自己以为站得稳的，须要谨慎，免得跌倒。"],[13,"你们所遇见的试探，无非是人所能受的。神是信实的，必不叫你们受试探过于所能受的。在受试探的时候，总要给你们开一条出路，叫你们能忍受得住。"],[14,"我所亲爱的弟兄啊，你们要逃避拜偶像的事。"],[15,"我好像对明白人说的，你们要审察我的话。"],[16,"我们所祝福的杯，岂不是同领基督的血吗？我们所擘开的饼，岂不是同领基督的身体吗？"],[17,"我们虽多，仍是一个饼、一个身体，因为我们都是分受这一个饼。"],[18,"你们看属肉体的以色列人，那吃祭物的岂不是在祭坛上有份吗？"],[19,"我是怎么说呢？岂是说祭偶像之物算得什么呢？或说偶像算得什么呢？"],[20,"我乃是说：外邦人所献的祭是祭鬼，不是祭神，我不愿意你们与鬼相交。"],[21,"你们不能喝主的杯，又喝鬼的杯；不能吃主的筵席，又吃鬼的筵席。"],[22,"我们可惹主的愤恨吗？我们比他还有能力吗？"],[23,"凡事都可行，但不都有益处；凡事都可行，但不都造就人。"],[24,"无论何人，不要求自己的益处，乃要求别人的益处。"],[25,"凡市上所卖的，你们只管吃，不要为良心的缘故问什么话，"],[26,"因为地和其中所充满的都属乎主。"],[27,"倘有一个不信的人请你们赴席，你们若愿意去，凡摆在你们面前的，只管吃，不要为良心的缘故问什么话。"],[28,"若有人对你们说“这是献过祭的物”，就要为那告诉你们的人，并为良心的缘故不吃。"],[29,"我说的良心不是你的，乃是他的。我这自由为什么被别人的良心论断呢？"],[30,"我若谢恩而吃，为什么因我谢恩的物被人毁谤呢？"],[31,"所以，你们或吃或喝，无论作什么，都要为荣耀神而行。"],[32,"不拘是犹太人，是希腊人，是神的教会，你们都不要使他跌倒；"],[33,"就好像我凡事都叫众人喜欢，不求自己的益处，只求众人的益处，叫他们得救。"]]},{"n":11,"v":[[1,"你们该效法我，像我效法基督一样。"],[2,"我称赞你们，因你们凡事记念我，又坚守我所传给你们的。"],[3,"我愿意你们知道，基督是各人的头，男人是女人的头，神是基督的头。"],[4,"凡男人祷告或是讲道（“讲道”或作“说预言”。下同），若蒙着头，就羞辱自己的头；"],[5,"凡女人祷告或是讲道，若不蒙着头，就羞辱自己的头，因为这就如同剃了头发一样。"],[6,"女人若不蒙着头，就该剪了头发；女人若以剪发、剃发为羞愧，就该蒙着头。"],[7,"男人本不该蒙着头，因为他是神的形像和荣耀，但女人是男人的荣耀。"],[8,"起初，男人不是由女人而出，女人乃是由男人而出。"],[9,"并且男人不是为女人造的，女人乃是为男人造的。"],[10,"因此，女人为天使的缘故，应当在头上有服权柄的记号。"],[11,"然而照主的安排，女也不是无男，男也不是无女。"],[12,"因为女人原是由男人而出，男人也是由女人而出，但万有都是出乎神。"],[13,"你们自己审察，女人祷告神不蒙着头，是合宜的吗？"],[14,"你们的本性不也指示你们，男人若有长头发，便是他的羞辱吗？"],[15,"但女人有长头发，乃是她的荣耀，因为这头发是给她作盖头的。"],[16,"若有人想要辩驳，我们却没有这样的规矩，神的众教会也是没有的。"],[17,"我现今吩咐你们的话，不是称赞你们，因为你们聚会不是受益，乃是招损。"],[18,"第一，我听说，你们聚会的时候彼此分门别类，我也稍微地信这话。"],[19,"在你们中间不免有分门结党的事，好叫那些有经验的人显明出来。"],[20,"你们聚会的时候，算不得吃主的晚餐；"],[21,"因为吃的时候，各人先吃自己的饭，甚至这个饥饿，那个酒醉。"],[22,"你们要吃喝，难道没有家吗？还是藐视神的教会，叫那没有的羞愧呢？我向你们可怎么说呢？可因此称赞你们吗？我不称赞。"],[23,"我当日传给你们的，原是从主领受的，就是主耶稣被卖的那一夜，拿起饼来，"],[24,"祝谢了，就擘开，说：“这是我的身体，为你们舍的（“舍”有古卷作“擘开”）。你们应当如此行，为的是记念我。”"],[25,"饭后，也照样拿起杯来，说：“这杯是用我的血所立的新约。你们每逢喝的时候，要如此行，为的是记念我。”"],[26,"你们每逢吃这饼，喝这杯，是表明主的死，直等到他来。"],[27,"所以，无论何人不按理吃主的饼、喝主的杯，就是干犯主的身、主的血了。"],[28,"人应当自己省察，然后吃这饼、喝这杯。"],[29,"因为人吃喝，若不分辨是主的身体，就是吃喝自己的罪了。"],[30,"因此，在你们中间有好些软弱的与患病的，死的也不少（“死”原文作“睡”）。"],[31,"我们若是先分辨自己，就不至于受审。"],[32,"我们受审的时候，乃是被主惩治，免得我们和世人一同定罪。"],[33,"所以我弟兄们，你们聚会吃的时候，要彼此等待。"],[34,"若有人饥饿，可以在家里先吃，免得你们聚会，自己取罪。其余的事，我来的时候再安排。"]]},{"n":12,"v":[[1,"弟兄们，论到属灵的恩赐，我不愿意你们不明白。"],[2,"你们作外邦人的时候，随事被牵引、受迷惑，去服侍那哑巴偶像，这是你们知道的。"],[3,"所以我告诉你们：被神的灵感动的，没有说耶稣是可咒诅的；若不是被圣灵感动的，也没有能说耶稣是主的。"],[4,"恩赐原有分别，圣灵却是一位；"],[5,"职事也有分别，主却是一位；"],[6,"功用也有分别，神却是一位，在众人里面运行一切的事。"],[7,"圣灵显在各人身上，是叫人得益处。"],[8,"这人蒙圣灵赐他智慧的言语，那人也蒙这位圣灵赐他知识的言语，"],[9,"又有一人蒙这位圣灵赐他信心，还有一人蒙这位圣灵赐他医病的恩赐。"],[10,"又叫一人能行异能，又叫一人能作先知，又叫一人能辨别诸灵，又叫一人能说方言，又叫一人能翻方言。"],[11,"这一切都是这位圣灵所运行，随己意分给各人的。"],[12,"就如身子是一个，却有许多肢体；而且肢体虽多，仍是一个身子。基督也是这样。"],[13,"我们不拘是犹太人，是希腊人，是为奴的，是自主的，都从一位圣灵受洗，成了一个身体，饮于一位圣灵。"],[14,"身子原不是一个肢体，乃是许多肢体。"],[15,"设若脚说：“我不是手，所以不属乎身子”，它不能因此就不属乎身子；"],[16,"设若耳说：“我不是眼，所以不属乎身子”，它也不能因此就不属乎身子。"],[17,"若全身是眼，从哪里听声呢？若全身是耳，从哪里闻味呢？"],[18,"但如今神随自己的意思把肢体俱各安排在身上了。"],[19,"若都是一个肢体，身子在哪里呢？"],[20,"但如今肢体是多的，身子却是一个。"],[21,"眼不能对手说：“我用不着你”；头也不能对脚说：“我用不着你。”"],[22,"不但如此，身上肢体，人以为软弱的，更是不可少的。"],[23,"身上肢体，我们看为不体面的，越发给它加上体面；不俊美的，越发得着俊美。"],[24,"我们俊美的肢体，自然用不着装饰；但神配搭这身子，把加倍的体面给那有缺欠的肢体，"],[25,"免得身上分门别类，总要肢体彼此相顾。"],[26,"若一个肢体受苦，所有的肢体就一同受苦；若一个肢体得荣耀，所有的肢体就一同快乐。"],[27,"你们就是基督的身子，并且各自作肢体。"],[28,"神在教会所设立的：第一是使徒，第二是先知，第三是教师，其次是行异能的，再次是得恩赐医病的、帮助人的、治理事的、说方言的。"],[29,"岂都是使徒吗？岂都是先知吗？岂都是教师吗？岂都是行异能的吗？"],[30,"岂都是得恩赐医病的吗？岂都是说方言的吗？岂都是翻方言的吗？"],[31,"你们要切切地求那更大的恩赐。"]]},{"n":13,"v":[[1,"我现今把最妙的道指示你们。我若能说万人的方言，并天使的话语，却没有爱，我就成了鸣的锣、响的钹一般。"],[2,"我若有先知讲道之能，也明白各样的奥秘、各样的知识，而且有全备的信，叫我能够移山，却没有爱，我就算不得什么。"],[3,"我若将所有的周济穷人，又舍己身叫人焚烧，却没有爱，仍然与我无益。"],[4,"爱是恒久忍耐，又有恩慈；爱是不嫉妒，爱是不自夸，不张狂，"],[5,"不作害羞的事，不求自己的益处，不轻易发怒，不计算人的恶，"],[6,"不喜欢不义，只喜欢真理；"],[7,"凡事包容，凡事相信，凡事盼望，凡事忍耐。"],[8,"爱是永不止息。先知讲道之能终必归于无有，说方言之能终必停止，知识也终必归于无有。"],[9,"我们现在所知道的有限，先知所讲的也有限，"],[10,"等那完全的来到，这有限的必归于无有了。"],[11,"我作孩子的时候，话语像孩子，心思像孩子，意念像孩子；既成了人，就把孩子的事丢弃了。"],[12,"我们如今彷佛对着镜子观看，模糊不清（“模糊不清”原文作“如同猜谜”），到那时，就要面对面了。我如今所知道的有限，到那时就全知道，如同主知道我一样。"],[13,"如今常存的有信，有望，有爱；这三样，其中最大的是爱。"]]},{"n":14,"v":[[1,"你们要追求爱，也要切慕属灵的恩赐，其中更要羡慕的，是作先知讲道（原文作“是说预言”。下同）。"],[2,"那说方言的，原不是对人说，乃是对神说，因为没有人听出来。然而他在心灵里，却是讲说各样的奥秘。"],[3,"但作先知讲道的，是对人说，要造就、安慰、劝勉人。"],[4,"说方言的，是造就自己；作先知讲道的，乃是造就教会。"],[5,"我愿意你们都说方言，更愿意你们作先知讲道，因为说方言的，若不翻出来，使教会被造就，那作先知讲道的，就比他强了。"],[6,"弟兄们，我到你们那里去，若只说方言，不用启示、或知识、或预言、或教训，给你们讲解，我与你们有什么益处呢？"],[7,"就是那有声无气的物，或箫、或琴，若发出来的声音没有分别，怎能知道所吹、所弹的是什么呢？"],[8,"若吹无定的号声，谁能预备打仗呢？"],[9,"你们也是如此，舌头若不说容易明白的话，怎能知道所说的是什么呢？这就是向空说话了。"],[10,"世上的声音或者甚多，却没有一样是无意思的。"],[11,"我若不明白那声音的意思，这说话的人必以我为化外之人，我也以他为化外之人。"],[12,"你们也是如此，既是切慕属灵的恩赐，就当求多得造就教会的恩赐。"],[13,"所以那说方言的，就当求着能翻出来。"],[14,"我若用方言祷告，是我的灵祷告，但我的悟性没有果效。"],[15,"这却怎么样呢？我要用灵祷告，也要用悟性祷告；我要用灵歌唱，也要用悟性歌唱。"],[16,"不然，你用灵祝谢，那在座不通方言的人，既然不明白你的话，怎能在你感谢的时候说“阿们”呢？"],[17,"你感谢的固然是好，无奈不能造就别人。"],[18,"我感谢神，我说方言比你们众人还多。"],[19,"但在教会中，宁可用悟性说五句教导人的话，强如说万句方言。"],[20,"弟兄们，在心志上不要作小孩子。然而，在恶事上要作婴孩，在心志上总要作大人。"],[21,"律法上记着：“主说：‘我要用外邦人的舌头，和外邦人的嘴唇向这百姓说话，虽然如此，他们还是不听从我。’”"],[22,"这样看来，说方言不是为信的人作证据，乃是为不信的人；作先知讲道不是为不信的人作证据，乃是为信的人。"],[23,"所以全教会聚在一处的时候，若都说方言，偶然有不通方言的，或是不信的人进来，岂不说你们癫狂了吗？"],[24,"若都作先知讲道，偶然有不信的，或是不通方言的人进来，就被众人劝醒，被众人审明，"],[25,"他心里的隐情显露出来，就必将脸伏地，敬拜神，说：“神真是在你们中间了。”"],[26,"弟兄们，这却怎么样呢？你们聚会的时候，各人或有诗歌，或有教训，或有启示，或有方言，或有翻出来的话，凡事都当造就人。"],[27,"若有说方言的，只好两个人，至多三个人，且要轮流着说，也要一个人翻出来。"],[28,"若没有人翻，就当在会中闭口，只对自己和神说就是了。"],[29,"至于作先知讲道的，只好两个人，或是三个人，其余的就当慎思明辨。"],[30,"若旁边坐着的得了启示，那先说话的就当闭口不言。"],[31,"因为你们都可以一个一个地作先知讲道，叫众人学道理，叫众人得劝勉。"],[32,"先知的灵原是顺服先知的，"],[33,"因为神不是叫人混乱，乃是叫人安静。"],[34,"妇女在会中要闭口不言，像在圣徒的众教会一样，因为不准她们说话。她们总要顺服，正如律法所说的。"],[35,"她们若要学什么，可以在家里问自己的丈夫，因为妇女在会中说话原是可耻的。"],[36,"神的道理岂是从你们出来吗？岂是单临到你们吗？"],[37,"若有人以为自己是先知，或是属灵的，就该知道我所写给你们的是主的命令。"],[38,"若有不知道的，就由他不知道吧。"],[39,"所以我弟兄们，你们要切慕作先知讲道，也不要禁止说方言。"],[40,"凡事都要规规矩矩地按着次序行。"]]},{"n":15,"v":[[1,"弟兄们，我如今把先前所传给你们的福音，告诉你们知道。这福音你们也领受了，又靠着站立得住；"],[2,"并且你们若不是徒然相信，能以持守我所传给你们的，就必因这福音得救。"],[3,"我当日所领受又传给你们的，第一，就是基督照圣经所说，为我们的罪死了，"],[4,"而且埋葬了，又照圣经所说，第三天复活了，"],[5,"并且显给矶法看，然后显给十二使徒看，"],[6,"后来一时显给五百多弟兄看，其中一大半到如今还在，却也有已经睡了的。"],[7,"以后显给雅各看，再显给众使徒看，"],[8,"末了，也显给我看。我如同未到产期而生的人一般。"],[9,"我原是使徒中最小的，不配称为使徒，因为我从前逼迫神的教会。"],[10,"然而我今日成了何等人，是蒙神的恩才成的；并且他所赐我的恩不是徒然的。我比众使徒格外劳苦，这原不是我，乃是神的恩与我同在。"],[11,"不拘是我，是众使徒，我们如此传，你们也如此信了。"],[12,"既传基督是从死里复活了，怎么在你们中间有人说没有死人复活的事呢？"],[13,"若没有死人复活的事，基督也就没有复活了。"],[14,"若基督没有复活，我们所传的便是枉然，你们所信的也是枉然。"],[15,"并且明显我们是为神妄作见证的，因我们见证神是叫基督复活了。若死人真不复活，神也就没有叫基督复活了。"],[16,"因为死人若不复活，基督也就没有复活了。"],[17,"基督若没有复活，你们的信便是徒然，你们仍在罪里，"],[18,"就是在基督里睡了的人也灭亡了。"],[19,"我们若靠基督只在今生有指望，就算比众人更可怜。"],[20,"但基督已经从死里复活，成为睡了之人初熟的果子。"],[21,"死既是因一人而来，死人复活也是因一人而来。"],[22,"在亚当里众人都死了，照样，在基督里众人也都要复活。"],[23,"但各人是按着自己的次序复活，初熟的果子是基督，以后在他来的时候，是那些属基督的。"],[24,"再后，末期到了，那时基督既将一切执政的、掌权的、有能的都毁灭了，就把国交与父神。"],[25,"因为基督必要作王，等神把一切仇敌都放在他的脚下。"],[26,"尽末了所毁灭的仇敌就是死。"],[27,"因为经上说：“神叫万物都服在他的脚下。”既说万物都服了他，明显那叫万物服他的，不在其内了。"],[28,"万物既服了他，那时，子也要自己服那叫万物服他的，叫神在万物之上，为万物之主。"],[29,"不然，那些为死人受洗的，将来怎样呢？若死人总不复活，因何为他们受洗呢？"],[30,"我们又因何时刻冒险呢？"],[31,"弟兄们，我在我主基督耶稣里指着你们所夸的口极力地说，我是天天冒死。"],[32,"我若当日像寻常人在以弗所同野兽战斗，那于我有什么益处呢？若死人不复活，我们就吃吃喝喝吧！因为明天要死了。"],[33,"你们不要自欺，滥交是败坏善行。"],[34,"你们要醒悟为善，不要犯罪，因为有人不认识神。我说这话是要叫你们羞愧。"],[35,"或有人问：“死人怎样复活，带着什么身体来呢？”"],[36,"无知的人哪，你所种的若不死就不能生。"],[37,"并且你所种的不是那将来的形体，不过是子粒，即如麦子，或是别样的谷。"],[38,"但神随自己的意思给它一个形体，并叫各等子粒各有自己的形体。"],[39,"凡肉体各有不同：人是一样，兽又是一样，鸟又是一样，鱼又是一样。"],[40,"有天上的形体，也有地上的形体。但天上形体的荣光是一样，地上形体的荣光又是一样。"],[41,"日有日的荣光，月有月的荣光，星有星的荣光。这星和那星的荣光也有分别。"],[42,"死人复活也是这样：所种的是必朽坏的，复活的是不朽坏的；"],[43,"所种的是羞辱的，复活的是荣耀的；所种的是软弱的，复活的是强壮的；"],[44,"所种的是血气的身体，复活的是灵性的身体。若有血气的身体，也必有灵性的身体。"],[45,"经上也是这样记着说，“首先的人亚当成了有灵的活人（“灵”或作“血气”）”，末后的亚当成了叫人活的灵。"],[46,"但属灵的不在先，属血气的在先，以后才有属灵的。"],[47,"头一个人是出于地，乃属土；第二个人是出于天。"],[48,"那属土的怎样，凡属土的也就怎样；属天的怎样，凡属天的也就怎样。"],[49,"我们既有属土的形状，将来也必有属天的形状。"],[50,"弟兄们，我告诉你们说，血肉之体不能承受神的国，必朽坏的不能承受不朽坏的。"],[51,"我如今把一件奥秘的事告诉你们，我们不是都要睡觉，乃是都要改变，"],[52,"就在一霎时，眨眼之间，号筒末次吹响的时候；因号筒要响，死人要复活，成为不朽坏的，我们也要改变。"],[53,"这必朽坏的总要变成不朽坏的（“变成”原文作“穿”。下同），这必死的总要变成不死的。"],[54,"这必朽坏的既变成不朽坏的，这必死的既变成不死的，那时经上所记“死被得胜吞灭”的话就应验了。"],[55,"死啊，你得胜的权势在哪里？死啊，你的毒钩在哪里？"],[56,"死的毒钩就是罪，罪的权势就是律法。"],[57,"感谢神，使我们藉着我们的主耶稣基督得胜。"],[58,"所以，我亲爱的弟兄们，你们务要坚固，不可摇动，常常竭力多作主工，因为知道你们的劳苦，在主里面不是徒然的。"]]},{"n":16,"v":[[1,"论到为圣徒捐钱，我从前怎样吩咐加拉太的众教会，你们也当怎样行。"],[2,"每逢七日的第一日，各人要照自己的进项抽出来留着，免得我来的时候现凑。"],[3,"及至我来到了，你们写信举荐谁，我就打发他们，把你们的捐资送到耶路撒冷去。"],[4,"若我也该去，他们可以和我同去。"],[5,"我要从马其顿经过，既经过了，就要到你们那里去，"],[6,"或者和你们同住几时，或者也过冬。无论我往哪里去，你们就可以给我送行。"],[7,"我如今不愿意路过见你们，主若许我，我就指望和你们同住几时。"],[8,"但我要仍旧住在以弗所，直等到五旬节，"],[9,"因为有宽大又有功效的门为我开了，并且反对的人也多。"],[10,"若是提摩太来到，你们要留心，叫他在你们那里无所惧怕，因为他劳力作主的工，像我一样。"],[11,"所以无论谁，都不可藐视他，只要送他平安前行，叫他到我这里来，因我指望他和弟兄们同来。"],[12,"至于兄弟亚波罗，我再三地劝他同弟兄们到你们那里去，但这时他决不愿意去，几时有了机会他必去。"],[13,"你们务要警醒，在真道上站立得稳，要作大丈夫，要刚强。"],[14,"凡你们所作的，都要凭爱心而作。"],[15,"弟兄们，你们晓得，司提反一家是亚该亚初结的果子，并且他们专以服侍圣徒为念。"],[16,"我劝你们顺服这样的人，并一切同工同劳的人。"],[17,"司提反和福徒拿都并亚该古到这里来，我很喜欢，因为你们待我有不及之处，他们补上了。"],[18,"他们叫我和你们心里都快活。这样的人，你们务要敬重。"],[19,"亚细亚的众教会问你们安。亚居拉和百基拉并在他们家里的教会，因主多多地问你们安。"],[20,"众弟兄都问你们安。你们要亲嘴问安，彼此务要圣洁。"],[21,"我保罗亲笔问安。"],[22,"若有人不爱主，这人可诅可咒。主必要来。"],[23,"愿主耶稣基督的恩常与你们众人同在。"],[24,"我在基督耶稣里的爱与你们众人同在。阿们！"]]}]},{"name":"启示录","chapters":[{"n":1,"v":[[1,"耶稣基督的启示，就是神赐给他，叫他将必要快成的事指示他的众仆人。他就差遣使者晓谕他的仆人约翰。"],[2,"约翰便将神的道和耶稣基督的见证，凡自己所看见的都证明出来。"],[3,"念这书上预言的和那些听见又遵守其中所记载的，都是有福的，因为日期近了。"],[4,"约翰写信给亚细亚的七个教会。但愿从那昔在、今在、以后永在的神和他宝座前的七灵，"],[5,"并那诚实作见证的，从死里首先复活，为世上君王元首的耶稣基督，有恩惠、平安归与你们！他爱我们，用自己的血使我们脱离罪恶（“脱离”有古卷作“洗去”），"],[6,"又使我们成为国民，作他父神的祭司。但愿荣耀、权能归给他，直到永永远远。阿们！"],[7,"看哪，他驾云降临，众目要看见他，连刺他的人也要看见他，地上的万族都要因他哀哭。这话是真实的。阿们！"],[8,"主神说：“我是阿拉法，我是俄梅戛（“阿拉法、俄梅戛”乃希腊字母首末二字），是昔在、今在、以后永在的全能者。”"],[9,"我约翰就是你们的弟兄，和你们在耶稣的患难、国度、忍耐里一同有份，为神的道，并为给耶稣作的见证，曾在那名叫拔摩的海岛上。"],[10,"当主日，我被圣灵感动，听见在我后面有大声音如吹号，说："],[11,"“你所看见的，当写在书上，达与以弗所、士每拿、别迦摩、推雅推喇、撒狄、非拉铁非、老底嘉那七个教会。”"],[12,"我转过身来，要看是谁发声与我说话；既转过来，就看见七个金灯台。"],[13,"灯台中间有一位好像人子，身穿长衣，直垂到脚，胸间束着金带。"],[14,"他的头与发皆白，如白羊毛、如雪，眼目如同火焰，"],[15,"脚好像在炉中锻炼光明的铜，声音如同众水的声音。"],[16,"他右手拿着七星，从他口中出来一把两刃的利剑，面貌如同烈日放光。"],[17,"我一看见，就仆倒在他脚前，像死了一样。他用右手按着我说：“不要惧怕！我是首先的，我是末后的，"],[18,"又是那存活的。我曾死过，现在又活了，直活到永永远远，并且拿着死亡和阴间的钥匙。"],[19,"所以你要把所看见的和现在的事，并将来必成的事都写出来。"],[20,"论到你所看见、在我右手中的七星和七个金灯台的奥秘，那七星就是七个教会的使者，七灯台就是七个教会。”"]]},{"n":2,"v":[[1,"“你要写信给以弗所教会的使者说，那右手拿着七星，在七个金灯台中间行走的说："],[2,"我知道你的行为、劳碌、忍耐，也知道你不能容忍恶人。你也曾试验那自称为使徒却不是使徒的，看出他们是假的来。"],[3,"你也能忍耐，曾为我的名劳苦，并不乏倦。"],[4,"然而，有一件事我要责备你，就是你把起初的爱心离弃了。"],[5,"所以应当回想你是从哪里坠落的，并要悔改，行起初所行的事。你若不悔改，我就临到你那里，把你的灯台从原处挪去。"],[6,"然而，你还有一件可取的事，就是你恨恶尼哥拉一党人的行为，这也是我所恨恶的。"],[7,"圣灵向众教会所说的话，凡有耳的，就应当听。得胜的，我必将神乐园中生命树的果子赐给他吃。”"],[8,"“你要写信给士每拿教会的使者说，那首先的、末后的、死过又活的说："],[9,"我知道你的患难，你的贫穷（你却是富足的），也知道那自称是犹太人所说的毁谤话，其实他们不是犹太人，乃是撒但一会的人。"],[10,"你将要受的苦你不用怕。魔鬼要把你们中间几个人下在监里，叫你们被试炼，你们必受患难十日。你务要至死忠心，我就赐给你那生命的冠冕。"],[11,"圣灵向众教会所说的话，凡有耳的，就应当听。得胜的，必不受第二次死的害。”"],[12,"“你要写信给别迦摩教会的使者说，那有两刃利剑的说："],[13,"我知道你的居所，就是有撒但座位之处。当我忠心的见证人安提帕在你们中间、撒但所住的地方被杀之时，你还坚守我的名，没有弃绝我的道。"],[14,"然而，有几件事我要责备你，因为在你那里，有人服从了巴兰的教训；这巴兰曾教导巴勒将绊脚石放在以色列人面前，叫他们吃祭偶像之物，行奸淫的事。"],[15,"你那里也有人照样服从了尼哥拉一党人的教训。"],[16,"所以你当悔改，若不悔改，我就快临到你那里，用我口中的剑攻击他们。"],[17,"圣灵向众教会所说的话，凡有耳的，就应当听。得胜的，我必将那隐藏的吗哪赐给他，并赐他一块白石，石上写着新名，除了那领受的以外，没有人能认识。”"],[18,"“你要写信给推雅推喇教会的使者说，那眼目如火焰、脚像光明铜的神之子说："],[19,"我知道你的行为、爱心、信心、勤劳、忍耐，又知道你末后所行的善事，比起初所行的更多。"],[20,"然而，有一件事我要责备你，就是你容让那自称是先知的妇人耶洗别教导我的仆人，引诱他们行奸淫，吃祭偶像之物。"],[21,"我曾给她悔改的机会，她却不肯悔改她的淫行。"],[22,"看哪，我要叫她病卧在床。那些与她行淫的人，若不悔改所行的，我也要叫他们同受大患难。"],[23,"我又要杀死她的党类（“党类”原文作“儿女”），叫众教会知道，我是那察看人肺腑心肠的，并要照你们的行为报应你们各人。"],[24,"至于你们推雅推喇其余的人，就是一切不从那教训，不晓得他们素常所说撒但深奥之理的人，我告诉你们：我不将别的担子放在你们身上。"],[25,"但你们已经有的，总要持守，直等到我来。"],[26,"那得胜又遵守我命令到底的，我要赐给他权柄制伏列国。"],[27,"他必用铁杖辖管他们（“辖管”原文作“牧”），将他们如同窑户的瓦器打得粉碎，像我从我父领受的权柄一样。"],[28,"我又要把晨星赐给他。"],[29,"圣灵向众教会所说的话，凡有耳的，就应当听。”"]]},{"n":3,"v":[[1,"“你要写信给撒狄教会的使者说，那有神的七灵和七星的说：我知道你的行为，按名你是活的，其实是死的。"],[2,"你要警醒，坚固那剩下将要衰微的（“衰微”原文作“死”），因我见你的行为，在我神面前，没有一样是完全的。"],[3,"所以要回想你是怎样领受，怎样听见的，又要遵守，并要悔改。若不警醒，我必临到你那里，如同贼一样。我几时临到，你也决不能知道。"],[4,"然而在撒狄，你还有几名是未曾污秽自己衣服的，他们要穿白衣与我同行，因为他们是配得过的。"],[5,"凡得胜的，必这样穿白衣，我也必不从生命册上涂抹他的名，且要在我父面前和我父众使者面前认他的名。"],[6,"圣灵向众教会所说的话，凡有耳的，就应当听。”"],[7,"“你要写信给非拉铁非教会的使者说，那圣洁真实，拿着大卫的钥匙，开了就没有人能关，关了就没有人能开的，说："],[8,"我知道你的行为，你略有一点力量，也曾遵守我的道，没有弃绝我的名。看哪，我在你面前给你一个敞开的门，是无人能关的。"],[9,"那撒但一会的，自称是犹太人，其实不是犹太人，乃是说谎话的，我要使他们来在你脚前下拜，也使他们知道我是已经爱你了。"],[10,"你既遵守我忍耐的道，我必在普天下人受试炼的时候，保守你免去你的试炼。"],[11,"我必快来，你要持守你所有的，免得人夺去你的冠冕。"],[12,"得胜的，我要叫他在我神殿中作柱子，他也必不再从那里出去。我又要将我神的名和我神城的名（这城就是从天上、从我神那里降下来的新耶路撒冷），并我的新名，都写在他上面。"],[13,"圣灵向众教会所说的话，凡有耳的，就应当听。”"],[14,"“你要写信给老底嘉教会的使者说，那为阿们的，为诚信真实见证的，在神创造万物之上为元首的，说："],[15,"我知道你的行为，你也不冷也不热，我巴不得你或冷或热。"],[16,"你既如温水，也不冷也不热，所以我必从我口中把你吐出去。"],[17,"你说：我是富足，已经发了财，一样都不缺；却不知道你是那困苦、可怜、贫穷、瞎眼、赤身的。"],[18,"我劝你向我买火炼的金子，叫你富足；又买白衣穿上，叫你赤身的羞耻不露出来；又买眼药擦你的眼睛，使你能看见。"],[19,"凡我所疼爱的，我就责备管教他，所以你要发热心，也要悔改。"],[20,"看哪，我站在门外叩门，若有听见我声音就开门的，我要进到他那里去，我与他，他与我，一同坐席。"],[21,"得胜的，我要赐他在我宝座上与我同坐，就如我得了胜，在我父的宝座上与他同坐一般。"],[22,"圣灵向众教会所说的话，凡有耳的，就应当听。”"]]},{"n":4,"v":[[1,"此后，我观看，见天上有门开了。我初次听见好像吹号的声音，对我说：“你上到这里来，我要将以后必成的事指示你。”"],[2,"我立刻被圣灵感动，见有一个宝座安置在天上，又有一位坐在宝座上。"],[3,"看那坐着的，好像碧玉和红宝石，又有虹围着宝座，好像绿宝石。"],[4,"宝座的周围又有二十四个座位，其上坐着二十四位长老，身穿白衣，头上戴着金冠冕。"],[5,"有闪电、声音、雷轰从宝座中发出。又有七盏火灯在宝座前点着，这七灯就是神的七灵。"],[6,"宝座前好像一个玻璃海，如同水晶。宝座中和宝座周围有四个活物，前后遍体都满了眼睛。"],[7,"第一个活物像狮子，第二个像牛犊，第三个脸面像人，第四个像飞鹰。"],[8,"四活物各有六个翅膀，遍体内外都满了眼睛。它们昼夜不住地说：“圣哉，圣哉，圣哉，主神是昔在、今在、以后永在的全能者！”"],[9,"每逢四活物将荣耀、尊贵、感谢归给那坐在宝座上、活到永永远远者的时候，"],[10,"那二十四位长老就俯伏在坐宝座的面前敬拜那活到永永远远的，又把他们的冠冕放在宝座前，说："],[11,"“我们的主，我们的神，你是配得荣耀、尊贵、权柄的，因为你创造了万物，并且万物是因你的旨意被创造而有的。”"]]},{"n":5,"v":[[1,"我看见坐宝座的右手中有书卷，里外都写着字，用七印封严了。"],[2,"我又看见一位大力的天使大声宣传说：“有谁配展开那书卷，揭开那七印呢？”"],[3,"在天上、地上、地底下，没有能展开、能观看那书卷的。"],[4,"因为没有配展开、配观看那书卷的，我就大哭。"],[5,"长老中有一位对我说：“不要哭！看哪，犹大支派中的狮子，大卫的根，他已得胜，能以展开那书卷，揭开那七印。”"],[6,"我又看见宝座与四活物并长老之中，有羔羊站立，象是被杀过的，有七角七眼，就是神的七灵，奉差遣往普天下去的。"],[7,"这羔羊前来，从坐宝座的右手里拿了书卷。"],[8,"他既拿了书卷，四活物和二十四位长老就俯伏在羔羊面前，各拿着琴和盛满了香的金炉，这香就是众圣徒的祈祷。"],[9,"他们唱新歌说：“你配拿书卷，配揭开七印，因为你曾被杀，用自己的血从各族、各方、各民、各国中买了人来，叫他们归于神，"],[10,"又叫他们成为国民，作祭司，归于神，在地上执掌王权。”"],[11,"我又看见且听见宝座与活物并长老的周围有许多天使的声音，他们的数目有千千万万，"],[12,"大声说：“曾被杀的羔羊是配得权柄、丰富、智慧、能力、尊贵、荣耀、颂赞的。”"],[13,"我又听见在天上、地上、地底下、沧海里和天地间一切所有被造之物都说：“但愿颂赞、尊贵、荣耀、权势都归给坐宝座的和羔羊，直到永永远远。”"],[14,"四活物就说：“阿们！”众长老也俯伏敬拜。"]]},{"n":6,"v":[[1,"我看见羔羊揭开七印中第一印的时候，就听见四活物中的一个活物，声音如雷，说：“你来！”"],[2,"我就观看，见有一匹白马，骑在马上的，拿着弓，并有冠冕赐给他。他便出来，胜了又要胜。"],[3,"揭开第二印的时候，我听见第二个活物说：“你来！”"],[4,"就另有一匹马出来，是红的，有权柄给了那骑马的，可以从地上夺去太平，使人彼此相杀，又有一把大刀赐给他。"],[5,"揭开第三印的时候，我听见第三个活物说：“你来！”我就观看，见有一匹黑马，骑在马上的，手里拿着天平。"],[6,"我听见在四活物中似乎有声音说：“一钱银子买一升麦子，一钱银子买三升大麦，油和酒不可糟蹋。”"],[7,"揭开第四印的时候，我听见第四个活物说：“你来！”"],[8,"我就观看，见有一匹灰色马，骑在马上的，名字叫作死，阴府也随着他。有权柄赐给他们，可以用刀剑、饥荒、瘟疫（“瘟疫”或作“死亡”）、野兽，杀害地上四分之一的人。"],[9,"揭开第五印的时候，我看见在祭坛底下，有为神的道、并为作见证被杀之人的灵魂，"],[10,"大声喊着说：“圣洁真实的主啊，你不审判住在地上的人，给我们伸流血的冤，要等到几时呢？”"],[11,"于是有白衣赐给他们各人，又有话对他们说：“还要安息片时，等着一同作仆人的和他们的弟兄也像他们被杀，满足了数目。”"],[12,"揭开第六印的时候，我又看见地大震动，日头变黑像毛布，满月变红像血，"],[13,"天上的星辰坠落于地，如同无花果树被大风摇动，落下未熟的果子一样。"],[14,"天就挪移，好像书卷被卷起来；山岭海岛都被挪移，离开本位。"],[15,"地上的君王、臣宰、将军、富户、壮士和一切为奴的、自主的，都藏在山洞和岩石穴里，"],[16,"向山和岩石说：“倒在我们身上吧！把我们藏起来，躲避坐宝座者的面目和羔羊的忿怒，"],[17,"因为他们忿怒的大日到了，谁能站得住呢？”"]]},{"n":7,"v":[[1,"此后，我看见四位天使站在地的四角，执掌地上四方的风，叫风不吹在地上、海上和树上。"],[2,"我又看见另有一位天使，从日出之地上来，拿着永生神的印。他就向那得着权柄能伤害地和海的四位天使大声喊着说："],[3,"“地与海并树木，你们不可伤害，等我们印了我们神众仆人的额。”"],[4,"我听见以色列人各支派中受印的数目有十四万四千；"],[5,"犹大支派中受印的有一万二千，流便支派中有一万二千，迦得支派中有一万二千，"],[6,"亚设支派中有一万二千，拿弗他利支派中有一万二千，玛拿西支派中有一万二千，"],[7,"西缅支派中有一万二千，利未支派中有一万二千，以萨迦支派中有一万二千，"],[8,"西布伦支派中有一万二千，约瑟支派中有一万二千，便雅悯支派中受印的有一万二千。"],[9,"此后，我观看，见有许多的人，没有人能数过来，是从各国、各族、各民、各方来的，站在宝座和羔羊面前，身穿白衣，手拿棕树枝，"],[10,"大声喊着说：“愿救恩归与坐在宝座上我们的神，也归与羔羊。”"],[11,"众天使都站在宝座和众长老并四活物的周围，在宝座前面伏于地敬拜神，"],[12,"说：“阿们！颂赞、荣耀、智慧、感谢、尊贵、权柄、大力都归与我们的神，直到永永远远。阿们！”"],[13,"长老中有一位问我说：“这些穿白衣的是谁？是从哪里来的？”"],[14,"我对他说：“我主，你知道。”他向我说：“这些人是从大患难中出来的，曾用羔羊的血把衣裳洗白净了。"],[15,"所以，他们在神宝座前，昼夜在他殿中侍奉他。坐宝座的要用帐幕覆庇他们。"],[16,"他们不再饥、不再渴，日头和炎热也必不伤害他们，"],[17,"因为宝座中的羔羊必牧养他们，领他们到生命水的泉源，神也必擦去他们一切的眼泪。”"]]},{"n":8,"v":[[1,"羔羊揭开第七印的时候，天上寂静约有二刻。"],[2,"我看见那站在神面前的七位天使，有七枝号赐给他们。"],[3,"另有一位天使拿着金香炉来站在祭坛旁边，有许多香赐给他，要和众圣徒的祈祷一同献在宝座前的金坛上。"],[4,"那香的烟和众圣徒的祈祷从天使的手中一同升到神面前。"],[5,"天使拿着香炉，盛满了坛上的火，倒在地上，随有雷轰、大声、闪电、地震。"],[6,"拿着七枝号的七位天使就预备要吹。"],[7,"第一位天使吹号，就有雹子与火搀着血丢在地上，地的三分之一和树的三分之一被烧了，一切的青草也被烧了。"],[8,"第二位天使吹号，就有彷佛火烧着的大山扔在海中，海的三分之一变成血，"],[9,"海中的活物死了三分之一，船只也坏了三分之一。"],[10,"第三位天使吹号，就有烧着的大星好像火把从天上落下来，落在江河的三分之一和众水的泉源上。"],[11,"这星名叫“茵陈”。众水的三分之一变为茵陈，因水变苦，就死了许多人。"],[12,"第四位天使吹号，日头的三分之一，月亮的三分之一，星辰的三分之一都被击打，以致日月星的三分之一黑暗了，白昼的三分之一没有光，黑夜也是这样。"],[13,"我又看见一个鹰飞在空中，并听见它大声说：“三位天使要吹那其余的号，你们住在地上的民，祸哉，祸哉，祸哉！”"]]},{"n":9,"v":[[1,"第五位天使吹号，我就看见一个星从天落到地上，有无底坑的钥匙赐给它。"],[2,"它开了无底坑，便有烟从坑里往上冒，好像大火炉的烟，日头和天空都因这烟昏暗了。"],[3,"有蝗虫从烟中出来，飞到地上，有能力赐给它们，好像地上蝎子的能力一样。"],[4,"并且吩咐它们说，不可伤害地上的草和各样青物，并一切树木，惟独要伤害额上没有神印记的人。"],[5,"但不许蝗虫害死他们，只叫他们受痛苦五个月，这痛苦就像蝎子螫人的痛苦一样。"],[6,"在那些日子，人要求死，决不得死；愿意死，死却远避他们。"],[7,"蝗虫的形状好像预备出战的马一样，头上戴的好像金冠冕，脸面好像男人的脸面，"],[8,"头发像女人的头发，牙齿像狮子的牙齿。"],[9,"胸前有甲，好像铁甲。它们翅膀的声音，好像许多车马奔跑上阵的声音。"],[10,"有尾巴像蝎子，尾巴上的毒钩能伤人五个月。"],[11,"有无底坑的使者作它们的王，按着希伯来话，名叫亚巴顿；希腊话，名叫亚玻伦。"],[12,"第一样灾祸过去了，还有两样灾祸要来。"],[13,"第六位天使吹号，我就听见有声音从神面前金坛的四角出来，"],[14,"吩咐那吹号的第六位天使，说：“把那捆绑在幼发拉底大河的四个使者释放了。”"],[15,"那四个使者就被释放，他们原是预备好了，到某年某月某日某时，要杀人的三分之一。"],[16,"马军有二万万，他们的数目我听见了。"],[17,"我在异象中看见那些马和骑马的，骑马的胸前有甲如火，与紫玛瑙并硫磺。马的头好像狮子头，有火、有烟、有硫磺，从马的口中出来。"],[18,"口中所出来的火与烟，并硫磺，这三样灾杀了人的三分之一。"],[19,"这马的能力是在口里和尾巴上，因这尾巴像蛇，并且有头用以害人。"],[20,"其余未曾被这些灾所杀的人仍旧不悔改自己手所作的，还是去拜鬼魔和那些不能看、不能听、不能走，金、银、铜、木、石的偶像；"],[21,"又不悔改他们那些凶杀、邪术、奸淫、偷窃的事。"]]},{"n":10,"v":[[1,"我又看见另有一位大力的天使从天降下，披着云彩，头上有虹，脸面像日头，两脚像火柱。"],[2,"他手里拿着小书卷，是展开的。他右脚踏海，左脚踏地，"],[3,"大声呼喊，好像狮子吼叫。呼喊完了，就有七雷发声。"],[4,"七雷发声之后，我正要写出来，就听见从天上有声音说：“七雷所说的你要封上，不可写出来。”"],[5,"我所看见的那踏海踏地的天使向天举起右手来，"],[6,"指着那创造天和天上之物，地和地上之物，海和海中之物，直活到永永远远的，起誓说：“不再有时日了（或作“不再耽延了”）。”"],[7,"但在第七位天使吹号发声的时候，神的奥秘就成全了，正如神所传给他仆人众先知的佳音。"],[8,"我先前从天上所听见的那声音又吩咐我说：“你去，把那踏海踏地之天使手中展开的小书卷取过来。”"],[9,"我就走到天使那里，对他说：“请你把小书卷给我。”他对我说：“你拿着吃尽了，便叫你肚子发苦，然而在你口中要甜如蜜。”"],[10,"我从天使手中把小书卷接过来，吃尽了，在我口中果然甜如蜜，吃了以后，肚子觉得发苦了。"],[11,"天使（原文作“他们”）对我说：“你必指着多民、多国、多方、多王再说预言。”"]]},{"n":11,"v":[[1,"有一根苇子赐给我，当作量度的杖，且有话说：“起来，将神的殿和祭坛，并在殿中礼拜的人都量一量。"],[2,"只是殿外的院子要留下不用量，因为这是给了外邦人的，他们要践踏圣城四十二个月。"],[3,"我要使我那两个见证人，穿着毛衣，传道一千二百六十天。”"],[4,"他们就是那两棵橄榄树，两个灯台，立在世界之主面前的。"],[5,"若有人想要害他们，就有火从他们口中出来，烧灭仇敌；凡想要害他们的，都必这样被杀。"],[6,"这二人有权柄，在他们传道的日子叫天闭塞不下雨；又有权柄叫水变为血，并且能随时随意用各样的灾殃攻击世界。"],[7,"他们作完见证的时候，那从无底坑里上来的兽必与他们交战，并且得胜，把他们杀了。"],[8,"他们的尸首就倒在大城里的街上，这城按着灵意叫所多玛，又叫埃及，就是他们的主钉十字架之处。"],[9,"从各民、各族、各方、各国中，有人观看他们的尸首三天半，又不许把尸首放在坟墓里。"],[10,"住在地上的人就为他们欢喜快乐，互相馈送礼物，因这两位先知曾叫住在地上的人受痛苦。"],[11,"过了这三天半，有生气从神那里进入他们里面，他们就站起来；看见他们的人甚是害怕。"],[12,"两位先知听见有大声音从天上来，对他们说：“上到这里来。”他们就驾着云上了天，他们的仇敌也看见了。"],[13,"正在那时候，地大震动，城就倒塌了十分之一，因地震而死的有七千人，其余的都恐惧，归荣耀给天上的神。"],[14,"第二样灾祸过去，第三样灾祸快到了。"],[15,"第七位天使吹号，天上就有大声音说：“世上的国成了我主和主基督的国；他要作王，直到永永远远。”"],[16,"在神面前，坐在自己位上的二十四位长老，就面伏于地敬拜神，说："],[17,"“昔在、今在的主神，全能者啊，我们感谢你！因你执掌大权作王了。"],[18,"外邦发怒，你的忿怒也临到了，审判死人的时候也到了；你的仆人众先知和众圣徒，凡敬畏你名的人，连大带小得赏赐的时候也到了；你败坏那些败坏世界之人的时候也就到了。”"],[19,"当时，神天上的殿开了，在他殿中现出他的约柜，随后有闪电、声音、雷轰、地震、大雹。"]]},{"n":12,"v":[[1,"天上现出大异象来：有一个妇人身披日头，脚踏月亮，头戴十二星的冠冕。"],[2,"她怀了孕，在生产的艰难中疼痛呼叫。"],[3,"天上又现出异象来：有一条大红龙，七头十角，七头上戴着七个冠冕。"],[4,"它的尾巴拖拉着天上星辰的三分之一，摔在地上。龙就站在那将要生产的妇人面前，等她生产之后，要吞吃她的孩子。"],[5,"妇人生了一个男孩子，是将来要用铁杖辖管万国的（“辖管”原文作“牧”）。她的孩子被提到神宝座那里去了。"],[6,"妇人就逃到旷野，在那里有神给她预备的地方，使她被养活一千二百六十天。"],[7,"在天上就有了争战。米迦勒同他的使者与龙争战，龙也同它的使者去争战，"],[8,"并没有得胜，天上再没有它们的地方。"],[9,"大龙就是那古蛇，名叫魔鬼，又叫撒但，是迷惑普天下的。它被摔在地上，它的使者也一同被摔下去。"],[10,"我听见在天上有大声音说：“我神的救恩、能力、国度，并他基督的权柄，现在都来到了，因为那在我们神面前昼夜控告我们弟兄的，已经被摔下去了。"],[11,"弟兄胜过它，是因羔羊的血和自己所见证的道。他们虽至于死，也不爱惜性命。"],[12,"所以诸天和住在其中的，你们都快乐吧！只是地与海有祸了，因为魔鬼知道自己的时候不多，就气忿忿地下到你们那里去了。”"],[13,"龙见自己被摔在地上，就逼迫那生男孩子的妇人。"],[14,"于是有大鹰的两个翅膀赐给妇人，叫她能飞到旷野，到自己的地方躲避那蛇，她在那里被养活一载二载半载。"],[15,"蛇就在妇人身后，从口中吐出水来，像河一样，要将妇人冲去。"],[16,"地却帮助妇人，开口吞了从龙口吐出来的水（原文作“河”）。"],[17,"龙向妇人发怒，去与她其余的儿女争战，这儿女就是那守神诫命，为耶稣作见证的。那时龙就站在海边的沙上。"]]},{"n":13,"v":[[1,"我又看见一个兽从海中上来，有十角七头，在十角上戴着十个冠冕，七头上有亵渎的名号。"],[2,"我所看见的兽，形状像豹，脚像熊的脚，口像狮子的口。那龙将自己的能力、座位和大权柄都给了它。"],[3,"我看见兽的七头中，有一个似乎受了死伤，那死伤却医好了。全地的人都希奇跟从那兽，"],[4,"又拜那龙，因为它将自己的权柄给了兽，也拜兽说：“谁能比这兽，谁能与它交战呢？”"],[5,"又赐给它说夸大亵渎话的口，又有权柄赐给它，可以任意而行四十二个月。"],[6,"兽就开口向神说亵渎的话，亵渎神的名并他的帐幕，以及那些住在天上的。"],[7,"又任凭它与圣徒争战，并且得胜。也把权柄赐给它，制伏各族、各民、各方、各国。"],[8,"凡住在地上、名字从创世以来没有记在被杀之羔羊生命册上的人，都要拜它。"],[9,"凡有耳的，就应当听。"],[10,"掳掠人的，必被掳掠；用刀杀人的，必被刀杀。圣徒的忍耐和信心就是在此。"],[11,"我又看见另有一个兽从地中上来，有两角如同羊羔，说话好像龙。"],[12,"它在头一个兽面前，施行头一个兽所有的权柄，并且叫地和住在地上的人拜那死伤医好的头一个兽。"],[13,"又行大奇事，甚至在人面前，叫火从天降在地上。"],[14,"它因赐给它权柄在兽面前能行奇事，就迷惑住在地上的人，说：“要给那受刀伤还活着的兽作个像。”"],[15,"又有权柄赐给它，叫兽像有生气，并且能说话，又叫所有不拜兽像的人都被杀害。"],[16,"它又叫众人，无论大小贫富，自主的、为奴的，都在右手上或是在额上受一个印记。"],[17,"除了那受印记、有了兽名或有兽名数目的，都不得作买卖。"],[18,"在这里有智慧。凡有聪明的，可以算计兽的数目，因为这是人的数目，它的数目是六百六十六。"]]},{"n":14,"v":[[1,"我又观看，见羔羊站在锡安山，同他又有十四万四千人，都有他的名和他父的名写在额上。"],[2,"我听见从天上有声音，像众水的声音和大雷的声音，并且我所听见的好像弹琴的所弹的琴声。"],[3,"他们在宝座前，并在四活物和众长老前唱歌，彷佛是新歌，除了从地上买来的那十四万四千人以外，没有人能学这歌。"],[4,"这些人未曾沾染妇女，他们原是童身。羔羊无论往哪里去，他们都跟随他。他们是从人间买来的，作初熟的果子归与神和羔羊。"],[5,"在他们口中察不出谎言来，他们是没有瑕疵的。"],[6,"我又看见另有一位天使飞在空中，有永远的福音要传给住在地上的人，就是各国、各族、各方、各民。"],[7,"他大声说：“应当敬畏神，将荣耀归给他，因他施行审判的时候已经到了，应当敬拜那创造天、地、海和众水泉源的。”"],[8,"又有第二位天使接着说：“叫万民喝邪淫、大怒之酒的巴比伦大城倾倒了，倾倒了！”"],[9,"又有第三位天使接着他们，大声说：“若有人拜兽和兽像，在额上或在手上受了印记，"],[10,"这人也必喝神大怒的酒，此酒斟在神忿怒的杯中纯一不杂。他要在圣天使和羔羊面前，在火与硫磺之中受痛苦。"],[11,"他受痛苦的烟往上冒，直到永永远远。那些拜兽和兽像，受它名之印记的，昼夜不得安宁。”"],[12,"圣徒的忍耐就在此，他们是守神诫命和耶稣真道的。"],[13,"我听见从天上有声音说：“你要写下，从今以后，在主里面而死的人有福了！”圣灵说：“是的，他们息了自己的劳苦，作工的果效也随着他们。”"],[14,"我又观看，见有一片白云，云上坐着一位好像人子，头上戴着金冠冕，手里拿着快镰刀。"],[15,"又有一位天使从殿中出来，向那坐在云上的大声喊着说：“伸出你的镰刀来收割，因为收割的时候已经到了，地上的庄稼已经熟透了。”"],[16,"那坐在云上的，就把镰刀扔在地上；地上的庄稼就被收割了。"],[17,"又有一位天使从天上的殿中出来，他也拿着快镰刀。"],[18,"又有一位天使从祭坛中出来，是有权柄管火的，向拿着快镰刀的大声喊着说：“伸出快镰刀来，收取地上葡萄树的果子，因为葡萄熟透了。”"],[19,"那天使就把镰刀扔在地上，收取了地上的葡萄，丢在神忿怒的大酒醡中。"],[20,"那酒醡踹在城外，就有血从酒醡里流出来，高到马的嚼环，远有六百里。"]]},{"n":15,"v":[[1,"我又看见在天上有异象，大而且奇，就是七位天使掌管末了的七灾，因为神的大怒在这七灾中发尽了。"],[2,"我看见彷佛有玻璃海，其中有火搀杂。又看见那些胜了兽和兽的像并它名字数目的人，都站在玻璃海上，拿着神的琴，"],[3,"唱神仆人摩西的歌和羔羊的歌，说：“主神，全能者啊，你的作为大哉，奇哉！万世之王啊（“世”或作“国”），你的道途义哉，诚哉！"],[4,"主啊，谁敢不敬畏你，不将荣耀归与你的名呢？因为独有你是圣的，万民都要来在你面前敬拜，因你公义的作为已经显出来了。”"],[5,"此后，我看见在天上那存法柜的殿开了。"],[6,"那掌管七灾的七位天使从殿中出来，穿着洁白光明的细麻衣（“细麻衣”有古卷作“宝石”），胸间束着金带。"],[7,"四活物中有一个把盛满了活到永永远远之神大怒的七个金碗给了那七位天使。"],[8,"因神的荣耀和能力，殿中充满了烟。于是没有人能以进殿，直等到那七位天使所降的七灾完毕了。"]]},{"n":16,"v":[[1,"我听见有大声音从殿中出来，向那七位天使说：“你们去，把盛神大怒的七碗倒在地上。”"],[2,"第一位天使便去，把碗倒在地上，就有恶而且毒的疮生在那些有兽印记、拜兽像的人身上。"],[3,"第二位天使把碗倒在海里，海就变成血，好像死人的血，海中的活物都死了。"],[4,"第三位天使把碗倒在江河与众水的泉源里，水就变成血了。"],[5,"我听见掌管众水的天使说：“昔在、今在的圣者啊，你这样判断是公义的，"],[6,"他们曾流圣徒与先知的血，现在你给他们血喝，这是他们所该受的。”"],[7,"我又听见祭坛中有声音说：“是的，主神，全能者啊，你的判断义哉。诚哉！”"],[8,"第四位天使把碗倒在日头上，叫日头能用火烤人。"],[9,"人被大热所烤，就亵渎那有权掌管这些灾的神之名，并不悔改将荣耀归给神。"],[10,"第五位天使把碗倒在兽的座位上，兽的国就黑暗了。人因疼痛就咬自己的舌头；"],[11,"又因所受的疼痛和生的疮，就亵渎天上的神，并不悔改所行的。"],[12,"第六位天使把碗倒在幼发拉底大河上，河水就干了，要给那从日出之地所来的众王预备道路。"],[13,"我又看见三个污秽的灵，好像青蛙，从龙口、兽口并假先知的口中出来。"],[14,"他们本是鬼魔的灵，施行奇事，出去到普天下众王那里，叫他们在神全能者的大日聚集争战。"],[15,"（看哪，我来像贼一样。那警醒、看守衣服、免得赤身而行，叫人见他羞耻的有福了！）"],[16,"那三个鬼魔便叫众王聚集在一处，希伯来话叫作哈米吉多顿。"],[17,"第七位天使把碗倒在空中，就有大声音从殿中的宝座上出来，说：“成了！”"],[18,"又有闪电、声音、雷轰、大地震，自从地上有人以来，没有这样大、这样厉害的地震。"],[19,"那大城裂为三段，列国的城也都倒塌了。神也想起巴比伦大城来，要把那盛自己烈怒的酒杯递给他。"],[20,"各海岛都逃避了，众山也不见了。"],[21,"又有大雹子从天落在人身上，每一个约重一他连得（一他连得约有九十斤）。为这雹子的灾极大，人就亵渎神。"]]},{"n":17,"v":[[1,"拿着七碗的七位天使中，有一位前来对我说：“你到这里来，我将坐在众水上的大淫妇所要受的刑罚指给你看。"],[2,"地上的君王与她行淫，住在地上的人喝醉了她淫乱的酒。”"],[3,"我被圣灵感动，天使带我到旷野去，我就看见一个女人骑在朱红色的兽上；那兽有七头十角，遍体有亵渎的名号。"],[4,"那女人穿着紫色和朱红色的衣服，用金子、宝石、珍珠为妆饰；手拿金杯，杯中盛满了可憎之物，就是她淫乱的污秽。"],[5,"在她额上有名写着说：“奥秘哉！大巴比伦，作世上的淫妇和一切可憎之物的母。”"],[6,"我又看见那女人喝醉了圣徒的血和为耶稣作见证之人的血。我看见她，就大大地希奇。"],[7,"天使对我说：“你为什么希奇呢？我要将这女人和驮着她的那七头十角兽的奥秘告诉你。"],[8,"你所看见的兽，先前有、如今没有，将要从无底坑里上来，又要归于沉沦。凡住在地上、名字从创世以来没有记在生命册上的，见先前有，如今没有、以后再有的兽，就必希奇。"],[9,"智慧的心在此可以思想。那七头就是女人所坐的七座山，"],[10,"又是七位王；五位已经倾倒了，一位还在，一位还没有来到；他来的时候，必须暂时存留。"],[11,"那先前有、如今没有的兽，就是第八位，他也和那七位同列，并且归于沉沦。"],[12,"你所看见的那十角就是十王，他们还没有得国，但他们一时之间要和兽同得权柄，与王一样。"],[13,"他们同心合意将自己的能力权柄给那兽。"],[14,"他们与羔羊争战，羔羊必胜过他们，因为羔羊是万主之主，万王之王。同着羔羊的，就是蒙召、被选、有忠心的，也必得胜。”"],[15,"天使又对我说：“你所看见那淫妇坐的众水，就是多民、多人、多国、多方。"],[16,"你所看见的那十角与兽必恨这淫妇，使她冷落赤身，又要吃她的肉，用火将她烧尽。"],[17,"因为神使诸王同心合意，遵行他的旨意，把自己的国给那兽，直等到神的话都应验了。"],[18,"你所看见的那女人就是管辖地上众王的大城。”"]]},{"n":18,"v":[[1,"此后，我看见另有一位有大权柄的天使从天降下，地就因他的荣耀发光。"],[2,"他大声喊着说：“巴比伦大城倾倒了，倾倒了！成了鬼魔的住处和各样污秽之灵的巢穴（或作“牢狱”。下同），并各样污秽可憎之雀鸟的巢穴，"],[3,"因为列国都被她邪淫大怒的酒倾倒了，地上的君王与她行淫，地上的客商因她奢华太过就发了财。”"],[4,"我又听见从天上有声音说：“我的民哪，你们要从那城出来，免得与她一同有罪，受她所受的灾殃；"],[5,"因她的罪恶滔天，她的不义，神已经想起来了。"],[6,"她怎样待人，也要怎样待她，按她所行的加倍地报应她，用她调酒的杯加倍地调给她喝。"],[7,"她怎样荣耀自己，怎样奢华，也当叫她照样痛苦悲哀，因她心里说：‘我坐了皇后的位，并不是寡妇，决不至于悲哀。’"],[8,"所以在一天之内，她的灾殃要一齐来到，就是死亡、悲哀、饥荒。她又要被火烧尽了，因为审判她的主神大有能力。"],[9,"地上的君王，素来与她行淫，一同奢华的，看见烧她的烟，就必为她哭泣哀号。"],[10,"因怕她的痛苦，就远远地站着说：“哀哉，哀哉！巴比伦大城，坚固的城啊，一时之间你的刑罚就来到了。”"],[11,"地上的客商也都为她哭泣悲哀，因为没有人再买他们的货物了；"],[12,"这货物就是金、银、宝石、珍珠、细麻布、紫色料、绸子、朱红色料、各样香木、各样象牙的器皿，各样极宝贵的木头和铜、铁、汉白玉的器皿，"],[13,"并肉桂、豆蔻、香料、香膏、乳香、酒、油、细面、麦子、牛、羊、车、马和奴仆、人口。"],[14,"巴比伦哪，你所贪爱的果子离开了你，你一切的珍馐美味和华美的物件也从你中间毁灭，决不能再见了。"],[15,"贩卖这些货物、藉着她发了财的客商，因怕她的痛苦，就远远地站着哭泣悲哀，说："],[16,"“哀哉，哀哉！这大城啊！素常穿着细麻、紫色、朱红色的衣服，又用金子、宝石和珍珠为妆饰。"],[17,"一时之间，这么大的富厚就归于无有了。”凡船主和坐船往各处去的并众水手，连所有靠海为业的，都远远地站着，"],[18,"看见烧她的烟，就喊着说：“有何城能比这大城呢？”"],[19,"他们又把尘土撒在头上，哭泣悲哀，喊着说：“哀哉，哀哉，这大城啊！”凡有船在海中的，都因她的珍宝成了富足，她在一时之间就成了荒场。"],[20,"天哪，众圣徒、众使徒、众先知啊！你们都要因她欢喜，因为神已经在她身上伸了你们的冤。"],[21,"有一位大力的天使举起一块石头，好像大磨石，扔在海里，说：“巴比伦大城也必这样猛力地被扔下去，决不能再见了。"],[22,"弹琴、作乐、吹笛、吹号的声音在你中间决不能再听见，各行手艺人在你中间决不能再遇见，推磨的声音在你中间决不能再听见，"],[23,"灯光在你中间决不能再照耀，新郎和新妇的声音在你中间决不能再听见。你的客商原来是地上的尊贵人，万国也被你的邪术迷惑了。”"],[24,"先知和圣徒并地上一切被杀之人的血，都在这城里看见了。"]]},{"n":19,"v":[[1,"此后，我听见好像群众在天上大声说：“哈利路亚（就是“要赞美耶和华”的意思）！救恩、荣耀、权能都属乎我们的神。"],[2,"他的判断是真实、公义的，因他判断了那用淫行败坏世界的大淫妇，并且向淫妇讨流仆人血的罪，给他们伸冤。”"],[3,"又说：“哈利路亚！烧淫妇的烟往上冒，直到永永远远。”"],[4,"那二十四位长老与四活物就俯伏敬拜坐宝座的神，说：“阿们，哈利路亚！”"],[5,"有声音从宝座出来说：“神的众仆人哪，凡敬畏他的，无论大小，都要赞美我们的神。”"],[6,"我听见好像群众的声音，众水的声音，大雷的声音，说：“哈利路亚！因为主我们的神，全能者作王了。”"],[7,"我们要欢喜快乐，将荣耀归给他。因为羔羊婚娶的时候到了，新妇也自己预备好了，"],[8,"就蒙恩得穿光明洁白的细麻衣。这细麻衣就是圣徒所行的义。"],[9,"天使吩咐我说：“你要写上，凡被请赴羔羊之婚筵的有福了！”又对我说：“这是神真实的话。”"],[10,"我就俯伏在他脚前要拜他，他说：“千万不可！我和你，并你那些为耶稣作见证的弟兄同是作仆人的。你要敬拜神。”因为预言中的灵意乃是为耶稣作见证。"],[11,"我观看，见天开了。有一匹白马，骑在马上的称为诚信真实，他审判、争战都按着公义。"],[12,"他的眼睛如火焰，他头上戴着许多冠冕，又有写着的名字，除了他自己没有人知道。"],[13,"他穿着溅了血的衣服，他的名称为神之道。"],[14,"在天上的众军骑着白马，穿着细麻衣，又白又洁，跟随他。"],[15,"有利剑从他口中出来，可以击杀列国。他必用铁杖辖管他们（“辖管”原文作“牧”），并要踹全能神烈怒的酒醡。"],[16,"在他衣服和大腿上有名写着说：“万王之王，万主之主。”"],[17,"我又看见一位天使站在日头中，向天空所飞的鸟大声喊着说：“你们聚集来赴神的大筵席。"],[18,"可以吃君王与将军的肉，壮士与马和骑马者的肉，并一切自主的、为奴的，以及大小人民的肉。”"],[19,"我看见那兽和地上的君王，并他们的众军都聚集，要与骑白马的并他的军兵争战。"],[20,"那兽被擒拿，那在兽面前曾行奇事、迷惑受兽印记和拜兽像之人的假先知，也与兽同被擒拿。他们两个就活活地被扔在烧着硫磺的火湖里，"],[21,"其余的被骑白马者口中出来的剑杀了。飞鸟都吃饱了他们的肉。"]]},{"n":20,"v":[[1,"我又看见一位天使从天降下，手里拿着无底坑的钥匙和一条大链子。"],[2,"他捉住那龙，就是古蛇，又叫魔鬼，也叫撒但，把它捆绑一千年，"],[3,"扔在无底坑里，将无底坑关闭，用印封上，使它不得再迷惑列国。等到那一千年完了，以后必须暂时释放它。"],[4,"我又看见几个宝座，也有坐在上面的，并有审判的权柄赐给他们。我又看见那些因为给耶稣作见证、并为神之道被斩者的灵魂，和那没有拜过兽与兽像，也没有在额上和手上受过它印记之人的灵魂，他们都复活了，与基督一同作王一千年。"],[5,"这是头一次的复活。其余的死人还没有复活，直等那一千年完了。"],[6,"在头一次复活有份的有福了、圣洁了，第二次的死在他们身上没有权柄。他们必作神和基督的祭司，并要与基督一同作王一千年。"],[7,"那一千年完了，撒但必从监牢里被释放，"],[8,"出来要迷惑地上四方的列国（“方”原文作“角”），就是歌革和玛各，叫他们聚集争战。他们的人数多如海沙。"],[9,"他们上来遍满了全地，围住圣徒的营与蒙爱的城，就有火从天降下，烧灭了他们。"],[10,"那迷惑他们的魔鬼被扔在硫磺的火湖里，就是兽和假先知所在的地方。他们必昼夜受痛苦，直到永永远远。"],[11,"我又看见一个白色的大宝座与坐在上面的，从他面前天地都逃避，再无可见之处了。"],[12,"我又看见死了的人，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册。死了的人都凭着这些案卷所记载的，照他们所行的受审判。"],[13,"于是海交出其中的死人，死亡和阴间也交出其中的死人。他们都照各人所行的受审判。"],[14,"死亡和阴间也被扔在火湖里，这火湖就是第二次的死。"],[15,"若有人名字没记在生命册上，他就被扔在火湖里。"]]},{"n":21,"v":[[1,"我又看见一个新天新地，因为先前的天地已经过去了，海也不再有了。"],[2,"我又看见圣城新耶路撒冷由神那里从天而降，预备好了，就如新妇妆饰整齐，等候丈夫。"],[3,"我听见有大声音从宝座出来说：“看哪，神的帐幕在人间。他要与人同住，他们要作他的子民；神要亲自与他们同在，作他们的神。"],[4,"神要擦去他们一切的眼泪，不再有死亡，也不再有悲哀、哭号、疼痛，因为以前的事都过去了。”"],[5,"坐宝座的说：“看哪，我将一切都更新了。”又说：“你要写上，因这些话是可信的，是真实的。”"],[6,"他又对我说：“都成了！我是阿拉法，我是俄梅戛；我是初，我是终。我要将生命泉的水白白赐给那口渴的人喝。"],[7,"得胜的，必承受这些为业。我要作他的神，他要作我的儿子。"],[8,"惟有胆怯的、不信的、可憎的、杀人的、淫乱的、行邪术的、拜偶像的和一切说谎话的，他们的份就在烧着硫磺的火湖里，这是第二次的死。”"],[9,"拿着七个金碗、盛满末后七灾的七位天使中，有一位来对我说：“你到这里来，我要将新妇，就是羔羊的妻，指给你看。”"],[10,"我被圣灵感动，天使就带我到一座高大的山，将那由神那里从天而降的圣城耶路撒冷指示我。"],[11,"城中有神的荣耀。城的光辉如同极贵的宝石，好像碧玉，明如水晶。"],[12,"有高大的墙，有十二个门，门上有十二位天使，门上又写着以色列十二个支派的名字。"],[13,"东边有三门，北边有三门，南边有三门，西边有三门。"],[14,"城墙有十二根基，根基上有羔羊十二使徒的名字。"],[15,"对我说话的，拿着金苇子当尺，要量那城和城门、城墙。"],[16,"城是四方的，长宽一样。天使用苇子量那城，共有四千里，长、宽、高都是一样；"],[17,"又量了城墙，按着人的尺寸，就是天使的尺寸，共有一百四十四肘。"],[18,"墙是碧玉造的，城是精金的，如同明净的玻璃。"],[19,"城墙的根基是用各样宝石修饰的：第一根基是碧玉，第二是蓝宝石，第三是绿玛瑙，第四是绿宝石，"],[20,"第五是红玛瑙，第六是红宝石，第七是黄璧玺，第八是水苍玉，第九是红璧玺，第十是翡翠，第十一是紫玛瑙，第十二是紫晶。"],[21,"十二个门是十二颗珍珠，每门是一颗珍珠。城内的街道是精金，好像明透的玻璃。"],[22,"我未见城内有殿，因主神、全能者和羔羊为城的殿。"],[23,"那城内又不用日月光照，因有神的荣耀光照，又有羔羊为城的灯。"],[24,"列国要在城的光里行走，地上的君王必将自己的荣耀归与那城。"],[25,"城门白昼总不关闭，在那里原没有黑夜。"],[26,"人必将列国的荣耀、尊贵归与那城。"],[27,"凡不洁净的并那行可憎与虚谎之事的，总不得进那城；只有名字写在羔羊生命册上的才得进去。"]]},{"n":22,"v":[[1,"天使又指示我在城内街道当中一道生命水的河，明亮如水晶，从神和羔羊的宝座流出来。"],[2,"在河这边与那边有生命树，结十二样果子（“样”或作“回”），每月都结果子，树上的叶子乃为医治万民。"],[3,"以后再没有咒诅。在城里有神和羔羊的宝座，他的仆人都要侍奉他，"],[4,"也要见他的面。他的名字必写在他们的额上。"],[5,"不再有黑夜，他们也不用灯光、日光，因为主神要光照他们，他们要作王，直到永永远远。"],[6,"天使又对我说：“这些话是真实可信的。主就是众先知被感之灵的神，差遣他的使者，将那必要快成的事指示他仆人："],[7,"‘看哪，我必快来。凡遵守这书上预言的有福了！’”"],[8,"这些事是我约翰所听见、所看见的，我既听见、看见了，就在指示我的天使脚前俯伏要拜他。"],[9,"他对我说：“千万不可！我与你和你的弟兄众先知，并那些守这书上言语的人，同是作仆人的。你要敬拜神。”"],[10,"他又对我说：“不可封了这书上的预言，因为日期近了。"],[11,"不义的，叫他仍旧不义；污秽的，叫他仍旧污秽；为义的，叫他仍旧为义；圣洁的，叫他仍旧圣洁。”"],[12,"“看哪，我必快来。赏罚在我，要照各人所行的报应他。"],[13,"我是阿拉法，我是俄梅戛；我是首先的，我是末后的；我是初，我是终。”"],[14,"“那些洗净自己衣服的有福了！可得权柄能到生命树那里，也能从门进城。"],[15,"城外有那些犬类、行邪术的、淫乱的、杀人的、拜偶像的，并一切喜好说谎言、编造虚谎的。”"],[16,"“我耶稣差遣我的使者为众教会将这些事向你们证明。我是大卫的根，又是他的后裔。我是明亮的晨星。”"],[17,"圣灵和新妇都说：“来！”听见的人也该说：“来！”口渴的人也当来；愿意的，都可以白白取生命的水喝。"],[18,"我向一切听见这书上预言的作见证，若有人在这预言上加添什么，神必将写在这书上的灾祸加在他身上；"],[19,"这书上的预言，若有人删去什么，神必从这书上所写的生命树和圣城，删去他的份。"],[20,"证明这事的说：“是了，我必快来。”阿们！主耶稣啊，我愿你来！"],[21,"愿主耶稣的恩惠常与众圣徒同在。阿们！"]]}]}];
const META={"创世记": ["GENESIS", "旧约"], "出埃及记": ["EXODUS", "旧约"], "约伯记": ["JOB", "旧约"], "箴言": ["PROVERBS", "旧约"], "传道书": ["ECCLESIASTES", "旧约"], "雅歌": ["SONG OF SONGS", "旧约"], "以赛亚书": ["ISAIAH", "旧约"], "何西阿书": ["HOSEA", "旧约"], "阿摩司书": ["AMOS", "旧约"], "约拿书": ["JONAH", "旧约"], "马太福音": ["MATTHEW", "新约"], "路加福音": ["LUKE", "新约"], "约翰福音": ["JOHN", "新约"], "罗马书": ["ROMANS", "新约"], "哥林多前书": ["I CORINTHIANS", "新约"], "启示录": ["REVELATION", "新约"]};
const $=s=>document.querySelector(s);
let vi=0,ci=0,fs=17,q='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(t){
  if(!q)return esc(t);
  const i=t.toLowerCase().indexOf(q);
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function renderVols(){
  $('#vols').innerHTML=BIBLE.map((b,i)=>{
    const m=META[b.name]||['',''];
    return '<div class="vol'+(i===vi?' on':'')+'" data-v="'+i+'"><span class="grp">'+(m[1]||'')+'</span><span>'+b.name+'</span><span class="vnum">'+b.chapters.length+'</span></div>';
  }).join('');
  document.querySelectorAll('[data-v]').forEach(el=>el.onclick=()=>{vi=+el.dataset.v;ci=0;q='';$('#q').value='';renderVols();renderChs();renderText()});
}
function renderChs(){
  const b=BIBLE[vi];
  $('#chs').innerHTML=b.chapters.map((c,i)=>'<button class="'+(i===ci?'on':'')+'" data-c="'+i+'">'+c.n+'</button>').join('');
  document.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>{ci=+el.dataset.c;renderChs();renderText()});
  const on=$('#chs .on'); if(on)on.scrollIntoView({block:'nearest'});
}
function renderText(){
  const b=BIBLE[vi],c=b.chapters[ci],m=META[b.name]||['',''];
  let hits=0,html='';
  c.v.forEach(([n,t])=>{
    const appears=q?t.toLowerCase().includes(q):true;
    if(appears)hits++;
    if(q&&!appears)return;
    html+='<div class="verse"><span class="n">'+n+'</span><span class="t">'+hl(t)+'</span></div>';
  });
  $('#main').style.setProperty('--fs',fs+'px');
  $('#main').innerHTML='<div class="vhead"><h1>'+b.name+' 第'+c.n+'章</h1><div class="en">'+m[0]+' · '+m[1]+'</div><div class="loc">和合本 ｜ 本章 '+c.v.length+' 节'+(q?(' ｜ 命中 '+hits+' 节'):'')+'</div></div>'+(html||'<div style="color:var(--muted);padding:30px 0">本章没有匹配「'+esc(q)+'」的经文</div>');
}
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();renderText()};
$('#fsBtn').onclick=()=>{fs=fs>=24?15:fs+2;renderText()};
$('#themeBtn').onclick=()=>{const d=document.body.dataset.theme==='dark';document.body.dataset.theme=d?'':'dark';$('#themeBtn').textContent=d?'深色':'浅色'};
window.addEventListener('scroll',()=>{$('#backtop').style.display=scrollY>400?'block':'none'});
$('#backtop').onclick=()=>scrollTo({top:0,behavior:'smooth'});
// 支持 URL 参数 ?b=创世记&c=1
const p=new URLSearchParams(location.search);
const bn=p.get('b'),cn=parseInt(p.get('c')||'1');
if(bn){const i=BIBLE.findIndex(x=>x.name===bn);if(i>=0){vi=i;const j=BIBLE[i].chapters.findIndex(x=>x.n===cn);ci=j>=0?j:0}}
renderVols();renderChs();renderText();
</script>
