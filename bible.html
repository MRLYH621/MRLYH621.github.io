[2,"善人必蒙耶和华的恩惠，设诡计的人，耶和华必定他的罪。"],[3,"人靠恶行不能坚立，义人的根必不动摇。"],[4,"才德的妇人是丈夫的冠冕，贻羞的妇人如同朽烂在她丈夫的骨中。"],[5,"义人的思念是公平，恶人的计谋是诡诈。"],[6,"恶人的言论是埋伏流人的血，正直人的口必拯救人。"],[7,"恶人倾覆，归于无有；义人的家，必站得住。"],[8,"人必按自己的智慧被称赞，心中乖谬的，必被藐视。"],[9,"被人轻贱，却有仆人，强如自尊，缺少食物。"],[10,"义人顾惜他牲畜的命，恶人的怜悯也是残忍。"],[11,"耕种自己田地的，必得饱食，追随虚浮的，却是无知。"],[12,"恶人想得坏人的网罗，义人的根得以结实。"],[13,"恶人嘴中的过错，是自己的网罗，但义人必脱离患难。"],[14,"人因口所结的果子，必饱得美福，人手所作的，必为自己的报应。"],[15,"愚妄人所行的，在自己眼中看为正直，惟智慧人肯听人的劝教。"],[16,"愚妄人的恼怒立时显露，通达人能忍辱藏羞。"],[17,"说出真话的，显明公义；作假见证的，显出诡诈。"],[18,"说话浮躁的，如刀刺人，智慧人的舌头，却为医人的良药。"],[19,"口吐真言，永远坚立；舌说谎话，只存片时。"],[20,"图谋恶事的，心存诡诈，劝人和睦的，便得喜乐。"],[21,"义人不遭灾害，恶人满受祸患。"],[22,"说谎言的嘴，为耶和华所憎恶；行事诚实的，为他所喜悦。"],[23,"通达人隐藏知识，愚昧人的心彰显愚昧。"],[24,"殷勤人的手必掌权，懒惰的人必服苦。"],[25,"人心忧虑，屈而不伸，一句良言，使心欢乐。"],[26,"义人引导他的邻舍，恶人的道叫人失迷。"],[27,"懒惰的人不烤打猎所得的，殷勤的人却得宝贵的财物。"],[28,"在公义的道上有生命，其路之中并无死亡。"]]},{"n":13,"v":[[1,"智慧子听父亲的教训，亵慢人不听责备。"],[2,"人因口所结的果子，必享美福，奸诈人必遭强暴。"],[3,"谨守口的，得保生命；大张嘴的，必致败亡。"],[4,"懒惰人羡慕，却无所得，殷勤人必得丰裕。"],[5,"义人恨恶谎言，恶人有臭名，且致惭愧。"],[6,"行为正直的，有公义保守，犯罪的，被邪恶倾覆。"],[7,"假作富足的，却一无所有，装作穷乏的，却广有财物。"],[8,"人的资财，是他生命的赎价，穷乏人却听不见威吓的话。"],[9,"义人的光明亮（“明亮”原文作“欢喜”），恶人的灯要熄灭。"],[10,"骄傲只启争竞，听劝言的，却有智慧。"],[11,"不劳而得之财必然消耗；勤劳积蓄的必见加增。"],[12,"所盼望的迟延未得，令人心忧，所愿意的临到，却是生命树。"],[13,"藐视训言的，自取灭亡，敬畏诫命的，必得善报。"],[14,"智慧人的法则（或作“指教”）是生命的泉源，可以使人离开死亡的网罗。"],[15,"美好的聪明，使人蒙恩，奸诈人的道路，崎岖难行。"],[16,"凡通达人都凭知识行事，愚昧人张扬自己的愚昧。"],[17,"奸恶的使者必陷在祸患里，忠信的使臣乃医人的良药。"],[18,"弃绝管教的，必致贫受辱；领受责备的，必得尊荣。"],[19,"所欲的成就，心觉甘甜，远离恶事，为愚昧人所憎恶。"],[20,"与智慧人同行的，必得智慧；和愚昧人作伴的，必受亏损。"],[21,"祸患追赶罪人，义人必得善报。"],[22,"善人给子孙遗留产业，罪人为义人积存资财。"],[23,"穷人耕种多得粮食，但因不义，有消灭的。"],[24,"不忍用杖打儿子的，是恨恶他，疼爱儿子的，随时管教。"],[25,"义人吃得饱足，恶人肚腹缺粮。"]]},{"n":14,"v":[[1,"智慧妇人建立家室，愚妄妇人亲手拆毁。"],[2,"行动正直的，敬畏耶和华，行事乖僻的，却藐视他。"],[3,"愚妄人口中骄傲，如杖责打己身，智慧人的嘴，必保守自己。"],[4,"家里无牛，槽头干净，土产加多，乃凭牛力。"],[5,"诚实见证人，不说谎话；假见证人，吐出谎言。"],[6,"亵慢人寻智慧，却寻不着，聪明人易得知识。"],[7,"到愚昧人面前，不见他嘴中有知识。"],[8,"通达人的智慧，在乎明白己道，愚昧人的愚妄，乃是诡诈（或作“自叹”）。"],[9,"愚妄人犯罪，以为戏耍（或作“赎愆祭愚弄愚妄人”），正直人互相喜悦。"],[10,"心中的苦楚，自己知道；心里的喜乐，外人无干。"],[11,"奸恶人的房屋必倾倒；正直人的帐棚必兴盛。"],[12,"有一条路人以为正，至终成为死亡之路。"],[13,"人在喜笑中，心也忧愁，快乐至极，就生愁苦。"],[14,"心中背道的，必满得自己的结果，善人必从自己的行为得以知足。"],[15,"愚蒙人是话都信；通达人步步谨慎。"],[16,"智慧人惧怕，就远离恶事，愚妄人却狂傲自恃。"],[17,"轻易发怒的，行事愚妄；设立诡计的，被人恨恶。"],[18,"愚蒙人得愚昧为产业；通达人得知识为冠冕。"],[19,"坏人俯伏在善人面前；恶人俯伏在义人门口。"],[20,"贫穷人连邻舍也恨他，富足人朋友最多。"],[21,"藐视邻舍的，这人有罪；怜悯贫穷的，这人有福。"],[22,"谋恶的，岂非走入迷途吗？谋善的，必得慈爱和诚实。"],[23,"诸般勤劳都有益处，嘴上多言乃致穷乏。"],[24,"智慧人的财，为自己的冠冕，愚妄人的愚昧，终是愚昧。"],[25,"作真见证的，救人性命；吐出谎言的，施行诡诈。"],[26,"敬畏耶和华的，大有倚靠，他的儿女，也有避难所。"],[27,"敬畏耶和华，就是生命的泉源，可以使人离开死亡的网罗。"],[28,"帝王荣耀在乎民多；君王衰败在乎民少。"],[29,"不轻易发怒的，大有聪明；性情暴躁的，大显愚妄。"],[30,"心中安静，是肉体的生命，嫉妒是骨中的朽烂。"],[31,"欺压贫寒的，是辱没造他的主，怜悯穷乏的，乃是尊敬主。"],[32,"恶人在所行的恶上必被推倒，义人临死，有所投靠。"],[33,"智慧存在聪明人心中，愚昧人心里所存的，显而易见。"],[34,"公义使邦国高举，罪恶是人民的羞辱。"],[35,"智慧的臣子蒙王恩惠；贻羞的仆人遭其震怒。"]]},{"n":15,"v":[[1,"回答柔和，使怒消退；言语暴戾，触动怒气。"],[2,"智慧人的舌善发知识；愚昧人的口吐出愚昧。"],[3,"耶和华的眼目无处不在，恶人善人，他都鉴察。"],[4,"温良的舌是生命树，乖谬的嘴使人心碎。"],[5,"愚妄人藐视父亲的管教，领受责备的，得着见识。"],[6,"义人家中多有财宝；恶人得利反受扰害。"],[7,"智慧人的嘴播扬知识，愚昧人的心并不如此。"],[8,"恶人献祭，为耶和华所憎恶；正直人祈祷，为他所喜悦。"],[9,"恶人的道路，为耶和华所憎恶；追求公义的，为他所喜爱。"],[10,"舍弃正路的，必受严刑；恨恶责备的，必致死亡。"],[11,"阴间和灭亡尚在耶和华眼前，何况世人的心呢？"],[12,"亵慢人不爱受责备，他也不就近智慧人。"],[13,"心中喜乐，面带笑容；心里忧愁，灵被损伤。"],[14,"聪明人心求知识；愚昧人口吃愚昧。"],[15,"困苦人的日子都是愁苦，心中欢畅的，常享丰筵。"],[16,"少有财宝，敬畏耶和华，强如多有财宝，烦乱不安。"],[17,"吃素菜，彼此相爱，强如吃肥牛，彼此相恨。"],[18,"暴怒的人挑启争端，忍怒的人止息纷争。"],[19,"懒惰人的道，像荆棘的篱笆；正直人的路，是平坦的大道。"],[20,"智慧子使父亲喜乐，愚昧人藐视母亲。"],[21,"无知的人以愚妄为乐；聪明的人按正直而行。"],[22,"不先商议，所谋无效；谋士众多，所谋乃成。"],[23,"口善应对，自觉喜乐，话合其时，何等美好。"],[24,"智慧人从生命的道上升，使他远离在下的阴间。"],[25,"耶和华必拆毁骄傲人的家，却要立定寡妇的地界。"],[26,"恶谋为耶和华所憎恶，良言乃为纯净。"],[27,"贪恋财利的，扰害己家；恨恶贿赂的，必得存活。"],[28,"义人的心，思量如何回答，恶人的口，吐出恶言。"],[29,"耶和华远离恶人，却听义人的祷告。"],[30,"眼有光，使心喜乐；好信息，使骨滋润。"],[31,"听从生命责备的，必常在智慧人中。"],[32,"弃绝管教的，轻看自己的生命，听从责备的，却得智慧。"],[33,"敬畏耶和华，是智慧的训诲，尊荣以前，必有谦卑。"]]},{"n":16,"v":[[1,"心中的谋算在乎人，舌头的应对由于耶和华。"],[2,"人一切所行的，在自己眼中看为清洁，惟有耶和华衡量人心。"],[3,"你所作的，要交托耶和华，你所谋的，就必成立。"],[4,"耶和华所造的，各适其用，就是恶人，也为祸患的日子所造。"],[5,"凡心里骄傲的，为耶和华所憎恶，虽然连手，他必不免受罚。"],[6,"因怜悯诚实，罪孽得赎，敬畏耶和华的，远离恶事。"],[7,"人所行的，若蒙耶和华喜悦，耶和华也使他的仇敌与他和好。"],[8,"多有财利，行事不义，不如少有财利，行事公义。"],[9,"人心筹算自己的道路，惟耶和华指引他的脚步。"],[10,"王的嘴中有神语，审判之时，他的口必不差错。"],[11,"公道的天平和秤都属耶和华，囊中一切法码都为他所定。"],[12,"作恶，为王所憎恶，因国位是靠公义坚立。"],[13,"公义的嘴为王所喜悦，说正直话的，为王所喜爱。"],[14,"王的震怒如杀人的使者，但智慧人能止息王怒。"],[15,"王的脸光使人有生命，王的恩典好像春云时雨。"],[16,"得智慧胜似得金子；选聪明强如选银子。"],[17,"正直人的道，是远离恶事；谨守己路的，是保全性命。"],[18,"骄傲在败坏以先；狂心在跌倒之前。"],[19,"心里谦卑与穷乏人来往，强如将掳物与骄傲人同分。"],[20,"谨守训言的，必得好处，倚靠耶和华的，便为有福。"],[21,"心中有智慧，必称为通达人；嘴中的甜言，加增人的学问。"],[22,"人有智慧就有生命的泉源，愚昧人必被愚昧惩治。"],[23,"智慧人的心教训他的口，又使他的嘴增长学问。"],[24,"良言如同蜂房，使心觉甘甜，使骨得医治。"],[25,"有一条路，人以为正，至终成为死亡之路。"],[26,"劳力人的胃口使他劳力，因为他的口腹催逼他。"],[27,"匪徒图谋奸恶，嘴上彷佛有烧焦的火。"],[28,"乖僻人播散纷争，传舌的离间密友。"],[29,"强暴人诱惑邻舍，领他走不善之道。"],[30,"眼目紧合的，图谋乖僻；嘴唇紧闭的，成就邪恶。"],[31,"白发是荣耀的冠冕，在公义的道上，必能得着。"],[32,"不轻易发怒的，胜过勇士；治服己心的，强如取城。"],[33,"签放在怀里，定事由耶和华。"]]},{"n":17,"v":[[1,"设筵满屋，大家相争，不如有块干饼，大家相安。"],[2,"仆人办事聪明，必管辖贻羞之人，又在众子中同分产业。"],[3,"鼎为炼银，炉为炼金，惟有耶和华熬炼人心。"],[4,"行恶的，留心听奸诈之言；说谎的，侧耳听邪恶之语。"],[5,"戏笑穷人的，是辱没造他的主，幸灾乐祸的，必不免受罚。"],[6,"子孙为老人的冠冕；父亲是儿女的荣耀。"],[7,"愚顽人说美言本不相宜，何况君王说谎话呢？"],[8,"贿赂在馈送的人眼中看为宝玉，随处运动都得顺利。"],[9,"遮掩人过的，寻求人爱；屡次挑错的，离间密友。"],[10,"一句责备话深入聪明人的心，强如责打愚昧人一百下。"],[11,"恶人只寻背叛，所以必有严厉的使者，奉差攻击他。"],[12,"宁可遇见丢崽子的母熊，不可遇见正行愚妄的愚昧人。"],[13,"以恶报善的，祸患必不离他的家。"],[14,"纷争的起头如水放开，所以在争闹之先，必当止息争竞。"],[15,"定恶人为义的，定义人为恶的，这都为耶和华所憎恶。"],[16,"愚昧人既无聪明，为何手拿价银买智慧呢？"],[17,"朋友乃时常亲爱；弟兄为患难而生。"],[18,"在邻舍面前击掌作保，乃是无知的人。"],[19,"喜爱争竞的，是喜爱过犯；高立家门的，乃自取败坏。"],[20,"心存邪僻的，寻不着好处；舌弄是非的，陷在祸患中。"],[21,"生愚昧子的，必自愁苦，愚顽人的父毫无喜乐。"],[22,"喜乐的心，乃是良药；忧伤的灵，使骨枯干。"],[23,"恶人暗中受贿赂，为要颠倒判断。"],[24,"明哲人眼前有智慧，愚昧人眼望地极。"],[25,"愚昧子使父亲愁烦，使母亲忧苦。"],[26,"刑罚义人为不善；责打君子为不义。"],[27,"寡少言语的有知识；性情温良的有聪明。"],[28,"愚昧人若静默不言，也可算为智慧，闭口不说，也可算为聪明。"]]},{"n":18,"v":[[1,"与众寡合的，独自寻求心愿，并恼恨一切真智慧。"],[2,"愚昧人不喜爱明哲，只喜爱显露心意。"],[3,"恶人来，藐视随来；羞耻到，辱骂同到。"],[4,"人口中的言语如同深水，智慧的泉源好像涌流的河水。"],[5,"瞻徇恶人的情面，偏断义人的案件，都为不善。"],[6,"愚昧人张嘴启争端，开口招鞭打。"],[7,"愚昧人的口自取败坏，他的嘴是他生命的网罗。"],[8,"传舌人的言语，如同美食深入人的心腹。"],[9,"作工懈怠的，与浪费人为弟兄。"],[10,"耶和华的名是坚固台，义人奔入，便得安稳。"],[11,"富足人的财物是他的坚城，在他心想，犹如高墙。"],[12,"败坏之先，人心骄傲；尊荣以前，必有谦卑。"],[13,"未曾听完先回答的，便是他的愚昧和羞辱。"],[14,"人有疾病，心能忍耐，心灵忧伤，谁能承当呢？"],[15,"聪明人的心得知识，智慧人的耳求知识，"],[16,"人的礼物为他开路，引他到高位的人面前。"],[17,"先诉情由的，似乎有理，但邻舍来到，就察出实情。"],[18,"掣签能止息争竞，也能解散强胜的人。"],[19,"弟兄结怨，劝他和好，比取坚固城还难，这样的争竞，如同坚寨的门闩。"],[20,"人口中所结的果子，必充满肚腹；他嘴所出的，必使他饱足。"],[21,"生死在舌头的权下，喜爱它的，必吃它所结的果子。"],[22,"得着贤妻的，是得着好处，也是蒙了耶和华的恩惠。"],[23,"贫穷人说哀求的话，富足人用威吓的话回答。"],[24,"滥交朋友的，自取败坏，但有一朋友，比弟兄更亲密。"]]},{"n":19,"v":[[1,"行为纯正的贫穷人，胜过乖谬愚妄的富足人。"],[2,"心无知识的，乃为不善；脚步急快的，难免犯罪。"],[3,"人的愚昧倾败他的道，他的心也抱怨耶和华。"],[4,"财物使朋友增多，但穷人朋友远离。"],[5,"作假见证的，必不免受罚；吐出谎言的，终不能逃脱。"],[6,"好施散的，有多人求他的恩情；爱送礼的，人都为他的朋友。"],[7,"贫穷人，弟兄都恨他，何况他的朋友，更远离他，他用言语追随，他们却走了。"],[8,"得着智慧的，爱惜生命；保守聪明的，必得好处。"],[9,"作假见证的，不免受罚；吐出谎言的，也必灭亡。"],[10,"愚昧人宴乐度日，是不合宜的，何况仆人管辖王子呢？"],[11,"人有见识，就不轻易发怒，宽恕人的过失，便是自己的荣耀。"],[12,"王的忿怒好像狮子吼叫，他的恩典却如草上的甘露。"],[13,"愚昧的儿子是父亲的祸患，妻子的争吵如雨连连滴漏。"],[14,"房屋钱财是祖宗所遗留的，惟有贤慧的妻是耶和华所赐的。"],[15,"懒惰使人沉睡，懈怠的人必受饥饿。"],[16,"谨守诫命的，保全生命；轻忽己路的，必致死亡。"],[17,"怜悯贫穷的，就是借给耶和华，他的善行，耶和华必偿还。"],[18,"趁有指望，管教你的儿子，你的心不可任他死亡。"],[19,"暴怒的人必受刑罚，你若救他，必须再救。"],[20,"你要听劝教、受训诲，使你终久有智慧。"],[21,"人心多有计谋，惟有耶和华的筹算，才能立定。"],[22,"施行仁慈的，令人爱慕，穷人强如说谎言的。"],[23,"敬畏耶和华的，得着生命，他必恒久知足，不遭祸患。"],[24,"懒惰人放手在盘子里，就是向口撤回，他也不肯。"],[25,"鞭打亵慢人，愚蒙人必长见识；责备明哲人，他就明白知识。"],[26,"虐待父亲、撵出母亲的，是贻羞致辱之子。"],[27,"我儿，不可听了教训，而又偏离知识的言语。"],[28,"匪徒作见证戏笑公平，恶人的口吞下罪孽。"],[29,"刑罚是为亵慢人预备的；鞭打是为愚昧人的背预备的。"]]},{"n":20,"v":[[1,"酒能使人亵慢，浓酒使人喧嚷，凡因酒错误的，就无智慧。"],[2,"王的威吓，如同狮子吼叫，惹动他怒的，是自害己命。"],[3,"远离纷争，是人的尊荣，愚妄人都爱争闹。"],[4,"懒惰人因冬寒不肯耕种，到收割的时候，他必讨饭而无所得。"],[5,"人心怀藏谋略，好像深水，惟明哲人才能汲引出来。"],[6,"人多述说自己的仁慈，但忠信人谁能遇着呢？"],[7,"行为纯正的义人，他的子孙是有福的。"],[8,"王坐在审判的位上，以眼目驱散诸恶。"],[9,"谁能说，我洁净了我的心，我脱净了我的罪？"],[10,"两样的法码，两样的升斗，都为耶和华所憎恶。"],[11,"孩童的动作，是清洁、是正直，都显明他的本性。"],[12,"能听的耳，能看的眼，都是耶和华所造的。"],[13,"不要贪睡，免致贫穷；眼要睁开，你就吃饱。"],[14,"买物的说：“不好，不好”及至买去，他便自夸。"],[15,"有金子和许多珍珠（或作“红宝石”），惟有知识的嘴，乃为贵重的珍宝。"],[16,"谁为生人作保，就拿谁的衣服；谁为外人作保，谁就要承当。"],[17,"以虚谎而得的食物，人觉甘甜，但后来他的口必充满尘沙。"],[18,"计谋都凭筹算立定，打仗要凭智谋。"],[19,"往来传舌的泄漏密事，大张嘴的，不可与他结交。"],[20,"咒骂父母的，他的灯必灭，变为漆黑的黑暗。"],[21,"起初速得的产业，终久却不为福。"],[22,"你不要说，我要以恶报恶。要等候耶和华，他必拯救你。"],[23,"两样的法码，为耶和华所憎恶，诡诈的天平也为不善。"],[24,"人的脚步为耶和华所定，人岂能明白自己的路呢？"],[25,"人冒失说，这是圣物，许愿之后才查问，就是自陷网罗。"],[26,"智慧的王簸散恶人，用碌碡滚轧他们。"],[27,"人的灵是耶和华的灯，鉴察人的心腹。"],[28,"王因仁慈和诚实，得以保全他的国位，也因仁慈立稳。"],[29,"强壮乃少年人的荣耀；白发为老年人的尊荣。"],[30,"鞭伤除净人的罪恶；责打能入人的心腹。"]]},{"n":21,"v":[[1,"王的心在耶和华手中，好像陇沟的水随意流转。"],[2,"人所行的，在自己眼中都看为正，惟有耶和华衡量人心。"],[3,"行仁义公平，比献祭更蒙耶和华悦纳。"],[4,"恶人发达，眼高心傲，这乃是罪（“发达”原文作“灯”）。"],[5,"殷勤筹划的，足致丰裕；行事急躁的，都必缺乏。"],[6,"用诡诈之舌求财的，就是自己取死，所得之财，乃是吹来吹去的浮云。"],[7,"恶人的强暴，必将自己扫除，因他们不肯按公平行事。"],[8,"负罪之人的路，甚是弯曲，至于清洁的人，他所行的乃是正直。"],[9,"宁可住在房顶的角上，不在宽阔的房屋与争吵的妇人同住。"],[10,"恶人的心，乐人受祸，他眼并不怜恤邻舍。"],[11,"亵慢的人受刑罚，愚蒙的人就得智慧，智慧人受训诲，便得知识。"],[12,"义人思想恶人的家，知道恶人倾倒，必致灭亡。"],[13,"塞耳不听穷人哀求的，他将来呼吁也不蒙应允。"],[14,"暗中送的礼物，挽回怒气；怀中搋的贿赂，止息暴怒。"],[15,"秉公行义使义人喜乐，使作孽的人败坏。"],[16,"迷离通达道路的，必住在阴魂的会中。"],[17,"爱宴乐的，必致穷乏；好酒、爱膏油的，必不富足。"],[18,"恶人作了义人的赎价，奸诈人代替正直人。"],[19,"宁可住在旷野，不与争吵使气的妇人同住。"],[20,"智慧人家中积蓄宝物膏油，愚昧人随得来随吞下。"],[21,"追求公义仁慈的，就寻得生命、公义和尊荣。"],[22,"智慧人爬上勇士的城墙，倾覆他所倚靠的坚垒。"],[23,"谨守口与舌的，就保守自己免受灾难。"],[24,"心骄气傲的人，名叫亵慢，他行事狂妄，都出于骄傲。"],[25,"懒惰人的心愿将他杀害，因为他手不肯作工。"],[26,"有终日贪得无餍的，义人施舍而不吝惜。"],[27,"恶人的祭物是可憎的，何况他存恶意来献呢？"],[28,"作假见证的必灭亡，惟有听真情而言的，其言长存。"],[29,"恶人脸无羞耻，正直人行事坚定。"],[30,"没有人能以智慧、聪明、谋略敌挡耶和华。"],[31,"马是为打仗之日预备的，得胜乃在乎耶和华。"]]},{"n":22,"v":[[1,"美名胜过大财；恩宠强如金银。"],[2,"富户穷人在世相遇，都为耶和华所造。"],[3,"通达人见祸藏躲；愚蒙人前往受害。"],[4,"敬畏耶和华心存谦卑，就得富有、尊荣、生命为赏赐。"],[5,"乖僻人的路上，有荆棘和网罗，保守自己生命的，必要远离。"],[6,"教养孩童，使他走当行的道，就是到老他也不偏离。"],[7,"富户管辖穷人，欠债的是债主的仆人。"],[8,"撒罪孽的，必收灾祸，他逞怒的杖，也必废掉。"],[9,"眼目慈善的，就必蒙福，因他将食物分给穷人。"],[10,"赶出亵慢人，争端就消除，纷争和羞辱也必止息。"],[11,"喜爱清心的人，因他嘴上的恩言，王必与他为友。"],[12,"耶和华的眼目眷顾聪明人，却倾败奸诈人的言语。"],[13,"懒惰人说，外头有狮子，我在街上就必被杀。"],[14,"淫妇的口为深坑，耶和华所憎恶的，必陷在其中。"],[15,"愚蒙迷住孩童的心，用管教的杖可以远远赶除。"],[16,"欺压贫穷为要利己的，并送礼与富户的，都必缺乏。"],[17,"你须侧耳听受智慧人的言语，留心领会我的知识；"],[18,"你若心中存记，嘴上咬定，这便为美。"],[19,"我今日以此特别指教你，为要使你倚靠耶和华。"],[20,"谋略和知识的美事，我岂没有写给你吗？"],[21,"要使你知道真言的实理，你好将真言回复那打发你来的人。"],[22,"贫穷人，你不可因他贫穷就抢夺他的物，也不可在城门口欺压困苦人。"],[23,"因耶和华必为他辨屈，抢夺他的，耶和华必夺取那人的命。"],[24,"好生气的人，不可与他结交；暴怒的人，不可与他来往，"],[25,"恐怕你效法他的行为，自己就陷在网罗里。"],[26,"不要与人击掌，不要为欠债的作保。"],[27,"你若没有什么偿还，何必使人夺去你睡卧的床呢？"],[28,"你先祖所立的地界，你不可挪移。"],[29,"你看见办事殷勤的人吗？他必站在君王面前，必不站在下贱人面前。"]]},{"n":23,"v":[[1,"你若与官长坐席，要留意在你面前的是谁。"],[2,"你若是贪食的，就当拿刀放在喉咙上。"],[3,"不可贪恋他的美食，因为是哄人的食物。"],[4,"不要劳碌求富，休仗自己的聪明。"],[5,"你岂要定睛在虚无的钱财上吗？因钱财必长翅膀，如鹰向天飞去。"],[6,"不要吃恶眼人的饭，也不要贪他的美味。"],[7,"因为他心怎样思量，他为人就是怎样。他虽对你说：“请吃，请喝”，他的心却与你相背。"],[8,"你所吃的那点食物必吐出来，你所说的甘美言语也必落空。"],[9,"你不要说话给愚昧人听，因他必藐视你智慧的言语。"],[10,"不可挪移古时的地界，也不可侵入孤儿的田地。"],[11,"因他们的救赎主大有能力，他必向你为他们辨屈。"],[12,"你要留心领受训诲，侧耳听从知识的言语。"],[13,"不可不管教孩童，你用杖打他，他必不至于死。"],[14,"你要用杖打他，就可以救他的灵魂免下阴间。"],[15,"我儿，你心若存智慧，我的心也甚欢喜，"],[16,"你的嘴若说正直话，我的心肠也必快乐。"],[17,"你心中不要嫉妒罪人，只要终日敬畏耶和华。"],[18,"因为至终必有善报，你的指望也不至断绝。"],[19,"我儿，你当听，当存智慧，好在正道上引导你的心。"],[20,"好饮酒的，好吃肉的，不要与他们来往。"],[21,"因为好酒贪食的，必致贫穷，好睡觉的，必穿破烂衣服。"],[22,"你要听从生你的父亲，你母亲老了，也不可藐视她。"],[23,"你当买真理，就是智慧、训诲和聪明也都不可卖。"],[24,"义人的父亲必大得快乐，人生智慧的儿子，必因他欢喜。"],[25,"你要使父母欢喜，使生你的快乐。"],[26,"我儿，要将你的心归我，你的眼目也要喜悦我的道路。"],[27,"妓女是深坑；外女是窄阱。"],[28,"她埋伏好像强盗，她使人中多有奸诈的。"],[29,"谁有祸患？谁有忧愁？谁有争斗？谁有哀叹（或作“怨言”）？谁无故受伤？谁眼目红赤？"],[30,"就是那流连饮酒，常去寻找调和酒的人。"],[31,"-"],[32,"酒发红，在杯中闪烁，你不可观看，虽然下咽舒畅，终久是咬你如蛇，刺你如毒蛇。"],[33,"你眼必看见异怪的事（“异怪的事”或作“淫妇”），你心必发出乖谬的话。"],[34,"你必像躺在海中，或像卧在桅杆上。"],[35,"你必说：“人打我，我却未受伤；人鞭打我，我竟不觉得。我几时清醒，我仍去寻酒。”"]]},{"n":24,"v":[[1,"你不要嫉妒恶人，也不要起意与他们相处，"],[2,"因为他们的心图谋强暴，他们的口谈论奸恶。"],[3,"房屋因智慧建造，又因聪明立稳，"],[4,"其中因知识充满各样美好宝贵的财物。"],[5,"智慧人大有能力，有知识的人力上加力。"],[6,"你去打仗，要凭智谋；谋士众多，人便得胜。"],[7,"智慧极高，非愚昧人所能及，所以在城门内不敢开口。"],[8,"设计作恶的，必称为奸人。"],[9,"愚妄人的思念乃是罪恶，亵慢者为人所憎恶。"],[10,"你在患难之日若胆怯，你的力量就微小。"],[11,"人被拉到死地，你要解救；人将被杀，你须拦阻。"],[12,"你若说：“这事我未曾知道”，那衡量人心的岂不明白吗？保守你命的岂不知道吗？他岂不按各人所行的报应各人吗？"],[13,"我儿，你要吃蜜，因为是好的，吃蜂房下滴的蜜便觉甘甜。"],[14,"你心得了智慧，也必觉得如此，你若找着，至终必有善报，你的指望，也不至断绝。"],[15,"你这恶人，不要埋伏攻击义人的家，不要毁坏他安居之所。"],[16,"因为义人虽七次跌倒，仍必兴起，恶人却被祸患倾倒。"],[17,"你仇敌跌倒，你不要欢喜；他倾倒，你心不要快乐，"],[18,"恐怕耶和华看见就不喜悦，将怒气从仇敌身上转过来。"],[19,"不要为作恶的心怀不平，也不要嫉妒恶人，"],[20,"因为恶人终不得善报，恶人的灯，也必熄灭。"],[21,"我儿，你要敬畏耶和华与君王，不要与反复无常的人结交，"],[22,"因为他们的灾难必忽然而起。耶和华与君王所施行的毁灭，谁能知道呢？"],[23,"以下也是智慧人的箴言：审判时看人情面是不好的。"],[24,"对恶人说“你是义人”的，这人万民必咒诅，列邦必憎恶。"],[25,"责备恶人的，必得喜悦，美好的福也必临到他。"],[26,"应对正直的，犹如与人亲嘴。"],[27,"你要在外头预备工料，在田间办理整齐，然后建造房屋。"],[28,"不可无故作见证陷害邻舍，也不可用嘴欺骗人。"],[29,"不可说：“人怎样待我，我也怎样待他，我必照他所行的报复他。”"],[30,"我经过懒惰人的田地、无知人的葡萄园，"],[31,"荆棘长满了地皮，刺草遮盖了田面，石墙也坍塌了。"],[32,"我看见就留心思想，我看着就领了训诲。"],[33,"再睡片时，打盹片时，抱着手躺卧片时，"],[34,"你的贫穷，就必如强盗速来；你的缺乏，彷佛拿兵器的人来到。"]]},{"n":25,"v":[[1,"以下也是所罗门的箴言，是犹大王希西家的人所誊录的。"],[2,"将事隐秘，乃神的荣耀；将事察清，乃君王的荣耀。"],[3,"天之高，地之厚，君王之心也测不透。"],[4,"除去银子的渣滓，就有银子出来，银匠能以作器皿；"],[5,"除去王面前的恶人，国位就靠公义坚立。"],[6,"不要在王面前妄自尊大，不要在大人的位上站立。"],[7,"宁可有人说：请你上来，强如在你觐见的王子面前叫你退下。"],[8,"不要冒失出去与人争竞，免得至终被他羞辱，你就不知道怎样行了。"],[9,"你与邻舍争讼，要与他一人辩论，不可泄漏人的密事，"],[10,"恐怕听见的人骂你，你的臭名就难以脱离。"],[11,"一句话说得合宜，就如金苹果在银网子里。"],[12,"智慧人的劝戒，在顺从的人耳中，好象金耳环和精金的妆饰。"],[13,"忠信的使者，叫差他的人心里舒畅，就如在收割时，有冰雪的凉气。"],[14,"空夸赠送礼物的，好象无雨的风云。"],[15,"恒常忍耐可以劝动君王，柔和的舌头能折断骨头。"],[16,"你得了蜜吗？只可吃够而已，恐怕你过饱就呕吐出来。"],[17,"你的脚要少进邻舍的家，恐怕他厌烦你，恨恶你。"],[18,"作假见证陷害邻舍的，就是大槌，是利刀，是快箭。"],[19,"患难时倚靠不忠诚的人，好象破坏的牙，错骨缝的脚。"],[20,"对伤心的人唱歌，就如冷天脱衣服，又如碱上倒醋。"],[21,"你的仇敌若饿了，就给他饭吃，若渴了，就给他水喝；"],[22,"因为你这样行，就是把炭火堆在他的头上；耶和华也必赏赐你。"],[23,"北风生雨，谗谤人的舌头也生怒容。"],[24,"宁可住在房顶的角上，不在宽阔的房屋与争吵的妇人同住。"],[25,"有好消息从远方来，就如拿凉水给口渴的人喝。"],[26,"义人在恶人面前退缩，好象趟浑之泉，弄浊之井。"],[27,"吃蜜过多是不好的，考究自己的荣耀也是可厌的。"],[28,"人不制伏自己的心，好象毁坏的城邑，没有墙垣。"]]},{"n":26,"v":[[1,"夏天落雪，收割时下雨，都不相宜，愚昧人得尊荣也是如此。"],[2,"麻雀往来，燕子翻飞，这样，无故的咒诅也必不临到。"],[3,"鞭子是为打马；辔头是为勒驴；刑杖是为打愚昧人的背。"],[4,"不要照愚昧人的愚妄话回答他，恐怕你与他一样。"],[5,"要照愚昧人的愚妄话回答他，免得他自以为有智慧。"],[6,"藉愚昧人手寄信的，是砍断自己的脚，自受损害（“自受”原文作“喝”）。"],[7,"瘸子的脚空存无用，箴言在愚昧人的口中也是如此。"],[8,"将尊荣给愚昧人的，好像人把石子包在机弦里。"],[9,"箴言在愚昧人的口中，好像荆棘刺入醉汉的手。"],[10,"雇愚昧人的，与雇过路人的，就像射伤众人的弓箭手。"],[11,"愚昧人行愚妄事，行了又行，就如狗转过来吃它所吐的。"],[12,"你见自以为有智慧的人吗？愚昧人比他更有指望。"],[13,"懒惰人说：“道上有猛狮，街上有壮狮。”"],[14,"门在枢纽转动，懒惰人在床上也是如此。"],[15,"懒惰人放手在盘子里，就是向口撤回也以为劳乏。"],[16,"懒惰人看自己，比七个善于应对的人更有智慧。"],[17,"过路被事激动，管理不干己的争竞，好像人揪住狗耳。"],[18,"-"],[19,"人欺凌邻舍，却说：“我岂不是戏耍吗？”他就像疯狂的人，抛掷火把、利箭与杀人的兵器（“杀人的兵器”原文作“死亡”）。"],[20,"火缺了柴就必熄灭，无人传舌，争竞便止息。"],[21,"好争竞的人煽惑争端，就如余火加炭，火上加柴一样。"],[22,"传舌人的言语，如同美食，深入人的心腹。"],[23,"火热的嘴，奸恶的心，好像银渣包的瓦器。"],[24,"怨恨人的，用嘴粉饰，心里却藏着诡诈。"],[25,"他用甜言蜜语，你不可信他，因为他心中有七样可憎恶的。"],[26,"他虽用诡诈遮掩自己的怨恨，他的邪恶必在会中显露。"],[27,"挖陷坑的，自己必掉在其中；滚石头的，石头必反滚在他身上。"],[28,"虚谎的舌，恨他所压伤的人，谄媚的口败坏人的事。"]]},{"n":27,"v":[[1,"不要为明日自夸，因为一日要生何事，你尚且不能知道。"],[2,"要别人夸奖你，不可用口自夸，等外人称赞你，不可用嘴自称。"],[3,"石头重，沙土沉，愚妄人的恼怒，比这两样更重。"],[4,"忿怒为残忍，怒气为狂澜，惟有嫉妒，谁能敌得住呢？"],[5,"当面的责备，强如背地的爱情。"],[6,"朋友加的伤痕出于忠诚；仇敌连连亲嘴却是多余。"],[7,"人吃饱了，厌恶蜂房的蜜；人饥饿了，一切苦物都觉甘甜。"],[8,"人离本处飘流，好像雀鸟离窝游飞。"],[9,"膏油与香料使人心喜悦，朋友诚实的劝教也是如此甘美。"],[10,"你的朋友和父亲的朋友，你都不可离弃。你遭难的日子，不要上弟兄的家去，相近的邻舍强如远方的弟兄。"],[11,"我儿，你要作智慧人，好叫我的心欢喜，使我可以回答那讥诮我的人。"],[12,"通达人见祸藏躲；愚蒙人前往受害。"],[13,"谁为生人作保，就拿谁的衣服；谁为外女作保，谁就承当。"],[14,"清晨起来，大声给朋友祝福的，就算是咒诅他。"],[15,"大雨之日，连连滴漏，和争吵的妇人一样；"],[16,"想拦阻她的，便是拦阻风，也是右手抓油。"],[17,"铁磨铁，磨出刃来，朋友相感（原文作“磨朋友的脸”），也是如此。"],[18,"看守无花果树的，必吃树上的果子；敬奉主人的，必得尊荣。"],[19,"水中照脸，彼此相符；人与人，心也相对。"],[20,"阴间和灭亡永不满足，人的眼目也是如此。"],[21,"鼎为炼银，炉为炼金，人的称赞也试炼人。"],[22,"你虽用杵将愚妄人与打碎的麦子一同捣在臼中，他的愚妄还是离不了他。"],[23,"你要详细知道你羊群的景况，留心料理你的牛群；"],[24,"因为资财不能永有，冠冕岂能存到万代？"],[25,"干草割去，嫩草发现，山上的菜蔬也被收敛。"],[26,"羊羔之毛是为你作衣服，山羊是为作田地的价值，"],[27,"并有母山羊奶够你吃，也够你的家眷吃，且够养你的婢女。"]]},{"n":28,"v":[[1,"恶人虽无人追赶也逃跑，义人却胆壮像狮子。"],[2,"邦国因有罪过，君王就多更换。因有聪明知识的人，国必长存。"],[3,"穷人欺压贫民，好像暴雨冲没粮食。"],[4,"违弃律法的，夸奖恶人，遵守律法的，却与恶人相争。"],[5,"坏人不明白公义，惟有寻求耶和华的，无不明白。"],[6,"行为纯正的穷乏人，胜过行事乖僻的富足人。"],[7,"谨守律法的是智慧之子，与贪食人作伴的，却羞辱其父。"],[8,"人以厚利加增财物，是给那怜悯穷人者积蓄的。"],[9,"转耳不听律法的，他的祈祷也为可憎。"],[10,"诱惑正直人行恶道的，必掉在自己的坑里，惟有完全人，必承受福分。"],[11,"富足人自以为有智慧，但聪明的贫穷人能将他查透。"],[12,"义人得志，有大荣耀，恶人兴起，人就躲藏。"],[13,"遮掩自己罪过的，必不亨通；承认离弃罪过的，必蒙怜恤。"],[14,"常存敬畏的，便为有福，心存刚硬的，必陷在祸患里。"],[15,"暴虐的君王辖制贫民，好像吼叫的狮子、觅食的熊。"],[16,"无知的君多行暴虐，以贪财为可恨的，必年长日久。"],[17,"背负流人血之罪的，必往坑里奔跑，谁也不可拦阻他。"],[18,"行动正直的，必蒙拯救；行事弯曲的，立时跌倒。"],[19,"耕种自己田地的，必得饱食；追随虚浮的，足受穷乏。"],[20,"诚实人必多得福，想要急速发财的，不免受罚。"],[21,"看人的情面，乃为不好，人因一块饼枉法，也为不好。"],[22,"人有恶眼想要急速发财，却不知穷乏必临到他身。"],[23,"责备人的，后来蒙人喜悦，多于那用舌头谄媚人的。"],[24,"偷窃父母的说：“这不是罪”，此人就是与强盗同类。"],[25,"心中贪婪的，挑起争端；倚靠耶和华的，必得丰裕。"],[26,"心中自是的，便是愚昧人；凭智慧行事的，必蒙拯救。"],[27,"周济贫穷的，不致缺乏；佯为不见的，必多受咒诅。"],[28,"恶人兴起，人就躲藏；恶人败亡，义人增多。"]]},{"n":29,"v":[[1,"人屡次受责罚，仍然硬着颈项，他必顷刻败坏，无法可治。"],[2,"义人增多，民就喜乐，恶人掌权，民就叹息；"],[3,"爱慕智慧的，使父亲喜乐，与妓女结交的，却浪费钱财。"],[4,"王藉公平，使国坚定；索要贿赂，使国倾败。"],[5,"谄媚邻舍的，就是设网罗绊他的脚。"],[6,"恶人犯罪，自陷网罗，惟独义人，欢呼喜乐。"],[7,"义人知道查明穷人的案，恶人没有聪明，就不得而知。"],[8,"亵慢人煽惑通城，智慧人止息众怒。"],[9,"智慧人与愚妄人相争，或怒或笑，总不能使他止息。"],[10,"好流人血的，恨恶完全人，索取正直人的性命。"],[11,"愚妄人怒气全发，智慧人忍气含怒。"],[12,"君王若听谎言，他一切臣仆都是奸恶。"],[13,"贫穷人强暴人在世相遇，他们的眼目，都蒙耶和华光照。"],[14,"君王凭诚实判断穷人，他的国位必永远坚立。"],[15,"杖打和责备能加增智慧，放纵的儿子使母亲羞愧。"],[16,"恶人加多，过犯也加多，义人必看见他们跌倒。"],[17,"管教你的儿子，他就使你得安息，也必使你心里喜乐。"],[18,"没有异象（或作“默示”），民就放肆，惟遵守律法的，便为有福。"],[19,"只用言语，仆人不肯受管教，他虽然明白，也不留意。"],[20,"你见言语急躁的人吗？愚昧人比他更有指望。"],[21,"人将仆人从小娇养，这仆人终久必成了他的儿子。"],[22,"好气的人，挑启争端，暴怒的人，多多犯罪。"],[23,"人的高傲，必使他卑下；心里谦逊的，必得尊荣。"],[24,"人与盗贼分赃，是恨恶自己的性命，他听见叫人发誓的声音，却不言语。"],[25,"惧怕人的，陷入网罗，惟有倚靠耶和华的，必得安稳。"],[26,"求王恩的人多，定人事乃在耶和华。"],[27,"为非作歹的，被义人憎嫌；行事正直的，被恶人憎恶。"]]},{"n":30,"v":[[1,"雅基的儿子亚古珥的言语，就是真言。这人对以铁和乌甲说："],[2,"我比众人更蠢笨，也没有人的聪明。"],[3,"我没有学好智慧，也不认识至圣者。"],[4,"谁升天又降下来？谁聚风在掌握中？谁包水在衣服里？谁立定地的四极？他名叫什么？他儿子名叫什么？你知道吗？"],[5,"神的言语句句都是炼净的，投靠他的，他便作他们的盾牌。"],[6,"他的言语，你不可加添，恐怕他责备你，你就显为说谎言的。"],[7,"我求你两件事，在我未死之先，不要不赐给我："],[8,"求你使虚假和谎言远离我；使我也不贫穷也不富足，赐给我需用的饮食。"],[9,"恐怕我饱足不认你说，耶和华是谁呢？又恐怕我贫穷就偷窃，以致亵渎我神的名。"],[10,"你不要向主人谗谤仆人，恐怕他咒诅你，你便算为有罪。"],[11,"有一宗人（“宗”原文作“代”。下同），咒诅父亲，不给母亲祝福。"],[12,"有一宗人，自以为清洁，却没有洗去自己的污秽。"],[13,"有一宗人，眼目何其高傲，眼皮也是高举。"],[14,"有一宗人，牙如剑，齿如刀，要吞灭地上的困苦人和世间的穷乏人。"],[15,"蚂蟥有两个女儿，常说：“给呀，给呀！”有三样不知足的，连不说够的共有四样，"],[16,"就是阴间和石胎，浸水不足的地，并火。"],[17,"戏笑父亲，藐视而不听从母亲的，他的眼睛必为谷中的乌鸦啄出来，为鹰雏所吃。"],[18,"我所测不透的奇妙有三样，连我所不知道的共有四样，"],[19,"就是鹰在空中飞的道，蛇在磐石上爬的道，船在海中行的道，男与女交合的道。"],[20,"淫妇的道，也是这样，她吃了把嘴一擦，就说：“我没有行恶。”"],[21,"使地震动的有三样，连地担不起的共有四样，"],[22,"就是仆人作王，愚顽人吃饱，"],[23,"丑恶的女子出嫁，婢女接续主母。"],[24,"地上有四样小物，却甚聪明："],[25,"蚂蚁是无力之类，却在夏天预备粮食；"],[26,"沙番是软弱之类，却在磐石中造房；"],[27,"蝗虫没有君王，却分队而出；"],[28,"守宫用爪抓墙，却住在王宫。"],[29,"步行威武的有三样，连行走威武的共有四样，"],[30,"就是狮子乃百兽中最为猛烈，无所躲避的；"],[31,"猎狗、公山羊和无人能敌的君王。"],[32,"你若行事愚顽，自高自傲，或是怀了恶念，就当用手捂口。"],[33,"摇牛奶必成奶油，扭鼻子必出血；照样，激动怒气必起争端。"]]},{"n":31,"v":[[1,"利慕伊勒王的言语，是他母亲教训他的真言。"],[2,"我的儿啊，我腹中生的儿啊，我许愿得的儿啊，我当怎样教训你呢？"],[3,"不要将你的精力给妇女，也不要有败坏君王的行为。"],[4,"利慕伊勒啊，君王喝酒，君王喝酒不相宜；王子说，浓酒在那里也不相宜。"],[5,"恐怕喝了就忘记律例，颠倒一切困苦人的是非。"],[6,"可以把浓酒给将亡的人喝，把清酒给苦心的人喝，"],[7,"让他喝了，就忘记他的贫穷，不再记念他的苦楚。"],[8,"你当为哑巴（或作“不能自辩的”）开口，为一切孤独的伸冤。"],[9,"你当开口按公义判断，为困苦和穷乏的辨屈。”"],[10,"才德的妇人谁能得着呢？她的价值远胜过珍珠。"],[11,"她丈夫心里倚靠她，必不缺少利益，"],[12,"她一生使丈夫有益无损。"],[13,"她寻找羊绒和麻，甘心用手作工。"],[14,"她好像商船从远方运粮来，"],[15,"未到黎明她就起来，把食物分给家中的人，将当作的工分派婢女。"],[16,"她想得田地就买来，用手所得之利栽种葡萄园。"],[17,"她以能力束腰，使膀臂有力。"],[18,"她觉得所经营的有利，她的灯终夜不灭。"],[19,"她手拿捻线竿，手把纺线车。"],[20,"她张手周济困苦人，伸手帮补穷乏人。"],[21,"她不因下雪为家里的人担心，因为全家都穿着朱红衣服。"],[22,"她为自己制作绣花毯子，她的衣服是细麻和紫色布作的。"],[23,"她丈夫在城门口与本地的长老同坐，为众人所认识。"],[24,"她作细麻布衣裳出卖，又将腰带卖与商家。"],[25,"能力和威仪是她的衣服。她想到日后的景况就喜笑。"],[26,"她开口就发智慧，她舌上有仁慈的法则。"],[27,"她观察家务，并不吃闲饭。"],[28,"她的儿女起来称她有福，她的丈夫也称赞她，"],[29,"说：“才德的女子很多，惟独你超过一切！”"],[30,"艳丽是虚假的，美容是虚浮的，惟敬畏耶和华的妇女必得称赞。"],[31,"愿她享受操作所得的，愿她的工作，在城门口荣耀她。"]]}]},{"name":"传道书","chapters":[{"n":1,"v":[[1,"在耶路撒冷作王，大卫的儿子，传道者的言语。"],[2,"传道者说：虚空的虚空，虚空的虚空，凡事都是虚空。"],[3,"人一切的劳碌，就是他在日光之下的劳碌，有什么益处呢？"],[4,"一代过去，一代又来，地却永远长存。"],[5,"日头出来，日头落下，急归所出之地。"],[6,"风往南刮，又向北转，不住地旋转，而且返回转行原道。"],[7,"江河都往海里流，海却不满；江河从何处流，仍归还何处。"],[8,"万事令人厌烦（或作“万物满有困乏”），人不能说尽。眼看，看不饱；耳听，听不足。"],[9,"已有的事，后必再有；已行的事，后必再行。日光之下，并无新事。"],[10,"岂有一件事人能指着说这是新的？哪知，在我们以前的世代早已有了。"],[11,"已过的世代，无人记念；将来的世代，后来的人也不记念。"],[12,"我传道者在耶路撒冷作过以色列的王。"],[13,"我专心用智慧寻求查究天下所作的一切事，乃知神叫世人所经练的是极重的劳苦。"],[14,"我见日光之下所作的一切事，都是虚空，都是捕风。"],[15,"弯曲的不能变直，缺少的不能足数。"],[16,"我心里议论说，我得了大智慧，胜过我以前在耶路撒冷的众人，而且我心中多经历智慧和知识的事。"],[17,"我又专心察明智慧、狂妄和愚昧，乃知这也是捕风。"],[18,"因为多有智慧，就多有愁烦；加增知识的，就加增忧伤。"]]},{"n":2,"v":[[1,"我心里说：来吧！我以喜乐试试你，你好享福。谁知，这也是虚空。"],[2,"我指嬉笑说：这是狂妄；论喜乐说：有何功效呢？"],[3,"我心里察究，如何用酒使我肉体舒畅，我心却仍以智慧引导我；又如何持住愚昧，等我看明世人，在天下一生当行何事为美。"],[4,"我为自己动大工程，建造房屋，栽种葡萄园；"],[5,"修造园囿，在其中栽种各样果木树；"],[6,"挖造水池，用以浇灌嫩小的树木。"],[7,"我买了仆婢，也有生在家中的仆婢；又有许多牛群羊群，胜过以前在耶路撒冷众人所有的。"],[8,"我又为自己积蓄金银和君王的财宝，并各省的财宝；又得唱歌的男女和世人所喜爱的物，并许多的妃嫔。"],[9,"这样，我就日见昌盛，胜过以前在耶路撒冷的众人。我的智慧仍然存留。"],[10,"凡我眼所求的，我没有留下不给他的；我心所乐的，我没有禁止不享受的；因我的心为我一切所劳碌的快乐，这就是我从劳碌中所得的份。"],[11,"后来，我察看我手所经营的一切事和我劳碌所成的功，谁知都是虚空，都是捕风，在日光之下毫无益处。"],[12,"我转念观看智慧、狂妄和愚昧。在王以后而来的人还能作什么呢？也不过行早先所行的就是了。"],[13,"我便看出智慧胜过愚昧，如同光明胜过黑暗。"],[14,"智慧人的眼目光明（“光明”原文作“在他头上”）；愚昧人在黑暗里行。我却看明有一件事，这两等人都必遇见。"],[15,"我就心里说：愚昧人所遇见的，我也必遇见，我为何更有智慧呢？我心里说：这也是虚空。"],[16,"智慧人和愚昧人一样，永远无人记念，因为日后都被忘记；可叹智慧人死亡，与愚昧人无异。"],[17,"我所以恨恶生命，因为在日光之下所行的事，我都以为烦恼，都是虚空，都是捕风。"],[18,"我恨恶一切的劳碌，就是我在日光之下的劳碌，因为我得来的必留给我以后的人。"],[19,"那人是智慧，是愚昧，谁能知道？他竟要管理我劳碌所得的，就是我在日光之下用智慧所得的。这也是虚空。"],[20,"故此，我转想我在日光之下所劳碌的一切工作，心便绝望。"],[21,"因为有人用智慧、知识、灵巧所劳碌得来的，却要留给未曾劳碌的人为份。这也是虚空，也是大患。"],[22,"人在日光之下劳碌累心，在他一切的劳碌上得着什么呢？"],[23,"因为他日日忧虑，他的劳苦成为愁烦，连夜间心也不安。这也是虚空。"],[24,"人莫强如吃喝，且在劳碌中享福，我看这也是出于神的手。"],[25,"论到吃用、享福，谁能胜过我呢？"],[26,"神喜悦谁，就给谁智慧、知识和喜乐，惟有罪人，神使他劳苦，叫他将所收聚的、所堆积的归给神所喜悦的人。这也是虚空，也是捕风。"]]},{"n":3,"v":[[1,"凡事都有定期，天下万务都有定时。"],[2,"生有时，死有时；栽种有时，拔出所栽种的也有时；"],[3,"杀戮有时，医治有时；拆毁有时，建造有时；"],[4,"哭有时，笑有时；哀恸有时，跳舞有时；"],[5,"抛掷石头有时，堆聚石头有时；怀抱有时，不怀抱有时；"],[6,"寻找有时，失落有时；保守有时，舍弃有时；"],[7,"撕裂有时，缝补有时；静默有时，言语有时；"],[8,"喜爱有时，恨恶有时；争战有时，和好有时。"],[9,"这样看来，作事的人在他的劳碌上有什么益处呢？"],[10,"我见神叫世人劳苦，使他们在其中受经练。"],[11,"神造万物，各按其时成为美好，又将永生安置在世人心里（“永生”原文作“永远”）。然而神从始至终的作为，人不能参透。"],[12,"我知道世人，莫强如终身喜乐行善，"],[13,"并且人人吃喝，在他一切劳碌中享福，这也是神的恩赐。"],[14,"我知道神一切所作的都必永存，无所增添，无所减少。神这样行，是要人在他面前存敬畏的心。"],[15,"现今的事早先就有了，将来的事早已也有了，并且神使已过的事重新再来（或作“并且神再寻回已过的事”）。"],[16,"我又见日光之下，在审判之处有奸恶，在公义之处也有奸恶。"],[17,"我心里说：神必审判义人和恶人，因为在那里，各样事务，一切工作，都有定时。"],[18,"我心里说：这乃为世人的缘故，是神要试验他们，使他们觉得自己不过像兽一样。"],[19,"因为世人遭遇的，兽也遭遇，所遭遇的都是一样：这个怎样死，那个也怎样死，气息都是一样。人不能强于兽，都是虚空。"],[20,"都归一处，都是出于尘土，也都归于尘土。"],[21,"谁知道人的灵是往上升，兽的魂是下入地呢？"],[22,"故此，我见人莫强如在他经营的事上喜乐，因为这是他的份；他身后的事，谁能使他回来得见呢？"]]},{"n":4,"v":[[1,"我又转念，见日光之下所行的一切欺压。看哪，受欺压的流泪，且无人安慰；欺压他们的有势力，也无人安慰他们。"],[2,"因此，我赞叹那早已死的死人，胜过那还活着的活人。"],[3,"并且我以为那未曾生的，就是未见过日光之下恶事的，比这两等人更强。"],[4,"我又见人为一切的劳碌和各样灵巧的工作就被邻舍嫉妒。这也是虚空，也是捕风。"],[5,"愚昧人抱着手，吃自己的肉；"],[6,"满了一把，得享安静，强如满了两把，劳碌捕风。"],[7,"我又转念，见日光之下有一件虚空的事："],[8,"有人孤单无二，无子无兄，竟劳碌不息，眼目也不以钱财为足。他说：我劳劳碌碌，刻苦自己，不享福乐，到底是为谁呢？这也是虚空，是极重的劳苦。"],[9,"两个人总比一个人好，因为二人劳碌同得美好的果效。"],[10,"若是跌倒，这人可以扶起他的同伴；若是孤身跌倒，没有别人扶起他来，这人就有祸了！"],[11,"再者，二人同睡，就都暖和；一人独睡，怎能暖和呢？"],[12,"有人攻胜孤身一人，若有二人便能敌挡他；三股合成的绳子不容易折断。"],[13,"贫穷而有智慧的少年人，胜过年老不肯纳谏的愚昧王。"],[14,"这人是从监牢中出来作王；在他国中，生来原是贫穷的。"],[15,"我见日光之下一切行动的活人，都随从那第二位，就是起来代替老王的少年人。"],[16,"他所治理的众人，就是他的百姓，多得无数。在他后来的人，尚且不喜悦他。这真是虚空，也是捕风。"]]},{"n":5,"v":[[1,"你到神的殿要谨慎脚步。因为近前听，胜过愚昧人献祭（或作“胜过献愚昧人的祭”），他们本不知道所作的是恶。"],[2,"你在神面前不可冒失开口，也不可心急发言。因为神在天上，你在地下，所以你的言语要寡少。"],[3,"事务多，就令人作梦；言语多，就显出愚昧。"],[4,"你向神许愿，偿还不可迟延，因他不喜悦愚昧人，所以你许的愿应当偿还。"],[5,"你许愿不还，不如不许。"],[6,"不可任你的口使肉体犯罪，也不可在祭司（原文作“使者”）面前说是错许了。为何使神因你的声音发怒，败坏你手所作的呢？"],[7,"多梦和多言，其中多有虚幻，你只要敬畏神。"],[8,"你若在一省之中见穷人受欺压，并夺去公义、公平的事，不要因此诧异。因有一位高过居高位的鉴察，在他们以上还有更高的。"],[9,"况且地的益处归众人，就是君王也受田地的供应。"],[10,"贪爱银子的，不因得银子知足；贪爱丰富的，也不因得利益知足。这也是虚空。"],[11,"货物增添，吃的人也增添，物主得什么益处呢？不过眼看而已。"],[12,"劳碌的人不拘吃多吃少，睡得香甜；富足人的丰满，却不容他睡觉。"],[13,"我见日光之下，有一宗大祸患，就是财主积存资财，反害自己。"],[14,"因遭遇祸患，这些资财就消灭；那人若生了儿子，手里也一无所有。"],[15,"他怎样从母胎赤身而来，也必照样赤身而去；他所劳碌得来的，手中分毫不能带去。"],[16,"他来的情形怎样，他去的情形也怎样。这也是一宗大祸患。他为风劳碌有什么益处呢？"],[17,"并且他终身在黑暗中吃喝，多有烦恼，又有病患呕气。"],[18,"我所见为善为美的，就是人在神赐他一生的日子吃喝，享受日光之下劳碌得来的好处，因为这是他的份。"],[19,"神赐人资财丰富，使他能以吃用，能取自己的份，在他劳碌中喜乐，这乃是神的恩赐。"],[20,"他不多思念自己一生的年日，因为神应他的心使他喜乐。"]]},{"n":6,"v":[[1,"我见日光之下有一宗祸患重压在人身上，"],[2,"就是人蒙神赐他资财、丰富、尊荣，以致他心里所愿的一样都不缺，只是神使他不能吃用，反有外人来吃用。这是虚空，也是祸患。"],[3,"人若生一百个儿子，活许多岁数，以致他的年日甚多，心里却不得满享福乐，又不得埋葬；据我说，那不到期而落的胎比他倒好。"],[4,"因为虚虚而来，暗暗而去，名字被黑暗遮蔽，"],[5,"并且没有见过天日，也毫无知觉，这胎比那人倒享安息。"],[6,"那人虽然活千年，再活千年，却不享福，众人岂不都归一个地方去吗？"],[7,"人的劳碌都为口腹，心里却不知足。"],[8,"这样看来，智慧人比愚昧人，有什么长处呢？穷人在众人面前知道如何行，有什么长处呢？"],[9,"眼睛所看的，比心里妄想的倒好。这也是虚空，也是捕风。"],[10,"先前所有的，早已起了名，并知道何为人，他也不能与那比自己力大的相争。"],[11,"加增虚浮的事既多，这与人有什么益处呢？"],[12,"人一生虚度的日子，就如影儿经过；谁知道什么与他有益呢？谁能告诉他身后在日光之下有什么事呢？"]]},{"n":7,"v":[[1,"名誉强如美好的膏油；人死的日子胜过人生的日子。"],[2,"往遭丧的家去，强如往宴乐的家去，因为死是众人的结局，活人也必将这事放在心上。"],[3,"忧愁强如喜笑，因为面带愁容，终必使心喜乐。"],[4,"智慧人的心，在遭丧之家；愚昧人的心，在快乐之家。"],[5,"听智慧人的责备，强如听愚昧人的歌唱。"],[6,"愚昧人的笑声，好像锅下烧荆棘的爆声，这也是虚空。"],[7,"勒索使智慧人变为愚妄，贿赂能败坏人的慧心。"],[8,"事情的终局强如事情的起头；存心忍耐的，胜过居心骄傲的。"],[9,"你不要心里急躁恼怒，因为恼怒存在愚昧人的怀中。"],[10,"不要说：先前的日子强过如今的日子，是什么缘故呢？你这样问，不是出于智慧。"],[11,"智慧和产业并好，而且见天日的人得智慧更为有益。"],[12,"因为智慧护庇人，好像银钱护庇人一样。惟独智慧能保全智慧人的生命。这就是知识的益处。"],[13,"你要察看神的作为，因神使为曲的，谁能变为直呢？"],[14,"遇亨通的日子，你当喜乐；遭患难的日子，你当思想。因为神使这两样并列，为的是叫人查不出身后有什么事。"],[15,"有义人行义，反致灭亡；有恶人行恶，倒享长寿。这都是我在虚度之日中所见过的。"],[16,"不要行义过分，也不要过于自逞智慧，何必自取败亡呢？"],[17,"不要行恶过分，也不要为人愚昧，何必不到期而死呢？"],[18,"你持守这个为美，那个也不要松手；因为敬畏神的人，必从这两样出来。"],[19,"智慧使有智慧的人比城中十个官长更有能力。"],[20,"时常行善而不犯罪的义人，世上实在没有。"],[21,"人所说的一切话，你不要放在心上，恐怕听见你的仆人咒诅你。"],[22,"因为你心里知道，自己也曾屡次咒诅别人。"],[23,"我曾用智慧试验这一切事，我说：要得智慧，智慧却离我远。"],[24,"万事之理，离我甚远，而且最深，谁能测透呢？"],[25,"我转念，一心要知道，要考察，要寻求智慧和万事的理由，又要知道邪恶为愚昧，愚昧为狂妄。"],[26,"我得知有等妇人，比死还苦；她的心是网罗，手是锁链。凡蒙神喜悦的人，必能躲避她；有罪的人，却被她缠住了。"],[27,"-"],[28,"传道者说：“看哪，一千男子中，我找到一个正直人；但众女子中，没有找到一个。”我将这事一一比较，要寻求其理，我心仍要寻找，却未曾找到。"],[29,"我所找到的只有一件，就是神造人原是正直，但他们寻出许多巧计。"]]},{"n":8,"v":[[1,"谁如智慧人呢？谁知道事情的解释呢？人的智慧使他的脸发光，并使他脸上的暴气改变。"],[2,"我劝你遵守王的命令，既指神起誓，理当如此。"],[3,"不要急躁离开王的面前，不要固执行恶，因为他凡事都随自己的心意而行。"],[4,"王的话本有权力，谁敢问他说：你作什么呢？"],[5,"凡遵守命令的，必不经历祸患，智慧人的心，能辨明时候和定理（原文作“审判”。下节同）。"],[6,"各样事务成就，都有时候和定理，因为人的苦难重压在他身上。"],[7,"他不知道将来的事，因为将来如何，谁能告诉他呢？"],[8,"无人有权力掌管生命，将生命留住，也无人有权力掌管死期。这场争战，无人能免，邪恶也不能救那好行邪恶的人。"],[9,"这一切我都见过，也专心查考日光之下所作的一切事。有时这人管辖那人，令人受害。"],[10,"我见恶人埋葬，归入坟墓；又见行正直事的离开圣地，在城中被人忘记。这也是虚空。"],[11,"因为断定罪名，不立刻施刑，所以世人满心作恶。"],[12,"罪人虽然作恶百次，倒享长久的年日。然而我准知道，敬畏神的，就是在他面前敬畏的人，终久必得福乐。"],[13,"恶人却不得福乐，也不得长久的年日；这年日好像影儿，因他不敬畏神。"],[14,"世上有一件虚空的事，就是义人所遭遇的，反照恶人所行的；又有恶人所遭遇的，反照义人所行的。我说，这也是虚空。"],[15,"我就称赞快乐，原来人在日光之下，莫强如吃喝快乐，因为他在日光之下，神赐他一生的年日，要从劳碌中时常享受所得的。"],[16,"我专心求智慧，要看世上所作的事。（有昼夜不睡觉，不合眼的。）"],[17,"我就看明神一切的作为，知道人查不出日光之下所作的事；任凭他费多少力寻查，都查不出来，就是智慧人虽想知道，也是查不出来。"]]},{"n":9,"v":[[1,"我将这一切事放在心上，详细考究，就知道义人和智慧人，并他们的作为都在神手中；或是爱，或是恨，都在他们的前面，人不能知道。"],[2,"凡临到众人的事都是一样：义人和恶人都遭遇一样的事；好人、洁净人和不洁净人，献祭的与不献祭的，也是一样。好人如何，罪人也如何；起誓的如何，怕起誓的也如何。"],[3,"在日光之下所行的一切事上，有一件祸患，就是众人所遭遇的都是一样，并且世人的心充满了恶。活着的时候心里狂妄，后来就归死人那里去了。"],[4,"与一切活人相连的，那人还有指望，因为活着的狗比死了的狮子更强。"],[5,"活着的人知道必死，死了的人毫无所知，也不再得赏赐，他们的名无人记念。"],[6,"他们的爱，他们的恨，他们的嫉妒，早都消灭了。在日光之下所行的一切事上，他们永不再有份了。"],[7,"你只管去欢欢喜喜吃你的饭，心中快乐喝你的酒，因为神已经悦纳你的作为。"],[8,"你的衣服当时常洁白，你头上也不要缺少膏油。"],[9,"在你一生虚空的年日，就是神赐你在日光之下虚空的年日，当同你所爱的妻快活度日，因为那是你生前在日光之下劳碌的事上所得的份。"],[10,"凡你手所当作的事，要尽力去作，因为在你所必去的阴间，没有工作，没有谋算，没有知识，也没有智慧。"],[11,"我又转念：见日光之下，快跑的未必能赢，力战的未必得胜，智慧的未必得粮食，明哲的未必得资财，灵巧的未必得喜悦；所临到众人的，是在乎当时的机会。"],[12,"原来人也不知道自己的定期；鱼被恶网圈住，鸟被网罗捉住，祸患忽然临到的时候，世人陷在其中，也是如此。"],[13,"我见日光之下有一样智慧，据我看乃是广大。"],[14,"就是有一小城，其中的人数稀少，有大君王来攻击，修筑营垒，将城围困。"],[15,"城中有一个贫穷的智慧人，他用智慧救了那城，却没有人记念那穷人。"],[16,"我就说：智慧胜过勇力；然而那贫穷人的智慧被人藐视，他的话也无人听从。"],[17,"宁可在安静之中听智慧人的言语，不听掌管愚昧人的喊声。"],[18,"智慧胜过打仗的兵器，但一个罪人，能败坏许多善事。"]]},{"n":10,"v":[[1,"死苍蝇使作香的膏油发出臭气。这样，一点愚昧，也能败坏智慧和尊荣。"],[2,"智慧人的心居右，愚昧人的心居左。"],[3,"并且愚昧人行路显出无知，对众人说，他是愚昧人。"],[4,"掌权者的心若向你发怒，不要离开你的本位，因为柔和能免大过。"],[5,"我见日光之下有一件祸患，似乎出于掌权的错误，"],[6,"就是：愚昧人立在高位，富足人坐在低位。"],[7,"我见过仆人骑马，王子像仆人在地上步行。"],[8,"挖陷坑的，自己必掉在其中；拆墙垣的，必为蛇所咬。"],[9,"凿开（或作“挪移”）石头的，必受损伤；劈开木头的，必遭危险。"],[10,"铁器钝了，若不将刃磨快，就必多费气力，但得智慧指教，便有益处。"],[11,"未行法术以先，蛇若咬人，后行法术也是无益。"],[12,"智慧人的口说出恩言；愚昧人的嘴吞灭自己。"],[13,"他口中的言语起头是愚昧；他话的末尾是奸恶的狂妄。"],[14,"愚昧人多有言语。人却不知将来有什么事；他身后的事，谁能告诉他呢？"],[15,"凡愚昧人，他的劳碌使自己困乏，因为连进城的路，他也不知道。"],[16,"邦国啊，你的王若是孩童，你的群臣早晨宴乐，你就有祸了！"],[17,"邦国啊，你的王若是贵胄之子，你的群臣按时吃喝，为要补力，不为酒醉，你就有福了！"],[18,"因人懒惰，房顶塌下；因人手懒，房屋滴漏。"],[19,"设摆筵席，是为喜笑。酒能使人快活，钱能叫万事应心。"],[20,"你不可咒诅君王，也不可心怀此念，在你卧房也不可咒诅富户，因为空中的鸟必传扬这声音；有翅膀的也必述说这事。"]]},{"n":11,"v":[[1,"当将你的粮食撒在水面，因为日久必能得着。"],[2,"你要分给七人，或分给八人，因为你不知道将来有什么灾祸临到地上。"],[3,"云若满了雨，就必倾倒在地上；树若向南倒，或向北倒，树倒在何处，就存在何处。"],[4,"看风的必不撒种，望云的必不收割。"],[5,"风从何道来，骨头在怀孕妇人的胎中如何长成，你尚且不得知道，这样，行万事之神的作为，你更不得知道。"],[6,"早晨要撒你的种，晚上也不要歇你的手，因为你不知道哪一样发旺：或是早撒的，或是晚撒的，或是两样都好。"],[7,"光，本是佳美的，眼见日光也是可悦的。"],[8,"人活多年，就当快乐多年；然而也当想到黑暗的日子。因为这日子必多，所要来的都是虚空。"],[9,"少年人哪，你在幼年时当快乐。在幼年的日子，使你的心欢畅，行你心所愿行的，看你眼所爱看的，却要知道，为这一切的事，神必审问你。"],[10,"所以你当从心中除掉愁烦，从肉体克去邪恶，因为一生的开端和幼年之时，都是虚空的。"]]},{"n":12,"v":[[1,"你趁着年幼，衰败的日子尚未来到，就是你所说，我毫无喜乐的那些年日未曾临近之先，当记念造你的主。"],[2,"不要等到日头、光明、月亮、星宿变为黑暗，雨后云彩反回；"],[3,"看守房屋的发颤，有力的屈身，推磨的稀少就止息；从窗户往外看的都昏暗，"],[4,"街门关闭，推磨的响声微小，雀鸟一叫，人就起来，歌唱的女子也都衰微。"],[5,"人怕高处，路上有惊慌；杏树开花，蚱蜢成为重担；人所愿的也都废掉。因为人归他永远的家，吊丧的在街上往来。"],[6,"银链折断，金罐破裂，瓶子在泉旁损坏，水轮在井口破烂；"],[7,"尘土仍归于地，灵仍归于赐灵的神。"],[8,"传道者说：“虚空的虚空，凡事都是虚空。”"],[9,"再者，传道者因有智慧，仍将知识教训众人；又默想，又考查，又陈说许多箴言。"],[10,"传道者专心寻求可喜悦的言语，是凭正直写的诚实话。"],[11,"智慧人的言语好像刺棍；会中之师的言语又像钉稳的钉子，都是一个牧者所赐的。"],[12,"我儿，还有一层，你当受劝戒：著书多，没有穷尽；读书多，身体疲倦。"],[13,"这些事都已听见了，总意就是敬畏神，谨守他的诫命，这是人所当尽的本分（或作“这是众人的本分”）。"],[14,"因为人所作的事，连一切隐藏的事，无论是善是恶，神都必审问。"]]}]},{"name":"雅歌","chapters":[{"n":1,"v":[[1,"所罗门的歌，是歌中的雅歌。"],[2,"愿他用口与我亲嘴，因你的爱情比酒更美。"],[3,"你的膏油馨香，你的名如同倒出来的香膏，所以众童女都爱你。"],[4,"愿你吸引我，我们就快跑跟随你。王带我进了内室，我们必因你欢喜快乐；我们要称赞你的爱情，胜似称赞美酒。他们爱你是理所当然的。"],[5,"耶路撒冷的众女子啊，我虽然黑，却是秀美，如同基达的帐棚，好象所罗门的幔子。"],[6,"不要因日头把我晒黑了，就轻看我。我同母的弟兄向我发怒，他们使我看守葡萄园；我自己的葡萄园却没有看守。"],[7,"我心所爱的啊，求你告诉我，你在何处牧羊？晌午在何处使羊歇卧？我何必在你同伴的羊群旁边，好象蒙着脸的人呢？"],[8,"你这女子中极美丽的，你若不知道，只管跟随羊群的脚踪去，把你的山羊羔牧放在牧人帐棚的旁边。"],[9,"我的佳偶，我将你比法老车上套的骏马。"],[10,"你的两腮因发辫而秀美；你的颈项因珠串而华丽。"],[11,"我们要为你编上金辫，镶上银钉。"],[12,"王正坐席的时候，我的哪哒香膏发出香味。"],[13,"我以我的良人为一袋没药，常在我怀中；"],[14,"我以我的良人为一棵凤仙花，在隐基底葡萄园中。"],[15,"我的佳偶，你甚美丽！你甚美丽！你的眼好象鸽子眼。"],[16,"我的良人哪！你甚美丽可爱！我们以青草为床榻，"],[17,"以香柏树为房屋的栋梁，以松树为椽子。"]]},{"n":2,"v":[[1,"我是沙仑的玫瑰花（或作“水仙花”），是谷中的百合花。"],[2,"我的佳偶在女子中，好象百合花在荆棘内。"],[3,"我的良人在男子中，如同苹果树在树林中。我欢欢喜喜坐在他的荫下，尝他果子的滋味，觉得甘甜。"],[4,"他带我入筵宴所，以爱为旗在我以上。"],[5,"求你们给我葡萄干增补我力，给我苹果畅快我心，因我思爱成病。"],[6,"他的左手在我头下，他的右手将我抱住。"],[7,"耶路撒冷的众女子啊，我指着羚羊或田野的母鹿嘱咐你们，不要惊动，不要叫醒我所亲爱的，等他自己情愿（“不要叫醒云云”或作“不要激动爱情，等它自发”）。"],[8,"听啊，是我良人的声音；看哪，他蹿山越岭而来。"],[9,"我的良人好象羚羊，或像小鹿。他站在我们墙壁后，从窗户往里观看，从窗棂往里窥探。"],[10,"我良人对我说：我的佳偶，我的美人，起来，与我同去！"],[11,"因为冬天已往，雨水止住过去了。"],[12,"地上百花开放、百鸟鸣叫的时候（或作“修理葡萄树的时候”）已经来到，斑鸠的声音在我们境内也听见了，"],[13,"无花果树的果子渐渐成熟，葡萄树开花放香。我的佳偶，我的美人，起来，与我同去！"],[14,"我的鸽子啊，你在磐石穴中，在陡岩的隐密处。求你容我得见你的面貌，得听你的声音；因为你的声音柔和，你的面貌秀美。"],[15,"要给我们擒拿狐狸，就是毁坏葡萄园的小狐狸，因为我们的葡萄正在开花。"],[16,"良人属我，我也属他；他在百合花中牧放群羊。"],[17,"我的良人哪，求你等到天起凉风，日影飞去的时候，你要转回，好象羚羊或象小鹿在比特山上。"]]},{"n":3,"v":[[1,"我夜间躺卧在床上，寻找我心所爱的；我寻找他，却寻不见。"],[2,"我说：我要起来，游行城中；在街市上，在宽阔处，寻找我心所爱的。我寻找他，却寻不见。"],[3,"城中巡逻看守的人遇见我，我问他们：“你们看见我心所爱的没有？”"],[4,"我刚离开他们，就遇见我心所爱的。我拉住他，不容他走，领他入我母家，到怀我者的内室。"],[5,"耶路撒冷的众女子啊，我指着羚羊或田野的母鹿嘱咐你们，不要惊动、不要叫醒我所亲爱的，等他自己情愿（“不要叫醒云云”或作“不要激动爱情等它自发”）。"],[6,"那从旷野上来、形状如烟柱，以没药和乳香，并商人各样香粉薰的是谁呢？"],[7,"看哪，是所罗门的轿，四围有六十个勇士，都是以色列中的勇士；"],[8,"手都持刀，善于争战，腰间佩刀，防备夜间有惊慌。"],[9,"所罗门王用黎巴嫩木为自己制造一乘华轿。"],[10,"轿柱是用银作的，轿底是用金作的，坐垫是紫色的，其中所铺的乃耶路撒冷众女子的爱情。"],[11,"锡安的众女子啊，你们出去观看所罗门王，头戴冠冕，就是在他婚筵的日子、心中喜乐的时候，他母亲给他戴上的。"]]},{"n":4,"v":[[1,"我的佳偶，你甚美丽！你甚美丽！你的眼在帕子内好象鸽子眼。你的头发如同山羊群卧在基列山旁。"],[2,"你的牙齿如新剪毛的一群母羊，洗净上来，个个都有双生，没有一只丧掉子的。"],[3,"你的唇好象一条朱红线，你的嘴也秀美。你的两太阳在帕子内如同一块石榴。"],[4,"你的颈项好象大卫建造收藏军器的高台，其上悬挂一千盾牌，都是勇士的藤牌。"],[5,"你的两乳好象百合花中吃草的一对小鹿，就是母鹿双生的。"],[6,"我要往没药山和乳香冈去，直等到天起凉风，日影飞去的时候回来。"],[7,"我的佳偶，你全然美丽，毫无瑕疵！"],[8,"我的新妇，求你与我一同离开黎巴嫩，与我一同离开黎巴嫩。从亚玛拿顶，从示尼珥与黑门顶，从有狮子的洞，从有豹子的山往下观看。"],[9,"我妹子，我新妇，你夺了我的心！你用眼一看，用你项上的一条金链，夺了我的心。"],[10,"我妹子，我新妇，你的爱情何其美！你的爱情比酒更美，你膏油的香气胜过一切香品。"],[11,"我新妇，你的嘴唇滴蜜，好象蜂房滴蜜；你的舌下有蜜有奶。你衣服的香气如黎巴嫩的香气。"],[12,"我妹子，我新妇，乃是关锁的园，禁闭的井，封闭的泉源。"],[13,"你园内所种的结了石榴，有佳美的果子，并凤仙花与哪哒树。"],[14,"有哪哒和番红花，菖蒲和桂树，并各样乳香木、没药、沉香，与一切上等的果品。"],[15,"你是园中的泉，活水的井，从黎巴嫩流下来的溪水。"],[16,"北风啊，兴起！南风啊，吹来！吹在我的园内，使其中的香气发出来。愿我的良人进入自己园里，吃他佳美的果子。"]]},{"n":5,"v":[[1,"我妹子，我新妇，我进了我的园中，采了我的没药和香料，吃了我的蜜房和蜂蜜，喝了我的酒和奶。我的朋友们，请吃！我所亲爱的，请喝！且多多地喝。"],[2,"我身睡卧，我心却醒。这是我良人的声音，他敲门说：“我的妹子，我的佳偶，我的鸽子，我的完全人，求你给我开门，因我的头满了露水，我的头发被夜露滴湿。”"],[3,"我回答说：“我脱了衣裳，怎能再穿上呢？我洗了脚，怎能再玷污呢？”"],[4,"我的良人，从门孔里伸进手来，我便因他动了心。"],[5,"我起来，要给我良人开门；我的两手滴下没药，我的指头有没药汁滴在门闩上。"],[6,"我给我的良人开了门，我的良人却已转身走了。他说话的时候，我神不守舍。我寻找他，竟寻不见；我呼叫他，他却不回答。"],[7,"城中巡逻看守的人遇见我，打了我，伤了我；看守城墙的人夺去我的披肩。"],[8,"耶路撒冷的众女子啊，我嘱咐你们，若遇见我的良人，要告诉他，我因思爱成病。"],[9,"你这女子中极美丽的，你的良人比别人的良人有何强处？你的良人比别人的良人有何强处？你就这样嘱咐我们？"],[10,"我的良人白而且红，超乎万人之上。"],[11,"他的头象至精的金子；他的头发厚密累垂，黑如乌鸦。"],[12,"他的眼如溪水旁的鸽子眼，用奶洗净，安得合式。"],[13,"他的两腮如香花畦，如香草台。他的嘴唇象百合花，且滴下没药汁。"],[14,"他的两手好象金管，镶嵌水苍玉。他的身体如同雕刻的象牙，周围镶嵌蓝宝石。"],[15,"他的腿好象白玉石柱，安在精金座上。他的形状如黎巴嫩，且佳美如香柏树。"],[16,"他的口极其甘甜，他全然可爱。耶路撒冷的众女子啊，这是我的良人，这是我的朋友。"]]},{"n":6,"v":[[1,"你这女子中极美丽的，你的良人往何处去了？你的良人转向何处去了？我们好与你同去寻找他。"],[2,"我的良人下入自己园中，到香花畦，在园内牧放群羊，采百合花。"],[3,"我属我的良人，我的良人也属我，他在百合花中牧放群羊。"],[4,"我的佳偶啊，你美丽如得撒，秀美如耶路撒冷，威武如展开旌旗的军队。"],[5,"求你掉转眼目不看我，因你的眼目使我惊乱。你的头发如同山羊群，卧在基列山旁。"],[6,"你的牙齿如一群母羊，洗净上来，个个都有双生，没有一只丧掉子的。"],[7,"你的两太阳在帕子内如同一块石榴。"],[8,"有六十王后、八十妃嫔，并有无数的童女。"],[9,"我的鸽子，我的完全人，只有这一个，是她母亲独生的，是生养她者所宝爱的。众女子见了就称她有福；王后妃嫔见了也赞美她。"],[10,"那向外观看如晨光发现，美丽如月亮，皎洁如日头，威武如展开旌旗军队的是谁呢？"],[11,"我下入核桃园，要看谷中青绿的植物，要看葡萄发芽没有，石榴开花没有。"],[12,"不知不觉，我的心将我安置在我尊长的车中。"],[13,"回来，回来，书拉密女！你回来，你回来，使我们得观看你！你们为何要观看书拉密女，象观看玛哈念跳舞的呢？"]]},{"n":7,"v":[[1,"王女啊，你的脚在鞋中何其美好！你的大腿圆润好象美玉，是巧匠的手作成的。"],[2,"你的肚脐如圆杯，不缺调和的酒。你的腰如一堆麦子，周围有百合花。"],[3,"你的两乳好象一对小鹿，就是母鹿双生的。"],[4,"你的颈项如象牙台；你的眼目象希实本巴特拉并门旁的水池；你的鼻子仿佛朝大马色的黎巴嫩塔；"],[5,"你的头在你身上好象迦密山，你头上的发是紫黑色。王的心因这下垂的发绺系住了。"],[6,"我所爱的，你何其美好！何其可悦！使人欢畅喜乐。"],[7,"你的身量好象棕树；你的两乳如同其上的果子，累累下垂。"],[8,"我说我要上这棕树，抓住枝子。愿你的两乳，好象葡萄累累下垂；你鼻子的气味香如苹果；"],[9,"你的口如上好的酒。女子说，为我的良人下咽舒畅，流入睡觉人的嘴中。"],[10,"我属我的良人，他也恋慕我。"],[11,"我的良人，来吧，你我可以往田间去，你我可以在村庄住宿。"],[12,"我们早晨起来往葡萄园去，看看葡萄发芽开花没有，石榴放蕊没有；我在那里要将我的爱情给你。"],[13,"风茄放香，在我们的门内有各样新陈佳美的果子；我的良人，这都是我为你存留的。"]]},{"n":8,"v":[[1,"巴不得你象我的兄弟，象吃我母亲奶的兄弟！我在外头遇见你，就与你亲嘴，谁也不轻看我。"],[2,"我必引导你，领你进我母亲的家，我可以领受教训，也就使你喝石榴汁酿的香酒。"],[3,"他的左手必在我头下，他的右手必将我抱住。"],[4,"耶路撒冷的众女子啊，我嘱咐你们，不要惊动，不要叫醒我所亲爱的，等他自己情愿（“不要叫醒云云”或作“不要激动爱情等它自发”）。"],[5,"那靠着良人从旷野上来的是谁呢？我在苹果树下叫醒你，你母亲在那里为你劬劳，生养你的在那里为你劬劳。"],[6,"求你将我放在你心上如印记，带在你臂上如戳记；因为爱情如死之坚强，嫉恨如阴间之残忍。所发的电光，是火焰的电光，是耶和华的烈焰。"],[7,"爱情，众水不能息灭，大水也不能淹没，若有人拿家中所有的财宝要换爱情，就全被藐视。"],[8,"我们有一小妹，她的两乳尚未长成，人来提亲的日子，我们当为她怎样办理？"],[9,"她若是墙，我们要在其上建造银塔；她若是门，我们要用香柏木板围护她。"],[10,"我是墙，我两乳象其上的楼。那时我在他眼中象得平安的人。"],[11,"所罗门在巴力哈们有一葡萄园，他将这葡萄园交给看守的人，为其中的果子，必交一千舍客勒银子。"],[12,"我自己的葡萄园在我面前；所罗门哪，一千舍客勒归你，二百舍客勒归看守果子的人。"],[13,"你这住在园中的，同伴都要听你的声音，求你使我也得听见。"],[14,"我的良人哪，求你快来，如羚羊或小鹿在香草山上。"]]}]},{"name":"以赛亚书","chapters":[{"n":1,"v":[[1,"当乌西雅、约坦、亚哈斯、希西家作犹大王的时候，亚摩斯的儿子以赛亚得默示，论到犹大和耶路撒冷。"],[2,"天哪，要听！地啊，侧耳而听！因为耶和华说：“我养育儿女，将他们养大，他们竟悖逆我。"],[3,"牛认识主人，驴认识主人的槽；以色列却不认识；我的民却不留意。”"],[4,"嗐！犯罪的国民，担着罪孽的百姓；行恶的种类，败坏的儿女！他们离弃耶和华，藐视以色列的圣者，与他生疏，往后退步。"],[5,"你们为什么屡次悖逆，还要受责打吗？你们已经满头疼痛，全心发昏。"],[6,"从脚掌到头顶，没有一处完全的，尽是伤口、青肿与新打的伤痕，都没有收口，没有缠裹，也没有用膏滋润。"],[7,"你们的地土已经荒凉，你们的城邑被火焚毁，你们的田地在你们眼前为外邦人所侵吞。既被外邦人倾覆，就成为荒凉。"],[8,"仅存锡安城（“城”原文作“女子”），好像葡萄园的草棚，瓜田的茅屋，被围困的城邑。"],[9,"若不是万军之耶和华给我们稍留余种，我们早已像所多玛、蛾摩拉的样子了。"],[10,"你们这所多玛的官长啊，要听耶和华的话！你们这蛾摩拉的百姓啊，要侧耳听我们神的训诲！"],[11,"耶和华说：“你们所献的许多祭物与我何益呢？公绵羊的燔祭和肥畜的脂油，我已经够了。公牛的血，羊羔的血，公山羊的血，我都不喜悦。”"],[12,"“你们来朝见我，谁向你们讨这些，使你们践踏我的院宇呢？"],[13,"你们不要再献虚浮的供物。香品是我所憎恶的；月朔和安息日，并宣召的大会，也是我所憎恶的；作罪孽，又守严肃会，我也不能容忍。"],[14,"你们的月朔和节期，我心里恨恶，我都以为麻烦；我担当，便不耐烦。"],[15,"你们举手祷告，我必遮眼不看；就是你们多多地祈祷，我也不听。你们的手都满了杀人的血。"],[16,"你们要洗濯、自洁，从我眼前除掉你们的恶行；要止住作恶，"],[17,"学习行善，寻求公平，解救受欺压的，给孤儿伸冤，为寡妇辨屈。”"],[18,"耶和华说：“你们来，我们彼此辩论。你们的罪虽像朱红，必变成雪白；虽红如丹颜，必白如羊毛。"],[19,"你们若甘心听从，必吃地上的美物；"],[20,"若不听从，反倒悖逆，必被刀剑吞灭。”这是耶和华亲口说的。"],[21,"可叹忠信的城变为妓女。从前充满了公平，公义居在其中，现今却有凶手居住。"],[22,"你的银子变为渣滓；你的酒用水搀对。"],[23,"你的官长居心悖逆，与盗贼作伴，各都喜爱贿赂，追求赃私。他们不为孤儿伸冤，寡妇的案件也不得呈到他们面前。"],[24,"因此，主万军之耶和华以色列的大能者说：“哎！我要向我的对头雪恨，向我的敌人报仇。"],[25,"我必反手加在你身上，炼尽你的渣滓，除净你的杂质。"],[26,"我也必复还你的审判官，像起初一样；复还你的谋士，像起先一般。然后，你必称为公义之城、忠信之邑。”"],[27,"锡安必因公平得蒙救赎，其中归正的人必因公义得蒙救赎。"],[28,"但悖逆的和犯罪的必一同败亡；离弃耶和华的必致消灭。"],[29,"那等人必因你们所喜爱的橡树抱愧，你们必因所选择的园子蒙羞。"],[30,"因为你们必如叶子枯干的橡树，好像无水浇灌的园子。"],[31,"有权势的必如麻瓤，他的工作好像火星，都要一同焚毁，无人扑灭。"]]},{"n":2,"v":[[1,"亚摩斯的儿子以赛亚得默示，论到犹大和耶路撒冷。"],[2,"末后的日子，耶和华殿的山必坚立，超乎诸山，高举过于万岭，万民都要流归这山。"],[3,"必有许多国的民前往，说：“来吧！我们登耶和华的山，奔雅各神的殿；主必将他的道教训我们，我们也要行他的路。因为训诲必出于锡安；耶和华的言语必出于耶路撒冷。”"],[4,"他必在列国中施行审判，为许多国民断定是非。他们要将刀打成犁头，把枪打成镰刀；这国不举刀攻击那国，他们也不再学习战事。"],[5,"雅各家啊，来吧！我们在耶和华的光明中行走。"],[6,"耶和华，你离弃了你百姓雅各家，是因他们充满了东方的风俗，作观兆的，像非利士人一样，并与外邦人击掌。"],[7,"他们的国满了金银，财宝也无穷；他们的地满了马匹，车辆也无数。"],[8,"他们的地满了偶像，他们跪拜自己手所造的，就是自己指头所作的。"],[9,"卑贱人屈膝，尊贵人下跪，所以不可饶恕他们。"],[10,"你当进入岩穴，藏在土中，躲避耶和华的惊吓和他威严的荣光。"],[11,"到那日，眼目高傲的必降为卑，性情狂傲的都必屈膝，惟独耶和华被尊崇。"],[12,"必有万军耶和华降罚的一个日子，要临到骄傲狂妄的，一切自高的都必降为卑；"],[13,"又临到黎巴嫩高大的香柏树和巴珊的橡树；"],[14,"又临到一切高山的峻岭；"],[15,"又临到高台和坚固城墙；"],[16,"又临到他施的船只，并一切可爱的美物。"],[17,"骄傲的必屈膝，狂妄的必降卑。在那日，惟独耶和华被尊崇。"],[18,"偶像必全然废弃。"],[19,"耶和华兴起使地大震动的时候，人就进入石洞，进入土穴，躲避耶和华的惊吓和他威严的荣光。"],[20,"到那日，人必将为拜而造的金偶像、银偶像，抛给田鼠和蝙蝠。"],[21,"到耶和华兴起使地大震动的时候，人好进入磐石洞中和岩石穴里，躲避耶和华的惊吓和他威严的荣光。"],[22,"你们休要倚靠世人，他鼻孔里不过有气息，他在一切事上可算什么呢？"]]},{"n":3,"v":[[1,"主万军之耶和华从耶路撒冷和犹大除掉众人所倚靠的，所仗赖的，就是所倚靠的粮，所仗赖的水，"],[2,"除掉勇士和战士、审判官和先知、占卜的和长老、"],[3,"五十夫长和尊贵人、谋士和有巧艺的，以及妙行法术的。"],[4,"主说：“我必使孩童作他们的首领，使婴孩辖管他们。"],[5,"百姓要彼此欺压，各人受邻舍的欺压；少年人必侮慢老年人，卑贱人必侮慢尊贵人。”"],[6,"“人在父家拉住弟兄，说：‘你有衣服，可以作我们的官长，这败落的事归在你手下吧！’"],[7,"那时他必扬声说：‘我不作医治你们的人，因我家中没有粮食，也没有衣服，你们不可立我作百姓的官长。’”"],[8,"耶路撒冷败落，犹大倾倒；因为他们的舌头和行为与耶和华反对，惹了他荣光的眼目。"],[9,"他们的面色证明自己的不正；他们述说自己的罪恶，并不隐瞒，好像所多玛一样。他们有祸了，因为作恶自害。"],[10,"你们要论义人说，他必享福乐，因为要吃自己行为所结的果子。"],[11,"恶人有祸了，他必遭灾难，因为要照自己手所行的受报应。"],[12,"至于我的百姓，孩童欺压他们，妇女辖管他们。我的百姓啊，引导你的使你走错，并毁坏你所行的道路。"],[13,"耶和华起来辩论，站着审判众民。"],[14,"耶和华必审问他民中的长老和首领说：“吃尽葡萄园果子的就是你们；向贫穷人所夺的都在你们家中。”"],[15,"主万军之耶和华说：“你们为何压制我的百姓，搓磨贫穷人的脸呢？”"],[16,"耶和华又说：“因为锡安的女子狂傲，行走挺项，卖弄眼目，俏步徐行，脚下玎珰。"],[17,"所以主必使锡安的女子头长秃疮；耶和华又使她们赤露下体。”"],[18,"到那日，主必除掉她们华美的脚钏、发网、月牙圈、"],[19,"耳环、手镯、蒙脸的帕子、"],[20,"华冠、足练、华带、香盒、符囊、"],[21,"戒指、鼻环、"],[22,"吉服、外套、云肩、荷包、"],[23,"手镜、细麻衣、裹头巾、蒙身的帕子。"],[24,"必有臭烂代替馨香，绳子代替腰带，光秃代替美发，麻衣系腰代替华服，烙伤代替美容。"],[25,"你的男丁必倒在刀下；你的勇士必死在阵上。"],[26,"锡安（原文作“她”）的城门必悲伤、哀号；她必荒凉坐在地上。"]]},{"n":4,"v":[[1,"在那日，七个女人必拉住一个男人说：“我们吃自己的食物，穿自己的衣服，但求你许我们归你名下，求你除掉我们的羞耻。”"],[2,"到那日，耶和华发生的苗必华美尊荣，地的出产必为以色列逃脱的人显为荣华茂盛。"],[3,"-"],[4,"主以公义的灵和焚烧的灵，将锡安女子的污秽洗去，又将耶路撒冷中杀人的血除净。那时，剩在锡安、留在耶路撒冷的，就是一切住耶路撒冷、在生命册上记名的，必称为圣。"],[5,"耶和华也必在锡安全山，并各会众以上，使白日有烟云，黑夜有火焰的光，因为在全荣耀之上必有遮蔽。"],[6,"必有亭子，白日可以得荫避暑，也可以作为藏身之处，躲避狂风暴雨。"]]},{"n":5,"v":[[1,"我要为我所亲爱的唱歌，是我所爱者的歌，论他葡萄园的事。我所亲爱的有葡萄园在肥美的山冈上。"],[2,"他刨挖园子，捡去石头，栽种上等的葡萄树，在园中盖了一座楼，又凿出压酒池；指望结好葡萄，反倒结了野葡萄。"],[3,"耶路撒冷的居民和犹大人哪，请你们现今在我与我的葡萄园中，断定是非。"],[4,"我为我葡萄园所作之外，还有什么可作的呢？我指望结好葡萄，怎么倒结了野葡萄呢？"],[5,"现在我告诉你们，我要向我葡萄园怎样行：我必撤去篱笆，使它被吞灭；拆毁墙垣，使它被践踏。"],[6,"我必使它荒废，不再修理、不再锄刨，荆棘蒺藜倒要生长；我也必命云不降雨在其上。"],[7,"万军之耶和华的葡萄园，就是以色列家；他所喜爱的树，就是犹大人。他指望的是公平，谁知倒有暴虐（或作“倒流人血”）；指望的是公义，谁知倒有冤声。"],[8,"祸哉！那些以房接房、以地连地，以致不留余地的，只顾自己独居境内。"],[9,"我耳闻万军之耶和华说：“必有许多又大又美的房屋成为荒凉，无人居住。"],[10,"三十亩葡萄园只出一罢特酒，一贺梅珥谷种只结一伊法粮食。”"],[11,"祸哉！那些清早起来追求浓酒，留连到夜深，甚至因酒发烧的人。"],[12,"他们在筵席上弹琴、鼓瑟、击鼓、吹笛、饮酒，却不顾念耶和华的作为，也不留心他手所作的。"],[13,"所以我的百姓因无知就被掳去。他们的尊贵人甚是饥饿，群众极其干渴。"],[14,"故此，阴间扩张其欲，开了无限量的口；他们的荣耀、群众、繁华，并快乐的人，都落在其中。"],[15,"卑贱人被压服，尊贵人降为卑，眼目高傲的人也降为卑。"],[16,"惟有万军之耶和华因公平而崇高；圣者神因公义显为圣。"],[17,"那时，羊羔必来吃草，如同在自己的草场；丰肥人的荒场被游行的人吃尽。"],[18,"祸哉！那些以虚假之细绳牵罪孽的人，他们又像以套绳拉罪恶，"],[19,"说：“任他急速行，赶快成就他的作为，使我们看看；任以色列圣者所谋划的临近成就，使我们知道。”"],[20,"祸哉！那些称恶为善、称善为恶，以暗为光、以光为暗，以苦为甜、以甜为苦的人。"],[21,"祸哉！那些自以为有智慧，自看为通达的人。"],[22,"祸哉！那些勇于饮酒，以能力调浓酒的人。"],[23,"他们因受贿赂，就称恶人为义，将义人的义夺去。"],[24,"火苗怎样吞灭碎秸，干草怎样落在火焰之中，照样，他们的根必像朽物，他们的花必像灰尘飞腾；因为他们厌弃万军之耶和华的训诲，藐视以色列圣者的言语。"],[25,"所以，耶和华的怒气向他的百姓发作。他的手伸出攻击他们，山岭就震动，他们的尸首在街市上好像粪土。虽然如此，他的怒气还未转消，他的手仍伸不缩。"],[26,"他必竖立大旗，招远方的国民，发嘶声叫他们从地极而来。看哪！他们必急速奔来。"],[27,"其中没有疲倦的，绊跌的；没有打盹的，睡觉的；腰带并不放松，鞋带也不折断。"],[28,"他们的箭快利，弓也上了弦；马蹄算如坚石，车轮好像旋风。"],[29,"他们要吼叫，像母狮子，咆哮，像少壮狮子；他们要咆哮抓食，坦然叨去，无人救回。"],[30,"那日，他们要向以色列人吼叫，像海浪砰訇。人若望地，只见黑暗艰难，光明在云中变为昏暗。"]]},{"n":6,"v":[[1,"当乌西雅王崩的那年，我见主坐在高高的宝座上。他的衣裳垂下，遮满圣殿。"],[2,"其上有撒拉弗侍立，各有六个翅膀：用两个翅膀遮脸，两个翅膀遮脚，两个翅膀飞翔。"],[3,"彼此呼喊说：“圣哉！圣哉！圣哉！万军之耶和华，他的荣光充满全地！”"],[4,"因呼喊者的声音，门槛的根基震动，殿充满了烟云。"],[5,"那时我说：“祸哉！我灭亡了！因为我是嘴唇不洁的人，又住在嘴唇不洁的民中；又因我眼见大君王万军之耶和华。”"],[6,"有一撒拉弗飞到我跟前，手里拿着红炭，是用火剪从坛上取下来的，"],[7,"将炭沾我的口，说：“看哪！这炭沾了你的嘴，你的罪孽便除掉，你的罪恶就赦免了。”"],[8,"我又听见主的声音说：“我可以差遣谁呢？谁肯为我们去呢？”我说：“我在这里，请差遣我！”"],[9,"他说：“你去告诉这百姓说：你们听是要听见，却不明白；看是要看见，却不晓得。"],[10,"要使这百姓心蒙脂油，耳朵发沉，眼睛昏迷；恐怕眼睛看见，耳朵听见，心里明白，回转过来，便得医治。”"],[11,"我就说：“主啊！这到几时为止呢？”他说：“直到城邑荒凉，无人居住，房屋空闲无人，地土极其荒凉。"],[12,"并且耶和华将人迁到远方，在这境内撇下的地土很多。"],[13,"境内剩下的人若还有十分之一，也必被吞灭，像栗树、橡树，虽被砍伐，树墩子却仍存留。这圣洁的种类在国中也是如此。”"]]},{"n":7,"v":[[1,"乌西雅的孙子、约坦的儿子犹大王亚哈斯在位的时候，亚兰王利汛和利玛利的儿子以色列王比加上来攻打耶路撒冷，却不能攻取。"],[2,"有人告诉大卫家说：“亚兰与以法莲已经同盟。”王的心和百姓的心就都跳动，好像林中的树被风吹动一样。"],[3,"耶和华对以赛亚说：“你和你的儿子施亚雅述出去，到上池的水沟头，在漂布地的大路上去迎接亚哈斯。"],[4,"对他说：‘你要谨慎安静，不要因亚兰王利汛和利玛利的儿子这两个冒烟的火把头所发的烈怒害怕，也不要心里胆怯。"],[5,"因为亚兰和以法莲，并利玛利的儿子设恶谋害你，"],[6,"说：我们可以上去攻击犹大，扰乱它，攻破它，在其中立他比勒的儿子为王。’"],[7,"所以主耶和华如此说：这所谋的必立不住，也不得成就。"],[8,"原来亚兰的首城是大马士革，大马士革的首领是利汛。六十五年之内，以法莲必然破坏，不再成为国民。"],[9,"以法莲的首城是撒玛利亚，撒玛利亚的首领是利玛利的儿子。你们若是不信，定然不得立稳。’”"],[10,"耶和华又晓谕亚哈斯说："],[11,"“你向耶和华你的神求一个兆头，或求显在深处，或求显在高处。”"],[12,"亚哈斯说：“我不求；我不试探耶和华。”"],[13,"以赛亚说：“大卫家啊，你们当听！你们使人厌烦岂算小事，还要使我的神厌烦吗？"],[14,"因此，主自己要给你们一个兆头，必有童女怀孕生子，给他起名叫以马内利（就是“神与我们同在”的意思）。"],[15,"到他晓得弃恶择善的时候，他必吃奶油与蜂蜜。"],[16,"因为在这孩子还不晓得弃恶择善之先，你所憎恶的那二王之地必致见弃。"],[17,"耶和华必使亚述王攻击你的日子临到你和你的百姓并你的父家。自从以法莲离开犹大以来，未曾有这样的日子。”"],[18,"“那时，耶和华要发嘶声，使埃及江河源头的苍蝇和亚述地的蜂子飞来；"],[19,"都必飞来，落在荒凉的谷内、磐石的穴里和一切荆棘篱笆中，并一切的草场上。”"],[20,"“那时，主必用大河外赁的剃头刀，就是亚述王，剃去头发和脚上的毛，并要剃净胡须。”"],[21,"“那时，一个人要养活一只母牛犊，两只母绵羊。"],[22,"因为出的奶多，他就得吃奶油；在境内所剩的人都要吃奶油与蜂蜜。”"],[23,"“从前凡种一千棵葡萄树，值银一千舍客勒的地方，到那时必长荆棘和蒺藜。"],[24,"人上那里去，必带弓箭，因为遍地满了荆棘和蒺藜。"],[25,"所有用锄刨挖的山地，你因怕荆棘和蒺藜，不敢上那里去；只可成了放牛之处，为羊践踏之地。”"]]},{"n":8,"v":[[1,"耶和华对我说：“你取一个大牌，拿人所用的笔（或作“人常用的字”），写上玛黑珥色拉勒哈施罢斯（就是“掳掠速临，抢夺快到”的意思）。"],[2,"我要用诚实的见证人，祭司乌利亚和耶比利家的儿子撒迦利亚记录这事。”"],[3,"我以赛亚与妻子（原文作“女先知”）同室，她怀孕生子，耶和华就对我说：“给他起名叫玛黑珥色拉勒哈施罢斯。"],[4,"因为在这小孩子不晓得叫父叫母之先，大马士革的财宝和撒玛利亚的掳物，必在亚述王面前搬了去。”"],[5,"耶和华又晓谕我说："],[6,"“这百姓既厌弃西罗亚缓流的水，喜悦利汛和利玛利的儿子；"],[7,"因此，主必使大河翻腾的水猛然冲来，就是亚述王和他所有的威势，必漫过一切的水道，涨过两岸；"],[8,"必冲入犹大，涨溢泛滥，直到颈项。以马内利啊，他展开翅膀，遍满你的地。”"],[9,"列国的人民哪，任凭你们喧嚷，终必破坏；远方的众人哪，当侧耳而听！任凭你们束起腰来，终必破坏；你们束起腰来，终必破坏。"],[10,"任凭你们同谋，终归无有；任凭你们言定，终不成立。因为神与我们同在。"],[11,"耶和华以大能的手，指教我不可行这百姓所行的道，对我这样说："],[12,"“这百姓说同谋背叛，你们不要说同谋背叛。他们所怕的，你们不要怕，也不要畏惧。"],[13,"但要尊万军之耶和华为圣，以他为你们所当怕的、所当畏惧的。"],[14,"他必作为圣所，却向以色列两家作绊脚的石头、跌人的磐石；向耶路撒冷的居民作为圈套和网罗。"],[15,"许多人必在其上绊脚跌倒，而且跌碎，并陷入网罗被缠住。”"],[16,"你要卷起律法书，在我门徒中间封住训诲。"],[17,"我要等候那掩面不顾雅各家的耶和华，我也要仰望他。"],[18,"看哪，我与耶和华所给我的儿女，就是从住在锡安山万军之耶和华来的，在以色列中作为预兆和奇迹。"],[19,"有人对你们说：“当求问那些交鬼的和行巫术的，就是声音绵蛮，言语微细的。”你们便回答说：“百姓不当求问自己的神吗？岂可为活人求问死人呢？”"],[20,"人当以训诲和法度为标准，他们所说的若不与此相符，必不得见晨光。"],[21,"他们必经过这地，受艰难、受饥饿；饥饿的时候，心中焦躁，咒骂自己的君王和自己的神。"],[22,"仰观上天，俯察下地，不料，尽是艰难、黑暗和幽暗的痛苦。他们必被赶入乌黑的黑暗中去。"]]},{"n":9,"v":[[1,"但那受过痛苦的，必不再见幽暗。从前神使西布伦地和拿弗他利地被藐视，末后却使这沿海的路，约旦河外，外邦人的加利利地得着荣耀。"],[2,"在黑暗中行走的百姓看见了大光；住在死荫之地的人有光照耀他们。"],[3,"你使这国民繁多，加增他们的喜乐，他们在你面前欢喜，好像收割的欢喜，像人分掳物那样的快乐。"],[4,"因为他们所负的重轭和肩头上的杖，并欺压他们人的棍，你都已经折断，好像在米甸的日子一样。"],[5,"战士在乱杀之间所穿戴的盔甲，并那滚在血中的衣服，都必作为可烧的，当作火柴。"],[6,"因有一婴孩为我们而生，有一子赐给我们，政权必担在他的肩头上。他名称为奇妙、策士、全能的神、永在的父、和平的君。"],[7,"他的政权与平安必加增无穷。他必在大卫的宝座上治理他的国，以公平公义使国坚定稳固，从今直到永远。万军之耶和华的热心必成就这事。"],[8,"主使一言入于雅各家，落于以色列家。"],[9,"这众百姓，就是以法莲和撒玛利亚的居民，都要知道，他们凭骄傲自大的心说："],[10,"“砖墙塌了，我们却要凿石头建筑；桑树砍了，我们却要换香柏树。”"],[11,"因此，耶和华要高举利汛的敌人来攻击以色列，并要激动以色列的仇敌。"],[12,"东有亚兰人，西有非利士人；他们张口要吞吃以色列。虽然如此，耶和华的怒气还未转消，他的手仍伸不缩。"],[13,"这百姓还没有归向击打他们的主，也没有寻求万军之耶和华。"],[14,"因此，耶和华一日之间必从以色列中剪除头与尾、棕枝与芦苇。"],[15,"长老和尊贵人就是头，以谎言教人的先知就是尾。"],[16,"因为引导这百姓的，使他们走错了路；被引导的都必败亡。"],[17,"所以，主必不喜悦他们的少年人，也不怜恤他们的孤儿寡妇。因为各人是亵渎的，是行恶的，并且各人的口都说愚妄的话。虽然如此，耶和华的怒气还未转消，他的手仍伸不缩。"],[18,"邪恶像火焚烧，烧灭荆棘和蒺藜，在稠密的树林中着起来，就成为烟柱，旋转上腾。"],[19,"因万军之耶和华的烈怒，地都烧遍，百姓成为火柴，无人怜爱弟兄。"],[20,"有人右边抢夺，仍受饥饿；左边吞吃，仍不饱足。各人吃自己膀臂上的肉。"],[21,"玛拿西吞吃（或作“攻击”。下同）以法莲，以法莲吞吃玛拿西，又一同攻击犹大。虽然如此，耶和华的怒气还未转消，他的手仍伸不缩。"]]},{"n":10,"v":[[1,"祸哉！那些设立不义之律例的和记录奸诈之判语的，"],[2,"为要屈枉穷乏人，夺去我民中困苦人的理，以寡妇当作掳物，以孤儿当作掠物。"],[3,"到降罚的日子，有灾祸从远方临到。那时，你们怎样行呢？你们向谁逃奔求救呢？你们的荣耀（或作“财宝”）存留何处呢？"],[4,"他们只得屈身在被掳的人以下，仆倒在被杀的人以下。虽然如此，耶和华的怒气还未转消，他的手仍伸不缩。"],[5,"“亚述是我怒气的棍，手中拿我恼恨的杖。"],[6,"我要打发他攻击亵渎的国民，吩咐他攻击我所恼怒的百姓，抢财为掳物，夺货为掠物，将他们践踏，像街上的泥土一样。"],[7,"然而他不是这样的意思，他心也不这样打算。他心里倒想毁灭、剪除不少的国。"],[8,"他说：“我的臣仆岂不都是王吗？"],[9,"迦勒挪岂不像迦基米施吗？哈玛岂不像亚珥拔吗？撒玛利亚岂不像大马士革吗？"],[10,"我手已经购到有偶像的国，这些国雕刻的偶像过于耶路撒冷和撒玛利亚的偶像。"],[11,"我怎样待撒玛利亚和其中的偶像，岂不照样待耶路撒冷和其中的偶像吗？”"],[12,"主在锡安山和耶路撒冷成就他一切工作的时候，主说：“我必罚亚述王自大的心和他高傲眼目的荣耀。”"],[13,"因为他说：“我所成就的事，是靠我手的能力和我的智慧，我本有聪明。我挪移列国的地界，抢夺他们所积蓄的财宝，并且我像勇士，使坐宝座的降为卑。"],[14,"我的手购到列国的财宝，好像人购到鸟窝；我也得了全地，好像人拾起所弃的雀蛋。没有动翅膀的，没有张嘴的，也没有鸣叫的。”"],[15,"斧岂可向用斧砍木的自夸呢？锯岂可向用锯的自大呢？好比棍抡起那举棍的，好比杖举起那非木的人。"],[16,"因此，主万军之耶和华必使亚述王的肥壮人变为瘦弱，在他的荣华之下必有火着起，如同焚烧一样。"],[17,"以色列的光必如火，他的圣者必如火焰。在一日之间将亚述王的荆棘和蒺藜焚烧净尽，"],[18,"又将他树林和肥田的荣耀全然烧尽，好像拿军旗的昏过去一样。"],[19,"他林中剩下的树必稀少，就是孩子也能写其数。"],[20,"到那日，以色列所剩下的和雅各家所逃脱的，不再倚靠那击打他们的，却要诚实倚靠耶和华以色列的圣者。"],[21,"所剩下的，就是雅各家所剩下的，必归回全能的神。"],[22,"以色列啊，你的百姓虽多如海沙，惟有剩下的归回。原来灭绝的事已定，必有公义施行，如水涨溢。"],[23,"因为主万军之耶和华在全地之中，必成就所定规的结局。"],[24,"所以主万军之耶和华如此说：“住锡安我的百姓啊，亚述王虽然用棍击打你，又照埃及的样子举杖攻击你，你却不要怕他。"],[25,"因为还有一点点时候，向你们发的忿恨就要完毕，我的怒气要向他发作，使他灭亡。"],[26,"万军之耶和华要兴起鞭来攻击他，好像在俄立磐石那里杀戮米甸人一样。耶和华的杖要向海伸出，把杖举起，像在埃及一样。"],[27,"到那日，亚述王的重担必离开你的肩头，他的轭必离开你的颈项，那轭也必因肥壮的缘故撑断（或作“因膏油的缘故毁坏”）。”"],[28,"亚述王来到亚叶，经过米矶仑，在密抹安放辎重。"],[29,"他们过了隘口，在迦巴住宿。拉玛人战兢，扫罗的基比亚人逃跑。"],[30,"迦琳的居民哪（“居民”原文作“女子”），要高声呼喊！莱煞人哪，须听。哀哉！困苦的亚拿突啊，"],[31,"玛得米那人躲避，基柄的居民逃遁。"],[32,"当那日，亚述王要在挪伯歇兵，向锡安女子的山，就是耶路撒冷的山，抡手攻他。"],[33,"看哪，主万军之耶和华以惊吓削去树枝，长高的必被砍下，高大的必被伐倒。"],[34,"稠密的树林，他要用铁器砍下；黎巴嫩的树木必被大能者伐倒。"]]},{"n":11,"v":[[1,"从耶西的本（原文作“不”）必发一条，从他根生的枝子必结果实。"],[2,"耶和华的灵必住在他身上，就是使他有智慧和聪明的灵、谋略和能力的灵、知识和敬畏耶和华的灵。"],[3,"他必以敬畏耶和华为乐，行审判不凭眼见，断是非也不凭耳闻；"],[4,"却要以公义审判贫穷人，以正直判断世上的谦卑人，以口中的杖击打世界，以嘴里的气杀戮恶人。"],[5,"公义必当他的腰带，信实必当他胁下的带子。"],[6,"豺狼必与绵羊羔同居，豹子与山羊羔同卧，少壮狮子与牛犊并肥畜同群；小孩子要牵引它们。"],[7,"牛必与熊同食，牛犊必与小熊同卧，狮子必吃草与牛一样。"],[8,"吃奶的孩子必玩耍在虺蛇的洞口，断奶的婴儿必按手在毒蛇的穴上。"],[9,"在我圣山的遍处，这一切都不伤人、不害物，因为认识耶和华的知识要充满遍地，好像水充满洋海一般。"],[10,"到那日，耶西的根立作万民的大旗，外邦人必寻求他，他安息之所大有荣耀。"],[11,"当那日，主必二次伸手救回自己百姓中所余剩的，就是在亚述、埃及、巴忒罗、古实、以拦、示拿、哈马，并众海岛所剩下的。"],[12,"他必向列国竖立大旗，招回以色列被赶散的人，又从地的四方聚集分散的犹大人。"],[13,"以法莲的嫉妒就必消散，扰害犹大的必被剪除；以法莲必不嫉妒犹大，犹大也不扰害以法莲。"],[14,"他们要向西飞，扑在非利士人的肩头上（“肩头上”或作“西界”），一同掳掠东方人，伸手按住以东和摩押，亚扪人也必顺服他们。"],[15,"耶和华必使埃及海汊枯干，抡手用暴热的风使大河分为七条，令人过去不至湿脚。"],[16,"为主余剩的百姓，就是从亚述剩下回来的，必有一条大道，如当日以色列从埃及地上来一样。"]]},{"n":12,"v":[[1,"到那日，你必说：“耶和华啊，我要称谢你！因为你虽然向我发怒，你的怒气却已转消，你又安慰了我。"],[2,"看哪！神是我的拯救，我要倚靠他，并不惧怕；因为主耶和华是我的力量，是我的诗歌，他也成了我的拯救。”"],[3,"所以，你们必从救恩的泉源欢然取水。"],[4,"在那日，你们要说：“当称谢耶和华，求告他的名，将他所行的传扬在万民中，提说他的名已被尊崇。"],[5,"你们要向耶和华唱歌，因他所行的甚是美好；但愿这事普传天下。"],[6,"锡安的居民哪，当扬声欢呼，因为在你们中间的以色列圣者乃为至大。”"]]},{"n":13,"v":[[1,"亚摩斯的儿子以赛亚得默示，论巴比伦。"],[2,"应当在净光的山竖立大旗，向群众扬声招手，使他们进入贵胄的门。"],[3,"我吩咐我所挑出来的人，我招呼我的勇士，就是那矜夸高傲之辈，为要成就我怒中所定的。"],[4,"山间有多人的声音，好像是大国人民。有许多国的民聚集哄嚷的声音，这是万军之耶和华点齐军队，预备打仗。"],[5,"他们从远方来，从天边来，就是耶和华并他恼恨的兵器，要毁灭这全地。"],[6,"你们要哀号，因为耶和华的日子临近了；这日来到，好像毁灭从全能者来到。"],[7,"所以，人手都必软弱，人心都必消化。"],[8,"他们必惊惶悲痛，愁苦必将他们抓住。他们疼痛，好像产难的妇人一样，彼此惊奇相看，脸如火焰。"],[9,"耶和华的日子临到，必有残忍、忿恨、烈怒，使这地荒凉，从其中除灭罪人。"],[10,"天上的众星群宿都不发光，日头一出，就变黑暗，月亮也不放光。"],[11,"我必因邪恶刑罚世界，因罪孽刑罚恶人，使骄傲人的狂妄止息，制伏强暴人的狂傲。"],[12,"我必使人比精金还少，使人比俄斐纯金更少。"],[13,"我万军之耶和华在忿恨中发烈怒的日子，必使天震动，使地摇撼，离其本位。"],[14,"人必像被追赶的鹿，像无人收聚的羊，各归回本族，各逃到本土。"],[15,"凡被仇敌追上的，必被刺死；凡被捉住的，必被刀杀。"],[16,"他们的婴孩，必在他们眼前摔碎；他们的房屋，必被抢夺；他们的妻子，必被玷污。"],[17,"我必激动玛代人来攻击他们。玛代人不注重银子，也不喜爱金子。"],[18,"他们必用弓击碎少年人，不怜悯妇人所生的，眼也不顾惜孩子。"],[19,"巴比伦素来为列国的荣耀，为迦勒底人所矜夸的华美，必像神所倾覆的所多玛、蛾摩拉一样。"],[20,"其内必永无人烟，世世代代无人居住，阿拉伯人也不在那里支搭帐棚，牧羊的人也不使羊群卧在那里。"],[21,"只有旷野的走兽卧在那里，咆哮的兽满了房屋；鸵鸟住在那里，野山羊在那里跳舞。"],[22,"豺狼必在她宫中呼号，野狗必在她华美殿内吼叫。巴比伦受罚的时候临近，她的日子必不长久。"]]},{"n":14,"v":[[1,"耶和华要怜恤雅各，必再拣选以色列，将他们安置在本地，寄居的必与他们联合，紧贴雅各家。"],[2,"外邦人必将他们带回本土；以色列家必在耶和华的地上得外邦人为仆婢，也要掳掠先前掳掠他们的，辖制先前欺压他们的。"],[3,"当耶和华使你脱离愁苦、烦恼，并人勉强你作的苦工，得享安息的日子，"],[4,"你必题这诗歌论巴比伦王说：“欺压人的何竟息灭？强暴的何竟止息？"],[5,"耶和华折断了恶人的杖，辖制人的圭，"],[6,"就是在忿怒中连连攻击众民的，在怒气中辖制列国，行逼迫无人阻止的。"],[7,"现在全地得安息、享平静，人皆发声欢呼。"],[8,"松树和黎巴嫩的香柏树都因你欢乐，说：‘自从你仆倒，再无人上来砍伐我们。’"],[9,"你下到阴间，阴间就因你震动，来迎接你。又因你惊动在世曾为首领的阴魂，并使那曾为列国君王的都离位站起，"],[10,"他们都要发言对你说：‘你也变为软弱像我们一样吗？你也成了我们的样子吗？’"],[11,"你的威势和你琴瑟的声音都下到阴间；你下铺的是虫，上盖的是蛆。”"],[12,"“明亮之星，早晨之子啊！你何竟从天坠落？你这攻败列国的，何竟被砍倒在地上？"],[13,"你心里曾说：‘我要升到天上，我要高举我的宝座在神众星以上；我要坐在聚会的山上，在北方的极处；"],[14,"我要升到高云之上，我要与至上者同等。’"],[15,"然而你必坠落阴间，到坑中极深之处。"],[16,"凡看见你的，都要定睛看你，留意看你，说：‘使大地战抖，使列国震动，"],[17,"使世界如同荒野，使城邑倾覆，不释放被掳的人归家，是这个人吗？’"],[18,"列国的君王俱各在自己阴宅的荣耀中安睡。"],[19,"惟独你被抛弃，不得入你的坟墓，好像可憎的枝子，以被杀的人为衣，就是被刀刺透，坠落坑中石头那里的；你又像被践踏的尸首一样。"],[20,"你不得与君王同葬，因为你败坏你的国，杀戮你的民。”“恶人后裔的名，必永不提说。"],[21,"先人既有罪孽，就要预备杀戮他的子孙，免得他们兴起来，得了遍地，在世上修满城邑。”"],[22,"万军之耶和华说：“我必兴起攻击他们，将巴比伦的名号和所余剩的人，连子带孙一并剪除。这是耶和华说的。"],[23,"我必使巴比伦为箭猪所得，又变为水池；我要用灭亡的扫帚扫净他。这是万军之耶和华说的。”"],[24,"万军之耶和华起誓说：“我怎样思想，必照样成就；我怎样定意，必照样成立，"],[25,"就是在我地上打折亚述人，在我山上将他践踏。他加的轭必离开以色列人；他加的重担必离开他们的肩头。"],[26,"这是向全地所定的旨意，这是向万国所伸出的手。”"],[27,"万军之耶和华既然定意，谁能废弃呢？他的手已经伸出，谁能转回呢？"],[28,"亚哈斯王崩的那年，就有以下的默示。"],[29,"非利士全地啊，不要因击打你的杖折断就喜乐，因为从蛇的根必生出毒蛇，它所生的，是火焰的飞龙。"],[30,"贫寒人的长子必有所食，穷乏人必安然躺卧。我必以饥荒治死你的根，你所余剩的人必被杀戮。"],[31,"门哪，应当哀号！城啊，应当呼喊！非利士全地啊，你都消化了！因为有烟从北方出来，他行伍中并无乱队的。"],[32,"可怎样回答外邦的使者呢（“外邦”或指“非利士”）？必说：“耶和华建立了锡安，他百姓中的困苦人必投奔在其中。”"]]},{"n":15,"v":[[1,"论摩押的默示：一夜之间，摩押的亚珥变为荒废，归于无有；一夜之间，摩押的基珥变为荒废，归于无有。"],[2,"他们上巴益，又往底本，到高处去哭泣。摩押人因尼波和米底巴哀号，各人头上光秃，胡须剃净。"],[3,"他们在街市上都腰束麻布，在房顶上和宽阔处俱各哀号，眼泪汪汪。"],[4,"希实本和以利亚利悲哀的声音达到雅杂，所以摩押带兵器的高声喊嚷，人心战兢。"],[5,"我心为摩押悲哀，她的贵胄（或作“逃民”）逃到琐珥，到伊基拉、施利施亚。他们上鲁希坡随走随哭；在何罗念的路上，因毁灭举起哀声。"],[6,"因为宁林的水成为干涸，青草枯干，嫩草灭没，青绿之物一无所有。"],[7,"因此，摩押人所得的财物和所积蓄的都要运过柳树河。"],[8,"哀声遍闻摩押的四境；哀号的声音达到以基莲；哀号的声音达到比珥以琳。"],[9,"底们的水充满了血；我还要加增底们的灾难，叫狮子来追上摩押逃脱的民和那地上所余剩的人。"]]},{"n":16,"v":[[1,"你们当将羊羔奉给那地掌权的，从西拉往旷野，送到锡安城的山（“城”原文作“女子”）。"],[2,"摩押的居民（“居民”原文作“女子”）在亚嫩渡口，必像游飞的鸟，如拆窝的雏。"],[3,"求你献谋略、行公平，使你的影子在午间如黑夜，隐藏被赶散的人，不可显露逃民。"],[4,"求你容我这被赶散的人和你同居。至于摩押，求你作她的隐密处，脱离灭命者的面。勒索人的归于无有，毁灭的事止息了，欺压人的从国中除灭了。"],[5,"必有宝座因慈爱坚立，必有一位诚诚实实坐在其上，在大卫帐幕中施行审判，寻求公平，速行公义。"],[6,"我们听说摩押人骄傲，是极其骄傲；听说她狂妄、骄傲、忿怒，她夸大的话是虚空的。"],[7,"因此，摩押人必为摩押哀号，人人都要哀号。你们摩押人要为吉珥哈列设的葡萄饼哀叹，极其忧伤。"],[8,"因为希实本的田地和西比玛的葡萄树都衰残了。列国的君主折断其上美好的枝子；这枝子长到雅谢延到旷野，嫩枝向外探出，直探过盐海。"],[9,"因此，我要为西比玛的葡萄树哀哭，与雅谢人哀哭一样。希实本、以利亚利啊，我要以眼泪浇灌你，因为有交战呐喊的声音临到你夏天的果子，并你收割的庄稼。"],[10,"从肥美的田中夺去了欢喜快乐；在葡萄园里必无歌唱，也无欢呼的声音。踹酒的在酒醡中不得踹出酒来，我使他欢呼的声音止息。"],[11,"因此，我心腹为摩押哀鸣如琴；我心肠为吉珥哈列设也是如此。"],[12,"摩押人朝见的时候，在高处疲乏，又到他圣所祈祷，也不蒙应允。"],[13,"这是耶和华从前论摩押的话。"],[14,"但现在耶和华说：“三年之内，照雇工的年数，摩押的荣耀与她的群众必被藐视，余剩的人甚少无几。”"]]},{"n":17,"v":[[1,"论大马士革的默示：看哪，大马士革已被废弃，不再为城，必变作乱堆。"],[2,"亚罗珥的城邑已被撇弃，必成为牧羊之处；羊在那里躺卧，无人惊吓。"],[3,"以法莲不再有保障；大马士革不再有国权；亚兰所剩下的，必像以色列人的荣耀消灭一样。这是万军之耶和华说的。"],[4,"到那日，雅各的荣耀必至枵薄，他肥胖的身体必渐瘦弱；"],[5,"就必像收割的人收敛禾稼，用手割取穗子，又像人在利乏音谷拾取遗落的穗子。"],[6,"其间所剩下的不多，好像人打橄榄树，在尽上的枝梢上只剩两三个果子，在多果树的旁枝上只剩四五个果子。这是耶和华以色列的神说的。"],[7,"当那日，人必仰望造他们的主，眼目重看以色列的圣者。"],[8,"他们必不仰望祭坛，就是自己手所筑的，也不重看自己指头所作的，无论是木偶、是日像。"],[9,"在那日，他们的坚固城必像树林中和山顶上所撇弃的地方，就是从前在以色列人面前被人撇弃的。这样，地就荒凉了。"],[10,"因你忘记救你的神，不记念你能力的磐石，所以你栽上佳美的树秧子，插上异样的栽子。"],[11,"栽种的日子，你周围圈上篱笆，又到早晨使你所种的开花；但在愁苦极其伤痛的日子，所收割的都飞去了。"],[12,"唉！多民哄嚷，好像海浪砰訇；列邦奔腾，好像猛水滔滔；"],[13,"列邦奔腾，好像多水滔滔；但神斥责他们，他们就远远逃避，又被追赶，如同山上的风前糠，又如暴风前的旋风土。"],[14,"到晚上有惊吓，未到早晨他们就没有了。这是掳掠我们之人所得的份，是抢夺我们之人的报应。"]]},{"n":18,"v":[[1,"唉！古实河外翅膀刷刷响声之地，"],[2,"差遣使者在水面上，坐蒲草船过海。先知说：“你们快行的使者，要到高大光滑的民那里去。自从开国以来，那民极其可畏，是分地界践踏人的，他们的地有江河分开。”"],[3,"世上一切的居民和地上所住的人哪，山上竖立大旗的时候，你们要看；吹角的时候，你们要听。"],[4,"耶和华对我这样说：“我要安静，在我的居所观看，如同日光中的清热，又如露水的云雾在收割的热天。”"],[5,"收割之先，花开已谢，花也成了将熟的葡萄；他必用镰刀削去嫩枝，又砍掉蔓延的枝条，"],[6,"都要撇给山间的鸷鸟和地上的野兽。夏天鸷鸟要宿在其上，冬天野兽都卧在其中。"],[7,"到那时，这高大光滑的民，就是从开国以来极其可畏、分地界践踏人的，他们的地有江河分开，他们必将礼物奉给万军之耶和华，就是奉到锡安山，耶和华安置他名的地方。"]]},{"n":19,"v":[[1,"论埃及的默示：看哪，耶和华乘驾快云，临到埃及。埃及的偶像在他面前战兢；埃及人的心在里面消化。"],[2,"我必激动埃及人，攻击埃及人，弟兄攻击弟兄，邻舍攻击邻舍，这城攻击那城，这国攻击那国。"],[3,"埃及人的心神必在里面耗尽。我必败坏他们的谋略。他们必求问偶像和念咒的、交鬼的、行巫术的。"],[4,"我必将埃及人交在残忍主的手中，强暴王必辖制他们。这是主万军之耶和华说的。"],[5,"海中的水必绝尽，河也消没干涸。"],[6,"江河要变臭。埃及的河水都必减少枯干；苇子和芦荻都必衰残。"],[7,"靠尼罗河旁的草田，并沿尼罗河所种的田都必枯干。庄稼被风吹去，归于无有。"],[8,"打鱼的必哀哭，在尼罗河一切钓鱼的必悲伤，在水上撒网的必都衰弱。"],[9,"用梳好的麻造物的和织白布的都必羞愧。"],[10,"国柱必被打碎，所有佣工的，心必愁烦。"],[11,"琐安的首领极其愚昧；法老大有智慧的谋士所筹划的成为愚谋。你们怎敢对法老说：“我是智慧人的子孙，我是古王的后裔？”"],[12,"你的智慧人在哪里呢？万军之耶和华向埃及所定的旨意，他们可以知道，可以告诉你吧！"],[13,"琐安的首领都变为愚昧，挪弗的首领都受了迷惑；当埃及支派房角石的，使埃及人走错了路。"],[14,"耶和华使乖谬的灵搀入埃及中间，首领使埃及一切所作的都有差错，好像醉酒之人呕吐的时候东倒西歪一样。"],[15,"埃及中无论是头与尾，棕枝与芦苇，所作之工都不成就。"],[16,"到那日，埃及人必像妇人一样，他们必因万军之耶和华在埃及以上所抡的手战兢惧怕。"],[17,"犹大地必使埃及惊恐。向谁提起犹大地，谁就惧怕。这是因万军之耶和华向埃及所定的旨意。"],[18,"当那日，埃及地必有五城的人说迦南的方言，又指着万军之耶和华起誓。有一城，必称为灭亡城。"],[19,"当那日，在埃及地中必有为耶和华筑的一座坛；在埃及的边界上必有为耶和华立的一根柱。"],[20,"这都要在埃及地为万军之耶和华作记号和证据。埃及人因为受人的欺压哀求耶和华，他就差遣一位救主作护卫者，拯救他们。"],[21,"耶和华必被埃及人所认识，在那日埃及人必认识耶和华，也要献祭物和供物敬拜他，并向耶和华许愿还愿。"],[22,"耶和华必击打埃及，又击打又医治，埃及人就归向耶和华。他必应允他们的祷告，医治他们。"],[23,"当那日，必有从埃及通亚述去的大道，亚述人要进入埃及，埃及人也进入亚述，埃及人要与亚述人一同敬拜耶和华。"],[24,"当那日以色列必与埃及、亚述三国一律，使地上的人得福，"],[25,"因为万军之耶和华赐福给他们，说：“埃及我的百姓，亚述我手的工作，以色列我的产业，都有福了！”"]]},{"n":20,"v":[[1,"亚述王撒珥根打发他珥探到亚实突的那年，他珥探就攻打亚实突，将城攻取。"],[2,"那时，耶和华晓谕亚摩斯的儿子以赛亚说：“你去解掉你腰间的麻布，脱下你脚上的鞋。”以赛亚就这样作，露身赤脚行走。"],[3,"耶和华说：“我仆人以赛亚怎样露身赤脚行走三年，作为关乎埃及和古实的预兆奇迹，"],[4,"照样，亚述王也必掳去埃及人，掠去古实人，无论老少，都露身赤脚，现出下体，使埃及蒙羞。"],[5,"以色列人必因所仰望的古实，所夸耀的埃及惊惶羞愧。"],[6,"那时，这沿海一带的居民必说：‘看哪，我们素所仰望的，就是我们为脱离亚述王逃往求救的，不过是如此！我们怎能逃脱呢？’”"]]},{"n":21,"v":[[1,"论海旁旷野的默示：有仇敌从旷野，从可怕之地而来，好像南方的旋风，猛然扫过。"],[2,"令人凄惨的异象已默示于我。诡诈的行诡诈，毁灭的行毁灭。以拦哪，你要上去！玛代啊，你要围困！主说：“我使一切叹息止住。”"],[3,"所以我满腰疼痛，痛苦将我抓住，好像产难的妇人一样；我疼痛甚至不能听，我惊惶甚至不能看。"],[4,"我心慌张，惊恐威吓我。我所羡慕的黄昏变为我的战兢。"],[5,"他们摆设筵席，派人守望，又吃又喝。首领啊，你们起来，用油抹盾牌。"],[6,"主对我如此说：“你去设立守望的，使他将所看见的述说。”"],[7,"他看见军队，就是骑马的一对一对地来，又看见驴队、骆驼队，就要侧耳细听。"],[8,"他像狮子吼叫，说：“主啊，我白日常站在望楼上，整夜立在我守望所。”"],[9,"看哪，有一队军兵骑着马一对一对地来。他就说：“巴比伦倾倒了，倾倒了！他一切雕刻的神像都打碎于地。”"],[10,"我被打的禾稼，我场上的谷啊，我从万军之耶和华以色列的神那里所听见的，都告诉你们了。"],[11,"论度玛的默示：有人声从西珥呼问我说：“守望的啊，夜里如何？守望的啊，夜里如何？”"],[12,"守望的说：“早晨将到，黑夜也来。你们若要问就可以问，可以回头再来。”"],[13,"论阿拉伯的默示：底但结伴的客旅啊，你们必在阿拉伯的树林中住宿。"],[14,"提玛地的居民拿水来，送给口渴的，拿饼来迎接逃避的。"],[15,"因为他们逃避刀剑和出了鞘的刀，并上了弦的弓与刀兵的重灾。"],[16,"主对我这样说：“一年之内，照雇工的年数，基达的一切荣耀必归于无有；"],[17,"弓箭手所余剩的，就是基达人的勇士，必然稀少。因为这是耶和华以色列的神说的。”"]]},{"n":22,"v":[[1,"论异象谷的默示：有什么事使你这满城的人都上房顶呢？"],[2,"你这满处呐喊、大有喧哗的城，欢乐的邑啊，你中间被杀的，并不是被刀杀，也不是因打仗死亡。"],[3,"你所有的官长一同逃跑，都为弓箭手所捆绑。你中间一切被找到的都一同被捆绑，他们本是逃往远方的。"],[4,"所以我说：“你们转眼不看我，我要痛哭，不要因我众民（原文作“民女”）的毁灭，就竭力安慰我。”"],[5,"因为主万军之耶和华使异象谷有溃乱、践踏、烦扰的日子。城被攻破，哀声达到山间。"],[6,"以拦带着箭袋，还有坐战车的和马兵，吉珥揭开盾牌。"],[7,"你嘉美的谷遍满战车，也有马兵在城门前排列。"],[8,"他去掉犹大的遮盖。那日，你就仰望林库内的军器。"],[9,"你们看见大卫城的破口很多，便聚积下池的水。"],[10,"又数点耶路撒冷的房屋，将房屋拆毁，修补城墙。"],[11,"又在两道城墙中间挖一个聚水池，可盛旧池的水，却不仰望作这事的主，也不顾念从古定这事的。"],[12,"当那日，主万军之耶和华叫人哭泣哀号，头上光秃，身披麻布。"],[13,"谁知，人倒欢喜快乐，宰牛杀羊，吃肉喝酒，说：“我们吃喝吧！因为明天要死了。”"],[14,"万军之耶和华亲自默示我说：“这罪孽直到你们死，断不得赦免！这是主万军之耶和华说的。”"],[15,"主万军之耶和华这样说：“你去见掌银库的，就是家宰舍伯那，对他说："],[16,"‘你在这里作什么呢？有什么人竟在这里凿坟墓，就是在高处为自己凿坟墓，在磐石中为自己凿出安身之所？’"],[17,"看哪，耶和华必像大有力的人，将你紧紧缠裹，竭力抛去。"],[18,"他必将你滚成一团，抛在宽阔之地，好像抛球一样。你这主人家的羞辱，必在那里坐你荣耀的车，也必在那里死亡。"],[19,"我必赶逐你离开官职，你必从你的原位撤下。”"],[20,"“到那日，我必召我仆人希勒家的儿子以利亚敬来，"],[21,"将你的外袍给他穿上，将你的腰带给他系紧，将你的政权交在他手中，他必作耶路撒冷居民和犹大家的父。"],[22,"我必将大卫家的钥匙放在他肩头上，他开，无人能关；他关，无人能开。"],[23,"我必将他安稳，像钉子钉在坚固处，他必作为他父家荣耀的宝座。"],[24,"他父家所有的荣耀，连儿女带子孙，都挂在他身上，好像一切小器皿，从杯子到酒瓶挂上一样。"],[25,"万军之耶和华说：当那日，钉在坚固处的钉子必压斜，被砍断落地；挂在其上的重担必被剪断。因为这是耶和华说的。”"]]},{"n":23,"v":[[1,"论推罗的默示：他施的船只都要哀号，因为推罗变为荒场，甚至没有房屋，没有可进之路。这消息是从基提地得来的。"],[2,"沿海的居民，就是素来靠航海西顿的商家得丰盛的，你们当静默无言。"],[3,"在大水之上，西曷的粮食、尼罗河的庄稼是推罗的进项，他作列国的大码头。"],[4,"西顿哪，你当惭愧。因为大海说，就是海中的保障说：“我没有劬劳，也没有生产，没有养育男子，也没有抚养童女。”"],[5,"这风声传到埃及，埃及人为推罗的风声极其疼痛。"],[6,"推罗人哪，你们当过到他施去；沿海的居民哪，你们都当哀号！"],[7,"这是你们欢乐的城，从上古而有的吗？其中的居民往远方寄居。"],[8,"推罗本是赐冠冕的，他的商家是王子，他的买卖人是世上的尊贵人。遭遇如此，是谁定的呢？"],[9,"是万军之耶和华所定的，为要污辱一切高傲的荣耀，使地上一切的尊贵人被藐视。"],[10,"他施的民哪（“民”原文作“女”），可以流行你的地，好像尼罗河，不再有腰带拘紧你。"],[11,"耶和华已经向海伸手，震动列国。至于迦南，他已经吩咐拆毁其中的保障。"],[12,"他又说：“受欺压西顿的居民哪（“居民”原文作“处女”），你必不得再欢乐。起来！过到基提去，就是在那里也不得安歇。”"],[13,"看哪，迦勒底人之地向来没有这民，这国是亚述人为住旷野的人所立的。现在他们建筑戍楼，拆毁推罗的宫殿，使她成为荒凉。"],[14,"他施的船只都要哀号，因为你们的保障变为荒场。"],[15,"到那时，推罗必被忘记七十年，照着一王的年日。七十年后，推罗的景况必像妓女所唱的歌："],[16,"“你这被忘记的妓女啊，拿琴周流城内，巧弹多唱，使人再想念你。”"],[17,"七十年后，耶和华必眷顾推罗，她就仍得利息（原文作“雇价”。下同），与地上的万国交易（原文作“行淫”）。"],[18,"她的货财和利息要归耶和华为圣，必不积攒存留；因为她的货财必为住在耶和华面前的人所得，使他们吃饱，穿耐久的衣服。"]]},{"n":24,"v":[[1,"看哪，耶和华使地空虚，变为荒凉；又翻转大地，将居民分散。"],[2,"那时百姓怎样，祭司也怎样；仆人怎样，主人也怎样；婢女怎样，主母也怎样；买物的怎样，卖物的也怎样；放债的怎样，借债的也怎样；取利的怎样，出利的也怎样。"],[3,"地必全然空虚，尽都荒凉。因为这话是耶和华说的。"],[4,"地上悲哀衰残，世界败落衰残，地上居高位的人也败落了。"],[5,"地被其上的居民污秽，因为他们犯了律法，废了律例，背了永约。"],[6,"所以地被咒诅吞灭，住在其上的显为有罪。地上的居民被火焚烧，剩下的人稀少。"],[7,"新酒悲哀，葡萄树衰残；心中欢乐的俱都叹息。"],[8,"击鼓之乐止息，宴乐人的声音完毕，弹琴之乐也止息了。"],[9,"人必不得饮酒唱歌；喝浓酒的，必以为苦。"],[10,"荒凉的城拆毁了，各家关门闭户，使人都不得进去。"],[11,"在街上因酒有悲叹的声音，一切喜乐变为昏暗，地上的欢乐归于无有。"],[12,"城中只有荒凉，城门拆毁净尽。"],[13,"在地上的万民中，必像打过的橄榄树，又像已摘的葡萄所剩无几。"],[14,"这些人要高声欢呼，他们为耶和华的威严，从海那里扬起声来。"],[15,"因此，你们要在东方荣耀耶和华，在众海岛荣耀耶和华以色列神的名。"],[16,"我们听见从地极有人歌唱，说：“荣耀归于义人。”我却说：“我消灭了，我消灭了，我有祸了！诡诈的行诡诈，诡诈的大行诡诈。”"],[17,"地上的居民哪，恐惧、陷坑、网罗都临近你。"],[18,"躲避恐惧声音的必坠入陷坑；从陷坑上来的必被网罗缠住。因为天上的窗户都开了，地的根基也震动了。"],[19,"地全然破坏，尽都崩裂，大大地震动了。"],[20,"地要东倒西歪，好像醉酒的人；又摇来摇去，好像吊床。罪过在其上沉重，必然塌陷，不能复起。"],[21,"到那日，耶和华在高处必惩罚高处的众军，在地上必惩罚地上的列王。"],[22,"他们必被聚集，像囚犯被聚在牢狱中，并要囚在监牢里，多日之后便被讨罪（或作“眷顾”）。"],[23,"那时，月亮要蒙羞，日头要惭愧，因为万军之耶和华必在锡安山、在耶路撒冷作王，在敬畏他的长老面前必有荣耀。"]]},{"n":25,"v":[[1,"耶和华啊，你是我的神，我要尊崇你，我要称赞你的名。因为你以忠信诚实行过奇妙的事，成就你古时所定的。"],[2,"你使城变为乱堆，使坚固城变为荒场；使外邦人宫殿的城不再为城，永远不再建造。"],[3,"所以，刚强的民必荣耀你，强暴之国的城必敬畏你。"],[4,"因为当强暴人催逼人的时候，如同暴风直吹墙壁，你就作贫穷人的保障，作困乏人急难中的保障，作躲暴风之处，作避炎热的阴凉。"],[5,"你要压制外邦人的喧哗，好像干燥地的热气下落；禁止强暴人的凯歌，好像热气被云影消化。"],[6,"在这山上，万军之耶和华必为万民用肥甘设摆筵席，用陈酒和满髓的肥甘，并澄清的陈酒，设摆筵席。"],[7,"他又必在这山上除灭遮盖万民之物和遮蔽万国蒙脸的帕子。"],[8,"他已经吞灭死亡直到永远。主耶和华必擦去各人脸上的眼泪，又除掉普天下他百姓的羞辱，因为这是耶和华说的。"],[9,"到那日，人必说：“看哪，这是我们的神，我们素来等候他，他必拯救我们。这是耶和华，我们素来等候他，我们必因他的救恩欢喜快乐。”"],[10,"耶和华的手必按在这山上，摩押人在所居之地必被践踏，好像干草被践踏在粪池的水中。"],[11,"他必在其中伸开手，好像洑水的伸开手洑水一样，但耶和华必使他的骄傲和他手所行的诡计一并败落。"],[12,"耶和华使你城上的坚固高台倾倒，拆平，直到尘埃。"]]},{"n":26,"v":[[1,"当那日，在犹大地人必唱这歌说：“我们有坚固的城。耶和华要将救恩定为城墙、为外郭。"],[2,"敞开城门，使守信的义民得以进入。"],[3,"坚心倚赖你的，你必保守他十分平安，因为他倚靠你。"],[4,"你们当倚靠耶和华直到永远，因为耶和华是永久的磐石。"],[5,"他使住高处的与高城一并败落，将城拆毁，拆平，直到尘埃。"],[6,"要被脚践踏，就是被困苦人的脚和穷乏人的脚践踏。”"],[7,"义人的道是正直的，你为正直的主，必修平义人的路。"],[8,"耶和华啊，我们在你行审判的路上等候你，我们心里所羡慕的是你的名，就是你那可记念的名。"],[9,"夜间，我心中羡慕你，我里面的灵切切寻求你，因为你在世上行审判的时候，地上的居民就学习公义。"],[10,"以恩惠待恶人，他仍不学习公义，在正直的地上，他必行事不义，也不注意耶和华的威严。"],[11,"耶和华啊，你的手高举，他们仍然不看；却要看你为百姓发的热心，因而抱愧，并且有火烧灭你的敌人。"],[12,"耶和华啊，你必派定我们得平安，因为我们所作的事，都是你给我们成就的。"],[13,"耶和华我们的神啊，在你以外曾有别的主管辖我们，但我们专要倚靠你，提你的名。"],[14,"他们死了，必不能再活；他们去世，必不能再起；因为你刑罚他们，毁灭他们，他们的名号就全然消灭。"],[15,"耶和华啊，你增添国民，你增添国民；你得了荣耀，又扩张地的四境。"],[16,"耶和华啊，他们在急难中寻求你，你的惩罚临到他们身上，他们就倾心吐胆祷告你。"],[17,"妇人怀孕，临产疼痛，在痛苦之中喊叫；耶和华啊，我们在你面前也是如此。"],[18,"我们也曾怀孕疼痛，所产的竟像风一样。我们在地上未曾行什么拯救的事，世上的居民也未曾败落。"],[19,"死人（原文作“你的死人”）要复活，尸首（原文作“我的尸首”）要兴起。睡在尘埃的啊，要醒起歌唱！因你的甘露好像菜蔬上的甘露，地也要交出死人来。"],[20,"我的百姓啊，你们要来进入内室，关上门，隐藏片时，等到忿怒过去。"],[21,"因为耶和华从他的居所出来，要刑罚地上居民的罪孽。地也必露出其中的血，不再掩盖被杀的人。"]]},{"n":27,"v":[[1,"到那日，耶和华必用他刚硬有力的大刀刑罚鳄鱼，就是那快行的蛇；刑罚鳄鱼，就是那曲行的蛇，并杀海中的大鱼。"],[2,"当那日，有出酒的葡萄园，你们要指这园唱歌说："],[3,"“我耶和华是看守葡萄园的，我必时刻浇灌，昼夜看守，免得有人损害。"],[4,"我心中不存忿怒，惟愿荆棘蒺藜与我交战，我就勇往直前，把他一同焚烧。"],[5,"不然，让他持住我的能力，使他与我和好，愿他与我和好。”"],[6,"将来雅各要扎根，以色列要发芽开花，他们的果实必充满世界。"],[7,"主击打他们，岂像击打那些击打他们的人吗？他们被杀戮，岂像被他们所杀戮的吗？"],[8,"你打发他们去，是相机宜与他们相争；刮东风的日子，就用暴风将他们逐去。"],[9,"所以，雅各的罪孽得赦免，他的罪过得除掉的果效，全在乎此；就是他叫祭坛的石头变为打碎的灰石，以致木偶和日像不再立起。"],[10,"因为坚固城变为凄凉，成了撇下离弃的居所，像旷野一样；牛犊必在那里吃草，在那里躺卧，并吃尽其中的树枝。"],[11,"枝条枯干，必被折断，妇女要来点火烧着，因为这百姓蒙昧无知。所以，创造他们的必不怜恤他们，造成他们的也不施恩与他们。"],[12,"以色列人哪，到那日，耶和华必从大河直到埃及小河，将你们一一地收集，如同人打树拾果一样。"],[13,"当那日，必大发角声，在亚述地将要灭亡的，并在埃及地被赶散的，都要来，他们就在耶路撒冷圣山上敬拜耶和华。"]]},{"n":28,"v":[[1,"祸哉！以法莲的酒徒，住在肥美谷的山上，他们心里高傲，以所夸的为冠冕，犹如将残之花。"],[2,"看哪，主有一大能大力者，像一阵冰雹，像毁灭的暴风，像涨溢的大水，他必用手将冠冕摔落于地。"],[3,"以法莲高傲的酒徒，他的冠冕必被踏在脚下。"],[4,"那荣美将残之花，就是在肥美谷山上的，必像夏令以前初熟的无花果；看见这果的就注意，一到手中就吞吃了。"],[5,"到那日，万军之耶和华必作他余剩之民的荣冠华冕，"],[6,"也作了在位上行审判者公平之灵，并城门口打退仇敌者的力量。"],[7,"就是这地的人，也因酒摇摇晃晃，因浓酒东倒西歪。祭司和先知因浓酒摇摇晃晃，被酒所困，因浓酒东倒西歪。他们错解默示，谬行审判。"],[8,"因为各席上满了呕吐的污秽，无一处干净。"],[9,"讥诮先知的说：“他要将知识指教谁呢？要使谁明白传言呢？是那刚断奶离怀的吗？"],[10,"他竟命上加命、令上加令，律上加律、例上加例，这里一点、那里一点。”"],[11,"先知说：“不然，主要藉异邦人的嘴唇和外邦人的舌头对这百姓说话。”"],[12,"他曾对他们说：“你们要使疲乏人得安息，这样才得安息，才得舒畅。”他们却不肯听。"],[13,"所以耶和华向他们说的话是命上加命、令上加令，律上加律、例上加例，这里一点、那里一点。以致他们前行仰面跌倒，而且跌碎，并陷入网罗被缠住。"],[14,"所以，你们这些亵慢的人，就是辖管住在耶路撒冷这百姓的，要听耶和华的话。"],[15,"你们曾说：“我们与死亡立约，与阴间结盟；敌军（原文作“鞭子”）如水涨漫经过的时候，必不临到我们，因我们以谎言为避所，在虚假以下藏身。”"],[16,"所以主耶和华如此说：“看哪，我在锡安放一块石头作为根基，是试验过的石头，是稳固根基，宝贵的房角石，信靠的人必不着急。"],[17,"我必以公平为准绳，以公义为线铊。冰雹必冲去谎言的避所，大水必漫过藏身之处。”"],[18,"你们与死亡所立的约必然废掉；与阴间所结的盟必立不住。敌军（原文作“鞭子”）如水涨漫经过的时候，你们必被他践踏，"],[19,"每逢经过必将你们掳去。因为每早晨他必经过，白昼黑夜都必如此。明白传言的必受惊恐。"],[20,"原来床榻短，使人不能舒身；被窝窄，使人不能遮体。"],[21,"耶和华必兴起，像在毗拉心山；他必发怒，像在基遍谷。好作成他的工，就是非常的工；成就他的事，就是奇异的事。"],[22,"现在你们不可亵慢，恐怕捆你们的绑索更结实了。因为我从主万军之耶和华那里听见，已经决定在全地上施行灭绝的事。"],[23,"你们当侧耳听我的声音，留心听我的言语。"],[24,"那耕地为要撒种的，岂是常常耕地呢？岂是常常开垦耙地呢？"],[25,"他拉平了地面，岂不就撒种小茴香，播种大茴香，按行列种小麦，在定处种大麦，在田边种粗麦呢？"],[26,"因为他的神教导他务农相宜，并且指教他。"],[27,"原来打小茴香，不用尖利的器具，轧大茴香，也不用碌碡（原文作“车轮”。下同）；但用杖打小茴香，用棍打大茴香。"],[28,"作饼的粮食是用磨磨碎，因它不必常打；虽用碌碡和马打散，却不磨它。"],[29,"这也是出于万军之耶和华，他的谋略奇妙，他的智慧广大。"]]},{"n":29,"v":[[1,"唉！亚利伊勒，亚利伊勒，大卫安营的城！任凭你年上加年，节期照常周流。"],[2,"我终必使亚利伊勒困难，她必悲伤哀号，我却仍以她为亚利伊勒。"],[3,"我必四围安营攻击你，屯兵围困你，筑垒攻击你。"],[4,"你必败落，从地中说话。你的言语必微细出于尘埃。你的声音必像那交鬼者的声音出于地，你的言语低低微微出于尘埃。"],[5,"你仇敌的群众，却要像细尘，强暴人的群众，也要像飞糠。这事必顷刻之间忽然临到。"],[6,"万军之耶和华必用雷轰、地震、大声、旋风、暴风，并吞灭的火焰，向他讨罪。"],[7,"那时，攻击亚利伊勒列国的群众，就是一切攻击亚利伊勒和她的保障，并使她困难的，必如梦景，如夜间的异象。"],[8,"又必像饥饿的人梦中吃饭，醒了仍觉腹空，或像口渴的人梦中喝水，醒了仍觉发昏，心里想喝。攻击锡安山列国的群众也必如此。"],[9,"你们等候惊奇吧！你们宴乐昏迷吧！他们醉了，却非因酒；他们东倒西歪，却非因浓酒。"],[10,"因为耶和华将沉睡的灵浇灌你们，封闭你们的眼，蒙盖你们的头。你们的眼就是先知，你们的头就是先见。"],[11,"所有的默示，你们看如封住的书卷，人将这书卷交给识字的，说：“请念吧！”他说：“我不能念，因为是封住了。”"],[12,"又将这书卷交给不识字的人，说：“请念吧！”他说：“我不识字。”"],[13,"主说：“因为这百姓亲近我，用嘴唇尊敬我，心却远离我；他们敬畏我，不过是领受人的吩咐。"],[14,"所以，我在这百姓中要行奇妙的事，就是奇妙又奇妙的事。他们智慧人的智慧必然消灭；聪明人的聪明必然隐藏。”"],[15,"祸哉！那些向耶和华深藏谋略的，又在暗中行事，说：“谁看见我们呢？谁知道我们呢？”"],[16,"你们把事颠倒了，岂可看窑匠如泥吗？被制作的物岂可论制作物的说：他没有制作我？或是被创造的物论造物的说：他没有聪明？"],[17,"黎巴嫩变为肥田，肥田看如树林，不是只有一点点时候吗？"],[18,"那时，聋子必听见这书上的话；瞎子的眼必从迷蒙黑暗中得以看见。"],[19,"谦卑人必因耶和华增添欢喜；人间贫穷的必因以色列的圣者快乐。"],[20,"因为强暴人已归无有，亵慢人已经灭绝；一切找机会作孽的都被剪除。"],[21,"他们在争讼的事上，定无罪的为有罪，为城门口责备人的设下网罗，用虚无的事屈枉义人。"],[22,"所以，救赎亚伯拉罕的耶和华论雅各家如此说：“雅各必不再羞愧，面容也不至变色。"],[23,"但他看见他的众子，就是我手的工作在他那里，他们必尊我的名为圣，必尊雅各的圣者为圣，必敬畏以色列的神。"],[24,"心中迷糊的必得明白；发怨言的必受训诲。”"]]},{"n":30,"v":[[1,"耶和华说：“祸哉！这悖逆的儿女。他们同谋，却不由于我，结盟，却不由于我的灵，以致罪上加罪；"],[2,"起身下埃及去，并没有求问我。要靠法老的力量加添自己的力量，并投在埃及的荫下。"],[3,"所以，法老的力量必作你们的羞辱；投在埃及的荫下，要为你们的惭愧。"],[4,"他们的首领已在琐安，他们的使臣到了哈内斯。"],[5,"他们必因那不利于他们的民蒙羞。那民并非帮助，也非利益，只作羞耻凌辱。”"],[6,"论南方牲畜的默示：他们把财物驮在驴驹的脊背上，将宝物驮在骆驼的肉鞍上，经过艰难困苦之地，就是公狮、母狮、蝮蛇、火焰的飞龙之地，往那不利于他们的民那里去。"],[7,"埃及的帮助是徒然无益的，所以我称他为坐而不动的拉哈伯。"],[8,"现今你去，在他们面前将这话刻在版上、写在书上，以便传留后世，直到永永远远。"],[9,"因为他们是悖逆的百姓、说谎的儿女，不肯听从耶和华训诲的儿女。"],[10,"他们对先见说：“不要望见不吉利的事”，对先知说：“不要向我们讲正直的话，要向我们说柔和的话，言虚幻的事。"],[11,"你们要离弃正道，偏离直路，不要在我们面前再提说以色列的圣者。”"],[12,"所以，以色列的圣者如此说：“因为你们藐视这训诲的话，倚赖欺压和乖僻，以此为可靠的；"],[13,"故此，这罪孽在你们身上，好像将要破裂凸出来的高墙，顷刻之间忽然坍塌。"],[14,"要被打碎，好像把窑匠的瓦器打碎，毫不顾惜，甚至碎块中找不到一片可用以从炉内取火、从池中舀水。”"],[15,"主耶和华以色列的圣者曾如此说：“你们得救在乎归回安息，你们得力在乎平静安稳。”你们竟自不肯。"],[16,"你们却说：“不然，我们要骑马奔走。”所以你们必然奔走。又说：“我们要骑飞快的牲口。”所以追赶你们的也必飞快。"],[17,"一人叱喝，必令千人逃跑；五人叱喝，你们都必逃跑。以致剩下的，好像山顶的旗杆，冈上的大旗。”"],[18,"耶和华必然等候，要施恩给你们；必然兴起，好怜悯你们。因为耶和华是公平的神，凡等候他的都是有福的。"],[19,"百姓必在锡安、在耶路撒冷居住，你不再哭泣。主必因你哀求的声音施恩给你；他听见的时候，就必应允你。"],[20,"主虽然以艰难给你当饼，以困苦给你当水，你的教师却不再隐藏，你眼必看见你的教师。"],[21,"你或向左、或向右，你必听见后边有声音说：“这是正路，要行在其间。”"],[22,"你雕刻偶像所包的银子和铸造偶像所镀的金子，你要玷污、要抛弃，好像污秽之物，对偶像说：“去吧！”"],[23,"你将种子撒在地里，主必降雨在其上，并使地所出的粮肥美丰盛。到那时，你的牲畜必在宽阔的草场吃草。"],[24,"耕地的牛和驴驹必吃加盐的料，这料是用木锨和杈子扬净的。"],[25,"在大行杀戮的日子、高台倒塌的时候，各高山冈陵必有川流河涌。"],[26,"当耶和华缠裹他百姓的损处、医治他民鞭伤的日子，月光必像日光，日光必加七倍，像七日的光一样。"],[27,"看哪，耶和华的名从远方来，怒气烧起，密烟上腾。他的嘴唇满有忿恨，他的舌头像吞灭的火。"],[28,"他的气如涨溢的河水，直涨到颈项，要用毁灭的筛萝筛净列国，并且在众民的口中必有使人错行的嚼环。"],[29,"你们必唱歌，像守圣节的夜间一样，并且心中喜乐，像人吹笛，上耶和华的山，到以色列的磐石那里。"],[30,"耶和华必使人听他威严的声音，又显他降罚的膀臂和他怒中的忿恨，并吞灭的火焰与霹雷、暴风、冰雹。"],[31,"亚述人必因耶和华的声音惊惶，耶和华必用杖击打他。"],[32,"耶和华必将命定的杖加在他身上，每打一下，人必击鼓弹琴。打仗的时候，耶和华必抡起手来与他交战。"],[33,"原来陀斐特又深又宽，早已为王预备好了，其中堆的是火与许多木柴。耶和华的气如一股硫磺火，使它着起来。"]]},{"n":31,"v":[[1,"祸哉！那些下埃及求帮助的，是因仗赖马匹，倚靠甚多的车辆，并倚靠强壮的马兵，却不仰望以色列的圣者，也不求问耶和华。"],[2,"其实耶和华有智慧，他必降灾祸，并不反悔自己的话，却要兴起攻击那作恶之家，又攻击那作孽帮助人的。"],[3,"埃及人不过是人，并不是神；他们的马不过是血肉，并不是灵。耶和华一伸手，那帮助人的必绊跌，那受帮助的也必跌倒，都一同灭亡。"],[4,"耶和华对我如此说：狮子和少壮狮子护食咆哮，就是喊许多牧人来攻击它，它总不因他们的声音惊惶，也不因他们的喧哗缩伏。如此，万军之耶和华也必降临在锡安山冈上争战。"],[5,"雀鸟怎样搧翅覆雏，万军之耶和华也要照样保护耶路撒冷，他必保护拯救，要越门保守。"],[6,"以色列人哪，你们深深地悖逆耶和华，现今要归向他。"],[7,"到那日，各人必将他金偶像、银偶像，就是亲手所造、陷自己在罪中的，都抛弃了。"],[8,"亚述人必倒在刀下，并非人的刀；有刀要将他吞灭，并非人的刀。他必逃避这刀，他的少年人必成为服苦的。"],[9,"他的磐石必因惊吓挪去，他的首领必因大旗惊惶。这是那有火在锡安、有炉在耶路撒冷的耶和华说的。"]]},{"n":32,"v":[[1,"看哪，必有一王凭公义行政，必有首领藉公平掌权。"],[2,"必有一人像避风所和避暴雨的隐密处，又像河流在干旱之地，像大磐石的影子在疲乏之地。"],[3,"那能看的人，眼不再昏迷；能听的人，耳必得听闻。"],[4,"冒失人的心，必明白知识；结巴人的舌，必说话通快。"],[5,"愚顽人不再称为高明，吝啬人不再称为大方。"],[6,"因为愚顽人必说愚顽话，心里想作罪孽，惯行亵渎的事，说错谬的话攻击耶和华，使饥饿的人无食可吃，使口渴的人无水可喝。"],[7,"吝啬人所用的法子是恶的，他图谋恶计，用谎言毁灭谦卑人；穷乏人讲公理的时候，他也是这样行。"],[8,"高明人却谋高明事，在高明事上也必永存。"],[9,"安逸的妇女啊，起来听我的声音；无虑的女子啊，侧耳听我的言语。"],[10,"无虑的女子啊，再过一年多，必受骚扰；因为无葡萄可摘，无果子（或作“禾稼”）可收。"],[11,"安逸的妇女啊，要战兢；无虑的女子啊，要受骚扰，脱去衣服，赤着身体，腰束麻布。"],[12,"她们必为美好的田地和多结果的葡萄树捶胸哀哭。"],[13,"荆棘蒺藜必长在我百姓的地上，又长在欢乐的城中和一切快乐的房屋上。"],[14,"因为宫殿必被撇下，多民的城必被离弃；山冈望楼永为洞穴，作野驴所喜乐的，为羊群的草场。"],[15,"等到圣灵从上浇灌我们，旷野就变为肥田，肥田看如树林。"],[16,"那时，公平要居在旷野，公义要居在肥田。"],[17,"公义的果效必是平安，公义的效验必是平稳，直到永远。"],[18,"我的百姓必住在平安的居所，安稳的住处，平静的安歇所。"],[19,"但要降冰雹打倒树林，城必全然拆平。"],[20,"你们在各水边撒种、牧放牛驴的有福了。"]]},{"n":33,"v":[[1,"祸哉！你这毁灭人的，自己倒不被毁灭；行事诡诈的，人倒不以诡诈待你。你毁灭罢休了，自己必被毁灭；你行完了诡诈，人必以诡诈待你。"],[2,"耶和华啊，求你施恩于我们，我们等候你。求你每早晨作我们的膀臂，遭难的时候为我们的拯救。"],[3,"喧嚷的响声一发，众民奔逃；你一兴起，列国四散。"],[4,"你们所掳的必被敛尽，好像蚂蚱吃（原文作“敛”）尽禾稼；人要蹦在其上，好像蝗虫一样。"],[5,"耶和华被尊崇，因他居在高处，他以公平公义充满锡安。"],[6,"你一生一世必得安稳，有丰盛的救恩并智慧和知识，你以敬畏耶和华为至宝。"],[7,"看哪，他们的豪杰在外头哀号，求和的使臣痛痛哭泣。"],[8,"大路荒凉，行人止息；敌人背约，藐视城邑，不顾人民。"],[9,"地上悲哀衰残，黎巴嫩羞愧枯干，沙仑像旷野，巴珊和迦密的树林凋残。"],[10,"耶和华说：“现在我要起来，我要兴起，我要勃然而兴。"],[11,"你们要怀的是糠秕，要生的是碎秸，你们的气就是吞灭自己的火。"],[12,"列邦必像已烧的石灰，像已割的荆棘在火中焚烧。”"],[13,"你们远方的人当听我所行的；你们近处的人当承认我的大能。"],[14,"锡安中的罪人都惧怕，不敬虔的人被战兢抓住：“我们中间谁能与吞灭的火同住？我们中间谁能与永火同住呢？”"],[15,"行事公义，说话正直，憎恶欺压的财利，摆手不受贿赂，塞耳不听流血的话，闭眼不看邪恶事的，"],[16,"他必居高处；他的保障是磐石的坚垒，他的粮必不缺乏（原文作“赐给”），他的水必不断绝。"],[17,"你的眼必见王的荣美，必见辽阔之地。"],[18,"你的心必思想那惊吓的事，自问说：“记数目的在哪里呢？平贡银的在哪里呢？数戌楼的在哪里呢？”"],[19,"你必不见那强暴的民，就是说话深奥，你不能明白；言语呢喃，你不能懂得的。"],[20,"你要看锡安我们守圣节的城，你的眼必见耶路撒冷为安静的居所，为不挪移的帐幕，橛子永不拔出，绳索一根也不折断。"],[21,"在那里，耶和华必显威严与我们同在，当作江河宽阔之地；其中必没有荡桨摇橹的船来往，也没有威武的船经过。"],[22,"因为耶和华是审判我们的，耶和华是给我们设律法的，耶和华是我们的王，他必拯救我们。"],[23,"你的绳索松开，不能栽稳桅杆，也不能扬起篷来。那时许多掳来的物被分了，瘸腿的把掠物夺去了。"],[24,"城内居民必不说：“我病了。”其中居住的百姓，罪孽都赦免了。"]]},{"n":34,"v":[[1,"列国啊，要近前来听！众民哪，要侧耳而听！地和其上所充满的，世界和其中一切所出的，都应当听！"],[2,"因为耶和华向万国发忿恨，向他们的全军发烈怒，将他们灭尽，交出他们受杀戮。"],[3,"被杀的必然抛弃，尸首臭气上腾，诸山被他们的血融化。"],[4,"天上的万象都要消没，天被卷起，好像书卷；其上的万象要残败，像葡萄树的叶子残败，又像无花果树的叶子残败一样。"],[5,"因为我的刀在天上已经喝足。这刀必临到以东和我所咒诅的民，要施行审判。"],[6,"耶和华的刀满了血，用脂油和羊羔、公山羊的血，并公绵羊腰子的脂油滋润的。因为耶和华在波斯拉有献祭的事，在以东地大行杀戮。"],[7,"野牛、牛犊和公牛要一同下来。他们的地喝醉了血，他们的尘土因脂油肥润。"],[8,"因耶和华有报仇之日，为锡安的争辩有报应之年。"],[9,"以东的河水要变为石油，尘埃要变为硫磺，地土成为烧着的石油，"],[10,"昼夜总不熄灭，烟气永远上腾，必世世代代成为荒废，永永远远无人经过。"],[11,"鹈鹕、箭猪却要得为业；猫头鹰、乌鸦要住在其间，耶和华必将空虚的准绳、混沌的线铊拉在其上。"],[12,"以东人要召贵胄来治国，那里却无一个，首领也都归于无有。"],[13,"以东的宫殿要长荆棘，保障要长蒺藜和刺草，要作野狗的住处、鸵鸟的居所。"],[14,"旷野的走兽要和豺狼相遇，野山羊要与伴偶对叫；夜间的怪物必在那里栖身，自找安歇之处。"],[15,"箭蛇要在那里作窝、下蛋、抱蛋、生子，聚子在其影下；鹞鹰各与伴偶聚集在那里。"],[16,"你们要查考宣读耶和华的书。这都无一缺少，无一没有伴偶；因为我的口已经吩咐，他的灵将它们聚集。"],[17,"他也为它们拈阄，又亲手用准绳给它们分地，它们必永得为业，世世代代住在其间。"]]},{"n":35,"v":[[1,"旷野和干旱之地必然欢喜，沙漠也必快乐，又像玫瑰开花。"],[2,"必开花繁盛，乐上加乐，而且欢呼。黎巴嫩的荣耀，并迦密与沙仑的华美，必赐给它。人必看见耶和华的荣耀，我们神的华美。"],[3,"你们要使软弱的手坚壮，无力的膝稳固。"],[4,"对胆怯的人说：“你们要刚强，不要惧怕。看哪，你们的神必来报仇，必来施行极大的报应。他必来拯救你们。”"],[5,"那时瞎子的眼必睁开，聋子的耳必开通；"],[6,"那时瘸子必跳跃像鹿，哑巴的舌头必能歌唱；在旷野必有水发出，在沙漠必有河涌流。"],[7,"发光的沙（或作“蜃楼”）要变为水池，干渴之地要变为泉源；在野狗躺卧之处，必有青草、芦苇和蒲草。"],[8,"在那里必有一条大道，称为“圣路”。污秽人不得经过，必专为赎民行走。行路的人虽愚昧，也不至失迷。"],[9,"在那里必没有狮子，猛兽也不登这路，在那里都遇不见，只有赎民在那里行走。"],[10,"并且耶和华救赎的民必归回，歌唱来到锡安。永乐必归到他们的头上，他们必得着欢喜快乐，忧愁叹息尽都逃避。"]]},{"n":36,"v":[[1,"希西家王十四年，亚述王西拿基立上来攻击犹大的一切坚固城，将城攻取。"],[2,"亚述王从拉吉差遣拉伯沙基率领大军往耶路撒冷，到希西家王那里去。他就站在上池的水沟旁，在漂布地的大路上。"],[3,"于是希勒家的儿子家宰以利亚敬，并书记舍伯那和亚萨的儿子史官约亚，出来见拉伯沙基。"],[4,"拉伯沙基对他们说：“你们去告诉希西家，说亚述大王如此说：‘你所倚靠的有什么可仗赖的呢？"],[5,"你说，有打仗的计谋和能力，我看不过是虚话。你到底倚靠谁才背叛我呢？"],[6,"看哪，你所倚靠的埃及，是那压伤的苇杖，人若靠这杖，就必刺透他的手。埃及王法老向一切倚靠他的人也是这样。"],[7,"你若对我说：我们倚靠耶和华我们的神。希西家岂不是将神的邱坛和祭坛废去，且对犹大和耶路撒冷的人说，你们当在这坛前敬拜吗？"],[8,"现在你把当头给我主亚述王，我给你二千匹马，看你这一面骑马的人够不够。"],[9,"若不然，怎能打败我主臣仆中最小的军长呢？你竟倚靠埃及的战车马兵吗？"],[10,"现在我上来攻击毁灭这地，岂没有耶和华的意思吗？耶和华吩咐我说：你上去攻击毁灭这地吧！’”"],[11,"以利亚敬、舍伯那、约亚对拉伯沙基说：“求你用亚兰言语和仆人说话，因为我们懂得；不要用犹大言语和我们说话，达到城上百姓的耳中。”"],[12,"拉伯沙基说：“我主差遣我来，岂是单对你和你的主说这些话吗？不也是对这些坐在城上、要与你们一同吃自己粪、喝自己尿的人说吗？”"],[13,"于是拉伯沙基站着，用犹大言语大声喊着说：“你们当听亚述大王的话。"],[14,"王如此说：‘你们不要被希西家欺哄了，因他不能拯救你们。"],[15,"也不要听希西家使你们倚靠耶和华说：耶和华必要拯救我们，这城必不交在亚述王的手中。’"],[16,"不要听希西家的话，因亚述王如此说：‘你们要与我和好，出来投降我，各人就可以吃自己葡萄树和无花果树的果子，喝自己井里的水。"],[17,"等我来领你们到一个地方，与你们本地一样，就是有五谷和新酒之地，有粮食和葡萄园之地。"],[18,"你们要谨防，恐怕希西家劝导你们说：耶和华必拯救我们。列国的神有哪一个救他本国脱离亚述王的手呢？"],[19,"哈马和亚珥拔的神在哪里呢？西法瓦音的神在哪里呢？他们曾救撒玛利亚脱离我的手吗？"],[20,"这些国的神有谁曾救自己的国脱离我的手呢？难道耶和华能救耶路撒冷脱离我的手吗？’”"],[21,"百姓静默不言，并不回答一句，因为王曾吩咐说：“不要回答他。”"],[22,"当下希勒家的儿子家宰以利亚敬和书记舍伯那，并亚萨的儿子史官约亚，都撕裂衣服，来到希西家那里，将拉伯沙基的话告诉了他。"]]},{"n":37,"v":[[1,"希西家王听见，就撕裂衣服，披上麻布，进了耶和华的殿。"],[2,"使家宰以利亚敬和书记舍伯那，并祭司中的长老，都披上麻布，去见亚摩斯的儿子先知以赛亚。"],[3,"对他说：“希西家如此说：‘今日是急难、责罚、凌辱的日子，就如妇人将要生产婴孩，却没有力量生产。"],[4,"或者耶和华你的神，听见拉伯沙基的话，就是他主人亚述王打发他来辱骂永生神的话，耶和华你的神听见这话就发斥责。故此，求你为余剩的民扬声祷告。’”"],[5,"希西家王的臣仆就去见以赛亚。"],[6,"以赛亚对他们说：“要这样对你们的主人说，耶和华如此说：‘你听见亚述王的仆人亵渎我的话，不要惧怕。"],[7,"我必惊动（原文作“使灵进入”）他的心，他要听见风声就归回本地，我必使他在那里倒在刀下。’”"],[8,"拉伯沙基回去，正遇见亚述王攻打立拿；原来他早听见亚述王拔营离开拉吉。"],[9,"亚述王听见人论古实王特哈加说：“他出来要与你争战。”亚述王一听见，就打发使者去见希西家，吩咐他们说："],[10,"“你们对犹大王希西家如此说：‘不要听你所倚靠的神欺哄你说，耶路撒冷必不交在亚述王的手中。"],[11,"你总听说亚述诸王向列国所行的，乃是尽行灭绝，难道你还能得救吗？"],[12,"我列祖所毁灭的，就是歌散、哈兰、利色和属提拉撒的伊甸人，这些国的神何曾拯救这些国呢？"],[13,"哈马的王、亚珥拔的王、西法瓦音城的王、希拿和以瓦的王都在哪里呢？’”"],[14,"希西家从使者手里接过书信来，看完了，就上耶和华的殿，将书信在耶和华面前展开。"],[15,"希西家向耶和华祷告说："],[16,"“坐在二基路伯上万军之耶和华以色列的神啊，你，惟有你是天下万国的神；你曾创造天地。"],[17,"耶和华啊，求你侧耳而听；耶和华啊，求你睁眼而看。要听西拿基立的一切话，他是打发使者来辱骂永生神的。"],[18,"耶和华啊，亚述诸王果然使列国和列国之地变为荒凉，"],[19,"将列国的神像都扔在火里，因为他本不是神，乃是人手所造的，是木头、石头的，所以灭绝他。"],[20,"耶和华我们的神啊，现在求你救我们脱离亚述王的手，使天下万国都知道惟有你是耶和华。”"],[21,"亚摩斯的儿子以赛亚就打发人去见希西家，说：“耶和华以色列的神如此说，你既然求我攻击亚述王西拿基立，"],[22,"所以耶和华论他这样说：“锡安的处女藐视你、嗤笑你；耶路撒冷的女子向你摇头。”"],[23,"“你辱骂谁？亵渎谁？扬起声来，高举眼目攻击谁呢？乃是攻击以色列的圣者。"],[24,"你藉你的臣仆辱骂主说：我率领许多战车上山顶，到黎巴嫩极深之处，我要砍伐其中高大的香柏树和佳美的松树；我必上极高之处，进入肥田的树林。"],[25,"我已经挖井喝水，我必用脚掌踏干埃及的一切河。”"],[26,"“耶和华说：你岂没有听见我早先所作的、古时所立的吗？现在藉你使坚固城荒废，变为乱堆。"],[27,"所以其中的居民力量甚小，惊惶羞愧。他像野草、像青菜，如房顶上的草，又如田间未长成的禾稼。”"],[28,"“你坐下、你出去、你进来，你向我发烈怒，我都知道。"],[29,"因你向我发烈怒，又因你狂傲的话达到我耳中，我就要用钩子钩上你的鼻子，把嚼环放在你口里，使你从原路转回去。”"],[30,"“以色列人哪，我赐你们一个证据。你们今年要吃自生的，明年也要吃自长的，至于后年，你们要耕种收割，栽植葡萄园，吃其中的果子。"],[31,"犹大家所逃脱余剩的，仍要往下扎根，向上结果。"],[32,"必有余剩的民从耶路撒冷而出；必有逃脱的人从锡安山而来。万军之耶和华的热心必成就这事。”"],[33,"“所以耶和华论亚述王如此说：他必不得来到这城，也不在这里射箭，不得拿盾牌到城前，也不筑垒攻城。"],[34,"他从哪条路来，必从那条路回去，必不得来到这城。这是耶和华说的。"],[35,"因我为自己的缘故，又为我仆人大卫的缘故，必保护拯救这城。”"],[36,"耶和华的使者出去，在亚述营中杀了十八万五千人。清早有人起来一看，都是死尸了。"],[37,"亚述王西拿基立就拔营回去，住在尼尼微。"],[38,"一日在他的神尼斯洛庙里叩拜，他儿子亚得米勒和沙利色用刀杀了他，就逃到亚拉腊地。他儿子以撒哈顿接续他作王。"]]},{"n":38,"v":[[1,"那时希西家病得要死，亚摩斯的儿子先知以赛亚去见他，对他说：“耶和华如此说：你当留遗命与你的家，因为你必死不能活了。”"],[2,"希西家就转脸朝墙，祷告耶和华说："],[3,"“耶和华啊，求你记念我在你面前怎样存完全的心，按诚实行事，又作你眼中所看为善的。”希西家就痛哭了。"],[4,"耶和华的话临到以赛亚说："],[5,"“你去告诉希西家说，耶和华你祖大卫的神如此说：我听见了你的祷告，看见了你的眼泪。我必加增你十五年的寿数；"],[6,"并且我要救你和这城脱离亚述王的手，也要保护这城。"],[7,"我耶和华必成就我所说的，我先给你一个兆头，"],[8,"就是叫亚哈斯的日晷，向前进的日影往后退十度。”于是前进的日影，果然在日晷上往后退了十度。"],[9,"犹大王希西家患病已经痊愈，就作诗说："],[10,"“我说：正在我中年（或作“晌午”）之日，必进入阴间的门，我余剩的年岁不得享受。"],[11,"我说：我必不得见耶和华，就是在活人之地不见耶和华；我与世上的居民不再见面。"],[12,"我的住处被迁去离开我，好像牧人的帐棚一样；我将性命卷起，像织布的卷布一样。耶和华必将我从机头剪断，从早到晚，他要使我完结。"],[13,"我使自己安静，直到天亮；他像狮子折断我一切的骨头，从早到晚，他要使我完结。"],[14,"我像燕子呢喃，像白鹤鸣叫，又像鸽子哀鸣；我因仰观，眼睛困倦。耶和华啊，我受欺压，求你为我作保。"],[15,"我可说什么呢？他应许我的，也给我成就了。我因心里的苦楚，在一生的年日必悄悄而行。"],[16,"主啊，人得存活，乃在乎此；我灵存活，也全在此。所以求你使我痊愈，仍然存活。"],[17,"看哪，我受大苦，本为使我得平安，你因爱我的灵魂（或作“生命”），便救我脱离败坏的坑，因为你将我一切的罪扔在你的背后。"],[18,"原来阴间不能称谢你，死亡不能颂扬你，下坑的人不能盼望你的诚实；"],[19,"只有活人，活人必称谢你，像我今日称谢你一样。为父的，必使儿女知道你的诚实。"],[20,"耶和华肯救我，所以我们要一生一世，在耶和华殿中，用丝弦的乐器唱我的诗歌。”"],[21,"以赛亚说：“当取一块无花果饼来，贴在疮上，王必痊愈。”"],[22,"希西家问说：“我能上耶和华的殿，有什么兆头呢？”"]]},{"n":39,"v":[[1,"那时，巴比伦王巴拉但的儿子米罗达巴拉但听见希西家病而痊愈，就送书信和礼物给他。"],[2,"希西家喜欢见使者，就把自己宝库的金子、银子、香料、贵重的膏油和他武库的一切军器，并所有的财宝都给他们看，他家中和全国之内，希西家没有一样不给他们看的。"],[3,"于是先知以赛亚来见希西家王，问他说：“这些人说什么？他们从哪里来见你？”希西家说：“他们从远方的巴比伦来见我。”"],[4,"以赛亚说：“他们在你家里看见了什么？”希西家说：“凡我家中所有的，他们都看见了，我财宝中没有一样不给他们看的。”"],[5,"以赛亚对希西家说：“你要听万军之耶和华的话："],[6,"日子必到，凡你家里所有的，并你列祖积蓄到如今的，都要被掳到巴比伦去，不留下一样。这是耶和华说的。"],[7,"并且从你本身所生的众子，其中必有被掳去、在巴比伦王宫里当太监的。”"],[8,"希西家对以赛亚说：“你所说耶和华的话甚好，因为在我的年日中，必有太平和稳固的景况。”"]]},{"n":40,"v":[[1,"你们的神说：“你们要安慰、安慰我的百姓。"],[2,"要对耶路撒冷说安慰的话，又向他宣告说，他争战的日子已满了，他的罪孽赦免了，他为自己的一切罪，从耶和华手中加倍受罚。”"],[3,"有人声喊着说：“在旷野预备耶和华的路（或作“在旷野，有人声喊着说：当预备耶和华的路”），在沙漠地修平我们神的道。"],[4,"一切山洼都要填满，大小山冈都要削平。高高低低的要改为平坦，崎崎岖岖的必成为平原。"],[5,"耶和华的荣耀必然显现，凡有血气的必一同看见。因为这是耶和华亲口说的。”"],[6,"有人声说：“你喊叫吧！”有一个说：“我喊叫什么呢？”说：“凡有血气的尽都如草，他的美容都像野地的花。"],[7,"草必枯干，花必凋残，因为耶和华的气吹在其上；百姓诚然是草。"],[8,"草必枯干，花必凋残；惟有我们神的话必永远立定！”"],[9,"报好信息给锡安的啊，你要登高山；报好信息给耶路撒冷的啊，你要极力扬声，扬声不要惧怕。对犹大的城邑说：“看哪，你们的神！”"],[10,"主耶和华必像大能者临到，他的膀臂必为他掌权。他的赏赐在他那里，他的报应在他面前。"],[11,"他必像牧人牧养自己的羊群，用膀臂聚集羊羔抱在怀中，慢慢引导那乳养小羊的。"],[12,"谁曾用手心量诸水，用手虎口量苍天，用升斗盛大地的尘土，用秤称山岭，用天平平冈陵呢？"],[13,"谁曾测度耶和华的心（或作“谁曾指示耶和华的灵”），或作他的谋士指教他呢？"],[14,"他与谁商议，谁教导他，谁将公平的路指示他，又将知识教训他，将通达的道指教他呢？"],[15,"看哪，万民都像水桶的一滴，又算如天平上的微尘；他举起众海岛，好像极微之物。"],[16,"黎巴嫩的树林不够当柴烧，其中的走兽也不够作燔祭。"],[17,"万民在他面前好像虚无，被他看为不及虚无，乃为虚空。"],[18,"你们究竟将谁比神，用什么形像与神比较呢？"],[19,"偶像是匠人铸造，银匠用金包裹，为它铸造银链。"],[20,"穷乏献不起这样供物的，就拣选不能朽坏的树木，为自己寻找巧匠，立起不能摇动的偶像。"],[21,"你们岂不曾知道吗？你们岂不曾听见吗？从起初岂没有人告诉你们吗？自从立地的根基，你们岂没有明白吗？"],[22,"神坐在地球大圈之上，地上的居民好像蝗虫。他铺张穹苍如幔子，展开诸天如可住的帐棚。"],[23,"他使君王归于虚无，使地上的审判官成为虚空。"],[24,"他们是刚才栽上（“刚才”或作“不曾”。下同），刚才种上，根也刚才扎在地里；他一吹在其上，便都枯干，旋风将他们吹去，像碎秸一样。"],[25,"那圣者说：“你们将谁比我，叫他与我相等呢？"],[26,"你们向上举目，看谁创造这万象，按数目领出，他一一称其名，因他的权能，又因他的大能大力，连一个都不缺。”"],[27,"雅各啊，你为何说：“我的道路向耶和华隐藏？”以色列啊，你为何言：“我的冤屈神并不查问？”"],[28,"你岂不曾知道吗？你岂不曾听见吗？永在的神耶和华，创造地极的主，并不疲乏，也不困倦，他的智慧无法测度。"],[29,"疲乏的，他赐能力；软弱的，他加力量。"],[30,"就是少年人也要疲乏困倦，强壮的也必全然跌倒；"],[31,"但那等候耶和华的，必从新得力。他们必如鹰展翅上腾，他们奔跑却不困倦，行走却不疲乏。"]]},{"n":41,"v":[[1,"众海岛啊，当在我面前静默；众民当从新得力，都要近前来才可以说话，我们可以彼此辩论。"],[2,"谁从东方兴起一人，凭公义召他来到脚前呢？耶和华将列国交给他，使他管辖君王；把他们如灰尘交与他的刀，如风吹的碎秸交与他的弓。"],[3,"他追赶他们，走他所未走的道，坦然前行。"],[4,"谁行作成就这事，从起初宣召历代呢？就是我耶和华。我是首先的，也与末后的同在。"],[5,"海岛看见就都害怕，地极也都战兢，就近前来。"],[6,"他们各人帮助邻舍，各人对弟兄说：“壮胆吧！”"],[7,"木匠勉励银匠，用锤打光的勉励打砧的，论焊工说：“焊得好！”又用钉子钉稳，免得偶像动摇。"],[8,"惟你以色列我的仆人，雅各我所拣选的，我朋友亚伯拉罕的后裔，"],[9,"你是我从地极所领（原文作“抓”）来的，从地角所召来的，且对你说：“你是我的仆人，我拣选你，并不弃绝你。"],[10,"你不要害怕，因为我与你同在；不要惊惶，因为我是你的神。我必坚固你，我必帮助你，我必用我公义的右手扶持你。”"],[11,"“凡向你发怒的必都抱愧蒙羞；与你相争的必如无有，并要灭亡。"],[12,"与你争竞的，你要找他们也找不着；与你争战的必如无有，成为虚无。"],[13,"因为我耶和华你的神必搀扶你的右手，对你说，不要害怕！我必帮助你。”"],[14,"“你这虫雅各和你们以色列人，不要害怕！耶和华说，我必帮助你。你的救赎主就是以色列的圣者。"],[15,"看哪，我已使你成为有快齿打粮的新器具；你要把山岭打得粉碎，使冈陵如同糠秕。"],[16,"你要把它簸扬，风要吹去，旋风要把它刮散。你倒要以耶和华为喜乐，以以色列的圣者为夸耀。”"],[17,"困苦穷乏人寻求水却没有，他们因口渴，舌头干燥。我耶和华必应允他们，我以色列的神必不离弃他们。"],[18,"我要在净光的高处开江河，在谷中开泉源；我要使沙漠变为水池，使干地变为涌泉。"],[19,"我要在旷野种上香柏树、皂荚树、番石榴树和野橄榄树；我在沙漠要把松树、杉树并黄杨树一同栽植；"],[20,"好叫人看见、知道、思想、明白，这是耶和华的手所作的，是以色列的圣者所造的。”"],[21,"耶和华对假神说：“你们要呈上你们的案件，雅各的君说：你们要声明你们确实的理由。"],[22,"可以声明、指示我们将来必遇的事，说明先前的是什么事，好叫我们思索、得知事的结局，或者把将来的事指示我们。"],[23,"要说明后来的事，好叫我们知道你们是神。你们或降福，或降祸，使我们惊奇，一同观看。"],[24,"看哪，你们属乎虚无，你们的作为也属乎虚空。那选择你们的是可憎恶的。”"],[25,"“我从北方兴起一人，他是求告我名的，从日出之地而来。他必临到掌权的，好像临到灰泥，彷佛窑匠踹泥一样。"],[26,"谁从起初指明这事，使我们知道呢？谁从先前说明，使我们说他不错呢？谁也没有指明，谁也没有说明，谁也没有听见你们的话。"],[27,"我首先对锡安说：看哪，我要将一位报好信息的赐给耶路撒冷。"],[28,"我看的时候并没有人，我问的时候，他们中间也没有谋士可以回答一句。"],[29,"看哪，他们和他们的工作都是虚空，且是虚无。他们所铸的偶像都是风，都是虚的。”"]]},{"n":42,"v":[[1,"“看哪，我的仆人，我所扶持、所拣选、心里所喜悦的，我已将我的灵赐给他，他必将公理传给外邦。"],[2,"他不喧嚷，不扬声，也不使街上听见他的声音。"],[3,"压伤的芦苇，他不折断；将残的灯火，他不吹灭。他凭真实将公理传开。"],[4,"他不灰心，也不丧胆，直到他在地上设立公理，海岛都等候他的训诲。”"],[5,"创造诸天，铺张穹苍，将地和地所出的一并铺开，赐气息给地上的众人，又赐灵性给行在其上之人的神耶和华，他如此说："],[6,"“我耶和华凭公义召你，必搀扶你的手，保守你，使你作众民的中保（“中保”原文作“约”），作外邦人的光，"],[7,"开瞎子的眼，领被囚的出牢狱，领坐黑暗的出监牢。"],[8,"我是耶和华，这是我的名。我必不将我的荣耀归给假神，也不将我的称赞归给雕刻的偶像。"],[9,"看哪！先前的事已经成就，现在我将新事说明，这事未发以先，我就说给你们听。”"],[10,"航海的和海中所有的，海岛和其上的居民，都当向耶和华唱新歌，从地极赞美他。"],[11,"旷野和其中的城邑，并基达人居住的村庄都当扬声；西拉的居民当欢呼，在山顶上呐喊。"],[12,"他们当将荣耀归给耶和华，在海岛中传扬他的颂赞。"],[13,"耶和华必像勇士出去，必像战士激动热心，要喊叫，大声呐喊，要用大力攻击仇敌。"],[14,"“我许久闭口不言，静默不语，现在我要喊叫像产难的妇人，我要急气而喘哮。"],[15,"我要使大山小冈变为荒场，使其上的花草都枯干，我要使江河变为洲岛，使水池都干涸。"],[16,"我要引瞎子行不认识的道，领他们走不知道的路；在他们面前使黑暗变为光明，使弯曲变为平直。这些事我都要行，并不离弃他们。"],[17,"倚靠雕刻的偶像，对铸造的偶像说：‘你是我们的神’，这等人要退后，全然蒙羞。”"],[18,"“你们这耳聋的听吧！你们这眼瞎的看吧！使你们能看见。"],[19,"谁比我的仆人眼瞎呢？谁比我差遣的使者耳聋呢？谁瞎眼像那与我和好的，谁瞎眼像耶和华的仆人呢？"],[20,"你看见许多事却不领会，耳朵开通却不听见。”"],[21,"耶和华因自己公义的缘故，喜欢使律法（或作“训诲”）为大、为尊。"],[22,"但这百姓是被抢被夺的，都牢笼在坑中，隐藏在狱里。他们作掠物，无人拯救；作掳物，无人说交还。"],[23,"你们中间谁肯侧耳听此，谁肯留心而听，以防将来呢？"],[24,"谁将雅各交出当作掳物，将以色列交给抢夺的呢？岂不是耶和华吗？就是我们所得罪的那位。他们不肯遵行他的道，也不听从他的训诲。"],[25,"所以，他将猛烈的怒气和争战的勇力倾倒在以色列的身上；在他四围如火着起，他还不知道；烧着他，他也不介意。"]]},{"n":43,"v":[[1,"雅各啊，创造你的耶和华；以色列啊，造成你的那位，现在如此说：“你不要害怕！因为我救赎了你。我曾提你的名召你，你是属我的。"],[2,"你从水中经过，我必与你同在；你趟过江河，水必不漫过你；你从火中行过，必不被烧，火焰也不着在你身上。"],[3,"因为我是耶和华你的神，是以色列的圣者你的救主。我已经使埃及作你的赎价，使古实和西巴代替你。"],[4,"因我看你为宝为尊，又因我爱你，所以我使人代替你，使列邦人替换你的生命。"],[5,"不要害怕，因我与你同在，我必领你的后裔从东方来，又从西方招聚你。"],[6,"我要对北方说：‘交出来！’对南方说：‘不要拘留！’将我的众子从远方带来，将我的众女从地极领回，"],[7,"就是凡称为我名下的人，是我为自己的荣耀创造的，是我所作成、所造作的。”"],[8,"你要将有眼而瞎、有耳而聋的民都带出来。"],[9,"任凭万国聚集，任凭众民会合，其中谁能将此声明，并将先前的事说给我们听呢？他们可以带出见证来，自显为是，或者他们听见便说，这是真的。"],[10,"耶和华说：“你们是我的见证，我所拣选的仆人。既是这样，便可以知道，且信服我，又明白我就是耶和华，在我以前没有真神（“真”原文作“造作的”），在我以后也必没有。"],[11,"惟有我是耶和华，除我以外没有救主。"],[12,"我曾指示，我曾拯救，我曾说明，并且在你们中间没有别神。”所以耶和华说：“你们是我的见证，我也是神。"],[13,"自从有日子以来，我就是神。谁也不能救人脱离我手，我要行事谁能阻止呢？”"],[14,"耶和华你们的救赎主，以色列的圣者如此说：“因你们的缘故，我已经打发人到巴比伦去，并且我要使迦勒底人如逃民，都坐自己喜乐的船下来。"],[15,"我是耶和华你们的圣者，是创造以色列的，是你们的君王。”"],[16,"耶和华在沧海中开道，在大水中开路，"],[17,"使车辆、马匹、军兵、勇士都出来，一同躺下，不再起来，他们灭没，好像熄灭的灯火。"],[18,"耶和华如此说：“你们不要记念从前的事，也不要思想古时的事。"],[19,"看哪，我要作一件新事，如今要发现，你们岂不知道吗？我必在旷野开道路，在沙漠开江河。"],[20,"野地的走兽必尊重我，野狗和驼鸟也必如此。因我使旷野有水，使沙漠有河，好赐给我的百姓、我的选民喝。"],[21,"这百姓是我为自己所造的，好述说我的美德。”"],[22,"“雅各啊，你并没有求告我；以色列啊，你倒厌烦我。"],[23,"你没有将你的羊带来给我作燔祭，也没有用祭物尊敬我；我没有因供物使你服劳，也没有因乳香使你厌烦。"],[24,"你没有用银子为我买菖蒲，也没有用祭物的脂油使我饱足；倒使我因你的罪恶服劳，使我因你的罪孽厌烦。”"],[25,"“惟有我为自己的缘故涂抹你的过犯，我也不记念你的罪恶。"],[26,"你要提醒我，你我可以一同辩论，你可以将你的理陈明，自显为义。"],[27,"你的始祖犯罪，你的师傅违背我。"],[28,"所以我要辱没圣所的首领，使雅各成为咒诅，使以色列成为辱骂。”"]]},{"n":44,"v":[[1,"我的仆人雅各、我所拣选的以色列啊，现在你当听！"],[2,"造作你，又从你出胎造就你，并要帮助你的耶和华如此说：“我的仆人雅各、我所拣选的耶书仑哪，不要害怕！"],[3,"因为我要将水浇灌口渴的人，将河浇灌干旱之地；我要将我的灵浇灌你的后裔，将我的福浇灌你的子孙。"],[4,"他们要发生在草中，像溪水旁的柳树。"],[5,"这个要说，我是属耶和华的；那个要以雅各的名自称；又一个要亲手写归耶和华的（或作“在手上写归耶和华”）’，并自称为以色列。”"],[6,"耶和华以色列的君、以色列的救赎主，万军之耶和华如此说：“我是首先的，我是末后的，除我以外再没有真神。"],[7,"自从我设立古时的民，谁能像我宣告，并且指明，又为自己陈说呢？让他将未来的事和必成的事说明。"],[8,"你们不要恐惧，也不要害怕，我岂不是从上古就说明指示你们吗？并且你们是我的见证。除我以外，岂有真神吗？诚然没有磐石，我不知道一个。”"],[9,"制造雕刻偶像的尽都虚空；他们所喜悦的都无益处。他们的见证无所看见，无所知晓，他们便觉羞愧。"],[10,"谁制造神像，铸造无益的偶像？"],[11,"看哪，他的同伴都必羞愧。工匠也不过是人，任他们聚会，任他们站立，都必惧怕，一同羞愧。"],[12,"铁匠把铁在火炭中烧热，用锤打铁器，用他有力的膀臂锤成；他饥饿而无力，不喝水而发倦。"],[13,"木匠拉线，用笔划出样子，用刨子刨成形状，用图尺划了模样，仿照人的体态，作成人形，好住在房屋中。"],[14,"他砍伐香柏树，又取柞树和橡树（“柞”或作“青桐”），在树林中选定了一棵。他栽种松树得雨长养。"],[15,"这树，人可用以烧火。他自己取些烤火，又烧着烤饼，而且作神像跪拜，作雕刻的偶像向它叩拜。"],[16,"他把一份烧在火中，把一份烤肉吃饱。自己烤火说：“阿哈！我暖和了，我见火了！”"],[17,"他用剩下的作了一神，就是雕刻的偶像。他向这偶像俯伏叩拜，祷告它说：“求你拯救我，因你是我的神。”"],[18,"他们不知道、也不思想，因为耶和华闭住他们的眼不能看见，塞住他们的心不能明白。"],[19,"谁心里也不醒悟，也没有知识，没有聪明，能说：“我曾拿一份在火中烧了，在炭火上烤过饼，我也烤过肉吃。这剩下的我岂要作可憎的物吗？我岂可向木墩子叩拜呢？”"],[20,"他以灰为食，心中昏迷，使他偏邪，他不能自救，也不能说：“我右手中岂不是有虚谎吗？”"],[21,"“雅各、以色列啊，你是我的仆人，要记念这些事。以色列啊，你是我的仆人，我造就你必不忘记你。"],[22,"我涂抹了你的过犯，像厚云消散；我涂抹了你的罪恶，如薄云灭没。你当归向我，因我救赎了你。”"],[23,"诸天哪，应当歌唱，因为耶和华作成这事。地的深处啊，应当欢呼，众山应当发声歌唱，树林和其中所有的树都当如此，因为耶和华救赎了雅各，并要因以色列荣耀自己。"],[24,"从你出胎，造就你的救赎主耶和华如此说：“我耶和华是创造万物的，是独自铺张诸天、铺开大地的。（谁与我同在呢？）"],[25,"使说假话的兆头失效，使占卜的癫狂，使智慧人退后，使他的知识变为愚拙。"],[26,"使我仆人的话语立定，我使者的谋算成就。论到耶路撒冷说：‘必有人居住。’论到犹大的城邑说：‘必被建造，其中的荒场我也必兴起。’"],[27,"对深渊说：‘你干了吧！我也要使你江河干涸。’"],[28,"论居鲁士说：‘他是我的牧人，必成就我所喜悦的，必下令建造耶路撒冷，发命立稳圣殿的根基。’”"]]},{"n":45,"v":[[1,"我耶和华所膏的居鲁士，我搀扶他的右手，使列国降伏在他面前。我也要放松列王的腰带，使城门在他面前敞开，不得关闭。我对他如此说："],[2,"“我必在你前面行，修平崎岖之地。我必打破铜门，砍断铁闩。"],[3,"我要将暗中的宝物和隐密的财宝赐给你，使你知道提名召你的，就是我耶和华以色列的神。"],[4,"因我仆人雅各、我所拣选以色列的缘故，我就提名召你，你虽不认识我，我也加给你名号。"],[5,"我是耶和华，在我以外并没有别神。除了我以外再没有神。你虽不认识我，我必给你束腰。"],[6,"从日出之地到日落之处，使人都知道除了我以外，没有别神。我是耶和华，在我以外并没有别神。"],[7,"我造光，又造暗；我施平安，又降灾祸；造作这一切的是我耶和华。”"],[8,"“诸天哪，自上而滴，穹苍降下公义，地面开裂，产出救恩，使公义一同发生，这都是我耶和华所造的。”"],[9,"祸哉！那与造他的主争论的，他不过是地上瓦片中的一块瓦片。泥土岂可对抟弄他的说：“你作什么呢？”所作的物岂可说：“你没有手呢？”"],[10,"祸哉！那对父亲说：“你生的是什么呢？”或对母亲（原文作“妇人”）说：“你产的是什么呢？”"],[11,"耶和华以色列的圣者，就是造就以色列的如此说：“将来的事你们可以问我，至于我的众子，并我手的工作，你们可以求我命定（“求我命定”原文作“吩咐我”）。"],[12,"我造地，又造人在地上，我亲手铺张诸天，天上万象也是我所命定的。"],[13,"我凭公义兴起居鲁士（“居鲁士”原文作“他”），又要修直他一切道路。他必建造我的城，释放我被掳的民，不是为工价，也不是为赏赐。这是万军之耶和华说的。”"],[14,"耶和华如此说：“埃及劳碌得来的和古实的货物必归你，身量高大的西巴人必投降你，也要属你。他们必带着锁链过来随从你，又向你下拜，祈求你说：‘神真在你们中间，此外再没有别神，再没有别的神。’”"],[15,"救主以色列的神啊，你实在是自隐的神。"],[16,"凡制造偶像的都必抱愧蒙羞，都要一同归于惭愧。"],[17,"惟有以色列必蒙耶和华的拯救，得永远的救恩。你们必不蒙羞，也不抱愧，直到永世无尽。"],[18,"创造诸天的耶和华，制造成全大地的神，他创造坚定大地，并非使地荒凉，是要给人居住。他如此说：“我是耶和华，再没有别神。"],[19,"我没有在隐密黑暗之地说话，我没有对雅各的后裔说：你们寻求我是徒然的。我耶和华所讲的是公义，所说的是正直。”"],[20,"“你们从列国逃脱的人，要一同聚集前来。那些抬着雕刻木偶，祷告不能救人之神的，毫无知识。"],[21,"你们要述说陈明你们的理，让他们彼此商议。谁从古时指明？谁从上古述说？不是我耶和华吗？除了我以外，再没有神。我是公义的神，又是救主，除了我以外，再没有别神。"],[22,"地极的人都当仰望我，就必得救，因为我是神，再没有别神。"],[23,"我指着自己起誓，我口所出的话是凭公义，并不反回。万膝必向我跪拜，万口必凭我起誓。”"],[24,"“人论我说：‘公义、能力，惟独在乎耶和华。人都必归向他。凡向他发怒的，必至蒙羞。"],[25,"以色列的后裔都必因耶和华得称为义，并要夸耀。’”"]]},{"n":46,"v":[[1,"彼勒屈身，尼波弯腰，巴比伦的偶像驮在兽和牲畜上，他们所抬的如今成了重驮，使牲畜疲乏。"],[2,"都一同弯腰屈身，不能保全重驮，自己倒被掳去。"],[3,"雅各家、以色列家一切余剩的，要听我言：“你们自从生下，就蒙我保抱；自从出胎，便蒙我怀搋。"],[4,"直到你们年老，我仍这样；直到你们发白，我仍怀搋。我已造作，也必保抱；我必怀抱，也必拯救。”"],[5,"“你们将谁与我相比，与我同等，可以与我比较，使我们相同呢？"],[6,"那从囊中抓金子、用天平平银子的人，雇银匠制造神像，他们又俯伏又叩拜。"],[7,"他们将神像抬起，扛在肩上，安置在定处，它就站立，不离本位。人呼求它，它不能答应，也不能救人脱离患难。”"],[8,"“你们当想念这事，自己作大丈夫。悖逆的人哪，要心里思想。"],[9,"你们要追念上古的事，因为我是神，并无别神；我是神，再没有能比我的。"],[10,"我从起初指明末后的事，从古时言明未成的事，说：‘我的筹算必立定，凡我所喜悦的，我必成就。’"],[11,"我召鸷鸟从东方来，召那成就我筹算的人从远方来。我已说出，也必成就；我已谋定，也必作成。"],[12,"你们这些心中顽梗、远离公义的，当听我言。"],[13,"我使我的公义临近，必不远离。我的救恩必不迟延，我要为以色列我的荣耀，在锡安施行救恩。”"]]},{"n":47,"v":[[1,"巴比伦的处女啊，下来坐在尘埃；迦勒底的闺女啊，没有宝座，要坐在地上，因为你不再称为柔弱娇嫩的。"],[2,"要用磨磨面，揭去帕子，脱去长衣，露腿趟河。"],[3,"你的下体必被露出，你的丑陋必被看见；我要报仇，谁也不宽容。"],[4,"我们救赎主的名是万军之耶和华以色列的圣者。"],[5,"迦勒底的闺女啊，你要默然静坐，进入暗中，因为你不再称为列国的主母。"],[6,"我向我的百姓发怒，使我的产业被亵渎，将他们交在你手中，你毫不怜悯他们，把极重的轭加在老年人身上。"],[7,"你自己说：“我必永为主母”，所以你不将这事放在心上，也不思想这事的结局。"],[8,"你这专好宴乐、安然居住的，现在当听这话。你心中说：“惟有我，除我以外再没有别的，我必不至寡居，也不遭丧子之事。”"],[9,"哪知，丧子、寡居这两件事在一日转眼之间必临到你，正在你多行邪术、广施符咒的时候，这两件事必全然临到你身上。"],[10,"你素来倚仗自己的恶行，说：“无人看见我。”你的智慧、聪明使你偏邪，并且你心里说：“惟有我，除我以外再没有别的。”"],[11,"因此，祸患要临到你身，你不知何时发现（“何时发现”或作“如何驱逐”），灾害落在你身上，你也不能除掉，所不知道的毁灭也必忽然临到你身。"],[12,"站起来吧！用你从幼年劳神施行的符咒和你许多的邪术，或者可得益处，或者可得强胜。"],[13,"你筹划太多，以致疲倦。让那些观天象的、看星宿的、在月朔说预言的，都站起来，救你脱离所要临到你的事。"],[14,"他们要像碎秸被火焚烧，不能救自己脱离火焰之力，这火并非可烤的炭火，也不是可以坐在其前的火。"],[15,"你所劳神的事都要这样与你无益。从幼年与你贸易的，也都各奔各乡，无人救你。"]]},{"n":48,"v":[[1,"雅各家称为以色列名下、从犹大水源出来的，当听我言。你们指着耶和华的名起誓，提说以色列的神，却不凭诚实，不凭公义。"],[2,"（他们自称为圣城的人，所倚靠的是名为万军之耶和华以色列的神。）"],[3,"主说：“早先的事我从古时说明，已经出了我的口，也是我所指示的，我忽然行作，事便成就。"],[4,"因为我素来知道你是顽梗的，你的颈项是铁的，你的额是铜的。"],[5,"所以我从古时将这事给你说明，在未成以先指示你，免得你说：‘这些事是我的偶像所行的，是我雕刻的偶像和我铸造的偶像所命定的。’”"],[6,"“你已经听见，现在要看见这一切，你不说明吗？从今以后，我将新事，就是你所不知道的隐密事指示你。"],[7,"这事是现今造的，并非从古就有；在今日以先，你也未曾听见，免得你说：‘这事我早已知道了。’"],[8,"你未曾听见，未曾知道，你的耳朵从来未曾开通。我原知道你行事极其诡诈，你自从出胎以来，便称为悖逆的。”"],[9,"“我为我的名暂且忍怒，为我的颂赞向你容忍，不将你剪除。"],[10,"我熬炼你，却不像熬炼银子；你在苦难的炉中，我拣选你。"],[11,"我为自己的缘故必行这事，我焉能使我的名被亵渎？我必不将我的荣耀归给假神。”"],[12,"“雅各，我所选召的以色列啊，当听我言：‘我是耶和华，我是首先的，也是末后的。"],[13,"我手立了地的根基，我右手铺张诸天，我一招呼便都立住。’”"],[14,"“你们都当聚集而听，他们（或作“偶像”）内中谁说过这些事？耶和华所爱的人，必向巴比伦行他所喜悦的事，他的膀臂也要加在迦勒底人身上。"],[15,"惟有我曾说过，我又选召他，领他来，他的道路就必亨通。"],[16,"你们要就近我来听这话：‘我从起头并未曾在隐密处说话，自从有这事，我就在那里。’现在主耶和华差遣我和他的灵来（或作“耶和华和他的灵差遣我来”）。”"],[17,"耶和华你的救赎主，以色列的圣者如此说：“我是耶和华你的神，教训你使你得益处，引导你所当行的路。"],[18,"甚愿你素来听从我的命令，你的平安就如河水，你的公义就如海浪。"],[19,"你的后裔也必多如海沙，你腹中所生的必多如沙粒。他的名在我面前必不剪除，也不灭绝。”"],[20,"你们要从巴比伦出来，从迦勒底人中逃脱，以欢呼的声音传扬说：“耶和华救赎了他的仆人雅各！”你们要将这事宣扬到地极。"],[21,"耶和华引导他们经过沙漠，他们并不干渴，他为他们使水从磐石而流，分裂磐石，水就涌出。"],[22,"耶和华说：“恶人必不得平安。”"]]},{"n":49,"v":[[1,"众海岛啊，当听我言！远方的众民哪，留心而听！自我出胎，耶和华就选召我；自出母腹，他就提我的名。"],[2,"他使我的口如快刀，将我藏在他手荫之下；又使我成为磨亮的箭，将我藏在他箭袋之中。"],[3,"对我说：“你是我的仆人以色列，我必因你得荣耀。”"],[4,"我却说：“我劳碌是徒然，我尽力是虚无虚空；然而，我当得的理必在耶和华那里，我的赏赐必在我神那里。”"],[5,"耶和华从我出胎，造就我作他的仆人，要使雅各归向他，使以色列到他那里聚集（原来耶和华看我为尊贵，我的神也成为我的力量）。"],[6,"现在他说：“你作我的仆人，使雅各众支派复兴，使以色列中得保全的归回尚为小事；我还要使你作外邦人的光，叫你施行我的救恩，直到地极。”"],[7,"救赎主以色列的圣者耶和华，对那被人所藐视、本国所憎恶、官长所虐待的如此说：“君王要看见就站起，首领也要下拜，都因信实的耶和华，就是拣选你以色列的圣者。”"],[8,"耶和华如此说：“在悦纳的时候，我应允了你；在拯救的日子，我济助了你。我要保护你，使你作众民的中保（“中保”原文作“约”），复兴遍地，使人承受荒凉之地为业。"],[9,"对那被捆绑的人说：‘出来吧！’对那在黑暗的人说：‘显露吧！’他们在路上必得饮食，在一切净光的高处必有食物。"],[10,"不饥不渴，炎热和烈日必不伤害他们，因为怜恤他们的，必引导他们，领他们到水泉旁边。”"],[11,"“我必使我的众山成为大道，我的大路也被修高。"],[12,"看哪，这些从远方来，这些从北方、从西方来，这些从秦国来（“秦”原音作“希尼”）。”"],[13,"诸天哪，应当欢呼！大地啊，应当快乐！众山哪，应当发声歌唱！因为耶和华已经安慰他的百姓，也要怜恤他困苦之民。"],[14,"锡安说：“耶和华离弃了我，主忘记了我。”"],[15,"妇人焉能忘记她吃奶的婴孩，不怜恤她所生的儿子？即或有忘记的，我却不忘记你。"],[16,"看哪，我将你铭刻在我掌上，你的墙垣常在我眼前。"],[17,"你的儿女必急速归回，毁坏你的、使你荒废的，必都离你出去。"],[18,"你举目向四方观看，他们都聚集来到你这里。耶和华说：“我指着我的永生起誓，你必要以他们为妆饰佩戴，以他们为华带束腰像新妇一样。”"],[19,"“至于你荒废凄凉之处，并你被毁坏之地，现今众民居住必显为太窄；吞灭你的必离你遥远。"],[20,"你必听见丧子之后所生的儿女说：‘这地方我居住太窄，求你给我地方居住。’"],[21,"那时你心里必说：‘我既丧子独居，是被掳的，漂流在外，谁给我生这些，谁将这些养大呢？撇下我一人独居的时候，这些在哪里呢？’”"],[22,"主耶和华如此说：“我必向列国举手，向万民竖立大旗，他们必将你的众子怀中抱来，将你的众女肩上扛来。"],[23,"列王必作你的养父，王后必作你的乳母；他们必将脸伏地，向你下拜，并舔你脚上的尘土。你便知道我是耶和华，等候我的必不至羞愧。”"],[24,"勇士抢去的岂能夺回？该掳掠的岂能解救吗？"],[25,"但耶和华如此说：“就是勇士所掳掠的，也可以夺回；强暴人所抢的，也可以解救。与你相争的，我必与他相争，我要拯救你的儿女。"],[26,"并且我必使那欺压你的吃自己的肉，也要以自己的血喝醉，好像喝甜酒一样。凡有血气的，必都知道我耶和华是你的救主，是你的救赎主，是雅各的大能者。”"]]},{"n":50,"v":[[1,"耶和华如此说：“我休你们的母亲，休书在哪里呢？我将你们卖给我哪一个债主呢？你们被卖，是因你们的罪孽；你们的母亲被休，是因你们的过犯。"],[2,"我来的时候，为何无人等候呢？我呼唤的时候，为何无人答应呢？我的膀臂岂是缩短、不能救赎吗？我岂无拯救之力吗？看哪，我一斥责，海就干了，我使江河变为旷野，其中的鱼因无水腥臭，干渴而死。"],[3,"我使诸天以黑暗为衣服，以麻布为遮盖。”"],[4,"主耶和华赐我受教者的舌头，使我知道怎样用言语扶助疲乏的人。主每早晨提醒，提醒我的耳朵，使我能听，像受教者一样。"],[5,"主耶和华开通我的耳朵，我并没有违背，也没有退后。"],[6,"人打我的背，我任他打；人拔我腮颊的胡须，我由他拔；人辱我吐我，我并不掩面。"],[7,"主耶和华必帮助我，所以我不抱愧。我硬着脸面好像坚石，我也知道我也不至蒙羞。"],[8,"称我为义的与我相近，谁与我争论，可以与我一同站立；谁与我作对，可以就近我来。"],[9,"主耶和华要帮助我，谁能定我有罪呢？他们都像衣服渐渐旧了，为蛀虫所咬。"],[10,"你们中间谁是敬畏耶和华、听从他仆人之话的，这人行在暗中，没有亮光，当倚靠耶和华的名，仗赖自己的神。"],[11,"凡你们点火，用火把围绕自己的，可以行在你们的火焰里，并你们所点的火把中。这是我手所定的。你们必躺在悲惨之中。"]]},{"n":51,"v":[[1,"你们这追求公义、寻求耶和华的，当听我言。你们要追想被凿而出的磐石，被挖而出的岩穴。"],[2,"要追想你们的祖宗亚伯拉罕和生养你们的撒拉。因为亚伯拉罕独自一人的时候，我选召他，赐福与他，使他人数增多。"],[3,"耶和华已经安慰锡安和锡安一切的荒场，使旷野像伊甸，使沙漠像耶和华的园囿；在其中必有欢喜、快乐、感谢和歌唱的声音。"],[4,"“我的百姓啊，要向我留心；我的国民哪，要向我侧耳。因为训诲必从我而出，我必坚定我的公理为万民之光。"],[5,"我的公义临近，我的救恩发出，我的膀臂要审判万民；海岛都要等候我，倚赖我的膀臂。"],[6,"你们要向天举目，观看下地，因为天必像烟云消散，地必如衣服渐渐旧了，其上的居民也要如此死亡（“如此死亡”或作“像蠓虫死亡”）；惟有我的救恩永远长存，我的公义也不废掉。
