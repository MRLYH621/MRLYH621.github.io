人是牲畜，都击杀了，又要败坏埃及一切的神。我是耶和华。"],[13,"这血要在你们所住的房屋上作记号，我一见这血，就越过你们去，我击杀埃及地头生的时候，灾殃必不临到你们身上灭你们。"],[14,"你们要记念这日，守为耶和华的节，作为你们世世代代永远的定例。"],[15,"你们要吃无酵饼七日。头一日要把酵从你们各家中除去，因为从头一日起，到第七日为止，凡吃有酵之饼的，必从以色列中剪除。"],[16,"头一日你们当有圣会，第七日也当有圣会，这两日之内，除了预备各人所要吃的以外，无论何工都不可作。"],[17,"你们要守无酵节，因为我正当这日把你们的军队从埃及地领出来；所以你们要守这日，作为世世代代永远的定例。"],[18,"从正月十四日晚上，直到二十一日晚上，你们要吃无酵饼。"],[19,"在你们各家中，七日之内不可有酵，因为凡吃有酵之物的，无论是寄居的，是本地的，必从以色列的会中剪除。"],[20,"有酵的物，你们都不可吃，在你们一切住处要吃无酵饼。”"],[21,"于是，摩西召了以色列的众长老来，对他们说：“你们要按着家口取出羊羔，把这逾越节的羊羔宰了。"],[22,"拿一把牛膝草，蘸盆里的血，打在门楣上和左右的门框上。你们谁也不可出自己的房门，直到早晨。"],[23,"因为耶和华要巡行击杀埃及人，他看见血在门楣上和左右的门框上，就必越过那门，不容灭命的进你们的房屋，击杀你们。"],[24,"这例你们要守着，作为你们和你们子孙永远的定例。"],[25,"日后，你们到了耶和华按着所应许赐给你们的那地，就要守这礼。"],[26,"你们的儿女问你们说：‘行这礼是什么意思？’"],[27,"你们就说：‘这是献给耶和华逾越节的祭。当以色列人在埃及的时候，他击杀埃及人，越过以色列人的房屋，救了我们各家。’”于是，百姓低头下拜。"],[28,"耶和华怎样吩咐摩西、亚伦，以色列人就怎样行。"],[29,"到了半夜，耶和华把埃及地所有的长子，就是从坐宝座的法老，直到被掳囚在监里之人的长子，以及一切头生的牲畜，尽都杀了。"],[30,"法老和一切臣仆，并埃及众人，夜间都起来了。在埃及有大哀号，无一家不死一个人的。"],[31,"夜间法老召了摩西、亚伦来，说：“起来！连你们带以色列人，从我民中出去，依你们所说的，去侍奉耶和华吧！"],[32,"也依你们所说的，连羊群牛群带着走吧！并要为我祝福。”"],[33,"埃及人催促百姓，打发他们快快出离那地，因为埃及人说：“我们都要死了。”"],[34,"百姓就拿着没有酵的生面，把抟面盆包在衣服中，扛在肩头上。"],[35,"以色列人照着摩西的话行，向埃及人要金器银器和衣裳。"],[36,"耶和华叫百姓在埃及人眼前蒙恩，以致埃及人给他们所要的，他们就把埃及人的财物夺去了。"],[37,"以色列人从兰塞起行，往疏割去，除了妇人孩子，步行的男人约有六十万。"],[38,"又有许多闲杂人，并有羊群牛群，和他们一同上去。"],[39,"他们用埃及带出来的生面烤成无酵饼，这生面原没有发起，因为他们被催逼离开埃及不能耽延，也没有为自己预备什么食物。"],[40,"以色列人住在埃及共有四百三十年。"],[41,"正满了四百三十年的那一天，耶和华的军队都从埃及地出来了。"],[42,"这夜是耶和华的夜，因耶和华领他们出了埃及地，所以当向耶和华谨守，是以色列众人世世代代该谨守的。"],[43,"耶和华对摩西、亚伦说：“逾越节的例是这样：外邦人都不可吃这羊羔。"],[44,"但各人用银子买的奴仆，既受了割礼，就可以吃。"],[45,"寄居的和雇工人都不可吃。"],[46,"应当在一个房子里吃，不可把一点肉从房子里带到外头去。羊羔的骨头一根也不可折断。"],[47,"以色列全会众都要守这礼。"],[48,"若有外人寄居在你们中间，愿向耶和华守逾越节，他所有的男子务要受割礼，然后才容他前来遵守，他也就像本地人一样；但未受割礼的，都不可吃这羊羔。"],[49,"本地人和寄居在你们中间的外人同归一例。”"],[50,"耶和华怎样吩咐摩西、亚伦，以色列众人就怎样行了。"],[51,"正当那日，耶和华将以色列人按着他们的军队，从埃及地领出来。"]]},{"n":13,"v":[[1,"耶和华晓谕摩西说："],[2,"“以色列中凡头生的，无论是人是牲畜，都是我的，要分别为圣归我。”"],[3,"摩西对百姓说：“你们要记念从埃及为奴之家出来的这日，因为耶和华用大能的手将你们从这地方领出来，有酵的饼都不可吃。"],[4,"亚笔月间的这日是你们出来的日子。"],[5,"将来耶和华领你进迦南人、赫人、亚摩利人、希未人、耶布斯人之地，就是他向你的祖宗起誓应许给你那流奶与蜜之地，那时你要在这月间守这礼。"],[6,"你要吃无酵饼七日，到第七日要向耶和华守节。"],[7,"这七日之久，要吃无酵饼，在你四境之内不可见有酵的饼，也不可见发酵的物。"],[8,"当那日，你要告诉你的儿子说：‘这是因耶和华在我出埃及的时候为我所行的事。’"],[9,"这要在你手上作记号，在你额上作纪念，使耶和华的律法常在你口中，因为耶和华曾用大能的手将你从埃及领出来。"],[10,"所以你每年要按着日期守这例。"],[11,"“将来，耶和华照他向你和你祖宗所起的誓，将你领进迦南人之地，把这地赐给你。"],[12,"那时你要将一切头生的，并牲畜中头生的，归给耶和华；公的都要属耶和华。"],[13,"凡头生的驴，你要用羊羔代赎，若不代赎，就要打折它的颈项。凡你儿子中头生的都要赎出来。"],[14,"日后，你的儿子问你说：‘这是什么意思？’你就说：‘耶和华用大能的手将我们从埃及为奴之家领出来。"],[15,"那时法老几乎不容我们去，耶和华就把埃及地所有头生的，无论是人是牲畜，都杀了，因此我把一切头生的公牲畜献给耶和华为祭，但将头生的儿子都赎出来。"],[16,"这要在你手上作记号，在你额上作经文，因为耶和华用大能的手将我们从埃及领出来。’”"],[17,"法老容百姓去的时候，非利士地的道路虽近，神却不领他们从那里走，因为神说：“恐怕百姓遇见打仗后悔，就回埃及去。”"],[18,"所以神领百姓绕道而行，走红海旷野的路。以色列人出埃及地，都带着兵器上去。"],[19,"摩西把约瑟的骸骨一同带去，因为约瑟曾叫以色列人严严地起誓，对他们说：“神必眷顾你们，你们要把我的骸骨从这里一同带上去。”"],[20,"他们从疏割起行，在旷野边的以倘安营。"],[21,"日间，耶和华在云柱中领他们的路；夜间，在火柱中光照他们，使他们日夜都可以行走。"],[22,"日间云柱，夜间火柱，总不离开百姓的面前。"]]},{"n":14,"v":[[1,"耶和华晓谕摩西说："],[2,"“你吩咐以色列人转回，安营在比哈希录前、密夺和海的中间，对着巴力洗分靠近海边安营。"],[3,"法老必说：‘以色列人在地中绕迷了，旷野把他们困住了。’"],[4,"我要使法老的心刚硬，他要追赶他们，我便在法老和他全军身上得荣耀，埃及人就知道我是耶和华。”于是，以色列人这样行了。"],[5,"有人告诉埃及王说：“百姓逃跑！”法老和他的臣仆就向百姓变心，说：“我们容以色列人去不再服侍我们，这作的是什么事呢？”"],[6,"法老就预备他的车辆，带领军兵同去，"],[7,"并带着六百辆特选的车和埃及所有的车，每辆都有车兵长。"],[8,"耶和华使埃及王法老的心刚硬，他就追赶以色列人，因为以色列人是昂然无惧地出埃及。"],[9,"埃及人追赶他们，法老一切的马匹、车辆、马兵与军兵，就在海边上靠近比哈希录对着巴力洗分，在他们安营的地方追上了。"],[10,"法老临近的时候，以色列人举目看见埃及人赶来，就甚惧怕，向耶和华哀求。"],[11,"他们对摩西说：“难道在埃及没有坟地，你把我们带来死在旷野吗？你为什么这样待我们，将我们从埃及领出来呢？"],[12,"我们在埃及岂没有对你说过，不要搅扰我们，容我们服侍埃及人吗？因为服侍埃及人比死在旷野还好。”"],[13,"摩西对百姓说：“不要惧怕，只管站住！看耶和华今天向你们所要施行的救恩。因为你们今天所看见的埃及人，必永远不再看见了。"],[14,"耶和华必为你们争战，你们只管静默，不要作声。”"],[15,"耶和华对摩西说：“你为什么向我哀求呢？你吩咐以色列人往前走。"],[16,"你举手向海伸杖，把水分开，以色列人要下海中走干地。"],[17,"我要使埃及人的心刚硬，他们就跟着下去，我要在法老和他的全军、车辆、马兵上得荣耀。"],[18,"我在法老和他的车辆、马兵上得荣耀的时候，埃及人就知道我是耶和华了。”"],[19,"在以色列营前行走神的使者，转到他们后边去；云柱也从他们前边转到他们后边立住。"],[20,"在埃及营和以色列营中间有云柱，一边黑暗，一边发光，终夜两下不得相近。"],[21,"摩西向海伸杖，耶和华便用大东风，使海水一夜退去，水便分开，海就成了干地。"],[22,"以色列人下海中走干地，水在他们的左右作了墙垣。"],[23,"埃及人追赶他们，法老一切的马匹、车辆和马兵都跟着下到海中。"],[24,"到了晨更的时候，耶和华从云、火柱中向埃及的军兵观看，使埃及的军兵混乱了；"],[25,"又使他们的车轮脱落，难以行走，以致埃及人说：“我们从以色列人面前逃跑吧！因耶和华为他们攻击我们了。”"],[26,"耶和华对摩西说：“你向海伸杖，叫水仍合在埃及人并他们的车辆、马兵身上。”"],[27,"摩西就向海伸杖，到了天一亮，海水仍旧复原。埃及人避水逃跑的时候，耶和华把他们推翻在海中，"],[28,"水就回流，淹没了车辆和马兵，那些跟着以色列人下海法老的全军，连一个也没有剩下。"],[29,"以色列人却在海中走干地，水在他们的左右作了墙垣。"],[30,"当日，耶和华这样拯救以色列人脱离埃及人的手，以色列人看见埃及人的死尸都在海边了。"],[31,"以色列人看见耶和华向埃及人所行的大事，就敬畏耶和华，又信服他和他的仆人摩西。"]]},{"n":15,"v":[[1,"那时，摩西和以色列人向耶和华唱歌说：“我要向耶和华歌唱，因他大大战胜，将马和骑马的投在海中。"],[2,"耶和华是我的力量、我的诗歌，也成了我的拯救。这是我的神，我要赞美他；是我父亲的神，我要尊崇他。"],[3,"耶和华是战士，他的名是耶和华。"],[4,"法老的车辆、军兵，耶和华已抛在海中，他特选的军长都沉于红海。"],[5,"深水淹没他们，他们如同石头坠到深处。"],[6,"耶和华啊，你的右手施展能力，显出荣耀。耶和华啊，你的右手摔碎仇敌。"],[7,"你大发威严，推翻那些起来攻击你的；你发出烈怒如火，烧灭他们像烧碎秸一样。"],[8,"你发鼻中的气，水便聚起成堆，大水直立如垒，海中的深水凝结。"],[9,"仇敌说：‘我要追赶，我要追上，我要分掳物，我要在他们身上称我的心愿，我要拔出刀来，亲手杀灭他们。’"],[10,"你叫风一吹，海就把他们淹没，他们如铅沉在大水之中。"],[11,"耶和华啊，众神之中谁能像你？谁能像你至圣至荣，可颂可畏，施行奇事？"],[12,"你伸出右手，地便吞灭他们。"],[13,"你凭慈爱领了你所赎的百姓；你凭能力引他们到了你的圣所。"],[14,"外邦人听见就发颤，疼痛抓住非利士的居民。"],[15,"那时，以东的族长惊惶，摩押的英雄被战兢抓住，迦南的居民心都消化了。"],[16,"惊骇恐惧临到他们。耶和华啊，因你膀臂的大能，他们如石头寂然不动，等候你的百姓过去，等候你所赎的百姓过去。"],[17,"你要将他们领进去，栽于你产业的山上。耶和华啊，就是你为自己所造的住处；主啊，就是你手所建立的圣所。"],[18,"耶和华必作王，直到永永远远！”"],[19,"法老的马匹、车辆，和马兵下到海中，耶和华使海水回流淹没他们，惟有以色列人在海中走干地。"],[20,"亚伦的姐姐女先知米利暗，手里拿着鼓，众妇女也跟她出去拿鼓跳舞。"],[21,"米利暗应声说：“你们要歌颂耶和华，因他大大战胜，将马和骑马的投在海中。”"],[22,"摩西领以色列人从红海往前行，到了书珥的旷野，在旷野走了三天，找不着水。"],[23,"到了玛拉，不能喝那里的水，因为水苦，所以那地名叫玛拉。"],[24,"百姓就向摩西发怨言，说：“我们喝什么呢？”"],[25,"摩西呼求耶和华，耶和华指示他一棵树，他把树丢在水里，水就变甜了。耶和华在那里为他们定了律例、典章，在那里试验他们。"],[26,"又说：“你若留意听耶和华你神的话，又行我眼中看为正的事，留心听我的诫命，守我一切的律例，我就不将所加与埃及人的疾病加在你身上，因为我耶和华是医治你的。”"],[27,"他们到了以琳，在那里有十二股水泉，七十棵棕树，他们就在那里的水边安营。"]]},{"n":16,"v":[[1,"以色列全会众从以琳起行，在出埃及后第二个月十五日，到了以琳和西奈中间、汛的旷野。"],[2,"以色列全会众在旷野向摩西、亚伦发怨言，"],[3,"说：“巴不得我们早死在埃及地耶和华的手下，那时我们坐在肉锅旁边，吃得饱足；你们将我们领出来，到这旷野，是要叫这全会众都饿死啊！”"],[4,"耶和华对摩西说：“我要将粮食从天降给你们。百姓可以出去，每天收每天的份，我好试验他们遵不遵我的法度。"],[5,"到第六天他们要把所收进来的预备好了，比每天所收的多一倍。”"],[6,"摩西、亚伦对以色列众人说：“到了晚上，你们要知道是耶和华将你们从埃及地领出来的。"],[7,"早晨，你们要看见耶和华的荣耀，因为耶和华听见你们向他所发的怨言了。我们算什么，你们竟向我们发怨言呢？”"],[8,"摩西又说：“耶和华晚上必给你们肉吃，早晨必给你们食物得饱，因为你们向耶和华发的怨言，他都听见了。我们算什么？你们的怨言不是向我们发的，乃是向耶和华发的。”"],[9,"摩西对亚伦说：“你告诉以色列全会众说：‘你们就近耶和华面前，因为他已经听见你们的怨言了。’”"],[10,"亚伦正对以色列全会众说话的时候，他们向旷野观看，不料，耶和华的荣光在云中显现。"],[11,"耶和华晓谕摩西说："],[12,"“我已经听见以色列人的怨言，你告诉他们说：‘到黄昏的时候，你们要吃肉，早晨必有食物得饱，你们就知道我是耶和华你们的神。’”"],[13,"到了晚上，有鹌鹑飞来，遮满了营。早晨，在营四围的地上有露水。"],[14,"露水上升之后，不料，野地面上有如白霜的小圆物。"],[15,"以色列人看见，不知道是什么，就彼此对问说：“这是什么呢？”摩西对他们说：“这就是耶和华给你们吃的食物。"],[16,"耶和华所吩咐的是这样：你们要按着各人的饭量，为帐棚里的人按着人数收起来，各拿一俄梅珥。”"],[17,"以色列人就这样行，有多收的，有少收的。"],[18,"及至用俄梅珥量一量，多收的也没有余，少收的也没有缺，各人按着自己的饭量收取。"],[19,"摩西对他们说：“所收的，不许什么人留到早晨。”"],[20,"然而他们不听摩西的话，内中有留到早晨的，就生虫变臭了；摩西便向他们发怒。"],[21,"他们每日早晨，按着各人的饭量收取，日头一发热，就消化了。"],[22,"到第六天，他们收了双倍的食物，每人两俄梅珥。会众的官长来告诉摩西，"],[23,"摩西对他们说：“耶和华这样说：‘明天是圣安息日，是向耶和华守的圣安息日，你们要烤的就烤了，要煮的就煮了，所剩下的都留到早晨。’”"],[24,"他们就照摩西的吩咐留到早晨，也不臭，里头也没有虫子。"],[25,"摩西说：“你们今天吃这个吧！因为今天是向耶和华守的安息日，你们在田野必找不着了。"],[26,"六天可以收取，第七天乃是安息日，那一天必没有了。”"],[27,"第七天百姓中有人出去收，什么也找不着。"],[28,"耶和华对摩西说：“你们不肯守我的诫命和律法，要到几时呢？"],[29,"你们看！耶和华既将安息日赐给你们，所以第六天他赐给你们两天的食物，第七天各人要住在自己的地方，不许什么人出去。”"],[30,"于是，百姓第七天安息了。"],[31,"这食物，以色列家叫吗哪，样子像芫荽子，颜色是白的，滋味如同搀蜜的薄饼。"],[32,"摩西说：“耶和华所吩咐的是这样：要将一满俄梅珥吗哪留到世世代代，使后人可以看见我当日将你们领出埃及地，在旷野所给你们吃的食物。”"],[33,"摩西对亚伦说：“你拿一个罐子，盛一满俄梅珥吗哪，存在耶和华面前，要留到世世代代。”"],[34,"耶和华怎么吩咐摩西，亚伦就怎么行，把吗哪放在法柜前存留。"],[35,"以色列人吃吗哪共四十年，直到进了有人居住之地，就是迦南的境界。"],[36,"（俄梅珥乃伊法十分之一。）"]]},{"n":17,"v":[[1,"以色列全会众都遵耶和华的吩咐，按着站口从汛的旷野往前行，在利非订安营。百姓没有水喝，"],[2,"所以与摩西争闹，说：“给我们水喝吧！”摩西对他们说：“你们为什么与我争闹，为什么试探耶和华呢？”"],[3,"百姓在那里甚渴，要喝水，就向摩西发怨言，说：“你为什么将我们从埃及领出来，使我们和我们的儿女并牲畜都渴死呢？”"],[4,"摩西就呼求耶和华说：“我向这百姓怎样行呢？他们几乎要拿石头打死我。”"],[5,"耶和华对摩西说：“你手里拿着你先前击打河水的杖，带领以色列的几个长老，从百姓面前走过去。"],[6,"我必在何烈的磐石那里站在你面前，你要击打磐石，从磐石里必有水流出来，使百姓可以喝。”摩西就在以色列的长老眼前这样行了。"],[7,"他给那地方起名叫玛撒（就是“试探”的意思），又叫米利巴（就是“争闹”的意思），因以色列人争闹，又因他们试探耶和华说：“耶和华是在我们中间不是？”"],[8,"那时，亚玛力人来在利非订，和以色列人争战。"],[9,"摩西对约书亚说：“你为我们选出人来，出去和亚玛力人争战。明天我手里要拿着神的杖，站在山顶上。”"],[10,"于是约书亚照着摩西对他所说的话行，和亚玛力人争战。摩西、亚伦与户珥都上了山顶。"],[11,"摩西何时举手，以色列人就得胜；何时垂手，亚玛力人就得胜。"],[12,"但摩西的手发沉，他们就搬石头来，放在他以下，他就坐在上面。亚伦与户珥扶着他的手，一个在这边，一个在那边，他的手就稳住，直到日落的时候。"],[13,"约书亚用刀杀了亚玛力王和他的百姓。"],[14,"耶和华对摩西说：“我要将亚玛力的名号从天下全然涂抹了，你要将这话写在书上作纪念，又念给约书亚听。”"],[15,"摩西筑了一座坛，起名叫“耶和华尼西”（就是“耶和华是我旌旗”的意思）；"],[16,"又说：“耶和华已经起了誓，必世世代代和亚玛力人争战。”"]]},{"n":18,"v":[[1,"摩西的岳父米甸祭司叶忒罗，听见神为摩西和神的百姓以色列所行的一切事，就是耶和华将以色列从埃及领出来的事，"],[2,"便带着摩西的妻子西坡拉，就是摩西从前打发回去的；"],[3,"又带着西坡拉的两个儿子，一个名叫革舜，因为摩西说：“我在外邦作了寄居的”，"],[4,"一个名叫以利以谢，因为他说：“我父亲的神帮助了我，救我脱离法老的刀。”"],[5,"摩西的岳父叶忒罗，带着摩西的妻子和两个儿子来到神的山，就是摩西在旷野安营的地方。"],[6,"他对摩西说：“我是你岳父叶忒罗，带着你的妻子和两个儿子来到你这里。”"],[7,"摩西迎接他的岳父，向他下拜，与他亲嘴，彼此问安，都进了帐棚。"],[8,"摩西将耶和华为以色列的缘故向法老和埃及人所行的一切事，以及路上所遭遇的一切艰难，并耶和华怎样搭救他们，都述说与他岳父听。"],[9,"叶忒罗因耶和华待以色列的一切好处，就是拯救他们脱离埃及人的手，便甚欢喜。"],[10,"叶忒罗说：“耶和华是应当称颂的，他救了你们脱离埃及人和法老的手，将这百姓从埃及人的手下救出来。"],[11,"我现今在埃及人向这百姓发狂傲的事上，得知耶和华比万神都大。”"],[12,"摩西的岳父叶忒罗把燔祭和平安祭献给神。亚伦和以色列的众长老都来了，与摩西的岳父在神面前吃饭。"],[13,"第二天，摩西坐着审判百姓，百姓从早到晚都站在摩西的左右。"],[14,"摩西的岳父看见他向百姓所作的一切事，就说：“你向百姓作的是什么事呢？你为什么独自坐着，众百姓从早到晚都站在你的左右呢？”"],[15,"摩西对岳父说：“这是因百姓到我这里来求问神。"],[16,"他们有事的时候就到我这里来，我便在两造之间施行审判，我又叫他们知道神的律例和法度。”"],[17,"摩西的岳父说：“你这作的不好。"],[18,"你和这些百姓必都疲惫，因为这事太重，你独自一人办理不了。"],[19,"现在你要听我的话，我为你出个主意，愿神与你同在。你要替百姓到神面前，将案件奏告神；"],[20,"又要将律例和法度教训他们，指示他们当行的道、当作的事；"],[21,"并要从百姓中拣选有才能的人，就是敬畏神、诚实无妄、恨不义之财的人，派他们作千夫长、百夫长、五十夫长、十夫长，管理百姓。"],[22,"叫他们随时审判百姓，大事都要呈到你这里，小事他们自己可以审判。这样，你就轻省些，他们也可以同当此任。"],[23,"你若这样行，神也这样吩咐你，你就能受得住，这百姓也都平平安安归回他们的住处。”"],[24,"于是，摩西听从他岳父的话，按着他所说的去行。"],[25,"摩西从以色列人中拣选了有才能的人，立他们为百姓的首领，作千夫长、百夫长、五十夫长、十夫长。"],[26,"他们随时审判百姓，有难断的案件就呈到摩西那里，但各样小事他们自己审判。"],[27,"此后，摩西让他的岳父去，他就往本地去了。"]]},{"n":19,"v":[[1,"以色列人出埃及地以后，满了三个月的那一天，就来到西奈的旷野。"],[2,"他们离了利非订，来到西奈的旷野，就在那里的山下安营。"],[3,"摩西到神那里，耶和华从山上呼唤他说：“你要这样告诉雅各家，晓谕以色列人说："],[4,"‘我向埃及人所行的事，你们都看见了；且看见我如鹰将你们背在翅膀上，带来归我。"],[5,"如今你们若实在听从我的话，遵守我的约，就要在万民中作属我的子民；因为全地都是我的，"],[6,"你们要归我作祭司的国度，为圣洁的国民。’这些话你要告诉以色列人。”"],[7,"摩西去召了民间的长老来，将耶和华所吩咐他的话，都在他们面前陈明。"],[8,"百姓都同声回答说：“凡耶和华所说的我们都要遵行。”摩西就将百姓的话回复耶和华。"],[9,"耶和华对摩西说：“我要在密云中临到你那里，叫百姓在我与你说话的时候可以听见，也可以永远信你了。”于是摩西将百姓的话奏告耶和华。"],[10,"耶和华又对摩西说：“你往百姓那里去，叫他们今天明天自洁，又叫他们洗衣服。"],[11,"到第三天要预备好了，因为第三天耶和华要在众百姓眼前降临在西奈山上。"],[12,"你要在山的四围给百姓定界限，说：‘你们当谨慎，不可上山去，也不可摸山的边界；凡摸这山的，必要治死他。"],[13,"不可用手摸他，必用石头打死，或用箭射透，无论是人是牲畜，都不得活。到角声拖长的时候，他们才可到山根来。’”"],[14,"摩西下山往百姓那里去，叫他们自洁，他们就洗衣服。"],[15,"他对百姓说：“到第三天要预备好了，不可亲近女人。”"],[16,"到了第三天早晨，在山上有雷轰、闪电和密云，并且角声甚大，营中的百姓尽都发颤。"],[17,"摩西率领百姓出营迎接神，都站在山下。"],[18,"西奈全山冒烟，因为耶和华在火中降于山上，山的烟气上腾，如烧窑一般，遍山大大地震动。"],[19,"角声渐渐地高而又高，摩西就说话，神有声音答应他。"],[20,"耶和华降临在西奈山顶上，耶和华召摩西上山顶，摩西就上去。"],[21,"耶和华对摩西说：“你下去嘱咐百姓，不可闯过来到我面前观看，恐怕他们有多人死亡；"],[22,"又叫亲近我的祭司自洁，恐怕我忽然出来击杀他们。”"],[23,"摩西对耶和华说：“百姓不能上西奈山，因为你已经嘱咐我们说：‘要在山的四围定界限，叫山成圣。’”"],[24,"耶和华对他说：“下去吧！你要和亚伦一同上来，只是祭司和百姓不可闯过来上到我面前，恐怕我忽然出来击杀他们。”"],[25,"于是摩西下到百姓那里告诉他们。"]]},{"n":20,"v":[[1,"神吩咐这一切的话，说："],[2,"“我是耶和华你的神，曾将你从埃及地为奴之家领出来。”"],[3,"“除了我以外，你不可有别的神。”"],[4,"“不可为自己雕刻偶像；也不可作什么形像彷佛上天、下地和地底下、水中的百物。"],[5,"不可跪拜那些像；也不可侍奉它，因为我耶和华你的神，是忌邪的神。恨我的，我必追讨他的罪，自父及子，直到三四代；"],[6,"爱我、守我诫命的，我必向他们发慈爱，直到千代。”"],[7,"“不可妄称耶和华你神的名；因为妄称耶和华名的，耶和华必不以他为无罪。”"],[8,"“当记念安息日，守为圣日。"],[9,"六日要劳碌作你一切的工，"],[10,"但第七日是向耶和华你神当守的安息日。这一日你和你的儿女、仆婢、牲畜，并你城里寄居的客旅，无论何工都不可作，"],[11,"因为六日之内，耶和华造天、地、海和其中的万物，第七日便安息，所以耶和华赐福与安息日，定为圣日。”"],[12,"“当孝敬父母，使你的日子在耶和华你神所赐你的地上得以长久。”"],[13,"“不可杀人。”"],[14,"“不可奸淫。”"],[15,"“不可偷盗。”"],[16,"“不可作假见证陷害人。”"],[17,"“不可贪恋人的房屋；也不可贪恋人的妻子、仆婢、牛驴，并他一切所有的。”"],[18,"众百姓见雷轰、闪电、角声、山上冒烟，就都发颤，远远地站立，"],[19,"对摩西说：“求你和我们说话，我们必听，不要神和我们说话，恐怕我们死亡。”"],[20,"摩西对百姓说：“不要惧怕，因为神降临是要试验你们，叫你们时常敬畏他，不至犯罪。”"],[21,"于是百姓远远地站立，摩西就挨近神所在的幽暗之中。"],[22,"耶和华对摩西说：“你要向以色列人这样说：‘你们自己看见我从天上和你们说话了。"],[23,"你们不可作什么神像与我相配，不可为自己作金银的神像。’"],[24,"你要为我筑土坛，在上面以牛羊献为燔祭和平安祭］凡记下我名的地方，我必到那里赐福给你。"],[25,"你若为我筑一座石坛，不可用凿成的石头，因你在上头一动家具，就把坛污秽了。"],[26,"你上我的坛，不可用台阶，免得露出你的下体来。”"]]},{"n":21,"v":[[1,"“你在百姓面前所要立的典章是这样："],[2,"你若买希伯来人作奴仆，他必服侍你六年，第七年他可以自由，白白地出去。"],[3,"他若孤身来，就可以孤身去；他若有妻，他的妻就可以同他出去。"],[4,"他主人若给他妻子，妻子给他生了儿子或女儿，妻子和儿女要归主人，他要独自出去。"],[5,"倘或奴仆明说：‘我爱我的主人和我的妻子儿女，不愿意自由出去。’"],[6,"他的主人就要带他到审判官那里（“审判官”或作“神”。下同），又要带他到门前，靠着门框，用锥子穿他的耳朵，他就永远服侍主人。”"],[7,"“人若卖女儿作婢女，婢女不可像男仆那样出去。"],[8,"主人选定她归自己，若不喜欢她，就要许她赎身；主人既然用诡诈待她，就没有权柄卖给外邦人。"],[9,"主人若选定她给自己的儿子，就当待她如同女儿。"],[10,"若另娶一个，那女子的吃食、衣服］并好合的事，仍不可减少。"],[11,"若不向她行这三样，她就可以不用钱赎，白白地出去。”"],[12,"“打人以致打死的，必要把他治死。"],[13,"人若不是埋伏着杀人，乃是神交在他手中，我就设下一个地方，他可以往那里逃跑。"],[14,"人若任意用诡计杀了他的邻舍，就是逃到我的坛那里，也当捉去把他治死。”"],[15,"“打父母的，必要把他治死。”"],[16,"“拐带人口，或是把人卖了，或是留在他手下，必要把他治死。”"],[17,"“咒骂父母的，必要把他治死。”"],[18,"“人若彼此相争，这个用石头或是拳头打那个，尚且不至于死，不过躺卧在床，"],[19,"若再能起来扶杖而出，那打他的可算无罪；但要将他耽误的工夫用钱赔补，并要将他全然医好。”"],[20,"“人若用棍子打奴仆或婢女，立时死在他的手下，他必要受刑；"],[21,"若过一两天才死，就可以不受刑，因为是用钱买的。”"],[22,"“人若彼此争斗，伤害有孕的妇人，甚至坠胎，随后却无别害，那伤害她的总要按妇人的丈夫所要的，照审判官所断的受罚。"],[23,"若有别害，就要以命偿命，"],[24,"以眼还眼，以牙还牙，以手还手，以脚还脚，"],[25,"以烙还烙，以伤还伤，以打还打。”"],[26,"“人若打坏了他奴仆或是婢女的一只眼，就要因他的眼放他去得以自由。"],[27,"若打掉了他奴仆或是婢女的一个牙，就要因他的牙放他去得以自由。”"],[28,"“牛若触死男人或是女人，总要用石头打死那牛，却不可吃它的肉，牛的主人可算无罪。"],[29,"倘若那牛素来是触人的，有人报告了牛主，他竟不把牛拴着，以致把男人或是女人触死，就要用石头打死那牛，牛主也必治死；"],[30,"若罚他赎命的价银，他必照所罚的赎他的命。"],[31,"牛无论触了人的儿子或是女儿，必照这例办理。"],[32,"牛若触了奴仆或是婢女，必将银子三十舍客勒给他们的主人，也要用石头把牛打死。”"],[33,"“人若敞着井口，或挖井不遮盖，有牛或驴掉在里头，"],[34,"井主要拿钱赔还本主人，死牲畜要归自己。”"],[35,"“这人的牛若伤了那人的牛，以致于死，他们要卖了活牛，平分价值，也要平分死牛。"],[36,"人若知道这牛素来是触人的，主人竟不把牛拴着，他必要以牛还牛，死牛要归自己。”"]]},{"n":22,"v":[[1,"“人若偷牛或羊，无论是宰了，是卖了，他就要以五牛赔一牛，四羊赔一羊。"],[2,"人若遇见贼挖窟窿，把贼打了，以致于死，就不能为他有流血的罪；"],[3,"若太阳已经出来，就为他有流血的罪。贼若被拿，总要赔还；若他一无所有，就要被卖，顶他所偷的物’"],[4,"若他所偷的，或牛，或驴，或羊，仍在他手下存活，他就要加倍赔还。”"],[5,"“人若在田间或在葡萄园里放牲畜，任凭牲畜上别人的田里去吃，就必拿自己田间上好的，和葡萄园上好的赔还。”"],[6,"“若点火焚烧荆棘，以致将别人堆积的禾捆，站着的禾稼，或是田园，都烧尽了，那点火的必要赔还。”"],[7,"“人若将银钱或家具交付邻舍看守，这物从那人的家被偷去，若把贼找到了，贼要加倍赔还；"],[8,"若找不到贼，那家主必就近审判官，要看看他拿了原主的物件没有。”"],[9,"“两个人的案件，无论是为什么过犯，或是为牛，为驴，为羊，为衣裳，或是为什么失掉之物，有一人说：‘这是我的’，两造就要将案件禀告审判官，审判官定谁有罪，谁就要加倍赔还。”"],[10,"“人若将驴，或牛，或羊，或别的牲畜，交付邻舍看守，牲畜或死，或受伤，或被赶去，无人看见，"],[11,"那看守的人，要凭着耶和华起誓。手里未曾拿邻舍的物，本主就要罢休，看守的人不必赔还。"],[12,"牲畜若从看守的那里被偷去，他就要赔还本主；"],[13,"若被野兽撕碎，看守的要带来当作证据，所撕的不必赔还。”"],[14,"“人若向邻舍借什么，所借的或受伤，或死，本主没有同在一处，借的人总要赔还。"],[15,"若本主同在一处，他就不必赔还；若是雇的，也不必赔还，本是为雇价来的。”"],[16,"“人若引诱没有受聘的处女，与她行淫，他总要交出聘礼娶她为妻。"],[17,"若女子的父亲决不肯将女子给他，他就要按处女的聘礼，交出钱来。”"],[18,"“行邪术的女人，不可容她存活。”"],[19,"“凡与兽淫合的，总要把他治死。”"],[20,"“祭祀别神，不单单祭祀耶和华的，那人必要灭绝。”"],[21,"“不可亏负寄居的，也不可欺压他，因为你们在埃及地也作过寄居的。"],[22,"不可苦待寡妇和孤儿。"],[23,"若是苦待他们一点，他们向我一哀求，我总要听他们的哀声，"],[24,"并要发烈怒，用刀杀你们，使你们的妻子为寡妇，儿女为孤儿。”"],[25,"“我民中有贫穷人与你同住，你若借钱给他，不可如放债的向他取利。"],[26,"你即或拿邻舍的衣服作当头，必在日落以先归还他；"],[27,"因他只有这一件当盖头，是他盖身的衣服，若是没有，他拿什么睡觉呢？他哀求我，我就应允，因为我是有恩惠的。”"],[28,"“不可毁谤神，也不可毁谤你百姓的官长。”"],[29,"“你要从你庄稼中的谷和酒醡中滴出来的酒拿来献上，不可迟延。”“你要将头生的儿子归给我。"],[30,"你牛羊头生的，也要这样，七天当跟着母，第八天要归给我。”"],[31,"“你们要在我面前为圣洁的人，因此，田间被野兽撕裂牲畜的肉，你们不可吃，要丢给狗吃。”"]]},{"n":23,"v":[[1,"“不可随伙布散谣言，不可与恶人连手妄作见证；"],[2,"不可随众行恶，不可在争讼的事上随众偏行，作见证屈枉正直；"],[3,"也不可在争讼的事上偏护穷人。”"],[4,"“若遇见你仇敌的牛或驴失迷了路，总要牵回来交给他。"],[5,"若看见恨你人的驴压卧在重驮之下，不可走开，务要和驴主一同抬开重驮。”"],[6,"“不可在穷人争讼的事上屈枉正直。"],[7,"当远离虚假的事。不可杀无辜和有义的人，因我必不以恶人为义。"],[8,"不可受贿赂，因为贿赂能叫明眼人变瞎了，又能颠倒义人的话。”"],[9,"“不可欺压寄居的，因为你们在埃及地作过寄居的，知道寄居的心。”"],[10,"“六年你要耕种田地，收藏土产，"],[11,"只是第七年要叫地歇息，不耕不种，使你民中的穷人有吃的。他们所剩下的，野兽可以吃。你的葡萄园和橄榄园，也要照样办理。”"],[12,"“六日你要作工，第七日要安息，使牛、驴可以歇息，并使你婢女的儿子和寄居的都可以舒畅。”"],[13,"“凡我对你们说的话，你们要谨守。别神的名你不可提，也不可从你口中传说。”"],[14,"“一年三次，你要向我守节。"],[15,"你要守除酵节，照我所吩咐你的，在亚笔月内所定的日期，吃无酵饼七天。谁也不可空手朝见我，因为你是这月出了埃及。"],[16,"又要守收割节，所收的是你田间所种、劳碌得来初熟之物。并在年底收藏，要守收藏节。"],[17,"一切的男丁要一年三次朝见主耶和华。”"],[18,"“不可将我祭牲的血和有酵的饼一同献上，也不可将我节上祭牲的脂油留到早晨。”"],[19,"“地里首先初熟之物要送到耶和华你神的殿。”“不可用山羊羔母的奶煮山羊羔。”"],[20,"“看哪，我差遣使者在你前面，在路上保护你，领你到我所预备的地方去。"],[21,"他是奉我名来的，你们要在他面前谨慎，听从他的话，不可惹他（“惹”或作“违背”），因为他必不赦免你们的过犯。”"],[22,"“你若实在听从他的话，照着我一切所说的去行，我就向你的仇敌作仇敌，向你的敌人作敌人。”"],[23,"“我的使者要在你前面行，领你到亚摩利人、赫人、比利洗人、迦南人、希未人、耶布斯人那里去，我必将他们剪除。"],[24,"你不可跪拜他们的神，不可侍奉他，也不可效法他们的行为，却要把神像尽行拆毁，打碎他们的柱像。"],[25,"你们要侍奉耶和华你们的神，他必赐福与你的粮与你的水，也必从你们中间除去疾病。"],[26,"你境内必没有坠胎的、不生产的，我要使你满了你年日的数目。"],[27,"凡你所到的地方，我要使那里的众民，在你面前惊骇、扰乱，又要使你一切仇敌转背逃跑。"],[28,"我要打发黄蜂飞在你前面，把希未人、迦南人、赫人撵出去。"],[29,"我不在一年之内将他们从你面前撵出去，恐怕地成为荒凉，野地的兽多起来害你。"],[30,"我要渐渐地将他们从你面前撵出去，等到你的人数加多，承受那地为业。"],[31,"我要定你的境界，从红海直到非利士海，又从旷野直到大河。我要将那地的居民交在你手中，你要将他们从你面前撵出去。"],[32,"不可和他们并他们的神立约。"],[33,"他们不可住在你的地上，恐怕他们使你得罪我。你若侍奉他们的神，这必成为你的网罗。”"]]},{"n":24,"v":[[1,"耶和华对摩西说：“你和亚伦、拿答、亚比户，并以色列长老中的七十人，都要上到我这里来，远远地下拜。"],[2,"惟独你可以亲近耶和华，他们却不可亲近；百姓也不可和你一同上来。”"],[3,"摩西下山，将耶和华的命令、典章都述说与百姓听。众百姓齐声说：“耶和华所吩咐的，我们都必遵行。”"],[4,"摩西将耶和华的命令都写上。清早起来，在山下筑一座坛，按以色列十二支派，立十二根柱子。"],[5,"又打发以色列人中的少年人去献燔祭，又向耶和华献牛为平安祭。"],[6,"摩西将血一半盛在盆中，一半洒在坛上。"],[7,"又将约书念给百姓听，他们说：“耶和华所吩咐的，我们都必遵行。”"],[8,"摩西将血洒在百姓身上，说：“你看！这是立约的血，是耶和华按这一切话与你们立约的凭据。”"],[9,"摩西、亚伦、拿答、亚比户，并以色列长老中的七十人，都上了山。"],[10,"他们看见以色列的神，他脚下彷佛有平铺的蓝宝石，如同天色明净。"],[11,"他的手不加害在以色列的尊者身上，他们观看神，他们又吃又喝。"],[12,"耶和华对摩西说：“你上山到我这里来，住在这里，我要将石版并我所写的律法和诫命赐给你，使你可以教训百姓。”"],[13,"摩西和他的帮手约书亚起来，上了神的山。"],[14,"摩西对长老说：“你们在这里等着，等到我们再回来，有亚伦、户珥与你们同在。凡有争讼的，都可以就近他们去。”"],[15,"摩西上山，有云彩把山遮盖。"],[16,"耶和华的荣耀停于西奈山，云彩遮盖山六天，第七天他从云中召摩西。"],[17,"耶和华的荣耀在山顶上，在以色列人眼前，形状如烈火。"],[18,"摩西进入云中上山，在山上四十昼夜。"]]},{"n":25,"v":[[1,"耶和华晓谕摩西说："],[2,"“你告诉以色列人当为我送礼物来，凡甘心乐意的，你们就可以收下归我。"],[3,"所要收的礼物，就是：金、银、铜，"],[4,"蓝色、紫色、朱红色线，细麻，山羊毛，"],[5,"染红的公羊皮，海狗皮，皂荚木，"],[6,"点灯的油，并作膏油和香的香料，"],[7,"红玛瑙与别样的宝石，可以镶嵌在以弗得和胸牌上。"],[8,"又当为我造圣所，使我可以住在他们中间。"],[9,"制造帐幕和其中的一切器具，都要照我所指示你的样式。”"],[10,"“要用皂荚木作一柜，长二肘半，宽一肘半，高一肘半。"],[11,"要里外包上精金，四围镶上金牙边。"],[12,"也要铸四个金环，安在柜的四脚上，这边两环，那边两环。"],[13,"要用皂荚木作两根杠，用金包裹。"],[14,"要把杠穿在柜旁的环内，以便抬柜。"],[15,"这杠要常在柜的环内，不可抽出来。"],[16,"必将我所要赐给你的法版放在柜里。"],[17,"要用精金作施恩座（“施恩”或作“蔽罪”。下同），长二肘半，宽一肘半。"],[18,"要用金子锤出两个基路伯来，安在施恩座的两头。"],[19,"这头作一个基路伯，那头作一个基路伯。二基路伯要接连一块，在施恩座的两头。"],[20,"二基路伯要高张翅膀，遮掩施恩座。基路伯要脸对脸，朝着施恩座。"],[21,"要将施恩座安在柜的上边，又将我所要赐给你的法版放在柜里。"],[22,"我要在那里与你相会，又要从法柜施恩座上二基路伯中间，和你说我所要吩咐你传给以色列人的一切事。”"],[23,"“要用皂荚木作一张桌子，长二肘，宽一肘，高一肘半。"],[24,"要包上精金，四围镶上金牙边。"],[25,"桌子的四围各作一掌宽的横梁，横梁上镶着金牙边。"],[26,"要作四个金环，安在桌子的四角上，就是桌子四脚上的四角。"],[27,"安环子的地方要挨近横梁，可以穿杠抬桌子。"],[28,"要用皂荚木作两根杠，用金包裹，以便抬桌子。"],[29,"要作桌子上的盘子、调羹，并奠酒的爵和瓶，这都要用精金制作。"],[30,"又要在桌子上，在我面前，常摆陈设饼。”"],[31,"“要用精金作一个灯台。灯台的座和干与杯、球、花都要接连一块锤出来。"],[32,"灯台两旁要杈出六个枝子，这旁三个，那旁三个。"],[33,"这旁每枝上有三个杯，形状像杏花，有球、有花；那旁每枝上也有三个杯，形状像杏花，有球、有花。从灯台杈出来的六个枝子都是如此。"],[34,"灯台上有四个杯，形状像杏花，有球、有花。"],[35,"灯台每两个枝子以下，有球与枝子接连一块，灯台出的六个枝子都是如此。"],[36,"球和枝子要接连一块，都是一块精金锤出来的。"],[37,"要作灯台的七个灯盏，祭司要点这灯，使灯光对照。"],[38,"灯台的蜡剪和蜡花盘也是要精金的。"],[39,"作灯台和这一切的器具，要用精金一他连得。"],[40,"要谨慎作这些物件，都要照着在山上指示你的样式。”"]]},{"n":26,"v":[[1,"“你要用十幅幔子作帐幕。这些幔子要用捻的细麻和蓝色、紫色、朱红色线制造，并用巧匠的手工绣上基路伯。"],[2,"每幅幔子要长二十八肘，宽四肘，幔子都要一样的尺寸。"],[3,"这五幅幔子要幅幅相连，那五幅幔子也要幅幅相连。"],[4,"在这相连的幔子末幅边上要作蓝色的钮扣，在那相连的幔子末幅边上也要照样作。"],[5,"要在这相连的幔子上作五十个钮扣，在那相连的幔子上也作五十个钮扣，都要两两相对。"],[6,"又要作五十个金钩，用钩使幔子相连，这才成了一个帐幕。”"],[7,"“你要用山羊毛织十一幅幔子，作为帐幕以上的罩棚。"],[8,"每幅幔子要长三十肘，宽四肘，十一幅幔子都要一样的尺寸。"],[9,"要把五幅幔子连成一幅，又把六幅幔子连成一幅。这第六幅幔子要在罩棚的前面折上去。"],[10,"在这相连的幔子末幅边上要作五十个钮扣，在那相连的幔子末幅边上也作五十个钮扣。"],[11,"又要作五十个铜钩，钩在钮扣中，使罩棚连成一个。"],[12,"罩棚的幔子所余那垂下来的半幅幔子，要垂在帐幕的后头。"],[13,"罩棚的幔子所余长的，这边一肘，那边一肘，要垂在帐幕的两旁，遮盖帐幕。"],[14,"又要用染红的公羊皮作罩棚的盖，再用海狗皮作一层罩棚上的顶盖。”"],[15,"“你要用皂荚木作帐幕的竖板。"],[16,"每块要长十肘，宽一肘半。"],[17,"每块必有两榫相对，帐幕一切的板都要这样作。"],[18,"帐幕的南面要作板二十块。"],[19,"在这二十块板底下要作四十个带卯的银座，两卯接这块板上的两榫，两卯接那块板上的两榫。"],[20,"帐幕第二面，就是北面，也要作板二十块，"],[21,"和带卯的银座四十个。这板底下有两卯，那板底下也有两卯。"],[22,"帐幕的后面，就是西面，要作板六块。"],[23,"帐幕后面的拐角要作板两块。"],[24,"板的下半截要双的，上半截要整的，直顶到第一个环子，两块都要这样作两个拐角。"],[25,"必有八块板和十六个带卯的银座，这板底下有两卯，那板底下也有两卯。”"],[26,"“你要用皂荚木作闩。为帐幕这面的板作五闩，"],[27,"为帐幕那面的板作五闩，又为帐幕后面的板作五闩。"],[28,"板腰间的中闩要从这一头通到那一头。"],[29,"板要用金子包裹，又要作板上的金环套闩，闩也要用金子包裹。"],[30,"要照着在山上指示你的样式立起帐幕。”"],[31,"“你要用蓝色、紫色、朱红色线和捻的细麻织幔子，以巧匠的手工绣上基路伯。"],[32,"要把幔子挂在四根包金的皂荚木柱子上，柱子上当有金钩，柱子安在四个带卯的银座上。"],[33,"要使幔子垂在钩子下，把法柜抬进幔子内，这幔子要将圣所和至圣所隔开。"],[34,"又要把施恩座安在至圣所内的法柜上。"],[35,"把桌子安在幔子外帐幕的北面，把灯台安在帐幕的南面，彼此相对。”"],[36,"“你要拿蓝色、紫色、朱红色线和捻的细麻，用绣花的手工织帐幕的门帘。"],[37,"要用皂荚木为帘子作五根柱子，用金子包裹，柱子上当有金钩，又要为柱子用铜铸造五个带卯的座。”"]]},{"n":27,"v":[[1,"“你要用皂荚木作坛，这坛要四方的，长五肘，宽五肘，高三肘。"],[2,"要在坛的四拐角上作四个角，与坛接连一块，用铜把坛包裹。"],[3,"要作盆，收去坛上的灰，又作铲子、盘子、肉叉子、火鼎；坛上一切的器具都用铜作。"],[4,"要为坛作一个铜网，在网的四角上作四个铜环。"],[5,"把网安在坛四面的围腰板以下，使网从下达到坛的半腰。"],[6,"又要用皂荚木为坛作杠，用铜包裹。"],[7,"这杠要穿在坛两旁的环子内，用以抬坛。"],[8,"要用板作坛，坛是空的，都照着在山上指示你的样式作。”"],[9,"“你要作帐幕的院子，院子的南面要用捻的细麻作帷子，长一百肘。"],[10,"帷子的柱子要二十根，带卯的铜座二十个，柱子上的钩子和杆子都要用银子作。"],[11,"北面也当有帷子，长一百肘，帷子的柱子二十根，带卯的铜座二十个，柱子上的钩子和杆子都要用银子作。"],[12,"院子的西面当有帷子，宽五十肘。帷子的柱子十根，带卯的座十个。"],[13,"院子的东面要宽五十肘。"],[14,"门这边的帷子要十五肘，帷子的柱子三根，带卯的座三个；"],[15,"门那边的帷子也要十五肘，帷子的柱子三根，带卯的座三个。"],[16,"院子的门当有帘子，长二十肘，要拿蓝色、紫色、朱红色线和捻的细麻，用绣花的手工织成，柱子四根，带卯的座四个。"],[17,"院子四围一切的柱子都要用银杆连络，柱子上的钩子要用银作，带卯的座要用铜作。"],[18,"院子要长一百肘，宽五十肘，高五肘，帷子要用捻的细麻作，带卯的座要用铜作。"],[19,"帐幕各样用处的器具，并帐幕一切的橛子，和院子里一切的橛子都要用铜作。”"],[20,"“你要吩咐以色列人，把那为点灯捣成的清橄榄油拿来给你，使灯常常点着。"],[21,"在会幕中法柜前的幔外，亚伦和他的儿子，从晚上到早晨，要在耶和华面前经理这灯，这要作以色列人世世代代永远的定例。”"]]},{"n":28,"v":[[1,"“你要从以色列人中，使你的哥哥亚伦和他的儿子拿答、亚比户、以利亚撒、以他玛一同就近你，给我供祭司的职分。"],[2,"你要给你哥哥亚伦作圣衣为荣耀，为华美。"],[3,"又要吩咐一切心中有智慧的，就是我用智慧的灵所充满的，给亚伦作衣服，使他分别为圣，可以给我供祭司的职分。"],[4,"所要作的就是胸牌、以弗得、外袍、杂色的内袍、冠冕、腰带，使你哥哥亚伦和他儿子穿这圣服，可以给我供祭司的职分。"],[5,"要用金线和蓝色、紫色、朱红色线，并细麻去作。”"],[6,"“他们要拿金线和蓝色、紫色、朱红色线，并捻的细麻，用巧匠的手工作以弗得。"],[7,"以弗得当有两条肩带，接上两头，使它相连。"],[8,"其上巧工织的带子，要和以弗得一样的做法，用以束上，与以弗得接连一块；要用金线和蓝色、紫色、朱红色线，并捻的细麻作成。"],[9,"要取两块红玛瑙，在上面刻以色列儿子的名字，"],[10,"六个名字在这块宝石上，六个名字在那块宝石上，都照他们生来的次序。"],[11,"要用刻宝石的手工，彷佛刻图书，按着以色列儿子的名字，刻这两块宝石，要镶在金槽上。"],[12,"要将这两块宝石安在以弗得的两条肩带上，为以色列人作纪念石。亚伦要在两肩上担他们的名字，在耶和华面前作为记念。"],[13,"要用金子作二槽。"],[14,"又拿精金，用拧工彷佛拧绳子，作两条链子，把这拧成的链子搭在二槽上。”"],[15,"“你要用巧匠的手工，作一个决断的胸牌。要和以弗得一样的做法，用金线和蓝色、紫色、朱红色线，并捻的细麻作成。"],[16,"这胸牌要四方的、迭为两层，长一虎口，宽一虎口。"],[17,"要在上面镶宝石四行。第一行是红宝石、红璧玺、红玉；"],[18,"第二行是绿宝石、蓝宝石、金钢石；"],[19,"第三行是紫玛瑙、白玛瑙、紫晶；"],[20,"第四行是水苍玉、红玛瑙、碧玉；这都要镶在金槽中。"],[21,"这些宝石都要按着以色列十二个儿子的名字，彷佛刻图书，刻十二个支派的名字。"],[22,"要在胸牌上，用精金拧成如绳的链子。"],[23,"在胸牌上也要作两个金环，安在胸牌的两头。"],[24,"要把那两条拧成的金链子，穿过胸牌两头的环子。"],[25,"又要把链子的那两头接在两槽上，安在以弗得前面肩带上。"],[26,"要作两个金环，安在胸牌的两头，在以弗得里面的边上。"],[27,"又要作两个金环，安在以弗得前面两条肩带的下边，挨近相接之处，在以弗得巧工织的带子以上。"],[28,"要用蓝细带子把胸牌的环子与以弗得的环子系住，使胸牌贴在以弗得巧工织的带子上，不可与以弗得离缝。"],[29,"亚伦进圣所的时候，要将决断胸牌，就是刻着以色列儿子名字的，带在胸前，在耶和华面前常作记念。"],[30,"又要将乌陵和土明放在决断的胸牌里。亚伦进到耶和华面前的时候，要带在胸前，在耶和华面前常将以色列人的决断牌带在胸前。”"],[31,"“你要作以弗得的外袍，颜色全是蓝的。"],[32,"袍上要为头留一领口，口的周围织出领边来，彷佛铠甲的领口，免得破裂。"],[33,"袍子周围底边上，要用蓝色、紫色、朱红色线作石榴，在袍子周围的石榴中间要有金铃铛。"],[34,"一个金铃铛一个石榴，一个金铃铛一个石榴，在袍子周围的底边上。"],[35,"亚伦供职的时候要穿这袍子。他进圣所到耶和华面前，以及出来的时候，袍上的响声必被听见，使他不至于死亡。”"],[36,"“你要用精金作一面牌，在上面按刻图书之法，刻着：“归耶和华为圣”。"],[37,"要用一条蓝细带子将牌系在冠冕的前面。"],[38,"这牌必在亚伦的额上，亚伦要担当干犯圣物条例的罪孽。这圣物是以色列人在一切的圣礼物上所分别为圣的。这牌要常在他的额上，使他们可以在耶和华面前蒙悦纳。"],[39,"要用杂色细麻线织内袍，用细麻布作冠冕，又用绣花的手工作腰带。”"],[40,"“你要为亚伦的儿子作内袍、腰带、裹头巾，为荣耀，为华美。"],[41,"要把这些给你的哥哥亚伦和他的儿子穿戴，又要膏他们，将他们分别为圣，好给我供祭司的职分。"],[42,"要给他们作细麻布裤子，遮掩下体，裤子当从腰达到大腿。"],[43,"亚伦和他儿子进入会幕，或就近坛，在圣所供职的时候必穿上，免得担罪而死。这要为亚伦和他的后裔作永远的定例。”"]]},{"n":29,"v":[[1,"“你使亚伦和他儿子成圣，给我供祭司的职分，要如此行：取一只公牛犊，两只无残疾的公绵羊，"],[2,"无酵饼和调油的无酵饼，与抹油的无酵薄饼，这都要用细麦面作成。"],[3,"这饼要装在一个筐子里，连筐子带来，又把公牛和两只公绵羊牵来。"],[4,"要使亚伦和他儿子到会幕门口来，用水洗身。"],[5,"要给亚伦穿上内袍和以弗得的外袍，并以弗得，又带上胸牌，束上以弗得巧工织的带子，"],[6,"把冠冕戴在他头上，将圣冠加在冠冕上。"],[7,"就把膏油倒在他头上膏他。"],[8,"要叫他的儿子来，给他们穿上内袍。"],[9,"给亚伦和他儿子束上腰带，包上裹头巾，他们就凭永远的定例得了祭司的职任；又要将亚伦和他儿子分别为圣。”"],[10,"“你要把公牛牵到会幕前，亚伦和他儿子要按手在公牛的头上。"],[11,"你要在耶和华面前，在会幕门口，宰这公牛。"],[12,"要取些公牛的血，用指头抹在坛的四角上，把血都倒在坛脚那里。"],[13,"要把一切盖脏的脂油与肝上的网子，并两个腰子和腰子上的脂油，都烧在坛上。"],[14,"只是公牛的皮、肉、粪都要用火烧在营外；这牛是赎罪祭。”"],[15,"“你要牵一只公绵羊来，亚伦和他儿子要按手在这羊的头上。"],[16,"要宰这羊，把血洒在坛的周围。"],[17,"要把羊切成块子，洗净五脏和腿，连块子带头，都放在一处。"],[18,"要把全羊烧在坛上，是给耶和华献的燔祭，是献给耶和华为馨香的火祭。”"],[19,"“你要将那一只公绵羊牵来，亚伦和他儿子要按手在羊的头上。"],[20,"你要宰这羊，取点血抹在亚伦的右耳垂上和他儿子的右耳垂上，又抹在他们右手的大拇指上和右脚的大拇指上，并要把血洒在坛的四围。"],[21,"你要取点膏油和坛上的血，弹在亚伦和他的衣服上，并他儿子和他儿子的衣服上，他们和他们的衣服就一同成圣。”"],[22,"“你要取这羊的脂油和肥尾巴，并盖脏的脂油与肝上的网子，两个腰子和腰子上的脂油并右腿（这是承接圣职所献的羊）。"],[23,"再从耶和华面前装无酵饼的筐子中取一个饼、一个调油的饼和一个薄饼，"],[24,"都放在亚伦的手上和他儿子的手上，作为摇祭，在耶和华面前摇一摇。"],[25,"要从他们手中接过来，烧在耶和华面前坛上的燔祭上，是献给耶和华为馨香的火祭。”"],[26,"“你要取亚伦承接圣职所献公羊的胸，作为摇祭，在耶和华面前摇一摇，这就可以作你的份。"],[27,"那摇祭的胸和举祭的腿，就是承接圣职所摇的、所举的，是归亚伦和他儿子的。这些你都要成为圣，"],[28,"作亚伦和他子孙从以色列人中永远所得的份，因为是举祭。这要从以色列人的平安祭中，作为献给耶和华的举祭。”"],[29,"“亚伦的圣衣要留给他的子孙，可以穿着受膏，又穿着承接圣职。"],[30,"他的子孙接续他当祭司的，每逢进会幕在圣所供职的时候，要穿七天。”"],[31,"你要将承接圣职所献公羊的肉煮在圣处。"],[32,"亚伦和他儿子要在会幕门口吃这羊的肉和筐内的饼。"],[33,"他们吃那些赎罪之物，好承接圣职，使他们成圣；只是外人不可吃，因为这是圣物。"],[34,"那承接圣职所献的肉或饼，若有一点留到早晨，就要用火烧了，不可吃这物，因为是圣物。”"],[35,"“你要这样照我一切所吩咐的，向亚伦和他儿子行承接圣职的礼七天。"],[36,"每天要献公牛一只为赎罪祭。你洁净坛的时候，坛就洁净了，且要用膏抹坛，使坛成圣。"],[37,"要洁净坛七天，使坛成圣；坛就成为至圣；凡挨着坛的都成为圣。”"],[38,"“你每天所要献在坛上的，就是两只一岁的羊羔，"],[39,"早晨要献这一只，黄昏的时候要献那一只。"],[40,"和这一只羊羔同献的，要用细面伊法十分之一与捣成的油一欣四分之一调和，又用酒一欣四分之一作为奠祭。"],[41,"那一只羊羔要在黄昏的时候献上，照着早晨的素祭和奠祭的礼办理，作为献给耶和华馨香的火祭。"],[42,"这要在耶和华面前、会幕门口，作你们世世代代常献的燔祭。我要在那里与你们相会，和你们说话。"],[43,"我要在那里与以色列人相会，会幕就要因我的荣耀成为圣。"],[44,"我要使会幕和坛成圣，也要使亚伦和他的儿子成圣，给我供祭司的职分。"],[45,"我要住在以色列人中间，作他们的神。"],[46,"他们必知道我是耶和华他们的神，是将他们从埃及地领出来的，为要住在他们中间。我是耶和华他们的神。”"]]},{"n":30,"v":[[1,"“你要用皂荚木作一座烧香的坛。"],[2,"这坛要四方的，长一肘，宽一肘，高二肘。坛的四角要与坛接连一块。"],[3,"要用精金把坛的上面，与坛的四围，并坛的四角包裹，又要在坛的四围镶上金牙边。"],[4,"要作两个金环安在牙子边以下，在坛的两旁，两根横撑上，作为穿杠的用处，以便抬坛。"],[5,"要用皂荚木作杠，用金包裹。"],[6,"要把坛放在法柜前的幔子外，对着法柜上的施恩座，就是我要与你相会的地方。"],[7,"亚伦在坛上要烧馨香料作的香；每早晨他收拾灯的时候，要烧这香。"],[8,"黄昏点灯的时候，他要在耶和华面前烧这香，作为世世代代常烧的香。"],[9,"在这坛上不可奉上异样的香，不可献燔祭、素祭，也不可浇上奠祭。"],[10,"亚伦一年一次要在坛的角上行赎罪之礼，他一年一次要用赎罪祭牲的血，在坛上行赎罪之礼，作为世世代代的定例。这坛在耶和华面前为至圣。”"],[11,"耶和华晓谕摩西说："],[12,"“你要按以色列人被数的计算总数。你数的时候，他们各人要为自己的生命把赎价奉给耶和华，免得数的时候在他们中间有灾殃。"],[13,"凡过去归那些被数之人的，每人要按圣所的平，拿银子半舍客勒，这半舍客勒是奉给耶和华的礼物。一舍客勒是二十季拉。"],[14,"凡过去归那些被数的人，从二十岁以外的，要将这礼物奉给耶和华。"],[15,"他们为赎生命将礼物奉给耶和华，富足的不可多出，贫穷的也不可少出，各人要出半舍客勒。"],[16,"你要从以色列人收这赎罪银，作为会幕的使用，可以在耶和华面前为以色列人作记念，赎生命。”"],[17,"耶和华晓谕摩西说："],[18,"“你要用铜作洗濯盆和盆座，以便洗濯。要将盆放在会幕和坛的中间，在盆里盛水。"],[19,"亚伦和他的儿子要在这盆里洗手洗脚。"],[20,"他们进会幕，或是就近坛前供职，给耶和华献火祭的时候，必用水洗濯，免得死亡。"],[21,"他们洗手洗脚，就免得死亡。这要作亚伦和他后裔世世代代永远的定例。”"],[22,"耶和华晓谕摩西说："],[23,"“你要取上品的香料，就是流质的没药五百舍客勒，香肉桂一半，就是二百五十舍客勒，菖蒲二百五十舍客勒，"],[24,"桂皮五百舍客勒，都按着圣所的平，又取橄榄油一欣，"],[25,"按作香之法，调和作成圣膏油。"],[26,"要用这膏油抹会幕和法柜，"],[27,"桌子与桌子的一切器具，灯台和灯台的器具并香坛，"],[28,"燔祭坛和坛的一切器具，洗濯盆和盆座。"],[29,"要使这些物成为圣，好成为至圣，凡挨着的都成为圣。"],[30,"要膏亚伦和他的儿子，使他们成为圣，可以给我供祭司的职分。"],[31,"你要对以色列人说：‘这油我要世世代代以为圣膏油，"],[32,"不可倒在别人的身上，也不可按这调和之法作与此相似的。这膏油是圣的，你们也要以为圣。"],[33,"凡调和与此相似的，或将这膏膏在别人身上的，这人要从民中剪除。’”"],[34,"耶和华吩咐摩西说：“你要取馨香的香料，就是拿他弗、施喜列、喜利比拿。这馨香的香料和净乳香，各样要一般大的分量。"],[35,"你要用这些加上盐，按作香之法，作成清净圣洁的香。"],[36,"这香要取点捣得极细，放在会幕内法柜前，我要在那里与你相会。你们要以这香为至圣。"],[37,"你们不可按这调和之法为自己作香，要以这香为圣，归耶和华。"],[38,"凡作香和这香一样，为要闻香味的，这人要从民中剪除。”"]]},{"n":31,"v":[[1,"耶和华晓谕摩西说："],[2,"“看哪，犹大支派中户珥的孙子、乌利的儿子比撒列，我已经提他的名召他。"],[3,"我也以我的灵充满了他，使他有智慧，有聪明，有知识，能作各样的工，"],[4,"能想出巧工，用金、银、铜制造各物，"],[5,"又能刻宝石，可以镶嵌，能雕刻木头，能作各样的工。"],[6,"我分派但支派中亚希撒抹的儿子亚何利亚伯与他同工。凡心里有智慧的，我更使他们有智慧，能作我一切所吩咐的，"],[7,"就是会幕和法柜，并其上的施恩座，与会幕中一切的器具；"],[8,"桌子和桌子的器具，精金的灯台和灯台的一切器具并香坛；"],[9,"燔祭坛和坛的一切器具，并洗濯盆与盆座；"],[10,"精工作的礼服，和祭司亚伦并他儿子用以供祭司职分的圣衣；"],[11,"膏油和为圣所用馨香的香料。他们都要照我一切所吩咐的去作。”"],[12,"耶和华晓谕摩西说："],[13,"“你要吩咐以色列人说：‘你们务要守我的安息日，因为这是你我之间世世代代的证据，使你们知道我耶和华是叫你们成为圣的。"],[14,"所以你们要守安息日，以为圣日。凡干犯这日的，必要把他治死；凡在这日作工的，必从民中剪除。"],[15,"六日要作工，但第七日是安息圣日，是向耶和华守为圣的；凡在安息日作工的，必要把他治死。’"],[16,"故此，以色列人要世世代代守安息日为永远的约。"],[17,"这是我和以色列人永远的证据，因为六日之内耶和华造天地，第七日便安息舒畅。”"],[18,"耶和华在西奈山和摩西说完了话，就把两块法版交给他，是神用指头写的石版。"]]},{"n":32,"v":[[1,"百姓见摩西迟延不下山，就大家聚集到亚伦那里，对他说：“起来，为我们作神像，可以在我们前面引路，因为领我们出埃及地的那个摩西，我们不知道他遭了什么事。”"],[2,"亚伦对他们说：“你们去摘下你们妻子、儿女耳上的金环，拿来给我。”"],[3,"百姓就都摘下他们耳上的金环，拿来给亚伦。"],[4,"亚伦从他们手里接过来，铸了一只牛犊，用雕刻的器具作成。他们就说：“以色列啊，这是领你出埃及地的神！”"],[5,"亚伦看见，就在牛犊面前筑坛，且宣告说：“明日要向耶和华守节。”"],[6,"次日清早，百姓起来献燔祭和平安祭，就坐下吃喝，起来玩耍。"],[7,"耶和华吩咐摩西说：“下去吧，因为你的百姓，就是你从埃及地领出来的，已经败坏了。"],[8,"他们快快偏离了我所吩咐的道，为自己铸了一只牛犊，向它下拜献祭说：‘以色列啊，这就是领你出埃及地的神。’”"],[9,"耶和华对摩西说：“我看这百姓真是硬着颈项的百姓。"],[10,"你且由着我，我要向他们发烈怒，将他们灭绝，使你的后裔成为大国。”"],[11,"摩西便恳求耶和华他的神说：“耶和华啊，你为什么向你的百姓发烈怒呢？这百姓是你用大力和大能的手从埃及地领出来的。"],[12,"为什么使埃及人议论说：‘他领他们出去，是要降祸与他们，把他们杀在山中，将他们从地上除灭。’求你转意，不发你的烈怒；后悔，不降祸与你的百姓。"],[13,"求你记念你的仆人亚伯拉罕、以撒、以色列，你曾指着自己起誓说：‘我必使你们的后裔像天上的星那样多，并且我所应许的这全地，必给你们的后裔，他们要永远承受为业。’”"],[14,"于是耶和华后悔，不把所说的祸降与他的百姓。"],[15,"摩西转身下山，手里拿着两块法版，这版是两面写的，这面那面都有字。"],[16,"是神的工作，字是神写的，刻在版上。"],[17,"约书亚一听见百姓呼喊的声音，就对摩西说：“在营里有争战的声音。”"],[18,"摩西说：“这不是人打胜仗的声音，也不是人打败仗的声音，我所听见的，乃是人歌唱的声音。”"],[19,"摩西挨近营前，就看见牛犊，又看见人跳舞，便发烈怒，把两块版扔在山下摔碎了，"],[20,"又将他们所铸的牛犊用火焚烧，磨得粉碎，撒在水面上，叫以色列人喝。"],[21,"摩西对亚伦说：“这百姓向你作了什么？你竟使他们陷在大罪里！”"],[22,"亚伦说：“求我主不要发烈怒，这百姓专于作恶，是你知道的。"],[23,"他们对我说：‘你为我们作神像，可以在我们前面引路，因为领我们出埃及地的那个摩西，我们不知道他遭了什么事。’"],[24,"我对他们说：‘凡有金环的可以摘下来’，他们就给了我，我把金环扔在火中，这牛犊便出来了。”"],[25,"摩西见百姓放肆（亚伦纵容他们，使他们在仇敌中间被讥刺），"],[26,"就站在营门中说：“凡属耶和华的，都要到我这里来！”于是利未的子孙都到他那里聚集。"],[27,"他对他们说：“耶和华以色列的神这样说：‘你们各人把刀跨在腰间，在营中往来，从这门到那门，各人杀他的弟兄与同伴并邻舍。’”"],[28,"利未的子孙照摩西的话行了。那一天，百姓中被杀的约有三千。"],[29,"摩西说：“今天你们要自洁，归耶和华为圣，各人攻击他的儿子和弟兄，使耶和华赐福与你们。”"],[30,"到了第二天，摩西对百姓说：“你们犯了大罪，我如今要上耶和华那里去，或者可以为你们赎罪。”"],[31,"摩西回到耶和华那里说：“唉！这百姓犯了大罪，为自己作了金像。"],[32,"倘或你肯赦免他们的罪，……不然，求你从你所写的册上涂抹我的名。”"],[33,"耶和华对摩西说：“谁得罪我，我就从我的册上涂抹谁的名。"],[34,"现在你去领这百姓，往我所告诉你的地方去，我的使者必在你前面引路，只是到我追讨的日子，我必追讨他们的罪。”"],[35,"耶和华杀百姓的缘故是因他们同亚伦作了牛犊。"]]},{"n":33,"v":[[1,"耶和华吩咐摩西说：“我曾起誓应许亚伯拉罕、以撒、雅各说：‘要将迦南地赐给你的后裔。’现在你和你从埃及地所领出来的百姓，要从这里往那地去。"],[2,"我要差遣使者在你前面，撵出迦南人、亚摩利人、赫人、比利洗人、希未人、耶布斯人，"],[3,"领你到那流奶与蜜之地。我自己不同你们上去，因为你们是硬着颈项的百姓，恐怕我在路上把你们灭绝。”"],[4,"百姓听见这凶信就悲哀，也没有人佩戴妆饰。"],[5,"耶和华对摩西说：“你告诉以色列人说：‘耶和华说：你们是硬着颈项的百姓，我若一霎时临到你们中间，必灭绝你们。现在你们要把身上的妆饰摘下来，使我可以知道怎样待你们。’”"],[6,"以色列人从住何烈山以后，就把身上的妆饰摘得干净。"],[7,"摩西素常将帐棚支搭在营外，离营却远，他称这帐棚为会幕，凡求问耶和华的，就到营外的会幕那里去。"],[8,"当摩西出营到会幕去的时候，百姓就都起来，各人站在自己帐棚的门口，望着摩西，直等到他进了会幕。"],[9,"摩西进会幕的时候，云柱降下来，立在会幕的门前，耶和华便与摩西说话。"],[10,"众百姓看见云柱立在会幕门前，就都起来，各人在自己帐棚的门口下拜。"],[11,"耶和华与摩西面对面说话，好像人与朋友说话一般。摩西转到营里去，惟有他的帮手一个少年人嫩的儿子约书亚，不离开会幕。"],[12,"摩西对耶和华说：“你吩咐我说：‘将这百姓领上去’，却没有叫我知道你要打发谁与我同去。只说：‘我按你的名认识你，你在我眼前也蒙了恩。’"],[13,"我如今若在你眼前蒙恩，求你将你的道指示我，使我可以认识你，好在你眼前蒙恩。求你想到这民是你的民。”"],[14,"耶和华说：“我必亲自和你同去，使你得安息。”"],[15,"摩西说：“你若不亲自和我同去，就不要把我们从这里领上去。"],[16,"人在何事上得以知道我和你的百姓在你眼前蒙恩呢？岂不是因你与我们同去，使我和你的百姓与地上的万民有分别吗？”"],[17,"耶和华对摩西说：“你这所求的我也要行，因为你在我眼前蒙了恩，并且我按你的名认识你。”"],[18,"摩西说：“求你显出你的荣耀给我看。”"],[19,"耶和华说：“我要显我一切的恩慈，在你面前经过，宣告我的名。我要恩待谁，就恩待谁；要怜悯谁，就怜悯谁。”"],[20,"又说：“你不能看见我的面，因为人见我的面不能存活。”"],[21,"耶和华说：“看哪，在我这里有地方，你要站在磐石上，"],[22,"我的荣耀经过的时候，我必将你放在磐石穴中，用我的手遮掩你，等我过去，"],[23,"然后我要将我的手收回，你就得见我的背，却不得见我的面。”"]]},{"n":34,"v":[[1,"耶和华吩咐摩西说：“你要凿出两块石版，和先前你摔碎的那版一样，其上的字我要写在这版上。"],[2,"明日早晨，你要预备好了，上西奈山，在山顶上站在我面前。"],[3,"谁也不可和你一同上去，遍山都不可有人，在山根也不可叫羊群牛群吃草。”"],[4,"摩西就凿出两块石版，和先前的一样。清晨起来，照耶和华所吩咐的上西奈山去，手里拿着两块石版。"],[5,"耶和华在云中降临，和摩西一同站在那里，宣告耶和华的名。"],[6,"耶和华在他面前宣告说：“耶和华，耶和华，是有怜悯、有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实。"],[7,"为千万人存留慈爱，赦免罪孽、过犯和罪恶，万不以有罪的为无罪，必追讨他的罪，自父及子，直到三四代。”"],[8,"摩西急忙伏地下拜，"],[9,"说：“主啊，我若在你眼前蒙恩，求你在我们中间同行，因为这是硬着颈项的百姓，又求你赦免我们的罪孽和罪恶，以我们为你的产业。”"],[10,"耶和华说：“我要立约，要在百姓面前行奇妙的事，是在遍地万国中所未曾行的，在你四围的外邦人，就要看见耶和华的作为，因我向你所行的是可畏惧的事。”"],[11,"“我今天所吩咐你的，你要谨守，我要从你面前撵出亚摩利人、迦南人、赫人、比利洗人、希未人、耶布斯人。"],[12,"你要谨慎，不可与你所去那地的居民立约，恐怕成为你们中间的网罗；"],[13,"却要拆毁他们的祭坛，打碎他们的柱像，砍下他们的木偶。"],[14,"不可敬拜别神，因为耶和华是忌邪的神，名为忌邪者。"],[15,"只怕你与那地的居民立约，百姓随从他们的神，就行邪淫，祭祀他们的神，有人叫你，你便吃他的祭物。"],[16,"又为你的儿子娶他们的女儿为妻，他们的女儿随从他们的神，就行邪淫，使你的儿子也随从他们的神行邪淫。”"],[17,"“不可为自己铸造神像。”"],[18,"“你要守除酵节，照我所吩咐你的，在亚笔月内所定的日期吃无酵饼七天，因为你是这亚笔月内出了埃及。"],[19,"凡头生的都是我的；一切牲畜头生的，无论是牛是羊，公的都是我的。"],[20,"头生的驴要用羊羔代赎，若不代赎，就要打折它的颈项。凡头生的儿子都要赎出来。谁也不可空手朝见我。”"],[21,"你六日要作工，第七日要安息；虽在耕种收割的时候，也要安息。"],[22,"在收割初熟麦子的时候，要守七七节。又在年底，要守收藏节。"],[23,"你们一切男丁，要一年三次朝见主耶和华以色列的神。"],[24,"我要从你面前赶出外邦人，扩张你的境界。你一年三次上去朝见耶和华你神的时候，必没有人贪慕你的地土。”"],[25,"“你不可将我祭物的血和有酵的饼一同献上。逾越节的祭物也不可留到早晨。"],[26,"地里首先初熟之物，要送到耶和华你神的殿。不可用山羊羔母的奶煮山羊羔。”"],[27,"耶和华吩咐摩西说：“你要将这些话写上，因为我是按这话与你和以色列人立约。”"],[28,"摩西在耶和华那里四十昼夜，也不吃饭，也不喝水。耶和华将这约的话，就是十条诫，写在两块版上。"],[29,"摩西手里拿着两块法版下西奈山的时候，不知道自己的面皮因耶和华和他说话就发了光。"],[30,"亚伦和以色列众人看见摩西的面皮发光，就怕挨近他。"],[31,"摩西叫他们来，于是亚伦和会众的官长都到他那里去，摩西就与他们说话。"],[32,"随后，以色列众人都近前来，他就把耶和华在西奈山与他所说的一切话都吩咐他们。"],[33,"摩西与他们说完了话，就用帕子蒙上脸。"],[34,"但摩西进到耶和华面前与他说话，就揭去帕子；及至出来的时候，便将耶和华所吩咐的告诉以色列人。"],[35,"以色列人看见摩西的面皮发光，摩西又用帕子蒙上脸，等到他进去与耶和华说话，就揭去帕子。"]]},{"n":35,"v":[[1,"摩西招聚以色列全会众，对他们说：“这是耶和华所吩咐的话，叫你们照着行。"],[2,"六日要作工，第七日乃为圣日，当向耶和华守为安息圣日；凡这日之内作工的，必把他治死。"],[3,"当安息日，不可在你们一切的住处生火。”"],[4,"摩西对以色列全会众说：“耶和华所吩咐的是这样："],[5,"你们中间要拿礼物献给耶和华。凡乐意献的，可以拿耶和华的礼物来，就是金、银、铜，"],[6,"蓝色、紫色、朱红色线，细麻，山羊毛，"],[7,"染红的公羊皮、海狗皮，皂荚木，"],[8,"点灯的油，并作膏油和香的香料，"],[9,"红玛瑙与别样的宝石，可以镶嵌在以弗得和胸牌上。”"],[10,"“你们中间凡心里有智慧的，都要来作耶和华一切所吩咐的："],[11,"就是帐幕和帐幕的罩棚，并帐幕的盖、钩子、板、闩、柱子、带卯的座；"],[12,"柜和柜的杠，施恩座和遮掩柜的幔子；"],[13,"桌子和桌子的杠与桌子的一切器具，并陈设饼；"],[14,"灯台和灯台的器具，灯盏并点灯的油；"],[15,"香坛和坛的杠，膏油和馨香的香料，并帐幕门口的帘子；"],[16,"燔祭坛和坛的铜网、坛的杠，并坛的一切器具，洗濯盆和盆座；"],[17,"院子的帷子和帷子的柱子，带卯的座和院子的门帘；"],[18,"帐幕的橛子，并院子的橛子，和这两处的绳子；"],[19,"精工作的礼服，和祭司亚伦并他儿子在圣所用以供祭司职分的圣衣。”"],[20,"以色列全会众从摩西面前退去。"],[21,"凡心里受感和甘心乐意的都拿耶和华的礼物来，用以作会幕和其中一切的使用，又用以作圣衣。"],[22,"凡心里乐意献礼物的，连男带女，各将金器，就是胸前针、耳环（或作“鼻环”）、打印的戒指和手钏，带来献给耶和华。"],[23,"凡有蓝色、紫色、朱红色线，细麻，山羊毛，染红的公羊皮、海狗皮的，都拿了来。"],[24,"凡献银子和铜给耶和华为礼物的都拿了来。凡有皂荚木可作什么使用的也拿了来。"],[25,"凡心中有智慧的妇女亲手纺线，把所纺的蓝色、紫色、朱红色线和细麻都拿了来。"],[26,"凡有智慧心里受感的妇女就纺山羊毛。"],[27,"众官长把红玛瑙和别样的宝石，可以镶嵌在以弗得与胸牌上的，都拿了来。"],[28,"又拿香料作香，拿油点灯，作膏油。"],[29,"以色列人，无论男女，凡甘心乐意献礼物给耶和华的，都将礼物拿来，作耶和华藉摩西所吩咐的一切工。"],[30,"摩西对以色列人说：“犹大支派中户珥的孙子、乌利的儿子比撒列，耶和华已经题他的名召他，"],[31,"又以神的灵充满了他，使他有智慧、聪明、知识，能作各样的工；"],[32,"能想出巧工，用金、银、铜制造各物；"],[33,"又能刻宝石，可以镶嵌；能雕刻木头，能作各样的巧工。"],[34,"耶和华又使他和但支派中亚希撒抹的儿子亚何利亚伯，心里灵明，能教导人。"],[35,"耶和华使他们的心满有智慧，能作各样的工。无论是雕刻的工，巧匠的工，用蓝色、紫色、朱红色线和细麻绣花的工，并机匠的工，他们都能作，也能想出奇巧的工。”"]]},{"n":36,"v":[[1,"比撒列和亚何利亚伯，并一切心里有智慧的，就是蒙耶和华赐智慧聪明，叫他知道作圣所各样使用之工的，都要照耶和华所吩咐的作工。"],[2,"凡耶和华赐他心里有智慧，而且受感前来作这工的，摩西把他们和比撒列并亚何利亚伯一同召来。"],[3,"这些人就从摩西收了以色列人为作圣所并圣所使用之工所拿来的礼物。百姓每早晨还把甘心献的礼物拿来。"],[4,"凡作圣所一切工的智慧人，各都离开他所作的工，"],[5,"来对摩西说：“百姓为耶和华吩咐使用之工所拿来的，富富有余。”"],[6,"摩西传命，他们就在全营中宣告说：“无论男女，不必再为圣所拿什么礼物来。”这样才拦住百姓不再拿礼物来。"],[7,"因为他们所有的材料够作一切当作的物，而且有余。"],[8,"他们中间凡心里有智慧作工的，用十幅幔子作帐幕。这幔子是比撒列用捻的细麻和蓝色、紫色、朱红色线制造的，并用巧匠的手工绣上基路伯。"],[9,"每幅幔子长二十八肘，宽四肘，都是一样的尺寸。"],[10,"他使这五幅幔子幅幅相连，又使那五幅幔子幅幅相连。"],[11,"在这相连的幔子末幅边上作蓝色的钮扣，在那相连的幔子末幅边上也照样作。"],[12,"在这相连的幔子上作五十个钮扣，在那相连的幔子上也作五十个钮扣，都是两两相对。"],[13,"又作五十个金钩，使幔子相连。这才成了一个帐幕。"],[14,"他用山羊毛织十一幅幔子，作为帐幕以上的罩棚。"],[15,"每幅幔子长三十肘，宽四肘。十一幅幔子都是一样的尺寸。"],[16,"他把五幅幔子连成一幅，又把六幅幔子连成一幅。"],[17,"在这相连的幔子末幅边上作五十个钮扣，在那相连的幔子末幅边上也作五十个钮扣。"],[18,"又作五十个铜钩，使罩棚连成一个，"],[19,"并用染红的公羊皮作罩棚的盖，再用海狗皮作一层罩棚上的顶盖。"],[20,"他用皂荚木作帐幕的竖板。"],[21,"每块长十肘，宽一肘半，"],[22,"每块有两榫相对，帐幕一切的板都是这样作。"],[23,"帐幕的南面作板二十块。"],[24,"在这二十块板底下，又作四十个带卯的银座。两卯接这块板上的两榫，两卯接那块板上的两榫。"],[25,"帐幕的第二面，就是北面，也作板二十块，"],[26,"和带卯的银座四十个。这板底下有两卯，那板底下也有两卯。"],[27,"帐幕的后面，就是西面，作板六块。"],[28,"帐幕后面的拐角作板两块。"],[29,"板的下半截是双的，上半截是整的，直到第一个环子，在帐幕的两个拐角上都是这样作。"],[30,"有八块板和十六个带卯的银座，每块板底下有两卯。"],[31,"他用皂荚木作闩。为帐幕这面的板作五闩，"],[32,"为帐幕那面的板作五闩，又为帐幕后面的板作五闩。"],[33,"使板腰间的中闩从这一头通到那一头。"],[34,"用金子将板包裹，又作板上的金环套闩；闩也用金子包裹。"],[35,"他用蓝色、紫色、朱红色线和捻的细麻织幔子，以巧匠的手工绣上基路伯。"],[36,"为幔子作四根皂荚木柱子，用金包裹，柱子上有金钩，又为柱子铸了四个带卯的银座。"],[37,"拿蓝色、紫色、朱红色线和捻的细麻，用绣花的手工织帐幕的门帘。"],[38,"又为帘子作五根柱子和柱子上的钩子，用金子把柱顶和柱子上的杆子包裹。柱子有五个带卯的座，是铜的。"]]},{"n":37,"v":[[1,"比撒列用皂荚木作柜，长二肘半，宽一肘半，高一肘半。"],[2,"里外包上精金，四围镶上金牙边。"],[3,"又铸四个金环，安在柜的四脚上，这边两环，那边两环。"],[4,"用皂荚木作两根杠，用金包裹。"],[5,"把杠穿在柜旁的环内，以便抬柜。"],[6,"用精金作施恩座，长二肘半，宽一肘半。"],[7,"用金子锤出两个基路伯来，安在施恩座的两头，"],[8,"这头作一个基路伯，那头作一个基路伯，二基路伯接连一块，在施恩座的两头。"],[9,"二基路伯高张翅膀，遮掩施恩座，基路伯是脸对脸，朝着施恩座。"],[10,"他用皂荚木作一张桌子，长二肘，宽一肘，高一肘半。"],[11,"又包上精金，四围镶上金牙边。"],[12,"桌子的四围各作一掌宽的横梁，横梁上镶着金牙边。"],[13,"又铸了四个金环，安在桌子四脚的四角上。"],[14,"安环子的地方，是挨近横梁，可以穿杠抬桌子。"],[15,"他用皂荚木作两根杠，用金包裹，以便抬桌子。"],[16,"又用精金作桌子上的器皿，就是盘子、调羹，并奠酒的瓶和爵。"],[17,"他用精金作一个灯台，这灯台的座和干，与杯、球、花，都是接连一块锤出来的。"],[18,"灯台两旁杈出六个枝子，这旁三个，那旁三个。"],[19,"这旁每枝上有三个杯，形状像杏花，有球、有花，那旁每枝上也有三个杯，形状像杏花，有球、有花。从灯台杈出来的六个枝子都是如此。"],[20,"灯台上有四个杯，形状像杏花，有球、有花。"],[21,"灯台每两个枝子以下有球，与枝子接连一块，灯台杈出的六个枝子都是如此。"],[22,"球和枝子是接连一块，都是一块精金锤出来的。"],[23,"用精金作灯台的七个灯盏，并灯台的蜡剪和蜡花盘。"],[24,"他用精金一他连得作灯台和灯台的一切器具。"],[25,"他用皂荚木作香坛，是四方的，长一肘，宽一肘，高二肘。坛的四角与坛接连一块。"],[26,"又用精金把坛的上面与坛的四面，并坛的四角包裹，又在坛的四围镶上金牙边。"],[27,"作两个金环，安在牙子边以下，在坛的两旁、两根横撑上，作为穿杠的用处，以便抬坛。"],[28,"用皂荚木作杠，用金包裹。"],[29,"又按作香之法作圣膏油和馨香料的净香。"]]},{"n":38,"v":[[1,"他用皂荚木作燔祭坛，是四方的，长五肘，宽五肘，高三肘。"],[2,"在坛的四拐角上作四个角，与坛接连一块，用铜把坛包裹。"],[3,"他作坛上的盆、铲子、盘子、肉叉子、火鼎；这一切器具都是用铜作的。"],[4,"又为坛作一个铜网，安在坛四面的围腰板以下，从下达到坛的半腰。"],[5,"为铜网的四角铸四个环子，作为穿杠的用处。"],[6,"用皂荚木作杠，用铜包裹。"],[7,"把杠穿在坛两旁的环子内，用以抬坛。并用板作坛，坛是空的。"],[8,"他用铜作洗濯盆和盆座，是用会幕门前伺候的妇人之镜子作的。"],[9,"他作帐幕的院子，院子的南面，用捻的细麻作帷子，宽一百肘。"],[10,"帷子的柱子二十根，带卯的铜座二十个，柱子上的钩子和杆子都是用银子作的。"],[11,"北面也有帷子，宽一百肘。帷子的柱子二十根，带卯的铜座二十个，柱子上的钩子和杆子都是用银子作的。"],[12,"院子的西面有帷子，宽五十肘。帷子的柱子十根，带卯的座十个，柱子的钩子和杆子都是用银子作的。"],[13,"院子的东面，宽五十肘。"],[14,"-"],[15,"门这边的帷子十五肘，那边也是一样。帷子的柱子三根，带卯的座三个。在门的左右各有帷子十五肘，帷子的柱子三根，带卯的座三个。"],[16,"院子四面的帷子，都是用捻的细麻作的。"],[17,"柱子带卯的座是铜的，柱子上的钩子和杆子是银的，柱顶是用银子包的。院子一切的柱子都是用银杆连络的。"],[18,"院子的门帘是以绣花的手工，用蓝色、紫色、朱红色线和捻的细麻织的，宽二十肘，高五肘，与院子的帷子相配。"],[19,"帷子的柱子四根，带卯的铜座四个，柱子上的钩子和杆子是银的，柱顶是用银子包的。"],[20,"帐幕一切的橛子和院子四围的橛子都是铜的。"],[21,"这是法柜的帐幕中利未人所用物件的总数，是照摩西的吩咐，经祭司亚伦的儿子以他玛的手数点的。"],[22,"凡耶和华所吩咐摩西的，都是犹大支派户珥的孙子、乌利的儿子比撒列作的。"],[23,"与他同工的，有但支派中亚希撒抹的儿子亚何利亚伯，他是雕刻匠，又是巧匠，又能用蓝色、紫色、朱红色线和细麻绣花。"],[24,"为圣所一切工作使用所献的金子，按圣所的平，有二十九他连得并七百三十舍客勒。"],[25,"会中被数的人所出的银子，按圣所的平，有一百他连得并一千七百七十五舍客勒。"],[26,"凡过去归那些被数之人的，从二十岁以外，有六十万零三千五百五十人，按圣所的平，每人出银半舍客勒，就是一比加。"],[27,"用那一百他连得银子铸造圣所带卯的座，和幔子柱子带卯的座，一百他连得共一百带卯的座；每带卯的座用一他连得。"],[28,"用那一千七百七十五舍客勒银子作柱子上的钩子，包裹柱顶并柱子上的杆子。"],[29,"所献的铜，有七十他连得并二千四百舍客勒。"],[30,"用这铜作会幕门带卯的座和铜坛，并坛上的铜网和坛的一切器具，"],[31,"并院子四围带卯的座和院门带卯的座，与帐幕一切的橛子和院子四围所有的橛子。"]]},{"n":39,"v":[[1,"比撒列用蓝色、紫色、朱红色线作精致的衣服，在圣所用以供职，又为亚伦作圣衣，是照耶和华所吩咐摩西的。"],[2,"他用金线和蓝色、紫色、朱红色线并捻的细麻作以弗得。"],[3,"把金子锤成薄片，剪出线来，与蓝色、紫色、朱红色线，用巧匠的手工一同绣上。"],[4,"又为以弗得作两条相连的肩带，接连在以弗得的两头。"],[5,"其上巧工织的带子和以弗得一样的做法，用以束上，与以弗得接连一块，是用金线和蓝色、紫色、朱红色线并捻的细麻作的，是照耶和华所吩咐摩西的。"],[6,"又琢出两块红玛瑙，镶在金槽上，彷佛刻图书，按着以色列儿子的名字雕刻。"],[7,"将这两块宝石，安在以弗得的两条肩带上，为以色列人作纪念石，是照耶和华所吩咐摩西的。"],[8,"他用巧匠的手工作胸牌，和以弗得一样的做法，用金线与蓝色、紫色、朱红色线并捻的细麻作的。"],[9,"胸牌是四方的，迭为两层，这两层长一虎口，宽一虎口。"],[10,"上面镶着宝石四行：第一行是红宝石、红璧玺、红玉；"],[11,"第二行是绿宝石、蓝宝石、金钢石；"],[12,"第三行是紫玛瑙、白玛瑙、紫晶；"],[13,"第四行是水苍玉、红玛瑙、碧玉。这都镶在金槽中。"],[14,"这些宝石都是按着以色列十二个儿子的名字，彷佛刻图书，刻十二个支派的名字。"],[15,"在胸牌上，用精金拧成如绳子的链子。"],[16,"又作两个金槽和两个金环，安在胸牌的两头。"],[17,"把那两条拧成的金链子，穿过胸牌两头的环子。"],[18,"又把链子的那两头接在两槽上，安在以弗得前面肩带上。"],[19,"作两个金环，安在胸牌的两头，在以弗得里面的边上。"],[20,"又作两个金环，安在以弗得前面两条肩带的下边，挨近相接之处，在以弗得巧工织的带子以上。"],[21,"用一条蓝细带子把胸牌的环子和以弗得的环子系住，使胸牌贴在以弗得巧工织的带子上，不可与以弗得离缝，是照耶和华所吩咐摩西的。"],[22,"他用织工作以弗得的外袍，颜色全是蓝的。"],[23,"袍上留一领口，口的周围织出领边来，彷佛铠甲的领口，免得破裂。"],[24,"在袍子底边上，用蓝色、紫色、朱红色线并捻的细麻作石榴。"],[25,"又用精金作铃铛，把铃铛钉在袍子周围底边上的石榴中间。"],[26,"一个铃铛一个石榴，一个铃铛一个石榴，在袍子周围底边上，用以供职，是照耶和华所吩咐摩西的。"],[27,"他用织成的细麻布为亚伦和他的儿子作内袍。"],[28,"并用细麻布作冠冕和华美的裹头巾，用捻的细麻布作裤子。"],[29,"又用蓝色、紫色、朱红色线并捻的细麻，以绣花的手工作腰带，是照耶和华所吩咐摩西的。"],[30,"他用精金作圣冠上的牌，在上面按刻图书之法，刻着“归耶和华为圣”。"],[31,"又用一条蓝细带子，将牌系在冠冕上，是照耶和华所吩咐摩西的。"],[32,"帐幕，就是会幕，一切的工就这样作完了。凡耶和华所吩咐摩西的，以色列人都照样作了。"],[33,"他们送到摩西那里，帐幕和帐幕的一切器具，就是钩子、板、闩、柱子、带卯的座，"],[34,"染红公羊皮的盖、海狗皮的顶盖，和遮掩柜的幔子，"],[35,"法柜和柜的杠并施恩座；"],[36,"桌子和桌子的一切器具并陈设饼；"],[37,"精金的灯台和摆列的灯盏，与灯台的一切器具，并点灯的油；"],[38,"金坛、膏油、馨香的香料、会幕的门帘，"],[39,"铜坛和坛上的铜网、坛的杠并坛的一切器具，洗濯盆和盆座；"],[40,"院子的帷子和柱子，并带卯的座，院子的门帘；绳子、橛子，并帐幕和会幕中一切使用的器具；"],[41,"精工作的礼服，和祭司亚伦并他儿子在圣所用以供祭司职分的圣衣。"],[42,"这一切工作，都是以色列人照耶和华所吩咐摩西作的。"],[43,"耶和华怎样吩咐的，他们就怎样作了。摩西看见一切的工都作成了，就给他们祝福。"]]},{"n":40,"v":[[1,"耶和华晓谕摩西说："],[2,"“正月初一日，你要立起帐幕，"],[3,"把法柜安放在里面，用幔子将柜遮掩。"],[4,"把桌子搬进去，摆设上面的物。把灯台搬进去，点其上的灯。"],[5,"把烧香的金坛安在法柜前，挂上帐幕的门帘。"],[6,"把燔祭坛安在帐幕门前。"],[7,"把洗濯盆安在会幕和坛的中间，在盆里盛水。"],[8,"又在四围立院帷，把院子的门帘挂上。"],[9,"用膏油把帐幕和其中所有的都抹上，使帐幕和一切器具成圣，就都成圣；"],[10,"又要抹燔祭坛和一切器具使坛成圣，就都成为至圣；"],[11,"要抹洗濯盆和盆座，使盆成圣。"],[12,"要使亚伦和他儿子到会幕门口来，用水洗身。"],[13,"要给亚伦穿上圣衣，又膏他，使他成圣，可以给我供祭司的职分；"],[14,"又要使他儿子来，给他们穿上内袍。"],[15,"怎样膏他们的父亲，也要照样膏他们，使他们给我供祭司的职分。他们世世代代凡受膏的，就永远当祭司的职任。”"],[16,"摩西这样行，都是照耶和华所吩咐他的。"],[17,"第二年正月初一日，帐幕就立起来。"],[18,"摩西立起帐幕，安上带卯的座，立上板，穿上闩，立起柱子；"],[19,"在帐幕以上搭罩棚，把罩棚的顶盖，盖在其上，是照耶和华所吩咐他的。"],[20,"又把法版放在柜里，把杠穿在柜的两旁，把施恩座安在柜上。"],[21,"把柜抬进帐幕，挂上遮掩柜的幔子，把法柜遮掩了，是照耶和华所吩咐他的。"],[22,"又把桌子安在会幕内，在帐幕北边，在幔子外。"],[23,"在桌子上将饼陈设在耶和华面前，是照耶和华所吩咐他的。"],[24,"又把灯台安在会幕内，在帐幕南边，与桌子相对，"],[25,"在耶和华面前点灯，是照耶和华所吩咐他的。"],[26,"把金坛安在会幕内的幔子前，"],[27,"在坛上烧了馨香料作的香，是照耶和华所吩咐他的。"],[28,"又挂上帐幕的门帘。"],[29,"在会幕的帐幕门前，安设燔祭坛，把燔祭和素祭献在其上，是照耶和华所吩咐他的。"],[30,"把洗濯盆安在会幕和坛的中间，盆中盛水，以便洗濯。"],[31,"摩西和亚伦并亚伦的儿子，在这盆里洗手洗脚。"],[32,"他们进会幕，或就近坛的时候，便都洗濯，是照耶和华所吩咐他的。"],[33,"在帐幕和坛的四围，立了院帷，把院子的门帘挂上。这样，摩西就完了工。"],[34,"当时，云彩遮盖会幕，耶和华的荣光就充满了帐幕。"],[35,"摩西不能进会幕，因为云彩停在其上，并且耶和华的荣光充满了帐幕。"],[36,"每逢云彩从帐幕收上去，以色列人就起程前往；"],[37,"云彩若不收上去，他们就不起程，直等到云彩收上去。"],[38,"日间，耶和华的云彩是在帐幕以上；夜间，云中有火，在以色列全家的眼前，在他们所行的路上都是这样。"]]}]},{"name":"约伯记","chapters":[{"n":1,"v":[[1,"乌斯地有一个人，名叫约伯；那人完全正直，敬畏神，远离恶事。"],[2,"他生了七个儿子，三个女儿。"],[3,"他的家产有七千羊，三千骆驼，五百对牛，五百母驴，并有许多仆婢。这人在东方人中就为至大。"],[4,"他的儿子按着日子，各在自己家里设摆筵宴，就打发人去请了他们的三个姐妹来，与他们一同吃喝。"],[5,"筵宴的日子过了，约伯打发人去叫他们自洁。他清早起来，按着他们众人的数目献燔祭；因为他说：“恐怕我儿子犯了罪，心中弃掉神。”约伯常常这样行。"],[6,"有一天，神的众子来侍立在耶和华面前，撒但也来在其中。"],[7,"耶和华问撒但说：“你从哪里来？”撒但回答说：“我从地上走来走去，往返而来。”"],[8,"耶和华问撒但说：“你曾用心察看我的仆人约伯没有？地上再没有人像他完全正直，敬畏神，远离恶事。”"],[9,"撒但回答耶和华说：“约伯敬畏神岂是无故呢？"],[10,"你岂不是四面圈上篱笆围护他和他的家，并他一切所有的吗？他手所作的都蒙你赐福；他的家产也在地上增多。"],[11,"你且伸手毁他一切所有的，他必当面弃掉你。”"],[12,"耶和华对撒但说：“凡他所有的都在你手中，只是不可伸手加害于他。”于是撒但从耶和华面前退去。"],[13,"有一天，约伯的儿女正在他们长兄的家里吃饭喝酒，"],[14,"有报信的来见约伯说：“牛正耕地，驴在旁边吃草，"],[15,"示巴人忽然闯来，把牲畜掳去，并用刀杀了仆人；惟有我一人逃脱，来报信给你。”"],[16,"他还说话的时候，又有人来说：“神从天上降下火来，将群羊和仆人都烧灭了；惟有我一人逃脱，来报信给你。”"],[17,"他还说话的时候，又有人来说：“迦勒底人分作三队，忽然闯来，把骆驼掳去，并用刀杀了仆人；惟有我一人逃脱，来报信给你。”"],[18,"他还说话的时候，又有人来说：“你的儿女正在他们长兄的家里吃饭喝酒，"],[19,"不料有狂风从旷野刮来，击打房屋的四角，房屋倒塌在少年人身上，他们就都死了；惟有我一人逃脱，来报信给你。”"],[20,"约伯便起来，撕裂外袍，剃了头，伏在地上下拜，"],[21,"说：“我赤身出于母胎，也必赤身归回。赏赐的是耶和华，收取的也是耶和华；耶和华的名是应当称颂的。”"],[22,"在这一切的事上，约伯并不犯罪，也不以神为愚妄（或作“也不妄评神”）。"]]},{"n":2,"v":[[1,"又有一天，神的众子来侍立在耶和华面前，撒但也来在其中。"],[2,"耶和华问撒但说：“你从哪里来？”撒但回答说：“我从地上走来走去，往返而来。”"],[3,"耶和华问撒但说：“你曾用心察看我的仆人约伯没有？地上再没有人像他完全正直，敬畏神，远离恶事。你虽激动我攻击他，无故地毁灭他；他仍然持守他的纯正。”"],[4,"撒但回答耶和华说：“人以皮代皮，情愿舍去一切所有的保全性命。"],[5,"你且伸手伤他的骨头和他的肉，他必当面弃掉你。”"],[6,"耶和华对撒但说：“他在你手中，只要存留他的性命。”"],[7,"于是撒但从耶和华面前退去，击打约伯，使他从脚掌到头顶长毒疮。"],[8,"约伯就坐在炉灰中，拿瓦片刮身体。"],[9,"他的妻子对他说：“你仍然持守你的纯正吗？你弃掉神，死了吧？”"],[10,"约伯却对她说：“你说话像愚顽的妇人一样。哎！难道我们从神手里得福，不也受祸吗？”在这一切的事上，约伯并不以口犯罪。"],[11,"约伯的三个朋友，提幔人以利法、书亚人比勒达、拿玛人琐法，听说有这一切的灾祸临到他身上，各人就从本处约会同来，为他悲伤，安慰他。"],[12,"他们远远地举目观看，认不出他来，就放声大哭。各人撕裂外袍，把尘土向天扬起来，落在自己的头上。"],[13,"他们就同他七天七夜坐在地上，一个人也不向他说句话，因为他极其痛苦。"]]},{"n":3,"v":[[1,"此后，约伯开口咒诅自己的生日，"],[2,"-"],[3,"说：“愿我生的那日和说怀了男胎的那夜都灭没。"],[4,"愿那日变为黑暗；愿神不从上面寻找它，愿亮光不照于其上。"],[5,"愿黑暗和死荫索取那日，愿密云停在其上，愿日蚀恐吓它。"],[6,"愿那夜被幽暗夺取，不在年中的日子同乐，也不入月中的数目。"],[7,"愿那夜没有生育，其间也没有欢乐的声音。"],[8,"愿那咒诅日子且能惹动鳄鱼的，咒诅那夜。"],[9,"愿那夜黎明的星宿变为黑暗，盼亮却不亮，也不见早晨的光线（“光线”原文作“眼皮”）。"],[10,"因没有把怀我胎的门关闭，也没有将患难对我的眼隐藏。”"],[11,"“我为何不出母胎而死？为何不出母腹绝气？"],[12,"为何有膝接收我？为何有奶哺养我？"],[13,"不然，我就早已躺卧安睡，"],[14,"和地上为自己重造荒邱的君王、谋士，"],[15,"或与有金子、将银子装满了房屋的王子一同安息。"],[16,"或像隐而未现、不到期而落的胎，归于无有，如同未见光的婴孩。"],[17,"在那里恶人止息搅扰，困乏人得享安息，"],[18,"被囚的人同得安逸，不听见督工的声音。"],[19,"大小都在那里，奴仆脱离主人的辖制。”"],[20,"“受患难的人为何有光赐给他呢？心中愁苦的人为何有生命赐给他呢？"],[21,"他们切望死，却不得死；求死，胜于求隐藏的珍宝。"],[22,"他们寻见坟墓就快乐，极其欢喜。"],[23,"人的道路既然遮隐，神又把他四面围困，为何有光赐给他呢？"],[24,"我未曾吃饭，就发出叹息；我唉哼的声音涌出如水。"],[25,"因我所恐惧的临到我身；我所惧怕的迎我而来。"],[26,"我不得安逸，不得平静，也不得安息，却有患难来到。”"]]},{"n":4,"v":[[1,"提幔人以利法回答说："],[2,"“人若想与你说话，你就厌烦吗？但谁能忍住不说呢？"],[3,"你素来教导许多的人，又坚固软弱的手。"],[4,"你的言语曾扶助那将要跌倒的人，你又使软弱的膝稳固。"],[5,"但现在祸患临到你，你就昏迷；挨近你，你便惊惶。"],[6,"你的倚靠，不是在你敬畏神吗？你的盼望，不是在你行事纯正吗？"],[7,"请你追想，无辜的人有谁灭亡？正直的人在何处剪除？"],[8,"按我所见，耕罪孽、种毒害的人都照样收割。"],[9,"神一出气，他们就灭亡；神一发怒，他们就消没。"],[10,"狮子的吼叫和猛狮的声音尽都止息，少壮狮子的牙齿也都敲掉，"],[11,"老狮子因绝食而死，母狮之子也都离散。”"],[12,"“我暗暗地得了默示，我耳朵也听其细微的声音。"],[13,"在思念夜中异象之间，世人沉睡的时候，"],[14,"恐惧、战兢临到我身，使我百骨打战。"],[15,"有灵从我面前经过，我身上的毫毛直立。"],[16,"那灵停住，我却不能辨其形状；有影像在我眼前，我在静默中听见有声音说："],[17,"‘必死的人岂能比神公义吗？人岂能比造他的主洁净吗？"],[18,"主不信靠他的臣仆，并且指他的使者为愚昧；"],[19,"何况那住在土房、根基在尘土里被蠹虫所毁坏的人呢？"],[20,"早晚之间就被毁灭，永归无有，无人理会。"],[21,"他帐棚的绳索岂不从中抽出来呢？他死，且是无智慧而死。’”"]]},{"n":5,"v":[[1,"“你且呼求，有谁答应你？诸圣者之中，你转向哪一位呢？"],[2,"忿怒害死愚妄人，嫉妒杀死痴迷人。"],[3,"我曾见愚妄人扎下根，但我忽然咒诅他的住处。"],[4,"他的儿女远离稳妥的地步，在城门口被压，并无人搭救。"],[5,"他的庄稼有饥饿的人吃尽了，就是在荆棘里的也抢去了，他的财宝，有网罗张口吞灭了。"],[6,"祸患，原不是从土中出来；患难，也不是从地里发生。"],[7,"人生在世必遇患难，如同火星飞腾。”"],[8,"“至于我，我必仰望神，把我的事情托付他。"],[9,"他行大事不可测度，行奇事不可胜数。"],[10,"降雨在地上，赐水于田里。"],[11,"将卑微的安置在高处，将哀痛的举到稳妥之地。"],[12,"破坏狡猾人的计谋，使他们所谋的不得成就。"],[13,"他叫有智慧的中了自己的诡计，使狡诈人的计谋速速灭亡。"],[14,"他们白昼遇见黑暗，午间摸索如在夜间。"],[15,"神拯救穷乏人，脱离他们口中的刀和强暴人的手。"],[16,"这样，贫寒的人有指望，罪孽之辈必塞口无言。”"],[17,"“神所惩治的人是有福的，所以你不可轻看全能者的管教。"],[18,"因为他打破，又缠裹；他击伤，用手医治。"],[19,"你六次遭难，他必救你；就是七次，灾祸也无法害你。"],[20,"在饥荒中，他必救你脱离死亡；在争战中，他必救你脱离刀剑的权力。"],[21,"你必被隐藏，不受口舌之害；灾殃临到，你也不惧怕；"],[22,"你遇见灾害饥馑，就必嬉笑，地上的野兽，你也不惧怕。"],[23,"因为你必与田间的石头立约，田里的野兽也必与你和好。"],[24,"你必知道你帐棚平安，要查看你的羊圈，一无所失。"],[25,"也必知道你的后裔将来发达，你的子孙像地上的青草。"],[26,"你必寿高年迈才归坟墓，好像禾捆到时收藏。"],[27,"这理我们已经考察，本是如此。你须要听，要知道是与自己有益。”"]]},{"n":6,"v":[[1,"约伯回答说："],[2,"“惟愿我的烦恼称一称，我一切的灾害放在天平里，"],[3,"现今都比海沙更重，所以我的言语急躁。"],[4,"因全能者的箭射入我身，其毒，我的灵喝尽了；神的惊吓摆阵攻击我。"],[5,"野驴有草岂能叫唤？牛有料岂能吼叫？"],[6,"物淡而无盐岂可吃吗？蛋青有什么滋味呢？"],[7,"看为可厌的食物，我心不肯挨近。”"],[8,"“惟愿我得着所求的，愿神赐我所切望的；"],[9,"就是愿神把我压碎，伸手将我剪除。"],[10,"我因没有违弃那圣者的言语，就仍以此为安慰，在不止息的痛苦中还可踊跃。"],[11,"我有什么气力使我等候？我有什么结局使我忍耐？"],[12,"我的气力岂是石头的气力？我的肉身岂是铜的呢？"],[13,"在我岂不是毫无帮助吗？智慧岂不是从我心中赶出净尽吗？”"],[14,"“那将要灰心、离弃全能者、不敬畏神的人，他的朋友当以慈爱待他。"],[15,"我的弟兄诡诈，好像溪水，又像溪水流干的河道。"],[16,"这河，因结冰发黑，有雪藏在其中；"],[17,"天气渐暖，就随时消化；日头炎热，便从原处干涸。"],[18,"结伴的客旅离弃大道，顺河边行，到荒野之地死亡。"],[19,"提玛结伴的客旅瞻望，示巴同伙的人等候。"],[20,"他们因失了盼望就抱愧，来到那里便蒙羞。"],[21,"现在你们正是这样，看见惊吓的事便惧怕。"],[22,"我岂说，请你们供给我，从你们的财物中送礼物给我？"],[23,"岂说，拯救我脱离敌人的手吗？救赎我脱离强暴人的手吗？”"],[24,"“请你们教导我，我便不作声，使我明白在何事上有错。"],[25,"正直的言语力量何其大？但你们责备，是责备什么呢？"],[26,"绝望人的讲论既然如风，你们还想要驳正言语吗？"],[27,"你们想为孤儿拈阄，以朋友当货物。”"],[28,"“现在请你们看看我，我决不当面说谎。"],[29,"请你们转意，不要不公；请再转意，我的事有理。"],[30,"我的舌上，岂有不义吗？我的口里岂不辨奸恶吗？”"]]},{"n":7,"v":[[1,"“人在世上岂无争战吗？他的日子不像雇工人的日子吗？"],[2,"像奴仆切慕黑影，像雇工人盼望工价；"],[3,"我也照样经过困苦的日月，夜间的疲乏为我而定。"],[4,"我躺卧的时候便说，我何时起来，黑夜就过去呢？我尽是反来复去，直到天亮。"],[5,"我的肉体以虫子和尘土为衣，我的皮肤才收了口又重新破裂。"],[6,"我的日子比梭更快，都消耗在无指望之中。”"],[7,"“求你想念，我的生命不过是一口气，我的眼睛必不再见福乐。"],[8,"观看我的人，他的眼必不再见我；你的眼目要看我，我却不在了。"],[9,"云彩消散而过；照样，人下阴间也不再上来。"],[10,"他不再回自己的家，故土也不再认识他。”"],[11,"“我不禁止我口；我灵愁苦，要发出言语；我心苦恼，要吐露哀情。"],[12,"我对神说，我岂是洋海，岂是大鱼，你竟防守我呢？"],[13,"若说，我的床必安慰我，我的榻必解释我的苦情；"],[14,"你就用梦惊骇我，用异象恐吓我。"],[15,"甚至我宁肯噎死，宁肯死亡，胜似留我这一身的骨头。"],[16,"我厌弃性命，不愿永活。你任凭我吧，因我的日子都是虚空。"],[17,"人算什么，你竟看他为大，将他放在心上，"],[18,"每早鉴察他，时刻试验他。"],[19,"你到何时才转眼不看我，才任凭我咽下唾沫呢？"],[20,"鉴察人的主啊，我若有罪，于你何妨？为何以我当你的箭靶子，使我厌弃自己的性命？"],[21,"为何不赦免我的过犯，除掉我的罪孽？我现今要躺卧在尘土中，你要殷勤地寻找我，我却不在了。”"]]},{"n":8,"v":[[1,"书亚人比勒达回答说："],[2,"“这些话你要说到几时？口中的言语如狂风要到几时呢？"],[3,"神岂能偏离公平？全能者岂能偏离公义？"],[4,"或者你的儿女得罪了他，他使他们受报应。"],[5,"你若殷勤地寻求神，向全能者恳求；"],[6,"你若清洁正直，他必定为你起来，使你公义的居所兴旺。"],[7,"你起初虽然微小，终久必甚发达。”"],[8,"“请你考问前代，追念他们的列祖所查究的。"],[9,"（我们不过从昨日才有，一无所知，我们在世的日子好像影儿。）"],[10,"他们岂不指教你、告诉你从心里发出言语来呢？”"],[11,"“蒲草没有泥岂能发长？芦荻没有水岂能生发？"],[12,"尚青的时候，还没有割下，比百样的草先枯稿；"],[13,"凡忘记神的人，景况也是这样。不虔敬人的指望要灭没，"],[14,"他所仰赖的必折断，他所倚靠的是蜘蛛网。"],[15,"他要倚靠房屋，房屋却站立不住；他要抓住房屋，房屋却不能存留。"],[16,"他在日光之下发青，蔓子爬满了园子。"],[17,"他的根盘绕石堆，扎入石地。"],[18,"他若从本地被拔出，那地就不认识他，说：我没有见过你。"],[19,"看哪，这就是他道中之乐，以后必另有人从地而生。"],[20,"神必不丢弃完全人，也不扶助邪恶人。"],[21,"他还要以喜笑充满你的口，以欢呼充满你的嘴。"],[22,"恨恶你的要披戴惭愧；恶人的帐棚，必归于无有。”"]]},{"n":9,"v":[[1,"约伯回答说："],[2,"“我真知道是这样。但人在神面前怎能成为义呢？"],[3,"若愿意与他争辩，千中之一也不能回答。"],[4,"他心里有智慧，且大有能力。谁向神刚硬而得亨通呢？"],[5,"他发怒，把山翻倒挪移，山并不知觉。"],[6,"他使地震动，离其本位，地的柱子就摇撼。"],[7,"他吩咐日头不出来，就不出来；又封闭众星。"],[8,"他独自铺张苍天，步行在海浪之上。"],[9,"他造北斗、参星、昴星，并南方的密宫。"],[10,"他行大事不可测度，行奇事不可胜数。"],[11,"他从我旁边经过，我却不看见；他在我面前行走，我倒不知觉。"],[12,"他夺取，谁能阻挡？谁敢问他，你作什么？”"],[13,"“神必不收回他的怒气；扶助拉哈伯的，屈身在他以下。"],[14,"既是这样，我怎敢回答他，怎敢选择言语与他辩论呢？"],[15,"我虽有义，也不回答他，只要向那审判我的恳求。"],[16,"我若呼吁，他应允我，我仍不信他真听我的声音。"],[17,"他用暴风折断我，无故地加增我的损伤。"],[18,"我就是喘一口气，他都不容，倒使我满心苦恼。"],[19,"若论力量，他真有能力；若论审判，他说谁能将我传来呢？"],[20,"我虽有义，自己的口要定我为有罪；我虽完全，我口必显我为弯曲。"],[21,"我本完全，不顾自己，我厌恶我的性命。"],[22,"善恶无分，都是一样，所以我说：完全人和恶人他都灭绝。"],[23,"若忽然遭杀害之祸，他必戏笑无辜的人遇难。"],[24,"世界交在恶人手中，蒙蔽世界审判官的脸，若不是他是谁呢？”"],[25,"“我的日子比跑信的更快，急速过去，不见福乐。"],[26,"我的日子过去如快船，如急落抓食的鹰。"],[27,"我若说，我要忘记我的哀情，除去我的愁容，心中畅快。"],[28,"我因愁苦而惧怕，知道你必不以我为无辜。"],[29,"我必被你定为有罪，我何必徒然劳苦呢？"],[30,"我若用雪水洗身，用碱洁净我的手，"],[31,"你还要扔我在坑里，我的衣服都憎恶我。"],[32,"他本不像我是人，使我可以回答他，又使我们可以同听审判。"],[33,"我们中间没有听讼的人，可以向我们两造按手。"],[34,"愿他把杖离开我，不使惊惶威吓我；"],[35,"我就说话，也不惧怕他，现在我却不是那样。”"]]},{"n":10,"v":[[1,"“我厌烦我的性命，必由着自己述说我的哀情，因心里苦恼，我要说话。"],[2,"对神说：不要定我有罪，要指示我，你为何与我争辩。"],[3,"你手所造的，你又欺压，又藐视，却光照恶人的计谋。这事你以为美吗？"],[4,"你的眼岂是肉眼？你查看岂像人查看吗？"],[5,"你的日子岂像人的日子？你的年岁岂像人的年岁？"],[6,"就追问我的罪孽，寻察我的罪过吗？"],[7,"其实，你知道我没有罪恶，并没有能救我脱离你手的。"],[8,"你的手创造我，造就我的四肢百体；你还要毁灭我。"],[9,"求你记念，制造我如抟泥一般；你还要使我归于尘土吗？"],[10,"你不是倒出我来好像奶，使我凝结如同奶饼吗？"],[11,"你以皮和肉为衣给我穿上，用骨与筋把我全体联络。"],[12,"你将生命和慈爱赐给我，你也眷顾保全我的心灵。"],[13,"然而你待我的这些事，早已藏在你心里，我知道你久有此意。"],[14,"我若犯罪，你就察看我，并不赦免我的罪孽。"],[15,"我若行恶，便有了祸；我若为义，也不敢抬头，正是满心羞愧，眼见我的苦情。"],[16,"我若昂首自得，你就追捕我如狮子，又在我身上显出奇能。"],[17,"你重立见证攻击我，向我加增恼怒，如军兵更换着攻击我。”"],[18,"“你为何使我出母胎呢？不如我当时气绝，无人得见我。"],[19,"这样，就如没有我一般，一出母胎就被送入坟墓。"],[20,"-"],[21,"我的日子不是甚少吗？求你停手宽容我，叫我在往而不返之先，就是往黑暗和死荫之地以先，可以稍得畅快。"],[22,"那地甚是幽暗，是死荫混沌之地，那里的光好像幽暗。”"]]},{"n":11,"v":[[1,"拿玛人琐法回答说："],[2,"“这许多的言语岂不该回答吗？多嘴多舌的人岂可称为义吗？"],[3,"你夸大的话，岂能使人不作声吗？你戏笑的时候岂没有人叫你害羞吗？"],[4,"你说：‘我的道理纯全，我在你眼前洁净。’"],[5,"惟愿神说话，愿他开口攻击你，"],[6,"并将智慧的奥秘指示你；他有诸般的智识。所以当知道神追讨你，比你罪孽该得的还少。"],[7,"你考察，就能测透神吗？你岂能尽情测透全能者吗？"],[8,"他的智慧高于天，你还能作什么？深于阴间，你还能知道什么？"],[9,"其量，比地长，比海宽。"],[10,"他若经过，将人拘禁，招人受审，谁能阻挡他呢？"],[11,"他本知道虚妄的人；人的罪孽，他虽不留意，还是无所不见。"],[12,"空虚的人却毫无知识，人生在世好像野驴的驹子。”"],[13,"“你若将心安正，又向主举手。"],[14,"你手里若有罪孽，就当远远地除掉，也不容非义住在你帐棚之中。"],[15,"那时，你必仰起脸来，毫无斑点；你也必坚固，无所惧怕。"],[16,"你必忘记你的苦楚，就是想起也如流过去的水一样。"],[17,"你在世的日子要比正午更明，虽有黑暗，仍像早晨。"],[18,"你因有指望，就必稳固，也必四围巡查，坦然安息。"],[19,"你躺卧无人惊吓，且有许多人向你求恩。"],[20,"但恶人的眼目必要失明，他们无路可逃，他们的指望就是气绝。”"]]},{"n":12,"v":[[1,"约伯回答说："],[2,"“你们真是子民哪！你们死亡，智慧也就灭没了。"],[3,"但我也有聪明，与你们一样，并非不及你们。你们所说的，谁不知道呢？"],[4,"我这求告神，蒙他应允的人，竟成了朋友所讥笑的；公义完全人，竟受了人的讥笑。"],[5,"安逸的人心里藐视灾祸，这灾祸常常等待滑脚的人。"],[6,"强盗的帐棚兴旺，惹神的人稳固，神多将财物送到他们手中。"],[7,"你且问走兽，走兽必指教你，又问空中的飞鸟，飞鸟必告诉你；"],[8,"或与地说话，地必指教你，海中的鱼也必向你说明。"],[9,"看这一切，谁不知道是耶和华的手作成的呢？"],[10,"凡活物的生命和人类的气息都在他手中。"],[11,"耳朵岂不试验言语，正如上膛尝食物吗？"],[12,"年老的有智慧，寿高的有知识。”"],[13,"“在神有智慧和能力，他有谋略和知识。"],[14,"他拆毁的，就不能再建造，他捆住人，便不得开释；"],[15,"他把水留住，水便枯干，他再发出水来，水就翻地。"],[16,"在他有能力和智慧，被诱惑的与诱惑人的都是属他。"],[17,"他把谋士剥衣掳去，又使审判官变成愚人。"],[18,"他放松君王的绑，又用带子捆他们的腰。"],[19,"他把祭司剥衣掳去，又使有能的人倾败。"],[20,"他废去忠信人的讲论，又夺去老人的聪明。"],[21,"他使君王蒙羞被辱，放松有力之人的腰带。"],[22,"他将深奥的事从黑暗中彰显，使死荫显为光明。"],[23,"他使邦国兴旺而又毁灭，他使邦国开广而又掳去；"],[24,"他将地上民中首领的聪明夺去，使他们在荒废无路之地漂流。"],[25,"他们无光，在黑暗中摸索，又使他们东倒西歪，像醉酒的人一样。”"]]},{"n":13,"v":[[1,"“这一切我眼都见过，我耳都听过，而且明白。"],[2,"你们所知道的，我也知道，并非不及你们。"],[3,"我真要对全能者说话，我愿与神理论。"],[4,"你们是编造谎言的，都是无用的医生。"],[5,"惟愿你们全然不作声，这就算为你们的智慧。"],[6,"请你们听我的辩论，留心听我口中的分诉。"],[7,"你们要为神说不义的话吗？为他说诡诈的言语吗？"],[8,"你们要为神徇情吗？要为他争论吗？"],[9,"他查出你们来，这岂是好吗？人欺哄人，你们也要照样欺哄他吗？"],[10,"你们若暗中徇情，他必要责备你们。"],[11,"他的尊荣，岂不叫你们惧怕吗？他的惊吓，岂不临到你们吗？"],[12,"你们以为可记念的箴言，是炉灰的箴言；你们以为可靠的坚垒，是淤泥的坚垒。”"],[13,"“你们不要作声，任凭我吧！让我说话，无论如何我都承当。"],[14,"我何必把我的肉挂在牙上，将我的命放在手中？"],[15,"他必杀我，我虽无指望，然而我在他面前还要辩明我所行的。"],[16,"这要成为我的拯救，因为不虔诚的人不得到他面前。"],[17,"你们要细听我的言语，使我所辩论的入你们的耳中。"],[18,"我已陈明我的案，知道自己有义。"],[19,"有谁与我争论，我就情愿缄默不言，气绝而亡。"],[20,"惟有两件，不要向我施行，我就不躲开你的面，"],[21,"就是把你的手缩回，远离我身，又不使你的惊惶威吓我。"],[22,"这样，你呼叫，我就回答，或是让我说话，你回答我。"],[23,"我的罪孽和罪过有多少呢？求你叫我知道我的过犯与罪愆。"],[24,"你为何掩面，拿我当仇敌呢？"],[25,"你要惊动被风吹的叶子吗？要追赶枯干的碎秸吗？"],[26,"你按罪状刑罚我，又使我担当幼年的罪孽。"],[27,"也把我的脚上了木狗，并窥察我一切的道路，为我的脚掌划定界限。"],[28,"我已经像灭绝的烂物，像虫蛀的衣裳。”"]]},{"n":14,"v":[[1,"“人为妇人所生，日子短少，多有患难。"],[2,"出来如花，又被割下；飞去如影，不能存留。"],[3,"这样的人你岂睁眼看他吗？又叫我来受审吗？"],[4,"谁能使洁净之物出于污秽之中呢？无论谁也不能。"],[5,"人的日子既然限定，他的月数在你那里，你也派定他的界限，使他不能越过；"],[6,"便求你转眼不看他，使他得歇息，直等他像雇工人完毕他的日子。”"],[7,"“树若被砍下，还可指望发芽，嫩枝生长不息，"],[8,"其根虽然衰老在地里，干也死在土中；"],[9,"及至得了水气，还要发芽，又长枝条，像新栽的树一样。"],[10,"但人死亡而消灭，他气绝，竟在何处呢？"],[11,"海中的水绝尽，江河消散干涸。"],[12,"人也是如此，躺下不再起来，等到天没有了，仍不得复醒，也不得从睡中唤醒。"],[13,"惟愿你把我藏在阴间，存于隐密处，等你的忿怒过去；愿你为我定了日期记念我。"],[14,"人若死了岂能再活呢？我只要在我一切争战的日子，等我被释放的时候来到（“被释放”或作“改变”）。"],[15,"你呼叫，我便回答；你手所作的，你必羡慕。"],[16,"但如今你数点我的脚步，岂不窥察我的罪过吗？"],[17,"我的过犯被你封在囊中，也缝严了我的罪孽。”"],[18,"“山崩变为无有，磐石挪开原处。"],[19,"水流消磨石头，所流溢的，洗去地上的尘土；你也照样灭绝人的指望。"],[20,"你攻击人常常得胜，使他去世；你改变他的容貌，叫他往而不回。"],[21,"他儿子得尊荣，他也不知道；降为卑，他也不觉得，"],[22,"但知身上疼痛，心中悲哀。”"]]},{"n":15,"v":[[1,"提幔人以利法回答说："],[2,"“智慧人岂可用虚空的知识回答，用东风充满肚腹呢？"],[3,"他岂可用无益的话和无济于事的言语理论呢？"],[4,"你是废弃敬畏的意，在神面前阻止敬虔的心。"],[5,"你的罪孽指教你的口，你选用诡诈人的舌头。"],[6,"你自己的口定你有罪，并非是我；你自己的嘴见证你的不是。”"],[7,"“你岂是头一个被生的人吗？你受造在诸山之先吗？"],[8,"你曾听见神的密旨吗？你还将智慧独自得尽吗？"],[9,"你知道什么是我们不知道的呢？你明白什么是我们不明白的呢？"],[10,"我们这里有白发的和年纪老迈的，比你父亲还老。"],[11,"神用温和的话安慰你，你以为太小吗？"],[12,"你的心为何将你逼去？你的眼为何冒出火星？"],[13,"使你的灵反对神，也任你的口发这言语？"],[14,"人是什么，竟算为洁净呢？妇人所生的是什么，竟算为义呢？"],[15,"神不信靠他的众圣者，在他眼前天也不洁净；"],[16,"何况那污秽可憎、喝罪孽如水的世人呢？”"],[17,"“我指示你，你要听！我要述说所看见的，"],[18,"就是智慧人从列祖所受、传说而不隐瞒的。"],[19,"（这地惟独赐给他们，并没有外人从他们中间经过。）"],[20,"恶人一生之日劬劳痛苦，强暴人一生的年数也是如此。"],[21,"惊吓的声音常在他耳中，在平安时抢夺的必临到他那里。"],[22,"他不信自己能从黑暗中转回；他被刀剑等候。"],[23,"他漂流在外求食，说：‘哪里有食物呢？’他知道黑暗的日子在他手边预备好了。"],[24,"急难困苦叫他害怕，而且胜了他，好像君王预备上阵一样。"],[25,"他伸手攻击神，以骄傲攻击全能者，"],[26,"挺着颈项，用盾牌的厚凸面向全能者直闯；"],[27,"是因他的脸蒙上脂油，腰积成肥肉。"],[28,"他曾住在荒凉城邑，无人居住将成乱堆的房屋。"],[29,"他不得富足，财物不得常存，产业在地上也不加增。"],[30,"他不得出离黑暗，火焰要将他的枝子烧干，因神口中的气，他要灭亡（“灭亡”原文作“走去”）。"],[31,"他不用倚靠虚假欺哄自己，因虚假必成为他的报应。"],[32,"他的日期未到之先，这事必成就；他的枝子不得青绿。"],[33,"他必像葡萄树的葡萄未熟而落；又像橄榄树的花一开而谢。"],[34,"原来不敬虔之辈必无生育；受贿赂之人的帐棚必被火烧。"],[35,"他们所怀的是毒害，所生的是罪孽，心里所预备的是诡诈。”"]]},{"n":16,"v":[[1,"约伯回答说："],[2,"“这样的话我听了许多。你们安慰人，反叫人愁烦。"],[3,"虚空的言语有穷尽吗？有什么话惹动你回答呢？"],[4,"我也能说你们那样的话。你们若处在我的境遇，我也会联络言语攻击你们，又能向你们摇头。"],[5,"但我必用口坚固你们，用嘴消解你们的忧愁。”"],[6,"“我虽说话，忧愁仍不得消解；我虽停住不说，忧愁就离开我吗？"],[7,"但现在神使我困倦，使亲友远离我，"],[8,"又抓住我，作见证攻击我。我身体的枯瘦，也当面见证我的不是。"],[9,"主发怒撕裂我，逼迫我，向我切齿；我的敌人怒目看我。"],[10,"他们向我开口，打我的脸羞辱我，聚会攻击我。"],[11,"神把我交给不敬虔的人，把我扔到恶人的手中。"],[12,"我素来安逸，他折断我，掐住我的颈项把我摔碎，又立我为他的箭靶子。"],[13,"他的弓箭手四面围绕我，他破裂我的肺腑，并不留情，把我的胆倾倒在地上。"],[14,"将我破裂又破裂，如同勇士向我直闯。”"],[15,"“我缝麻布在我皮肤上，把我的角放在尘土中。"],[16,"我的脸因哭泣发紫，在我的眼皮上有死荫。"],[17,"我的手中却无强暴，我的祈祷也是清洁。"],[18,"地啊，不要遮盖我的血，不要阻挡我的哀求。"],[19,"现今，在天有我的见证，在上有我的中保。"],[20,"我的朋友讥诮我，我却向神眼泪汪汪。"],[21,"愿人得与神辩白，如同人与朋友辩白一样。"],[22,"因为再过几年，我必走那往而不返之路。”"]]},{"n":17,"v":[[1,"“我的心灵消耗，我的日子灭尽，坟墓为我预备好了。"],[2,"真有戏笑我的在我这里，我眼常见他们惹动我。”"],[3,"“愿主拿凭据给我，自己为我作保。在你以外谁肯与我击掌呢？"],[4,"因你使他们心不明理，所以你必不高举他们。"],[5,"控告他的朋友，以朋友为可抢夺的，连他儿女的眼睛也要失明。”"],[6,"“神使我作了民中的笑谈，他们也吐唾沫在我脸上。"],[7,"我的眼睛因忧愁昏花，我的百体好像影儿。"],[8,"正直人因此必惊奇，无辜的人要兴起攻击不敬虔之辈。"],[9,"然而义人要持守所行的道，手洁的人要力上加力。"],[10,"至于你们众人，可以再来辩论吧！你们中间，我找不着一个智慧人。"],[11,"我的日子已经过了，我的谋算、我心所想望的已经断绝。"],[12,"他们以黑夜为白昼，说：‘亮光近乎黑暗。’"],[13,"我若盼望阴间为我的房屋，若下榻在黑暗中，"],[14,"若对朽坏说：‘你是我的父’；对虫说：‘你是我的母亲姐妹’。"],[15,"这样，我的指望在哪里呢？我所指望的谁能看见呢？"],[16,"等到安息在尘土中，这指望必下到阴间的门闩那里了。”"]]},{"n":18,"v":[[1,"书亚人比勒达回答说："],[2,"“你寻索言语要到几时呢？你可以揣摩思想，然后我们就说话。"],[3,"我们为何算为畜生，在你眼中看作污秽呢？"],[4,"你这恼怒将自己撕裂的，难道大地为你见弃，磐石挪开原处吗？”"],[5,"“恶人的亮光必要熄灭，他的火焰必不照耀。"],[6,"他帐棚中的亮光要变为黑暗，他以上的灯也必熄灭。"],[7,"他坚强的脚步必见狭窄；自己的计谋必将他绊倒。"],[8,"因为他被自己的脚陷入网中，走在缠人的网罗上。"],[9,"圈套必抓住他的脚跟，机关必擒获他。"],[10,"活扣为他藏在土内，羁绊为他藏在路上。"],[11,"四面的惊吓要使他害怕，并且追赶他的脚跟。"],[12,"他的力量必因饥饿衰败，祸患要在他旁边等候。"],[13,"他本身的肢体要被吞吃，死亡的长子要吞吃他的肢体。"],[14,"他要从所倚靠的帐棚被拔出来，带到惊吓的王那里。"],[15,"不属他的，必住在他的帐棚里，硫磺必撒在他所住之处。"],[16,"下边，他的根本要枯干；上边，他的枝子要剪除。"],[17,"他的记念在地上必然灭亡；他的名字在街上也不存留。"],[18,"他必从光明中被撵到黑暗里，必被赶出世界。"],[19,"在本民中必无子无孙；在寄居之地也无一人存留。"],[20,"以后来的，要惊奇他的日子，好像以前去的，受了惊骇。"],[21,"不义之人的住处总是这样。此乃不认识神之人的地步。”"]]},{"n":19,"v":[[1,"约伯回答说："],[2,"“你们搅扰我的心，用言语压碎我，要到几时呢？"],[3,"你们这十次羞辱我，你们苦待我也不以为耻。"],[4,"果真我有错，这错乃是在我。"],[5,"你们果然要向我夸大，以我的羞辱为证指责我；"],[6,"就该知道是神倾覆我，用网罗围绕我。"],[7,"我因委曲呼叫，却不蒙应允；我呼求，却不得公断。"],[8,"神用篱笆拦住我的道路，使我不得经过；又使我的路径黑暗。"],[9,"他剥去我的荣光，摘去我头上的冠冕。"],[10,"他在四围攻击我，我便归于死亡，将我的指望如树拔出来。"],[11,"他的忿怒向我发作，以我为敌人。"],[12,"他的军旅一齐上来，修筑战路攻击我，在我帐棚的四围安营。”"],[13,"“他把我的弟兄隔在远处，使我所认识的全然与我生疏。"],[14,"我的亲戚与我断绝，我的密友都忘记我。"],[15,"在我家寄居的和我的使女都以我为外人，我在他们眼中看为外邦人。"],[16,"我呼唤仆人，虽用口求他，他还是不回答。"],[17,"我口的气味，我妻子厌恶；我的恳求，我同胞也憎嫌，"],[18,"连小孩子也藐视我。我若起来，他们都嘲笑我。"],[19,"我的密友都憎恶我；我平日所爱的人向我翻验。"],[20,"我的皮肉紧贴骨头，我只剩牙皮逃脱了。"],[21,"我朋友啊，可怜我，可怜我！因为神的手攻击我。"],[22,"你们为什么彷佛神逼迫我，吃我的肉还以为不足呢？”"],[23,"“惟愿我的言语现在写上，都记录在书上；"],[24,"用铁笔镌刻，用铅灌在磐石上，直存到永远。"],[25,"我知道我的救赎主活着，末了必站立在地上。"],[26,"我这皮肉灭绝之后，我必在肉体之外得见神。"],[27,"我自己要见他，亲眼要看他，并不像外人。我的心肠在我里面消灭了。"],[28,"你们若说，我们逼迫他，要何等的重呢？惹事的根乃在乎他。"],[29,"你们就当惧怕刀剑，因为忿怒惹动刀剑的刑罚，使你们知道有报应（原文作“审判”）。”"]]},{"n":20,"v":[[1,"拿玛人琐法回答说："],[2,"“我心中急躁，所以我的思念叫我回答。"],[3,"我已听见那羞辱我责备我的话，我的悟性叫我回答。"],[4,"你岂不知亘古以来，自从人生在地，"],[5,"恶人夸胜是暂时的，不敬虔人的喜乐不过转眼之间吗？"],[6,"他的尊荣虽达到天上，头虽顶到云中，"],[7,"他终必灭亡，像自己的粪一样；素来见他的人要说，‘他在哪里呢？’"],[8,"他必飞去如梦，不再寻见；速被赶去，如夜间的异象。"],[9,"亲眼见过他的必不再见他；他的本处也再见不着他。"],[10,"他的儿女要求穷人的恩，他的手要赔还不义之财。"],[11,"他的骨头虽然有青年之力，却要和他一同躺卧在尘土中。”"],[12,"“他口内虽以恶为甘甜，藏在舌头底下，"],[13,"爱恋不舍，含在口中；"],[14,"他的食物在肚里却要化为酸，在他里面成为虺蛇的恶毒。"],[15,"他吞了财宝，还要吐出，神要从他腹中掏出来。"],[16,"他必吸饮虺蛇的毒气，蝮蛇的舌头也必杀他。"],[17,"流奶与蜜之河，他不得再见。"],[18,"他劳碌得来的要赔还，不得享用（原文作“吞下”），不能照所得的财货欢乐。"],[19,"他欺压穷人，且又离弃，强取非自己所盖的房屋（或作“强取房屋不得再建造”）。"],[20,"他因贪而无厌，所喜悦的连一样也不能保守。"],[21,"其余的没有一样他不吞灭，所以他的福乐不能长久。"],[22,"他在满足有余的时候，必到狭窄的地步；凡受苦楚的人，都必加手在他身上。"],[23,"他正要充满肚腹的时候，神必将猛烈的忿怒降在他身上；正在他吃饭的时候，要将这忿怒像雨降在他身上。"],[24,"他要躲避铁器，铜弓的箭要将他射透。"],[25,"他把箭一抽，就从他身上出来；发光的箭头从他胆中出来，有惊惶临在他身上。"],[26,"他的财宝归于黑暗，人所不吹的火，要把他烧灭，要把他帐棚中所剩下的烧毁。"],[27,"天要显明他的罪孽，地要兴起攻击他。"],[28,"他的家产必然过去，神发怒的日子，他的货物都要消灭。"],[29,"这是恶人从神所得的份，是神为他所定的产业。”"]]},{"n":21,"v":[[1,"约伯回答说："],[2,"“你们要细听我的言语，就算是你们安慰我。"],[3,"请宽容我，我又要说话。说了以后，任凭你们嗤笑吧！"],[4,"我岂是向人诉冤，为何不焦急呢？"],[5,"你们要看着我而惊奇，用手捂口。"],[6,"我每逢思想，心就惊惶，浑身战兢。"],[7,"恶人为何存活，享大寿数，势力强盛呢？"],[8,"他们眼见儿孙和他们一同坚立。"],[9,"他们的家宅平安无惧，神的杖也不加在他们身上。"],[10,"他们的公牛孳生而不断绝，母牛下犊而不掉胎。"],[11,"他们打发小孩子出去，多如羊群，他们的儿女踊跃跳舞。"],[12,"他们随着琴鼓歌唱，又因箫声欢喜。"],[13,"他们度日诸事亨通，转眼下入阴间。"],[14,"他们对神说：‘离开我们吧！我们不愿晓得你的道。"],[15,"全能者是谁，我们何必侍奉他呢？求告他有什么益处呢？’"],[16,"看哪，他们亨通不在乎自己，恶人所谋定的离我好远。”"],[17,"“恶人的灯何尝熄灭？患难何尝临到他们呢？神何尝发怒，向他们分散灾祸呢？"],[18,"他们何尝像风前的碎秸，如暴风刮去的糠秕呢？"],[19,"你们说：神为恶人的儿女积蓄罪孽。我说：不如本人受报，好使他亲自知道。"],[20,"愿他亲眼看见自己败亡，亲自饮全能者的忿怒。"],[21,"他的岁月既尽，他还顾他本家吗？"],[22,"神既审判那在高位的，谁能将知识教训他呢？"],[23,"有人至死身体强壮，尽得平靖安逸，"],[24,"他的奶桶充满，他的骨髓滋润。"],[25,"有人至死心中痛苦，终身未尝福乐的滋味。"],[26,"他们一样躺卧在尘土中，都被虫子遮盖。”"],[27,"“我知道你们的意思，并诬害我的计谋。"],[28,"你们说：‘霸者的房屋在哪里？恶人住过的帐棚在哪里？’"],[29,"你们岂没有询问过路的人吗？不知道他们所引的证据吗？"],[30,"就是恶人在祸患的日子得存留，在发怒的日子得逃脱。”"],[31,"“他所行的，有谁当面给他说明？他所作的，有谁报应他呢？"],[32,"然而他要被抬到茔地，并有人看守坟墓。"],[33,"他要以谷中的土块为甘甜，在他以先去的无数，在他以后去的更多。"],[34,"你们对答的话中既都错谬，怎么徒然安慰我呢？”"]]},{"n":22,"v":[[1,"提幔人以利法回答说："],[2,"“人岂能使神有益呢？智慧人但能有益于己。"],[3,"你为人公义，岂叫全能者喜悦呢？你行为完全，岂能使他得利呢？"],[4,"岂是因你敬畏他，就责备你、审判你吗？"],[5,"你的罪恶岂不是大吗？你的罪孽也没有穷尽。"],[6,"因你无故强取弟兄的物为当头，剥去贫寒人的衣服。"],[7,"困乏的人，你没有给他水喝；饥饿的人，你没有给他食物。"],[8,"有能力的人就得地土，尊贵的人也住在其中。"],[9,"你打发寡妇空手回去，折断孤儿的膀臂。"],[10,"因此，有网罗环绕你，有恐惧忽然使你惊惶，"],[11,"或有黑暗蒙蔽你，并有洪水淹没你。”"],[12,"“神岂不是在高天吗？你看星宿何其高呢？"],[13,"你说：神知道什么？他岂能看透幽暗施行审判呢？"],[14,"密云将他遮盖，使他不能看见；他周游穹苍。"],[15,"你要依从上古的道吗？这道是恶人所行的。"],[16,"他们未到死期，忽然除灭，根基毁坏，好像被江河冲去。"],[17,"他们向神说：‘离开我们吧？’又说：‘全能者能把我们怎么样呢？’"],[18,"哪知神以美物充满他们的房屋，但恶人所谋定的离我好远。"],[19,"义人看见他们的结局就欢喜，无辜的人嗤笑他们，"],[20,"说：‘那起来攻击我们的，果然被剪除，其余的都被火烧灭。’”"],[21,"“你要认识神，就得平安，福气也必临到你。"],[22,"你当领受他口中的教训，将他的言语存在心里。"],[23,"你若归向全能者，从你帐棚中远除不义，就必得建立。"],[24,"要将你的珍宝丢在尘土里，将俄斐的黄金丢在溪河石头之间，"],[25,"全能者就必为你的珍宝，作你的宝银。"],[26,"你就要以全能者为喜乐，向神仰起脸来。"],[27,"你要祷告他，他就听你；你也要还你的愿。"],[28,"你定意要作何事，必然给你成就；亮光也必照耀你的路。"],[29,"人使你降卑，你仍可说，必得高升。谦卑的人，神必然拯救。"],[30,"人非无辜，神且要搭救他，他因你手中清洁，必蒙拯救。”"]]},{"n":23,"v":[[1,"约伯回答说："],[2,"“如今我的哀告还算为悖逆；我的责罚比我的唉哼还重。"],[3,"惟愿我能知道在哪里可以寻见神，能到他的台前，"],[4,"我就在他面前将我的案件陈明，满口辩白。"],[5,"我必知道他回答我的言语，明白他向我所说的话。"],[6,"他岂用大能与我争辩吗？必不这样！他必理会我。"],[7,"在他那里，正直人可以与他辩论；这样，我必永远脱离那审判我的。”"],[8,"“只是我往前行，他不在那里；往后退，也不能见他。"],[9,"他在左边行事，我却不能看见；在右边隐藏，我也不能见他。"],[10,"然而他知道我所行的路，他试炼我之后，我必如精金。"],[11,"我脚追随他的步履，我谨守他的道，并不偏离。"],[12,"他嘴唇的命令我未曾背弃；我看重他口中的言语，过于我需用的饮食。"],[13,"只是他心志已定，谁能使他转意呢？他心里所愿的，就行出来。"],[14,"他向我所定的，就必作成；这类的事他还有许多。"],[15,"所以我在他面前惊惶，我思念这事，便惧怕他。"],[16,"神使我丧胆，全能者使我惊惶。"],[17,"我的恐惧，不是因为黑暗，也不是因为幽暗蒙蔽我的脸。”"]]},{"n":24,"v":[[1,"“全能者既定期罚恶，为何不使认识他的人看见那日子呢？"],[2,"有人挪移地界，抢夺群畜而牧养。"],[3,"他们拉去孤儿的驴，强取寡妇的牛为当头。"],[4,"他们使穷人离开正道；世上的贫民尽都隐藏。"],[5,"这些贫穷人如同野驴出到旷野，殷勤寻找食物。他们靠着野地给儿女糊口，"],[6,"收割别人田间的禾稼，摘取恶人余剩的葡萄；"],[7,"终夜赤身无衣，天气寒冷毫无遮盖，"],[8,"在山上被大雨淋湿，因没有避身之处就挨近磐石。"],[9,"又有人从母怀中抢夺孤儿，强取穷人的衣服为当头，"],[10,"使人赤身无衣，到处流行，且因饥饿扛抬禾捆。"],[11,"在那些人的围墙内造油、醡酒，自己还口渴。"],[12,"在多民的城内有人唉哼，受伤的人哀号；神却不理会那恶人的愚妄。”"],[13,"“又有人背弃光明，不认识光明的道，不住在光明的路上。"],[14,"杀人的黎明起来，杀害困苦穷乏人，夜间又作盗贼。"],[15,"奸夫等候黄昏说：‘必无眼能见我’，就把脸蒙蔽。"],[16,"盗贼黑夜挖窟窿，白日躲藏，并不认识光明。"],[17,"他们看早晨如幽暗，因为他们晓得幽暗的惊骇。”"],[18,"“这些恶人犹如浮萍快快飘去，他们所得的份在世上被咒诅；他们不得再走葡萄园的路。"],[19,"干旱炎热消没雪水，阴间也如此消没犯罪之辈。"],[20,"怀他的母（原文作“胎”）要忘记他，虫子要吃他，觉得甘甜。他不再被人记念；不义的人必如树折断。”"],[21,"“他恶待（或作“他吞灭”）不怀孕、不生养的妇人，不善待寡妇。"],[22,"然而神用能力保全有势力的人，那性命难保的人仍然兴起。"],[23,"神使他们安稳，他们就有所倚靠；神的眼目也看顾他们的道路。"],[24,"他们被高举，不过片时就没有了。他们降为卑，被除灭，与众人一样，又如谷穗被割。"],[25,"若不是这样，谁能证实我是说谎的，将我的言语驳为虚空呢？”"]]},{"n":25,"v":[[1,"书亚人比勒达回答说："],[2,"“神有治理之权，有威严可畏，他在高处施行和平。"],[3,"他的诸军，岂能数算？他的光亮一发，谁不蒙照呢？"],[4,"这样，在神面前人怎能称义？妇人所生的怎能洁净？"],[5,"在神眼前，月亮也无光亮，星宿也不清洁，"],[6,"何况如虫的人，如蛆的世人呢！”"]]},{"n":26,"v":[[1,"约伯回答说："],[2,"“无能的人，蒙你何等的帮助！膀臂无力的人，蒙你何等的拯救！"],[3,"无智慧的人，蒙你何等的指教！你向他多显大知识。"],[4,"你向谁发出言语来？谁的灵从你而出？"],[5,"在大水和水族以下的阴魂战兢。"],[6,"在神面前阴间显露，灭亡也不得遮掩。"],[7,"神将北极铺在空中，将大地悬在虚空；"],[8,"将水包在密云中，云却不破裂。"],[9,"遮蔽他的宝座，将云铺在其上。"],[10,"在水面的周围划出界限，直到光明、黑暗的交界。"],[11,"天的柱子因他的斥责震动惊奇。"],[12,"他以能力搅动大海（“搅动”或作“平静”）；他藉知识打伤拉哈伯。"],[13,"藉他的灵使天有妆饰；他的手刺杀快蛇。"],[14,"看哪，这不过是神工作的些微，我们所听于他的是何等细微的声音，他大能的雷声谁能明透呢？”"]]},{"n":27,"v":[[1,"约伯接着说："],[2,"“神夺去我的理，全能者使我心中愁苦。我指着永生的神起誓："],[3,"（我的生命尚在我里面，神所赐呼吸之气仍在我的鼻孔内。）"],[4,"我的嘴决不说非义之言；我的舌也不说诡诈之语。"],[5,"我断不以你们为是，我至死必不以自己为不正。"],[6,"我持定我的义，必不放松，在世的日子，我心必不责备我。”"],[7,"“愿我的仇敌如恶人一样，愿那起来攻击我的，如不义之人一般。"],[8,"不敬虔的人虽然得利，神夺取其命的时候，还有什么指望呢？"],[9,"患难临到他，神岂能听他的呼求？"],[10,"他岂以全能者为乐，随时求告神呢？"],[11,"神的作为，我要指教你们，全能者所行的，我也不隐瞒。"],[12,"你们自己也都见过，为何全然变为虚妄呢？”"],[13,"“神为恶人所定的份，强暴人从全能者所得的报（“报”原文作“产业”）乃是这样："],[14,"倘或他的儿女增多，还是被刀所杀，他的子孙必不得饱食。"],[15,"他所遗留的人必死而埋葬，他的寡妇也不哀哭。"],[16,"他虽积蓄银子如尘沙，预备衣服如泥土，"],[17,"他只管预备，义人却要穿上；他的银子，无辜的人要分取。"],[18,"他建造房屋如虫作窝，又如守望者所搭的棚。"],[19,"他虽富足躺卧，却不得收殓，转眼之间就不在了。"],[20,"惊恐如波涛将他追上，暴风在夜间将他刮去。"],[21,"东风把他飘去，又刮他离开本处。"],[22,"神要向他射箭，并不留情。他恨不得逃脱神的手。"],[23,"人要向他拍掌，并要发叱声，使他离开本处。”"]]},{"n":28,"v":[[1,"银子有矿，炼金有方。"],[2,"铁从地里挖出，铜从石中熔化。"],[3,"人为黑暗定界限，查究幽暗阴翳的石头，直到极处。"],[4,"在无人居住之处刨开矿穴，过路的人也想不到他们；又与人远离，悬在空中摇来摇去。"],[5,"至于地，能出粮食，地内好像被火翻起来。"],[6,"地中的石头有蓝宝石，并有金沙。"],[7,"矿中的路鸷鸟不得知道，鹰眼也未见过。"],[8,"狂傲的野兽未曾行过，猛烈的狮子也未曾经过。”"],[9,"“人伸手凿开坚石，倾倒山根。"],[10,"在磐石中凿出水道，亲眼看见各样宝物。"],[11,"他封闭水不得滴流，使隐藏的物显露出来。”"],[12,"“然而，智慧有何处可寻？聪明之处在哪里呢？"],[13,"智慧的价值无人能知，在活人之地也无处可寻。"],[14,"深渊说：‘不在我内。’沧海说：‘不在我中。’"],[15,"智慧非用黄金可得，也不能平白银为它的价值。"],[16,"俄斐金和贵重的红玛瑙，并蓝宝石，不足与较量；"],[17,"黄金和玻璃不足与比较；精金的器皿不足与兑换；"],[18,"珊瑚、水晶都不足论。智慧的价值胜过珍珠（或作“红宝石”）。"],[19,"古实的红璧玺不足与比较；精金也不足与较量。”"],[20,"“智慧从何处来呢？聪明之处在哪里呢？"],[21,"是向一切有生命的眼目隐藏，向空中的飞鸟掩蔽。"],[22,"灭没和死亡说：‘我们风闻其名。’”"],[23,"“神明白智慧的道路，晓得智慧的所在。"],[24,"因他鉴察直到地极，遍观普天之下。"],[25,"要为风定轻重，又度量诸水。"],[26,"他为雨露定命令，为雷电定道路。"],[27,"那时他看见智慧，而且述说；他坚定，并且查究。"],[28,"他对人说：‘敬畏主就是智慧，远离恶便是聪明。’”"]]},{"n":29,"v":[[1,"约伯又接着说："],[2,"“惟愿我的景况如从前的月份，如神保守我的日子。"],[3,"那时他的灯照在我头上，我藉他的光行过黑暗。"],[4,"我愿如壮年的时候，那时我在帐棚中，神待我有密友之情；"],[5,"全能者仍与我同在，我的儿女都环绕我。"],[6,"奶多可洗我的脚，磐石为我出油成河。"],[7,"我出到城门，在街上设立座位；"],[8,"少年人见我而回避，老年人也起身站立；"],[9,"王子都停止说话，用手捂口；"],[10,"首领静默无声，舌头贴住上膛。"],[11,"耳朵听我的，就称我有福；眼睛看我的，便称赞我；"],[12,"因我拯救哀求的困苦人和无人帮助的孤儿。"],[13,"将要灭亡的为我祝福，我也使寡妇心中欢乐。"],[14,"我以公义为衣服，以公平为外袍和冠冕。"],[15,"我为瞎子的眼，瘸子的脚。"],[16,"我为穷乏人的父，素不认识的人，我查明他的案件。"],[17,"我打破不义之人的牙床，从他牙齿中夺了所抢的。"],[18,"我便说，我必死在家中（原文作“窝中”），必增添我的日子，多如尘沙。"],[19,"我的根长到水边，露水终夜沾在我的枝上。"],[20,"我的荣耀在身上增新，我的弓在手中日强。”"],[21,"“人听见我而仰望，静默等候我的指教。"],[22,"我说话之后，他们就不再说，我的言语像雨露滴在他们身上。"],[23,"他们仰望我如仰望雨，又张开口如切慕春雨。"],[24,"他们不敢自信，我就向他们含笑；他们不使我脸上的光改变。"],[25,"我为他们选择道路，又坐首位。我如君王在军队中居住，又如吊丧的安慰伤心的人。”"]]},{"n":30,"v":[[1,"“但如今，比我年少的人戏笑我，其人之父我曾藐视，不肯安在看守我羊群的狗中。"],[2,"他们壮年的气力既已衰败，其手之力与我何益呢？"],[3,"他们因穷乏饥饿，身体枯瘦，在荒废凄凉的幽暗中，啃干燥之地，"],[4,"在草丛之中采咸草，罗腾的根为他们的食物（“罗腾”小树名，松类）。"],[5,"他们从人中被赶出，人追喊他们如贼一般，"],[6,"以致他们住在荒谷之间，在地洞和岩穴中，"],[7,"在草丛中叫唤，在荆棘下聚集。"],[8,"这都是愚顽下贱人的儿女，他们被鞭打，赶出境外。”"],[9,"“现在这些人以我为歌曲，以我为笑谈。"],[10,"他们厌恶我，躲在旁边站着，不住地吐唾沫在我脸上。"],[11,"松开他们的绳索苦待我，在我面前脱去辔头。"],[12,"这等下流人在我右边起来，推开我的脚，筑成战路来攻击我。"],[13,"这些无人帮助的，毁坏我的道，加增我的灾。"],[14,"他们来如同闯进大破口，在毁坏之间，滚在我身上。"],[15,"惊恐临到我，驱逐我的尊荣如风；我的福禄如云过去。”"],[16,"“现在我心极其悲伤，困苦的日子将我抓住。"],[17,"夜间我里面的骨头刺我，疼痛不止，好像啃我。"],[18,"因神的大力，我的外衣污秽不堪，又如里衣的领子将我缠住。"],[19,"神把我扔在淤泥中，我就像尘土和炉灰一般。"],[20,"主啊，我呼求你，你不应允我；我站起来，你就定睛看我。"],[21,"你向我变心，待我残忍，又用大能追逼我。"],[22,"把我提在风中，使我驾风而行，又使我消灭在烈风中。"],[23,"我知道要使我临到死地，到那为众生所定的阴宅。”"],[24,"“然而人仆倒，岂不伸手？遇灾难，岂不求救呢？"],[25,"人遭难，我岂不为他哭泣呢？人穷乏，我岂不为他忧愁呢？"],[26,"我仰望得好处，灾祸就到了；我等待光明，黑暗便来了。"],[27,"我心里烦扰不安，困苦的日子临到我身。"],[28,"我没有日光就哀哭行去（或作“我面发黑并非因日晒”），我在会中站着求救。"],[29,"我与野狗为弟兄，与鸵鸟为同伴。"],[30,"我的皮肤黑而脱落，我的骨头因热烧焦。"],[31,"所以我的琴音变为悲音，我的箫声变为哭声。”"]]},{"n":31,"v":[[1,"“我与眼睛立约，怎能恋恋瞻望处女呢？"],[2,"从至上的神所得之份，从至高全能者所得之业是什么呢？"],[3,"岂不是祸患临到不义的，灾害临到作孽的呢？"],[4,"神岂不是察看我的道路，数点我的脚步呢？”"],[5,"“我若与虚谎同行，脚若追随诡诈；"],[6,"我若被公道的天平称度，使神可以知道我的纯正；"],[7,"我的脚步若偏离正路，我的心若随着我的眼目，若有玷污粘在我手上，"],[8,"就愿我所种的有别人吃，我田所产的被拔出来。”"],[9,"“我若受迷惑，向妇人起淫念，在邻舍的门外蹲伏，"],[10,"就愿我的妻子给别人推磨，别人也与她同室。"],[11,"因为这是大罪，是审判官当罚的罪孽。"],[12,"这本是火焚烧，直到毁灭，必拔除我所有的家产。”"],[13,"“我的仆婢与我争辩的时候，我若藐视不听他们的情节；"],[14,"神兴起，我怎样行呢？他察问，我怎样回答呢？"],[15,"造我在腹中的，不也是造他吗？将他与我抟在腹中的岂不是一位吗？”"],[16,"“我若不容贫寒人得其所愿，或叫寡妇眼中失望；"],[17,"或独自吃我一点食物，孤儿没有与我同吃；"],[18,"（从幼年时孤儿与我同长，好像父子一样；我从出母腹就扶助（“扶助”原文作“引领”）寡妇。）"],[19,"我若见人因无衣死亡，或见穷乏人身无遮盖；"],[20,"我若不使他因我羊的毛得暖，为我祝福；"],[21,"我若在城门口见有帮助我的举手攻击孤儿；"],[22,"情愿我的肩头从缺盆骨脱落，我的膀臂从羊矢骨折断。"],[23,"因神降的灾祸使我恐惧；因他的威严，我不能妄为。”"],[24,"“我若以黄金为指望，对精金说，你是我的倚靠；"],[25,"我若因财物丰裕，因我手多得资财而欢喜；"],[26,"我若见太阳发光，明月行在空中，"],[27,"心就暗暗被引诱，口便亲手；"],[28,"这也是审判官当罚的罪孽，又是我背弃在上的神。”"],[29,"“我若见恨我的遭报就欢喜，见他遭灾便高兴；"],[30,"（我没有容口犯罪，咒诅他的生命。）"],[31,"若我帐棚的人未尝说，谁不以主人的食物吃饱呢？"],[32,"（从来我没有容客旅在街上住宿，却开门迎接行路的人。）"],[33,"我若像亚当（“亚当”或作“别人”）遮掩我的过犯，将罪孽藏在怀中，"],[34,"因惧怕大众，又因宗族藐视我使我惊恐，以致闭口无言，杜门不出，"],[35,"惟愿有一位肯听我，（看哪，在这里有我所划的押，愿全能者回答我。）"],[36,"愿那敌我者所写的状词在我这里，我必带在肩上，又绑在头上为冠冕。"],[37,"我必向他述说我脚步的数目，必如君王进到他面前。”"],[38,"“我若夺取田地，这地向我喊冤，犁沟一同哭泣；"],[39,"我若吃地的出产不给价值，或叫原主丧命，"],[40,"愿这地长蒺藜代替麦子，长恶草代替大麦。”约伯的话说完了。"]]},{"n":32,"v":[[1,"于是这三个人，因约伯自以为义，就不再回答他。"],[2,"那时有布西人兰族巴拉迦的儿子以利户向约伯发怒，因约伯自以为义，不以神为义。"],[3,"他又向约伯的三个朋友发怒，因为他们想不出回答的话来，仍以约伯为有罪。"],[4,"以利户要与约伯说话，就等候他们，因为他们比自己年老。"],[5,"以利户见这三个人口中无话回答，就怒气发作。"],[6,"布西人巴拉迦的儿子以利户回答说：“我年轻，你们老迈，因此我退让，不敢向你们陈说我的意见。"],[7,"我说，年老的当先说话；寿高的当以智慧教训人。"],[8,"但在人里面有灵，全能者的气使人有聪明。"],[9,"尊贵的不都有智慧，寿高的不都能明白公平。"],[10,"因此我说，你们要听我言，我也要陈说我的意见。”"],[11,"“你们查究所要说的话；那时我等候你们的话，侧耳听你们的辩论，"],[12,"留心听你们，谁知你们中间无一人折服约伯，驳倒他的话。"],[13,"你们切不可说，我们寻得智慧；神能胜他，人却不能。"],[14,"约伯没有向我争辩，我也不用你们的话回答他。”"],[15,"“他们惊奇，不再回答，一言不发。"],[16,"我岂因他们不说话，站住不再回答，仍旧等候呢？"],[17,"我也要回答我的一份话，陈说我的意见。"],[18,"因为我的言语满怀，我里面的灵激动我。"],[19,"我的胸怀如盛酒之囊没有出气之缝，又如新皮袋快要破裂。"],[20,"我要说话，使我舒畅，我要开口回答。"],[21,"我必不看人的情面，也不奉承人。"],[22,"我不晓得奉承，若奉承，造我的主必快快除灭我。”"]]},{"n":33,"v":[[1,"“约伯啊，请听我的话，留心听我一切的言语。"],[2,"我现在开口，用舌发言，"],[3,"我的言语要发明心中所存的正直；我所知道的，我嘴唇要诚实地说出。"],[4,"神的灵造我，全能者的气使我得生。"],[5,"你若回答我，就站起来在我面前陈明。"],[6,"我在神面前与你一样，也是用土造成。"],[7,"我不用威严惊吓你，也不用势力重压你。”"],[8,"“你所说的我听见了，也听见你的言语，说："],[9,"‘我是清洁无过的，我是无辜的，在我里面也没有罪孽。"],[10,"神找机会攻击我，以我为仇敌，"],[11,"把我的脚上了木狗，窥察我一切的道路。’”"],[12,"“我要回答你说：你这话无理，因神比世人更大。"],[13,"你为何与他争论呢？因他的事都不对人解说？"],[14,"神说一次、两次，世人却不理会。"],[15,"人躺在床上沉睡的时候，神就用梦和夜间的异象，"],[16,"开通他们的耳朵，将当受的教训印在他们心上，"],[17,"好叫人不从自己的谋算，不行骄傲的事（原文作“将骄傲向人隐藏”）；"],[18,"拦阻人不陷于坑里，不死在刀下。”"],[19,"“人在床上被惩治，骨头中不住地疼痛，"],[20,"以致他的口厌弃食物，心厌恶美味。"],[21,"他的肉消瘦，不得再见，先前不见的骨头都凸出来。"],[22,"他的灵魂临近深坑，他的生命近于灭命的。"],[23,"一千天使中，若有一个作传话的与神同在，指示人所当行的事，"],[24,"神就给他开恩，说：‘救赎他免得下坑，我已经得了赎价。’"],[25,"他的肉要比孩童的肉更嫩，他就返老还童。"],[26,"他祷告神，神就喜悦他，使他欢呼朝见神的面；神又看他为义。"],[27,"他在人前歌唱说：‘我犯了罪，颠倒是非，这竟与我无益。"],[28,"神救赎我的灵魂免入深坑，我的生命也必见光。’”"],[29,"“神两次、三次向人行这一切的事，"],[30,"为要从深坑救回人的灵魂，使他被光照耀，与活人一样。"],[31,"约伯啊，你当侧耳听我的话，不要作声，等我讲说。"],[32,"你若有话说，就可以回答我，你只管说，因我愿以你为是。"],[33,"若不然，你就听我说，你不要作声，我便将智慧教训你。”"]]},{"n":34,"v":[[1,"以利户又说："],[2,"“你们智慧人要听我的话；有知识的人要留心听我说。"],[3,"因为耳朵试验话语，好像上膛尝食物。"],[4,"我们当选择何为是，彼此知道何为善。"],[5,"约伯曾说：‘我是公义，神夺去我的理。"],[6,"我虽有理，还算为说谎言的；我虽无过，受的伤还不能医治。’"],[7,"谁像约伯，喝讥诮如同喝水呢？"],[8,"他与作孽的结伴，和恶人同行。"],[9,"他说：‘人以神为乐，总是无益。’”"],[10,"“所以你们明理的人，要听我的话。神断不至行恶，全能者断不至作孽。"],[11,"他必按人所作的报应人，使各人照所行的得报。"],[12,"神必不作恶，全能者也不偏离公平。"],[13,"谁派他治理地、安定全世界呢？"],[14,"他若专心为己，将灵和气收归自己，"],[15,"凡有血气的就必一同死亡，世人必仍归尘土。”"],[16,"“你若明理，就当听我的话，留心听我言语的声音。"],[17,"难道恨恶公平的，可以掌权吗？那有公义的，有大能的，岂可定他有罪吗？"],[18,"他对君王说，你是鄙陋的。对贵臣说，你是邪恶的。"],[19,"他待王子不徇情面，也不看重富足的过于贫穷的，因为都是他手所造。"],[20,"在转眼之间，半夜之中，他们就死亡。百姓被震动而去世，有权力的被夺去非借人手。”"],[21,"“神注目观看人的道路，看明人的脚步。"],[22,"没有黑暗、阴翳能给作孽的藏身。"],[23,"神审判人，不必使人到他面前再三鉴察。"],[24,"他用难测之法打破有能力的人，设立别人代替他们。"],[25,"他原知道他们的行为，使他们在夜间倾倒灭亡。"],[26,"他在众人眼前击打他们，如同击打恶人一样。"],[27,"因为他们偏行不跟从他，也不留心他的道；"],[28,"甚至使贫穷人的哀声达到他那里，他也听了困苦人的哀声。”"],[29,"“他使人安静，谁能扰乱（或作“定罪”）呢？他掩面谁能见他呢？无论待一国或一人都是如此。"],[30,"使不虔敬的人不得作王，免得有人牢笼百姓。”"],[31,"“有谁对神说：‘我受了责罚，不再犯罪。"],[32,"我所看不明的，求你指教我；我若作了孽，必不再作’？"],[33,"他施行报应，岂要随你的心愿，叫你推辞不受吗？选定的是你，不是我。你所知道的只管说吧！"],[34,"明理的人和听我话的智慧人必对我说："],[35,"‘约伯说话没有知识，言语中毫无智慧。’"],[36,"愿约伯被试验到底，因他回答像恶人一样。"],[37,"他在罪上又加悖逆；在我们中间拍手，用许多言语轻慢神。”"]]},{"n":35,"v":[[1,"以利户又说："],[2,"“你以为有理，或以为你的公义胜于神的公义，"],[3,"才说，‘这与我有什么益处？我不犯罪，比犯罪有什么好处呢？’"],[4,"我要回答你和在你这里的朋友。"],[5,"你要向天观看，瞻望那高于你的穹苍。"],[6,"你若犯罪，能使神受何害呢？你的过犯加增，能使神受何损呢？"],[7,"你若是公义，还能加增他什么呢？他从你手里还接受什么呢？"],[8,"你的过恶或能害你这类的人，你的公义或能叫世人得益处。”"],[9,"“人因多受欺压就哀求，因受能者的辖制（“辖制”原文作“膀臂”）便求救；"],[10,"却无人说：‘造我的神在哪里？’他使人夜间歌唱。"],[11,"教训我们胜于地上的走兽，使我们有聪明胜于空中的飞鸟。"],[12,"他们在那里，因恶人的骄傲呼求，却无人答应。"],[13,"虚妄的呼求，神必不垂听，全能者也必不眷顾。"],[14,"何况你说，你不得见他。你的案件在他面前，你等候他吧！"],[15,"但如今因他未曾发怒降罚，也不甚理会狂傲。"],[16,"所以约伯开口说虚妄的话，多发无知识的言语。”"]]},{"n":36,"v":[[1,"以利户又接着说："],[2,"“你再容我片时，我就指示你，因我还有话为神说。"],[3,"我要将所知道的从远处引来，将公义归给造我的主。"],[4,"我的言语真不虚谎，有知识全备的与你同在。”"],[5,"“神有大能，并不藐视人，他的智慧甚广。"],[6,"他不保护恶人的性命，却为困苦人伸冤。"],[7,"他时常看顾义人，使他们和君王同坐宝座，永远要被高举。"],[8,"他们若被锁链捆住，被苦难的绳索缠住，"],[9,"他就把他们的作为和过犯指示他们，叫他们知道有骄傲的行动。"],[10,"他也开通他们的耳朵得受教训，吩咐他们离开罪孽转回。"],[11,"他们若听从侍奉他，就必度日亨通，历年福乐；"],[12,"若不听从，就要被刀杀灭，无知无识而死。”"],[13,"“那心中不敬虔的人积蓄怒气；神捆绑他们，他们竟不求救，"],[14,"必在青年时死亡，与污秽人一样丧命。"],[15,"神藉着困苦救拔困苦人，趁他们受欺压，开通他们的耳朵。"],[16,"神也必引你出离患难，进入宽阔不狭窄之地；摆在你席上的，必满有肥甘。”"],[17,"“但你满口有恶人批评的言语，判断和刑罚抓住你。"],[18,"不可容忿怒触动你，使你不服责罚，也不可因赎价大就偏行。"],[19,"你的呼求（“呼求”或作“资财”），或是你一切的势力，果有灵验，叫你不受患难吗？"],[20,"不要切慕黑夜，就是众民在本处被除灭的时候。"],[21,"你要谨慎，不可重看罪孽，因你选择罪孽过于选择苦难。"],[22,"神行事有高大的能力，教训人的有谁像他呢？"],[23,"谁派定他的道路？谁能说，‘你所行的不义’？”"],[24,"“你不可忘记称赞他所行的为大，就是人所歌颂的。"],[25,"他所行的，万人都看见，世人也从远处观看。"],[26,"神为大，我们不能全知，他的年数不能测度。"],[27,"他吸取水点，这水点从云雾中就变成雨。"],[28,"云彩将雨落下，沛然降与世人。"],[29,"谁能明白云彩如何铺张，和神行宫的雷声呢？"],[30,"他将亮光普照在自己的四围，他又遮覆海底。"],[31,"他用这些审判众民，且赐丰富的粮食。"],[32,"他以电光遮手，命闪电击中敌人（或作“中了靶子”）。"],[33,"所发的雷声显明他的作为，又向牲畜指明要起暴风。”"]]},{"n":37,"v":[[1,"“因此我心战兢，从原处移动。"],[2,"听啊，神轰轰的声音，是他口中所发的响声。"],[3,"他发响声震遍天下，发电光闪到地极。"],[4,"随后人听见有雷声轰轰，大发威严，雷电接连不断。"],[5,"神发出奇妙的雷声，他行大事，我们不能测透。"],[6,"他对雪说，要降在地上，对大雨和暴雨也是这样说。"],[7,"他封住各人的手，叫所造的万人都晓得他的作为。"],[8,"百兽进入穴中，卧在洞内。"],[9,"暴风出于南宫，寒冷出于北方。"],[10,"神嘘气成冰，宽阔之水也都凝结。"],[11,"他使密云盛满水气，布散电光之云；"],[12,"这云，是藉他的指引游行旋转，得以在全地面上行他一切所吩咐的。"],[13,"或为责罚，或为润地，或为施行慈爱。”"],[14,"“约伯啊，你要留心听，要站立思想神奇妙的作为。"],[15,"神如何吩咐这些，如何使云中的电光照耀，你知道吗？"],[16,"云彩如何浮于空中？那知识全备者奇妙的作为，你知道吗？"],[17,"南风使地寂静，你的衣服就如火热，你知道吗？"],[18,"你岂能与神同铺穹苍吗？这穹苍坚硬，如同铸成的镜子。"],[19,"我们愚昧不能陈说，请你指教我们该对他说什么话。"],[20,"人岂可说，我愿与他说话，岂有人自愿灭亡吗？”"],[21,"现在有云遮蔽，人不得见穹苍的光亮；但风吹过，天又发晴。"],[22,"金光出于北方，在神那里有可怕的威严。"],[23,"论到全能者，我们不能测度；他大有能力，有公平和大义，必不苦待人，"],[24,"所以人敬畏他。凡自以为心中有智慧的人，他都不顾念。”"]]},{"n":38,"v":[[1,"那时，耶和华从旋风中回答约伯说："],[2,"“谁用无知的言语使我的旨意暗昧不明？"],[3,"你要如勇士束腰，我问你，你可以指示我。”"],[4,"“我立大地根基的时候，你在哪里呢？你若有聪明，只管说吧！"],[5,"你若晓得就说，是谁定地的尺度？是谁把准绳拉在其上？"],[6,"地的根基安置在何处？地的角石是谁安放的？"],[7,"那时，晨星一同歌唱，神的众子也都欢呼。”"],[8,"“海水冲出，如出胎胞，那时谁将它关闭呢？"],[9,"是我用云彩当海的衣服，用幽暗当包裹它的布，"],[10,"为它定界限，又安门和闩，"],[11,"说：‘你只可到这里，不可越过，你狂傲的浪要到此止住。’”"],[12,"“你自生以来，曾命定晨光，使清晨的日光知道本位，"],[13,"叫这光普照地的四极，将恶人从其中驱逐出来吗？"],[14,"因这光地面改变如泥上印印，万物出现如衣服一样。"],[15,"亮光不照恶人，强横的膀臂也必折断。”"],[16,"“你曾进到海源，或在深渊的隐密处行走吗？"],[17,"死亡的门曾向你显露吗？死荫的门你曾见过吗？"],[18,"地的广大你能明透吗？你若全知道，只管说吧！”"],[19,"“光明的居所从何而至？黑暗的本位在于何处？"],[20,"你能带到本境，能看明其室之路吗？"],[21,"你总知道，因为你早已生在世上，你日子的数目也多。”"],[22,"“你曾进入雪库，或见过雹仓吗？"],[23,"这雪雹乃是我为降灾，并打仗和争战的日子所预备的。"],[24,"光亮从何路分开？东风从何路分散遍地？”"],[25,"“谁为雨水分道？谁为雷电开路，"],[26,"使雨降在无人之地，无人居住的旷野，"],[27,"使荒废凄凉之地得以丰足，青草得以发生。"],[28,"雨有父吗？露水珠是谁生的呢？"],[29,"冰出于谁的胎？天上的霜是谁生的呢？"],[30,"诸水坚硬（或作“隐藏”）如石头，深渊之面凝结成冰。"],[31,"你能系住昴星的结吗？能解开参星的带吗？"],[32,"你能按时领出十二宫吗？能引导北斗和随它的众星吗（“星”原文作“子”）？"],[33,"你知道天的定例吗？能使地归在天的权下吗？”"],[34,"“你能向云彩扬起声来，使倾盆的雨遮盖你吗？"],[35,"你能发出闪电，叫它行去，使它对你说：‘我们在这里’？"],[36,"谁将智慧放在怀中？谁将聪明赐于心内？"],[37,"-"],[38,"谁能用智慧数算云彩呢？尘土聚集成团，土块紧紧结连，那时，谁能倾倒天上的瓶呢？”"],[39,"-"],[40,"“母狮子在洞中蹲伏，少壮狮子在隐密处埋伏，你能为它们抓取食物，使它们饱足吗？"],[41,"乌鸦之雏，因无食物飞来飞去，哀告神；那时，谁为它预备食物呢？”"]]},{"n":39,"v":[[1,"“山岩间的野山羊几时生产，你知道吗？母鹿下犊之期，你能察定吗？"],[2,"它们怀胎的月数，你能数算吗？它们几时生产，你能晓得吗？"],[3,"它们屈身将子生下，就除掉疼痛。"],[4,"这子渐渐肥壮，在荒野长大，去而不回。”"],[5,"“谁放野驴出去自由？谁解开快驴的绳索？"],[6,"我使旷野作它的住处，使咸地当它的居所。"],[7,"它嗤笑城内的喧嚷，不听赶牲口的喝声。"],[8,"遍山是它的草场，它寻找各样青绿之物。”"],[9,"“野牛岂肯服侍你？岂肯住在你的槽旁？"],[10,"你岂能用套绳将野牛笼在犁沟之间？它岂肯随你耙山谷之地？"],[11,"岂可因它的力大就倚靠它？岂可把你的工交给它作吗？"],[12,"岂可信靠它把你的粮食运到家，又收聚你禾场上的谷吗？”"],[13,"“鸵鸟的翅膀欢然搧展，岂是显慈爱的翎毛和羽毛吗？"],[14,"因它把蛋留在地上，在尘土中使得温暖，"],[15,"却想不到被脚踹碎，或被野兽践踏。"],[16,"它忍心待雏，似乎不是自己的，虽然徒受劳苦，也不为雏惧怕。"],[17,"因为神使它没有智慧，也未将悟性赐给它。"],[18,"它几时挺身展开翅膀，就嗤笑马和骑马的人。”"],[19,"“马的大力是你所赐的吗？它颈项上挓挲的鬃是你给它披上的吗？"],[20,"是你叫它跳跃像蝗虫吗？它喷气之威使人惊惶。"],[21,"它在谷中刨地自喜其力；它出去迎接佩带兵器的人。"],[22,"它嗤笑可怕的事并不惊惶，也不因刀剑退回。"],[23,"箭袋和发亮的枪，并短枪，在它身上铮铮有声。"],[24,"它发猛烈的怒气将地吞下，一听角声就不耐站立。"],[25,"角每发声，它说呵哈；它从远处闻着战气，又听见军长大发雷声和兵丁呐喊。”"],[26,"“鹰雀飞翔，展开翅膀一直向南，岂是藉你的智慧吗？"],[27,"大鹰上腾，在高处搭窝，岂是听你的吩咐吗？"],[28,"它住在山岩，以山峰和坚固之所为家，"],[29,"从那里窥看食物，眼睛远远观望。"],[30,"它的雏也咂血，被杀的人在哪里，它也在那里。”"]]},{"n":40,"v":[[1,"耶和华又对约伯说："],[2,"“强辩的岂可与全能者争论吗？与神辩驳的，可以回答这些吧！”"],[3,"于是约伯回答耶和华说："],[4,"“我是卑贱的？我用什么回答你呢？只好用手捂口。"],[5,"我说了一次，再不回答；说了两次，就不再说。”"],[6,"于是耶和华从旋风中回答约伯说："],[7,"“你要如勇士束腰；我问你，你可以指示我。"],[8,"你岂可废弃我所拟定的？岂可定我有罪，好显自己为义吗？"],[9,"你有神那样的膀臂吗？你能像他发雷声吗？”"],[10,"“你要以荣耀庄严为妆饰，以尊荣威严为衣服；"],[11,"要发出你满溢的怒气，见一切骄傲的人，使他降卑；"],[12,"见一切骄傲的人，将他制伏。把恶人践踏在本处，"],[13,"将他们一同隐藏在尘土中，把他们的脸蒙蔽在隐密处；"],[14,"我就认你右手能以救自己。”"],[15,"“你且观看河马。我造你也造它，它吃草与牛一样。"],[16,"它的气力在腰间，能力在肚腹的筋上。"],[17,"它摇动尾巴如香柏树，它大腿的筋互相联络。"],[18,"它的骨头好像铜管，它的肢体彷佛铁棍。”"],[19,"“它在神所造的物中为首，创造它的给它刀剑。"],[20,"诸山给它出食物，也是百兽游玩之处。"],[21,"它伏在莲叶之下，卧在芦苇隐密处和水洼子里。"],[22,"莲叶的阴凉遮蔽它，溪旁的柳树环绕它。"],[23,"河水泛滥，它不发战，就是约旦河的水涨到它口边，也是安然。"],[24,"在它防备的时候，谁能捉拿它？谁能牢笼它穿它的鼻子呢？”"]]},{"n":41,"v":[[1,"“你能用鱼钩钓上鳄鱼吗？能用绳子压下它的舌头吗？"],[2,"你能用绳索穿它的鼻子吗？能用钩穿它的腮骨吗？"],[3,"它岂向你连连恳求，说柔和的话吗？"],[4,"岂肯与你立约，使你拿它永远作奴仆吗？"],[5,"你岂可拿它当雀鸟玩耍吗？岂可为你的幼女将它拴住吗？"],[6,"搭伙的渔夫，岂可拿它当货物吗？能把它分给商人吗？"],[7,"你能用倒钩扎满它的皮，能用鱼叉叉满它的头吗？"],[8,"你按手在它身上，想与它争战，就不再这样行吧！"],[9,"人指望捉拿它是徒然的；一见它，岂不丧胆吗？"],[10,"没有那么凶猛的人敢惹它。这样，谁能在我面前站立得住呢？"],[11,"谁先给我什么，使我偿还呢？天下万物都是我的。”"],[12,"“论到鳄鱼的肢体和其大力，并美好的骨骼，我不能缄默不言。"],[13,"谁能剥它的外衣？谁能进它上下牙骨之间呢？"],[14,"谁能开它的腮颊？它牙齿四围是可畏的。"],[15,"它以坚固的鳞甲为可夸，紧紧合闭，封得严密。"],[16,"这鳞甲一一相连，甚至气不得透入其间，"],[17,"都是互相联络，胶结不能分离。"],[18,"它打喷嚏，就发出光来；它眼睛好像早晨的光线（“光线”原文作“眼皮”）。"],[19,"从它口中发出烧着的火把，与飞迸的火星；"],[20,"从它鼻孔冒出烟来，如烧开的锅和点着的芦苇。"],[21,"它的气点着煤炭，有火焰从它口中发出。"],[22,"它颈项中存着劲力，在它面前的都恐吓蹦跳。"],[23,"它的肉块互相联络，紧贴其身，不能摇动。"],[24,"它的心结实如石头，如下磨石那样结实。"],[25,"它一起来，勇士都惊恐，心里慌乱，便都昏迷。"],[26,"人若用刀，用枪，用标枪，用尖枪扎它，都是无用。"],[27,"它以铁为干草，以铜为烂木。"],[28,"箭不能恐吓它使它逃避，弹石在它看为碎秸，"],[29,"棍棒算为禾秸；它嗤笑短枪飕的响声。"],[30,"它肚腹下如尖瓦片，它如钉耙经过淤泥。"],[31,"它使深渊开滚如锅，使洋海如锅中的膏油。"],[32,"它行的路随后发光，令人想深渊如同白发。"],[33,"在地上没有像它造的那样无所惧怕。"],[34,"凡高大的，它无不藐视，它在骄傲的水族上作王。”"]]},{"n":42,"v":[[1,"约伯回答耶和华说："],[2,"“我知道你万事都能作，你的旨意不能拦阻。"],[3,"谁用无知的言语使你的旨意隐藏呢？我所说的是我不明白的；这些事太奇妙是我不知道的。"],[4,"求你听我，我要说话；我问你，求你指示我。"],[5,"我从前风闻有你，现在亲眼看见你。"],[6,"因此我厌恶自己（“自己”或作“我的言语”），在尘土和炉灰中懊悔。”"],[7,"耶和华对约伯说话以后，就对提幔人以利法说：“我的怒气向你和你两个朋友发作，因为你们议论我不如我的仆人约伯说的是。"],[8,"现在你们要取七只公牛，七只公羊，到我仆人约伯那里去，为自己献上燔祭，我的仆人约伯就为你们祈祷。我因悦纳他，就不按你们的愚妄办你们。你们议论我，不如我的仆人约伯说的是。”"],[9,"于是提幔人以利法、书亚人比勒达、拿玛人琐法，照着耶和华所吩咐的去行。耶和华就悦纳约伯。"],[10,"约伯为他的朋友祈祷，耶和华就使约伯从苦境转回（“苦境”原文作“掳掠”），并且耶和华赐给他的比他从前所有的加倍。"],[11,"约伯的弟兄姐妹和以先所认识的人都来见他，在他家里一同吃饭，又论到耶和华所降与他的一切灾祸，都为他悲伤安慰他，每人也送他一块银子和一个金环。"],[12,"这样，耶和华后来赐福给约伯比先前更多。他有一万四千羊，六千骆驼，一千对牛，一千母驴。"],[13,"他也有七个儿子，三个女儿。"],[14,"他给长女起名叫耶米玛，次女叫基洗亚，三女叫基连哈朴。"],[15,"在那全地的妇女中，找不着像约伯的女儿那样美貌。他们的父亲使她们在弟兄中得产业。"],[16,"此后，约伯又活了一百四十年，得见他的儿孙，直到四代。"],[17,"这样，约伯年纪老迈，日子满足而死。"]]}]},{"name":"箴言","chapters":[{"n":1,"v":[[1,"以色列王大卫儿子所罗门的箴言："],[2,"要使人晓得智慧和训诲，分辨通达的言语，"],[3,"使人处事领受智慧、仁义、公平、正直的训诲，"],[4,"使愚人灵明，使少年人有知识和谋略，"],[5,"使智慧人听见，增长学问，使聪明人得着智谋，"],[6,"使人明白箴言和譬喻，懂得智慧人的言词和谜语。"],[7,"敬畏耶和华是知识的开端，愚妄人藐视智慧和训诲。"],[8,"我儿，要听你父亲的训诲，不可离弃你母亲的法则（或作“指教”），"],[9,"因为这要作你头上的华冠，你项上的金链。"],[10,"我儿，恶人若引诱你，你不可随从。"],[11,"他们若说：“你与我们同去，我们要埋伏流人之血，要蹲伏害无罪之人。"],[12,"我们好像阴间，把他们活活吞下；他们如同下坑的人，被我们囫囵吞了。"],[13,"我们必得各样宝物，将所掳来的装满房屋。"],[14,"你与我们大家同分，我们共享一个囊袋。”"],[15,"我儿，不要与他们同行一道，禁止你脚走他们的路，"],[16,"因为他们的脚奔跑行恶，他们急速流人的血，"],[17,"好像飞鸟，网罗设在眼前仍不躲避。"],[18,"这些人埋伏，是为自流己血，蹲伏，是为自害己命。"],[19,"凡贪恋财利的，所行之路都是如此。这贪恋之心乃夺去得财者之命。"],[20,"智慧在街市上呼喊，在宽阔处发声，"],[21,"在热闹街头喊叫，在城门口、在城中发出言语，"],[22,"说：“你们愚昧人喜爱愚昧，亵慢人喜欢亵慢，愚顽人恨恶知识，要到几时呢？"],[23,"你们当因我的责备回转，我要将我的灵浇灌你们，将我的话指示你们。"],[24,"我呼唤，你们不肯听从；我伸手，无人理会。"],[25,"反轻弃我一切的劝戒，不肯受我的责备。"],[26,"你们遭灾难，我就发笑；惊恐临到你们，我必嗤笑。"],[27,"惊恐临到你们，好像狂风，灾难来到，如同暴风，急难痛苦临到你们身上。"],[28,"那时，你们必呼求我，我却不答应，恳切地寻找我，却寻不见。"],[29,"因为你们恨恶知识，不喜爱敬畏耶和华，"],[30,"不听我的劝戒，藐视我一切的责备，"],[31,"所以必吃自结的果子，充满自设的计谋。"],[32,"愚昧人背道，必杀己身；愚顽人安逸，必害己命。"],[33,"惟有听从我的，必安然居住，得享安静，不怕灾祸。”"]]},{"n":2,"v":[[1,"我儿，你若领受我的言语，存记我的命令，"],[2,"侧耳听智慧，专心求聪明，"],[3,"呼求明哲，扬声求聪明，"],[4,"寻找它，如寻找银子；搜求它，如搜求隐藏的珍宝，"],[5,"你就明白敬畏耶和华，得以认识神。"],[6,"因为耶和华赐人智慧，知识和聪明都由他口而出。"],[7,"他给正直人存留真智慧，给行为纯正的人作盾牌，"],[8,"为要保守公平人的路，护庇虔敬人的道。"],[9,"你也必明白仁义、公平、正直，一切的善道。"],[10,"智慧必入你心，你的灵要以知识为美。"],[11,"谋略必护卫你，聪明必保守你，"],[12,"要救你脱离恶道（或作“恶人的道”），脱离说乖谬话的人。"],[13,"那等人舍弃正直的路，行走黑暗的道，"],[14,"欢喜作恶，喜爱恶人的乖僻，"],[15,"在他们的道中弯曲，在他们的路上偏僻。"],[16,"智慧要救你脱离淫妇，就是那油嘴滑舌的外女。"],[17,"她离弃幼年的配偶，忘了神的盟约。"],[18,"她的家陷入死地，她的路偏向阴间。"],[19,"凡到她那里去的，不得转回，也得不着生命的路。"],[20,"智慧必使你行善人的道，守义人的路。"],[21,"正直人必在世上居住，完全人必在地上存留。"],[22,"惟有恶人必然剪除，奸诈的必然拔出。"]]},{"n":3,"v":[[1,"我儿，不要忘记我的法则（或作“指教”），你心要谨守我的诫命。"],[2,"因为他必将长久的日子、生命的年数与平安加给你。"],[3,"不可使慈爱、诚实离开你，要系在你颈项上，刻在你心版上。"],[4,"这样，你必在神和世人眼前蒙恩宠，有聪明。"],[5,"你要专心仰赖耶和华，不可倚靠自己的聪明，"],[6,"在你一切所行的事上都要认定他，他必指引你的路。"],[7,"不要自以为有智慧，要敬畏耶和华，远离恶事。"],[8,"这便医治你的肚脐，滋润你的百骨。"],[9,"你要以财物和一切初熟的土产尊荣耶和华。"],[10,"这样，你的仓房必充满有余，你的酒醡有新酒盈溢。"],[11,"我儿，你不可轻看耶和华的管教（或作“惩治”），也不可厌烦他的责备。"],[12,"因为耶和华所爱的，他必责备，正如父亲责备所喜爱的儿子。"],[13,"得智慧、得聪明的，这人便为有福。"],[14,"因为得智慧胜过得银子，其利益强如精金，"],[15,"比珍珠（或作“红宝石”）宝贵，你一切所喜爱的，都不足与比较。"],[16,"她右手有长寿，左手有富贵。"],[17,"她的道是安乐，她的路全是平安。"],[18,"她与持守她的作生命树，持定她的俱各有福。"],[19,"耶和华以智慧立地，以聪明定天；"],[20,"以知识使深渊裂开，使天空滴下甘露。"],[21,"我儿，要谨守真智慧和谋略，不可使她离开你的眼目。"],[22,"这样，她必作你的生命，颈项的美饰。"],[23,"你就坦然行路，不至碰脚。"],[24,"你躺下，必不惧怕；你躺卧，睡得香甜。"],[25,"忽然来的惊恐，不要害怕，恶人遭毁灭，也不要恐惧，"],[26,"因为耶和华是你所倚靠的，他必保守你的脚不陷入网罗。"],[27,"你手若有行善的力量，不可推辞，就当向那应得的人施行。"],[28,"你那里若有现成的，不可对邻舍说：“去吧！明天再来，我必给你。”"],[29,"你的邻舍既在你附近安居，你不可设计害他。"],[30,"人未曾加害与你，不可无故与他相争。"],[31,"不可嫉妒强暴的人，也不可选择他所行的路，"],[32,"因为乖僻人为耶和华所憎恶，正直人为他所亲密。"],[33,"耶和华咒诅恶人的家庭，赐福与义人的居所。"],[34,"他讥诮那好讥诮的人，赐恩给谦卑的人。"],[35,"智慧人必承受尊荣，愚昧人高升也成为羞辱。"]]},{"n":4,"v":[[1,"众子啊，要听父亲的教训，留心得知聪明。"],[2,"因我所给你们的是好教训：不可离弃我的法则（或作“指教”）。"],[3,"我在父亲面前为孝子，在母亲眼中为独一的娇儿。"],[4,"父亲教训我说：“你心要存记我的言语，遵守我的命令，便得存活。"],[5,"要得智慧，要得聪明，不可忘记，也不可偏离我口中的言语。"],[6,"不可离弃智慧，智慧就护卫你，要爱她，她就保守你。"],[7,"智慧为首，所以要得智慧，在你一切所得之内必得聪明（或作“用你一切所得的去换聪明”）。"],[8,"高举智慧，她就使你高升；怀抱智慧，她就使你尊荣。"],[9,"她必将华冠加在你头上，把荣冕交给你。”"],[10,"我儿，你要听受我的言语，就必延年益寿。"],[11,"我已指教你走智慧的道，引导你行正直的路。"],[12,"你行走，脚步必不至狭窄；你奔跑，也不至跌倒。"],[13,"要持定训诲，不可放松，必当谨守，因为她是你的生命。"],[14,"不可行恶人的路，不要走坏人的道。"],[15,"要躲避，不可经过，要转身而去。"],[16,"这等人若不行恶，不得睡觉；不使人跌倒，睡卧不安。"],[17,"因为他们以奸恶吃饼，以强暴喝酒。"],[18,"但义人的路好像黎明的光，越照越明，直到日午。"],[19,"恶人的道好像幽暗，自己不知因什么跌倒。"],[20,"我儿，要留心听我的言词，侧耳听我的话语。"],[21,"都不可离你的眼目，要存记在你心中。"],[22,"因为得着它的，就得了生命，又得了医全体的良药。"],[23,"你要保守你心，胜过保守一切（或作“你要切切保守你心”），因为一生的果效，是由心发出。"],[24,"你要除掉邪僻的口，弃绝乖谬的嘴。"],[25,"你的眼目要向前正看，你的眼睛（原文作“皮”）当向前直观。"],[26,"要修平你脚下的路，坚定你一切的道，"],[27,"不可偏向左右，要使你的脚离开邪恶。"]]},{"n":5,"v":[[1,"我儿，要留心我智慧的话语，侧耳听我聪明的言词，"],[2,"为要使你谨守谋略，嘴唇保存知识。"],[3,"因为淫妇的嘴滴下蜂蜜，她的口比油更滑，"],[4,"至终却苦似茵陈，快如两刃的刀。"],[5,"她的脚下入死地，她脚步踏住阴间，"],[6,"以致她找不着生命平坦的道。她的路变迁不定，自己还不知道。"],[7,"众子啊，现在要听从我，不可离弃我口中的话，"],[8,"你所行的道要离她远，不可就近她的房门。"],[9,"恐怕将你的尊荣给别人，将你的岁月给残忍的人；"],[10,"恐怕外人满得你的力量，你劳碌得来的，归入外人的家。"],[11,"终久，你皮肉和身体消毁，你就悲叹，"],[12,"说：“我怎么恨恶训诲，心中藐视责备，"],[13,"也不听从我师傅的话，又不侧耳听那教训我的人？"],[14,"我在圣会里，几乎落在诸般恶中。”"],[15,"你要喝自己池中的水，饮自己井里的活水。"],[16,"你的泉源岂可涨溢在外？你的河水岂可流在街上？"],[17,"惟独归你一人，不可与外人同用。"],[18,"要使你的泉源蒙福，要喜悦你幼年所娶的妻。"],[19,"她如可爱的麀鹿，可喜的母鹿。愿她的胸怀使你时时知足，她的爱情使你常常恋慕。"],[20,"我儿，你为何恋慕淫妇？为何抱外女的胸怀？"],[21,"因为人所行的道都在耶和华眼前，他也修平人一切的路。"],[22,"恶人必被自己的罪孽捉住，他必被自己的罪恶如绳索缠绕。"],[23,"他因不受训诲，就必死亡，又因愚昧过甚，必走差了路。"]]},{"n":6,"v":[[1,"我儿，你若为朋友作保，替外人击掌，"],[2,"你就被口中的话语缠住，被嘴里的言语捉住。"],[3,"我儿，你既落在朋友手中，就当这样行，才可救自己：你要自卑，去恳求你的朋友。"],[4,"不要容你的眼睛睡觉，不要容你的眼皮打盹。"],[5,"要救自己，如鹿脱离猎户的手，如鸟脱离捕鸟人的手。"],[6,"懒惰人哪，你去察看蚂蚁的动作，就可得智慧。"],[7,"蚂蚁没有元帅，没有官长，没有君王，"],[8,"尚且在夏天预备食物，在收割时聚敛粮食。"],[9,"懒惰人哪，你要睡到几时呢？你何时睡醒呢？"],[10,"再睡片时，打盹片时，抱着手躺卧片时，"],[11,"你的贫穷就必如强盗速来，你的缺乏彷佛拿兵器的人来到。"],[12,"无赖的恶徒，行动就用乖僻的口，"],[13,"用眼传神，用脚示意，用指点划，"],[14,"心中乖僻，常设恶谋，布散纷争。"],[15,"所以灾难必忽然临到他身，他必顷刻败坏，无法可治。"],[16,"耶和华所恨恶的有六样，连他心所憎恶的共有七样，"],[17,"就是高傲的眼，撒谎的舌，流无辜人血的手，"],[18,"图谋恶计的心，飞跑行恶的脚，"],[19,"吐谎言的假见证，并弟兄中布散纷争的人。"],[20,"我儿，要谨守你父亲的诫命，不可离弃你母亲的法则（或作“指教”），"],[21,"要常系在你心上，挂在你项上。"],[22,"你行走，它必引导你；你躺卧，它必保守你；你睡醒，它必与你谈论。"],[23,"因为诫命是灯，法则（或作“指教”）是光，训诲的责备是生命的道，"],[24,"能保你远离恶妇，远离外女谄媚的舌头。"],[25,"你心中不要恋慕她的美色，也不要被她眼皮勾引。"],[26,"因为妓女能使人只剩一块饼，淫妇猎取人宝贵的生命。"],[27,"人若怀里搋火，衣服岂能不烧呢？"],[28,"人若在火炭上走，脚岂能不烫呢？"],[29,"亲近邻舍之妻的，也是如此，凡挨近她的，不免受罚。"],[30,"贼因饥饿偷窃充饥，人不藐视他，"],[31,"若被找着，他必赔还七倍，必将家中所有的尽都偿还。"],[32,"与妇人行淫的，便是无知，行这事的，必丧掉生命。"],[33,"他必受伤损，必被凌辱，他的羞耻不得涂抹。"],[34,"因为人的嫉恨，成了烈怒，报仇的时候，决不留情，"],[35,"什么赎价，他都不顾，你虽送许多礼物，他也不肯干休。"]]},{"n":7,"v":[[1,"我儿，你要遵守我的言语，将我的命令存记在心。"],[2,"遵守我的命令就得存活。保守我的法则（或作“指教”），好像保守眼中的瞳人，"],[3,"系在你指头上，刻在你心版上。"],[4,"对智慧说，你是我的姐妹，称呼聪明为你的亲人，"],[5,"她就保你远离淫妇，远离说谄媚话的外女。"],[6,"我曾在我房屋的窗户内，从我窗棂之间往外观看，"],[7,"见愚蒙人内，少年人中，分明有一个无知的少年人，"],[8,"从街上经过，走近淫妇的巷口，直往通她家的路去。"],[9,"在黄昏，或晚上，或半夜，或黑暗之中。"],[10,"看哪，有一个妇人来迎接他，是妓女的打扮，有诡诈的心思。"],[11,"这妇人喧嚷，不守约束，在家里停不住脚，"],[12,"有时在街市上，有时在宽阔处，或在各巷口蹲伏，"],[13,"拉住那少年人，与他亲嘴，脸无羞耻对他说："],[14,"“平安祭在我这里，今日才还了我所许的愿。"],[15,"因此，我出来迎接你，恳切求见你的面，恰巧遇见了你。"],[16,"我已经用绣花毯子和埃及线织的花纹布铺了我的床。"],[17,"我又用没药、沉香、桂皮薰了我的榻。"],[18,"你来，我们可以饱享爱情，直到早晨，我们可以彼此亲爱欢乐。"],[19,"因为我丈夫不在家，出门行远路，"],[20,"他手拿银囊，必到月望才回家。”"],[21,"淫妇用许多巧言诱他随从，用谄媚的嘴逼他同行。"],[22,"少年人立刻跟随她，好像牛往宰杀之地，又像愚昧人带锁链去受刑罚，"],[23,"直等箭穿他的肝，如同雀鸟急入网罗，却不知是自丧己命。"],[24,"众子啊，现在要听从我，留心听我口中的话。"],[25,"你的心不可偏向淫妇的道，不要入她的迷途。"],[26,"因为被她伤害仆倒的不少，被她杀戮的而且甚多。"],[27,"她的家是在阴间之路，下到死亡之宫。"]]},{"n":8,"v":[[1,"智慧岂不呼叫？聪明岂不发声？"],[2,"她在道旁高处的顶上，在十字路口站立。"],[3,"在城门旁，在城门口，在城门洞，大声说："],[4,"“众人哪，我呼叫你们，我向世人发声，"],[5,"说：愚蒙人哪，你们要会悟灵明；愚昧人哪，你们当心里明白。"],[6,"你们当听，因我要说极美的话，我张嘴要论正直的事。"],[7,"我的口要发出真理，我的嘴憎恶邪恶。"],[8,"我口中的言语都是公义，并无弯曲乖僻。"],[9,"有聪明的以为明显，得知识的以为正直。"],[10,"你们当受我的教训，不受白银，宁得知识，胜过黄金。"],[11,"因为智慧比珍珠（或作“红宝石”）更美，一切可喜爱的，都不足与比较。"],[12,"“我智慧以灵明为居所，又寻得知识和谋略。"],[13,"敬畏耶和华，在乎恨恶邪恶。那骄傲、狂妄并恶道，以及乖谬的口，都为我所恨恶。"],[14,"我有谋略和真知识，我乃聪明，我有能力。"],[15,"帝王藉我坐国位，君王藉我定公平。"],[16,"王子和首领，世上一切的审判官，都是藉我掌权。"],[17,"爱我的，我也爱他；恳切寻求我的，必寻得见。"],[18,"丰富尊荣在我，恒久的财并公义也在我。"],[19,"我的果实胜过黄金，强如精金；我的出产超乎高银。"],[20,"我在公义的道上走，在公平的路中行，"],[21,"使爱我的承受货财，并充满他们的府库。”"],[22,"“在耶和华造化的起头，在太初创造万物之先，就有了我。"],[23,"从亘古，从太初，未有世界以前，我已被立。"],[24,"没有深渊，没有大水的泉源，我已生出。"],[25,"大山未曾奠定，小山未有之先，我已生出。"],[26,"耶和华还没有创造大地和田野，并世上的土质，我已生出。"],[27,"他立高天，我在那里；他在渊面的周围划出圆圈，"],[28,"上使穹苍坚硬，下使渊源稳固，"],[29,"为沧海定出界限，使水不越过他的命令，立定大地的根基。"],[30,"那时，我在他那里为工师，日日为他所喜爱，常常在他面前踊跃，"],[31,"踊跃在他为人预备可住之地，也喜悦住在世人之间。"],[32,"众子啊，现在要听从我，因为谨守我道的，便为有福。"],[33,"要听教训，就得智慧，不可弃绝。"],[34,"听从我，日日在我门口仰望，在我门框旁边等候的，那人便为有福。"],[35,"因为寻得我的，就寻得生命，也必蒙耶和华的恩惠。"],[36,"得罪我的，却害了自己的性命；恨恶我的，都喜爱死亡。”"]]},{"n":9,"v":[[1,"智慧建造房屋，凿成七根柱子，"],[2,"宰杀牲畜，调和旨酒，设摆筵席。"],[3,"打发使女出去，自己在城中至高处呼叫，"],[4,"说：“谁是愚蒙人，可以转到这里来！”又对那无知的人说："],[5,"“你们来，吃我的饼，喝我调和的酒。"],[6,"你们愚蒙人，要舍弃愚蒙，就得存活，并要走光明的道。”"],[7,"指斥亵慢人的必受辱骂，责备恶人的必被玷污。"],[8,"不要责备亵慢人，恐怕他恨你；要责备智慧人，他必爱你。"],[9,"教导智慧人，他就越发有智慧；指示义人，他就增长学问。"],[10,"敬畏耶和华是智慧的开端，认识至圣者便是聪明。"],[11,"你藉着我，日子必增多，年岁也必加添。"],[12,"你若有智慧，是与自己有益；你若亵慢，就必独自担当。"],[13,"愚昧的妇人喧嚷，她是愚蒙，一无所知。"],[14,"她坐在自己的家门口，坐在城中高处的座位上，"],[15,"呼叫过路的，就是直行其道的人，"],[16,"说：“谁是愚蒙人，可以转到这里来！”又对那无知的人说："],[17,"“偷来的水是甜的，暗吃的饼是好的。”"],[18,"人却不知有阴魂在她那里，她的客在阴间的深处。"]]},{"n":10,"v":[[1,"所罗门的箴言：智慧之子使父亲欢乐；愚昧之子叫母亲担忧。"],[2,"不义之财毫无益处，惟有公义能救人脱离死亡。"],[3,"耶和华不使义人受饥饿，恶人所欲的，他必推开。"],[4,"手懒的，要受贫穷；手勤的，却要富足。"],[5,"夏天聚敛的，是智慧之子；收割时沉睡的，是贻羞之子。"],[6,"福祉临到义人的头；强暴蒙蔽恶人的口。"],[7,"义人的记念被称赞，恶人的名字必朽烂。"],[8,"心中智慧的，必受命令，口里愚妄的，必致倾倒；"],[9,"行正直路的，步步安稳，走弯曲道的，必致败露；"],[10,"以眼传神的，使人忧患，口里愚妄的，必致倾倒。"],[11,"义人的口是生命的泉源，强暴蒙蔽恶人的口。"],[12,"恨，能挑启争端，爱，能遮掩一切过错。"],[13,"明哲人嘴里有智慧，无知人背上受刑杖。"],[14,"智慧人积存知识，愚妄人的口速致败坏。"],[15,"富户的财物是他的坚城，穷人的贫乏是他的败坏。"],[16,"义人的勤劳致生；恶人的进项致死（“死”原文作“罪”）。"],[17,"谨守训诲的，乃在生命的道上，违弃责备的，便失迷了路。"],[18,"隐藏怨恨的，有说谎的嘴，口出谗谤的，是愚妄的人。"],[19,"多言多语难免有过，禁止嘴唇是有智慧。"],[20,"义人的舌乃似高银；恶人的心所值无几。"],[21,"义人的口教养多人，愚昧人因无知而死亡。"],[22,"耶和华所赐的福，使人富足，并不加上忧虑。"],[23,"愚妄人以行恶为戏耍，明哲人却以智慧为乐。"],[24,"恶人所怕的必临到他，义人所愿的必蒙应允。"],[25,"暴风一过，恶人归于无有，义人的根基却是永久。"],[26,"懒惰人叫差他的人如醋倒牙，如烟薰目。"],[27,"敬畏耶和华使人日子加多，但恶人的年岁必被减少。"],[28,"义人的盼望必得喜乐；恶人的指望必致灭没。"],[29,"耶和华的道是正直人的保障，却成了作孽人的败坏。"],[30,"义人永不挪移，恶人不得住在地上。"],[31,"义人的口滋生智慧，乖谬的舌必被割断。"],[32,"义人的嘴能令人喜悦，恶人的口说乖谬的话。"]]},{"n":11,"v":[[1,"诡诈的天平为耶和华所憎恶；公平的法码为他所喜悦。"],[2,"骄傲来，羞耻也来，谦逊人却有智慧。"],[3,"正直人的纯正必引导自己；奸诈人的乖僻必毁灭自己。"],[4,"发怒的日子，资财无益；惟有公义能救人脱离死亡。"],[5,"完全人的义必指引他的路，但恶人必因自己的恶跌倒。"],[6,"正直人的义必拯救自己，奸诈人必陷在自己的罪孽中。"],[7,"恶人一死，他的指望必灭绝，罪人的盼望，也必灭没。"],[8,"义人得脱离患难，有恶人来代替他。"],[9,"不虔敬的人用口败坏邻舍，义人却因知识得救。"],[10,"义人享福，合城喜乐；恶人灭亡，人都欢呼。"],[11,"城因正直人祝福便高举，却因邪恶人的口就倾覆。"],[12,"藐视邻舍的，毫无智慧，明哲人却静默不言。"],[13,"往来传舌的，泄漏密事；心中诚实的，遮隐事情。"],[14,"无智谋，民就败落；谋士多，人便安居。"],[15,"为外人作保的，必受亏损；恨恶击掌的，却得安稳。"],[16,"恩德的妇女得尊荣，强暴的男子得资财。"],[17,"仁慈的人善待自己；残忍的人扰害己身。"],[18,"恶人经营，得虚浮的工价；撒义种的，得实在的果效。"],[19,"恒心为义的，必得生命；追求邪恶的，必致死亡。"],[20,"心中乖僻的，为耶和华所憎恶，行事完全的，为他所喜悦。"],[21,"恶人虽然连手，必不免受罚，义人的后裔，必得拯救。"],[22,"妇女美貌而无见识，如同金环带在猪鼻上。"],[23,"义人的心愿尽得好处，恶人的指望致干忿怒。"],[24,"有施散的，却更增添，有吝惜过度的，反致穷乏。"],[25,"好施舍的，必得丰裕；滋润人的，必得滋润。"],[26,"屯粮不卖的，民必咒诅他，情愿出卖的，人必为他祝福。"],[27,"恳切求善的，就求得恩惠，惟独求恶的，恶必临到他身。"],[28,"倚仗自己财物的，必跌倒，义人必发旺如青叶。"],[29,"扰害己家的，必承受清风，愚昧人必作慧心人的仆人。"],[30,"义人所结的果子就是生命树，有智慧的必能得人。"],[31,"看哪，义人在世尚且受报，何况恶人和罪人呢？"]]},{"n":12,"v":[[1,"喜爱管教的，就是喜爱知识；恨恶责备的，却是畜类。"],
