<script>
const BIBLE=[{"name":"创世记","chapters":[{"n":1,"v":[[1,"起初神创造天地。"],[2,"地是空虚混沌，渊面黑暗；神的灵运行在水面上。"],[3,"神说：“要有光”，就有了光。"],[4,"神看光是好的，就把光暗分开了。"],[5,"神称光为昼，称暗为夜。有晚上，有早晨，这是头一日。"],[6,"神说：“诸水之间要有空气，将水分为上下。”"],[7,"神就造出空气，将空气以下的水、空气以上的水分开了。事就这样成了。"],[8,"神称空气为天。有晚上，有早晨，是第二日。"],[9,"神说：“天下的水要聚在一处，使旱地露出来。”事就这样成了。"],[10,"神称旱地为地，称水的聚处为海。神看着是好的。"],[11,"神说：“地要发生青草和结种子的菜蔬，并结果子的树木，各从其类，果子都包着核。”事就这样成了。"],[12,"于是地发生了青草和结种子的菜蔬，各从其类；并结果子的树木，各从其类，果子都包着核。神看着是好的。"],[13,"有晚上，有早晨，是第三日。"],[14,"神说：“天上要有光体，可以分昼夜，作记号，定节令、日子、年岁，"],[15,"并要发光在天空，普照在地上。”事就这样成了。"],[16,"于是神造了两个大光，大的管昼，小的管夜，又造众星，"],[17,"就把这些光摆列在天空，普照在地上，"],[18,"管理昼夜，分别明暗。神看着是好的。"],[19,"有晚上，有早晨，是第四日。"],[20,"神说：“水要多多滋生有生命的物，要有雀鸟飞在地面以上，天空之中。”"],[21,"神就造出大鱼和水中所滋生各样有生命的动物，各从其类；又造出各样飞鸟，各从其类。神看着是好的。"],[22,"神就赐福给这一切说：“滋生繁多，充满海中的水；雀鸟也要多生在地上。”"],[23,"有晚上，有早晨，是第五日。"],[24,"神说：“地要生出活物来，各从其类；牲畜、昆虫、野兽，各从其类。”事就这样成了。"],[25,"于是神造出野兽，各从其类；牲畜，各从其类；地上一切昆虫，各从其类。神看着是好的。"],[26,"神说：“我们要照着我们的形像，按着我们的样式造人，使他们管理海里的鱼、空中的鸟、地上的牲畜和全地，并地上所爬的一切昆虫。”"],[27,"神就照着自己的形像造人，乃是照着他的形像造男造女。"],[28,"神就赐福给他们，又对他们说：“要生养众多，遍满地面，治理这地；也要管理海里的鱼、空中的鸟，和地上各样行动的活物。”"],[29,"神说：“看哪，我将遍地上一切结种子的菜蔬，和一切树上所结有核的果子，全赐给你们作食物。"],[30,"至于地上的走兽和空中的飞鸟，并各样爬在地上有生命的物，我将青草赐给它们作食物。”事就这样成了。"],[31,"神看着一切所造的都甚好。有晚上，有早晨，是第六日。"]]},{"n":2,"v":[[1,"天地万物都造齐了。"],[2,"到第七日，神造物的工已经完毕，就在第七日歇了他一切的工，安息了。"],[3,"神赐福给第七日，定为圣日，因为在这日神歇了他一切创造的工，就安息了。"],[4,"创造天地的来历，在耶和华神造天地的日子，乃是这样："],[5,"野地还没有草木，田间的菜蔬还没有长起来，因为耶和华神还没有降雨在地上，也没有人耕地，"],[6,"但有雾气从地上腾，滋润遍地。"],[7,"耶和华神用地上的尘土造人，将生气吹在他鼻孔里，他就成了有灵的活人，名叫亚当。"],[8,"耶和华神在东方的伊甸立了一个园子，把所造的人安置在那里。"],[9,"耶和华神使各样的树从地里长出来，可以悦人的眼目，其上的果子好作食物。园子当中又有生命树和分别善恶的树。"],[10,"有河从伊甸流出来滋润那园子，从那里分为四道："],[11,"第一道名叫比逊，就是环绕哈腓拉全地的。在那里有金子，"],[12,"并且那地的金子是好的；在那里又有珍珠和红玛瑙。"],[13,"第二道河名叫基训，就是环绕古实全地的。"],[14,"第三道河名叫底格里斯，流在亚述的东边。第四道河就是幼发拉底河。"],[15,"耶和华神将那人安置在伊甸园，使他修理看守。"],[16,"耶和华神吩咐他说：“园中各样树上的果子，你可以随意吃，"],[17,"只是分别善恶树上的果子，你不可吃，因为你吃的日子必定死。”"],[18,"耶和华神说：“那人独居不好，我要为他造一个配偶帮助他。”"],[19,"耶和华神用土所造成的野地各样走兽和空中各样飞鸟都带到那人面前，看他叫什么。那人怎样叫各样的活物，那就是它的名字。"],[20,"那人便给一切牲畜和空中飞鸟、野地走兽都起了名，只是那人没有遇见配偶帮助他。"],[21,"耶和华神使他沉睡，他就睡了；于是取下他的一条肋骨，又把肉合起来。"],[22,"耶和华神就用那人身上所取的肋骨造成一个女人，领她到那人跟前。"],[23,"那人说：“这是我骨中的骨，肉中的肉，可以称她为女人，因为她是从男人身上取出来的。”"],[24,"因此，人要离开父母与妻子连合，二人成为一体。"],[25,"当时夫妻二人赤身露体并不羞耻。"]]},{"n":3,"v":[[1,"耶和华神所造的，惟有蛇比田野一切的活物更狡猾。蛇对女人说：“神岂是真说不许你们吃园中所有树上的果子吗？”"],[2,"女人对蛇说：“园中树上的果子，我们可以吃；"],[3,"惟有园当中那棵树上的果子，神曾说：‘你们不可吃，也不可摸，免得你们死。’”"],[4,"蛇对女人说：“你们不一定死，"],[5,"因为神知道，你们吃的日子眼睛就明亮了，你们便如神能知道善恶。”"],[6,"于是，女人见那棵树的果子好作食物，也悦人的眼目，且是可喜爱的，能使人有智慧，就摘下果子来吃了；又给她丈夫，她丈夫也吃了。"],[7,"他们二人的眼睛就明亮了，才知道自己是赤身露体，便拿无花果树的叶子，为自己编作裙子。"],[8,"天起了凉风，耶和华神在园中行走。那人和他妻子听见神的声音，就藏在园里的树木中，躲避耶和华神的面。"],[9,"耶和华神呼唤那人，对他说：“你在哪里？”"],[10,"他说：“我在园中听见你的声音，我就害怕，因为我赤身露体，我便藏了。”"],[11,"耶和华说：“谁告诉你赤身露体呢？莫非你吃了我吩咐你不可吃的那树上的果子吗？”"],[12,"那人说：“你所赐给我、与我同居的女人，她把那树上的果子给我，我就吃了。”"],[13,"耶和华神对女人说：“你作的是什么事呢？”女人说：“那蛇引诱我，我就吃了。”"],[14,"耶和华神对蛇说：“你既作了这事，就必受咒诅，比一切的牲畜野兽更甚；你必用肚子行走，终身吃土。"],[15,"我又要叫你和女人彼此为仇；你的后裔和女人的后裔也彼此为仇。女人的后裔要伤你的头；你要伤他的脚跟。”"],[16,"又对女人说：“我必多多加增你怀胎的苦楚，你生产儿女必多受苦楚。你必恋慕你丈夫，你丈夫必管辖你。”"],[17,"又对亚当说：“你既听从妻子的话，吃了我所吩咐你不可吃的那树上的果子，地必为你的缘故受咒诅。你必终身劳苦，才能从地里得吃的。"],[18,"地必给你长出荆棘和蒺藜来，你也要吃田间的菜蔬。"],[19,"你必汗流满面才得糊口，直到你归了土；因为你是从土而出的。你本是尘土，仍要归于尘土。”"],[20,"亚当给他妻子起名叫夏娃，因为她是众生之母。"],[21,"耶和华神为亚当和他妻子用皮子作衣服给他们穿。"],[22,"耶和华神说：“那人已经与我们相似，能知道善恶。现在恐怕他伸手又摘生命树的果子吃，就永远活着。”"],[23,"耶和华神便打发他出伊甸园去，耕种他所自出之土。"],[24,"于是把他赶出去了。又在伊甸园的东边安设基路伯，和四面转动发火焰的剑，要把守生命树的道路。"]]},{"n":4,"v":[[1,"有一日，那人和他妻子夏娃同房，夏娃就怀孕，生了该隐（就是“得”的意思），便说：“耶和华使我得了一个男子。”"],[2,"又生了该隐的兄弟亚伯。亚伯是牧羊的，该隐是种地的。"],[3,"有一日，该隐拿地里的出产为供物献给耶和华；"],[4,"亚伯也将他羊群中头生的和羊的脂油献上。耶和华看中了亚伯和他的供物，"],[5,"只是看不中该隐和他的供物。该隐就大大地发怒，变了脸色。"],[6,"耶和华对该隐说：“你为什么发怒呢？你为什么变了脸色呢？"],[7,"你若行得好，岂不蒙悦纳？你若行得不好，罪就伏在门前。它必恋慕你，你却要制伏它。”"],[8,"该隐与他兄弟亚伯说话，二人正在田间，该隐起来打他兄弟亚伯，把他杀了。"],[9,"耶和华对该隐说：“你兄弟亚伯在哪里？”他说：“我不知道！我岂是看守我兄弟的吗？”"],[10,"耶和华说：“你作了什么事呢？你兄弟的血有声音从地里向我哀告。"],[11,"地开了口，从你手里接受你兄弟的血。现在你必从这地受咒诅。"],[12,"你种地，地不再给你效力，你必流离飘荡在地上。”"],[13,"该隐对耶和华说：“我的刑罚太重，过于我所能当的。"],[14,"你如今赶逐我离开这地，以致不见你面。我必流离飘荡在地上，凡遇见我的必杀我。”"],[15,"耶和华对他说：“凡杀该隐的，必遭报七倍。”耶和华就给该隐立一个记号，免得人遇见他就杀他。"],[16,"于是该隐离开耶和华的面，去住在伊甸东边挪得之地。"],[17,"该隐与妻子同房，他妻子就怀孕，生了以诺。该隐建造了一座城，就按着他儿子的名，将那城叫作以诺。"],[18,"以诺生以拿；以拿生米户雅利；米户雅利生玛土撒利；玛土撒利生拉麦。"],[19,"拉麦娶了两个妻，一个名叫亚大，一个名叫洗拉。"],[20,"亚大生雅八，雅八就是住帐棚牧养牲畜之人的祖师。"],[21,"雅八的兄弟名叫犹八，他是一切弹琴吹箫之人的祖师。"],[22,"洗拉又生了土八该隐，他是打造各样铜铁利器的（或作“是铜匠、铁匠的祖师”）。土八该隐的妹子是拿玛。"],[23,"拉麦对他两个妻子说：“亚大、洗拉，听我的声音；拉麦的妻子细听我的话语：壮年人伤我，我把他杀了；少年人损我，我把他害了（或作“我杀壮士却伤自己；我害幼童却损本身”）。"],[24,"若杀该隐，遭报七倍；杀拉麦，必遭报七十七倍。”"],[25,"亚当又与妻子同房，她就生了一个儿子，起名叫塞特，意思说：神另给我立了一个儿子代替亚伯，因为该隐杀了他。"],[26,"塞特也生了一个儿子，起名叫以挪士。那时候，人才求告耶和华的名。"]]},{"n":5,"v":[[1,"亚当的后代记在下面。当神造人的日子，是照着自己的样式造的；"],[2,"并且造男造女。在他们被造的日子，神赐福给他们，称他们为人。"],[3,"亚当活到一百三十岁，生了一个儿子，形像样式和自己相似，就给他起名叫塞特。"],[4,"亚当生塞特之后，又在世八百年，并且生儿养女。"],[5,"亚当共活了九百三十岁就死了。"],[6,"塞特活到一百零五岁，生了以挪士。"],[7,"塞特生以挪士之后，又活了八百零七年，并且生儿养女。"],[8,"塞特共活了九百一十二岁就死了。"],[9,"以挪士活到九十岁，生了该南。"],[10,"以挪士生该南之后，又活了八百一十五年，并且生儿养女。"],[11,"以挪士共活了九百零五岁就死了。"],[12,"该南活到七十岁，生了玛勒列。"],[13,"该南生玛勒列之后，又活了八百四十年，并且生儿养女。"],[14,"该南共活了九百一十岁就死了。"],[15,"玛勒列活到六十五岁，生了雅列。"],[16,"玛勒列生雅列之后，又活了八百三十年，并且生儿养女。"],[17,"玛勒列共活了八百九十五岁就死了。"],[18,"雅列活到一百六十二岁，生了以诺。"],[19,"雅列生以诺之后，又活了八百年，并且生儿养女。"],[20,"雅列共活了九百六十二岁就死了。"],[21,"以诺活到六十五岁，生了玛土撒拉。"],[22,"以诺生玛土撒拉之后，与神同行三百年，并且生儿养女。"],[23,"以诺共活了三百六十五岁。"],[24,"以诺与神同行，神将他取去，他就不在世了。"],[25,"玛土撒拉活到一百八十七岁，生了拉麦。"],[26,"玛土撒拉生拉麦之后，又活了七百八十二年，并且生儿养女。"],[27,"玛土撒拉共活了九百六十九岁就死了。"],[28,"拉麦活到一百八十二岁，生了一个儿子，"],[29,"给他起名叫挪亚，说：“这个儿子必为我们的操作和手中的劳苦安慰我们。这操作劳苦是因为耶和华咒诅地。”"],[30,"拉麦生挪亚之后，又活了五百九十五年，并且生儿养女。"],[31,"拉麦共活了七百七十七岁就死了。"],[32,"挪亚五百岁生了闪、含、雅弗。"]]},{"n":6,"v":[[1,"当人在世上多起来，又生女儿的时候，"],[2,"神的儿子们看见人的女子美貌，就随意挑选，娶来为妻。"],[3,"耶和华说：“人既属乎血气，我的灵就不永远住在他里面，然而他的日子还可到一百二十年。”"],[4,"那时候有伟人在地上。后来神的儿子们和人的女子们交合生子，那就是上古英武有名的人。"],[5,"耶和华见人在地上罪恶很大，终日所思想的尽都是恶，"],[6,"耶和华就后悔造人在地上，心中忧伤。"],[7,"耶和华说：“我要将所造的人和走兽，并昆虫，以及空中的飞鸟，都从地上除灭，因为我造他们后悔了。”"],[8,"惟有挪亚在耶和华眼前蒙恩。"],[9,"挪亚的后代记在下面。挪亚是个义人，在当时的世代是个完全人。挪亚与神同行。"],[10,"挪亚生了三个儿子，就是闪、含、雅弗。"],[11,"世界在神面前败坏，地上满了强暴。"],[12,"神观看世界，见是败坏了；凡有血气的人，在地上都败坏了行为。"],[13,"神就对挪亚说：“凡有血气的人，他的尽头已经来到我面前，因为地上满了他们的强暴，我要把他们和地一并毁灭。"],[14,"你要用歌斐木造一只方舟，分一间一间地造，里外抹上松香。"],[15,"方舟的造法乃是这样：要长三百肘，宽五十肘，高三十肘。"],[16,"方舟上边要留透光处，高一肘。方舟的门要开在旁边。方舟要分上、中、下三层。"],[17,"看哪，我要使洪水泛滥在地上，毁灭天下。凡地上有血肉、有气息的活物，无一不死。"],[18,"我却要与你立约。你同你的妻，与儿子、儿妇，都要进入方舟。"],[19,"凡有血肉的活物，每样两个，一公一母，你要带进方舟，好在你那里保全生命。"],[20,"飞鸟各从其类，牲畜各从其类，地上的昆虫各从其类，每样两个，要到你那里，好保全生命。"],[21,"你要拿各样食物积蓄起来，好作你和它们的食物。”"],[22,"挪亚就这样行。凡神所吩咐的，他都照样行了。"]]},{"n":7,"v":[[1,"耶和华对挪亚说：“你和你的全家都要进入方舟，因为在这世代中，我见你在我面前是义人。"],[2,"凡洁净的畜类，你要带七公七母；不洁净的畜类，你要带一公一母；"],[3,"空中的飞鸟也要带七公七母，可以留种，活在全地上；"],[4,"因为再过七天，我要降雨在地上四十昼夜，把我所造的各种活物都从地上除灭。”"],[5,"挪亚就遵着耶和华所吩咐的行了。"],[6,"当洪水泛滥在地上的时候，挪亚整六百岁。"],[7,"挪亚就同他的妻和儿子、儿妇，都进入方舟，躲避洪水。"],[8,"洁净的畜类和不洁净的畜类，飞鸟并地上一切的昆虫，"],[9,"都是一对一对地，有公有母，到挪亚那里进入方舟，正如神所吩咐挪亚的。"],[10,"过了那七天，洪水泛滥在地上。"],[11,"当挪亚六百岁，二月十七日那一天，大渊的泉源都裂开了，天上的窗户也敞开了。"],[12,"四十昼夜降大雨在地上。"],[13,"正当那日，挪亚和他三个儿子闪、含、雅弗，并挪亚的妻子和三个儿妇，都进入方舟。"],[14,"他们和百兽，各从其类；一切牲畜，各从其类；爬在地上的昆虫，各从其类；一切禽鸟，各从其类，都进入方舟。"],[15,"凡有血肉、有气息的活物，都一对一对地到挪亚那里，进入方舟。"],[16,"凡有血肉进入方舟的，都是有公有母，正如神所吩咐挪亚的。耶和华就把他关在方舟里头。"],[17,"洪水泛滥在地上四十天，水往上长，把方舟从地上漂起。"],[18,"水势浩大，在地上大大地往上长，方舟在水面上漂来漂去。"],[19,"水势在地上极其浩大，天下的高山都淹没了。"],[20,"水势比山高过十五肘，山岭都淹没了。"],[21,"凡在地上有血肉的动物，就是飞鸟、牲畜、走兽，和爬在地上的昆虫，以及所有的人都死了；"],[22,"凡在旱地上、鼻孔有气息的生灵都死了；"],[23,"凡地上各类的活物，连人带牲畜、昆虫，以及空中的飞鸟，都从地上除灭了，只留下挪亚和那些与他同在方舟里的。"],[24,"水势浩大，在地上共一百五十天。"]]},{"n":8,"v":[[1,"神记念挪亚和挪亚方舟里的一切走兽牲畜。神叫风吹地，水势渐落。"],[2,"渊源和天上的窗户都闭塞了，天上的大雨也止住了。"],[3,"水从地上渐退。过了一百五十天，水就渐消。"],[4,"七月十七日，方舟停在亚拉腊山上。"],[5,"水又渐消，到十月初一日，山顶都现出来了。"],[6,"过了四十天，挪亚开了方舟的窗户，"],[7,"放出一只乌鸦去。那乌鸦飞来飞去，直到地上的水都干了。"],[8,"他又放出一只鸽子去，要看看水从地上退了没有。"],[9,"但遍地上都是水，鸽子找不着落脚之地，就回到方舟挪亚那里，挪亚伸手把鸽子接进方舟来。"],[10,"他又等了七天，再把鸽子从方舟放出去。"],[11,"到了晚上，鸽子回到他那里，嘴里叼着一个新拧下来的橄榄叶子，挪亚就知道地上的水退了。"],[12,"他又等了七天，放出鸽子去，鸽子就不再回来了。"],[13,"到挪亚六百零一岁，正月初一日，地上的水都干了。挪亚撤去方舟的盖观看，便见地面上干了。"],[14,"到了二月二十七日，地就都干了。"],[15,"神对挪亚说："],[16,"“你和你的妻子、儿子、儿妇都可以出方舟。"],[17,"在你那里凡有血肉的活物，就是飞鸟、牲畜，和一切爬在地上的昆虫，都要带出来，叫它在地上多多滋生，大大兴旺。”"],[18,"于是挪亚和他的妻子、儿子、儿妇都出来了。"],[19,"一切走兽、昆虫、飞鸟，和地上所有的动物，各从其类，也都出了方舟。"],[20,"挪亚为耶和华筑了一座坛，拿各类洁净的牲畜、飞鸟献在坛上为燔祭。"],[21,"耶和华闻那馨香之气，就心里说：“我不再因人的缘故咒诅地（人从小时心里怀着恶念），也不再按着我才行的，灭各种的活物了。"],[22,"地还存留的时候，稼穑、寒暑、冬夏、昼夜就永不停息了。”"]]},{"n":9,"v":[[1,"神赐福给挪亚和他的儿子，对他们说：“你们要生养众多，遍满了地。"],[2,"凡地上的走兽和空中的飞鸟，都必惊恐、惧怕你们；连地上一切的昆虫并海里一切的鱼，都交付你们的手。"],[3,"凡活着的动物，都可以作你们的食物，这一切我都赐给你们，如同菜蔬一样。"],[4,"惟独肉带着血，那就是它的生命，你们不可吃。"],[5,"流你们血、害你们命的，无论是兽是人，我必讨他的罪，就是向各人的弟兄也是如此。"],[6,"凡流人血的，他的血也必被人所流，因为神造人，是照自己的形像造的。"],[7,"你们要生养众多，在地上昌盛繁茂。”"],[8,"神晓谕挪亚和他的儿子说："],[9,"“我与你们和你们的后裔立约，"],[10,"并与你们这里的一切活物，就是飞鸟、牲畜、走兽，凡从方舟里出来的活物立约。"],[11,"我与你们立约，凡有血肉的，不再被洪水灭绝，也不再有洪水毁坏地了。”"],[12,"神说：“我与你们并你们这里的各样活物所立的永约是有记号的。"],[13,"我把虹放在云彩中，这就可作我与地立约的记号了。"],[14,"我使云彩盖地的时候，必有虹现在云彩中，"],[15,"我便记念我与你们和各样有血肉的活物所立的约，水就再不泛滥毁坏一切有血肉的物了。"],[16,"虹必现在云彩中，我看见，就要记念我与地上各样有血肉的活物所立的永约。”"],[17,"神对挪亚说：“这就是我与地上一切有血肉之物立约的记号了。”"],[18,"出方舟挪亚的儿子就是闪、含、雅弗。含是迦南的父亲。"],[19,"这是挪亚的三个儿子，他们的后裔分散在全地。"],[20,"挪亚作起农夫来，栽了一个葡萄园。"],[21,"他喝了园中的酒便醉了，在帐棚里赤着身子。"],[22,"迦南的父亲含，看见他父亲赤身，就到外边告诉他两个弟兄。"],[23,"于是闪和雅弗拿件衣服搭在肩上，倒退着进去，给他父亲盖上，他们背着脸就看不见父亲的赤身。"],[24,"挪亚醒了酒，知道小儿子向他所作的事，"],[25,"就说：“迦南当受咒诅，必给他弟兄作奴仆的奴仆。”"],[26,"又说：“耶和华闪的神是应当称颂的，愿迦南作闪的奴仆。"],[27,"愿神使雅弗扩张，使他住在闪的帐棚里，又愿迦南作他的奴仆。”"],[28,"洪水以后，挪亚又活了三百五十年。"],[29,"挪亚共活了九百五十岁就死了。"]]},{"n":10,"v":[[1,"挪亚的儿子闪、含、雅弗的后代记在下面。洪水以后，他们都生了儿子。"],[2,"雅弗的儿子是歌篾、玛各、玛代、雅完、土巴、米设、提拉。"],[3,"歌篾的儿子是亚实基拿、利法、陀迦玛；"],[4,"雅完的儿子是以利沙、他施、基提、多单。"],[5,"这些人的后裔将各国的地土、海岛分开居住，各随各的方言、宗族立国。"],[6,"含的儿子是古实、麦西、弗、迦南。"],[7,"古实的儿子是西巴、哈腓拉、撒弗他、拉玛、撒弗提迦。拉玛的儿子是示巴、底但。"],[8,"古实又生宁录，他为世上英雄之首。"],[9,"他在耶和华面前是个英勇的猎户，所以俗语说：“像宁录在耶和华面前是个英勇的猎户。”"],[10,"他国的起头是巴别、以力、亚甲、甲尼，都在示拿地。"],[11,"他从那地出来往亚述去，建造尼尼微、利河伯、迦拉，"],[12,"和尼尼微、迦拉中间的利鲜，这就是那大城。"],[13,"麦西生路低人、亚拿米人、利哈比人、拿弗土希人、"],[14,"帕斯鲁细人、迦斯路希人、迦斐托人，从迦斐托出来的有非利士人。"],[15,"迦南生长子西顿，又生赫，"],[16,"和耶布斯人、亚摩利人、革迦撒人、"],[17,"希未人、亚基人、西尼人、"],[18,"亚瓦底人、洗玛利人、哈马人，后来迦南的诸族分散了。"],[19,"迦南的境界是从西顿向基拉耳的路上，直到迦萨；又向所多玛、蛾摩拉、押玛、洗扁的路上，直到拉沙。"],[20,"这就是含的后裔，各随他们的宗族、方言，所住的地土、邦国。"],[21,"雅弗的哥哥闪，是希伯子孙之祖，他也生了儿子。"],[22,"闪的儿子是以拦、亚述、亚法撒、路德、亚兰。"],[23,"亚兰的儿子是乌斯、户勒、基帖、玛施。"],[24,"亚法撒生色拉；色拉生希伯。"],[25,"希伯生了两个儿子，一个名叫法勒（“法勒”就是“分”的意思），因为那时人就分地居住。法勒的兄弟名叫约坍。"],[26,"约坍生亚摩答、沙列、哈萨玛非、耶拉、"],[27,"哈多兰、乌萨、德拉、"],[28,"俄巴路、亚比玛利、示巴、"],[29,"阿斐、哈腓拉、约巴，这都是约坍的儿子。"],[30,"他们所住的地方是从米沙直到西发东边的山。"],[31,"这就是闪的子孙，各随他们的宗族、方言，所住的地土、邦国。"],[32,"这些都是挪亚三个儿子的宗族，各随他们的支派立国。洪水以后，他们在地上分为邦国。"]]},{"n":11,"v":[[1,"那时，天下人的口音言语都是一样。"],[2,"他们往东边迁移的时候，在示拿地遇见一片平原，就住在那里。"],[3,"他们彼此商量说：“来吧，我们要作砖，把砖烧透了。”他们就拿砖当石头，又拿石漆当灰泥。"],[4,"他们说：“来吧，我们要建造一座城和一座塔，塔顶通天，为要传扬我们的名，免得我们分散在全地上。”"],[5,"耶和华降临，要看看世人所建造的城和塔。"],[6,"耶和华说：“看哪，他们成为一样的人民，都是一样的言语，如今既作起这事来，以后他们所要作的事就没有不成就的了。"],[7,"我们下去，在那里变乱他们的口音，使他们的言语彼此不通。”"],[8,"于是，耶和华使他们从那里分散在全地上，他们就停工不造那城了。"],[9,"因为耶和华在那里变乱天下人的言语，使众人分散在全地上，所以那城名叫巴别（就是“变乱”的意思）。"],[10,"闪的后代记在下面：洪水以后二年，闪一百岁生了亚法撒。"],[11,"闪生亚法撒之后，又活了五百年，并且生儿养女。"],[12,"亚法撒活到三十五岁，生了色拉。"],[13,"亚法撒生色拉之后，又活了四百零三年，并且生儿养女。"],[14,"色拉活到三十岁，生了希伯。"],[15,"色拉生希伯之后，又活了四百零三年，并且生儿养女。"],[16,"希伯活到三十四岁，生了法勒。"],[17,"希伯生法勒之后，又活了四百三十年，并且生儿养女。"],[18,"法勒活到三十岁，生了拉吴。"],[19,"法勒生拉吴之后，又活了二百零九年，并且生儿养女。"],[20,"拉吴活到三十二岁，生了西鹿。"],[21,"拉吴生西鹿之后，又活了二百零七年，并且生儿养女。"],[22,"西鹿活到三十岁，生了拿鹤。"],[23,"西鹿生拿鹤之后，又活了二百年，并且生儿养女。"],[24,"拿鹤活到二十九岁，生了他拉。"],[25,"拿鹤生他拉之后，又活了一百一十九年，并且生儿养女。"],[26,"他拉活到七十岁，生了亚伯兰、拿鹤、哈兰。"],[27,"他拉的后代记在下面：他拉生亚伯兰、拿鹤、哈兰。哈兰生罗得。"],[28,"哈兰死在他的本地迦勒底的吾珥，在他父亲他拉之先。"],[29,"亚伯兰、拿鹤各娶了妻：亚伯兰的妻子名叫撒莱；拿鹤的妻子名叫密迦，是哈兰的女儿；哈兰是密迦和亦迦的父亲。"],[30,"撒莱不生育，没有孩子。"],[31,"他拉带着他儿子亚伯兰和他孙子哈兰的儿子罗得，并他儿妇亚伯兰的妻子撒莱，出了迦勒底的吾珥，要往迦南地去。他们走到哈兰就住在那里。"],[32,"他拉共活了二百零五岁，就死在哈兰。"]]},{"n":12,"v":[[1,"耶和华对亚伯兰说：“你要离开本地、本族、父家，往我所要指示你的地去。"],[2,"我必叫你成为大国。我必赐福给你，叫你的名为大，你也要叫别人得福。"],[3,"为你祝福的，我必赐福与他；那咒诅你的，我必咒诅他。地上的万族都要因你得福。”"],[4,"亚伯兰就照着耶和华的吩咐去了，罗得也和他同去。亚伯兰出哈兰的时候年七十五岁。"],[5,"亚伯兰将他妻子撒莱和侄儿罗得，连他们在哈兰所积蓄的财物，所得的人口，都带往迦南地去。他们就到了迦南地。"],[6,"亚伯兰经过那地，到了示剑地方摩利橡树那里。那时，迦南人住在那地。"],[7,"耶和华向亚伯兰显现，说：“我要把这地赐给你的后裔。”亚伯兰就在那里为向他显现的耶和华筑了一座坛。"],[8,"从那里他又迁到伯特利东边的山，支搭帐棚。西边是伯特利，东边是艾。他在那里又为耶和华筑了一座坛，求告耶和华的名。"],[9,"后来亚伯兰又渐渐迁往南地去。"],[10,"那地遭遇饥荒。因饥荒甚大，亚伯兰就下埃及去，要在那里暂居。"],[11,"将近埃及，就对他妻子撒莱说：“我知道你是容貌俊美的妇人。"],[12,"埃及人看见你必说：‘这是他的妻子’，他们就要杀我，却叫你存活。"],[13,"求你说，你是我的妹子，使我因你得平安，我的命也因你存活。”"],[14,"及至亚伯兰到了埃及，埃及人看见那妇人极其美貌。"],[15,"法老的臣宰看见了她，就在法老面前夸奖她。那妇人就被带进法老的宫去。"],[16,"法老因这妇人就厚待亚伯兰，亚伯兰得了许多牛羊、骆驼、公驴、母驴、仆婢。"],[17,"耶和华因亚伯兰妻子撒莱的缘故，降大灾与法老和他的全家。"],[18,"法老就召了亚伯兰来，说：“你这向我作的是什么事呢？为什么没有告诉我她是你的妻子？"],[19,"为什么说她是你的妹子，以致我把她取来要作我的妻子？现在你的妻子在这里，可以带她走吧！”"],[20,"于是法老吩咐人将亚伯兰和他妻子，并他所有的都送走了。"]]},{"n":13,"v":[[1,"亚伯兰带着他的妻子与罗得，并一切所有的，都从埃及上南地去。"],[2,"亚伯兰的金、银、牲畜极多。"],[3,"他从南地渐渐往伯特利去，到了伯特利和艾的中间，就是从前支搭帐棚的地方，"],[4,"也是他起先筑坛的地方，他又在那里求告耶和华的名。"],[5,"与亚伯兰同行的罗得也有牛群、羊群、帐棚。"],[6,"那地容不下他们，因为他们的财物甚多，使他们不能同居。"],[7,"当时，迦南人与比利洗人在那地居住。亚伯兰的牧人和罗得的牧人相争。"],[8,"亚伯兰就对罗得说：“你我不可相争，你的牧人和我的牧人也不可相争，因为我们是骨肉（原文作“弟兄”）。"],[9,"遍地不都在你眼前吗？请你离开我。你向左，我就向右；你向右，我就向左。”"],[10,"罗得举目看见约旦河的全平原，直到琐珥，都是滋润的，那地在耶和华未灭所多玛、蛾摩拉以先，如同耶和华的园子，也像埃及地。"],[11,"于是罗得选择约旦河的全平原，往东迁移，他们就彼此分离了。"],[12,"亚伯兰住在迦南地，罗得住在平原的城邑，渐渐挪移帐棚，直到所多玛。"],[13,"所多玛人在耶和华面前罪大恶极。"],[14,"罗得离别亚伯兰以后，耶和华对亚伯兰说：“从你所在的地方，你举目向东西南北观看，"],[15,"凡你所看见的一切地，我都要赐给你和你的后裔，直到永远。"],[16,"我也要使你的后裔如同地上的尘沙那样多，人若能数算地上的尘沙，才能数算你的后裔。"],[17,"你起来，纵横走遍这地，因为我必把这地赐给你。”"],[18,"亚伯兰就搬了帐棚，来到希伯仑幔利的橡树那里居住，在那里为耶和华筑了一座坛。"]]},{"n":14,"v":[[1,"当暗拉非作示拿王、亚略作以拉撒王、基大老玛作以拦王、提达作戈印王的时候，"],[2,"他们都攻打所多玛王比拉、蛾摩拉王比沙、押玛王示纳、洗扁王善以别和比拉王；比拉就是琐珥。"],[3,"这五王都在西订谷会合，西订谷就是盐海。"],[4,"他们已经侍奉基大老玛十二年，到十三年就背叛了。"],[5,"十四年，基大老玛和同盟的王都来在亚特律加宁，杀败了利乏音人，在哈麦杀败了苏西人，在沙微基列亭杀败了以米人，"],[6,"在何利人的西珥山杀败了何利人，一直杀到靠近旷野的伊勒巴兰。"],[7,"他们回到安密巴，就是加低斯，杀败了亚玛力全地的人，以及住在哈洗逊他玛的亚摩利人。"],[8,"于是所多玛王、蛾摩拉王、押玛王、洗扁王和比拉王（比拉就是琐珥）都出来，在西订谷摆阵，与他们交战，"],[9,"就是与以拦王基大老玛、戈印王提达、示拿王暗拉非、以拉撒王亚略交战，乃是四王与五王交战。"],[10,"西订谷有许多石漆坑。所多玛王和蛾摩拉王逃跑，有掉在坑里的，其余的人都往山上逃跑。"],[11,"四王就把所多玛和蛾摩拉所有的财物，并一切的粮食都掳掠去了；"],[12,"又把亚伯兰的侄儿罗得和罗得的财物掳掠去了。当时罗得正住在所多玛。"],[13,"有一个逃出来的人，告诉希伯来人亚伯兰，亚伯兰正住在亚摩利人幔利的橡树那里。幔利和以实各并亚乃都是弟兄，曾与亚伯兰联盟。"],[14,"亚伯兰听见他侄儿（原文作“弟兄”）被掳去，就率领他家里生养的精练壮丁三百一十八人，直追到但。"],[15,"便在夜间，自己同仆人分队杀败敌人，又追到大马士革左边的何把，"],[16,"将被掳掠的一切财物夺回来，连他侄儿罗得和他的财物，以及妇女、人民，也都夺回来。"],[17,"亚伯兰杀败基大老玛和与他同盟的王回来的时候，所多玛王出来，在沙微谷迎接他；沙微谷就是王谷。"],[18,"又有撒冷王麦基洗德带着饼和酒出来迎接，他是至高神的祭司。"],[19,"他为亚伯兰祝福，说：“愿天地的主、至高的神赐福与亚伯兰。"],[20,"至高的神把敌人交在你手里，是应当称颂的。”亚伯兰就把所得的拿出十分之一来，给麦基洗德。"],[21,"所多玛王对亚伯兰说：“你把人口给我，财物你自己拿去吧！”"],[22,"亚伯兰对所多玛王说：“我已经向天地的主、至高的神耶和华起誓，"],[23,"凡是你的东西，就是一根线、一根鞋带，我都不拿，免得你说：‘我使亚伯兰富足。’"],[24,"只有仆人所吃的，并与我同行的亚乃、以实各、幔利所应得的份，可以任凭他们拿去。”"]]},{"n":15,"v":[[1,"这事以后，耶和华在异象中有话对亚伯兰说：“亚伯兰，你不要惧怕！我是你的盾牌，必大大地赏赐你。”"],[2,"亚伯兰说：“主耶和华啊，我既无子，你还赐我什么呢？并且要承受我家业的是大马士革人以利以谢。”"],[3,"亚伯兰又说：“你没有给我儿子，那生在我家中的人就是我的后嗣。”"],[4,"耶和华又有话对他说：“这人必不成为你的后嗣，你本身所生的才成为你的后嗣。”"],[5,"于是领他走到外边，说：“你向天观看，数算众星，能数得过来吗？”又对他说：“你的后裔将要如此。”"],[6,"亚伯兰信耶和华，耶和华就以此为他的义。"],[7,"耶和华又对他说：“我是耶和华，曾领你出了迦勒底的吾珥，为要将这地赐你为业。”"],[8,"亚伯兰说：“主耶和华啊，我怎能知道必得这地为业呢？”"],[9,"他说：“你为我取一只三年的母牛，一只三年的母山羊，一只三年的公绵羊，一只斑鸠，一只雏鸽。”"],[10,"亚伯兰就取了这些来，每样劈开分成两半，一半对着一半地摆列，只有鸟没有劈开。"],[11,"有鸷鸟下来落在那死畜的肉上，亚伯兰就把它吓飞了。"],[12,"日头正落的时候，亚伯兰沉沉地睡了，忽然有惊人的大黑暗落在他身上。"],[13,"耶和华对亚伯兰说：“你要的确知道，你的后裔必寄居别人的地，又服侍那地的人，那地的人要苦待他们四百年。"],[14,"并且他们所要服侍的那国，我要惩罚，后来他们必带着许多财物从那里出来。"],[15,"但你要享大寿数，平平安安地归到你列祖那里，被人埋葬。"],[16,"到了第四代，他们必回到此地，因为亚摩利人的罪孽还没有满盈。”"],[17,"日落天黑，不料有冒烟的炉，并烧着的火把，从那些肉块中经过。"],[18,"当那日，耶和华与亚伯兰立约，说：“我已赐给你的后裔，从埃及河直到幼发拉底大河之地，"],[19,"就是基尼人、基尼洗人、甲摩尼人、"],[20,"赫人、比利洗人、利乏音人、"],[21,"亚摩利人、迦南人、革迦撒人、耶布斯人之地。”"]]},{"n":16,"v":[[1,"亚伯兰的妻子撒莱不给他生儿女。撒莱有一个使女名叫夏甲，是埃及人。"],[2,"撒莱对亚伯兰说：“耶和华使我不能生育，求你和我的使女同房，或者我可以因她得孩子（“得孩子”原文作“被建立”）。”亚伯兰听从了撒莱的话。"],[3,"于是亚伯兰的妻子撒莱将使女埃及人夏甲给了丈夫为妾。那时亚伯兰在迦南已经住了十年。"],[4,"亚伯兰与夏甲同房，夏甲就怀了孕。她见自己有孕，就小看她的主母。"],[5,"撒莱对亚伯兰说：“我因你受屈，我将我的使女放在你怀中，她见自己有了孕就小看我，愿耶和华在你我中间判断。”"],[6,"亚伯兰对撒莱说：“使女在你手下，你可以随意待她。”撒莱苦待她，她就从撒莱面前逃走了。"],[7,"耶和华的使者在旷野书珥路上的水泉旁遇见她，"],[8,"对她说：“撒莱的使女夏甲，你从哪里来？要往哪里去？”夏甲说：“我从我的主母撒莱面前逃出来。”"],[9,"耶和华的使者对她说：“你回到你主母那里，服在她手下。”"],[10,"又说：“我必使你的后裔极其繁多，甚至不可胜数。”"],[11,"并说：“你如今怀孕要生一个儿子，可以给他起名叫以实玛利，因为耶和华听见了你的苦情（“以实玛利”就是“神听见”的意思）。"],[12,"他为人必像野驴。他的手要攻打人，人的手也要攻打他。他必住在众弟兄的东边。”"],[13,"夏甲就称那对她说话的耶和华为“看顾人的神”。因而说：“在这里我也看见那看顾我的吗？”"],[14,"所以这井名叫庇耳拉海莱。这井正在加低斯和巴列中间。"],[15,"后来夏甲给亚伯兰生了一个儿子，亚伯兰给他起名叫以实玛利。"],[16,"夏甲给亚伯兰生以实玛利的时候，亚伯兰年八十六岁。"]]},{"n":17,"v":[[1,"亚伯兰年九十九岁的时候，耶和华向他显现，对他说：“我是全能的神，你当在我面前作完全人，"],[2,"我就与你立约，使你的后裔极其繁多。”"],[3,"亚伯兰俯伏在地，神又对他说："],[4,"“我与你立约，你要作多国的父。"],[5,"从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为我已立你作多国的父。"],[6,"我必使你的后裔极其繁多，国度从你而立，君王从你而出。"],[7,"我要与你并你世世代代的后裔坚立我的约，作永远的约，是要作你和你后裔的神。"],[8,"我要将你现在寄居的地，就是迦南全地，赐给你和你的后裔，永远为业。我也必作他们的神。”"],[9,"神又对亚伯拉罕说：“你和你的后裔必世世代代遵守我的约。"],[10,"你们所有的男子都要受割礼，这就是我与你，并你的后裔所立的约，是你们所当遵守的。"],[11,"你们都要受割礼（“受割礼”原文作“割阳皮”。14、23、24、25节同），这是我与你们立约的证据。"],[12,"你们世世代代的男子，无论是家里生的，是在你后裔之外用银子从外人买的，生下来第八日，都要受割礼。"],[13,"你家里生的和你用银子买的，都必须受割礼。这样，我的约就立在你们肉体上，作永远的约。"],[14,"但不受割礼的男子，必从民中剪除，因他背了我的约。”"],[15,"神又对亚伯拉罕说：“你的妻子撒莱，不可再叫撒莱，她的名要叫撒拉。"],[16,"我必赐福给她，也要使你从她得一个儿子。我要赐福给她，她也要作多国之母；必有百姓的君王从她而出。”"],[17,"亚伯拉罕就俯伏在地喜笑，心里说：“一百岁的人还能得孩子吗？撒拉已经九十岁了，还能生养吗？”"],[18,"亚伯拉罕对神说：“但愿以实玛利活在你面前。”"],[19,"神说：“不然，你妻子撒拉要给你生一个儿子，你要给他起名叫以撒。我要与他坚定所立的约，作他后裔永远的约。"],[20,"至于以实玛利，我也应允你，我必赐福给他，使他昌盛极其繁多。他必生十二个族长；我也要使他成为大国。"],[21,"到明年这时节，撒拉必给你生以撒，我要与他坚定所立的约。”"],[22,"神和亚伯拉罕说完了话，就离开他上升去了。"],[23,"正当那日，亚伯拉罕遵着神的命，给他的儿子以实玛利和家里的一切男子，无论是在家里生的，是用银子买的，都行了割礼。"],[24,"亚伯拉罕受割礼的时候年九十九岁。"],[25,"他儿子以实玛利受割礼的时候年十三岁。"],[26,"正当那日，亚伯拉罕和他儿子以实玛利一同受了割礼。"],[27,"家里所有的人，无论是在家里生的，是用银子从外人买的，也都一同受了割礼。"]]},{"n":18,"v":[[1,"耶和华在幔利橡树那里，向亚伯拉罕显现出来。那时正热，亚伯拉罕坐在帐棚门口，"],[2,"举目观看，见有三个人在对面站着。他一见，就从帐棚门口跑去迎接他们，俯伏在地，"],[3,"说：“我主，我若在你眼前蒙恩，求你不要离开仆人往前去。"],[4,"容我拿点水来，你们洗洗脚，在树下歇息歇息。"],[5,"我再拿一点饼来，你们可以加添心力，然后往前去。你们既到仆人这里来，理当如此。”他们说：“就照你说的行吧！”"],[6,"亚伯拉罕急忙进帐棚见撒拉，说：“你速速拿三细亚细面调和作饼。”"],[7,"亚伯拉罕又跑到牛群里，牵了一只又嫩又好的牛犊来，交给仆人，仆人急忙预备好了。"],[8,"亚伯拉罕又取了奶油和奶，并预备好的牛犊来，摆在他们面前，自己在树下站在旁边，他们就吃了。"],[9,"他们问亚伯拉罕说：“你妻子撒拉在哪里？”他说：“在帐棚里。”"],[10,"三人中有一位说：“到明年这时候，我必要回到你这里，你的妻子撒拉必生一个儿子。”撒拉在那人后边的帐棚门口也听见了这话。"],[11,"亚伯拉罕和撒拉年纪老迈，撒拉的月经已断绝了。"],[12,"撒拉心里暗笑，说：“我既已衰败，我主也老迈，岂能有这喜事呢？”"],[13,"耶和华对亚伯拉罕说：“撒拉为什么暗笑，说：‘我既已年老，果真能生养吗？’"],[14,"耶和华岂有难成的事吗？到了日期，明年这时候，我必回到你这里，撒拉必生一个儿子。”"],[15,"撒拉就害怕，不承认，说：“我没有笑。”那位说：“不然，你实在笑了。”"],[16,"三人就从那里起行，向所多玛观看，亚伯拉罕也与他们同行，要送他们一程。"],[17,"耶和华说：“我所要作的事岂可瞒着亚伯拉罕呢？"],[18,"亚伯拉罕必要成为强大的国，地上的万国都必因他得福。"],[19,"我眷顾他，为要叫他吩咐他的众子和他的眷属遵守我的道，秉公行义，使我所应许亚伯拉罕的话都成就了。”"],[20,"耶和华说：“所多玛和蛾摩拉的罪恶甚重，声闻于我。"],[21,"我现在要下去，察看他们所行的，果然尽像那达到我耳中的声音一样吗？若是不然，我也必知道。”"],[22,"二人转身离开那里，向所多玛去，但亚伯拉罕仍旧站在耶和华面前。"],[23,"亚伯拉罕近前来说：“无论善恶，你都要剿灭吗？"],[24,"假若那城里有五十个义人，你还剿灭那地方吗？不为城里这五十个义人饶恕其中的人吗？"],[25,"将义人与恶人同杀，将义人与恶人一样看待，这断不是你所行的。审判全地的主岂不行公义吗？”"],[26,"耶和华说：“我若在所多玛城里见有五十个义人，我就为他们的缘故饶恕那地方的众人。”"],[27,"亚伯拉罕说：“我虽然是灰尘，还敢对主说话。"],[28,"假若这五十个义人短了五个，你就因为短了五个毁灭全城吗？”他说：“我在那里若见有四十五个，也不毁灭那城。”"],[29,"亚伯拉罕又对他说：“假若在那里见有四十个怎么样呢？”他说：“为这四十个的缘故，我也不作这事。”"],[30,"亚伯拉罕说：“求主不要动怒，容我说，假若在那里见有三十个怎么样呢？”他说：“我在那里若见有三十个，我也不作这事。”"],[31,"亚伯拉罕说：“我还敢对主说话，假若在那里见有二十个怎么样呢？”他说：“为这二十个的缘故，我也不毁灭那城。”"],[32,"亚伯拉罕说：“求主不要动怒，我再说这一次，假若在那里见有十个呢？”他说：“为这十个的缘故，我也不毁灭那城。”"],[33,"耶和华与亚伯拉罕说完了话就走了；亚伯拉罕也回到自己的地方去了。"]]},{"n":19,"v":[[1,"那两个天使晚上到了所多玛。罗得正坐在所多玛城门口，看见他们，就起来迎接，脸伏于地下拜，"],[2,"说：“我主啊，请你们到仆人家里洗洗脚，住一夜，清早起来再走。”他们说：“不！我们要在街上过夜。”"],[3,"罗得切切地请他们，他们这才进去到他屋里。罗得为他们预备筵席，烤无酵饼，他们就吃了。"],[4,"他们还没有躺下，所多玛城里各处的人，连老带少，都来围住那房子，"],[5,"呼叫罗得说：“今日晚上到你这里来的人在哪里呢？把他们带出来，任我们所为。”"],[6,"罗得出来，把门关上，到众人那里，"],[7,"说：“众弟兄，请你们不要作这恶事。"],[8,"我有两个女儿，还是处女，容我领出来任凭你们的心愿而行，只是这两个人既然到我舍下，不要向他们作什么。”"],[9,"众人说：“退去吧！”又说：“这个人来寄居，还想要作官哪！现在我们要害你比害他们更甚。”众人就向前拥挤罗得，要攻破房门。"],[10,"只是那二人伸出手来，将罗得拉进屋去，把门关上，"],[11,"并且使门外的人，无论老少，眼都昏迷；他们摸来摸去，总寻不着房门。"],[12,"二人对罗得说：“你这里还有什么人吗？无论是女婿，是儿女和这城中一切属你的人，你都要将他们从这地方带出去。"],[13,"我们要毁灭这地方，因为城内罪恶的声音在耶和华面前甚大，耶和华差我们来，要毁灭这地方。”"],[14,"罗得就出去，告诉娶了他女儿的女婿们（“娶了”或作“将要娶”），说：“你们起来离开这地方，因为耶和华要毁灭这城。”他女婿们却以为他说的是戏言。"],[15,"天明了，天使催逼罗得说：“起来！带着你的妻子和你在这里的两个女儿出去，免得你因这城里的罪恶同被剿灭。”"],[16,"但罗得迟延不走。二人因为耶和华怜恤罗得，就拉着他的手和他妻子的手，并他两个女儿的手，把他们领出来，安置在城外。"],[17,"领他们出来以后，就说：“逃命吧！不可回头看，也不可在平原站住，要往山上逃跑，免得你被剿灭。”"],[18,"罗得对他们说：“我主啊，不要如此。"],[19,"你仆人已经在你眼前蒙恩，你又向我显出莫大的慈爱，救我的性命，我不能逃到山上去，恐怕这灾祸临到我，我便死了。"],[20,"看哪，这座城又小又近，容易逃到，这不是一个小的吗？求你容我逃到那里，我的性命就得存活。”"],[21,"天使对他说：“这事我也应允你，我不倾覆你所说的这城。"],[22,"你要速速地逃到那城，因为你还没有到那里，我不能作什么。”因此那城名叫琐珥（“琐珥”就是“小”的意思）。"],[23,"罗得到了琐珥，日头已经出来了。"],[24,"当时，耶和华将硫磺与火，从天上耶和华那里，降与所多玛和蛾摩拉，"],[25,"把那些城和全平原，并城里所有的居民，连地上生长的都毁灭了。"],[26,"罗得的妻子在后边回头一看，就变成了一根盐柱。"],[27,"亚伯拉罕清早起来，到了他从前站在耶和华面前的地方，"],[28,"向所多玛和蛾摩拉与平原的全地观看，不料，那地方烟气上腾，如同烧窑一般。"],[29,"当神毁灭平原诸城的时候，他记念亚伯拉罕，正在倾覆罗得所住之城的时候，就打发罗得从倾覆之中出来。"],[30,"罗得因为怕住在琐珥，就同他两个女儿，从琐珥上去住在山里。他和两个女儿住在一个洞里。"],[31,"大女儿对小女儿说：“我们的父亲老了，地上又无人按着世上的常规进到我们这里。"],[32,"来！我们可以叫父亲喝酒，与他同寝。这样，我们好从他存留后裔。”"],[33,"于是那夜，她们叫父亲喝酒，大女儿就进去和她父亲同寝。她几时躺下，几时起来，父亲都不知道。"],[34,"第二天，大女儿对小女儿说：“我昨夜与父亲同寝，今夜我们再叫他喝酒，你可以进去与他同寝。这样，我们好从父亲存留后裔。”"],[35,"于是那夜，她们又叫父亲喝酒，小女儿起来与她父亲同寝。她几时躺下，几时起来，父亲都不知道。"],[36,"这样，罗得的两个女儿都从她父亲怀了孕。"],[37,"大女儿生了儿子，给他起名叫摩押，就是现今摩押人的始祖；"],[38,"小女儿也生了儿子，给他起名叫便亚米，就是现今亚扪人的始祖。"]]},{"n":20,"v":[[1,"亚伯拉罕从那里向南地迁去，寄居在加低斯和书珥中间的基拉耳。"],[2,"亚伯拉罕称他的妻撒拉为妹子。基拉耳王亚比米勒差人把撒拉取了去。"],[3,"但夜间，神来在梦中对亚比米勒说：“你是个死人哪！因为你取了那女人来，她原是别人的妻子。”"],[4,"亚比米勒却还没有亲近撒拉。他说：“主啊，连有义的国你也要毁灭吗？"],[5,"那人岂不是自己对我说：‘她是我的妹子’吗？就是女人也自己说：‘他是我的哥哥。’我作这事是心正手洁的。”"],[6,"神在梦中对他说：“我知道你作这事是心中正直，我也拦阻了你，免得你得罪我，所以我不容你沾着她。"],[7,"现在你把这人的妻子归还他，因为他是先知，他要为你祷告，使你存活。你若不归还他，你当知道，你和你所有的人都必要死。”"],[8,"亚比米勒清早起来，召了众臣仆来，将这些事都说给他们听，他们都甚惧怕。"],[9,"亚比米勒召了亚伯拉罕来，对他说：“你怎么向我这样行呢？我在什么事上得罪了你，你竟使我和我国里的人陷在大罪里！你向我行不当行的事了。”"],[10,"亚比米勒又对亚伯拉罕说：“你见了什么才作这事呢？”"],[11,"亚伯拉罕说：“我以为这地方的人总不惧怕神，必为我妻子的缘故杀我。"],[12,"况且她也实在是我的妹子，她与我是同父异母，后来作了我的妻子。"],[13,"当神叫我离开父家飘流在外的时候，我对她说：‘我们无论走到什么地方，你可以对人说，他是我的哥哥；这就是你待我的恩典了。’”"],[14,"亚比米勒把牛羊、仆婢赐给亚伯拉罕，又把他的妻子撒拉归还他。"],[15,"亚比米勒又说：“看哪，我的地都在你面前，你可以随意居住。”"],[16,"又对撒拉说：“我给你哥哥一千银子，作为你在阖家人面前遮羞的（“羞”原文作“眼”），你就在众人面前没有不是了。”"],[17,"亚伯拉罕祷告神，神就医好了亚比米勒和他的妻子，并他的众女仆，她们便能生育。"],[18,"因耶和华为亚伯拉罕的妻子撒拉的缘故，已经使亚比米勒家中的妇人不能生育。"]]},{"n":21,"v":[[1,"耶和华按着先前的话眷顾撒拉，便照他所说的给撒拉成就。"],[2,"当亚伯拉罕年老的时候，撒拉怀了孕，到神所说的日期，就给亚伯拉罕生了一个儿子。"],[3,"亚伯拉罕给撒拉所生的儿子起名叫以撒。"],[4,"以撒生下来第八日，亚伯拉罕照着神所吩咐的，给以撒行了割礼。"],[5,"他儿子以撒生的时候，亚伯拉罕年一百岁。"],[6,"撒拉说：“神使我喜笑，凡听见的必与我一同喜笑。”"],[7,"又说：“谁能预先对亚伯拉罕说：‘撒拉要乳养婴孩’呢？因为在他年老的时候，我给他生了一个儿子。”"],[8,"孩子渐长，就断了奶。以撒断奶的日子，亚伯拉罕设摆丰盛的筵席。"],[9,"当时，撒拉看见埃及人夏甲给亚伯拉罕所生的儿子戏笑，"],[10,"就对亚伯拉罕说：“你把这使女和她儿子赶出去！因为这使女的儿子不可与我的儿子以撒一同承受产业。”"],[11,"亚伯拉罕因他儿子的缘故很忧愁。"],[12,"神对亚伯拉罕说：“你不必为这童子和你的使女忧愁，凡撒拉对你说的话，你都该听从，因为从以撒生的，才要称为你的后裔。"],[13,"至于使女的儿子，我也必使他的后裔成立一国，因为他是你所生的。”"],[14,"亚伯拉罕清早起来，拿饼和一皮袋水，给了夏甲，搭在她的肩上，又把孩子交给她，打发她走。夏甲就走了，在别是巴的旷野走迷了路。"],[15,"皮袋的水用尽了，夏甲就把孩子撇在小树底下，"],[16,"自己走开约有一箭之远，相对而坐，说：“我不忍见孩子死！”就相对而坐，放声大哭。"],[17,"神听见童子的声音。神的使者从天上呼叫夏甲说：“夏甲！你为何这样呢？不要害怕，神已经听见童子的声音了。"],[18,"起来！把童子抱在怀中（“怀”原文作“手”），我必使他的后裔成为大国。”"],[19,"神使夏甲的眼睛明亮，她就看见一口水井，便去将皮袋盛满了水，给童子喝。"],[20,"神保佑童子，他就渐长，住在旷野，成了弓箭手。"],[21,"他住在巴兰的旷野，他母亲从埃及地给他娶了一个妻子。"],[22,"当那时候，亚比米勒同他军长非各对亚伯拉罕说：“凡你所行的事都有神的保佑。"],[23,"我愿你如今在这里指着神对我起誓，不要欺负我与我的儿子，并我的子孙，我怎样厚待了你，你也要照样厚待我与你所寄居这地的民。”"],[24,"亚伯拉罕说：“我情愿起誓。”"],[25,"从前亚比米勒的仆人霸占了一口水井，亚伯拉罕为这事指责亚比米勒。"],[26,"亚比米勒说：“谁作这事我不知道，你也没有告诉我，今日我才听见了。”"],[27,"亚伯拉罕把羊和牛给了亚比米勒，二人就彼此立约。"],[28,"亚伯拉罕把七只母羊羔另放在一处。"],[29,"亚比米勒问亚伯拉罕说：“你把这七只母羊羔另放在一处，是什么意思呢？”"],[30,"他说：“你要从我手里受这七只母羊羔，作我挖这口井的证据。”"],[31,"所以他给那地方起名叫别是巴，因为他们二人在那里起了誓（就是“盟誓的井”）。"],[32,"他们在别是巴立了约，亚比米勒就同他军长非各起身回非利士地去了。"],[33,"亚伯拉罕在别是巴栽上一棵垂丝柳树，又在那里求告耶和华永生神的名。"],[34,"亚伯拉罕在非利士人的地寄居了多日。"]]},{"n":22,"v":[[1,"这些事以后，神要试验亚伯拉罕，就呼叫他说：“亚伯拉罕！”他说：“我在这里。”"],[2,"神说：“你带着你的儿子，就是你独生的儿子，你所爱的以撒，往摩利亚地去，在我所要指示你的山上，把他献为燔祭。”"],[3,"亚伯拉罕清早起来，备上驴，带着两个仆人和他儿子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去了。"],[4,"到了第三日，亚伯拉罕举目远远地看见那地方。"],[5,"亚伯拉罕对他的仆人说：“你们和驴在此等候，我与童子往那里去拜一拜，就回到你们这里来。”"],[6,"亚伯拉罕把燔祭的柴放在他儿子以撒身上，自己手里拿着火与刀，于是二人同行。"],[7,"以撒对他父亲亚伯拉罕说：“父亲哪！”亚伯拉罕说：“我儿，我在这里。”以撒说：“请看，火与柴都有了，但燔祭的羊羔在哪里呢？”"],[8,"亚伯拉罕说：“我儿，神必自己预备作燔祭的羊羔。”于是二人同行。"],[9,"他们到了神所指示的地方，亚伯拉罕在那里筑坛，把柴摆好，捆绑他的儿子以撒，放在坛的柴上。"],[10,"亚伯拉罕就伸手拿刀，要杀他的儿子。"],[11,"耶和华的使者从天上呼叫他说：“亚伯拉罕！亚伯拉罕！”他说：“我在这里。”"],[12,"天使说：“你不可在这童子身上下手，一点不可害他。现在我知道你是敬畏神的了，因为你没有将你的儿子，就是你独生的儿子，留下不给我。”"],[13,"亚伯拉罕举目观看，不料，有一只公羊，两角扣在稠密的小树中，亚伯拉罕就取了那只公羊来，献为燔祭，代替他的儿子。"],[14,"亚伯拉罕给那地方起名叫“耶和华以勒”（意思就是“耶和华必预备”），直到今日人还说：“在耶和华的山上必有预备。”"],[15,"耶和华的使者第二次从天上呼叫亚伯拉罕说："],[16,"“耶和华说：‘你既行了这事，不留下你的儿子，就是你独生的儿子，我便指着自己起誓说："],[17,"论福，我必赐大福给你；论子孙，我必叫你的子孙多起来，如同天上的星，海边的沙。你子孙必得着仇敌的城门，"],[18,"并且地上万国都必因你的后裔得福，因为你听从了我的话。’”"],[19,"于是亚伯拉罕回到他仆人那里，他们一同起身往别是巴去，亚伯拉罕就住在别是巴。"],[20,"这事以后，有人告诉亚伯拉罕说：“密迦给你兄弟拿鹤生了几个儿子："],[21,"长子是乌斯，他的兄弟是布斯和亚兰的父亲基母利，"],[22,"并基薛、哈琐、必达、益拉、彼土利（彼土利生利百加）。”"],[23,"这八个人都是密迦给亚伯拉罕的兄弟拿鹤生的。"],[24,"拿鹤的妾名叫流玛，生了提八、迦含、他辖和玛迦。"]]},{"n":23,"v":[[1,"撒拉享寿一百二十七岁，这是撒拉一生的岁数。"],[2,"撒拉死在迦南地的基列亚巴，就是希伯仑，亚伯拉罕为她哀恸哭号。"],[3,"后来亚伯拉罕从死人面前起来，对赫人说："],[4,"“我在你们中间是外人，是寄居的，求你们在这里给我一块地，我好埋葬我的死人，使她不在我眼前。”"],[5,"赫人回答亚伯拉罕说："],[6,"“我主请听。你在我们中间是一位尊大的王子，只管在我们最好的坟地里埋葬你的死人，我们没有一人不容你在他的坟地里埋葬你的死人。”"],[7,"亚伯拉罕就起来，向那地的赫人下拜，"],[8,"对他们说：“你们若有意叫我埋葬我的死人，使她不在我眼前，就请听我的话，为我求琐辖的儿子以弗仑，"],[9,"把田头上那麦比拉洞给我。他可以按着足价卖给我，作我在你们中间的坟地。”"],[10,"当时以弗仑正坐在赫人中间。于是，赫人以弗仑在城门出入的赫人面前对亚伯拉罕说："],[11,"“不然，我主请听。我送给你这块田，连田间的洞也送给你，在我同族的人面前都给你，可以埋葬你的死人。”"],[12,"亚伯拉罕就在那地的人民面前下拜，"],[13,"在他们面前对以弗仑说：“你若应允，请听我的话。我要把田价给你，求你收下，我就在那里埋葬我的死人。”"],[14,"以弗仑回答亚伯拉罕说："],[15,"“我主请听。值四百舍客勒银子的一块田，在你我中间还算什么呢？只管埋葬你的死人吧！”"],[16,"亚伯拉罕听从了以弗仑，照着他在赫人面前所说的话，把买卖通用的银子，平了四百舍客勒给以弗仑。"],[17,"于是，麦比拉、幔利前、以弗仑的那块田和其中的洞，并田间四围的树木，"],[18,"都定准归与亚伯拉罕，乃是他在赫人面前，并城门出入的人面前买妥的。"],[19,"此后，亚伯拉罕把他妻子撒拉埋葬在迦南地幔利前的麦比拉田间的洞里。幔利就是希伯仑。"],[20,"从此，那块田和田间的洞，就藉着赫人定准，归与亚伯拉罕作坟地。"]]},{"n":24,"v":[[1,"亚伯拉罕年纪老迈，向来在一切事上耶和华都赐福给他。"],[2,"亚伯拉罕对管理他全业最老的仆人说：“请你把手放在我大腿底下。"],[3,"我要叫你指着耶和华天地的主起誓，不要为我儿子娶这迦南地中的女子为妻。"],[4,"你要往我本地本族去，为我的儿子以撒娶一个妻子。”"],[5,"仆人对他说：“倘若女子不肯跟我到这地方来，我必须将你的儿子带回你原出之地吗？”"],[6,"亚伯拉罕对他说：“你要谨慎，不要带我的儿子回那里去。"],[7,"耶和华天上的主，曾带领我离开父家和本族的地，对我说话，向我起誓说：‘我要将这地赐给你的后裔。’他必差遣使者在你面前，你就可以从那里为我儿子娶一个妻子。"],[8,"倘若女子不肯跟你来，我使你起的誓就与你无干了，只是不可带我的儿子回那里去。”"],[9,"仆人就把手放在他主人亚伯拉罕的大腿底下，为这事向他起誓。"],[10,"那仆人从他主人的骆驼里取了十匹骆驼，并带些他主人各样的财物，起身往美索不达米亚去，到了拿鹤的城。"],[11,"天将晚，众女子出来打水的时候，他便叫骆驼跪在城外的水井那里。"],[12,"他说：“耶和华我主人亚伯拉罕的神啊，求你施恩给我主人亚伯拉罕，使我今日遇见好机会。"],[13,"我现今站在井旁，城内居民的女子们正出来打水。"],[14,"我向哪一个女子说：‘请你拿下水瓶来，给我水喝。’她若说：‘请喝，我也给你的骆驼喝。’愿那女子就作你所预定给你仆人以撒的妻。这样，我便知道你施恩给我主人了。”"],[15,"话还没有说完，不料，利百加肩头上扛着水瓶出来。利百加是彼土利所生的，彼土利是亚伯拉罕兄弟拿鹤妻子密迦的儿子。"],[16,"那女子容貌极其俊美，还是处女，也未曾有人亲近她。她下到井旁打满了瓶，又上来。"],[17,"仆人跑上前去迎着她说：“求你将瓶里的水给我一点喝。”"],[18,"女子说：“我主请喝。”就急忙拿下瓶来，托在手上给他喝。"],[19,"女子给他喝了，就说：“我再为你的骆驼打水，叫骆驼也喝足。”"],[20,"她就急忙把瓶里的水倒在槽里，又跑到井旁打水，就为所有的骆驼打上水来。"],[21,"那人定睛看她，一句话也不说，要晓得耶和华赐他通达的道路没有。"],[22,"骆驼喝足了，那人就拿一个金环，重半舍客勒，两个金镯，重十舍客勒，给了那女子，"],[23,"说：“请告诉我，你是谁的女儿？你父亲家里有我们住宿的地方没有？”"],[24,"女子说：“我是密迦与拿鹤之子彼土利的女儿。”"],[25,"又说：“我们家里足有粮草，也有住宿的地方。”"],[26,"那人就低头向耶和华下拜，"],[27,"说：“耶和华我主人亚伯拉罕的神是应当称颂的，因他不断地以慈爱诚实待我主人。至于我，耶和华在路上引领我，直走到我主人的兄弟家里。”"],[28,"女子跑回去，照着这些话告诉她母亲和她家里的人。"],[29,"-"],[30,"利百加有一个哥哥，名叫拉班，看见金环，又看见金镯在他妹子的手上，并听见他妹子利百加的话，说那人对我如此如此说。拉班就跑出来往井旁去，到那人跟前，见他仍站在骆驼旁边的井旁那里，"],[31,"便对他说：“你这蒙耶和华赐福的，请进来，为什么站在外边？我已经收拾了房屋，也为骆驼预备了地方。”"],[32,"那人就进了拉班的家。拉班卸了骆驼，用草料喂上，拿水给那人和跟随的人洗脚，"],[33,"把饭摆在他面前，叫他吃。他却说：“我不吃，等我说明白我的事情再吃。”拉班说：“请说。”"],[34,"他说：“我是亚伯拉罕的仆人。"],[35,"耶和华大大地赐福给我主人，使他昌大，又赐给他羊群、牛群、金银、仆婢、骆驼和驴。"],[36,"我主人的妻子撒拉年老的时候，给我主人生了一个儿子，我主人也将一切所有的都给了这个儿子。"],[37,"我主人叫我起誓说：‘你不要为我儿子娶迦南地的女子为妻，"],[38,"你要往我父家、我本族那里去，为我的儿子娶一个妻子。’"],[39,"我对我主人说：‘恐怕女子不肯跟我来。’"],[40,"他就说：‘我所侍奉的耶和华必要差遣他的使者与你同去，叫你的道路通达，你就得以在我父家、我本族那里，给我的儿子娶一个妻子。"],[41,"只要你到了我本族那里，我使你起的誓就与你无干；他们若不把女子交给你，我使你起的誓也与你无干。’"],[42,"我今日到了井旁，便说：‘耶和华我主人亚伯拉罕的神啊，愿你叫我所行的道路通达。"],[43,"我如今站在井旁，对哪一个出来打水的女子说：请你把你瓶里的水给我一点喝。"],[44,"她若说：你只管喝，我也为你的骆驼打水。愿那女子就作耶和华给我主人儿子所预定的妻。’"],[45,"我心里的话还没有说完，利百加就出来，肩头上扛着水瓶，下到井旁打水。我便对她说：‘请你给我水喝。’"],[46,"她就急忙从肩头上拿下瓶来，说：‘请喝，我也给你的骆驼喝。’我便喝了；她又给我的骆驼喝了。"],[47,"我问她说：‘你是谁的女儿？’“她说：‘我是密迦与拿鹤之子彼土利的女儿。’我就把环子戴在她鼻子上，把镯子戴在她两手上。"],[48,"随后我低头向耶和华下拜，称颂耶和华我主人亚伯拉罕的神，因为他引导我走合式的道路，使我得着我主人兄弟的孙女，给我主人的儿子为妻。"],[49,"现在你们若愿以慈爱诚实待我主人，就告诉我；若不然，也告诉我，使我可以或向左，或向右。”"],[50,"拉班和彼土利回答说：“这事乃出于耶和华，我们不能向你说好说歹。"],[51,"看哪，利百加在你面前，可以将她带去，照着耶和华所说的，给你主人的儿子为妻。”"],[52,"亚伯拉罕的仆人听见他们这话，就向耶和华俯伏在地。"],[53,"当下仆人拿出金器、银器和衣服送给利百加，又将宝物送给她哥哥和她母亲。"],[54,"仆人和跟从他的人吃了喝了，住了一夜。早晨起来，仆人就说：“请打发我回我主人那里去吧！”"],[55,"利百加的哥哥和她母亲说：“让女子同我们再住几天，至少十天，然后她可以去。”"],[56,"仆人说：“耶和华既赐给我通达的道路，你们不要耽误我，请打发我走，回我主人那里去吧！”"],[57,"他们说：“我们把女子叫来问问她”，"],[58,"就叫了利百加来问她说：“你和这人同去吗？”利百加说：“我去。”"],[59,"于是，他们打发妹子利百加和她的乳母，同亚伯拉罕的仆人，并跟从仆人的，都走了。"],[60,"他们就给利百加祝福说：“我们的妹子啊，愿你作千万人的母！愿你的后裔得着仇敌的城门！”"],[61,"利百加和她的使女们起来，骑上骆驼，跟着那仆人，仆人就带着利百加走了。"],[62,"那时，以撒住在南地，刚从庇耳拉海莱回来。"],[63,"天将晚，以撒出来在田间默想，举目一看，见来了些骆驼。"],[64,"利百加举目看见以撒，就急忙下了骆驼，"],[65,"问那仆人说：“这田间走来迎接我们的是谁？”仆人说：“是我的主人。”利百加就拿帕子蒙上脸。"],[66,"仆人就将所办的一切事都告诉以撒。"],[67,"以撒便领利百加进了他母亲撒拉的帐棚，娶了她为妻，并且爱她。以撒自从他母亲不在了，这才得了安慰。"]]},{"n":25,"v":[[1,"亚伯拉罕又娶了一妻，名叫基土拉。"],[2,"基土拉给他生了心兰、约珊、米但、米甸、伊施巴和书亚。"],[3,"约珊生了示巴和底但。底但的子孙是亚书利族、利都是族和利乌米族。"],[4,"米甸的儿子是以法、以弗、哈诺、亚比大和以勒大。这都是基土拉的子孙。"],[5,"亚伯拉罕将一切所有的都给了以撒。"],[6,"亚伯拉罕把财物分给他庶出的众子，趁着自己还在世的时候，打发他们离开他的儿子以撒，往东方去。"],[7,"亚伯拉罕一生的年日是一百七十五岁。"],[8,"亚伯拉罕寿高年迈，气绝而死，归到他列祖（原文作“本民”）那里。"],[9,"他两个儿子以撒、以实玛利把他埋葬在麦比拉洞里。这洞在幔利前、赫人琐辖的儿子以弗仑的田中，"],[10,"就是亚伯拉罕向赫人买的那块田。亚伯拉罕和他妻子撒拉都葬在那里。"],[11,"亚伯拉罕死了以后，神赐福给他的儿子以撒。以撒靠近庇耳拉海莱居住。"],[12,"撒拉的使女埃及人夏甲，给亚伯拉罕所生的儿子是以实玛利。"],[13,"以实玛利儿子们的名字，按着他们的家谱，记在下面：以实玛利的长子是尼拜约，又有基达、亚德别、米比衫、"],[14,"米施玛、度玛、玛撒、"],[15,"哈大、提玛、伊突、拿非施、基底玛。"],[16,"这是以实玛利众子的名字，照着他们的村庄、营寨，作了十二族的族长。"],[17,"以实玛利享寿一百三十七岁，气绝而死，归到他列祖（原文作“本民”）那里。"],[18,"他子孙的住处在他众弟兄东边，从哈腓拉直到埃及前的书珥，正在亚述的道上。"],[19,"亚伯拉罕的儿子以撒的后代，记在下面：亚伯拉罕生以撒。"],[20,"以撒娶利百加为妻的时候正四十岁。利百加是巴旦亚兰地的亚兰人彼土利的女儿，是亚兰人拉班的妹子。"],[21,"以撒因他妻子不生育，就为她祈求耶和华。耶和华应允他的祈求，他的妻子利百加就怀了孕。"],[22,"孩子们在她腹中彼此相争，她就说：“若是这样，我为什么活着呢（或作“我为什么如此呢”）？”她就去求问耶和华。"],[23,"耶和华对她说：“两国在你腹内，两族要从你身上出来，这族必强于那族，将来大的要服侍小的。”"],[24,"生产的日子到了，腹中果然是双子。"],[25,"先产的身体发红，浑身有毛，如同皮衣，他们就给他起名叫以扫（“以扫”就是“有毛”的意思）。"],[26,"随后又生了以扫的兄弟，手抓住以扫的脚跟，因此给他起名叫（“雅各”就是“抓住”的意思）。利百加生下两个儿子的时候，以撒年正六十岁。"],[27,"两个孩子渐渐长大，以扫善于打猎，常在田野；雅各为人安静，常住在帐棚里。"],[28,"以撒爱以扫，因为常吃他的野味；利百加却爱雅各。"],[29,"有一天，雅各熬汤，以扫从田野回来累昏了。"],[30,"以扫对雅各说：“我累昏了，求你把这红汤给我喝。”因此以扫又叫以东（“以东”就是“红”的意思）。"],[31,"雅各说：“你今日把长子的名分卖给我吧！”"],[32,"以扫说：“我将要死，这长子的名分于我有什么益处呢？”"],[33,"雅各说：“你今日对我起誓吧！”以扫就对他起了誓，把长子的名分卖给雅各。"],[34,"于是雅各将饼和红豆汤给了以扫，以扫吃了喝了，便起来走了。这就是以扫轻看了他长子的名分。"]]},{"n":26,"v":[[1,"在亚伯拉罕的日子，那地有一次饥荒；这时又有饥荒。以撒就往基拉耳去，到非利士人的王亚比米勒那里。"],[2,"耶和华向以撒显现，说：“你不要下埃及去，要住在我所指示你的地。"],[3,"你寄居在这地，我必与你同在，赐福给你，因为我要将这些地都赐给你和你的后裔。我必坚定我向你父亚伯拉罕所起的誓。"],[4,"我要加增你的后裔，像天上的星那样多；又要将这些地都赐给你的后裔，并且地上万国必因你的后裔得福；"],[5,"都因亚伯拉罕听从我的话，遵守我的吩咐和我的命令、律例、法度。”"],[6,"以撒就住在基拉耳。"],[7,"那地方的人问到他的妻子，他便说：“那是我的妹子。”原来他怕说：“是我的妻子。”他心里想：“恐怕这地方的人为利百加的缘故杀我，因为她容貌俊美。”"],[8,"他在那里住了许久。有一天，非利士人的王亚比米勒从窗户里往外观看，见以撒和他的妻子利百加戏玩。"],[9,"亚比米勒召了以撒来，对他说：“她实在是你的妻子，你怎么说她是你的妹子？”以撒说：“我心里想，恐怕我因她而死。”"],[10,"亚比米勒说：“你向我们作的是什么事呢？民中险些有人和你的妻同寝，把我们陷在罪里。”"],[11,"于是亚比米勒晓谕众民说：“凡沾着这个人，或是他妻子的，定要把他治死。”"],[12,"以撒在那地耕种，那一年有百倍的收成。耶和华赐福给他，"],[13,"他就昌大，日增月盛，成了大富户。"],[14,"他有羊群、牛群，又有许多仆人，非利士人就嫉妒他。"],[15,"当他父亲亚伯拉罕在世的日子，他父亲的仆人所挖的井，非利士人全都塞住，填满了土。"],[16,"亚比米勒对以撒说：“你离开我们去吧，因为你比我们强盛得多。”"],[17,"以撒就离开那里，在基拉耳谷支搭帐棚，住在那里。"],[18,"当他父亲亚伯拉罕在世之日所挖的水井，因非利士人在亚伯拉罕死后塞住了，以撒就重新挖出来，仍照他父亲所叫的，叫那些井的名字。"],[19,"以撒的仆人在谷中挖井，便得了一口活水井，"],[20,"基拉耳的牧人与以撒的牧人争竞，说：“这水是我们的。”以撒就给那井起名叫埃色，因为他们和他相争（“埃色”就是“相争”的意思）。"],[21,"以撒的仆人又挖了一口井，他们又为这井争竞，因此以撒给这井起名叫西提拿（“西提拿”就是“为敌”的意思）。"],[22,"以撒离开那里，又挖了一口井，他们不为这井争竞了，他就给那井起名叫利河伯（就是“宽阔”的意思）。他说：“耶和华现在给我们宽阔之地，我们必在这地昌盛。”"],[23,"以撒从那里上别是巴去。"],[24,"当夜耶和华向他显现，说：“我是你父亲亚伯拉罕的神，不要惧怕！因为我与你同在，要赐福给你，并要为我仆人亚伯拉罕的缘故，使你的后裔繁多。”"],[25,"以撒就在那里筑了一座坛，求告耶和华的名，并且支搭帐棚。他的仆人便在那里挖了一口井。"],[26,"亚比米勒同他的朋友亚户撒和他的军长非各，从基拉耳来见以撒。"],[27,"以撒对他们说：“你们既然恨我，打发我走了，为什么到我这里来呢？”"],[28,"他们说：“我们明明地看见耶和华与你同在，便说，不如我们两下彼此起誓，彼此立约，"],[29,"使你不害我们，正如我们未曾害你，一味地厚待你，并且打发你平平安安地走。你是蒙耶和华赐福的了。”"],[30,"以撒就为他们设摆筵席，他们便吃了喝了。"],[31,"他们清早起来彼此起誓。以撒打发他们走，他们就平平安安地离开他走了。"],[32,"那一天以撒的仆人来，将挖井的事告诉他说：“我们得了水了。”"],[33,"他就给那井起名叫示巴，因此那城叫作别是巴，直到今日。"],[34,"以扫四十岁的时候，娶了赫人比利的女儿犹滴，与赫人以伦的女儿巴实抹为妻。"],[35,"她们常使以撒和利百加心里愁烦。"]]},{"n":27,"v":[[1,"以撒年老，眼睛昏花，不能看见，就叫了他大儿子以扫来，说：“我儿。”以扫说：“我在这里。”"],[2,"他说：“我如今老了，不知道哪一天死。"],[3,"现在拿你的器械，就是箭囊和弓，往田野去为我打猎，"],[4,"照我所爱的作成美味，拿来给我吃，使我在未死之先给你祝福。”"],[5,"以撒对他儿子以扫说话，利百加也听见了。以扫往田野去打猎，要得野味带来。"],[6,"利百加就对她儿子雅各说：“我听见你父亲对你哥哥以扫说："],[7,"‘你去把野兽带来，作成美味给我吃，我好在未死之先，在耶和华面前给你祝福。’"],[8,"现在我儿，你要照着我所吩咐你的，听从我的话。"],[9,"你到羊群里去，给我拿两只肥山羊羔来，我便照你父亲所爱的，给他作成美味。"],[10,"你拿到你父亲那里给他吃，使他在未死之先给你祝福。”"],[11,"雅各对他母亲利百加说：“我哥哥以扫浑身是有毛的，我身上是光滑的，"],[12,"倘若我父亲摸着我，必以我为欺哄人的，我就招咒诅，不得祝福。”"],[13,"他母亲对他说：“我儿，你招的咒诅归到我身上，你只管听我的话，去把羊羔给我拿来。”"],[14,"他便去拿来，交给他母亲，他母亲就照他父亲所爱的作成美味。"],[15,"利百加又把家里所存大儿子以扫上好的衣服给她小儿子雅各穿上，"],[16,"又用山羊羔皮包在雅各的手上和颈项的光滑处，"],[17,"就把所作的美味和饼交在她儿子雅各的手里。"],[18,"雅各到他父亲那里说：“我父亲！”他说：“我在这里。我儿，你是谁？”"],[19,"雅各对他父亲说：“我是你的长子以扫，我已照你所吩咐我的行了。请起来坐着，吃我的野味，好给我祝福。”"],[20,"以撒对他儿子说：“我儿，你如何找得这么快呢？”他说：“因为耶和华你的神使我遇见好机会得着的。”"],[21,"以撒对雅各说：“我儿，你近前来，我摸摸你，知道你真是我的儿子以扫不是？”"],[22,"雅各就挨近他父亲以撒。以撒摸着他说：“声音是雅各的声音，手却是以扫的手。”"],[23,"以撒就辨不出他来，因为他手上有毛，像他哥哥以扫的手一样，就给他祝福。"],[24,"又说：“你真是我儿子以扫吗？”他说：“我是。”"],[25,"以撒说：“你递给我，我好吃我儿子的野味，给你祝福。”雅各就递给他，他便吃了；又拿酒给他，他也喝了。"],[26,"他父亲以撒对他说：“我儿，你上前来与我亲嘴。”"],[27,"他就上前与父亲亲嘴。他父亲一闻他衣服上的香气，就给他祝福，说：“我儿的香气如同耶和华赐福之田地的香气一样。"],[28,"愿神赐你天上的甘露、地上的肥土，并许多五谷新酒。"],[29,"愿多民侍奉你，多国跪拜你；愿你作你弟兄的主，你母亲的儿子向你跪拜。凡咒诅你的，愿他受咒诅；为你祝福的，愿他蒙福。”"],[30,"以撒为雅各祝福已毕，雅各从他父亲那里才出来，他哥哥以扫正打猎回来，"],[31,"也作了美味，拿来给他父亲，说：“请父亲起来，吃你儿子的野味，好给我祝福。”"],[32,"他父亲以撒对他说：“你是谁？”他说：“我是你的长子以扫。”"],[33,"以撒就大大地战兢说：“你未来之先，是谁得了野味拿来给我呢？我已经吃了，为他祝福，他将来也必蒙福。”"],[34,"以扫听了他父亲的话，就放声痛哭，说：“我父啊，求你也为我祝福！”"],[35,"以撒说：“你兄弟已经用诡计来将你的福分夺去了。”"],[36,"以扫说：“他名雅各岂不是正对吗？因为他欺骗了我两次，他从前夺了我长子的名分；你看，他现在又夺了我的福分。”以扫又说：“你没有留下为我可祝的福吗？”"],[37,"以撒回答以扫说：“我已立他为你的主，使他的弟兄都给他作仆人，并赐他五谷新酒可以养生。我儿，现在我还能为你作什么呢？”"],[38,"以扫对他父亲说：“父啊，你只有一样可祝的福吗？我父啊，求你也为我祝福。”以扫就放声而哭。"],[39,"他父亲以撒说：“地上的肥土必为你所住；天上的甘露必为你所得。"],[40,"你必倚靠刀剑度日，又必侍奉你的兄弟，到你强盛的时候，必从你颈项上挣开他的轭。”"],[41,"以扫因他父亲给雅各祝的福，就怨恨雅各，心里说：“为我父亲居丧的日子近了，到那时候，我要杀我的兄弟雅各。”"],[42,"有人把利百加大儿子以扫的话告诉利百加，她就打发人去，叫了她小儿子雅各来，对他说：“你哥哥以扫想要杀你，报仇雪恨。"],[43,"现在我儿，你要听我的话，起来逃往哈兰我哥哥拉班那里去，"],[44,"同他住些日子，直等你哥哥的怒气消了。"],[45,"你哥哥向你消了怒气，忘了你向他所作的事，我便打发人去把你从那里带回来。为什么一日丧你们二人呢？”"],[46,"利百加对以撒说：“我因这赫人的女子，连性命都厌烦了；倘若雅各也娶赫人的女子为妻，像这些一样，我活着还有什么益处呢？”"]]},{"n":28,"v":[[1,"以撒叫了雅各来，给他祝福，并嘱咐他说：“你不要娶迦南的女子为妻。"],[2,"你起身往巴旦亚兰去，到你外祖彼土利家里，在你母舅拉班的女儿中娶一女为妻。"],[3,"愿全能的神赐福给你，使你生养众多，成为多族，"],[4,"将应许亚伯拉罕的福赐给你和你的后裔，使你承受你所寄居的地为业，就是神赐给亚伯拉罕的地。”"],[5,"以撒打发雅各走了，他就往巴旦亚兰去，到亚兰人彼土利的儿子拉班那里，拉班是雅各、以扫的母舅。"],[6,"以扫见以撒已经给雅各祝福，而且打发他往巴旦亚兰去，在那里娶妻，并见祝福的时候嘱咐他说：“不要娶迦南的女子为妻。”"],[7,"又见雅各听从父母的话往巴旦亚兰去了，"],[8,"以扫就晓得他父亲以撒看不中迦南的女子，"],[9,"便往以实玛利那里去，在他二妻之外，又娶了玛哈拉为妻。她是亚伯拉罕儿子以实玛利的女儿，尼拜约的妹子。"],[10,"雅各出了别是巴，向哈兰走去。"],[11,"到了一个地方，因为太阳落了，就在那里住宿，便拾起那地方的一块石头枕在头下，在那里躺卧睡了。"],[12,"梦见一个梯子立在地上，梯子的头顶着天，有神的使者在梯子上，上去下来。"],[13,"耶和华站在梯子以上（或作“站在他旁边”）说：“我是耶和华你祖亚伯拉罕的神，也是以撒的神，我要将你现在所躺卧之地赐给你和你的后裔。"],[14,"你的后裔必像地上的尘沙那样多，必向东西南北开展，地上万族必因你和你的后裔得福。"],[15,"我也与你同在，你无论往哪里去，我必保佑你，领你归回这地，总不离弃你，直到我成全了向你所应许的。”"],[16,"雅各睡醒了，说：“耶和华真在这里！我竟不知道。”"],[17,"就惧怕说：“这地方何等可畏！这不是别的，乃是神的殿，也是天的门。”"],[18,"雅各清早起来，把所枕的石头立作柱子，浇油在上面。"],[19,"他就给那地方起名叫伯特利（就是“神殿”的意思）；但那地方起先名叫路斯。"],[20,"雅各许愿说：“神若与我同在，在我所行的路上保佑我，又给我食物吃、衣服穿，"],[21,"使我平平安安地回到我父亲的家，我就必以耶和华为我的神，"],[22,"我所立为柱子的石头也必作神的殿，凡你所赐给我的，我必将十分之一献给你。”"]]},{"n":29,"v":[[1,"雅各起行，到了东方人之地，"],[2,"看见田间有一口井，有三群羊卧在井旁，因为人饮羊群，都是用那井里的水，井口上的石头是大的。"],[3,"常有羊群在那里聚集，牧人把石头转离井口饮羊，随后又把石头放在井口的原处。"],[4,"雅各对牧人说：“弟兄们，你们是哪里来的？”他们说：“我们是哈兰来的。”"],[5,"他问他们说：“拿鹤的孙子拉班，你们认识吗？”他们说：“我们认识。”"],[6,"雅各说：“他平安吗？”他们说：“平安。看哪，他女儿拉结领着羊来了。”"],[7,"雅各说：“日头还高，不是羊群聚集的时候，你们不如饮羊再去放一放。”"],[8,"他们说：“我们不能，必等羊群聚齐，人把石头转离井口才可饮羊。”"],[9,"雅各正和他们说话的时候，拉结领着他父亲的羊来了，因为那些羊是她牧放的。"],[10,"雅各看见母舅拉班的女儿拉结和母舅拉班的羊群，就上前把石头转离井口，饮他母舅拉班的羊群。"],[11,"雅各与拉结亲嘴，就放声而哭。"],[12,"雅各告诉拉结，自己是她父亲的外甥，是利百加的儿子，拉结就跑去告诉她父亲。"],[13,"拉班听见外甥雅各的信息，就跑去迎接，抱着他，与他亲嘴，领他到自己的家。雅各将一切的情由告诉拉班。"],[14,"拉班对他说：“你实在是我的骨肉。”雅各就和他同住了一个月。"],[15,"拉班对雅各说：“你虽是我的骨肉（原文作“弟兄”），岂可白白地服侍我？请告诉我，你要什么为工价？”"],[16,"拉班有两个女儿：大的名叫利亚，小的名叫拉结。"],[17,"利亚的眼睛没有神气，拉结却生得美貌俊秀。"],[18,"雅各爱拉结，就说：“我愿为你小女儿拉结服侍你七年。”"],[19,"拉班说：“我把她给你胜似给别人，你与我同住吧！”"],[20,"雅各就为拉结服侍了七年。他因为深爱拉结，就看这七年如同几天。"],[21,"雅各对拉班说：“日期已经满了，求你把我的妻子给我，我好与她同房。”"],[22,"拉班就摆设筵席，请齐了那地方的众人。"],[23,"到晚上，拉班将女儿利亚送来给雅各，雅各就与她同房。"],[24,"拉班又将婢女悉帕给女儿利亚作使女。"],[25,"到了早晨，雅各一看是利亚，就对拉班说：“你向我作的是什么事呢？我服侍你，不是为拉结吗？你为什么欺哄我呢？”"],[26,"拉班说：“大女儿还没有给人，先把小女儿给人，在我们这地方没有这规矩。"],[27,"你为这个满了七日，我就把那个也给你，你再为她服侍我七年。”"],[28,"雅各就如此行。满了利亚的七日，拉班便将女儿拉结给雅各为妻。"],[29,"拉班又将婢女辟拉给女儿拉结作使女。"],[30,"雅各也与拉结同房，并且爱拉结胜似爱利亚，于是又服侍了拉班七年。"],[31,"耶和华见利亚失宠（原文作“被恨”。下同），就使她生育，拉结却不生育。"],[32,"利亚怀孕生子，就给他起名叫流便（就是“有儿子”的意思），因而说：“耶和华看见我的苦情，如今我的丈夫必爱我。”"],[33,"她又怀孕生子，就说：“耶和华因为听见我失宠，所以又赐给我这个儿子。”于是给他起名叫西缅（就是“听见”的意思）。"],[34,"她又怀孕生子，起名叫利未，（就是“联合”的意思），说：“我给丈夫生了三个儿子，他必与我联合。”"],[35,"她又怀孕生子，说：“这回我要赞美耶和华。”因此给他起名叫犹大（就是“赞美”的意思）。这才停了生育。"]]},{"n":30,"v":[[1,"拉结见自己不给雅各生子，就嫉妒她姐姐，对雅各说：“你给我孩子，不然我就死了。”"],[2,"雅各向拉结生气，说：“叫你不生育的是神，我岂能代替他作主呢？”"],[3,"拉结说：“有我的使女辟拉在这里，你可以与她同房，使她生子在我膝下，我便因她也得孩子（“得孩子”原文作“被建立”）。”"],[4,"拉结就把她的使女辟拉给丈夫为妾，雅各便与她同房，"],[5,"辟拉就怀孕给雅各生了一个儿子。"],[6,"拉结说：“神伸了我的冤，也听了我的声音，赐我一个儿子。”因此给他起名叫但（就是“伸冤”的意思）。"],[7,"拉结的使女辟拉又怀孕，给雅各生了第二个儿子。"],[8,"拉结说：“我与我姐姐大大相争，并且得胜。”于是给他起名叫拿弗他利（就是“相争”的意思）。"],[9,"利亚见自己停了生育，就把使女悉帕给雅各为妾。"],[10,"利亚的使女悉帕给雅各生了一个儿子。"],[11,"利亚说：“万幸！”于是给他起名叫迦得（就是“万幸”的意思）。"],[12,"利亚的使女悉帕又给雅各生了第二个儿子。"],[13,"利亚说：“我有福啊，众女子都要称我是有福的。”于是给他起名叫亚设（就是“有福”的意思）。"],[14,"割麦子的时候，流便往田里去寻见风茄，拿来给他母亲利亚。拉结对利亚说：“请你把你儿子的风茄给我些。”"],[15,"利亚说：“你夺了我的丈夫还算小事吗？你又要夺我儿子的风茄吗？”拉结说：“为你儿子的风茄，今夜他可以与你同寝。”"],[16,"到了晚上，雅各从田里回来，利亚出来迎接他，说：“你要与我同寝，因为我实在用我儿子的风茄把你雇下了。”那一夜雅各就与她同寝。"],[17,"神应允了利亚，她就怀孕，给雅各生了第五个儿子。"],[18,"利亚说：“神给了我价值，因为我把使女给了我丈夫。”于是给他起名叫以萨迦（就是“价值”的意思）。"],[19,"利亚又怀孕，给雅各生了第六个儿子。"],[20,"利亚说：“神赐我厚赏，我丈夫必与我同住，因我给他生了六个儿子。”于是给他起名叫西布伦（就是“同住”的意思）。"],[21,"后来又生了一个女儿，给她起名叫底拿。"],[22,"神顾念拉结，应允了她，使她能生育。"],[23,"拉结怀孕生子，说：“神除去了我的羞耻。”"],[24,"就给他起名叫约瑟（就是“增添”的意思），意思说：“愿耶和华再增添我一个儿子。”"],[25,"拉结生约瑟之后，雅各对拉班说：“请打发我走，叫我回到我本乡本土去。"],[26,"请你把我服侍你所得的妻子和儿女给我，让我走。我怎样服侍你，你都知道。”"],[27,"拉班对他说：“我若在你眼前蒙恩，请你仍与我同住，因为我已算定，耶和华赐福与我是为你的缘故。”"],[28,"又说：“请你定你的工价，我就给你。”"],[29,"雅各对他说：“我怎样服侍你，你的牲畜在我手里怎样，是你知道的。"],[30,"我未来之先，你所有的很少，现今却发大众多，耶和华随我的脚步赐福与你。如今我什么时候才为自己兴家立业呢？”"],[31,"拉班说：“我当给你什么呢？”雅各说：“什么你也不必给我，只有一件事，你若应承，我便仍旧牧放你的羊群。"],[32,"今天我要走遍你的羊群，把绵羊中凡有点的、有斑的和黑色的，并山羊中凡有斑的、有点的，都挑出来，将来这一等的就算我的工价。"],[33,"以后你来查看我的工价，凡在我手里的山羊，不是有点有斑的，绵羊不是黑色的，那就算是我偷的。这样，便可证出我的公义来。”"],[34,"拉班说：“好啊，我情愿照着你的话行。”"],[35,"当日，拉班把有纹的、有斑的公山羊，有点的、有斑的、有杂白纹的母山羊，并黑色的绵羊，都挑出来，交在他儿子们的手下，"],[36,"又使自己和雅各相离三天的路程。雅各就牧养拉班其余的羊。"],[37,"雅各拿杨树、杏树、枫树的嫩枝，将皮剥成白纹，使枝子露出白的来，"],[38,"将剥了皮的枝子，对着羊群，插在饮羊的水沟里和水槽里，羊来喝的时候牝牡配合。"],[39,"羊对着枝子配合，就生下有纹的、有点的、有斑的来。"],[40,"雅各把羊羔分出来，使拉班的羊与这有纹和黑色的羊相对，把自己的羊另放一处，不叫他和拉班的羊混杂。"],[41,"到羊群肥壮配合的时候，雅各就把枝子插在水沟里，使羊对着枝子配合。"],[42,"只是到羊瘦弱配合的时候就不插枝子。这样，瘦弱的就归拉班，肥壮的就归雅各。"],[43,"于是雅各极其发大，得了许多的羊群、仆婢、骆驼和驴。"]]},{"n":31,"v":[[1,"雅各听见拉班的儿子们有话说：“雅各把我们父亲所有的都夺了去，并藉着我们父亲的，得了这一切的荣耀（“荣耀”或作“财”）。”"],[2,"雅各见拉班的气色向他不如从前了。"],[3,"耶和华对雅各说：“你要回你祖你父之地，到你亲族那里去，我必与你同在。”"],[4,"雅各就打发人，叫拉结和利亚到田野羊群那里来，"],[5,"对她们说：“我看你们父亲的气色向我不如从前了，但我父亲的神向来与我同在。"],[6,"你们也知道，我尽了我的力量服侍你们的父亲。"],[7,"你们的父亲欺哄我，十次改了我的工价，然而神不容他害我。"],[8,"他若说：‘有点的归你作工价’，羊群所生的都有点；他若说：‘有纹的归你作工价’，羊群所生的都有纹。"],[9,"这样，神把你们父亲的牲畜夺来赐给我了。"],[10,"羊配合的时候，我梦中举目一看，见跳母羊的公羊都是有纹的、有点的、有花斑的。"],[11,"神的使者在那梦中呼叫我说：‘雅各！’我说：‘我在这里。’"],[12,"他说：‘你举目观看，跳母羊的公羊都是有纹的、有点的、有花斑的，凡拉班向你所作的，我都看见了。"],[13,"我是伯特利的神，你在那里用油浇过柱子，向我许过愿。现今你起来离开这地，回你本地去吧！’”"],[14,"拉结和利亚回答雅各说：“在我们父亲的家里还有我们可得的份吗？还有我们的产业吗？"],[15,"我们不是被他当作外人吗？因为他卖了我们，吞了我们的价值。"],[16,"神从我们父亲所夺出来的一切财物，那就是我们和我们孩子们的。现今凡神所吩咐你的，你只管去行吧！”"],[17,"雅各起来，使他的儿子和妻子都骑上骆驼，"],[18,"又带着他在巴旦亚兰所得的一切牲畜和财物，往迦南地他父亲以撒那里去了。"],[19,"当时拉班剪羊毛去了，拉结偷了她父亲家中的神像。"],[20,"雅各背着亚兰人拉班偷走了，并不告诉他，"],[21,"就带着所有的逃跑。他起身过大河，面向基列山行去。"],[22,"到第三日，有人告诉拉班：“雅各逃跑了。”"],[23,"拉班带领他的众弟兄去追赶，追了七日，在基列山就追上了。"],[24,"夜间，神到亚兰人拉班那里，在梦中对他说：“你要小心！不可与雅各说好说歹。”"],[25,"拉班追上雅各。雅各在山上支搭帐棚；拉班和他的众弟兄也在基列山上支搭帐棚。"],[26,"拉班对雅各说：“你作的是什么事呢？你背着我偷走了，又把我的女儿们带了去，如同用刀剑掳去的一般。"],[27,"你为什么暗暗地逃跑，偷着走，并不告诉我，叫我可以欢乐、唱歌、击鼓、弹琴地送你回去？"],[28,"又不容我与外孙和女儿亲嘴，你所行的真是愚昧！"],[29,"我手中原有能力害你，只是你父亲的神昨夜对我说：‘你要小心！不可与雅各说好说歹。’"],[30,"现在你虽然想你父家，不得不去，为什么又偷了我的神像呢？”"],[31,"雅各回答拉班说：“恐怕你把你的女儿从我夺去，所以我逃跑。"],[32,"至于你的神像，你在谁那里搜出来，就不容谁存活，当着我们的众弟兄你认一认，在我这里有什么东西是你的，就拿去。”原来雅各不知道拉结偷了那些神像。"],[33,"拉班进了雅各、利亚并两个使女的帐棚，都没有搜出来，就从利亚的帐棚出来，进了拉结的帐棚。"],[34,"拉结已经把神像藏在骆驼的驮篓里，便坐在上头。拉班摸遍了那帐棚，并没有摸着。"],[35,"拉结对她父亲说：“现在我身上不便，不能在你面前起来，求我主不要生气。”这样，拉班搜寻神像，竟没有搜出来。"],[36,"雅各就发怒斥责拉班说：“我有什么过犯，有什么罪恶，你竟这样火速地追我！"],[37,"你摸遍了我一切的家具，你搜出什么来呢？可以放在你我弟兄面前，叫他们在你我中间辨别辨别。"],[38,"我在你家这二十年，你的母绵羊、母山羊没有掉过胎。你群中的公羊，我没有吃过；"],[39,"被野兽撕裂的，我没有带来给你，是我自己赔上。无论是白日，是黑夜，被偷去的，你都向我索要。"],[40,"我白日受尽干热，黑夜受尽寒霜，不得合眼睡着，我常是这样。"],[41,"我这二十年在你家里，为你的两个女儿服侍你十四年，为你的羊群服侍你六年，你又十次改了我的工价。"],[42,"若不是我父亲以撒所敬畏的神，就是亚伯拉罕的神与我同在，你如今必定打发我空手而去。神看见我的苦情和我的劳碌，就在昨夜责备你。”"],[43,"拉班回答雅各说：“这女儿是我的女儿，这些孩子是我的孩子，这些羊群也是我的羊群，凡在你眼前的都是我的。我的女儿并她们所生的孩子，我今日能向他们作什么呢？"],[44,"来吧！你我二人可以立约，作你我中间的证据。”"],[45,"雅各就拿一块石头立作柱子，"],[46,"又对众弟兄说：“你们堆聚石头。”他们就拿石头来堆成一堆，大家便在旁边吃喝。"],[47,"拉班称那石堆为伊迦尔撒哈杜他，雅各却称那石堆为迦累得（都是“以石堆为证”的意思）。"],[48,"拉班说：“今日这石堆作你我中间的证据。”因此这地方名叫迦累得，"],[49,"又叫米斯巴，意思说：“我们彼此离别以后，愿耶和华在你我中间鉴察。"],[50,"你若苦待我的女儿，又在我的女儿以外另娶妻，虽没有人知道，却有神在你我中间作见证。”"],[51,"拉班又说：“你看我在你我中间所立的这石堆和柱子。"],[52,"这石堆作证据，这柱子也作证据。我必不过这石堆去害你；你也不可过这石堆和柱子来害我。"],[53,"但愿亚伯拉罕的神和拿鹤的神，就是他们父亲的神，在你我中间判断。”雅各就指着他父亲以撒所敬畏的神起誓，"],[54,"又在山上献祭，请众弟兄来吃饭。他们吃了饭，便在山上住宿。"],[55,"拉班清早起来，与他外孙和女儿亲嘴，给他们祝福，回往自己的地方去了。"]]},{"n":32,"v":[[1,"雅各仍旧行路，神的使者遇见他。"],[2,"雅各看见他们就说：“这是神的军兵。”于是给那地方起名叫玛哈念（就是“二军兵”的意思）。"],[3,"雅各打发人先往西珥地去，就是以东地，见他哥哥以扫，"],[4,"吩咐他们说：“你们对我主以扫说：‘你的仆人雅各这样说，我在拉班那里寄居，直到如今。"],[5,"我有牛、驴、羊群、仆婢，现在打发人来报告我主，为要在你眼前蒙恩。’”"],[6,"所打发的人回到雅各那里，说：“我们到了你哥哥以扫那里，他带着四百人，正迎着你来。”"],[7,"雅各就甚惧怕，而且愁烦，便把那与他同在的人口和羊群、牛群、骆驼分作两队，"],[8,"说：“以扫若来击杀这一队，剩下的那一队还可以逃避。”"],[9,"雅各说：“耶和华我祖亚伯拉罕的神，我父亲以撒的神啊，你曾对我说：‘回你本地本族去，我要厚待你。’"],[10,"你向仆人所施的一切慈爱和诚实，我一点也不配得。我先前只拿着我的杖过这约旦河，如今我却成了两队了。"],[11,"求你救我脱离我哥哥以扫的手，因为我怕他来杀我，连妻子带儿女一同杀了。"],[12,"你曾说：‘我必定厚待你，使你的后裔如同海边的沙，多得不可胜数。’”"],[13,"当夜，雅各在那里住宿，就从他所有的物中拿礼物要送给他哥哥以扫："],[14,"母山羊二百只，公山羊二十只，母绵羊二百只，公绵羊二十只，"],[15,"奶崽子的骆驼三十只，各带着崽子；母牛四十只，公牛十只，母驴二十匹，驴驹十匹。"],[16,"每样各分一群，交在仆人手下，就对仆人说：“你们要在我前头过去，使群群相离，有空闲的地方。”"],[17,"又吩咐尽先走的说：“我哥哥以扫遇见你的时候，问你说：‘你是哪家的人？要往哪里去？你前头这些是谁的？’"],[18,"你就说：‘是你仆人雅各的，是送给我主以扫的礼物，他自己也在我们后边。’”"],[19,"又吩咐第二、第三和一切赶群畜的人说：“你们遇见以扫的时候，也要这样对他说。"],[20,"并且你们要说：‘你仆人雅各在我们后边。’”因雅各心里说：“我藉着在我前头去的礼物解他的恨，然后再见他的面，或者他容纳我。”"],[21,"于是礼物先过去了。那夜，雅各在队中住宿。"],[22,"他夜间起来，带着两个妻子、两个使女，并十一个儿子都过了雅博渡口。"],[23,"先打发他们过河，又打发所有的都过去，"],[24,"只剩下雅各一人。有一个人来和他摔跤，直到黎明。"],[25,"那人见自己胜不过他，就将他的大腿窝摸了一把，雅各的大腿窝正在摔跤的时候就扭了。"],[26,"那人说：“天黎明了，容我去吧！”雅各说：“你不给我祝福，我就不容你去。”"],[27,"那人说：“你名叫什么？”他说：“我名叫雅各。”"],[28,"那人说：“你的名不要再叫雅各，要叫以色列，因为你与神与人较力，都得了胜。”"],[29,"雅各问他说：“请将你的名告诉我。”那人说：“何必问我的名？”于是在那里给雅各祝福。"],[30,"雅各便给那地方起名叫毗努伊勒（就是“神之面”的意思），意思说：“我面对面见了神，我的性命仍得保全。”"],[31,"日头刚出来的时候，雅各经过毗努伊勒，他的大腿就瘸了。"],[32,"故此，以色列人不吃大腿窝的筋，直到今日，因为那人摸了雅各大腿窝的筋。"]]},{"n":33,"v":[[1,"雅各举目观看，见以扫来了，后头跟着四百人，他就把孩子们分开交给利亚、拉结和两个使女，"],[2,"并且叫两个使女和她们的孩子在前头，利亚和她的孩子在后头，拉结和约瑟在尽后头。"],[3,"他自己在他们前头过去，一连七次俯伏在地，才就近他哥哥。"],[4,"以扫跑来迎接他，将他抱住，又搂着他的颈项与他亲嘴，两个人就哭了。"],[5,"以扫举目看见妇人孩子，就说：“这些和你同行的是谁呢？”雅各说：“这些孩子是神施恩给你仆人的。”"],[6,"于是两个使女和她们的孩子前来下拜；"],[7,"利亚和她的孩子也前来下拜；随后约瑟和拉结也前来下拜。"],[8,"以扫说：“我所遇见的这些群畜是什么意思呢？”雅各说：“是要在我主面前蒙恩的。”"],[9,"以扫说：“兄弟啊，我的已经够了，你的仍归你吧！”"],[10,"雅各说：“不然，我若在你眼前蒙恩，就求你从我手里收下这礼物，因为我见了你的面，如同见了神的面，并且你容纳了我。"],[11,"求你收下我带来给你的礼物，因为神恩待我，使我充足。”雅各再三地求他，他才收下了。"],[12,"以扫说：“我们可以起身前往，我在你前头走。”"],[13,"雅各对他说：“我主知道孩子们年幼娇嫩，牛羊也正在乳养的时候，若是催赶一天，群畜都必死了。"],[14,"求我主在仆人前头走，我要量着在我面前群畜和孩子的力量慢慢地前行，直走到西珥我主那里。”"],[15,"以扫说：“容我把跟随我的人留几个在你这里。”雅各说：“何必呢？只要在我主眼前蒙恩就是了。”"],[16,"于是以扫当日起行，回往西珥去了。"],[17,"雅各就往疏割去，在那里为自己盖造房屋，又为牲畜搭棚；因此那地方名叫疏割（就是“棚”的意思）。"],[18,"雅各从巴旦亚兰回来的时候，平平安安地到了迦南地的示剑城，在城东支搭帐棚，"],[19,"就用一百块银子向示剑的父亲、哈抹的子孙买了支帐棚的那块地，"],[20,"在那里筑了一座坛，起名叫伊利伊罗伊以色列（就是“神、以色列神”的意思）。"]]},{"n":34,"v":[[1,"利亚给雅各所生的女儿底拿出去，要见那地的女子们。"],[2,"那地的主希未人、哈抹的儿子示剑看见她，就拉住她与她行淫，玷辱她。"],[3,"示剑的心系恋雅各的女儿底拿，喜爱这女子，甜言蜜语地安慰她。"],[4,"示剑对他父亲哈抹说：“求你为我聘这女子为妻。”"],[5,"雅各听见示剑玷污了他的女儿底拿，那时他的儿子们正和群畜在田野，雅各就闭口不言，等他们回来。"],[6,"示剑的父亲哈抹出来见雅各，要和他商议。"],[7,"雅各的儿子们听见这事，就从田野回来，人人忿恨，十分恼怒，因示剑在以色列家做了丑事，与雅各的女儿行淫，这本是不该作的事。"],[8,"哈抹和他们商议说：“我儿子示剑的心恋慕这女子，求你们将她给我的儿子为妻。"],[9,"你们与我们彼此结亲，你们可以把女儿给我们，也可以娶我们的女儿。"],[10,"你们与我们同住吧！这地都在你们面前，只管在此居住，作买卖，置产业。”"],[11,"示剑对女儿的父亲和弟兄们说：“但愿我在你们眼前蒙恩，你们向我要什么，我必给你们。"],[12,"任凭向我要多重的聘金和礼物，我必照你们所说的给你们，只要把女子给我为妻。”"],[13,"雅各的儿子们，因为示剑玷污了他们的妹子底拿，就用诡诈的话回答示剑和他父亲哈抹，"],[14,"对他们说：“我们不能把我们的妹子给没有受割礼的人为妻，因为那是我们的羞辱。"],[15,"惟有一件才可以应允，若你们所有的男丁都受割礼，和我们一样，"],[16,"我们就把女儿给你们，也娶你们的女儿，我们便与你们同住，两下成为一样的人民；"],[17,"倘若你们不听从我们受割礼，我们就带着妹子走了。”"],[18,"哈抹和他的儿子示剑喜欢这话。"],[19,"那少年人作这事并不迟延，因为他喜爱雅各的女儿。他在他父亲家中也是人最尊重的。"],[20,"哈抹和他儿子示剑到本城的门口，对本城的人说："],[21,"“这些人与我们和睦，不如许他们在这地居住，作买卖，这地也宽阔，足可容下他们。我们可以娶他们的女儿为妻，也可以把我们的女儿嫁给他们。"],[22,"惟有一件事我们必须作，他们才肯应允和我们同住，成为一样的人民，就是我们中间所有的男丁都要受割礼，和他们一样。"],[23,"他们的群畜、货财和一切的牲口岂不都归我们吗？只要依从他们，他们就与我们同住。”"],[24,"凡从城门出入的人，就都听从哈抹和他儿子示剑的话。于是，凡从城门出入的男丁都受了割礼。"],[25,"到第三天，众人正在疼痛的时候，雅各的两个儿子，就是底拿的哥哥西缅和利未，各拿刀剑，趁着众人想不到的时候，来到城中，把一切男丁都杀了，"],[26,"又用刀杀了哈抹和他儿子示剑，把底拿从示剑家里带出来就走了。"],[27,"雅各的儿子们因为他们的妹子受了玷污，就来到被杀的人那里，掳掠那城，"],[28,"夺了他们的羊群、牛群和驴，并城里田间所有的，"],[29,"又把他们一切货财、孩子、妇女，并各房中所有的，都掳掠去了。"],[30,"雅各对西缅和利未说：“你们连累我，使我在这地的居民中，就是在迦南人和比利洗人中，有了臭名。我的人丁既然稀少，他们必聚集来击杀我，我和全家的人都必灭绝。”"],[31,"他们说：“他岂可待我们的妹子如同妓女吗？”"]]},{"n":35,"v":[[1,"神对雅各说：“起来！上伯特利去，住在那里，要在那里筑一座坛给神，就是你逃避你哥哥以扫的时候向你显现的那位。”"],[2,"雅各就对他家中的人，并一切与他同在的人说：“你们要除掉你们中间的外邦神，也要自洁，更换衣裳。"],[3,"我们要起来，上伯特利去，在那里我要筑一座坛给神，就是在我遭难的日子应允我的祷告、在我行的路上保佑我的那位。”"],[4,"他们就把外邦人的神像和他们的耳朵上的环子交给雅各，雅各都藏在示剑那里的橡树底下。"],[5,"他们便起行前往。神使那周围城邑的人都甚惊惧，就不追赶雅各的众子了。"],[6,"于是，雅各和一切与他同在的人到了迦南地的路斯，就是伯特利。"],[7,"他在那里筑了一座坛，就给那地方起名叫伊勒伯特利（就是“伯特利之神”的意思），因为他逃避他哥哥的时候，神在那里向他显现。"],[8,"利百加的奶母底波拉死了，就葬在伯特利下边橡树底下，那棵树名叫亚伦巴古。"],[9,"雅各从巴旦亚兰回来，神又向他显现，赐福与他，"],[10,"且对他说：“你的名原是雅各，从今以后不要再叫雅各，要叫以色列。”这样，他就改名叫以色列。"],[11,"神又对他说：“我是全能的神，你要生养众多，将来有一族和多国的民从你而生，又有君王从你而出。"],[12,"我所赐给亚伯拉罕和以撒的地，我要赐给你与你的后裔。”"],[13,"神就从那与雅各说话的地方升上去了。"],[14,"雅各便在那里立了一根石柱，在柱子上奠酒、浇油。"],[15,"雅各就给那地方起名叫伯特利。"],[16,"他们从伯特利起行，离以法他还有一段路程，拉结临产甚是艰难。"],[17,"正在艰难的时候，收生婆对她说：“不要怕，你又要得一个儿子了。”"],[18,"她将近于死，灵魂要走的时候，就给她儿子起名叫便俄尼，他父亲却给他起名叫便雅悯。"],[19,"拉结死了，葬在以法他的路旁；以法他就是伯利恒。"],[20,"雅各在她的坟上立了一统碑，就是拉结的墓碑，到今日还在。"],[21,"以色列起行前往，在以得台那边支搭帐棚。"],[22,"以色列住在那地的时候，流便去与他父亲的妾辟拉同寝，以色列也听见了。雅各共有十二个儿子。"],[23,"利亚所生的是雅各的长子流便，还有西缅、利未、犹大、以萨迦、西布伦。"],[24,"拉结所生的是约瑟、便雅悯。"],[25,"拉结的使女辟拉所生的是但、拿弗他利。"],[26,"利亚的使女悉帕所生的是迦得、亚设。这是雅各在巴旦亚兰所生的儿子。"],[27,"雅各来到他父亲以撒那里，到了基列亚巴的幔利，乃是亚伯拉罕和以撒寄居的地方；基列亚巴就是希伯仑。"],[28,"以撒共活了一百八十岁。"],[29,"以撒年纪老迈，日子满足，气绝而死，归到他列祖（原文作“本民”）那里。他两个儿子以扫、雅各把他埋葬了。"]]},{"n":36,"v":[[1,"以扫就是以东，他的后代记在下面："],[2,"以扫娶迦南的女子为妻，就是赫人以伦的女儿亚大和希未人祭便的孙女、亚拿的女儿阿何利巴玛，"],[3,"又娶了以实玛利的女儿、尼拜约的妹子巴实抹。"],[4,"亚大给以扫生了以利法；巴实抹生了流珥；"],[5,"阿何利巴玛生了耶乌施、雅兰、可拉。这都是以扫的儿子，是在迦南地生的。"],[6,"以扫带着他的妻子、儿女与家中一切的人口，并他的牛羊、牲畜和一切货财，就是他在迦南地所得的，往别处去，离了他兄弟雅各。"],[7,"因为二人的财物群畜甚多，寄居的地方容不下他们，所以不能同居。"],[8,"于是，以扫住在西珥山里；以扫就是以东。"],[9,"以扫是西珥山里以东人的始祖，他的后代记在下面。"],[10,"以扫众子的名字如下：以扫的妻子亚大生以利法；以扫的妻子巴实抹生流珥。"],[11,"以利法的儿子是提幔、阿抹、洗玻、迦坦、基纳斯。"],[12,"亭纳是以扫儿子以利法的妾，她给以利法生了亚玛力。这是以扫的妻子亚大的子孙。"],[13,"流珥的儿子是拿哈、谢拉、沙玛、米撒。这是以扫妻子巴实抹的子孙。"],[14,"以扫的妻子阿何利巴玛是祭便的孙女、亚拿的女儿，她给以扫生了耶乌施、雅兰、可拉。"],[15,"以扫子孙中作族长的，记在下面：以扫的长子以利法的子孙中，有提幔族长、阿抹族长、洗玻族长、基纳斯族长、"],[16,"可拉族长、迦坦族长、亚玛力族长。这是在以东地从以利法所出的族长，都是亚大的子孙。"],[17,"以扫的儿子流珥的子孙中，有拿哈族长、谢拉族长、沙玛族长、米撒族长。这是在以东地从流珥所出的族长，都是以扫妻子巴实抹的子孙。"],[18,"以扫的妻子阿何利巴玛的子孙中，有耶乌施族长、雅兰族长、可拉族长。这是从以扫妻子、亚拿的女儿，阿何利巴玛子孙中所出的族长。"],[19,"以上的族长都是以扫的子孙；以扫就是以东。"],[20,"那地原有的居民何利人西珥的子孙记在下面：就是罗坍、朔巴、祭便、亚拿、"],[21,"底顺、以察、底珊。这是从以东地的何利人西珥子孙中所出的族长。"],[22,"罗坍的儿子是何利、希幔；罗坍的妹子是亭纳。"],[23,"朔巴的儿子是亚勒文、玛拿辖、以巴录、示玻、阿南。"],[24,"祭便的儿子是亚雅、亚拿。当时在旷野放他父亲祭便的驴，遇着温泉的就是这亚拿。"],[25,"亚拿的儿子是底顺；亚拿的女儿是阿何利巴玛。"],[26,"底顺的儿子是欣但、伊是班、益兰、基兰。"],[27,"以察的儿子是辟罕、撒番、亚干。"],[28,"底珊的儿子是乌斯、亚兰。"],[29,"从何利人所出的族长记在下面：就是罗坍族长、朔巴族长、祭便族长、亚拿族长、"],[30,"底顺族长、以察族长、底珊族长。这是从何利人所出的族长，都在西珥地，按着宗族作族长。"],[31,"以色列人未有君王治理以先，在以东地作王的，记在下面："],[32,"比珥的儿子比拉在以东作王，他的京城名叫亭哈巴。"],[33,"比拉死了，波斯拉人谢拉的儿子约巴接续他作王。"],[34,"约巴死了，提幔地的人户珊接续他作王。"],[35,"户珊死了，比达的儿子哈达接续他作王。这哈达就是在摩押地杀败米甸人的，他的京城名叫亚未得。"],[36,"哈达死了，玛士利加人桑拉接续他作王。"],[37,"桑拉死了，大河边的利河伯人扫罗接续他作王。"],[38,"扫罗死了。亚革波的儿子巴勒哈南接续他作王。"],[39,"亚革波的儿子巴勒哈南死了，哈达接续他作王。他的京城名叫巴乌，他的妻子名叫米希他别，是米萨合的孙女，玛特列的女儿。"],[40,"从以扫所出的族长，按着他们的宗族、住处、名字记在下面：就是亭纳族长、亚勒瓦族长、耶帖族长、"],[41,"阿何利巴玛族长、以拉族长、比嫩族长、"],[42,"基纳斯族长、提幔族长、米比萨族长、"],[43,"玛基迭族长、以兰族长。这是以东人在所得为业的地上，按着他们的住处，所有的族长，都是以东人的始祖以扫的后代。"]]},{"n":37,"v":[[1,"雅各住在迦南地，就是他父亲寄居的地。"],[2,"雅各的记略如下：约瑟十七岁与他哥哥们一同牧羊。他是个童子，与他父亲的妾辟拉、悉帕的儿子们常在一处。约瑟将他哥哥们的恶行报给他们的父亲。"],[3,"以色列原来爱约瑟过于爱他的众子，因为约瑟是他年老生的，他给约瑟作了一件彩衣。"],[4,"约瑟的哥哥们见父亲爱约瑟过于爱他们，就恨约瑟，不与他说和睦的话。"],[5,"约瑟作了一梦，告诉他哥哥们，他们就越发恨他。"],[6,"约瑟对他们说：“请听我所作的梦："],[7,"我们在田里捆禾稼，我的捆起来站着，你们的捆来围着我的捆下拜。”"],[8,"他的哥哥们回答说：“难道你真要作我们的王吗？难道你真要管辖我们吗？”他们就因为他的梦和他的话，越发恨他。"],[9,"后来他又作了一梦，也告诉他的哥哥们说：“看哪，我又作了一梦，梦见太阳、月亮与十一个星向我下拜。”"],[10,"约瑟将这梦告诉他父亲和他哥哥们，他父亲就责备他说：“你作的这是什么梦！难道我和你母亲、你弟兄果然要来俯伏在地，向你下拜吗？”"],[11,"他哥哥们都嫉妒他，他父亲却把这话存在心里。"],[12,"约瑟的哥哥们往示剑去，放他们父亲的羊。"],[13,"以色列对约瑟说：“你哥哥们不是在示剑放羊吗？你来，我要打发你往他们那里去。”约瑟说：“我在这里。”"],[14,"以色列说：“你去看看你哥哥们平安不平安，群羊平安不平安，就回来报信给我。”于是打发他出希伯仑谷，他就往示剑去了。"],[15,"有人遇见他在田野走迷了路，就问他说：“你找什么？”"],[16,"他说：“我找我的哥哥们，求你告诉我他们在何处放羊。”"],[17,"那人说：“他们已经走了，我听见他们说要往多坍去。”约瑟就去追赶他哥哥们，遇见他们在多坍。"],[18,"他们远远地看见他，趁他还没有走到跟前，大家就同谋要害死他，"],[19,"彼此说：“你看！那作梦的来了。"],[20,"来吧！我们将他杀了，丢在一个坑里，就说有恶兽把他吃了，我们且看他的梦将来怎么样。”"],[21,"流便听见了，要救他脱离他们的手，说：“我们不可害他的性命。”"],[22,"又说：“不可流他的血，可以把他丢在这野地的坑里，不可下手害他。”流便的意思是要救他脱离他们的手，把他归还他的父亲。"],[23,"约瑟到了他哥哥们那里，他们就剥了他的外衣，就是他穿的那件彩衣，"],[24,"把他丢在坑里，那坑是空的，里头没有水。"],[25,"他们坐下吃饭，举目观看，见有一伙米甸的以实玛利人从基列来，用骆驼驮着香料、乳香、没药，要带下埃及去。"],[26,"犹大对众弟兄说：“我们杀我们的兄弟，藏了他的血，有什么益处呢？"],[27,"我们不如将他卖给以实玛利人，不可下手害他，因为他是我们的兄弟，我们的骨肉。”众弟兄就听从了他。"],[28,"有些米甸的商人从那里经过，哥哥们就把约瑟从坑里拉上来，讲定二十舍客勒银子，把约瑟卖给以实玛利人。他们就把约瑟带到埃及去了。"],[29,"流便回到坑边，见约瑟不在坑里，就撕裂衣服，"],[30,"回到兄弟们那里说：“童子没有了！我往哪里去才好呢？”"],[31,"他们宰了一只公山羊，把约瑟的那件彩衣染了血，"],[32,"打发人送到他们的父亲那里，说：“我们捡了这个，请认一认，是你儿子的外衣不是？”"],[33,"他认得，就说：“这是我儿子的外衣，有恶兽把他吃了，约瑟被撕碎了！撕碎了！”"],[34,"雅各便撕裂衣服，腰间围上麻布，为他儿子悲哀了多日。"],[35,"他的儿女都起来安慰他，他却不肯受安慰，说：“我必悲哀着下阴间到我儿子那里。”约瑟的父亲就为他哀哭。"],[36,"米甸人带约瑟到埃及，把他卖给法老的内臣，护卫长波提乏。"]]},{"n":38,"v":[[1,"那时，犹大离开他弟兄下去，到一个亚杜兰人名叫希拉的家里去。"],[2,"犹大在那里看见一个迦南人名叫书亚的女儿，就娶她为妻，与她同房，"],[3,"她就怀孕生了儿子，犹大给他起名叫珥。"],[4,"她又怀孕生了儿子，母亲给他起名叫俄南。"],[5,"她复又生了儿子，给他起名叫示拉。她生示拉的时候，犹大正在基悉。"],[6,"犹大为长子珥娶妻，名叫他玛。"],[7,"犹大的长子珥在耶和华眼中看为恶，耶和华就叫他死了。"],[8,"犹大对俄南说：“你当与你哥哥的妻子同房，向她尽你为弟的本分，为你哥哥生子立后。”"],[9,"俄南知道生子不归自己，所以同房的时候，便遗在地，免得给他哥哥留后。"],[10,"俄南所作的在耶和华眼中看为恶，耶和华也就叫他死了。"],[11,"犹大心里说：“恐怕示拉也死，像他两个哥哥一样”，就对他儿妇他玛说：“你去，在你父亲家里守寡，等我儿子示拉长大。”他玛就回去住在她父亲家里。"],[12,"过了许久，犹大的妻子书亚的女儿死了，犹大得了安慰，就和他朋友亚杜兰人希拉上亭拿去，到他剪羊毛的人那里。"],[13,"有人告诉他玛说：“你的公公上亭拿剪羊毛去了。”"],[14,"他玛见示拉已经长大，还没有娶她为妻，就脱了她作寡妇的衣裳，用帕子蒙着脸，又遮住身体，坐在亭拿路上的伊拿印城门口。"],[15,"犹大看见她，以为是妓女，因为她蒙着脸。"],[16,"犹大就转到她那里去，说：“来吧！让我与你同寝。”他原不知道是他的儿妇。他玛说：“你要与我同寝，把什么给我呢？”"],[17,"犹大说：“我从羊群里取一只山羊羔，打发人送来给你。”他玛说：“在未送以先，你愿意给我一个当头吗？”"],[18,"他说：“我给你什么当头呢？”他玛说：“你的印，你的带子和你手里的杖。”"],[19,"犹大就给了她，与她同寝，她就从犹大怀了孕。他玛起来走了，除去帕子，仍旧穿上作寡妇的衣裳。"],[20,"犹大托他朋友亚杜兰人送一只山羊羔去，要从那女人手里取回当头来，却找不着她，"],[21,"就问那地方的人说：“伊拿印路旁的妓女在哪里？”他们说：“这里并没有妓女。”"],[22,"他回去见犹大说：“我没有找着她，并且那地方的人说：‘这里没有妓女。’”"],[23,"犹大说：“我把这山羊羔送去了，你竟找不着她，任凭她拿去吧，免得我们被羞辱。”"],[24,"约过了三个月，有人告诉犹大说：“你的儿妇他玛作了妓女，且因行淫有了身孕。”犹大说：“拉出她来，把她烧了！”"],[25,"他玛被拉出来的时候，便打发人去见她公公，对他说：“这些东西是谁的，我就是从谁怀的孕。请你认一认，这印和带子并杖都是谁的？”"],[26,"犹大承认说：“她比我更有义，因为我没有将她给我的儿子示拉。”从此犹大不再与她同寝了。"],[27,"他玛将要生产，不料她腹里是一对双生。"],[28,"到生产的时候，一个孩子伸出一只手来，收生婆拿红线拴在他手上，说：“这是头生的。”"],[29,"随后这孩子把手收回去，他哥哥生出来了。收生婆说：“你为什么抢着来呢？”因此给他起名叫法勒斯。"],[30,"后来，他兄弟那手上有红线的也生出来，就给他起名叫谢拉。"]]},{"n":39,"v":[[1,"约瑟被带下埃及去。有一个埃及人，是法老的内臣，护卫长波提乏，从那些带下他来的以实玛利人手下买了他去。"],[2,"约瑟住在他主人埃及人的家中，耶和华与他同在，他就百事顺利。"],[3,"他主人见耶和华与他同在，又见耶和华使他手里所办的尽都顺利，"],[4,"约瑟就在主人眼前蒙恩，伺候他主人，并且主人派他管理家务，把一切所有的都交在他手里。"],[5,"自从主人派约瑟管理家务和他一切所有的，耶和华就因约瑟的缘故赐福与那埃及人的家；凡家里和田间一切所有的都蒙耶和华赐福。"],[6,"波提乏将一切所有的都交在约瑟的手中，除了自己所吃的饭，别的事一概不知。约瑟原来秀雅俊美。"],[7,"这事以后，约瑟主人的妻，以目送情给约瑟，说：“你与我同寝吧！”"],[8,"约瑟不从，对他主人的妻说：“看哪，一切家务，我主人都不知道，他把所有的都交在我手里。"],[9,"在这家里没有比我大的，并且他没有留下一样不交给我，只留下了你，因为你是他的妻子。我怎能作这大恶，得罪神呢？”"],[10,"后来她天天和约瑟说，约瑟却不听从她，不与她同寝，也不和她在一处。"],[11,"有一天，约瑟进屋里去办事，家中人没有一个在那屋里，"],[12,"妇人就拉住他的衣裳，说：“你与我同寝吧！”约瑟把衣裳丢在妇人手里，跑到外边去了。"],[13,"妇人看见约瑟把衣裳丢在她手里跑出去了，"],[14,"就叫了家里的人来，对他们说：“你们看！他带了一个希伯来人进入我们家里，要戏弄我们。他到我这里来，要与我同寝，我就大声喊叫。"],[15,"他听见我放声喊起来，就把衣裳丢在我这里，跑到外边去了。”"],[16,"妇人把约瑟的衣裳放在自己那里，等着他主人回家，"],[17,"就对他如此如此说：“你所带到我们这里的那希伯来仆人进来要戏弄我，"],[18,"我放声喊起来，他就把衣裳丢在我这里跑出去了。”"],[19,"约瑟的主人听见他妻子对他所说的话说，你的仆人如此如此待我，他就生气，"],[20,"把约瑟下在监里，就是王的囚犯被囚的地方。于是约瑟在那里坐监。"],[21,"但耶和华与约瑟同在，向他施恩，使他在司狱的眼前蒙恩。"],[22,"司狱就把监里所有的囚犯都交在约瑟的手下，他们在那里所办的事都是经他的手。"],[23,"凡在约瑟手下的事，司狱一概不察，因为耶和华与约瑟同在，耶和华使他所作的尽都顺利。"]]},{"n":40,"v":[[1,"这事以后，埃及王的酒政和膳长得罪了他们的主埃及王，"],[2,"法老就恼怒酒政和膳长这二臣，"],[3,"把他们下在护卫长府内的监里，就是约瑟被囚的地方。"],[4,"护卫长把他们交给约瑟，约瑟便伺候他们；他们有些日子在监里。"],[5,"被囚在监之埃及王的酒政和膳长，二人同夜各作一梦，各梦都有讲解。"],[6,"到了早晨，约瑟进到他们那里，见他们有愁闷的样子。"],[7,"他便问法老的二臣，就是与他同囚在他主人府里的，说：“你们今日为什么面带愁容呢？”"],[8,"他们对他说：“我们各人作了一梦，没有人能解。”约瑟说：“解梦不是出于神吗？请你们将梦告诉我。”"],[9,"酒政便将他的梦告诉约瑟说：“我梦见在我面前有一棵葡萄树，"],[10,"树上有三根枝子，好像发了芽、开了花，上头的葡萄都成熟了。"],[11,"法老的杯在我手中，我就拿葡萄挤在法老的杯里，将杯递在他手中。”"],[12,"约瑟对他说：“你所作的梦是这样解：三根枝子就是三天，"],[13,"三天之内，法老必提你出监，叫你官复原职，你仍要递杯在法老的手中，和先前作他的酒政一样。"],[14,"但你得好处的时候，求你记念我，施恩与我，在法老面前提说我，救我出这监牢。"],[15,"我实在是从希伯来人之地被拐来的，我在这里也没有作过什么，叫他们把我下在监里。”"],[16,"膳长见梦解得好，就对约瑟说：“我在梦中见我头上顶着三筐白饼，"],[17,"极上的筐子里有为法老烤的各样食物，有飞鸟来吃我头上筐子里的食物。”"],[18,"约瑟说：“你的梦是这样解：三个筐子就是三天。"],[19,"三天之内，法老必斩断你的头，把你挂在木头上，必有飞鸟来吃你身上的肉。”"],[20,"到了第三天，是法老的生日，他为众臣仆设摆筵席，把酒政和膳长提出监来，"],[21,"使酒政官复原职，他仍旧递杯在法老手中。"],[22,"但把膳长挂起来，正如约瑟向他们所解的话。"],[23,"酒政却不记念约瑟，竟忘了他。"]]},{"n":41,"v":[[1,"过了两年，法老作梦：梦见自己站在河边，"],[2,"有七只母牛从河里上来，又美好又肥壮，在芦荻中吃草。"],[3,"随后又有七只母牛从河里上来，又丑陋又干瘦，与那七只母牛一同站在河边。"],[4,"这又丑陋又干瘦的七只母牛吃尽了那又美好又肥壮的七只母牛。法老就醒了。"],[5,"他又睡着，第二回作梦：梦见一棵麦子长了七个穗子，又肥大又佳美，"],[6,"随后又长了七个穗子，又细弱又被东风吹焦了。"],[7,"这细弱的穗子吞了那七个又肥大又饱满的穗子。法老醒了，不料是个梦。"],[8,"到了早晨，法老心里不安，就差人召了埃及所有的术士和博士来。法老就把所作的梦告诉他们，却没有人能给法老圆解。"],[9,"那时酒政对法老说：“我今日想起我的罪来。"],[10,"从前法老恼怒臣仆，把我和膳长下在护卫长府内的监里。"],[11,"我们二人同夜各作一梦，各梦都有讲解。"],[12,"在那里同着我们有一个希伯来的少年人，是护卫长的仆人，我们告诉他，他就把我们的梦圆解，是按着各人的梦圆解的。"],[13,"后来正如他给我们圆解的成就了：我官复原职；膳长被挂起来了。”"],[14,"法老遂即差人去召约瑟，他们便急忙带他出监，他就剃头、刮脸、换衣裳，进到法老面前。"],[15,"法老对约瑟说：“我作了一梦，没有人能解，我听见人说，你听了梦就能解。”"],[16,"约瑟回答法老说：“这不在乎我，神必将平安的话回答法老。”"],[17,"法老对约瑟说：“我梦见我站在河边，"],[18,"有七只母牛从河里上来，又肥壮又美好，在芦荻中吃草。"],[19,"随后又有七只母牛上来，又软弱又丑陋又干瘦，在埃及遍地，我没有见过这样不好的。"],[20,"这又干瘦又丑陋的母牛吃尽了那以先的七只肥母牛，"],[21,"吃了以后却看不出是吃了，那丑陋的样子仍旧和先前一样。我就醒了。"],[22,"我又梦见一棵麦子，长了七个穗子，又饱满又佳美，"],[23,"随后又长了七个穗子，枯槁细弱，被东风吹焦了。"],[24,"这些细弱的穗子吞了那七个佳美的穗子。我将这梦告诉了术士，却没有人能给我解说。”"],[25,"约瑟对法老说：“法老的梦乃是一个，神已将所要作的事指示法老了。"],[26,"七只好母牛是七年；七个好穗子也是七年。这梦乃是一个。"],[27,"那随后上来的七只又干瘦又丑陋的母牛是七年；那七个虚空、被东风吹焦的穗子也是七年，都是七个荒年。"],[28,"这就是我对法老所说，神已将所要作的事显明给法老了。"],[29,"埃及遍地必来七个大丰年；"],[30,"随后又要来七个荒年，甚至在埃及地都忘了先前的丰收，全地必被饥荒所灭。"],[31,"因那以后的饥荒甚大，便不觉得先前的丰收了。"],[32,"至于法老两回作梦，是因神命定这事，而且必速速成就。"],[33,"所以法老当拣选一个有聪明有智慧的人，派他治理埃及地。"],[34,"法老当这样行，又派官员管理这地。当七个丰年的时候，征收埃及地的五分之一，"],[35,"叫他们把将来丰年一切的粮食聚敛起来，积蓄五谷，收存在各城里作食物，归于法老的手下。"],[36,"所积蓄的粮食可以防备埃及地将来的七个荒年，免得这地被饥荒所灭。”"],[37,"法老和他一切臣仆，都以这事为妙。"],[38,"法老对臣仆说：“像这样的人，有神的灵在他里头，我们岂能找得着呢？”"],[39,"法老对约瑟说：“神既将这事都指示你，可见没有人像你这样有聪明有智慧。"],[40,"你可以掌管我的家，我的民都必听从你的话，惟独在宝座上我比你大。”"],[41,"法老又对约瑟说：“我派你治理埃及全地。”"],[42,"法老就摘下手上打印的戒指，戴在约瑟的手上，给他穿上细麻衣，把金链戴在他的颈项上。"],[43,"又叫约瑟坐他的副车，喝道的在前呼叫说：“跪下！”这样，法老派他治理埃及全地。"],[44,"法老对约瑟说：“我是法老，在埃及全地，若没有你的命令，不许人擅自办事（原文作“动手动脚”）。”"],[45,"法老赐名给约瑟，叫撒发那忒巴内亚，又将安城的祭司波提非拉的女儿亚西纳给他为妻。约瑟就出去巡行埃及地。"],[46,"约瑟见埃及王法老的时候年三十岁。他从法老面前出去遍行埃及全地。"],[47,"七个丰年之内，地的出产极丰极盛（原文作“一把一把的”），"],[48,"约瑟聚敛埃及地七个丰年一切的粮食，把粮食积存在各城里，各城周围田地的粮食都积存在本城里。"],[49,"约瑟积蓄五谷甚多，如同海边的沙，无法计算，因为谷不可胜数。"],[50,"荒年未到以前。安城的祭司波提非拉的女儿亚西纳给约瑟生了两个儿子。"],[51,"约瑟给长子起名叫玛拿西（就是“使之忘了”的意思），因为他说：“神使我忘了一切的困苦和我父的全家。”"],[52,"他给次子起名叫以法莲（就是“使之昌盛”的意思），因为他说：“神使我在受苦的地方昌盛。”"],[53,"埃及地的七个丰年一完，"],[54,"七个荒年就来了，正如约瑟所说的，各地都有饥荒，惟独埃及全地有粮食。"],[55,"及至埃及全地有了饥荒，众民向法老哀求粮食，法老对他们说：“你们往约瑟那里去，凡他所说的你们都要作。”"],[56,"当时饥荒遍满天下，约瑟开了各处的仓，籴粮给埃及人；在埃及地饥荒甚大。"],[57,"各地的人都往埃及去，到约瑟那里籴粮，因为天下的饥荒甚大。"]]},{"n":42,"v":[[1,"雅各见埃及有粮，就对儿子们说：“你们为什么彼此观望呢？"],[2,"我听见埃及有粮，你们可以下去，从那里为我们籴些来，使我们可以存活，不至于死。”"],[3,"于是，约瑟的十个哥哥都下埃及籴粮去了。"],[4,"但约瑟的兄弟便雅悯，雅各没有打发他和哥哥们同去，因为雅各说：“恐怕他遭害。”"],[5,"来籴粮的人中有以色列的儿子们，因为迦南地也有饥荒。"],[6,"当时治理埃及地的是约瑟，籴粮给那地众民的就是他。约瑟的哥哥们来了，脸伏于地，向他下拜。"],[7,"约瑟看见他哥哥们，就认得他们，却装作生人，向他们说些严厉话，问他们说：“你们从哪里来？”他们说：“我们从迦南地来籴粮。”"],[8,"约瑟认得他哥哥们，他们却不认得他。"],[9,"约瑟想起从前所作的那两个梦，就对他们说：“你们是奸细，来窥探这地的虚实。”"],[10,"他们对他说：“我主啊，不是的，仆人们是籴粮来的。"],[11,"我们都是一个人的儿子，是诚实人，仆人们并不是奸细。”"],[12,"约瑟说：“不然，你们必是窥探这地的虚实来的。”"],[13,"他们说：“仆人们本是弟兄十二人，是迦南地一个人的儿子，顶小的现今在我们的父亲那里，有一个没有了。”"],[14,"约瑟说：“我才说你们是奸细，这话实在不错。"],[15,"我指着法老的性命起誓，若是你们的小兄弟不到这里来，你们就不得出这地方，从此就可以把你们证验出来了。"],[16,"须要打发你们中间一个人去，把你们的兄弟带来。至于你们，都要囚在这里，好证验你们的话真不真，若不真，我指着法老的性命起誓，你们一定是奸细。”"],[17,"于是约瑟把他们都下在监里三天。"],[18,"到第三天，约瑟对他们说：“我是敬畏神的，你们照我的话行就可以存活。"],[19,"你们如果是诚实人，可以留你们中间的一个人囚在监里，但你们可以带着粮食回去，救你们家里的饥荒。"],[20,"把你们的小兄弟带到我这里来，如此，你们的话便有证据，你们也不至于死。”他们就照样而行。"],[21,"他们彼此说：“我们在兄弟身上实在有罪，他哀求我们的时候，我们见他心里的愁苦，却不肯听，所以这场苦难临到我们身上。”"],[22,"流便说：“我岂不是对你们说过，不可伤害那孩子吗？只是你们不肯听，所以流他血的罪向我们追讨。”"],[23,"他们不知道约瑟听得出来，因为在他们中间用通事传话。"],[24,"约瑟转身退去，哭了一场，又回来对他们说话，就从他们中间挑出西缅来，在他们眼前把他捆绑。"],[25,"约瑟吩咐人把粮食装满他们的器具，把各人的银子归还在各人的口袋里，又给他们路上用的食物。人就照他的话办了。"],[26,"他们就把粮食驮在驴上，离开那里去了。"],[27,"到了住宿的地方，他们中间有一个人打开口袋，要拿料喂驴，才看见自己的银子仍在口袋里，"],[28,"就对弟兄们说：“我的银子归还了，看哪，仍在我口袋里！”他们就提心吊胆，战战兢兢地彼此说：“这是神向我们作什么呢？”"],[29,"他们来到迦南地他们的父亲雅各那里，将所遭遇的事都告诉他说："],[30,"“那地的主对我们说严厉的话，把我们当作窥探那地的奸细。"],[31,"我们对他说：‘我们是诚实人，并不是奸细。"],[32,"我们本是弟兄十二人，都是一个父亲的儿子，有一个没有了，顶小的如今同我们的父亲在迦南地。’"],[33,"那地的主对我们说：‘若要我知道你们是诚实人，可以留下你们中间的一个人在我这里，你们可以带着粮食回去，救你们家里的饥荒。"],[34,"把你们的小兄弟带到我这里来，我便知道你们不是奸细，乃是诚实人。这样，我就把你们的弟兄交给你们，你们也可以在这地作买卖。’”"],[35,"后来他们倒口袋，不料，各人的银包都在口袋里，他们和父亲看见银包就都害怕。"],[36,"他们的父亲雅各对他们说：“你们使我丧失我的儿子：约瑟没有了，西缅也没有了，你们又要将便雅悯带去；这些事都归到我身上了。”"],[37,"流便对他父亲说：“我若不带他回来交给你，你可以杀我的两个儿子。只管把他交在我手里，我必带他回来交给你。”"],[38,"雅各说：“我的儿子不可与你们一同下去，他哥哥死了，只剩下他，他若在你们所行的路上遭害，那便是你们使我白发苍苍、悲悲惨惨地下阴间去了。”"]]},{"n":43,"v":[[1,"那地的饥荒甚大。"],[2,"他们从埃及带来的粮食吃尽了，他们的父亲就对他们说：“你们再去给我籴些粮来。”"],[3,"犹大对他说：“那人谆谆地告诫我们说：‘你们的兄弟若不与你们同来，你们就不得见我的面。’"],[4,"你若打发我们的兄弟与我们同去，我们就下去给你籴粮；"],[5,"你若不打发他去，我们就不下去，因为那人对我们说：‘你们的兄弟若不与你们同来，你们就不得见我的面。’”"],[6,"以色列说：“你们为什么这样害我，告诉那人你们还有兄弟呢？”"],[7,"他们回答说：“那人详细问到我们和我们的亲属，说：‘你们的父亲还在吗？你们还有兄弟吗？’我们就按着他所问的告诉他，焉能知道他要说：‘必须把你们的兄弟带下来’呢？”"],[8,"犹大又对他父亲以色列说：“你打发童子与我同去，我们就起身下去，好叫我们和你，并我们的妇人孩子，都得存活，不至于死。"],[9,"我为他作保，你可以从我手中追讨，我若不带他回来交在你面前，我情愿永远担罪。"],[10,"我们若没有耽搁，如今第二次都回来了。”"],[11,"他们的父亲以色列说：“若必须如此，你们就当这样行：可以将这地土产中最好的乳香、蜂蜜、香料、没药、榧子、杏仁，都取一点收在器具里，带下去送给那人作礼物。"],[12,"又要手里加倍地带银子，并将归还在你们口袋内的银子仍带在手里，那或者是错了。"],[13,"也带着你们的兄弟，起身去见那人。"],[14,"但愿全能的神使你们在那人面前蒙怜悯，释放你们的那弟兄和便雅悯回来。我若丧了儿子，就丧了吧！”"],[15,"于是他们拿着那礼物，又手里加倍地带银子，并且带着便雅悯起身下到埃及，站在约瑟面前。"],[16,"约瑟见便雅悯和他们同来，就对家宰说：“将这些人领到屋里，要宰杀牲畜，预备筵席，因为晌午这些人同我吃饭。”"],[17,"家宰就遵着约瑟的命去行，领他们进约瑟的屋里。"],[18,"他们因为被领到约瑟的屋里，就害怕说：“领我们到这里来，必是因为头次归还在我们口袋里的银子，找我们的错缝，下手害我们，强取我们为奴仆，抢夺我们的驴。”"],[19,"他们就挨近约瑟的家宰，在屋门口和他说话，"],[20,"说：“我主啊，我们头次下来实在是要籴粮。"],[21,"后来到了住宿的地方，我们打开口袋，不料，各人的银子分量足数，仍在各人的口袋内，现在我们手里又带回来了。"],[22,"另外又带下银子来籴粮，不知道先前谁把银子放在我们的口袋里。”"],[23,"家宰说：“你们可以放心，不要害怕，是你们的神和你们父亲的神赐给你们财宝在你们的口袋里。你们的银子我早已收了。”他就把西缅带出来交给他们。"],[24,"家宰就领他们进约瑟的屋里，给他们水洗脚，又给他们草料喂驴。"],[25,"他们就预备那礼物，等候约瑟晌午来，因为他们听见要在那里吃饭。"],[26,"约瑟来到家里，他们就把手中的礼物拿进屋去给他，又俯伏在地向他下拜。"],[27,"约瑟问他们好，又问：“你们的父亲，就是你们所说的那老人家平安吗？他还在吗？”"],[28,"他们回答说：“你仆人我们的父亲平安，他还在。”于是他们低头下拜。"],[29,"约瑟举目看见他同母的兄弟便雅悯，就说：“你们向我所说那顶小的兄弟就是这位吗？”又说：“小儿啊，愿神赐恩给你！”"],[30,"约瑟爱弟之情发动，就急忙寻找可哭之地，进入自己的屋里，哭了一场。"],[31,"他洗了脸出来，勉强隐忍，吩咐人摆饭。"],[32,"他们就为约瑟单摆了一席，为那些人又摆了一席，也为和约瑟同吃饭的埃及人另摆了一席，因为埃及人不可和希伯来人一同吃饭，那原是埃及人所厌恶的。"],[33,"约瑟使众弟兄在他面前排列坐席，都按着长幼的次序，众弟兄就彼此诧异。"],[34,"约瑟把他面前的食物分出来，送给他们，但便雅悯所得的比别人多五倍。他们就饮酒，和约瑟一同宴乐。"]]},{"n":44,"v":[[1,"约瑟吩咐家宰说：“把粮食装满这些人的口袋，尽着他们的驴所能驮的，又把各人的银子放在各人的口袋里，"],[2,"并将我的银杯和那少年人籴粮的银子，一同装在他的口袋里。”家宰就照约瑟所说的话行了。"],[3,"天一亮就打发那些人带着驴走了。"],[4,"他们出城走了不远，约瑟对家宰说：“起来！追那些人去，追上了就对他们说：‘你们为什么以恶报善呢？"],[5,"这不是我主人饮酒的杯吗？岂不是他占卜用的吗？你们这样行是作恶了。’”"],[6,"家宰追上他们，将这些话对他们说了。"],[7,"他们回答说：“我主为什么说这样的话呢？你仆人断不能作这样的事。"],[8,"你看，我们从前在口袋里所见的银子，尚且从迦南地带来还你，我们怎能从你主人家里偷窃金银呢？"],[9,"你仆人中，无论在谁那里搜出来，就叫他死，我们也作我主的奴仆。”"],[10,"家宰说：“现在就照你们的话行吧！在谁那里搜出来，谁就作我的奴仆，其余的都没有罪。”"],[11,"于是他们各人急忙把口袋卸在地下，各人打开口袋。"],[12,"家宰就搜查，从年长的起，到年幼的为止，那杯竟在便雅悯的口袋里搜出来。"],[13,"他们就撕裂衣服，各人把驮子抬在驴上，回城去了。"],[14,"犹大和他弟兄们来到约瑟的屋中，约瑟还在那里，他们就在他面前俯伏于地。"],[15,"约瑟对他们说：“你们作的是什么事呢？你们岂不知像我这样的人必能占卜吗？”"],[16,"犹大说：“我们对我主说什么呢？还有什么话可说呢？我们怎能自己表白出来呢？神已经查出仆人的罪孽了，我们与那在他手中搜出杯来的都是我主的奴仆。”"],[17,"约瑟说：“我断不能这样行，在谁的手中搜出杯来，谁就作我的奴仆；至于你们，可以平平安安地上你们父亲那里去。”"],[18,"犹大挨近他说：“我主啊，求你容仆人说一句话给我主听，不要向仆人发烈怒，因为你如同法老一样。"],[19,"我主曾问仆人们说：‘你们有父亲、有兄弟没有？’"],[20,"我们对我主说：‘我们有父亲，已经年老，还有他老年所生的一个小孩子。他哥哥死了，他母亲只撇下他一人，他父亲疼爱他。’"],[21,"你对仆人说：‘把他带到我这里来，叫我亲眼看看他。’"],[22,"我们对我主说：‘童子不能离开他父亲，若是离开，他父亲必死。’"],[23,"你对仆人说：‘你们的小兄弟若不与你们一同下来，你们就不得再见我的面。’"],[24,"我们上到你仆人我们父亲那里，就把我主的话告诉了他。"],[25,"我们的父亲说：‘你们再去给我籴些粮来。’"],[26,"我们就说：‘我们不能下去，我们的小兄弟若和我们同往，我们就可以下去，因为小兄弟若不与我们同往，我们必不得见那人的面。’"],[27,"你仆人我父亲对我们说：‘你们知道我的妻子给我生了两个儿子，"],[28,"一个离开我出去了。我说：他必是被撕碎了，直到如今我也没有见他。"],[29,"现在你们又要把这个带去离开我，倘若他遭害，那便是你们使我白发苍苍、悲悲惨惨地下阴间去了。’"],[30,"我父亲的命与这童子的命相连，如今我回到你仆人我父亲那里，若没有童子与我们同在，"],[31,"我们的父亲见没有童子，他就必死。这便是我们使你仆人我们的父亲，白发苍苍、悲悲惨惨地下阴间去了。"],[32,"因为仆人曾向我父亲为这童子作保，说：‘我若不带他回来交给父亲，我便在父亲面前永远担罪。’"],[33,"现在求你容仆人住下，替这童子作我主的奴仆，叫童子和他哥哥们一同上去。"],[34,"若童子不和我同去，我怎能上去见我父亲呢？恐怕我看见灾祸临到我父亲身上。”"]]},{"n":45,"v":[[1,"约瑟在左右站着的人面前情不自禁，吩咐一声说：“人都要离开我出去！”约瑟和弟兄们相认的时候，并没有一人站在他面前。"],[2,"他就放声大哭，埃及人和法老家中的人都听见了。"],[3,"约瑟对他弟兄们说：“我是约瑟，我的父亲还在吗？”他弟兄不能回答，因为在他面前都惊惶。"],[4,"约瑟又对他弟兄们说：“请你们近前来。”他们就近前来，他说：“我是你们的兄弟约瑟，就是你们所卖到埃及的。"],[5,"现在不要因为把我卖到这里自忧自恨，这是神差我在你们以先来，为要保全生命。"],[6,"现在这地的饥荒已经二年了，还有五年不能耕种，不能收成。"],[7,"神差我在你们以先来，为要给你们存留余种在世上，又要大施拯救，保全你们的生命。"],[8,"这样看来，差我到这里来的不是你们，乃是神。他又使我如法老的父，作他全家的主，并埃及全地的宰相。"],[9,"你们要赶紧上到我父亲那里，对他说：‘你儿子约瑟这样说：神使我作全埃及的主，请你下到我这里来，不要耽延。"],[10,"你和你的儿子、孙子，连牛群羊群，并一切所有的，都可以住在歌珊地与我相近，"],[11,"我要在那里奉养你。因为还有五年的饥荒，免得你和你的眷属，并一切所有的，都败落了。’"],[12,"况且你们的眼和我兄弟便雅悯的眼，都看见是我亲口对你们说话。"],[13,"你们也要将我在埃及一切的荣耀和你们所看见的事，都告诉我父亲，又要赶紧地将我父亲搬到我这里来。”"],[14,"于是约瑟伏在他兄弟便雅悯的颈项上哭；便雅悯也在他的颈项上哭。"],[15,"他又与众弟兄亲嘴，抱着他们哭，随后他弟兄们就和他说话。"],[16,"这风声传到法老的宫里，说：“约瑟的弟兄们来了。”法老和他的臣仆都很喜欢。"],[17,"法老对约瑟说：“你吩咐你的弟兄们说：你们要这样行：把驮子抬在牲口上，起身往迦南地去。"],[18,"将你们的父亲和你们的眷属都搬到我这里来，我要把埃及地的美物赐给你们，你们也要吃这地肥美的出产。"],[19,"“现在我吩咐你们要这样行：从埃及地带着车辆去，把你们的孩子和妻子，并你们的父亲都搬来。"],[20,"你们眼中不要爱惜你们的家具，因为埃及全地的美物都是你们的。”"],[21,"以色列的儿子们就如此行。约瑟照着法老的吩咐给他们车辆和路上用的食物，"],[22,"又给他们各人一套衣服，惟独给便雅悯三百银子，五套衣服。"],[23,"送给他父亲公驴十匹，驮着埃及的美物；母驴十匹，驮着粮食与饼和菜，为他父亲路上用。"],[24,"于是约瑟打发他弟兄们回去，又对他们说：“你们不要在路上相争。”"],[25,"他们从埃及上去，来到迦南地他们的父亲雅各那里，"],[26,"告诉他说：“约瑟还在，并且作埃及全地的宰相。”雅各心里冰凉，因为不信他们。"],[27,"他们便将约瑟对他们说的一切话都告诉了他。他们父亲雅各，又看见约瑟打发来接他的车辆，心就苏醒了。"],[28,"以色列说：“罢了！罢了！我的儿子约瑟还在，趁我未死以先，我要去见他一面。”"]]},{"n":46,"v":[[1,"以色列带着一切所有的，起身来到别是巴，就献祭给他父亲以撒的神。"],[2,"夜间，神在异象中对以色列说：“雅各！雅各！”他说：“我在这里。”"],[3,"神说：“我是神，就是你父亲的神。你下埃及去不要害怕，因为我必使你在那里成为大族。"],[4,"我要和你同下埃及去，也必定带你上来，约瑟必给你送终（原文作“将手按在你的眼睛上”）。”"],[5,"雅各就从别是巴起行。以色列的儿子们使他们的父亲雅各和他们的妻子、儿女，都坐在法老为雅各送来的车上。"],[6,"他们又带着在迦南地所得的牲畜、货财来到埃及。雅各和他的一切子孙都一同来了。"],[7,"雅各把他的儿子、孙子、女儿、孙女，并他的子子孙孙，一同带到埃及。"],[8,"来到埃及的以色列人，名字记在下面：雅各和他的儿孙，雅各的长子是流便。"],[9,"流便的儿子是哈诺、法路、希斯伦、迦米；"],[10,"西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖，还有迦南女子所生的扫罗；"],[11,"利未的儿子是革顺、哥辖、米拉利；"],[12,"犹大的儿子是珥、俄南、示拉、法勒斯、谢拉，惟有珥与俄南死在迦南地；法勒斯的儿子是希斯伦、哈母勒；"],[13,"以萨迦的儿子是陀拉、普瓦、约伯、伸仑；"],[14,"西布伦的儿子是西烈、以伦、雅利；"],[15,"这是利亚在巴旦亚兰给雅各所生的儿子，还有女儿底拿。儿孙共有三十三人。"],[16,"迦得的儿子是洗非芸、哈基、书尼、以斯本、以利、亚罗底、亚列利。"],[17,"亚设的儿子是音拿、亦施瓦、亦施韦、比利亚，还有他们的妹子西拉。比利亚的儿子是希别、玛结。"],[18,"这是拉班给他女儿利亚的婢女悉帕从雅各所生的儿孙，共有十六人。"],[19,"雅各之妻拉结的儿子是约瑟和便雅悯。"],[20,"约瑟在埃及地生了玛拿西和以法莲，就是安城的祭司波提非拉的女儿亚西纳给约瑟生的。"],[21,"便雅悯的儿子是比拉、比结、亚实别、基拉、乃幔、以希、罗实、母平、户平、亚勒。"],[22,"这是拉结给雅各所生的儿孙，共有十四人。"],[23,"但的儿子是户伸；"],[24,"拿弗他利的儿子是雅薛、沽尼、耶色、示冷。"],[25,"这是拉班给他女儿拉结的婢女辟拉从雅各所生的儿孙，共有七人。"],[26,"那与雅各同到埃及的，除了他儿妇之外，凡从他所生的，共有六十六人。"],[27,"还有约瑟在埃及所生的两个儿子。雅各家来到埃及的共有七十人。"],[28,"雅各打发犹大先去见约瑟，请派人引路往歌珊去；于是他们来到歌珊地。"],[29,"约瑟套车往歌珊去，迎接他父亲以色列。及至见了面，就伏在父亲的颈项上，哭了许久。"],[30,"以色列对约瑟说：“我既得见你的面，知道你还在，就是死我也甘心。”"],[31,"约瑟对他的弟兄和他父的全家说：“我要上去告诉法老，对他说：‘我的弟兄和我父的全家，从前在迦南地，现今都到我这里来了。"],[32,"他们本是牧羊的人，以养牲畜为业，他们把羊群、牛群和一切所有的都带来了。’"],[33,"等法老召你们的时候，问你们说：‘你们以何事为业？’"],[34,"你们要说：‘你的仆人，从幼年直到如今，都以养牲畜为业，连我们的祖宗也都以此为业。’这样，你们可以住在歌珊地，因为凡牧羊的，都被埃及人所厌恶。”"]]},{"n":47,"v":[[1,"约瑟进去告诉法老说：“我的父亲和我的弟兄带着羊群牛群，并一切所有的，从迦南地来了，如今在歌珊地。”"],[2,"约瑟从他弟兄中挑出五个人来，引他们去见法老。"],[3,"法老问约瑟的弟兄说：“你们以何事为业？”他们对法老说：“你仆人是牧羊的，连我们的祖宗也是牧羊的。”"],[4,"他们又对法老说：“迦南地的饥荒甚大，仆人的羊群没有草吃，所以我们来到这地寄居。现在求你容仆人住在歌珊地。”"],[5,"法老对约瑟说：“你父亲和你弟兄到你这里来了，"],[6,"埃及地都在你面前，只管叫你父亲和你弟兄住在国中最好的地，他们可以住在歌珊地。你若知道他们中间有什么能人，就派他们看管我的牲畜。”"],[7,"约瑟领他父亲雅各进到法老面前，雅各就给法老祝福。"],[8,"法老问雅各说：“你平生的年日是多少呢？”"],[9,"雅各对法老说：“我寄居在世的年日是一百三十岁，我平生的年日又少又苦，不及我列祖在世寄居的年日。”"],[10,"雅各又给法老祝福，就从法老面前出去了。"],[11,"约瑟遵着法老的命，把埃及国最好的地，就是兰塞境内的地，给他父亲和弟兄居住，作为产业。"],[12,"约瑟用粮食奉养他父亲和他弟兄，并他父亲全家的眷属，都是照各家的人口奉养他们。"],[13,"饥荒甚大，全地都绝了粮，甚至埃及地和迦南地的人，因那饥荒的缘故都饿昏了。"],[14,"约瑟收聚了埃及地和迦南地所有的银子，就是众人籴粮的银子，约瑟就把那银子带到法老的宫里。"],[15,"埃及地和迦南地的银子都花尽了，埃及众人都来见约瑟说：“我们的银子都用尽了，求你给我们粮食，我们为什么死在你面前呢？”"],[16,"约瑟说：“若是银子用尽了，可以把你们的牲畜给我，我就为你们的牲畜给你们粮食。”"],[17,"于是他们把牲畜赶到约瑟那里，约瑟就拿粮食换了他们的牛、羊、驴、马。那一年因换他们一切的牲畜，就用粮食养活他们。"],[18,"那一年过去，第二年他们又来见约瑟，说：“我们不瞒我主，我们的银子都花尽了，牲畜也都归了我主，我们在我主眼前，除了我们的身体和田地之外，一无所剩。"],[19,"你何忍见我们人死地荒呢？求你用粮食买我们和我们的地，我们和我们的地就要给法老效力。又求你给我们种子，使我们得以存活，不至死亡，地土也不至荒凉。”"],[20,"于是，约瑟为法老买了埃及所有的地，埃及人因被饥荒所迫，各都卖了自己的田地，那地就都归了法老。"],[21,"至于百姓，约瑟叫他们从埃及这边直到埃及那边，都各归各城。"],[22,"惟有祭司的地，约瑟没有买，因为祭司有从法老所得的常俸。他们吃法老所给的常俸，所以他们不卖自己的地。"],[23,"约瑟对百姓说：“我今日为法老买了你们和你们的地。看哪，这里有种子给你们，你们可以种地。"],[24,"后来打粮食的时候，你们要把五分之一纳给法老，四分可以归你们作地里的种子，也作你们和你们家口孩童的食物。”"],[25,"他们说：“你救了我们的性命，但愿我们在我主眼前蒙恩，我们就做法老的仆人。”"],[26,"于是，约瑟为埃及地定下常例直到今日，法老必得五分之一，惟独祭司的地不归法老。"],[27,"以色列人住在埃及的歌珊地，他们在那里置了产业，并且生育甚多。"],[28,"雅各住在埃及地十七年，雅各平生的年日是一百四十七岁。"],[29,"以色列的死期临近了，他就叫了他儿子约瑟来，说：“我若在你眼前蒙恩，请你把手放在我大腿底下，用慈爱和诚实待我，请你不要将我葬在埃及。"],[30,"我与我祖我父同睡的时候，你要将我带出埃及，葬在他们所葬的地方。”约瑟说：“我必遵着你的命而行。”"],[31,"雅各说：“你要向我起誓。”约瑟就向他起了誓，于是以色列在床头上（或作“扶着杖头”）敬拜神。"]]},{"n":48,"v":[[1,"这事以后，有人告诉约瑟说：“你的父亲病了。”他就带着两个儿子玛拿西和以法莲同去。"],[2,"有人告诉雅各说：“请看，你儿子约瑟到你这里来了。”以色列就勉强在床上坐起来。"],[3,"雅各对约瑟说：“全能的神曾在迦南地的路斯向我显现，赐福与我，"],[4,"对我说：‘我必使你生养众多，成为多民，又要把这地赐给你的后裔，永远为业。’"],[5,"我未到埃及见你之先，你在埃及地所生的以法莲和玛拿西，这两个儿子是我的，正如流便和西缅是我的一样。"],[6,"你在他们以后所生的，就是你的，他们可以归于他们弟兄的名下得产业。"],[7,"至于我，我从巴旦来的时候，拉结死在我眼前，在迦南地的路上，离以法他还有一段路程，我就把她葬在以法他的路上；以法他就是伯利恒。”"],[8,"以色列看见约瑟的两个儿子，就说：“这是谁？”"],[9,"约瑟对他父亲说：“这是神在这里赐给我的儿子。”以色列说：“请你领他们到我跟前，我要给他们祝福。”"],[10,"以色列年纪老迈，眼睛昏花，不能看见。约瑟领他们到他跟前，他就和他们亲嘴，抱着他们。"],[11,"以色列对约瑟说：“我想不到得见你的面，不料，神又使我得见你的儿子。”"],[12,"约瑟把两个儿子从以色列两膝中领出来，自己就脸伏于地下拜。"],[13,"随后约瑟又拉着他们两个：以法莲在他的右手里，对着以色列的左手；玛拿西在他的左手里，对着以色列的右手，领他们到以色列的跟前。"],[14,"以色列伸出右手来，按在以法莲的头上，以法莲乃是次子；又剪搭过左手来按在玛拿西的头上，玛拿西原是长子。"],[15,"他就给约瑟祝福说：“愿我祖亚伯拉罕和我父以撒所侍奉的神，就是一生牧养我直到今日的神，"],[16,"救赎我脱离一切患难的那使者，赐福与这两个童子。愿他们归在我的名下和我祖亚伯拉罕、我父以撒的名下，又愿他们在世界中生养众多。”"],[17,"约瑟见他父亲把右手按在以法莲的头上，就不喜悦，便提起他父亲的手，要从以法莲头上挪到玛拿西的头上。"],[18,"约瑟对他父亲说：“我父，不是这样，这本是长子，求你把右手按在他的头上。”"],[19,"他父亲不从，说：“我知道！我儿，我知道！他也必成为一族，也必昌大，只是他的兄弟将来比他还大，他兄弟的后裔要成为多族。”"],[20,"当日就给他们祝福说：“以色列人要指着你们祝福说：‘愿神使你如以法莲、玛拿西一样。’”于是立以法莲在玛拿西以上。"],[21,"以色列又对约瑟说：“我要死了，但神必与你们同在，领你们回到你们列祖之地。"],[22,"并且我从前用弓用刀从亚摩利人手下夺的那块地，我都赐给你，使你比众弟兄多得一份。”"]]},{"n":49,"v":[[1,"雅各叫了他的儿子们来，说：“你们都来聚集，我好把你们日后必遇的事告诉你们。"],[2,"雅各的儿子们，你们要聚集而听，要听你们父亲以色列的话："],[3,"“流便哪，你是我的长子，是我力量强壮的时候生的，本当大有尊荣，权力超众，"],[4,"但你放纵情欲、滚沸如水，必不得居首位，因为你上了你父亲的床，污秽了我的榻。”"],[5,"“西缅和利未是弟兄，他们的刀剑是残忍的器具。"],[6,"我的灵啊，不要与他们同谋；我的心哪，不要与他们联络；因为他们趁怒杀害人命，任意砍断牛腿大筋。"],[7,"他们的怒气暴烈可咒，他们的忿恨残忍可诅。我要使他们分居在雅各家里，散住在以色列地中。”"],[8,"“犹大啊，你弟兄们必赞美你，你手必掐住仇敌的颈项，你父亲的儿子们必向你下拜。"],[9,"犹大是个小狮子。我儿啊，你抓了食便上去；你屈下身去，卧如公狮，蹲如母狮，谁敢惹你？"],[10,"圭必不离犹大，杖必不离他两脚之间，直等细罗（就是“赐平安者”）来到，万民都必归顺。"],[11,"犹大把小驴拴在葡萄树上，把驴驹拴在美好的葡萄树上；他在葡萄酒中洗了衣服，在葡萄汁中洗了袍褂；"],[12,"他的眼睛必因酒红润，他的牙齿必因奶白亮。”"],[13,"“西布伦必住在海口，必成为停船的海口，他的境界必延到西顿。”"],[14,"“以萨迦是个强壮的驴，卧在羊圈之中。"],[15,"他以安静为佳，以肥地为美，便低肩背重，成为服苦的仆人。”"],[16,"“但必判断他的民，作以色列支派之一。"],[17,"但必作道上的蛇，路中的虺，咬伤马蹄，使骑马的坠落于后。"],[18,"耶和华啊，我向来等候你的救恩。”"],[19,"“迦得必被敌军追逼，他却要追逼他们的脚跟。”"],[20,"“亚设之地必出肥美的粮食，且出君王的美味。”"],[21,"“拿弗他利是被释放的母鹿，他出嘉美的言语。”"],[22,"“约瑟是多结果子的树枝，是泉旁多结果的枝子，他的枝条探出墙外。"],[23,"弓箭手将他苦害，向他射箭，逼迫他，"],[24,"但他的弓仍旧坚硬，他的手健壮敏捷，这是因以色列的牧者，以色列的磐石，就是雅各的大能者。"],[25,"你父亲的神必帮助你，那全能者必将天上所有的福，地里所藏的福，以及生产乳养的福，都赐给你。"],[26,"你父亲所祝的福，胜过我祖先所祝的福，如永世的山岭，至极的边界；这些福必降在约瑟的头上，临到那与弟兄迥别之人的顶上。”"],[27,"“便雅悯是个撕掠的狼，早晨要吃他所抓的，晚上要分他所夺的。”"],[28,"这一切是以色列的十二支派，这也是他们的父亲对他们所说的话，为他们所祝的福，都是按着各人的福分，为他们祝福。"],[29,"他又嘱咐他们说：“我将要归到我列祖（原文作“本民”）那里，你们要将我葬在赫人以弗仑田间的洞里，与我祖我父在一处，"],[30,"就是在迦南地幔利前、麦比拉田间的洞。那洞和田是亚伯拉罕向赫人以弗仑买来为业，作坟地的。"],[31,"他们在那里葬了亚伯拉罕和他妻子撒拉，又在那里葬了以撒和他妻子利百加，我也在那里葬了利亚。"],[32,"那块田和田间的洞，原是向赫人买的。”"],[33,"雅各嘱咐众子已毕，就把脚收在床上，气绝而死，归他列祖（原文作“本民”）那里去了。"]]},{"n":50,"v":[[1,"约瑟伏在他父亲的面上哀哭，与他亲嘴。"],[2,"约瑟吩咐伺候他的医生，用香料薰他父亲，医生就用香料薰了以色列。"],[3,"薰尸的常例是四十天，那四十天满了，埃及人为他哀哭了七十天。"],[4,"为他哀哭的日子过了，约瑟对法老家中的人说：“我若在你们眼前蒙恩，请你们报告法老说："],[5,"我父亲要死的时候叫我起誓说：你要将我葬在迦南地，在我为自己所掘的坟墓里。现在求你让我上去葬我父亲，以后我必回来。”"],[6,"法老说：“你可以上去，照着你父亲叫你起的誓，将他葬埋。”"],[7,"于是约瑟上去葬他父亲。与他一同上去的，有法老的臣仆和法老家中的长老，并埃及国的长老；"],[8,"还有约瑟的全家和他的弟兄们，并他父亲的眷属，只有他们的妇人孩子和羊群牛群，都留在歌珊地；"],[9,"又有车辆马兵，和他一同上去，那一帮人甚多。"],[10,"他们到了约旦河外、亚达的禾场，就在那里大大地号啕痛哭。约瑟为他父亲哀哭了七天。"],[11,"迦南的居民见亚达禾场上的哀哭，就说：“这是埃及人一场极大的哀哭。”因此那地方名叫亚伯麦西，是在约旦河东。"],[12,"雅各的儿子们就遵着他父亲所吩咐的办了，"],[13,"把他搬到迦南地，葬在幔利前、麦比拉田间的洞里。那洞和田是亚伯拉罕向赫人以弗仑买来为业，作坟地的。"],[14,"约瑟葬了他父亲以后，就和众弟兄，并一切同他上去葬他父亲的人，都回埃及去了。"],[15,"约瑟的哥哥们见父亲死了，就说：“或者约瑟怀恨我们，照着我们从前待他一切的恶，足足地报复我们。”"],[16,"他们就打发人去见约瑟，说：“你父亲未死以先吩咐说："],[17,"‘你们要对约瑟这样说：从前你哥哥们恶待你，求你饶恕他们的过犯和罪恶。’如今求你饶恕你父亲神之仆人的过犯。”他们对约瑟说这话，约瑟就哭了。"],[18,"他的哥哥们又来俯伏在他面前，说：“我们是你的仆人。”"],[19,"约瑟对他们说：“不要害怕，我岂能代替神呢？"],[20,"从前你们的意思是要害我，但神的意思原是好的，要保全许多人的性命，成就今日的光景。"],[21,"现在你们不要害怕，我必养活你们和你们的妇人孩子。”于是约瑟用亲爱的话安慰他们。"],[22,"约瑟和他父亲的眷属都住在埃及。约瑟活了一百一十岁。"],[23,"约瑟得见以法莲第三代的子孙；玛拿西的孙子、玛吉的儿子也养在约瑟的膝上。"],[24,"约瑟对他弟兄们说：“我要死了，但神必定看顾你们，领你们从这地上去，到他起誓所应许给亚伯拉罕、以撒、雅各之地。”"],[25,"约瑟叫以色列的子孙起誓说：“神必定看顾你们，你们要把我的骸骨从这里搬上去。”"],[26,"约瑟死了，正一百一十岁。人用香料将他薰了，把他收殓在棺材里，停在埃及。"]]}]},{"name":"出埃及记","chapters":[{"n":1,"v":[[1,"以色列的众子，各带家眷和雅各一同来到埃及。他们的名字记在下面："],[2,"有流便、西缅、利未、犹大、"],[3,"以萨迦、西布伦、便雅悯、"],[4,"但、拿弗他利、迦得、亚设。"],[5,"凡从雅各而生的，共有七十人；约瑟已经在埃及。"],[6,"约瑟和他的弟兄，并那一代的人都死了。"],[7,"以色列人生养众多，并且繁茂，极其强盛，满了那地。"],[8,"有不认识约瑟的新王起来，治理埃及。"],[9,"对他的百姓说：“看哪，这以色列民比我们还多，又比我们强盛。"],[10,"来吧！我们不如用巧计待他们，恐怕他们多起来，日后若遇什么争战的事，就连合我们的仇敌攻击我们，离开这地去了。”"],[11,"于是埃及人派督工的辖制他们，加重担苦害他们。他们为法老建造两座积货城，就是比东和兰塞。"],[12,"只是越发苦害他们，他们越发多起来，越发蔓延，埃及人就因以色列人愁烦。"],[13,"埃及人严严地使以色列人作工，"],[14,"使他们因作苦工觉得命苦；无论是和泥，是作砖，是作田间各样的工，在一切的工上都严严地待他们。"],[15,"有希伯来的两个收生婆，一名施弗拉，一名普阿。埃及王对她们说："],[16,"“你们为希伯来妇人收生，看她们临盆的时候，若是男孩，就把他杀了；若是女孩，就留她存活。”"],[17,"但是收生婆敬畏神，不照埃及王的吩咐行，竟存留男孩的性命。"],[18,"埃及王召了收生婆来，说：“你们为什么作这事，存留男孩的性命呢？”"],[19,"收生婆对法老说：“因为希伯来妇人与埃及妇人不同，希伯来妇人本是健壮的（原文作“活泼的”），收生婆还没有到，她们已经生产了。”"],[20,"神厚待收生婆。以色列人多起来，极其强盛。"],[21,"收生婆因为敬畏神，神便叫她们成立家室。"],[22,"法老吩咐他的众民说：“以色列人所生的男孩，你们都要丢在河里；一切的女孩，你们要存留她的性命。”"]]},{"n":2,"v":[[1,"有一个利未家的人，娶了一个利未女子为妻。"],[2,"那女人怀孕，生一个儿子，见他俊美，就藏了他三个月。"],[3,"后来不能再藏，就取了一个蒲草箱，抹上石漆和石油，将孩子放在里头，把箱子搁在河边的芦荻中。"],[4,"孩子的姐姐远远站着，要知道他究竟怎么样。"],[5,"法老的女儿来到河边洗澡，她的使女们在河边行走。她看见箱子在芦荻中，就打发一个婢女拿来。"],[6,"她打开箱子，看见那孩子。孩子哭了，她就可怜他，说：“这是希伯来人的一个孩子。”"],[7,"孩子的姐姐对法老的女儿说：“我去在希伯来妇人中叫一个奶妈来，为你奶这孩子，可以不可以？”"],[8,"法老的女儿说：“可以。”童女就去叫了孩子的母亲来。"],[9,"法老的女儿对她说：“你把这孩子抱去，为我奶他，我必给你工价。”妇人就抱了孩子去奶他。"],[10,"孩子渐长，妇人把他带到法老的女儿那里，就作了她的儿子。她给孩子起名叫摩西，意思说：“因我把他从水里拉出来。”"],[11,"后来摩西长大，他出去到他弟兄那里，看他们的重担，见一个埃及人打希伯来人的一个弟兄。"],[12,"他左右观看，见没有人，就把埃及人打死了，藏在沙土里。"],[13,"第二天他出去，见有两个希伯来人争斗，就对那欺负人的说：“你为什么打你同族的人呢？”"],[14,"那人说：“谁立你作我们的首领和审判官呢？难道你要杀我，像杀那埃及人吗？”摩西便惧怕，说：“这事必是被人知道了。”"],[15,"法老听见这事，就想杀摩西，但摩西躲避法老，逃往米甸地居住。"],[16,"一日，他在井旁坐下，米甸的祭司有七个女儿，她们来打水，打满了槽，要饮父亲的群羊。"],[17,"有牧羊的人来把她们赶走了，摩西却起来帮助她们，又饮了她们的群羊。"],[18,"她们来到父亲流珥那里，他说：“今日你们为何来得这么快呢？”"],[19,"她们说：“有一个埃及人救我们脱离牧羊人的手，并且为我们打水饮了群羊。”"],[20,"他对女儿们说：“那个人在哪里？你们为什么撇下他呢？你们去请他来吃饭。”"],[21,"摩西甘心和那人同住；那人把他的女儿西坡拉给摩西为妻。"],[22,"西坡拉生了一个儿子，摩西给他起名叫革舜，意思说：“因我在外邦作了寄居的。”"],[23,"过了多年，埃及王死了。以色列人因作苦工，就叹息哀求，他们的哀声达于神。"],[24,"神听见他们的哀声，就记念他与亚伯拉罕、以撒、雅各所立的约。"],[25,"神看顾以色列人，也知道他们的苦情。"]]},{"n":3,"v":[[1,"摩西牧养他岳父米甸祭司叶忒罗的羊群。一日，领羊群往野外去，到了神的山，就是何烈山。"],[2,"耶和华的使者从荆棘里火焰中向摩西显现。摩西观看，不料，荆棘被火烧着，却没有烧毁。"],[3,"摩西说：“我要过去看这大异象，这荆棘为何没有烧坏呢？”"],[4,"耶和华神见他过去要看，就从荆棘里呼叫说：“摩西！摩西！”他说：“我在这里。”"],[5,"神说：“不要近前来，当把你脚上的鞋脱下来，因为你所站之地是圣地。”"],[6,"又说：“我是你父亲的神，是亚伯拉罕的神，以撒的神，雅各的神。”摩西蒙上脸，因为怕看神。"],[7,"耶和华说：“我的百姓在埃及所受的困苦，我实在看见了；他们因受督工的辖制所发的哀声，我也听见了。我原知道他们的痛苦。"],[8,"我下来是要救他们脱离埃及人的手，领他们出了那地，到美好宽阔流奶与蜜之地，就是到迦南人、赫人、亚摩利人、比利洗人、希未人、耶布斯人之地。"],[9,"现在以色列人的哀声达到我耳中，我也看见埃及人怎样欺压他们。"],[10,"故此，我要打发你去见法老，使你可以将我的百姓以色列人从埃及领出来。”"],[11,"摩西对神说：“我是什么人，竟能去见法老，将以色列人从埃及领出来呢？”"],[12,"神说：“我必与你同在；你将百姓从埃及领出来之后，你们必在这山上侍奉我，这就是我打发你去的证据。”"],[13,"摩西对神说：“我到以色列人那里，对他们说：‘你们祖宗的神打发我到你们这里来。’他们若问我说：‘他叫什么名字？’我要对他们说什么呢？”"],[14,"神对摩西说：“我是自有永有的。”又说：“你要对以色列人这样说：‘那自有的打发我到你们这里来。’”"],[15,"神又对摩西说：“你要对以色列人这样说：‘耶和华你们祖宗的神，就是亚伯拉罕的神，以撒的神，雅各的神，打发我到你们这里来。耶和华是我的名，直到永远；这也是我的纪念，直到万代。’"],[16,"你去招聚以色列的长老，对他们说：‘耶和华你们祖宗的神，就是亚伯拉罕的神，以撒的神，雅各的神，向我显现说：我实在眷顾了你们，我也看见埃及人怎样待你们。"],[17,"我也说：要将你们从埃及的困苦中领出来，往迦南人、赫人、亚摩利人、比利洗人、希未人、耶布斯人的地去，就是到流奶与蜜之地。’"],[18,"他们必听你的话。你和以色列的长老要去见埃及王，对他说：‘耶和华希伯来人的神遇见了我们，现在求你容我们往旷野去，走三天的路程，为要祭祀耶和华我们的神。’"],[19,"我知道虽用大能的手，埃及王也不容你们去。"],[20,"我必伸手在埃及中间施行我一切的奇事，攻击那地，然后他才容你们去。"],[21,"我必叫你们在埃及人眼前蒙恩，你们去的时候，就不至于空手而去。"],[22,"但各妇女必向她的邻舍，并居住在她家里的女人要金器银器和衣裳，好给你们的儿女穿戴，这样你们就把埃及人的财物夺去了。”"]]},{"n":4,"v":[[1,"摩西回答说：“他们必不信我，也不听我的话，必说：‘耶和华并没有向你显现！’”"],[2,"耶和华对摩西说：“你手里是什么？”他说：“是杖。”"],[3,"耶和华说：“丢在地上。”他一丢下去，就变作蛇，摩西便跑开。"],[4,"耶和华对摩西说：“伸出手来拿住它的尾巴，它必在你手中仍变为杖。"],[5,"如此好叫他们信耶和华他们祖宗的神，就是亚伯拉罕的神，以撒的神，雅各的神，是向你显现了。”"],[6,"耶和华又对他说：“把手放在怀里。”他就把手放在怀里，及至抽出来，不料，手长了大麻风，有雪那样白。"],[7,"耶和华说：“再把手放在怀里。”他就再把手放在怀里，及至从怀里抽出来，不料，手已经复原，与周身的肉一样。"],[8,"又说：“倘或他们不听你的话，也不信头一个神迹，他们必信第二个神迹。"],[9,"这两个神迹若都不信，也不听你的话，你就从河里取些水，倒在旱地上，你从河里取的水必在旱地上变作血。”"],[10,"摩西对耶和华说：“主啊，我素日不是能言的人，就是从你对仆人说话以后，也是这样，我本是拙口笨舌的。”"],[11,"耶和华对他说：“谁造人的口呢？谁使人口哑、耳聋、目明、眼瞎呢？岂不是我耶和华吗？"],[12,"现在去吧！我必赐你口才，指教你所当说的话。”"],[13,"摩西说：“主啊，你愿意打发谁，就打发谁去吧！”"],[14,"耶和华向摩西发怒说：“不是有你的哥哥利未人亚伦吗？我知道他是能言的，现在他出来迎接你，他一见你，心里就欢喜。"],[15,"你要将当说的话传给他；我也要赐你和他口才，又要指教你们所当行的事。"],[16,"他要替你对百姓说话；你要以他当作口，他要以你当作神。"],[17,"你手里要拿这杖，好行神迹。”"],[18,"于是摩西回到他岳父叶忒罗那里，对他说：“求你容我回去见我在埃及的弟兄，看他们还在不在。”叶忒罗对摩西说：“你可以平平安安地去吧！”"],[19,"耶和华在米甸对摩西说：“你要回埃及去，因为寻索你命的人都死了。”"],[20,"摩西就带着妻子和两个儿子，叫他们骑上驴，回埃及地去。摩西手里拿着神的杖。"],[21,"耶和华对摩西说：“你回到埃及的时候要留意，将我指示你的一切奇事，行在法老面前，但我要使（或作“任凭”。下同）他的心刚硬，他必不容百姓去。"],[22,"你要对法老说：‘耶和华这样说：以色列是我的儿子，我的长子。"],[23,"我对你说过，容我的儿子去，好侍奉我，你还是不肯容他去。看哪，我要杀你的长子。’”"],[24,"摩西在路上住宿的地方，耶和华遇见他，想要杀他。"],[25,"西坡拉就拿一块火石，割下他儿子的阳皮，丢在摩西脚前，说：“你真是我的血郎了。”"],[26,"这样耶和华才放了他。西坡拉说：“你因割礼就是血郎了。”"],[27,"耶和华对亚伦说：“你往旷野去迎接摩西。”他就去，在神的山遇见摩西，和他亲嘴。"],[28,"摩西将耶和华打发他所说的言语和嘱咐他所行的神迹，都告诉了亚伦。"],[29,"摩西、亚伦就去招聚以色列的众长老。"],[30,"亚伦将耶和华对摩西所说的一切话述说了一遍，又在百姓眼前行了那些神迹，"],[31,"百姓就信了。以色列人听见耶和华眷顾他们，鉴察他们的困苦，就低头下拜。"]]},{"n":5,"v":[[1,"后来摩西、亚伦去对法老说：“耶和华以色列的神这样说：‘容我的百姓去，在旷野向我守节。’”"],[2,"法老说：“耶和华是谁，使我听他的话，容以色列人去呢？我不认识耶和华，也不容以色列人去。”"],[3,"他们说：“希伯来人的神遇见了我们，求你容我们往旷野去，走三天的路程，祭祀耶和华我们的神，免得他用瘟疫、刀兵攻击我们。”"],[4,"埃及王对他们说：“摩西、亚伦，你们为什么叫百姓旷工呢？你们去担你们的担子吧！”"],[5,"又说：“看哪，这地的以色列人如今众多，你们竟叫他们歇下担子！”"],[6,"当天，法老吩咐督工的和官长说："],[7,"“你们不可照常把草给百姓作砖，叫他们自己去捡草。"],[8,"他们素常作砖的数目，你们仍旧向他们要，一点不可减少！因为他们是懒惰的，所以呼求说：‘容我们去祭祀我们的神。’"],[9,"你们要把更重的工夫加在这些人身上，叫他们劳碌，不听虚谎的言语。”"],[10,"督工的和官长出来对百姓说：“法老这样说：‘我不给你们草。"],[11,"你们自己在哪里能找草，就往那里去找吧！但你们的工一点不可减少。’”"],[12,"于是百姓散在埃及遍地，捡碎秸当作草。"],[13,"督工的催着说：“你们一天当完一天的工，与先前有草一样。”"],[14,"法老督工的责打他所派以色列人的官长，说：“你们昨天、今天为什么没有照向来的数目作砖、完你们的工作呢？”"],[15,"以色列人的官长就来哀求法老说：“为什么这样待你的仆人？"],[16,"督工的不把草给仆人，并且对我们说：‘作砖吧！’看哪，你仆人挨了打，其实是你百姓的错。”"],[17,"但法老说：“你们是懒惰的！你们是懒惰的！所以说：‘容我们去祭祀耶和华。’"],[18,"现在你们去作工吧！草是不给你们的，砖却要如数交纳。”"],[19,"以色列人的官长听说“你们每天作砖的工作一点不可减少”，就知道是遭遇祸患了。"],[20,"他们离了法老出来，正遇见摩西、亚伦站在对面，"],[21,"就向他们说：“愿耶和华鉴察你们，施行判断，因你们使我们在法老和他臣仆面前有了臭名，把刀递在他们手中杀我们。”"],[22,"摩西回到耶和华那里，说：“主啊，你为什么苦待这百姓呢？为什么打发我去呢？"],[23,"自从我去见法老，奉你的名说话，他就苦待这百姓，你一点也没有拯救他们。”"]]},{"n":6,"v":[[1,"耶和华对摩西说：“现在你必看见我向法老所行的事，使他因我大能的手容以色列人去，且把他们赶出他的地。”"],[2,"神晓谕摩西说：“我是耶和华。"],[3,"我从前向亚伯拉罕、以撒、雅各显现为全能的神，至于我名耶和华，他们未曾知道。"],[4,"我与他们坚定所立的约，要把他们寄居的迦南地赐给他们。"],[5,"我也听见以色列人被埃及人苦待的哀声，我也记念我的约。"],[6,"所以你要对以色列人说，我是耶和华。我要用伸出来的膀臂重重地刑罚埃及人，救赎你们脱离他们的重担，不作他们的苦工。"],[7,"我要以你们为我的百姓，我也要作你们的神。你们要知道我是耶和华你们的神，是救你们脱离埃及人之重担的。"],[8,"我起誓应许给亚伯拉罕、以撒、雅各的那地，我要把你们领进去，将那地赐给你们为业。我是耶和华。”"],[9,"摩西将这话告诉以色列人，只是他们因苦工愁烦，不肯听他的话。"],[10,"耶和华晓谕摩西说："],[11,"“你进去对埃及王法老说，要容以色列人出他的地。”"],[12,"摩西在耶和华面前说：“以色列人尚且不听我的话，法老怎肯听我这拙口笨舌的人呢？”"],[13,"耶和华吩咐摩西、亚伦往以色列人和埃及王法老那里去，把以色列人从埃及地领出来。"],[14,"以色列人家长的名字记在下面：以色列长子流便的儿子是哈诺、法路、希斯仑、迦米，这是流便的各家。"],[15,"西缅的儿子是耶母利、雅悯、阿辖、雅斤、琐辖，和迦南女子的儿子扫罗，这是西缅的各家。"],[16,"利未众子的名字，按着他们的后代记在下面：就是革顺、哥辖、米拉利；利未一生的岁数是一百三十七岁。"],[17,"革顺的儿子按着家室，是立尼、示每。"],[18,"哥辖的儿子是暗兰、以斯哈、希伯伦、乌薛；哥辖一生的岁数是一百三十三岁。"],[19,"米拉利的儿子是抹利和母示。这是利未的家，都按着他们的后代。"],[20,"暗兰娶了他父亲的妹妹约基别为妻，她给他生了亚伦和摩西；暗兰一生的岁数是一百三十七岁。"],[21,"以斯哈的儿子是可拉、尼斐、细基利。"],[22,"乌薛的儿子是米沙利、以利撒反、西提利。"],[23,"亚伦娶了亚米拿达的女儿拿顺的妹妹以利沙巴为妻，她给他生了拿答、亚比户、以利亚撒、以他玛。"],[24,"可拉的儿子是亚惜、以利加拿、亚比亚撒；这是可拉的各家。"],[25,"亚伦的儿子以利亚撒，娶了普铁的一个女儿为妻，她给他生了非尼哈；这是利未人的家长，都按着他们的家。"],[26,"耶和华说：“将以色列人按着他们的军队从埃及地领出来。”这是对那亚伦、摩西说的。"],[27,"对埃及王法老说要将以色列人从埃及领出来的，就是这摩西、亚伦。"],[28,"当耶和华在埃及地对摩西说话的日子，"],[29,"他向摩西说：“我是耶和华，我对你说的一切话，你都要告诉埃及王法老。”"],[30,"摩西在耶和华面前说：“看哪，我是拙口笨舌的人，法老怎肯听我呢？”"]]},{"n":7,"v":[[1,"耶和华对摩西说：“我使你在法老面前代替神，你的哥哥亚伦是替你说话的。"],[2,"凡我所吩咐你的，你都要说。你的哥哥亚伦要对法老说：容以色列人出他的地。"],[3,"我要使法老的心刚硬，也要在埃及地多行神迹奇事。"],[4,"但法老必不听你们，我要伸手重重地刑罚埃及，将我的军队以色列民从埃及地领出来。"],[5,"我伸手攻击埃及，将以色列人从他们中间领出来的时候，埃及人就要知道我是耶和华。”"],[6,"摩西、亚伦这样行，耶和华怎样吩咐他们，他们就照样行了。"],[7,"摩西、亚伦与法老说话的时候，摩西八十岁，亚伦八十三岁。"],[8,"耶和华晓谕摩西、亚伦说："],[9,"“法老若对你们说：‘你们行件奇事吧！’你就吩咐亚伦说：‘把杖丢在法老面前，使杖变作蛇。’”"],[10,"摩西、亚伦进去见法老，就照耶和华所吩咐的行，亚伦把杖丢在法老和臣仆面前，杖就变作蛇。"],[11,"于是，法老召了博士和术士来，他们是埃及行法术的，也用邪术照样而行。"],[12,"他们各人丢下自己的杖，杖就变作蛇，但亚伦的杖吞了他们的杖。"],[13,"法老心里刚硬，不肯听从摩西、亚伦，正如耶和华所说的。"],[14,"耶和华对摩西说：“法老心里固执，不肯容百姓去。"],[15,"明日早晨他出来往水边去，你要往河边迎接他，手里要拿着那变过蛇的杖，"],[16,"对他说：‘耶和华希伯来人的神打发我来见你，说：容我的百姓去，好在旷野侍奉我。到如今你还是不听。’"],[17,"耶和华这样说：‘我要用我手里的杖击打河中的水，水就变作血，因此，你必知道我是耶和华。"],[18,"河里的鱼必死，河也要腥臭，埃及人就要厌恶吃这河里的水。’”"],[19,"耶和华晓谕摩西说：“你对亚伦说：‘把你的杖伸在埃及所有的水以上，就是在他们的江、河、池、塘以上，叫水都变作血，在埃及遍地，无论在木器中、石器中，都必有血。’”"],[20,"摩西、亚伦就照耶和华所吩咐的行，亚伦在法老和臣仆眼前举杖击打河里的水，河里的水都变作血了。"],[21,"河里的鱼死了，河也腥臭了，埃及人就不能吃这河里的水，埃及遍地都有了血。"],[22,"埃及行法术的，也用邪术照样而行。法老心里刚硬，不肯听摩西、亚伦，正如耶和华所说的。"],[23,"法老转身进宫，也不把这事放在心上。"],[24,"埃及人都在河的两边挖地，要得水喝，因为他们不能喝这河里的水。"],[25,"耶和华击打河以后满了七天。"]]},{"n":8,"v":[[1,"耶和华吩咐摩西说：“你进去见法老，对他说：‘耶和华这样说：容我的百姓去，好侍奉我。"],[2,"你若不肯容他们去，我必使青蛙糟蹋你的四境。"],[3,"河里要滋生青蛙，这青蛙要上来进你的宫殿和你的卧房，上你的床榻，进你臣仆的房屋，上你百姓的身上，进你的炉灶和你的抟面盆，"],[4,"又要上你和你百姓并你众臣仆的身上。’”"],[5,"耶和华晓谕摩西说：“你对亚伦说：‘把你的杖伸在江、河、池以上，使青蛙到埃及地上来。’”"],[6,"亚伦便伸杖在埃及的诸水以上，青蛙就上来，遮满了埃及地，"],[7,"行法术的也用他们的邪术照样而行，叫青蛙上了埃及地。"],[8,"法老召了摩西、亚伦来，说：“请你们求耶和华使这青蛙离开我和我的民，我就容百姓去祭祀耶和华。”"],[9,"摩西对法老说：“任凭你吧！我要何时为你和你的臣仆并你的百姓，祈求除灭青蛙离开你和你的宫殿，只留在河里呢？”"],[10,"他说：“明天。”摩西说：“可以照你的话吧！好叫你知道没有像耶和华我们神的。"],[11,"青蛙要离开你和你的宫殿，并你的臣仆与你的百姓，只留在河里。”"],[12,"于是摩西、亚伦离开法老出去。摩西为扰害法老的青蛙呼求耶和华。"],[13,"耶和华就照摩西的话行，凡在房里、院中、田间的青蛙都死了。"],[14,"众人把青蛙聚拢成堆，遍地就都腥臭。"],[15,"但法老见灾祸松缓，就硬着心不肯听他们，正如耶和华所说的。"],[16,"耶和华吩咐摩西说：“你对亚伦说：‘伸出你的杖击打地上的尘土，使尘土在埃及遍地变作虱子（或作“虼蚤”。下同）。’”"],[17,"他们就这样行，亚伦伸杖击打地上的尘土，就在人身上和牲畜身上有了虱子，埃及遍地的尘土都变成虱子了。"],[18,"行法术的也用邪术要生出虱子来，却是不能。于是在人身上和牲畜身上都有了虱子。"],[19,"行法术的就对法老说：“这是神的手段。”法老心里刚硬，不肯听摩西、亚伦，正如耶和华所说的。"],[20,"耶和华对摩西说：“你清早起来，法老来到水边，你站在他面前，对他说：‘耶和华这样说：容我的百姓去，好侍奉我。"],[21,"你若不容我的百姓去，我要叫成群的苍蝇到你和你臣仆并你百姓的身上，进你的房屋，并且埃及人的房屋和他们所住的地，都要满了成群的苍蝇。"],[22,"当那日，我必分别我百姓所住的歌珊地，使那里没有成群的苍蝇，好叫你知道我是天下的耶和华。"],[23,"我要将我的百姓和你的百姓分别出来；明天必有这神迹。’”"],[24,"耶和华就这样行，苍蝇成了大群，进入法老的宫殿和他臣仆的房屋；埃及遍地就因这成群的苍蝇败坏了。"],[25,"法老召了摩西、亚伦来，说：“你们去，在这地祭祀你们的神吧！”"],[26,"摩西说：“这样行本不相宜，因为我们要把埃及人所厌恶的祭祀耶和华我们的神；若把埃及人所厌恶的，在他们眼前献为祭，他们岂不拿石头打死我们吗？"],[27,"我们要往旷野去，走三天的路程，照着耶和华我们神所要吩咐我们的祭祀他。”"],[28,"法老说：“我容你们去，在旷野祭祀耶和华你们的神，只是不要走得很远，求你们为我祈祷。”"],[29,"摩西说：“我要出去求耶和华，使成群的苍蝇明天离开法老和法老的臣仆并法老的百姓，法老却不可再行诡诈，不容百姓去祭祀耶和华。”"],[30,"于是摩西离开法老去求耶和华。"],[31,"耶和华就照摩西的话行，叫成群的苍蝇离开法老和他的臣仆并他的百姓，一个也没有留下。"],[32,"这一次法老又硬着心，不容百姓去。"]]},{"n":9,"v":[[1,"耶和华吩咐摩西说：“你进去见法老，对他说：‘耶和华希伯来人的神这样说：容我的百姓去，好侍奉我。"],[2,"你若不肯容他们去，仍旧强留他们，"],[3,"耶和华的手加在你田间的牲畜上，就是在马、驴、骆驼、牛群、羊群上，必有重重的瘟疫。"],[4,"耶和华要分别以色列的牲畜和埃及的牲畜，凡属以色列人的，一样都不死。’”"],[5,"耶和华就定了时候，说：“明天耶和华必在此地行这事。”"],[6,"第二天，耶和华就行这事。埃及的牲畜几乎都死了，只是以色列人的牲畜一个都没有死。"],[7,"法老打发人去看，谁知，以色列人的牲畜连一个都没有死。法老的心却是固执，不容百姓去。"],[8,"耶和华吩咐摩西、亚伦说：“你们取几捧炉灰，摩西要在法老面前向天扬起来。"],[9,"这灰要在埃及全地变作尘土，在人身上和牲畜身上，成了起泡的疮。”"],[10,"摩西、亚伦取了炉灰，站在法老面前。摩西向天扬起来，就在人身上和牲畜身上，成了起泡的疮。"],[11,"行法术的在摩西面前站立不住，因为在他们身上和一切埃及人身上都有这疮。"],[12,"耶和华使法老的心刚硬，不听他们，正如耶和华对摩西所说的。"],[13,"耶和华对摩西说：“你清早起来，站在法老面前，对他说：‘耶和华希伯来人的神这样说：容我的百姓去，好侍奉我。"],[14,"因为这一次我要叫一切的灾殃临到你和你臣仆并你百姓的身上，叫你知道在普天下没有像我的。"],[15,"我若伸手用瘟疫攻击你和你的百姓，你早就从地上除灭了。"],[16,"其实我叫你存立，是特要向你显我的大能，并要使我的名传遍天下。"],[17,"你还向我的百姓自高，不容他们去吗？"],[18,"到明天约在这时候，我必叫重大的冰雹降下，自从埃及开国以来，没有这样的冰雹。"],[19,"现在你要打发人把你的牲畜和你田间一切所有的催进来，凡在田间不收回家的，无论是人是牲畜，冰雹必降在他们身上，他们就必死。’”"],[20,"法老的臣仆中惧怕耶和华这话的，便叫他的奴仆和牲畜跑进家来；"],[21,"但那不把耶和华这话放在心上的，就将他的奴仆和牲畜留在田里。"],[22,"耶和华对摩西说：“你向天伸杖，使埃及遍地的人身上和牲畜身上，并田间各样菜蔬上，都有冰雹。”"],[23,"摩西向天伸杖，耶和华就打雷、下雹，有火闪到地上，耶和华下雹在埃及地上。"],[24,"那时，雹与火搀杂，甚是厉害，自从埃及成国以来，遍地没有这样的。"],[25,"在埃及遍地，雹击打了田间所有的人和牲畜，并一切的菜蔬，又打坏田间一切的树木。"],[26,"惟独以色列人所住的歌珊地没有冰雹。"],[27,"法老打发人召摩西、亚伦来，对他们说：“这一次我犯了罪了，耶和华是公义的，我和我的百姓是邪恶的。"],[28,"这雷轰和冰雹已经够了。请你们求耶和华，我就容你们去，不再留住你们。”"],[29,"摩西对他说：“我一出城，就要向耶和华举手祷告，雷必止住，也不再有冰雹，叫你知道全地都是属耶和华的。"],[30,"至于你和你的臣仆，我知道你们还是不惧怕耶和华神。”"],[31,"那时，麻和大麦被雹击打，因为大麦已经吐穗，麻也开了花。"],[32,"只是小麦和粗麦没有被击打，因为还没有长成。"],[33,"摩西离了法老出城，向耶和华举手祷告，雷和雹就止住，雨也不再浇在地上了。"],[34,"法老见雨和雹与雷止住，就越发犯罪，他和他的臣仆都硬着心。"],[35,"法老的心刚硬，不容以色列人去，正如耶和华藉着摩西所说的。"]]},{"n":10,"v":[[1,"耶和华对摩西说：“你进去见法老；我使他和他臣仆的心刚硬，为要在他们中间显我这些神迹，"],[2,"并要叫你将我向埃及人所作的事，和在他们中间所行的神迹，传于你儿子和你孙子的耳中，好叫你们知道我是耶和华。”"],[3,"摩西、亚伦就进去见法老，对他说：“耶和华希伯来人的神这样说：‘你在我面前不肯自卑要到几时呢？容我的百姓去，好侍奉我。"],[4,"你若不肯容我的百姓去，明天我要使蝗虫进入你的境内，"],[5,"遮满地面，甚至看不见地，并且吃那冰雹所剩的和田间所长的一切树木。"],[6,"你的宫殿和你众臣仆的房屋，并一切埃及人的房屋，都要被蝗虫占满了。自从你祖宗和你祖宗的祖宗在世以来，直到今日，没有见过这样的灾。’”摩西就转身离开法老出去。"],[7,"法老的臣仆对法老说：“这人为我们的网罗，要到几时呢？容这些人去，侍奉耶和华他们的神吧！埃及已经败坏了，你还不知道吗？”"],[8,"于是摩西、亚伦被召回来见法老，法老对他们说：“你们去侍奉耶和华你们的神，但那要去的是谁呢？”"],[9,"摩西说：“我们要和我们老的少的、儿子女儿同去，且把羊群牛群一同带去，因为我们务要向耶和华守节。”"],[10,"法老对他们说：“我容你们和你们妇人孩子去的时候，耶和华与你们同在吧！你们要谨慎，因为有祸在你们眼前（或作“你们存着恶意”），"],[11,"不可都去，你们这壮年人去侍奉耶和华吧！因为这是你们所求的。”于是，把他们从法老面前撵出去。"],[12,"耶和华对摩西说：“你向埃及地伸杖，使蝗虫到埃及地上来，吃地上一切的菜蔬，就是冰雹所剩的。”"],[13,"摩西就向埃及地伸杖，那一昼一夜，耶和华使东风刮在埃及地上。到了早晨，东风把蝗虫刮了来。"],[14,"蝗虫上来，落在埃及的四境，甚是厉害，以前没有这样的，以后也必没有。"],[15,"因为这蝗虫遮满地面，甚至地都黑暗了，又吃地上一切的菜蔬，和冰雹所剩树上的果子。埃及遍地，无论是树木，是田间的菜蔬，连一点青的也没有留下。"],[16,"于是法老急忙召了摩西、亚伦来，说：“我得罪耶和华你们的神，又得罪了你们。"],[17,"现在求你，只这一次，饶恕我的罪，求耶和华你们的神，使我脱离这一次的死亡。”"],[18,"摩西就离开法老去求耶和华。"],[19,"耶和华转了极大的西风，把蝗虫刮起，吹入红海，在埃及的四境连一个也没有留下。"],[20,"但耶和华使法老的心刚硬，不容以色列人去。"],[21,"耶和华对摩西说：“你向天伸杖，使埃及地黑暗，这黑暗似乎摸得着。”"],[22,"摩西向天伸杖，埃及遍地就乌黑了三天。"],[23,"三天之久，人不能相见，谁也不敢起来离开本处，惟有以色列人家中都有亮光。"],[24,"法老就召摩西来，说：“你们去侍奉耶和华，只是你们的羊群、牛群要留下，你们的妇人、孩子可以和你们同去。”"],[25,"摩西说：“你总要把祭物和燔祭牲交给我们，使我们可以祭祀耶和华我们的神。"],[26,"我们的牲畜也要带去，连一蹄也不留下，因为我们要从其中取出来，侍奉耶和华我们的神。我们未到那里，还不知道用什么侍奉耶和华。”"],[27,"但耶和华使法老的心刚硬，不肯容他们去。"],[28,"法老对摩西说：“你离开我去吧！你要小心，不要再见我的面，因为你见我面的那日，你就必死！”"],[29,"摩西说：“你说得好，我必不再见你的面了。”"]]},{"n":11,"v":[[1,"耶和华对摩西说：“我再使一样的灾殃临到法老和埃及，然后他必容你们离开这地。他容你们去的时候，总要催逼你们都从这地出去。"],[2,"你要传于百姓的耳中，叫他们男女各人向邻舍要金器银器。”"],[3,"耶和华叫百姓在埃及人眼前蒙恩，并且摩西在埃及地法老臣仆和百姓的眼中，看为极大。"],[4,"摩西说：“耶和华这样说：‘约到半夜，我必出去巡行埃及遍地，"],[5,"凡在埃及地，从坐宝座的法老，直到磨子后的婢女，所有的长子，以及一切头生的牲畜，都必死。"],[6,"埃及遍地必有大哀号，从前没有这样的，后来也必没有。"],[7,"至于以色列中，无论是人是牲畜，连狗也不敢向他们摇舌，好叫你们知道耶和华是将埃及人和以色列人分别出来。’"],[8,"你这一切臣仆都要俯伏来见我，说：‘求你和跟从你的百姓都出去’，然后我要出去。”于是，摩西气忿忿地离开法老出去了。"],[9,"耶和华对摩西说：“法老必不听你们，使我的奇事在埃及地多起来。”"],[10,"摩西、亚伦在法老面前行了这一切奇事，耶和华使法老的心刚硬，不容以色列人出离他的地。"]]},{"n":12,"v":[[1,"耶和华在埃及地晓谕摩西、亚伦说："],[2,"“你们要以本月为正月，为一年之首。"],[3,"你们吩咐以色列全会众说，本月初十日，各人要按着父家取羊羔，一家一只。"],[4,"若是一家的人太少，吃不了一只羊羔，本人就要和他隔壁的邻舍共取一只。你们预备羊羔，要按着人数和饭量计算。"],[5,"要无残疾、一岁的公羊羔，你们或从绵羊里取，或从山羊里取，都可以。"],[6,"要留到本月十四日，在黄昏的时候，以色列全会众把羊羔宰了。"],[7,"各家要取点血，涂在吃羊羔的房屋左右的门框上和门楣上。"],[8,"当夜要吃羊羔的肉，用火烤了，与无酵饼和苦菜同吃。"],[9,"不可吃生的，断不可吃水煮的，要带着头、腿、五脏，用火烤了吃。"],[10,"不可剩下一点留到早晨，若留到早晨，要用火烧了。"],[11,"你们吃羊羔当腰间束带，脚上穿鞋，手中拿杖，赶紧地吃，这是耶和华的逾越节。"],[12,"因为那夜我要巡行埃及地，把埃及地一切头生的，无论是
