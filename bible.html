”"],[7,"“知道公义、将我训诲存在心中的民，要听我言。不要怕人的辱骂，也不要因人的毁谤惊惶。"],[8,"因为蛀虫必咬他们，好像咬衣服；虫子必咬他们，如同咬羊绒。惟有我的公义永远长存，我的救恩直到万代。”"],[9,"耶和华的膀臂啊，兴起！兴起！以能力为衣穿上，像古时的年日、上古的世代兴起一样。从前砍碎拉哈伯、刺透大鱼的，不是你吗？"],[10,"使海与深渊的水干涸、使海的深处变为赎民经过之路的，不是你吗？"],[11,"耶和华救赎的民必归回，歌唱来到锡安；永乐必归到他们的头上，他们必得着欢喜快乐，忧愁叹息尽都逃避。"],[12,"“惟有我，是安慰你们的。你是谁，竟怕那必死的人，怕那要变如草的世人，"],[13,"却忘记铺张诸天、立定地基、创造你的耶和华。又因欺压者图谋毁灭要发的暴怒，整天害怕！其实那欺压者的暴怒在哪里呢？"],[14,"被掳去的快得释放，必不死而下坑；他的食物也不至缺乏。"],[15,"我是耶和华你的神，搅动大海，使海中的波浪砰訇，万军之耶和华是我的名。"],[16,"我将我的话传给你，用我的手影遮蔽你，为要栽定诸天，立定地基。又对锡安说：‘你是我的百姓。’”"],[17,"耶路撒冷啊，兴起！兴起！站起来！你从耶和华手中喝了他忿怒之杯，喝了那使人东倒西歪的爵，以致喝尽。"],[18,"他所生育的诸子中，没有一个引导他的；他所养大的诸子中，没有一个搀扶他的。"],[19,"荒凉、毁灭、饥荒、刀兵，这几样临到你，谁为你举哀？我如何能安慰你呢？"],[20,"你的众子发昏，在各市口上躺卧，好像黄羊在网罗之中，都满了耶和华的忿怒、你神的斥责。"],[21,"因此，你这困苦却非因酒而醉的，要听我言。"],[22,"你的主耶和华，就是为他百姓辨屈的神如此说：“看哪，我已将那使人东倒西歪的杯，就是我忿怒的爵，从你手中接过来，你必不至再喝。”"],[23,"“我必将这杯递在苦待你的人手中。他们曾对你说：‘你屈身，由我们践踏过去吧！’你便以背为地，好像街市，任人经过。”"]]},{"n":52,"v":[[1,"锡安啊，兴起！兴起！披上你的能力。圣城耶路撒冷啊，穿上你华美的衣服。因为从今以后，未受割礼、不洁净的，必不再进入你中间。"],[2,"耶路撒冷啊，要抖下尘土，起来坐在位上；锡安被掳的居民哪（“居民”原文作“女子”），要解开你颈项的锁链。"],[3,"耶和华如此说：“你们是无价被卖的，也必无银被赎。”"],[4,"主耶和华如此说：“起先我的百姓下到埃及，在那里寄居，又有亚述人无故欺压他们。”"],[5,"耶和华说：“我的百姓既是无价被掳去，如今我在这里作什么呢？”耶和华说：“辖制他们的人呼叫，我的名整天受亵渎。"],[6,"所以我的百姓必知道我的名，到那日他们必知道说这话的就是我。看哪，是我！”"],[7,"那报佳音、传平安、报好信、传救恩的，对锡安说：“你的神作王了！”这人的脚登山何等佳美。"],[8,"听啊，你守望之人的声音，他们扬起声来，一同歌唱。因为耶和华归回锡安的时候，他们必亲眼看见。"],[9,"耶路撒冷的荒场啊，要发起欢声，一同歌唱，因为耶和华安慰了他的百姓，救赎了耶路撒冷。"],[10,"耶和华在万国眼前露出圣臂，地极的人都看见我们神的救恩了。"],[11,"你们离开吧！离开吧！从巴比伦出来，不要沾不洁净的物，要从其中出来。你们扛抬耶和华器皿的人哪，务要自洁。"],[12,"你们出来必不至急忙，也不至奔逃，因为耶和华必在你们前头行，以色列的神必作你们的后盾。"],[13,"我的仆人行事必有智慧（或作“行事通达”），必被高举上升，且成为至高。"],[14,"许多人因他（原文作“你”）惊奇（他的面貌比别人憔悴，他的形容比世人枯槁），"],[15,"这样，他必洗净（或作“鼓动”）许多国民，君王要向他闭口。因所未曾传与他们的，他们必看见；未曾听见的，他们要明白。"]]},{"n":53,"v":[[1,"我们所传的（或作“所传与我们的”）有谁信呢？耶和华的膀臂向谁显露呢？"],[2,"他在耶和华面前生长如嫩芽，像根出于干地。他无佳形美容，我们看见他的时候，也无美貌使我们羡慕他。"],[3,"他被藐视，被人厌弃，多受痛苦，常经忧患。他被藐视，好像被人掩面不看的一样，我们也不尊重他。"],[4,"他诚然担当我们的忧患，背负我们的痛苦；我们却以为他受责罚，被神击打苦待了。"],[5,"哪知他为我们的过犯受害，为我们的罪孽压伤。因他受的刑罚，我们得平安；因他受的鞭伤，我们得医治。"],[6,"我们都如羊走迷，各人偏行己路，耶和华使我们众人的罪孽都归在他身上。"],[7,"他被欺压，在受苦的时候却不开口（或作“他受欺压，却自卑不开口”）。他像羊羔被牵到宰杀之地，又像羊在剪毛的人手下无声，他也是这样不开口。"],[8,"因受欺压和审判，他被夺去，至于他同世的人，谁想他受鞭打、从活人之地被剪除，是因我百姓的罪过呢？"],[9,"他虽然未行强暴，口中也没有诡诈，人还使他与恶人同埋；谁知死的时候与财主同葬。"],[10,"耶和华却定意（或作“喜悦”）将他压伤，使他受痛苦；耶和华以他为赎罪祭（或作“他献本身为赎罪祭”）。他必看见后裔，并且延长年日，耶和华所喜悦的事必在他手中亨通。"],[11,"他必看见自己劳苦的功效，便心满意足。有许多人因认识我的义仆得称为义，并且他要担当他们的罪孽。"],[12,"所以，我要使他与位大的同分，与强盛的均分掳物；因为他将命倾倒，以致于死。他也被列在罪犯之中。他却担当多人的罪，又为罪犯代求。"]]},{"n":54,"v":[[1,"“你这不怀孕、不生养的，要歌唱；你这未曾经过产难的，要发声歌唱，扬声欢呼。因为没有丈夫的比有丈夫的儿女更多。这是耶和华说的。"],[2,"要扩张你帐幕之地，张大你居所的幔子，不要限止；要放长你的绳子，坚固你的橛子。"],[3,"因为你要向左向右开展，你的后裔必得多国为业，又使荒凉的城邑有人居住。”"],[4,"“不要惧怕，因你必不至蒙羞；也不要抱愧，因你必不至受辱。你必忘记幼年的羞愧，不再记念你寡居的羞辱。"],[5,"因为造你的是你的丈夫，万军之耶和华是他的名；救赎你的是以色列的圣者，他必称为全地之神。"],[6,"耶和华召你，如召被离弃、心中忧伤的妻，就是幼年所娶被弃的妻。这是你神所说的。"],[7,"我离弃你不过片时，却要施大恩将你收回。"],[8,"我的怒气涨溢，顷刻之间向你掩面，却要以永远的慈爱怜恤你。这是耶和华你的救赎主说的。”"],[9,"“这事在我好像挪亚的洪水。我怎样起誓不再使挪亚的洪水漫过遍地，我也照样起誓不再向你发怒，也不斥责你。"],[10,"大山可以挪开，小山可以迁移，但我的慈爱必不离开你，我平安的约也不迁移。这是怜恤你的耶和华说的。”"],[11,"“你这受困苦被风飘荡不得安慰的人哪，我必以彩色安置你的石头，以蓝宝石立定你的根基；"],[12,"又以红宝石造你的女墙，以红玉造你的城门，以宝石造你四围的边界（或作“外郭”）。"],[13,"你的儿女都要受耶和华的教训，你的儿女必大享平安。"],[14,"你必因公义得坚立，必远离欺压，不至害怕；你必远离惊吓，惊吓必不临近你。"],[15,"即或有人聚集，却不由于我；凡聚集攻击你的，必因你仆倒（“因你仆倒”或作“投降你”）。"],[16,"吹嘘炭火、打造合用器械的铁匠是我所造；残害人、行毁灭的也是我所造。"],[17,"凡为攻击你造成的器械，必不利用；凡在审判时兴起用舌攻击你的，你必定他为有罪。这是耶和华仆人的产业，是他们从我所得的义。这是耶和华说的。”"]]},{"n":55,"v":[[1,"“你们一切干渴的都当就近水来，没有银钱的也可以来。你们都来买了吃，不用银钱，不用价值，也来买酒和奶。"],[2,"你们为何花钱（原文作“平银”）买那不足为食物的，用劳碌得来的买那不使人饱足的呢？你们要留意听我的话，就能吃那美物，得享肥甘，心中喜乐。"],[3,"你们当就近我来，侧耳而听，就必得活。我必与你们立永约，就是应许大卫那可靠的恩典。"],[4,"我已立他作万民的见证，为万民的君王和司令。"],[5,"你素不认识的国民，你也必召来；素不认识你的国民，也必向你奔跑，都因耶和华你的神以色列的圣者，因为他已经荣耀你。”"],[6,"当趁耶和华可寻找的时候寻找他，相近的时候求告他。"],[7,"恶人当离弃自己的道路，不义的人当除掉自己的意念，归向耶和华，耶和华就必怜恤他；当归向我们的神，因为神必广行赦免。"],[8,"耶和华说：“我的意念非同你们的意念，我的道路非同你们的道路。"],[9,"天怎样高过地，照样，我的道路高过你们的道路，我的意念高过你们的意念。"],[10,"雨雪从天而降，并不返回，却滋润地土，使地上发芽结实，使撒种的有种，使要吃的有粮。"],[11,"我口所出的话也必如此，决不徒然返回，却要成就我所喜悦的，在我发它去成就的事上（“发它去成就”或作“所命定的”）必然亨通。"],[12,"你们必欢欢喜喜而出来，平平安安蒙引导；大山小山必在你们面前发声歌唱，田野的树木也都拍掌。"],[13,"松树长出，代替荆棘，番石榴长出，代替蒺藜。这要为耶和华留名，作为永远的证据，不能剪除。”"]]},{"n":56,"v":[[1,"耶和华如此说：“你们当守公平、行公义，因我的救恩临近，我的公义将要显现。"],[2,"谨守安息日而不干犯，禁止己手而不作恶；如此行、如此持守的人便为有福。”"],[3,"与耶和华联合的外邦人不要说：“耶和华必定将我从他民中分别出来。”太监也不要说：“我是枯树。”"],[4,"因为耶和华如此说：“那些谨守我的安息日，拣选我所喜悦的事，持守我约的太监，"],[5,"我必使他们在我殿中、在我墙内有记念、有名号，比有儿女的更美。我必赐他们永远的名，不能剪除。”"],[6,"还有那些与耶和华联合的外邦人，要侍奉他，要爱耶和华的名，要作他的仆人，就是凡守安息日不干犯，又持守他（原文作“我”）约的人。"],[7,"我必领他们到我的圣山，使他们在祷告我的殿中喜乐。他们的燔祭和平安祭，在我坛上必蒙悦纳，因我的殿必称为万民祷告的殿。”"],[8,"主耶和华，就是招聚以色列被赶散的，说：“在这被招聚的人以外，我还要招聚别人归并他们。”"],[9,"田野的诸兽都来吞吃吧！林中的诸兽也要如此。"],[10,"他看守的人是瞎眼的，都没有知识，都是哑巴狗，不能叫唤；但知作梦、躺卧、贪睡。"],[11,"这些狗贪食，不知饱足。这些牧人不能明白，各人偏行己路，各从各方求自己的利益。"],[12,"他们说：“来吧！我去拿酒，我们饱饮浓酒，明日必和今日一样，就是宴乐无量极大之日。”"]]},{"n":57,"v":[[1,"义人死亡，无人放在心上；虔诚人被收去，无人思念。这义人被收去是免了将来的祸患。"],[2,"他们得享（原文作“进入”）平安。素行正直的，各人在坟里（原文作“床上”）安歇。"],[3,"你们这些巫婆的儿子，奸夫和妓女的种子，都要前来。"],[4,"你们向谁戏笑、向谁张口吐舌呢？你们岂不是悖逆的儿女、虚谎的种类呢？"],[5,"你们在橡树中间，在各青翠树下欲火攻心；在山谷间、在石穴下杀了儿女；"],[6,"在谷中光滑石头里有你的份，这些就是你所得的份。你也向他浇了奠祭、献了供物，因这事我岂能容忍吗？"],[7,"你在高而又高的山上安设床榻，也上那里去献祭。"],[8,"你在门后、在门框后立起你的记念，向外人赤露，又上去扩张床榻，与他们立约。你在那里看见他们的床就甚喜爱。"],[9,"你把油带到王那里，又多加香料；打发使者往远方去，自卑自贱直到阴间，"],[10,"你因路远疲倦，却不说这是枉然，你以为有复兴之力，所以不觉疲惫。"],[11,"你怕谁？因谁恐惧？竟说谎，不记念我，又不将这事放在心上！我不是许久闭口不言，你仍不怕我吗？"],[12,"我要指明你的公义，至于你所行的，都必与你无益。"],[13,"你哀求的时候，让你所聚集的拯救你吧！风要把他们刮散，一口气要把他们都吹去；但那投靠我的必得地土，必承受我的圣山为业。”"],[14,"耶和华要说：“你们要修筑修筑，预备道路，将绊脚石从我百姓的路中除掉。”"],[15,"因为那至高至上、永远长存（原文作“住在永远”）、名为圣者的如此说：“我住在至高至圣的所在，也与心灵痛悔、谦卑的人同居；要使谦卑人的灵苏醒，也使痛悔人的心苏醒。"],[16,"我必不永远相争，也不长久发怒，恐怕我所造的人与灵性都必发昏。"],[17,"因他贪婪的罪孽，我就发怒击打他。我向他掩面发怒，他却仍然随心背道。"],[18,"我看见他所行的道，也要医治他，又要引导他，使他和那一同伤心的人再得安慰。"],[19,"我造就嘴唇的果子，愿平安康泰归与远处的人，也归与近处的人；并且我要医治他。”这是耶和华说的。"],[20,"惟独恶人，好像翻腾的海不得平静；其中的水常涌出污秽和淤泥来。"],[21,"我的神说：“恶人必不得平安。”"]]},{"n":58,"v":[[1,"“你要大声喊叫，不可止息；扬起声来，好像吹角。向我百姓说明他们的过犯，向雅各家说明他们的罪恶。"],[2,"他们天天寻求我，乐意明白我的道，好像行义的国民，不离弃他们神的典章，向我求问公义的判语，喜悦亲近神。"],[3,"他们说：‘我们禁食，你为何不看见呢？我们刻苦己心，你为何不理会呢？’看哪，你们禁食的日子仍求利益，勒逼人为你们作苦工。"],[4,"你们禁食，却互相争竞，以凶恶的拳头打人。你们今日禁食，不得使你们的声音听闻于上。"],[5,"这样禁食，岂是我所拣选使人刻苦己心的日子吗？岂是叫人垂头像苇子，用麻布和炉灰铺在他以下吗？你这可称为禁食为耶和华所悦纳的日子吗？”"],[6,"“我所拣选的禁食，不是要松开凶恶的绳，解下轭上的索，使被欺压的得自由，折断一切的轭吗？"],[7,"不是要把你的饼分给饥饿的人，将飘流的穷人接到你家中，见赤身的给他衣服遮体，顾恤自己的骨肉而不掩藏吗？"],[8,"这样，你的光就必发现如早晨的光，你所得的医治要速速发明。你的公义必在你前面行；耶和华的荣光必作你的后盾。"],[9,"那时你求告，耶和华必应允；你呼求，他必说：我在这里。”“你若从你中间除掉重轭和指摘人的指头，并发恶言的事，"],[10,"你心若向饥饿的人发怜悯，使困苦的人得满足，你的光就必在黑暗中发现，你的幽暗必变如正午。"],[11,"耶和华也必时常引导你，在干旱之地，使你心满意足，骨头强壮。你必像浇灌的园子，又像水流不绝的泉源。"],[12,"那些出于你的人，必修造久已荒废之处。你要建立拆毁累代的根基，你必称为补破口的，和重修路径与人居住的。”"],[13,"“你若在安息日掉转（或作“谨慎”）你的脚步，在我圣日不以操作为喜乐，称安息日为可喜乐的，称耶和华的圣日为可尊重的，而且尊敬这日，不办自己的私事，不随自己的私意，不说自己的私话，"],[14,"你就以耶和华为乐。耶和华要使你乘驾地的高处，又以你祖雅各的产业养育你。”这是耶和华亲口说的。"]]},{"n":59,"v":[[1,"耶和华的膀臂并非缩短，不能拯救，耳朵并非发沉，不能听见。"],[2,"但你们的罪孽使你们与神隔绝，你们的罪恶使他掩面不听你们。"],[3,"因你们的手被血沾染，你们的指头被罪孽沾污；你们的嘴唇说谎言，你们的舌头出恶语。"],[4,"无一人按公义告状，无一人凭诚实辨白，都倚靠虚妄，说谎言。所怀的是毒害，所生的是罪孽。"],[5,"他们抱毒蛇蛋，结蜘蛛网，人吃这蛋必死。这蛋被踏，必出蝮蛇。"],[6,"所结的网不能成为衣服，所作的也不能遮盖自己。他们的行为都是罪孽，手所作的都是强暴。"],[7,"他们的脚奔跑行恶，他们急速流无辜人的血，意念都是罪孽；所经过的路都荒凉毁灭。"],[8,"平安的路，他们不知道；所行的事没有公平。他们为自己修弯曲的路，凡行此路的，都不知道平安。"],[9,"因此，公平离我们远，公义追不上我们。我们指望光亮，却是黑暗；指望光明，却行幽暗。"],[10,"我们摸索墙壁，好像瞎子；我们摸索，如同无目之人。我们晌午绊脚，如在黄昏一样；我们在肥壮人中，像死人一般。"],[11,"我们咆哮如熊，哀鸣如鸽。指望公平，却是没有；指望救恩，却远离我们。"],[12,"我们的过犯在你面前增多，罪恶作见证告我们，过犯与我们同在。至于我们的罪孽，我们都知道，"],[13,"就是悖逆不认识耶和华，转去不跟从我们的神，说欺压和叛逆的话，心怀谎言，随即说出。"],[14,"并且公平转而退后，公义站在远处；诚实在街上仆倒，正直也不得进入。"],[15,"诚实少见，离恶的人反成掠物。那时，耶和华看见没有公平，甚不喜悦。"],[16,"他见无人拯救，无人代求，甚为诧异，就用自己的膀臂施行拯救，以公义扶持自己。"],[17,"他以公义为铠甲（或作“护心镜”），以拯救为头盔，以报仇为衣服，以热心为外袍。"],[18,"他必按人的行为施报，恼怒他的敌人，报复他的仇敌，向众海岛施行报应。"],[19,"如此，人从日落之处必敬畏耶和华的名；从日出之地，也必敬畏他的荣耀。因为仇敌好像急流的河水冲来，是耶和华之气所驱逐的。"],[20,"必有一位救赎主来到锡安、雅各族中转离过犯的人那里，这是耶和华说的。"],[21,"耶和华说：“至于我与他们所立的约乃是这样：我加给你的灵，传给你的话，必不离你的口，也不离你后裔与你后裔之后裔的口，从今直到永远。这是耶和华说的。”"]]},{"n":60,"v":[[1,"兴起！发光！因为你的光已经来到，耶和华的荣耀发现照耀你。"],[2,"看哪，黑暗遮盖大地，幽暗遮盖万民，耶和华却要显现照耀你，他的荣耀要现在你身上。"],[3,"万国要来就你的光，君王要来就你发现的光辉。"],[4,"你举目向四方观看，众人都聚集来到你这里。你的众子从远方而来，你的众女也被怀抱而来。"],[5,"那时你看见就有光荣，你心又跳动又宽畅。因为大海丰盛的货物必转来归你，列国的财宝也必来归你。"],[6,"成群的骆驼，并米甸和以法的独峰驼必遮满你。示巴的众人都必来到；要奉上黄金乳香，又要传说耶和华的赞美。"],[7,"基达的羊群都必聚集到你这里，尼拜约的公羊要供你使用；在我坛上必蒙悦纳，我必荣耀我荣耀的殿。"],[8,"那些飞来如云、又如鸽子向窗户飞回的是谁呢？"],[9,"众海岛必等候我，首先是他施的船只，将你的众子连他们的金银从远方一同带来，都为耶和华你神的名，又为以色列的圣者，因为他已经荣耀了你。"],[10,"外邦人必建筑你的城墙，他们的王必服侍你。我曾发怒击打你，现今却施恩怜恤你。"],[11,"你的城门必时常开放，昼夜不关，使人把列国的财物带来归你，并将他们的君王牵引而来。"],[12,"哪一邦哪一国不侍奉你，就必灭亡，也必全然荒废。"],[13,"黎巴嫩的荣耀，就是松树、杉树、黄杨树，都必一同归你，为要修饰我圣所之地，我也要使我脚踏之处得荣耀。"],[14,"素来苦待你的，他的子孙都必屈身来就你；藐视你的，都要在你脚下跪拜。他们要称你为耶和华的城，为以色列圣者的锡安。"],[15,"你虽然被撇弃、被厌恶，甚至无人经过，我却使你变为永远的荣华，成为累代的喜乐。"],[16,"你也必吃万国的奶，又吃君王的奶。你便知道我耶和华是你的救主，是你的救赎主，雅各的大能者。"],[17,"我要拿金子代替铜，拿银子代替铁，拿铜代替木头，拿铁代替石头；并要以和平为你的官长，以公义为你的监督。"],[18,"你地上不再听见强暴的事，境内不再听见荒凉毁灭的事。你必称你的墙为拯救，称你的门为赞美。"],[19,"日头不再作你白昼的光，月亮也不再发光照耀你；耶和华却要作你永远的光，你神要为你的荣耀。"],[20,"你的日头不再下落，你的月亮也不退缩；因为耶和华必作你永远的光，你悲哀的日子也完毕了。"],[21,"你的居民都成为义人，永远得地为业，是我种的栽子，我手的工作，使我得荣耀。"],[22,"至小的族要加增千倍，微弱的国必成为强盛；我耶和华要按定期速成这事。"]]},{"n":61,"v":[[1,"主耶和华的灵在我身上，因为耶和华用膏膏我，叫我传好信息给谦卑的人（或作“传福音给贫穷的人”），差遣我医好伤心的人，报告被掳的得释放，被囚的出监牢；"],[2,"报告耶和华的恩年，和我们神报仇的日子，安慰一切悲哀的人；"],[3,"赐华冠与锡安悲哀的人，代替灰尘，喜乐油代替悲哀，赞美衣代替忧伤之灵。使他们称为公义树，是耶和华所栽的，叫他得荣耀。"],[4,"他们必修造已久的荒场，建立先前凄凉之处，重修历代荒凉之城。"],[5,"那时，外人必起来牧放你们的羊群，外邦人必作你们耕种田地的、修理葡萄园的。"],[6,"你们倒要称为耶和华的祭司，人必称你们为我们神的仆役。你们必吃用列国的财物，因得他们的荣耀自夸。"],[7,"你们必得加倍的好处，代替所受的羞辱；份中所得的喜乐，必代替所受的凌辱。在境内必得加倍的产业，永远之乐必归与你们（原文作“他们”）。"],[8,"因为我耶和华喜爱公平，恨恶抢夺和罪孽。我要凭诚实施行报应，并要与我的百姓立永约。"],[9,"他们的后裔必在列国中被人认识，他们的子孙在众民中也是如此。凡看见他们的，必认他们是耶和华赐福的后裔。"],[10,"我因耶和华大大欢喜，我的心靠神快乐。因他以拯救为衣给我穿上，以公义为袍给我披上。好像新郎戴上华冠，又像新妇佩戴妆饰。"],[11,"田地怎样使百谷发芽，园子怎样使所种的发生，主耶和华必照样使公义和赞美在万民中发出。"]]},{"n":62,"v":[[1,"我因锡安必不静默，为耶路撒冷必不息声，直到他的公义如光辉发出，他的救恩如明灯发亮。"],[2,"列国必见你的公义，列王必见你的荣耀。你必得新名的称呼，是耶和华亲口所起的。"],[3,"你在耶和华的手中要作为华冠，在你神的掌上必作为冕旒。"],[4,"你必不再称为撇弃的，你的地也不再称为荒凉的，你却要称为我所喜悦的，你的地也必称为有夫之妇；因为耶和华喜悦你，你的地也必归他。"],[5,"少年人怎样娶处女，你的众民（“民”原文作“子”）也要照样娶你；新郎怎样喜悦新妇，你的神也要照样喜悦你。"],[6,"耶路撒冷啊，我在你城上设立守望的，他们昼夜必不静默，呼吁耶和华的，你们不要歇息，"],[7,"也不要使他歇息，直等他建立耶路撒冷，使耶路撒冷在地上成为可赞美的。"],[8,"耶和华指着自己的右手和大能的膀臂起誓说：“我必不再将你的五谷给你仇敌作食物，外邦人也不再喝你劳碌得来的新酒，"],[9,"惟有那收割的要吃，并赞美耶和华，那聚敛的要在我圣所的院内喝。”"],[10,"你们当从门经过经过，预备百姓的路；修筑修筑大道，捡去石头，为万民竖立大旗，"],[11,"看哪，耶和华曾宣告到地极，对锡安的居民（“民”原文作“女子”）说：“你的拯救者来到，他的赏赐在他那里，他的报应在他面前。”"],[12,"人必称他们为圣民，为耶和华的赎民，你也必称为被眷顾不撇弃的城。"]]},{"n":63,"v":[[1,"这从以东的波斯拉来，穿红衣服、装扮华美、能力广大、大步行走的是谁呢？就是我，是凭公义说话，以大能施行拯救。"],[2,"你的装扮为何有红色？你的衣服为何像踹酒醡的呢？"],[3,"我独自踹酒醡，众民中无一人与我同在。我发怒将他们踹下，发烈怒将他们践踏；他们的血溅在我衣服上，并且污染了我一切的衣裳。"],[4,"因为报仇之日在我心中，救赎我民之年已经来到。"],[5,"我仰望，见无人帮助；我诧异，没有人扶持。所以我自己的膀臂为我施行拯救，我的烈怒将我扶持。"],[6,"我发怒，踹下众民；发烈怒，使他们沉醉，又将他们的血倒在地上。"],[7,"我要照耶和华一切所赐给我们的，提起他的慈爱和美德，并他向以色列家所施的大恩，这恩是照他的怜恤和丰盛的慈爱赐给他们的。"],[8,"他说：“他们诚然是我的百姓，不行虚假的子民。”这样，他就作了他们的救主。"],[9,"他们在一切苦难中，他也同受苦难，并且他面前的使者拯救他们。他以慈爱和怜悯救赎他们，在古时的日子常保抱他们、怀搋他们。"],[10,"他们竟悖逆，使主的圣灵担忧；他就转作他们的仇敌，亲自攻击他们。"],[11,"那时，他们（原文作“他”）想起古时的日子，摩西和他百姓，说：“将百姓和牧养他全群的人从海里领上来的在哪里呢？将他的圣灵降在他们中间的在哪里呢？"],[12,"使他荣耀的膀臂在摩西的右手边行动，在他们前面将水分开，要建立自己永远的名，"],[13,"带领他们经过深处，如马行走旷野，使他们不至绊跌的在哪里呢？”"],[14,"耶和华的灵使他们得安息，彷佛牲畜下到山谷。照样，你也引导你的百姓，要建立自己荣耀的名。"],[15,"求你从天上垂顾，从你圣洁荣耀的居所观看。你的热心和你大能的作为在哪里呢？你爱慕的心肠和怜悯向我们止住了。"],[16,"亚伯拉罕虽然不认识我们，以色列也不承认我们，你却是我们的父。耶和华啊，你是我们的父，从万古以来，你名称为我们的救赎主。"],[17,"耶和华啊，你为何使我们走差，离开你的道，使我们心里刚硬不敬畏你呢？求你为你仆人、为你产业支派的缘故转回来。"],[18,"你的圣民不过暂时得这产业，我们的敌人已经践踏你的圣所。"],[19,"我们好像你未曾治理的人，又像未曾得称你名下的人。"]]},{"n":64,"v":[[1,"愿你裂天而降，愿山在你面前震动，"],[2,"好像火烧干柴，又像火将水烧开。使你敌人知道你的名，使列国在你面前发颤。"],[3,"你曾行我们不能逆料、可畏的事。那时你降临，山岭在你面前震动。"],[4,"从古以来人未曾听见、未曾耳闻、未曾眼见在你以外有什么神为等候他的人行事。"],[5,"你迎接那欢喜行义、记念你道的人，你曾发怒，我们仍犯罪。这景况已久，我们还能得救吗？"],[6,"我们都像不洁净的人，所有的义都像污秽的衣服；我们都像叶子渐渐枯干，我们的罪孽好像风把我们吹去。"],[7,"并且无人求告你的名，无人奋力抓住你；原来你掩面不顾我们，使我们因罪孽消化。"],[8,"耶和华啊，现在你仍是我们的父！我们是泥，你是窑匠。我们都是你手的工作。"],[9,"耶和华啊，求你不要大发震怒，也不要永远记念罪孽。求你垂顾我们，我们都是你的百姓。"],[10,"你的圣邑变为旷野，锡安变为旷野，耶路撒冷成为荒场。"],[11,"我们圣洁华美的殿，就是我们列祖赞美你的所在，被火焚烧；我们所羡慕的美地尽都荒废。"],[12,"耶和华啊，有这些事，你还忍得住吗？你仍静默，使我们深受苦难吗？"]]},{"n":65,"v":[[1,"“素来没有访问我的，现在求问我；没有寻找我的，我叫他们遇见；没有称为我名下的，我对他们说：‘我在这里！我在这里！’"],[2,"我整天伸手招呼那悖逆的百姓，他们随自己的意念行不善之道。"],[3,"这百姓时常当面惹我发怒，在园中献祭，在坛（原文作“砖”）上烧香。"],[4,"在坟墓间坐着，在隐密处住宿，吃猪肉，他们器皿中有可憎之物作的汤。"],[5,"且对人说：‘你站开吧！不要挨近我，因为我比你圣洁。’主说：‘这些人是我鼻中的烟，是整天烧着的火。’"],[6,"-"],[7,"看哪，这都写在我面前，我必不静默，必施行报应，必将你们的罪孽和你们列祖的罪孽，就是在山上烧香、在冈上亵渎我的罪孽，一同报应在他们后人怀中。我先要把他们所行的量给他们。这是耶和华说的。”"],[8,"耶和华如此说：“葡萄中寻得新酒，人就说：‘不要毁坏，因为福在其中。’我因我仆人的缘故也必照样而行，不将他们全然毁灭。"],[9,"我必从雅各中领出后裔，从犹大中领出承受我众山的。我的选民必承受，我的仆人要在那里居住。"],[10,"沙仑平原必成为羊群的圈，亚割谷必成为牛群躺卧之处，都为寻求我的民所得。"],[11,"但你们这些离弃耶和华，忘记我的圣山，给时运摆筵席（原文作“桌子”）、给天命盛满调和酒的，"],[12,"我要命定你们归在刀下，都必屈身被杀。因为我呼唤，你们没有答应；我说话，你们没有听从，反倒行我眼中看为恶的，拣选我所不喜悦的。”"],[13,"所以，主耶和华如此说：“我的仆人必得吃，你们却饥饿；我的仆人必得喝，你们却干渴；我的仆人必欢喜，你们却蒙羞；"],[14,"我的仆人因心中高兴欢呼，你们却因心中忧愁哀哭，又因心里忧伤哀号。"],[15,"你们必留下自己的名，为我选民指着赌咒。主耶和华必杀你们，另起别名称呼他的仆人。"],[16,"这样，在地上为自己求福的，必凭真实的神求福；在地上起誓的，必指真实的神起誓；因为从前的患难已经忘记，也从我眼前隐藏了。”"],[17,"“看哪，我造新天新地，从前的事不再被记念，也不再追想。"],[18,"你们当因我所造的永远欢喜快乐，因我造耶路撒冷为人所喜，造其中的居民为人所乐。"],[19,"我必因耶路撒冷欢喜，因我的百姓快乐。其中必不再听见哭泣的声音和哀号的声音。"],[20,"其中必没有数日夭亡的婴孩，也没有寿数不满的老者；因为百岁死的仍算孩童，有百岁死的罪人算被咒诅。"],[21,"他们要建造房屋，自己居住；栽种葡萄园，吃其中的果子。"],[22,"他们建造的，别人不得住；他们栽种的，别人不得吃。因为我民的日子必像树木的日子，我选民亲手劳碌得来的必长久享用。"],[23,"他们必不徒然劳碌，所生产的，也不遭灾害。因为都是蒙耶和华赐福的后裔，他们的子孙也是如此。"],[24,"他们尚未求告，我就应允；正说话的时候，我就垂听。"],[25,"豺狼必与羊羔同食，狮子必吃草与牛一样，尘土必作蛇的食物。在我圣山的遍处，这一切都不伤人、不害物。这是耶和华说的。”"]]},{"n":66,"v":[[1,"耶和华如此说：“天是我的座位，地是我的脚凳。你们要为我造何等的殿宇？哪里是我安息的地方呢？”"],[2,"耶和华说：“这一切都是我手所造的，所以就都有了。但我所看顾的，就是虚心痛悔、因我话而战兢的人（“虚心”原文作“贫穷”）。"],[3,"假冒为善的宰牛，好像杀人，献羊羔，好像打折狗项，献供物，好像献猪血，烧乳香，好像称颂偶像。这等人拣选自己的道路，心里喜悦行可憎恶的事。"],[4,"我也必拣选迷惑他们的事，使他们所惧怕的临到他们。因为我呼唤，无人答应；我说话，他们不听从，反倒行我眼中看为恶的，拣选我所不喜悦的。”"],[5,"你们因耶和华言语战兢的人，当听他的话。你们的弟兄，就是恨恶你们、因我名赶出你们的，曾说：“愿耶和华得荣耀，使我们得见你们的喜乐”，但蒙羞的究竟是他们。"],[6,"有喧哗的声音出自城中，有声音出于殿中，是耶和华向仇敌施行报应的声音。"],[7,"锡安未曾劬劳就生产；未觉疼痛就生出男孩。"],[8,"国岂能一日而生？民岂能一时而产？因为锡安一劬劳，便生下儿女。这样的事谁曾听见、谁曾看见呢？"],[9,"耶和华说：“我既使她临产，岂不使她生产呢？你的神说，我既使她生产，岂能使她闭胎不生呢？”"],[10,"你们爱慕耶路撒冷的，都要与她一同欢喜快乐，你们为她悲哀的，都要与她一同乐上加乐，"],[11,"使你们在她安慰的怀中吃奶得饱，使他们得她丰盛的荣耀，犹如挤奶，满心喜乐。"],[12,"耶和华如此说：“我要使平安延及她，好像江河；使列国的荣耀延及她，如同涨溢的河。你们要从中享受（原文作“咂”），你们必蒙抱在肋旁，摇弄在膝上。"],[13,"母亲怎样安慰儿子，我就照样安慰你们。你们也必因（或作“在”）耶路撒冷得安慰。"],[14,"你们看见，就心中快乐，你们的骨头必得滋润，像嫩草一样。而且耶和华的手向他仆人所行的，必被人知道；他也要向仇敌发恼恨。”"],[15,"“看哪，耶和华必在火中降临。他的车辇像旋风，以烈怒施行报应，以火焰施行责罚。"],[16,"因为耶和华在一切有血气的人身上，必以火与刀施行审判，被耶和华所杀的必多。"],[17,"那些分别为圣、洁净自己的，进入园内。跟在其中一个人的后头吃猪肉和仓鼠，并可憎之物，他们必一同灭绝。这是耶和华说的。”"],[18,"“我知道他们的行为和他们的意念。时候将到，我必将万民万族（“族”原文作“舌”）聚来，看见我的荣耀。"],[19,"我要显神迹（或作“记号”）在他们中间，逃脱的我要差到列国去，就是到他施、普勒、拉弓的路德和土巴、雅完，并素来没有听见我名声，没有看见我荣耀辽远的海岛，他们必将我的荣耀传扬在列国中。"],[20,"他们必将你们的弟兄从列国中送回，使他们或骑马，或坐车，坐轿，骑骡子，骑独峰驼，到我的圣山耶路撒冷，作为供物献给耶和华，好像以色列人用洁净的器皿盛供物奉到耶和华的殿中。这是耶和华说的。”"],[21,"耶和华说：“我也必从他们中间取人为祭司，为利未人。”"],[22,"耶和华说：“我所要造的新天新地，怎样在我面前长存，你们的后裔和你们的名字也必照样长存。"],[23,"每逢月朔、安息日，凡有血气的必来在我面前下拜。这是耶和华说的。"],[24,"他们必出去观看那些违背我人的尸首，因为他们的虫是不死的，他们的火是不灭的。凡有血气的都必憎恶他们。”"]]}]},{"name":"何西阿书","chapters":[{"n":1,"v":[[1,"当乌西雅、约坦、亚哈斯、希西家作犹大王，约阿施的儿子耶罗波安作以色列王的时候，耶和华的话临到备利的儿子何西阿。"],[2,"耶和华初次与何西阿说话，对他说：“你去娶淫妇为妻，也收那从淫乱所生的儿女；因为这地大行淫乱，离弃耶和华。”"],[3,"于是，何西阿去娶了滴拉音的女儿歌蔑。这妇人怀孕，给他生了一个儿子。"],[4,"耶和华对何西阿说：“给他起名叫耶斯列；因为再过片时，我必讨耶户家在耶斯列杀人流血的罪，也必使以色列家的国灭绝。"],[5,"到那日，我必在耶斯列平原折断以色列的弓。”"],[6,"歌篾又怀孕生了一个女儿，耶和华对何西阿说：“给她起名叫罗路哈玛（就是“不蒙怜悯”的意思）；因为我必不再怜悯以色列家，决不赦免他们。"],[7,"我却要怜悯犹大家，使他们靠耶和华他们的神得救，不使他们靠弓、刀、争战、马匹与马兵得救。”"],[8,"歌篾给罗路哈玛断奶以后，又怀孕生了一个儿子。"],[9,"耶和华说：“给他起名叫罗阿米（就是“非我民”的意思）；因为你们不作我的子民，我也不作你们的神。”"],[10,"“然而，以色列的人数必如海沙，不可量、不可数。从前在什么地方对他们说：‘你们不是我的子民’，将来在那里必对他们说：‘你们是永生神的儿子。’"],[11,"犹大人和以色列人必一同聚集，为自己立一个首领，从这地上去（或作“从被掳之地上来”），因为耶斯列的日子必为大日。”"]]},{"n":2,"v":[[1,"“你们要称你们的弟兄为阿米（就是“我民”的意思）；称你们的姐妹为路哈玛（就是“蒙怜悯”的意思）。”"],[2,"“你们要与你们的母亲大大争辩，因为她不是我的妻子，我也不是她的丈夫。叫她除掉脸上的淫像和胸间的淫态，"],[3,"免得我剥她的衣服，使她赤体与才生的时候一样，使她如旷野，如干旱之地，因渴而死。"],[4,"我必不怜悯她的儿女，因为他们是从淫乱而生的。"],[5,"他们的母亲行了淫乱，怀他们的母作了可羞耻的事，因为她说：‘我要随从所爱的，我的饼、水、羊毛、麻、油、酒都是他们给的。’"],[6,"因此，我必用荆棘堵塞她的道，筑墙挡住她，使她找不着路。"],[7,"她必追随所爱的，却追不上；她必寻找他们，却寻不见。便说：‘我要归回前夫，因我那时的光景比如今还好。’"],[8,"她不知道是我给她五谷、新酒和油，又加增她的金银，她却以此供奉（或作“制造”）巴力。"],[9,"因此，到了收割的日子，出酒的时候，我必将我的五谷、新酒收回，也必将她应当遮体的羊毛和麻夺回来。"],[10,"如今我必在她所爱的眼前显露她的丑态，必无人能救她脱离我的手。"],[11,"我也必使她的宴乐、节期、月朔、安息日，并她的一切大会，都止息了。"],[12,"我也必毁坏她的葡萄树和无花果树，就是她说：‘这是我所爱的给我为赏赐’的。我必使这些树变为荒林，为田野的走兽所吃。"],[13,"我必追讨她素日给诸巴力烧香的罪，那时她佩带耳环和别样妆饰，随从她所爱的，却忘记我。这是耶和华说的。”"],[14,"“后来我必劝导她，领她到旷野，对她说安慰的话。"],[15,"她从那里出来，我必赐她葡萄园，又赐她亚割谷作为指望的门。她必在那里应声（或作“歌唱”），与幼年的日子一样，与从埃及地上来的时候相同。”"],[16,"耶和华说：“那日你必称呼我伊施（就是“我夫”的意思），不再称呼我巴力（就是“我主”的意思）。"],[17,"因为我必从我民的口中除掉诸巴力的名号，这名号不再提起。"],[18,"当那日，我必为我的民，与田野的走兽和空中的飞鸟，并地上的昆虫立约。又必在国中折断弓刀，止息争战，使他们安然躺卧。"],[19,"我必聘你永远归我为妻，以仁义、公平、慈爱、怜悯聘你归我，"],[20,"也以诚实聘你归我，你就必认识我耶和华。”"],[21,"耶和华说：“那日我必应允，我必应允天，天必应允地，"],[22,"地必应允五谷、新酒和油，这些必应允耶斯列民（“耶斯列”就是“神栽种的”意思）。"],[23,"我必将他种在这地。素不蒙怜悯的，我必怜悯；本非我民的，我必对他说：‘你是我的民。’他必说：‘你是我的神。’”"]]},{"n":3,"v":[[1,"耶和华对我说：“你再去爱一个淫妇，就是她情人所爱的；好像以色列人，虽然偏向别神，喜爱葡萄饼，耶和华还是爱他们。”"],[2,"我便用银子十五舍客勒，大麦一贺梅珥半，买她归我。"],[3,"我对她说：“你当多日为我独居，不可行淫，不可归别人为妻，我向你也必这样。”"],[4,"以色列人也必多日独居，无君王、无首领、无祭祀、无柱像、无以弗得、无家中的神像。"],[5,"后来以色列人必归回（或作“回心转意”），寻求他们的神耶和华和他们的王大卫。在末后的日子，必以敬畏的心归向耶和华，领受他的恩惠。"]]},{"n":4,"v":[[1,"“以色列人哪，你们当听耶和华的话。耶和华与这地的居民争辩，因这地上无诚实、无良善、无人认识神。"],[2,"但起假誓、不践前言、杀害、偷盗、奸淫、行强暴、杀人流血，接连不断。"],[3,"因此，这地悲哀，其上的民、田野的兽、空中的鸟必都衰微，海中的鱼也必消灭。”"],[4,"“然而，人都不必争辩，也不必指责，因为这民与抗拒祭司的人一样。"],[5,"你这祭司必日间跌倒，先知也必夜间与你一同跌倒，我必灭绝你的母亲。"],[6,"我的民因无知识而灭亡。你弃掉知识，我也必弃掉你，使你不再给我作祭司。你既忘了你神的律法，我也必忘记你的儿女。"],[7,"祭司越发增多，就越发得罪我，我必使他们的荣耀变为羞辱。"],[8,"他们吃我民的赎罪祭，满心愿意我民犯罪。"],[9,"将来民如何，祭司也必如何。我必因他们所行的惩罚他们，照他们所作的报应他们。"],[10,"他们吃，却不得饱；行淫，而不得立后；因为他们离弃耶和华，不遵他的命。”"],[11,"“奸淫和酒，并新酒，夺去人的心。"],[12,"我的民求问木偶，以为木杖能指示他们，因为他们的淫心使他们失迷，他们就行淫离弃神，不守约束。"],[13,"在各山顶，各高冈的橡树、杨树、栗树之下献祭烧香，因为树影美好。”“所以，你们的女儿淫乱，你们的新妇（或作“儿妇”。下同）行淫。"],[14,"你们的女儿淫乱，你们的新妇行淫，我却不惩罚她们，因为你们自己离群与娼妓同居，与妓女一同献祭。这无知的民必致倾倒。”"],[15,"“以色列啊，你虽然行淫，犹大却不可犯罪。不要往吉甲去，不要上到伯亚文，也不要指着永生的耶和华起誓。"],[16,"以色列倔强，犹如倔强的母牛；现在耶和华要放他们，如同放羊羔在宽阔之地。”"],[17,"“以法莲亲近偶像，任凭他吧！"],[18,"他们所喝的已经发酸，他们时常行淫，他们的官长最爱羞耻的事。"],[19,"风把他们裹在翅膀里；他们因所献的祭必致蒙羞。”"]]},{"n":5,"v":[[1,"“众祭司啊，要听我的话！以色列家啊，要留心听！王家啊，要侧耳而听！审判要临到你们，因你们在米斯巴如网罗，在他泊山如铺张的网。"],[2,"这些悖逆的人肆行杀戮，罪孽极深；我却斥责他们众人。"],[3,"以法莲为我所知，以色列不能向我隐藏。以法莲哪，现在你行淫了，以色列被玷污了。”"],[4,"“他们所行的使他们不能归向神，因有淫心在他们里面，他们也不认识耶和华。"],[5,"以色列的骄傲当面见证自己。故此，以色列和以法莲必因自己的罪孽跌倒，犹大也必与他们一同跌倒。"],[6,"他们必牵着牛羊去寻求耶和华，却寻不见，他已经转去离开他们。"],[7,"他们向耶和华行事诡诈，生了私子。到了月朔，他们与他们的地业必被吞灭。”"],[8,"“你们当在基比亚吹角，在拉玛吹号，在伯亚文吹出大声，说：‘便雅悯哪，有仇敌在你后头。"],[9,"在责罚的日子，以法莲必变为荒场。’我在以色列支派中，指示将来必成的事。"],[10,"犹大的首领如同挪移地界的人，我必将忿怒倒在他们身上，如水一般。"],[11,"以法莲因乐从人的命令，就受欺压，被审判压碎。"],[12,"我使以法莲如虫蛀之物，使犹大家如朽烂之木。”"],[13,"“以法莲见自己有病，犹大见自己有伤，他们就打发人往亚述去见耶雷布王，他却不能医治你们，不能治好你们的伤。"],[14,"我必向以法莲如狮子，向犹大家如少壮狮子。我必撕裂而去，我要夺去，无人搭救。”"],[15,"“我要回到原处，等他们自觉有罪（或作“承认己罪”），寻求我面，他们在急难的时候，必切切寻求我。”"]]},{"n":6,"v":[[1,"“来吧，我们归向耶和华！他撕裂我们，也必医治；他打伤我们，也必缠裹。"],[2,"过两天他必使我们苏醒，第三天他必使我们兴起，我们就在他面前得以存活。"],[3,"我们务要认识耶和华，竭力追求认识他；他出现确如晨光，他必临到我们像甘雨，像滋润田地的春雨。”"],[4,"主说：“以法莲哪，我可向你怎样行呢？犹大啊，我可向你怎样作呢？因为你们的良善如同早晨的云雾，"],[5,"因此，我藉先知砍伐他们，以我口中的话杀戮他们，我施行的审判如光发出。"],[6,"我喜爱良善（或作“怜恤”），不喜爱祭祀；喜爱认识神，胜于燔祭。”"],[7,"“他们却如亚当背约，在境内向我行事诡诈。"],[8,"基列是作孽之人的城，被血沾染。"],[9,"强盗成群，怎样埋伏杀人；祭司结党，也照样在示剑的路上杀戮，行了邪恶。"],[10,"在以色列家我见了可憎的事，在以法莲那里有淫行，以色列被玷污。”"],[11,"“犹大啊，我使被掳之民归回的时候，必有为你所命定的收场。”"]]},{"n":7,"v":[[1,"“我想医治以色列的时候，以法莲的罪孽和撒玛利亚的罪恶就显露出来。他们行事虚谎，内有贼人入室偷窃；外有强盗成群骚扰。"],[2,"他们心里并不思想我记念他们的一切恶，他们所行的现在缠绕他们，都在我面前。”"],[3,"“他们行恶使君王欢喜，说谎使首领喜乐。"],[4,"他们都是行淫的，像火炉被烤饼的烧热，从抟面到发面的时候，暂不使火着旺。"],[5,"在我们王宴乐的日子，首领因酒的烈性成病；王与亵慢人拉手。"],[6,"首领埋伏的时候，心中热如火炉，就如烤饼的整夜睡卧，到了早晨火气炎炎。"],[7,"众民也热如火炉，烧灭他们的官长。他们的君王都仆倒而死，他们中间无一人求告我。”"],[8,"“以法莲与列邦人搀杂，以法莲是没有翻过的饼。"],[9,"外邦人吞吃他劳力得来的，他却不知道；头发斑白，他也不觉得。"],[10,"以色列的骄傲当面见证自己，虽遭遇这一切，他们仍不归向耶和华他们的神，也不寻求他。"],[11,"以法莲好像鸽子愚蠢无知，他们求告埃及，投奔亚述。"],[12,"他们去的时候，我必将我的网撒在他们身上，我要打下他们如同空中的鸟。我必按他们会众所听见的惩罚他们。"],[13,"他们因离弃我，必定有祸；因违背我，必被毁灭。我虽要救赎他们，他们却向我说谎。”"],[14,"“他们并不诚心哀求我，乃在床上呼号。他们为求五谷新酒聚集，仍然悖逆我。"],[15,"我虽教导他们，坚固他们的膀臂，他们竟图谋抗拒我。"],[16,"他们归向，却不归向至上者；他们如同翻背的弓。他们的首领必因舌头的狂傲倒在刀下，这在埃及地必作人的讥笑。”"]]},{"n":8,"v":[[1,"“你用口吹角吧，敌人如鹰来攻打耶和华的家，因为这民违背我的约，干犯我的律法。"],[2,"他们必呼叫我说：‘我的神啊，我们以色列认识你了。’"],[3,"以色列丢弃良善（或作“福分”），仇敌必追逼他。"],[4,"他们立君王，却不由我，他们立首领，我却不认。他们用金银为自己制造偶像，以致被剪除。"],[5,"撒玛利亚啊，耶和华已经丢弃你的牛犊；我的怒气向拜牛犊的人发作，他们到几时方能无罪呢？"],[6,"这牛犊出于以色列，是匠人所造的，并不是神。撒玛利亚的牛犊必被打碎。"],[7,"他们所种的是风，所收的是暴风；所种的不成禾稼，就是发苗，也不结实；即便结实，外邦人必吞吃。"],[8,"以色列被吞吃，现今在列国中，好像人不喜悦的器皿。"],[9,"他们投奔亚述，如同独行的野驴。以法莲贿买朋党。"],[10,"他们虽在列邦中贿买人，现在我却要聚集惩罚他们。他们因君王和首领所加的重担，日渐衰微。”"],[11,"“以法莲增添祭坛取罪，因此，祭坛使他犯罪。"],[12,"我为他写了律法万条，他却以为与他毫无关涉。"],[13,"至于献给我的祭物，他们自食其肉，耶和华却不悦纳他们。现在必记念他们的罪孽，追讨他们的罪恶，他们必归回埃及。"],[14,"以色列忘记造他的主，建造宫殿。犹大多造坚固城，我却要降火焚烧他的城邑，烧灭其中的宫殿。”"]]},{"n":9,"v":[[1,"以色列啊，不要像外邦人欢喜快乐，因为你行邪淫离弃你的神，在各谷场上如妓女喜爱赏赐。"],[2,"谷场和酒醡都不够以色列人使用，新酒也必缺乏。"],[3,"他们必不得住耶和华的地；以法莲却要归回埃及，必在亚述吃不洁净的食物。"],[4,"他们必不得向耶和华奠酒；即便奠酒，也不蒙悦纳。他们的祭物，必如居丧者的食物，凡吃的必被玷污；因他们的食物，只为自己的口腹，必不奉入耶和华的殿。"],[5,"在大会的日子，到耶和华的节期，你们怎样行呢？"],[6,"看哪，他们逃避灾难，埃及人必收殓他们的尸首，摩弗人必葬埋他们的骸骨，他们用银子作的美物上必长蒺藜，他们的帐棚中必生荆棘。"],[7,"以色列人必知道降罚的日子临近，报应的时候来到；（民说：作先知的是愚昧，受灵感的是狂妄。）皆因他们多多作孽，大怀怨恨。"],[8,"以法莲曾作我神守望的；至于先知，在他一切的道上作为捕鸟人的网罗，在他神的家中怀怨恨。"],[9,"以法莲深深地败坏，如在基比亚的日子一样。耶和华必记念他们的罪孽，追讨他们的罪恶。"],[10,"主说：“我遇见以色列如葡萄在旷野；我看见你们的列祖如无花果树上春季初熟的果子。他们却来到巴力毗珥专拜那可羞耻的，就成为可憎恶的，与他们所爱的一样。"],[11,"至于以法莲人，他们的荣耀必如鸟飞去，必不生产、不怀胎、不成孕。"],[12,"纵然养大儿女，我却必使他们丧子，甚至不留一个。我离弃他们，他们就有祸了。”"],[13,"我看以法莲如推罗栽于美地。以法莲却要将自己的儿女带出来，交与行杀戮的人。"],[14,"耶和华啊，求你加给他们，加什么呢？要使他们胎堕乳干。"],[15,"耶和华说：“他们一切的恶事都在吉甲，我在那里憎恶他们，因他们所行的恶，我必从我地上赶出他们去，不再怜爱他们；他们的首领都是悖逆的。"],[16,"以法莲受责罚，根本枯干，必不能结果；即或生产，我必杀他们所生的爱子。”"],[17,"我的神必弃绝他们，因为他们不听从他；他们也必飘流在列国中。"]]},{"n":10,"v":[[1,"以色列是茂盛的葡萄树，结果繁多。果子越多，就越增添祭坛；地土越肥美，就越造美丽的柱像。"],[2,"他们心怀二意，现今要定为有罪。耶和华必拆毁他们的祭坛，毁坏他们的柱像。"],[3,"他们必说：“我们没有王，因为我们不敬畏耶和华；王能为我们作什么呢？”"],[4,"他们为立约说谎言，起假誓；因此，灾罚如苦菜滋生在田间的犁沟中。"],[5,"撒玛利亚的居民，必因伯亚文的牛犊惊恐；崇拜牛犊的民和喜爱牛犊的祭司都必因荣耀离开它，为它悲哀。"],[6,"人必将牛犊带到亚述当作礼物，献给耶雷布王。以法莲必蒙羞，以色列必因自己的计谋惭愧。"],[7,"至于撒玛利亚，他的王必灭没，如水面的沫子一样。"],[8,"伯亚文的邱坛，就是以色列取罪的地方，必被毁灭，荆棘和蒺藜必长在他们的祭坛上。他们必对大山说：“遮盖我们！”对小山说：“倒在我们身上！”"],[9,"“以色列啊，你从基比亚的日子以来，时常犯罪。你们的先人曾站在那里，现今住基比亚的人，以为攻击罪孽之辈的战事临不到自己。"],[10,"我必随意惩罚他们。他们为两样的罪所缠，列邦的民必聚集攻击他们。”"],[11,"“以法莲是驯良的母牛犊，喜爱踹谷，我却将轭加在它肥美的颈项上，我要使以法莲拉套（或作“被骑”），犹大必耕田，雅各必耙地。"],[12,"你们要为自己栽种公义，就能收割慈爱。现今正是寻求耶和华的时候，你们要开垦荒地，等他临到，使公义如雨降在你们身上。”"],[13,"“你们耕种的是奸恶，收割的是罪孽，吃的是谎话的果子。因你倚靠自己的行为，仰赖勇士众多。"],[14,"所以在这民中必有哄嚷之声，你一切的保障必被拆毁，就如沙勒幔在争战的日子拆毁伯亚比勒，将其中的母子一同摔死。"],[15,"因他们的大恶，伯特利必使你们遭遇如此。到了黎明，以色列的王必全然灭绝。”"]]},{"n":11,"v":[[1,"“以色列年幼的时候我爱他，就从埃及召出我的儿子来。"],[2,"先知越发招呼他们，他们越发走开，向诸巴力献祭，给雕刻的偶像烧香。"],[3,"我原教导以法莲行走，用膀臂抱着他们，他们却不知道是我医治他们。"],[4,"我用慈绳（“慈”原文作“人的”）爱索牵引他们，我待他们如人放松牛的两腮夹板，把粮食放在他们面前。”"],[5,"“他们必不归回埃及地，亚述人却要作他们的王，因他们不肯归向我。"],[6,"刀剑必临到他们的城邑，毁坏门闩，把人吞灭，都因他们随从自己的计谋。"],[7,"我的民偏要背道离开我，众先知虽然招呼他们归向至上的主，却无人尊崇主。”"],[8,"“以法莲哪，我怎能舍弃你？以色列啊，我怎能弃绝你？我怎能使你如押玛？怎能使你如洗扁？我回心转意，我的怜爱大大发动。"],[9,"我必不发猛烈的怒气，也不再毁灭以法莲，因我是神，并非世人；是你们中间的圣者，我必不在怒中临到你们。”"],[10,"“耶和华必如狮子吼叫，子民必跟随他。他一吼叫，他们就从西方急速而来。"],[11,"他们必如雀鸟从埃及急速而来，又如鸽子从亚述地来到。我必使他们住自己的房屋。这是耶和华说的。”"],[12,"“以法莲用谎话，以色列家用诡计围绕我；犹大却靠神掌权，向圣者有忠心（或作“犹大向神、向诚实的圣者犹疑不定”）。”"]]},{"n":12,"v":[[1,"以法莲吃风，且追赶东风，时常增添虚谎和强暴，与亚述立约，把油送到埃及。"],[2,"耶和华与犹大争辩，必照雅各所行的惩罚他，按他所作的报应他。"],[3,"他在腹中抓住哥哥的脚跟，壮年的时候与神较力；"],[4,"-"],[5,"与天使较力并且得胜，哭泣恳求，在伯特利遇见耶和华；耶和华万军之神在那里晓谕我们以色列人；耶和华是他可记念的名。"],[6,"所以你当归向你的神，谨守仁爱、公平，常常等候你的神。"],[7,"“以法莲是商人，手里有诡诈的天平，爱行欺骗。"],[8,"以法莲说：‘我果然成了富足，得了财宝，我所劳碌得来的，人必不见有什么不义，可算为罪的。’"],[9,"自从你出埃及地以来，我就是耶和华你的神，我必使你再住帐棚，如在大会的日子一样。”"],[10,"“我已晓谕众先知，并且加增默示，藉先知设立比喻。”"],[11,"基列人没有罪孽吗？他们全然是虚假的。人在吉甲献牛犊为祭，他们的祭坛好像田间犁沟中的乱堆。"],[12,"从前雅各逃到亚兰地，以色列为得妻服侍人，为得妻与人放羊。"],[13,"耶和华藉先知领以色列从埃及上来，以色列也藉先知而得保存。"],[14,"以法莲大大惹动主怒，所以他流血的罪，必归在他身上。主必将那因以法莲所受的羞辱归还他。"]]},{"n":13,"v":[[1,"从前以法莲说话，人都战兢，他在以色列中居处高位；但他在侍奉巴力的事上犯罪，就死了。"],[2,"现今他们罪上加罪，用银子为自己铸造偶像，就是照自己的聪明制造，都是匠人的工作。有人论说，献祭的人可以向牛犊亲嘴。"],[3,"因此，他们必如早晨的云雾，又如速散的甘露，像场上的糠秕被狂风吹去，又像烟气腾于窗外。"],[4,"“自从你出埃及地以来，我就是耶和华你的神。在我以外，你不可认识别神；除我以外并没有救主。"],[5,"我曾在旷野干旱之地认识你。"],[6,"这些民照我所赐的食物得了饱足；既得饱足，心就高傲，忘记了我。"],[7,"因此，我向他们如狮子，又如豹伏在道旁。"],[8,"我遇见他们必像丢崽子的母熊，撕裂他们的胸膛（或作“心膜”）。在那里我必像母狮吞吃他们，野兽必撕裂他们。”"],[9,"“以色列啊，你与我反对，就是反对帮助你的，自取败坏。"],[10,"你曾求我说：‘给我立王和首领。’现在你的王在哪里呢？治理你的在哪里呢？让他在你所有的城中拯救你吧！"],[11,"我在怒气中将王赐你，又在烈怒中将王废去。”"],[12,"“以法莲的罪孽包裹，他的罪恶收藏。"],[13,"产妇的疼痛必临到他身上，他是无智慧之子，到了产期不当迟延。"],[14,"我必救赎他们脱离阴间，救赎他们脱离死亡。死亡啊，你的灾害在哪里呢？阴间哪，你的毁灭在哪里呢？在我眼前绝无后悔之事。"],[15,"他在弟兄中虽然茂盛，必有东风刮来，就是耶和华的风从旷野上来。他的泉源必干，他的源头必竭。仇敌必掳掠他所积蓄的一切宝器。"],[16,"撒玛利亚必担当自己的罪，因为悖逆他的神。他必倒在刀下，婴孩必被摔死，孕妇必被剖开。”"]]},{"n":14,"v":[[1,"以色列啊，你要归向耶和华你的神，你是因自己的罪孽跌倒了。"],[2,"当归向耶和华，用言语祷告他说：“求你除净罪孽，悦纳善行；这样，我们就把嘴唇的祭代替牛犊献上。"],[3,"我们不向亚述求救，不骑埃及的马，也不再对我们手所造的说：‘你是我们的神。’因为孤儿在你耶和华那里得蒙怜悯。”"],[4,"“我必医治他们背道的病，甘心爱他们，因为我的怒气向他们转消。"],[5,"我必向以色列如甘露，他必如百合花开放，如黎巴嫩的树木扎根。"],[6,"他的枝条必延长，他的荣华如橄榄树，他的香气如黎巴嫩的香柏树。"],[7,"曾住在他荫下的必归回，发旺如五谷，开花如葡萄树。他的香气如黎巴嫩的酒。"],[8,"以法莲必说：‘我与偶像还有什么关涉呢？’我耶和华回答他，也必顾念他。我如青翠的松树，你的果子从我而得。”"],[9,"谁是智慧人，可以明白这些事；谁是通达人，可以知道这一切。因为耶和华的道是正直的，义人必在其中行走；罪人却在其上跌倒。"]]}]},{"name":"阿摩司书","chapters":[{"n":1,"v":[[1,"当犹大王乌西雅，以色列王约阿施的儿子耶罗波安在位的时候，大地震前二年，提哥亚牧人中的阿摩司得默示论以色列。"],[2,"他说：“耶和华必从锡安吼叫，从耶路撒冷发声；牧人的草场要悲哀，迦密的山顶要枯干。”"],[3,"耶和华如此说：“大马士革三番四次地犯罪，我必不免去他的刑罚；因为他以打粮食的铁器打过基列。"],[4,"我却要降火在哈薛的家中，烧灭便哈达的宫殿。"],[5,"我必折断大马士革的门闩，剪除亚文平原的居民和伯伊甸掌权的。亚兰人必被掳到吉珥。”这是耶和华说的。"],[6,"耶和华如此说：“迦萨三番四次地犯罪，我必不免去他的刑罚；因为他掳掠众民交给以东。"],[7,"我却要降火在迦萨的城内，烧灭其中的宫殿。"],[8,"我必剪除亚实突的居民和亚实基伦掌权的，也必反手攻击以革伦。非利士人所余剩的必都灭亡。”这是主耶和华说的。"],[9,"耶和华如此说：“推罗三番四次地犯罪，我必不免去他的刑罚；因为他将众民交给以东，并不记念弟兄的盟约。"],[10,"我却要降火在推罗的城内，烧灭其中的宫殿。”"],[11,"耶和华如此说：“以东三番四次地犯罪，我必不免去他的刑罚；因为他拿刀追赶兄弟，毫无怜悯，发怒撕裂，永怀忿怒。"],[12,"我却要降火在提幔，烧灭波斯拉的宫殿。”"],[13,"耶和华如此说：“亚扪人三番四次地犯罪，我必不免去他们的刑罚；因为他们剖开基列的孕妇，扩张自己的境界。"],[14,"我却要在争战呐喊的日子，旋风狂暴的时候，点火在拉巴的城内，烧灭其中的宫殿。"],[15,"他们的王和首领必一同被掳去。”这是耶和华说的。"]]},{"n":2,"v":[[1,"耶和华如此说：“摩押三番四次地犯罪，我必不免去他的刑罚；因为他将以东王的骸骨焚烧成灰。"],[2,"我却要降火在摩押，烧灭加略的宫殿。摩押必在哄嚷、呐喊、吹角之中死亡。"],[3,"我必剪除摩押中的审判者，将其中的一切首领和他一同杀戮。”这是耶和华说的。"],[4,"耶和华如此说：“犹大人三番四次地犯罪，我必不免去他们的刑罚；因为他们厌弃耶和华的训诲，不遵守他的律例。他们列祖所随从虚假的偶像，使他们走迷了。"],[5,"我却要降火在犹大，烧灭耶路撒冷的宫殿。”"],[6,"耶和华如此说：“以色列人三番四次地犯罪，我必不免去他们的刑罚；因他们为银子卖了义人，为一双鞋卖了穷人。"],[7,"他们见穷人头上所蒙的灰也都垂涎；阻碍谦卑人的道路；父子同一个女子行淫，亵渎我的圣名。"],[8,"他们在各坛旁铺人所当的衣服，卧在其上，又在他们神的庙中喝受罚之人的酒。"],[9,"“我从以色列人面前除灭亚摩利人。他虽高大如香柏树，坚固如橡树，我却上灭他的果子，下绝他的根本。"],[10,"我也将你们从埃及地领上来，在旷野引导你们四十年，使你们得亚摩利人之地为业。"],[11,"我从你们子弟中兴起先知，又从你们少年人中兴起拿细耳人。以色列人哪，不是这样吗？”这是耶和华说的。"],[12,"“你们却给拿细耳人酒喝，嘱咐先知说：‘不要说预言。’"],[13,"看哪，在你们所住之地，我必压你们，如同装满禾捆的车压物一样。"],[14,"快跑的不能逃脱，有力的不能用力，刚勇的也不能自救，"],[15,"拿弓的不能站立，腿快的不能逃脱，骑马的也不能自救。"],[16,"到那日，勇士中最有胆量的必赤身逃跑。”这是耶和华说的。"]]},{"n":3,"v":[[1,"“以色列人哪，你们全家是我从埃及地领上来的，当听耶和华攻击你们的话。"],[2,"在地上万族中，我只认识你们；因此，我必追讨你们的一切罪孽。”"],[3,"“二人若不同心，岂能同行呢？"],[4,"狮子若非抓食，岂能在林中咆哮呢？少壮狮子若无所得，岂能从洞中发声呢？"],[5,"若没有机槛，雀鸟岂能陷在网罗里呢？网罗若无所得，岂能从地上翻起呢？"],[6,"城中若吹角，百姓岂不惊恐呢？灾祸若临到一城，岂非耶和华所降的吗？"],[7,"主耶和华若不将奥秘指示他的仆人众先知，就一无所行。"],[8,"狮子吼叫，谁不惧怕呢？主耶和华发命，谁能不说预言呢？”"],[9,"“要在亚实突的宫殿中和埃及地的宫殿里传扬说：你们要聚集在撒玛利亚的山上，就看见城中有何等大的扰乱与欺压的事。"],[10,"“那些以强暴抢夺财物、积蓄在自己家中的人，不知道行正直的事。”这是耶和华说的。"],[11,"所以主耶和华如此说：“敌人必来围攻这地，使你的势力衰微，抢掠你的家宅。”"],[12,"耶和华如此说：“牧人怎样从狮子口中抢回两条羊腿或半个耳朵，住撒玛利亚的以色列人躺卧在床角上，或铺绣花毯的榻上，他们得救也不过如此。”"],[13,"主耶和华万军之神说：“当听这话，警戒雅各家。"],[14,"我讨以色列罪的日子，也要讨伯特利祭坛的罪，坛角必被砍下，坠落于地。"],[15,"我要拆毁过冬和过夏的房屋；象牙的房屋也必毁灭，高大的房屋都归无有。”这是耶和华说的。"]]},{"n":4,"v":[[1,"“你们住撒玛利亚山如巴珊母牛的啊，当听我的话！你们欺负贫寒的，压碎穷乏的，对家主说：‘拿酒来，我们喝吧！’"],[2,"主耶和华指着自己的圣洁起誓说：日子快到，人必用钩子将你们钩去，用鱼钩将你们余剩的钩去。"],[3,"你们各人必从破口直往前行，投入哈门。”这是耶和华说的。"],[4,"“以色列人哪，任你们往伯特利去犯罪，到吉甲加增罪过，每日早晨献上你们的祭物，每三日奉上你们的十分之一。"],[5,"任你们献有酵的感谢祭，把甘心祭宣传报告给众人，因为是你们所喜爱的。”这是主耶和华说的。"],[6,"“我使你们在一切城中牙齿干净，在你们各处粮食缺乏，你们仍不归向我。”这是耶和华说的。"],[7,"“在收割的前三月，我使雨停止，不降在你们那里；我降雨在这城，不降雨在那城；这块地有雨，那块地无雨，无雨的就枯干了。"],[8,"这样，两三城的人凑到一城去找水，却喝不足；你们仍不归向我。”这是耶和华说的。"],[9,"“我以旱风、霉烂攻击你们，你们园中许多菜蔬、葡萄树、无花果树、橄榄树都被剪虫所吃；你们仍不归向我。”这是耶和华说的。"],[10,"“我降瘟疫在你们中间，像在埃及一样。用刀杀戮你们的少年人，使你们的马匹被掳掠，营中尸首的臭气扑鼻；你们仍不归向我。”这是耶和华说的。"],[11,"“我倾覆你们中间的城邑，如同我从前倾覆所多玛、蛾摩拉一样，使你们好像从火中抽出来的一根柴，你们仍不归向我。”这是耶和华说的。"],[12,"“以色列啊，我必向你如此行。以色列啊，我既这样行，你当预备迎见你的神。"],[13,"那创山、造风，将心意指示人，使晨光变为幽暗，脚踏在地之高处的，他的名是耶和华万军之神。”"]]},{"n":5,"v":[[1,"以色列家啊，要听我为你们所作的哀歌："],[2,"以色列民（“民”原文作“处女”） 跌倒，不得再起；躺在地上，无人搀扶。"],[3,"主耶和华如此说：“以色列家的城发出一千兵的，只剩一百；发出一百的，只剩十个。”"],[4,"耶和华向以色列家如此说：“你们要寻求我，就必存活。"],[5,"不要往伯特利寻求，不要进入吉甲，不要过到别是巴，因为吉甲必被掳掠，伯特利也必归于无有。”"],[6,"要寻求耶和华，就必存活，免得他在约瑟家像火发出，在伯特利焚烧，无人扑灭。"],[7,"你们这使公平变为茵陈，将公义丢弃于地的，"],[8,"要寻求那造昴星和参星，使死荫变为晨光，使白日变为黑夜，命海水来浇在地上的（耶和华是他的名）。"],[9,"他使力强的忽遭灭亡，以致保障遭遇毁坏。"],[10,"你们怨恨那在城门口责备人的，憎恶那说正直话的；"],[11,"你们践踏贫民，向他们勒索麦子；你们用凿过的石头建造房屋，却不得住在其内；栽种美好的葡萄园，却不得喝所出的酒。"],[12,"我知道你们的罪过何等多，你们的罪恶何等大。你们苦待义人，收受贿赂，在城门口屈枉穷乏人。"],[13,"所以通达人见这样的时势，必静默不言，因为时势真恶。"],[14,"你们要求善，不要求恶，就必存活。这样，耶和华万军之神必照你们所说的，与你们同在。"],[15,"要恶恶好善，在城门口秉公行义，或者耶和华万军之神向约瑟的余民施恩。"],[16,"主耶和华万军之神如此说：“在一切宽阔处必有哀号的声音，在各街市上必有人说：‘哀哉！哀哉！’又必叫农夫来哭号，叫善唱哀歌的来举哀。"],[17,"在各葡萄园，必有哀号的声音，因为我必从你中间经过。”这是耶和华说的。"],[18,"想望耶和华日子来到的有祸了！你们为何想望耶和华的日子呢？那日黑暗没有光明，"],[19,"景况好像人躲避狮子又遇见熊，或是进房屋以手靠墙，就被蛇咬。"],[20,"耶和华的日子，不是黑暗没有光明吗？不是幽暗毫无光辉吗？"],[21,"“我厌恶你们的节期，也不喜悦你们的严肃会。"],[22,"你们虽然向我献燔祭和素祭，我却不悦纳，也不顾你们用肥畜献的平安祭。"],[23,"要使你们歌唱的声音远离我，因为我不听你们弹琴的响声。"],[24,"惟愿公平如大水滚滚，使公义如江河滔滔！"],[25,"“以色列家啊，你们在旷野四十年，岂是将祭物和供物献给我呢？"],[26,"你们抬着为自己所造之摩洛的帐幕和偶像的龛，并你们的神星。"],[27,"所以我要把你们掳到大马士革以外。”这是耶和华名为万军之神说的。"]]},{"n":6,"v":[[1,"国为列国之首，人最著名，且为以色列家所归向，在锡安和撒玛利亚山安逸无虑的有祸了！"],[2,"你们要过到甲尼察看，从那里往大城哈马去，又下到非利士人的迦特，看那些国比你们的国还强吗？境界比你们的境界还宽吗？"],[3,"你们以为降祸的日子还远，坐在位上尽行强暴（或作“行强暴使审判临近”）。"],[4,"你们躺卧在象牙床上，舒身在榻上，吃群中的羊羔、棚里的牛犊。"],[5,"弹琴鼓瑟唱消闲的歌曲，为自己制造乐器，如同大卫所造的。"],[6,"以大碗喝酒，用上等的油抹身，却不为约瑟的苦难担忧。"],[7,"所以这些人必在被掳的人中首先被掳，舒身的人荒宴之乐必消灭了。"],[8,"主耶和华万军之神指着自己起誓说：“我憎恶雅各的荣华，厌弃他的宫殿；因此，我必将城和其中所有的都交付敌人。”"],[9,"那时，若在一房之内剩下十个人，也都必死。"],[10,"死人的伯叔，就是烧他尸首的，要将这尸首搬到房外，问房屋内间的人说：“你那里还有人没有？”他必说：“没有。”又说：“不要作声，因为我们不可提耶和华的名。”"],[11,"看哪，耶和华出令，大房就被攻破，小屋就被打裂。"],[12,"马岂能在崖石上奔跑？人岂能在那里用牛耕种呢？你们却使公平变为苦胆，使公义的果子变为茵陈。"],[13,"你们喜爱虚浮的事，自夸说：“我们不是凭自己的力量取了角吗？”"],[14,"耶和华万军之神说：“以色列家啊，我必兴起一国攻击你们；他们必欺压你们，从哈马口直到亚拉巴的河。”"]]},{"n":7,"v":[[1,"主耶和华指示我一件事：为王割菜之后（“菜”或作“草”），菜又发生，刚发生的时候，主造蝗虫。"],[2,"蝗虫吃尽那地的青物，我就说：“主耶和华啊，求你赦免，因为雅各微弱，他怎能站立得住呢？”"],[3,"耶和华就后悔说：“这灾可以免了。”"],[4,"主耶和华又指示我一件事：他命火来惩罚以色列，火就吞灭深渊，险些将地烧灭。"],[5,"我就说：“主耶和华啊，求你止息，因为雅各微弱，他怎能站立得住呢？”"],[6,"耶和华就后悔说：“这灾也可免了。”"],[7,"他又指示我一件事：有一道墙是按准绳建筑的，主手拿准绳站在其上。"],[8,"耶和华对我说：“阿摩司啊，你看见什么？”我说：“看见准绳。”主说：“我要吊起准绳在我民以色列中，我必不再宽恕他们。"],[9,"以撒的邱坛必然凄凉，以色列的圣所必然荒废。我必兴起，用刀攻击耶罗波安的家。”"],[10,"伯特利的祭司亚玛谢，打发人到以色列王耶罗波安那里，说：“阿摩司在以色列家中图谋背叛你；他所说的一切话，这国担当不起。"],[11,"因为阿摩司如此说：‘耶罗波安必被刀杀，以色列民定被掳去离开本地。’”"],[12,"亚玛谢又对阿摩司说：“你这先见哪，要逃往犹大地去，在那里糊口，在那里说预言，"],[13,"却不要在伯特利再说预言；因为这里有王的圣所，有王的宫殿。”"],[14,"阿摩司对亚玛谢说：“我原不是先知，也不是先知的门徒（原文作“儿子”）；我是牧人，又是修理桑树的。"],[15,"耶和华选召我，使我不跟从羊群，对我说：‘你去向我民以色列说预言。’"],[16,"亚玛谢啊，现在你要听耶和华的话。你说：‘不要向以色列说预言，也不要向以撒家滴下预言。’"],[17,"所以耶和华如此说：‘你的妻子必在城中作妓女，你的儿女必倒在刀下；你的地必有人用绳子量了分取，你自己必死在污秽之地。以色列民定被掳去离开本地。’”"]]},{"n":8,"v":[[1,"主耶和华又指示我一件事：我看见一筐夏天的果子。"],[2,"他说：“阿摩司啊，你看见什么？”我说：“看见一筐夏天的果子。”耶和华说：“我民以色列的结局到了，我必不再宽恕他们。”"],[3,"主耶和华说：“那日，殿中的诗歌变为哀号，必有许多尸首在各处抛弃，无人作声。”"],[4,"你们这些要吞吃穷乏人、使困苦人衰败的，当听我的话。"],[5,"你们说：“月朔几时过去？我们好卖粮；安息日几时过去？我们好摆开麦子；卖出用小升斗，收银用大戥子，用诡诈的天平欺哄人，"],[6,"好用银子买贫寒人，用一双鞋换穷乏人，将坏了的麦子卖给人。”"],[7,"耶和华指着雅各的荣耀起誓说：“他们的一切行为，我必永远不忘。"],[8,"地岂不因这事震动？其上的居民不也悲哀吗？地必全然像尼罗河涨起，如同埃及河涌上落下。”"],[9,"主耶和华说：“到那日，我必使日头在午间落下，使地在白昼黑暗。"],[10,"我必使你们的节期变为悲哀，歌曲变为哀歌。众人腰束麻布，头上光秃，使这场悲哀如丧独生子，至终如痛苦的日子一样。”"],[11,"主耶和华说：“日子将到，我必命饥荒降在地上。人饥饿非因无饼，干渴非因无水，乃因不听耶和华的话。"],[12,"他们必飘流，从这海到那海，从北边到东边，往来奔跑寻求耶和华的话，却寻不着。”"],[13,"“当那日，美貌的处女和少年的男子必因干渴发昏。"],[14,"那指着撒玛利亚牛犊（原文作“罪”）起誓的说：‘但哪，我们指着你那里的活神起誓。’又说：‘我们指着别是巴的神道（“神”原文作“活”）起誓。’这些人都必仆倒，永不再起来。”"]]},{"n":9,"v":[[1,"我看见主站在祭坛旁边，他说：“你要击打柱顶，使门槛震动，打碎柱顶落在众人头上；所剩下的人，我必用刀杀戮，无一人能逃避，无一人能逃脱。"],[2,"他们虽然挖透阴间，我的手必取出他们来；虽然爬上天去，我必拿下他们来；"],[3,"虽然藏在迦密山顶，我必搜寻捉出他们来；虽然从我眼前藏在海底，我必命蛇咬他们；"],[4,"虽被仇敌掳去，我必命刀剑杀戮他们；我必向他们定住眼目，降祸不降福。”"],[5,"主万军之耶和华摸地，地就消化，凡住在地上的都必悲哀。地必全然像尼罗河涨起，如同埃及河落下。"],[6,"那在天上建造楼阁，在地上安定穹苍，命海水浇在地上的，耶和华是他的名。"],[7,"耶和华说：“以色列人哪，我岂不看你们如古实人吗？我岂不是领以色列人出埃及地，领非利士人出迦斐托，领亚兰人出吉珥吗？"],[8,"主耶和华的眼目察看这有罪的国，必将这国从地上灭绝；却不将雅各家灭绝净尽。”这是耶和华说的。"],[9,"“我必出令，将以色列家分散在列国中，好像用筛子筛谷，连一粒也不落在地上。"],[10,"我民中的一切罪人说：‘灾祸必追不上我们，也迎不着我们。’他们必死在刀下。”"],[11,"“到那日，我必建立大卫倒塌的帐幕，堵住其中的破口。把那破坏的建立起来，重新修造，像古时一样，"],[12,"使以色列人得以东所余剩的和所有称为我名下的国。”此乃行这事的耶和华说的。"],[13,"耶和华说：“日子将到，耕种的必接续收割的，踹葡萄的必接续撒种的。大山要滴下甜酒，小山都必流奶（原文作“消化”。见约珥书3章18节）。"],[14,"我必使我民以色列被掳的归回，他们必重修荒废的城邑居住，栽种葡萄园，喝其中所出的酒；修造果木园，吃其中的果子。"],[15,"我要将他们栽于本地，他们不再从我所赐给他们的地上拔出来。”这是耶和华你的神说的。"]]}]},{"name":"约拿书","chapters":[{"n":1,"v":[[1,"耶和华的话临到亚米太的儿子约拿，说："],[2,"“你起来往尼尼微大城去，向其中的居民呼喊，因为他们的恶达到我面前。”"],[3,"约拿却起来逃往他施去躲避耶和华。下到约帕，遇见一只船要往他施去，他就给了船价，上了船，要与船上的人同往他施去躲避耶和华。"],[4,"然而耶和华使海中起大风，海就狂风大作，甚至船几乎破坏。"],[5,"水手便惧怕，各人哀求自己的神。他们将船上的货物抛在海中，为要使船轻些。约拿已下到底舱躺卧沉睡。"],[6,"船主到他那里对他说：“你这沉睡的人哪，为何这样呢？起来，求告你的神，或者神顾念我们，使我们不至灭亡。”"],[7,"船上的人彼此说：“来吧！我们掣签，看看这灾临到我们是因谁的缘故。”于是他们掣签，掣出约拿来。"],[8,"众人对他说：“请你告诉我们，这灾临到我们是因谁的缘故？你以何事为业？你从哪里来？你是哪一国、属哪一族的人？”"],[9,"他说：“我是希伯来人。我敬畏耶和华那创造沧海旱地之天上的神。”"],[10,"他们就大大惧怕，对他说：“你作的是什么事呢？”他们已经知道他躲避耶和华，因为他告诉了他们。"],[11,"他们问他说：“我们当向你怎样行，使海浪平静呢？”这话是因海浪越发翻腾。"],[12,"他对他们说：“你们将我抬起来，抛在海中，海就平静了。我知道你们遭这大风是因我的缘故。”"],[13,"然而那些人竭力荡桨，要把船拢岸，却是不能，因为海浪越发向他们翻腾。"],[14,"他们便求告耶和华说：“耶和华啊，我们恳求你，不要因这人的性命使我们死亡，不要使流无辜血的罪归与我们，因为你耶和华是随自己的意旨行事。”"],[15,"他们遂将约拿抬起，抛在海中，海的狂浪就平息了。"],[16,"那些人便大大敬畏耶和华，向耶和华献祭，并且许愿。"],[17,"耶和华安排一条大鱼吞了约拿，他在鱼腹中三日三夜。"]]},{"n":2,"v":[[1,"约拿在鱼腹中祷告耶和华他的神，"],[2,"说：“我遭遇患难求告耶和华，你就应允我；从阴间的深处呼求，你就俯听我的声音。"],[3,"你将我投下深渊，就是海的深处；大水环绕我，你的波浪洪涛都漫过我身。"],[4,"我说，我从你眼前虽被驱逐，我仍要仰望你的圣殿。"],[5,"诸水环绕我，几乎淹没我；深渊围住我，海草缠绕我的头。"],[6,"我下到山根，地的门将我永远关住。耶和华我的神啊，你却将我的性命从坑中救出来。"],[7,"我心在我里面发昏的时候，我就想念耶和华。我的祷告进入你的圣殿，达到你的面前。"],[8,"那信奉虚无之神的人，离弃怜爱他们的主；"],[9,"但我必用感谢的声音献祭与你。我所许的愿，我必偿还。救恩出于耶和华。”"],[10,"耶和华吩咐鱼，鱼就把约拿吐在旱地上。"]]},{"n":3,"v":[[1,"耶和华的话二次临到约拿说："],[2,"“你起来！往尼尼微大城去，向其中的居民宣告我所吩咐你的话。”"],[3,"约拿便照耶和华的话起来，往尼尼微去。这尼尼微是极大的城，有三日的路程。"],[4,"约拿进城走了一日，宣告说：“再等四十日，尼尼微必倾覆了！”"],[5,"尼尼微人信服神，便宣告禁食，从最大的到至小的都穿麻衣（或作“披上麻布”）。"],[6,"这信息传到尼尼微王的耳中，他就下了宝座，脱下朝服，披上麻布，坐在灰中。"],[7,"他又使人遍告尼尼微通城说：“王和大臣有令，人不可尝什么，牲畜、牛羊不可吃草，也不可喝水。"],[8,"人与牲畜都当披上麻布，人要切切求告神。各人回头离开所行的恶道，丢弃手中的强暴。"],[9,"或者神转意后悔，不发烈怒，使我们不至灭亡，也未可知。”"],[10,"于是神察看他们的行为，见他们离开恶道，他就后悔，不把所说的灾祸降与他们了。"]]},{"n":4,"v":[[1,"这事约拿大大不悦，且甚发怒，"],[2,"就祷告耶和华说：“耶和华啊，我在本国的时候岂不是这样说吗？我知道你是有恩典、有怜悯的神，不轻易发怒，有丰盛的慈爱，并且后悔不降所说的灾，所以我急速逃往他施去。"],[3,"耶和华啊，现在求你取我的命吧！因为我死了比活着还好。”"],[4,"耶和华说：“你这样发怒合乎理吗？”"],[5,"于是约拿出城，坐在城的东边，在那里为自己搭了一座棚，坐在棚的荫下，要看看那城究竟如何。"],[6,"耶和华神安排一棵蓖麻，使其发生高过约拿，影儿遮盖他的头，救他脱离苦楚；约拿因这棵蓖麻大大喜乐。"],[7,"次日黎明，神却安排一条虫子咬这蓖麻，以致枯槁。"],[8,"日头出来的时候，神安排炎热的东风，日头曝晒约拿的头，使他发昏，他就为自己求死，说：“我死了比活着还好。”"],[9,"神对约拿说：“你因这棵蓖麻发怒合乎理吗？”他说：“我发怒以致于死，都合乎理！”"],[10,"耶和华说：“这蓖麻不是你栽种的，也不是你培养的，一夜发生，一夜干死，你尚且爱惜；"],[11,"何况这尼尼微大城，其中不能分辨左手右手的有十二万多人，并有许多牲畜，我岂能不爱惜呢？”"]]}]},{"name":"马太福音","chapters":[{"n":1,"v":[[1,"亚伯拉罕的后裔、大卫的子孙、耶稣基督的家谱（“后裔”、“子孙”原文都作“儿子”。下同）："],[2,"亚伯拉罕生以撒，以撒生雅各，雅各生犹大和他的弟兄；"],[3,"犹大从她玛氏生法勒斯和谢拉，法勒斯生希斯仑，希斯仑生亚兰；"],[4,"亚兰生亚米拿达，亚米拿达生拿顺，拿顺生撒门；"],[5,"撒门从喇合氏生波阿斯，波阿斯从路得氏生俄备得，俄备得生耶西，"],[6,"耶西生大卫王。大卫从乌利亚的妻子生所罗门；"],[7,"所罗门生罗波安，罗波安生亚比雅，亚比雅生亚撒；"],[8,"亚撒生约沙法，约沙法生约兰，约兰生乌西亚；"],[9,"乌西亚生约坦，约坦生亚哈斯，亚哈斯生希西家；"],[10,"希西家生玛拿西，玛拿西生亚们，亚们生约西亚。"],[11,"百姓被迁到巴比伦的时候，约西亚生耶哥尼雅和他的弟兄。"],[12,"迁到巴比伦之后，耶哥尼雅生撒拉铁，撒拉铁生所罗巴伯；"],[13,"所罗巴伯生亚比玉，亚比玉生以利亚敬，以利亚敬生亚所；"],[14,"亚所生撒督，撒督生亚金，亚金生以律；"],[15,"以律生以利亚撒，以利亚撒生马但，马但生雅各；"],[16,"雅各生约瑟，就是马利亚的丈夫。那称为基督的耶稣，是从马利亚生的。"],[17,"这样，从亚伯拉罕到大卫共有十四代，从大卫到迁至巴比伦的时候也有十四代，从迁至巴比伦的时候到基督又有十四代。"],[18,"耶稣基督降生的事记在下面：他母亲马利亚已经许配了约瑟，还没有迎娶，马利亚就从圣灵怀了孕。"],[19,"她丈夫约瑟是个义人，不愿意明明地羞辱她，想要暗暗地把她休了。"],[20,"正思念这事的时候，有主的使者向他梦中显现，说：“大卫的子孙约瑟，不要怕，只管娶过你的妻子马利亚来，因她所怀的孕是从圣灵来的。"],[21,"她将要生一个儿子，你要给他起名叫耶稣，因他要将自己的百姓从罪恶里救出来。”"],[22,"这一切的事成就，是要应验主藉先知所说的话，"],[23,"说：“必有童女怀孕生子，人要称他的名为以马内利。”（“以马内利”翻出来就是“神与我们同在”。）"],[24,"约瑟醒了，起来，就遵着主使者的吩咐，把妻子娶过来，"],[25,"只是没有和她同房，等她生了儿子（有古卷作“等她生了头胎的儿子”），就给他起名叫耶稣。"]]},{"n":2,"v":[[1,"当希律王的时候，耶稣生在犹太的伯利恒。有几个博士从东方来到耶路撒冷，说："],[2,"“那生下来作犹太人之王的在哪里？我们在东方看见他的星，特来拜他。”"],[3,"希律王听见了，就心里不安；耶路撒冷合城的人也都不安。"],[4,"他就召齐了祭司长和民间的文士，问他们说：“基督当生在何处？”"],[5,"他们回答说：“在犹太的伯利恒。因为有先知记着，说："],[6,"‘犹大地的伯利恒啊，你在犹大诸城中并不是最小的，因为将来有一位君王要从你那里出来，牧养我以色列民。’”"],[7,"当下希律暗暗地召了博士来，细问那星是什么时候出现的，"],[8,"就差他们往伯利恒去，说：“你们去仔细寻访那小孩子，寻到了，就来报信，我也好去拜他。”"],[9,"他们听见王的话就去了。在东方所看见的那星，忽然在他们前头行，直行到小孩子的地方，就在上头停住了。"],[10,"他们看见那星，就大大地欢喜。"],[11,"进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子，揭开宝盒，拿黄金、乳香、没药为礼物献给他。"],[12,"博士因为在梦中被主指示不要回去见希律，就从别的路回本地去了。"],[13,"他们去后，有主的使者向约瑟梦中显现，说：“起来！带着小孩子同他母亲逃往埃及，住在那里，等我吩咐你，因为希律必寻找小孩子，要除灭他。”"],[14,"约瑟就起来，夜间带着小孩子和他母亲往埃及去，"],[15,"住在那里，直到希律死了。这是要应验主藉先知所说的话，说：“我从埃及召出我的儿子来。”"],[16,"希律见自己被博士愚弄，就大大发怒，差人将伯利恒城里并四境所有的男孩，照着他向博士仔细查问的时候，凡两岁以里的，都杀尽了。"],[17,"这就应了先知耶利米的话，说："],[18,"“在拉玛听见号啕大哭的声音，是拉结哭她儿女，不肯受安慰，因为他们都不在了。”"],[19,"希律死了以后，有主的使者在埃及向约瑟梦中显现，说："],[20,"“起来！带着小孩子和他母亲往以色列地去，因为要害小孩子性命的人已经死了。”"],[21,"约瑟就起来，把小孩子和他母亲带到以色列地去，"],[22,"只因听见亚基老接着他父亲希律作了犹太王，就怕往那里去，又在梦中被主指示，便往加利利境内去了。"],[23,"到了一座城，名叫拿撒勒，就住在那里。这是要应验先知所说他将称为拿撒勒人的话了。"]]},{"n":3,"v":[[1,"那时，有施洗的约翰出来，在犹太的旷野传道，说："],[2,"“天国近了，你们应当悔改！”"],[3,"这人就是先知以赛亚所说的，他说：“在旷野有人声喊着说：‘预备主的道，修直他的路！’”"],[4,"这约翰身穿骆驼毛的衣服，腰束皮带，吃的是蝗虫、野蜜。"],[5,"那时，耶路撒冷和犹太全地，并约旦河一带地方的人，都出去到约翰那里，"],[6,"承认他们的罪，在约旦河里受他的洗。"],[7,"约翰看见许多法利赛人和撒都该人也来受洗，就对他们说：“毒蛇的种类！谁指示你们逃避将来的忿怒呢？"],[8,"你们要结出果子来，与悔改的心相称。"],[9,"不要自己心里说：‘有亚伯拉罕为我们的祖宗。’我告诉你们：神能从这些石头中给亚伯拉罕兴起子孙来。"],[10,"现在斧子已经放在树根上，凡不结好果子的树，就砍下来丢在火里。"],[11,"我是用水给你们施洗，叫你们悔改；但那在我以后来的，能力比我更大，我就是给他提鞋也不配。他要用圣灵与火给你们施洗。"],[12,"他手里拿着簸箕，要扬净他的场，把麦子收在仓里，把糠用不灭的火烧尽了。”"],[13,"当下，耶稣从加利利来到约旦河，见了约翰，要受他的洗。"],[14,"约翰想要拦住他，说：“我当受你的洗，你反倒上我这里来吗？”"],[15,"耶稣回答说：“你暂且许我，因为我们理当这样尽诸般的义（或作“礼”）。”于是约翰许了他。"],[16,"耶稣受了洗，随即从水里上来。天忽然为他开了，他就看见神的灵彷佛鸽子降下，落在他身上。"],[17,"从天上有声音说：“这是我的爱子，我所喜悦的。”"]]},{"n":4,"v":[[1,"当时，耶稣被圣灵引到旷野，受魔鬼的试探。"],[2,"他禁食四十昼夜，后来就饿了。"],[3,"那试探人的进前来，对他说：“你若是神的儿子，可以吩咐这些石头变成食物。”"],[4,"耶稣却回答说：“经上记着说：‘人活着，不是单靠食物，乃是靠神口里所出的一切话。’”"],[5,"魔鬼就带他进了圣城，叫他站在殿顶上（“顶”原文作“翅”），"],[6,"对他说：“你若是神的儿子，可以跳下去，因为经上记着说：‘主要为你吩咐他的使者用手托着你，免得你的脚碰在石头上。’”"],[7,"耶稣对他说：“经上又记着说：‘不可试探主你的神。’”"],[8,"魔鬼又带他上了一座最高的山，将世上的万国与万国的荣华都指给他看，"],[9,"对他说：“你若俯伏拜我，我就把这一切都赐给你。”"],[10,"耶稣说：“撒但退去吧（“撒但”就是“抵挡”的意思，乃魔鬼的别名）！因为经上记着说：‘当拜主你的神，单要侍奉他。’”"],[11,"于是魔鬼离了耶稣，有天使来伺候他。"],[12,"耶稣听见约翰下了监，就退到加利利去；"],[13,"后又离开拿撒勒，往迦百农去，就住在那里。那地方靠海，在西布伦和拿弗他利的边界上。"],[14,"这是要应验先知以赛亚的话，"],[15,"说：“西布伦地，拿弗他利地，就是沿海的路，约旦河外，外邦人的加利利地。"],[16,"那坐在黑暗里的百姓看见了大光；坐在死荫之地的人有光发现照着他们。”"],[17,"从那时候，耶稣就传起道来，说：“天国近了，你们应当悔改！”"],[18,"耶稣在加利利海边行走，看见弟兄二人，就是那称呼彼得的西门和他兄弟安得烈，在海里撒网。他们本是打鱼的。"],[19,"耶稣对他们说：“来跟从我！我要叫你们得人如得鱼一样。”"],[20,"他们就立刻舍了网，跟从了他。"],[21,"从那里往前走，又看见弟兄二人，就是西庇太的儿子雅各和他兄弟约翰，同他们的父亲西庇太在船上补网，耶稣就招呼他们。"],[22,"他们立刻舍了船，别了父亲，跟从了耶稣。"],[23,"耶稣走遍加利利，在各会堂里教训人，传天国的福音，医治百姓各样的病症。"],[24,"他的名声就传遍了叙利亚。那里的人把一切害病的，就是害各样疾病、各样疼痛的和被鬼附的、癫痫的、瘫痪的，都带了来，耶稣就治好了他们。"],[25,"当下，有许多人从加利利、低加坡里、耶路撒冷、犹太、约旦河外来跟着他。"]]},{"n":5,"v":[[1,"耶稣看见这许多的人，就上了山，既已坐下，门徒到他跟前来。"],[2,"他就开口教训他们，说："],[3,"“虚心的人有福了，因为天国是他们的。"],[4,"哀恸的人有福了，因为他们必得安慰。"],[5,"温柔的人有福了，因为他们必承受地土。"],[6,"饥渴慕义的人有福了，因为他们必得饱足。"],[7,"怜恤人的人有福了，因为他们必蒙怜恤。"],[8,"清心的人有福了，因为他们必得见神。"],[9,"使人和睦的人有福了，因为他们必称为神的儿子。"],[10,"为义受逼迫的人有福了，因为天国是他们的。"],[11,"人若因我辱骂你们，逼迫你们，捏造各样坏话毁谤你们，你们就有福了。"],[12,"应当欢喜快乐，因为你们在天上的赏赐是大的。在你们以前的先知，人也是这样逼迫他们。”"],[13,"“你们是世上的盐。盐若失了味，怎能叫它再咸呢？以后无用，不过丢在外面，被人践踏了。"],[14,"你们是世上的光。城造在山上，是不能隐藏的。"],[15,"人点灯，不放在斗底下，是放在灯台上，就照亮一家的人。"],[16,"你们的光也当这样照在人前，叫他们看见你们的好行为，便将荣耀归给你们在天上的父。”"],[17,"“莫想我来要废掉律法和先知；我来不是要废掉，乃是要成全。"],[18,"我实在告诉你们，就是到天地都废去了，律法的一点一画也不能废去，都要成全。"],[19,"所以，无论何人废掉这诫命中最小的一条，又教训人这样作，他在天国要称为最小的；但无论何人遵行这诫命，又教训人遵行，他在天国要称为大的。"],[20,"我告诉你们：你们的义若不胜于文士和法利赛人的义，断不能进天国。”"],[21,"“你们听见有吩咐古人的话，说：‘不可杀人’，又说：‘凡杀人的，难免受审判。’"],[22,"只是我告诉你们：凡向弟兄动怒的，难免受审判（有古卷在“凡”字下添“无缘无故地”五字）。凡骂弟兄是拉加的，难免公会的审断；凡骂弟兄是魔利的，难免地狱的火。"],[23,"所以，你在祭坛上献礼物的时候，若想起弟兄向你怀怨，"],[24,"就把礼物留在坛前，先去同弟兄和好，然后来献礼物。"],[25,"你同告你的对头还在路上，就赶紧与他和息，恐怕他把你送给审判官，审判官交付衙役，你就下在监里了。"],[26,"我实在告诉你，若有一文钱没有还清，你断不能从那里出来。”"],[27,"“你们听见有话说：‘不可奸淫。’"],[28,"只是我告诉你们：凡看见妇女就动淫念的，这人心里已经与她犯奸淫了。"],[29,"若是你的右眼叫你跌倒，就剜出来丢掉，宁可失去百体中的一体，不叫全身丢在地狱里；"],[30,"若是右手叫你跌倒，就砍下来丢掉，宁可失去百体中的一体，不叫全身下入地狱。”"],[31,"“又有话说：‘人若休妻，就当给她休书。’"],[32,"只是我告诉你们：凡休妻的，若不是为淫乱的缘故，就是叫她作淫妇了。人若娶这被休的妇人，也是犯奸淫了。”"],[33,"“你们又听见有吩咐古人的话，说：‘不可背誓，所起的誓，总要向主谨守。’"],[34,"只是我告诉你们，什么誓都不可起。不可指着天起誓，因为天是神的座位；"],[35,"不可指着地起誓，因为地是他的脚凳；也不可指着耶路撒冷起誓，因为耶路撒冷是大君的京城；"],[36,"又不可指着你的头起誓，因为你不能使一根头发变黑变白了。"],[37,"你们的话，是，就说是；不是，就说不是；若再多说，就是出于那恶者（或作“是从恶里出来的”）。”"],[38,"“你们听见有话说：‘以眼还眼，以牙还牙。’"],[39,"只是我告诉你们：不要与恶人作对。有人打你的右脸，连左脸也转过来由他打；"],[40,"有人想要告你，要拿你的里衣，连外衣也由他拿去；"],[41,"有人强逼你走一里路，你就同他走二里；"],[42,"有求你的，就给他；有向你借贷的，不可推辞。”"],[43,"“你们听见有话说：‘当爱你的邻舍，恨你的仇敌。’"],[44,"只是我告诉你们：要爱你们的仇敌，为那逼迫你们的祷告。"],[45,"这样，就可以作你们天父的儿子。因为他叫日头照好人，也照歹人；降雨给义人，也给不义的人。"],[46,"你们若单爱那爱你们的人，有什么赏赐呢？就是税吏不也是这样行吗？"],[47,"你们若单请你弟兄的安，比人有什么长处呢？就是外邦人不也是这样行吗？"],[48,"所以你们要完全，像你们的天父完全一样。”"]]},{"n":6,"v":[[1,"“你们要小心，不可将善事行在人的面前，故意叫他们看见；若是这样，就不能得你们天父的赏赐了。"],[2,"所以，你施舍的时候，不可在你前面吹号，像那假冒为善的人在会堂里和街道上所行的，故意要得人的荣耀。我实在告诉你们，他们已经得了他们的赏赐。"],[3,"你施舍的时候，不要叫左手知道右手所作的；"],[4,"要叫你施舍的事行在暗中，你父在暗中察看，必然报答你（有古卷作“必在明处报答你”）。”"],[5,"“你们祷告的时候，不可像那假冒为善的人，爱站在会堂里和十字路口上祷告，故意叫人看见。我实在告诉你们，他们已经得了他们的赏赐。"],[6,"你祷告的时候，要进你的内屋，关上门，祷告你在暗中的父，你父在暗中察看，必然报答你。"],[7,"你们祷告，不可像外邦人，用许多重复话，他们以为话多了必蒙垂听。"],[8,"你们不可效法他们，因为你们没有祈求以先，你们所需用的，你们的父早已知道了。”"],[9,"“所以，你们祷告要这样说：‘我们在天上的父，愿人都尊你的名为圣。"],[10,"愿你的国降临。愿你的旨意行在地上，如同行在天上。"],[11,"我们日用的饮食，今日赐给我们。"],[12,"免我们的债，如同我们免了人的债。"],[13,"不叫我们遇见试探。救我们脱离凶恶（或作“脱离恶者”）。因为国度、权柄、荣耀，全是你的，直到永远。阿们（有古卷无“因为”至“阿们”等字）。’”"],[14,"“你们饶恕人的过犯，你们的天父也必饶恕你们的过犯；"],[15,"你们不饶恕人的过犯，你们的天父也必不饶恕你们的过犯。”"],[16,"“你们禁食的时候，不可像那假冒为善的人，脸上带着愁容，因为他们把脸弄得难看，故意叫人看出他们是禁食。我实在告诉你们：他们已经得了他们的赏赐。"],[17,"你禁食的时候，要梳头洗脸，"],[18,"不叫人看出你禁食来，只叫你暗中的父看见。你父在暗中察看，必然报答你。”"],[19,"“不要为自己积攒财宝在地上，地上有虫子咬，能锈坏，也有贼挖窟窿来偷；"],[20,"只要积攒财宝在天上，天上没有虫子咬，不能锈坏，也没有贼挖窟窿来偷。"],[21,"因为你的财宝在哪里，你的心也在那里。”"],[22,"“眼睛就是身上的灯。你的眼睛若了亮，全身就光明；"],[23,"你的眼睛若昏花，全身就黑暗。你里头的光若黑暗了，那黑暗是何等大呢！”"],[24,"“一个人不能侍奉两个主。不是恶这个爱那个，就是重这个轻那个。你们不能又侍奉神，又侍奉玛门（“玛门”是“财利”的意思）。”"],[25,"“所以我告诉你们：不要为生命忧虑吃什么，喝什么，为身体忧虑穿什么。生命不胜于饮食吗？身体不胜于衣裳吗？"],[26,"你们看那天上的飞鸟，也不种，也不收，也不积蓄在仓里，你们的天父尚且养活它。你们不比飞鸟贵重得多吗？"],[27,"你们哪一个能用思虑使寿数多加一刻呢（或作“使身量多加一肘呢”）？"],[28,"何必为衣裳忧虑呢？你想：野地里的百合花怎么长起来；它也不劳苦，也不纺线；"],[29,"然而我告诉你们：就是所罗门极荣华的时候，他所穿戴的还不如这花一朵呢！"],[30,"你们这小信的人哪！野地里的草今天还在，明天就丢在炉里，神还给它这样的妆饰，何况你们呢！"],[31,"所以，不要忧虑说，‘吃什么？喝什么？穿什么？’"],[32,"这都是外邦人所求的。你们需用的这一切东西，你们的天父是知道的。"],[33,"你们要先求他的国和他的义，这些东西都要加给你们了。"],[34,"所以，不要为明天忧虑，因为明天自有明天的忧虑；一天的难处一天当就够了。”"]]},{"n":7,"v":[[1,"“你们不要论断人，免得你们被论断。"],[2,"因为你们怎样论断人，也必怎样被论断；你们用什么量器量给人，也必用什么量器量给你们。"],[3,"为什么看见你弟兄眼中有刺，却不想自己眼中有梁木呢？"],[4,"你自己眼中有梁木，怎能对你弟兄说：‘容我去掉你眼中的刺’呢？"],[5,"你这假冒为善的人！先去掉自己眼中的梁木，然后才能看得清楚，去掉你弟兄眼中的刺。"],[6,"不要把圣物给狗，也不要把你们的珍珠丢在猪前，恐怕它践踏了珍珠，转过来咬你们。”"],[7,"“你们祈求，就给你们；寻找，就寻见；叩门，就给你们开门。"],[8,"因为凡祈求的，就得着；寻找的，就寻见；叩门的，就给他开门。"],[9,"你们中间谁有儿子求饼，反给他石头呢？"],[10,"求鱼，反给他蛇呢？"],[11,"你们虽然不好，尚且知道拿好东西给儿女，何况你们在天上的父，岂不更把好东西给求他的人吗？"],[12,"所以，无论何事，你们愿意人怎样待你们，你们也要怎样待人，因为这就是律法和先知的道理。”"],[13,"“你们要进窄门。因为引到灭亡，那门是宽的，路是大的，进去的人也多；"],[14,"引到永生，那门是窄的，路是小的，找着的人也少。”"],[15,"“你们要防备假先知，他们到你们这里来，外面披着羊皮，里面却是残暴的狼。"],[16,"凭着他们的果子，就可以认出他们来。荆棘上岂能摘葡萄呢？蒺藜里岂能摘无花果呢？"],[17,"这样，凡好树都结好果子；惟独坏树结坏果子。"],[18,"好树不能结坏果子，坏树不能结好果子。"],[19,"凡不结好果子的树，就砍下来丢在火里。"],[20,"所以，凭着他们的果子，就可以认出他们来。”"],[21,"“凡称呼我‘主啊，主啊’的人，不能都进天国；惟独遵行我天父旨意的人，才能进去。"],[22,"当那日，必有许多人对我说：‘主啊，主啊，我们不是奉你的名传道，奉你的名赶鬼，奉你的名行许多异能吗？’"],[23,"我就明明地告诉他们说：‘我从来不认识你们，你们这些作恶的人，离开我去吧！’”"],[24,"所以，凡听见我这话就去行的，好比一个聪明人，把房子盖在磐石上。"],[25,"雨淋，水冲，风吹，撞着那房子，房子总不倒塌，因为根基立在磐石上。"],[26,"凡听见我这话不去行的，好比一个无知的人，把房子盖在沙土上。"],[27,"雨淋，水冲，风吹，撞着那房子，房子就倒塌了，并且倒塌得很大。”"],[28,"耶稣讲完了这些话，众人都希奇他的教训，"],[29,"因为他教训他们，正像有权柄的人，不像他们的文士。"]]},{"n":8,"v":[[1,"耶稣下了山，有许多人跟着他。"],[2,"有一个长大麻风的来拜他，说：“主若肯，必能叫我洁净了。”"],[3,"耶稣伸手摸他说：“我肯，你洁净了吧！”他的大麻风立刻就洁净了。"],[4,"耶稣对他说：“你切不可告诉人，只要去把身体给祭司察看，献上摩西所吩咐的礼物，对众人作证据。”"],[5,"耶稣进了迦百农，有一个百夫长进前来，求他说："],[6,"“主啊，我的仆人害瘫痪病，躺在家里甚是痛苦。”"],[7,"耶稣说：“我去医治他。”"],[8,"百夫长回答说：“主啊，你到我舍下，我不敢当；只要你说一句话，我的仆人就必好了。"],[9,"因为我在人的权下，也有兵在我以下，对这个说，‘去’，他就去；对那个说，‘来’，他就来；对我的仆人说，‘你作这事’，他就去作。”"],[10,"耶稣听见就希奇，对跟从的人说：“我实在告诉你们：这么大的信心，就是在以色列中，我也没有遇见过。"],[11,"我又告诉你们：从东从西，将有许多人来，在天国里与亚伯拉罕、以撒、雅各一同坐席；"],[12,"惟有本国的子民，竟被赶到外边黑暗里去，在那里必要哀哭切齿了。”"],[13,"耶稣对百夫长说：“你回去吧！照你的信心，给你成全了。”那时，他的仆人就好了。"],[14,"耶稣到了彼得家里，见彼得的岳母害热病躺着。"],[15,"耶稣把她的手一摸，热就退了。她就起来服侍耶稣。"],[16,"到了晚上，有人带着许多被鬼附的来到耶稣跟前，他只用一句话，就把鬼都赶出去，并且治好了一切有病的人。"],[17,"这是要应验先知以赛亚的话，说：“他代替我们的软弱，担当我们的疾病。”"],[18,"耶稣见许多人围着他，就吩咐渡到那边去。"],[19,"有一个文士来对他说：“夫子，你无论往哪里去，我要跟从你。”"],[20,"耶稣说：“狐狸有洞，天空的飞鸟有窝，人子却没有枕头的地方。”"],[21,"又有一个门徒对耶稣说：“主啊，容我先回去埋葬我的父亲。”"],[22,"耶稣说：“任凭死人埋葬他们的死人，你跟从我吧！”"],[23,"耶稣上了船，门徒跟着他。"],[24,"海里忽然起了暴风，甚至船被波浪掩盖。耶稣却睡着了。"],[25,"门徒来叫醒了他，说：“主啊，救我们，我们丧命啦！”"],[26,"耶稣说：“你们这小信的人哪，为什么胆怯呢？”于是起来，斥责风和海，风和海就大大地平静了。"],[27,"众人希奇说：“这是怎样的人？连风和海也听从他了？”"],[28,"耶稣既渡到那边去，来到加大拉人的地方，就有两个被鬼附的人从坟茔里出来迎着他，极其凶猛，甚至没有人能从那条路上经过。"],[29,"他们喊着说：“神的儿子，我们与你有什么相干？时候还没有到，你就上这里来叫我们受苦吗？”"],[30,"离他们很远，有一大群猪吃食。"],[31,"鬼就央求耶稣说：“若把我们赶出去，就打发我们进入猪群吧！”"],[32,"耶稣说：“去吧！”鬼就出来，进入猪群。全群忽然闯下山崖，投在海里淹死了。"],[33,"放猪的就逃跑进城，将这一切事和被鬼附的人所遭遇的都告诉人。"],[34,"合城的人都出来迎见耶稣，既见了，就央求他离开他们的境界。"]]},{"n":9,"v":[[1,"耶稣上了船，渡过海，来到自己的城里。"],[2,"有人用褥子抬着一个瘫子到耶稣跟前来。耶稣见他们的信心，就对瘫子说：“小子，放心吧！你的罪赦了。”"],[3,"有几个文士心里说：“这个人说僭妄的话了。”"],[4,"耶稣知道他们的心意，就说：“你们为什么心里怀着恶念呢？"],[5,"或说：‘你的罪赦了’，或说：‘你起来行走’，哪一样容易呢？"],[6,"但要叫你们知道，人子在地上有赦罪的权柄。”就对瘫子说：“起来，拿你的褥子回家去吧！”"],[7,"那人就起来，回家去了。"],[8,"众人看见都惊奇，就归荣耀与神，因为他将这样的权柄赐给人。"],[9,"耶稣从那里往前走，看见一个人名叫马太，坐在税关上，就对他说：“你跟从我来。”他就起来，跟从了耶稣。"],[10,"耶稣在屋里坐席的时候，有好些税吏和罪人来，与耶稣和他的门徒一同坐席。"],[11,"法利赛人看见，就对耶稣的门徒说：“你们的先生为什么和税吏并罪人一同吃饭呢？”"],[12,"耶稣听见，就说：“康健的人用不着医生，有病的人才用得着。"],[13,"经上说：‘我喜爱怜恤，不喜爱祭祀。’这句话的意思，你们且去揣摩。我来本不是召义人，乃是召罪人。”"],[14,"那时，约翰的门徒来见耶稣，说：“我们和法利赛人常常禁食，你的门徒倒不禁食，这是为什么呢？”"],[15,"耶稣对他们说：“新郎和陪伴之人同在的时候，陪伴之人岂能哀恸呢？但日子将到，新郎要离开他们，那时候他们就要禁食。"],[16,"没有人把新布补在旧衣服上，因为所补上的反带坏了那衣服，破的就更大了；"],[17,"也没有人把新酒装在旧皮袋里，若是这样，皮袋就裂开，酒漏出来，连皮袋也坏了。惟独把新酒装在新皮袋里，两样就都保全了。”"],[18,"耶稣说这话的时候，有一个管会堂的来拜他说：“我女儿刚才死了，求你去按手在她身上，她就必活了。”"],[19,"耶稣便起来跟着他去，门徒也跟了去。"],[20,"有一个女人，患了十二年的血漏，来到耶稣背后，摸他的衣裳繸子，"],[21,"因为她心里说：“我只摸他的衣裳，就必痊愈。”"],[22,"耶稣转过来看见她，就说：“女儿，放心！你的信救了你。”从那时候，女人就痊愈了。"],[23,"耶稣到了管会堂的家里，看见有吹手，又有许多人乱嚷，"],[24,"就说：“退去吧！这闺女不是死了，是睡着了。”他们就嗤笑他。"],[25,"众人既被撵出，耶稣就进去，拉着闺女的手，闺女便起来了。"],[26,"于是这风声传遍了那地方。"],[27,"耶稣从那里往前走，有两个瞎子跟着他，喊叫说：“大卫的子孙，可怜我们吧！”"],[28,"耶稣进了房子，瞎子就来到他跟前。耶稣说：“你们信我能作这事吗？”他们说：“主啊，我们信！”"],[29,"耶稣就摸他们的眼睛，说：“照着你们的信给你们成全了吧！”"],[30,"他们的眼睛就开了。耶稣切切地嘱咐他们说：“你们要小心，不可叫人知道。”"],[31,"他们出去，竟把他的名声传遍了那地方。"],[32,"他们出去的时候，有人将鬼所附的一个哑巴带到耶稣跟前来。"],[33,"鬼被赶出去，哑巴就说出话来。众人都希奇说：“在以色列中，从来没有见过这样的事！”"],[34,"法利赛人却说：“他是靠着鬼王赶鬼。”"],[35,"耶稣走遍各城各乡，在会堂里教训人，宣讲天国的福音，又医治各样的病症。"],[36,"他看见许多的人，就怜悯他们，因为他们困苦流离，如同羊没有牧人一般。"],[37,"于是对门徒说：“要收的庄稼多，作工的人少。"],[38,"所以，你们当求庄稼的主，打发工人出去收他的庄稼。”"]]},{"n":10,"v":[[1,"耶稣叫了十二个门徒来，给他们权柄，能赶逐污鬼，并医治各样的病症。"],[2,"这十二使徒的名：头一个叫西门，又称彼得，还有他兄弟安得烈，西庇太的儿子雅各和雅各的兄弟约翰，"],[3,"腓力和巴多罗买，多马和税吏马太，亚勒腓的儿子雅各和达太，"],[4,"奋锐党的西门，还有卖耶稣的加略人犹大。"],[5,"耶稣差这十二个人去，吩咐他们说：“外邦人的路，你们不要走；撒玛利亚人的城，你们不要进。"],[6,"宁可往以色列家迷失的羊那里去。"],[7,"随走随传，说：‘天国近了！’"],[8,"医治病人，叫死人复活，叫长大麻风的洁净，把鬼赶出去。你们白白地得来，也要白白地舍去。"],[9,"腰袋里不要带金银铜钱。"],[10,"行路不要带口袋，不要带两件褂子，也不要带鞋和拐杖，因为工人得饮食是应当的。"],[11,"你们无论进哪一城，哪一村，要打听那里谁是好人，就住在他家，直住到走的时候。"],[12,"进他家里去，要请他的安。"],[13,"那家若配得平安，你们所求的平安就必临到那家；若不配得，你们所求的平安仍归你们。"],[14,"凡不接待你们、不听你们话的人，你们离开那家或是那城的时候，就把脚上的尘土跺下去。"],[15,"我实在告诉你们，当审判的日子，所多玛和蛾摩拉所受的，比那城还容易受呢！”"],[16,"“我差你们去，如同羊进入狼群，所以你们要灵巧像蛇，驯良像鸽子。"],[17,"你们要防备人，因为他们要把你们交给公会，也要在会堂里鞭打你们；"],[18,"并且你们要为我的缘故被送到诸侯君王面前，对他们和外邦人作见证。"],[19,"你们被交的时候，不要思虑怎样说话，或说什么话。到那时候，必赐给你们当说的话，"],[20,"因为不是你们自己说的，乃是你们父的灵在你们里头说的。"],[21,"弟兄要把弟兄，父亲要把儿子，送到死地；儿女要与父母为敌，害死他们。"],[22,"并且你们要为我的名被众人恨恶，惟有忍耐到底的必然得救。"],[23,"有人在这城里逼迫你们，就逃到那城里去。我实在告诉你们，以色列的城邑你们还没有走遍，人子就到了。"],[24,"学生不能高过先生，仆人不能高过主人。"],[25,"学生和先生一样，仆人和主人一样，也就罢了。人既骂家主是别西卜（“别西卜”是鬼王的名），何况他的家人呢？”"],[26,"“所以，不要怕他们。因为掩盖的事，没有不露出来的；隐藏的事，没有不被人知道的。"],[27,"我在暗中告诉你们的，你们要在明处说出来；你们耳中所听的，要在房上宣扬出来。"],[28,"那杀身体不能杀灵魂的，不要怕他们；惟有能把身体和灵魂都灭在地狱里的，正要怕他。"],[29,"两个麻雀不是卖一分银子吗？若是你们的父不许，一个也不能掉在地上。"],[30,"就是你们的头发也都被数过了。"],[31,"所以，不要惧怕，你们比许多麻雀还贵重。”"],[32,"“凡在人面前认我的，我在我天上的父面前也必认他；"],[33,"凡在人面前不认我的，我在我天上的父面前也必不认他。”"],[34,"“你们不要想，我来是叫地上太平；我来并不是叫地上太平，乃是叫地上动刀兵。"],[35,"因为我来是叫人与父亲生疏，女儿与母亲生疏，媳妇与婆婆生疏。"],[36,"人的仇敌就是自己家里的人。"],[37,"爱父母过于爱我的，不配作我的门徒；爱儿女过于爱我的，不配作我的门徒；"],[38,"不背着他的十字架跟从我的，也不配作我的门徒。"],[39,"得着生命的，将要失丧生命；为我失丧生命的，将要得着生命。”"],[40,"“人接待你们，就是接待我；接待我，就是接待那差我来的。"],[41,"人因为先知的名接待先知，必得先知所得的赏赐；人因为义人的名接待义人，必得义人所得的赏赐。"],[42,"无论何人，因为门徒的名，只把一杯凉水给这小子里的一个喝，我实在告诉你们，这人不能不得赏赐。”"]]},{"n":11,"v":[[1,"耶稣吩咐完了十二个门徒，就离开那里，往各城去传道教训人。"],[2,"约翰在监里听见基督所作的事，就打发两个门徒去，"],[3,"问他说：“那将要来的是你吗？还是我们等候别人呢？”"],[4,"耶稣回答说：“你们去，把所听见、所看见的事告诉约翰。"],[5,"就是瞎子看见，瘸子行走，长大麻风的洁净，聋子听见，死人复活，穷人有福音传给他们。"],[6,"凡不因我跌倒的就有福了。”"],[7,"他们走的时候，耶稣就对众人讲论约翰说：“你们从前出到旷野是要看什么呢？要看风吹动的芦苇吗？"],[8,"你们出去到底是要看什么？要看穿细软衣服的人吗？那穿细软衣服的人是在王宫里。"],[9,"你们出去究竟是为什么？是要看先知吗？我告诉你们：是的，他比先知大多了。"],[10,"经上记着说：‘我要差遣我的使者在你前面预备道路。’所说的就是这个人。"],[11,"我实在告诉你们：凡妇人所生的，没有一个兴起来大过施洗约翰的；然而天国里最小的比他还大。"],[12,"从施洗约翰的时候到如今，天国是努力进入的，努力的人就得着了。"],[13,"因为众先知和律法说预言，到约翰为止。"],[14,"你们若肯领受，这人就是那应当来的以利亚。"],[15,"有耳可听的，就应当听。"],[16,"我可用什么比这世代呢？好像孩童坐在街市上招呼同伴，说："],[17,"‘我们向你们吹笛，你们不跳舞；我们向你们举哀，你们不捶胸。’"],[18,"约翰来了，也不吃，也不喝，人就说他是被鬼附着的；"],[19,"人子来了，也吃也喝，人又说他是贪食好酒的人，是税吏和罪人的朋友。但智慧之子，总以智慧为是（有古卷作“但智慧在行为上就显为是”）。”"],[20,"耶稣在诸城中行了许多异能，那些城的人终不悔改，就在那时候责备他们说："],[21,"“哥拉汛哪，你有祸了！伯赛大啊，你有祸了！因为在你们中间所行的异能，若行在推罗、西顿，他们早已披麻蒙灰悔改了。"],[22,"但我告诉你们，当审判的日子，推罗、西顿所受的比你们还容易受呢！"],[23,"迦百农啊，你已经升到天上（或作“你将要升到天上吗？”），将来必坠落阴间，因为在你那里所行的异能，若行在所多玛，它还可以存到今日。"],[24,"但我告诉你们：当审判的日子，所多玛所受的比你还容易受呢！”"],[25,"那时，耶稣说：“父啊，天地的主，我感谢你！因为你将这些事向聪明通达人就藏起来，向婴孩就显出来。"],[26,"父啊，是的，因为你的美意本是如此。"],[27,"一切所有的，都是我父交付我的。除了父，没有人知道子；除了子和子所愿意指示的，没有人知道父。"],[28,"凡劳苦担重担的人，可以到我这里来，我就使你们得安息。"],[29,"我心里柔和谦卑，你们当负我的轭，学我的样式，这样，你们心里就必得享安息。"],[30,"因为我的轭是容易的，我的担子是轻省的。”"]]},{"n":12,"v":[[1,"那时，耶稣在安息日从麦地经过。他的门徒饿了，就掐起麦穗来吃。"],[2,"法利赛人看见，就对耶稣说：“看哪，你的门徒作安息日不可作的事了。”"],[3,"耶稣对他们说：“经上记着大卫和跟从他的人饥饿之时所作的事，你们没有念过吗？"],[4,"他怎么进了神的殿，吃了陈设饼，这饼不是他和跟从他的人可以吃得，惟独祭司才可以吃。"],[5,"再者，律法上所记的，当安息日祭司在殿里犯了安息日，还是没有罪，你们没有念过吗？"],[6,"但我告诉你们：在这里有一人比殿更大。"],[7,"‘我喜爱怜恤，不喜爱祭祀。’你们若明白这话的意思，就不将无罪的当作有罪的了。"],[8,"因为人子是安息日的主。”"],[9,"耶稣离开那地方，进了一个会堂。"],[10,"那里有一个人枯干了一只手。有人问耶稣说：“安息日治病，可以不可以？”意思是要控告他。"],[11,"耶稣说：“你们中间谁有一只羊，当安息日掉在坑里，不把它抓住拉上来呢？"],[12,"人比羊何等贵重呢！所以，在安息日作善事是可以的。”"],[13,"于是对那人说：“伸出手来！”他把手一伸，手就复了原，和那只手一样。"],[14,"法利赛人出去，商议怎样可以除灭耶稣。"],[15,"耶稣知道了，就离开那里。有许多人跟着他，他把其中有病的人都治好了，"],[16,"又嘱咐他们，不要给他传名。"],[17,"这是要应验先知以赛亚的话，说："],[18,"“看哪，我的仆人，我所拣选、所亲爱、心里所喜悦的，我要将我的灵赐给他，他必将公理传给外邦。"],[19,"他不争竞，不喧嚷，街上也没有人听见他的声音。"],[20,"压伤的芦苇他不折断，将残的灯火他不吹灭。等他施行公理，叫公理得胜，"],[21,"外邦人都要仰望他的名。”"],[22,"当下，有人将一个被鬼附着，又瞎又哑的人，带到耶稣那里，耶稣就医治他，甚至那哑巴又能说话，又能看见。"],[23,"众人都惊奇，说：“这不是大卫的子孙吗？”"],[24,"但法利赛人听见，就说：“这个人赶鬼，无非是靠着鬼王别西卜啊！”"],[25,"耶稣知道他们的意念，就对他们说：“凡一国自相纷争，就成为荒场；一城一家自相纷争，必站立不住；"],[26,"若撒但赶逐撒但，就是自相纷争，他的国怎能站得住呢？"],[27,"我若靠着别西卜赶鬼，你们的子弟赶鬼又靠着谁呢？这样，他们就要断定你们的是非。"],[28,"我若靠着神的灵赶鬼，这就是神的国临到你们了。"],[29,"人怎能进壮士家里，抢夺他的家具呢？除非先捆住那壮士，才可以抢夺他的家财。"],[30,"不与我相合的，就是敌我的；不同我收聚的，就是分散的。"],[31,"所以我告诉你们：人一切的罪和亵渎的话，都可得赦免；惟独亵渎圣灵，总不得赦免。"],[32,"凡说话干犯人子的，还可得赦免；惟独说话干犯圣灵的，今世、来世总不得赦免。”"],[33,"“你们或以为树好，果子也好；树坏，果子也坏。因为看果子就可以知道树。"],[34,"毒蛇的种类！你们既是恶人，怎能说出好话来呢？因为心里所充满的，口里就说出来。"],[35,"善人从他心里所存的善就发出善来；恶人从他心里所存的恶就发出恶来。"],[36,"我又告诉你们：凡人所说的闲话，当审判的日子，必要句句供出来。"],[37,"因为要凭你的话定你为义，也要凭你的话定你有罪。”"],[38,"当时，有几个文士和法利赛人对耶稣说：“夫子，我们愿意你显个神迹给我们看。”"],[39,"耶稣回答说：“一个邪恶、淫乱的世代求看神迹，除了先知约拿的神迹以外，再没有神迹给他们看。"],[40,"约拿三日三夜在大鱼肚腹中，人子也要这样三日三夜在地里头。"],[41,"当审判的时候，尼尼微人要起来定这世代的罪，因为尼尼微人听了约拿所传的，就悔改了。看哪，在这里有一人比约拿更大。"],[42,"当审判的时候，南方的女王要起来定这世代的罪，因为她从地极而来，要听所罗门的智慧话。看哪，在这里有一人比所罗门更大。”"],[43,"“污鬼离了人身，就在无水之地过来过去，寻求安歇之处，却寻不着。"],[44,"于是说：‘我要回到我所出来的屋里去。’到了，就看见里面空闲，打扫干净，修饰好了，"],[45,"便去另带了七个比自己更恶的鬼来，都进去住在那里。那人末后的景况比先前更不好了。这邪恶的世代也要如此。”"],[46,"耶稣还对众人说话的时候，不料，他母亲和他弟兄站在外边，要与他说话。"],[47,"有人告诉他说：“看哪，你母亲和你弟兄站在外边，要与你说话。”"],[48,"他却回答那人说：“谁是我的母亲？谁是我的弟兄？”"],[49,"就伸手指着门徒说：“看哪，我的母亲，我的弟兄。"],[50,"凡遵行我天父旨意的人，就是我的弟兄、姐妹和母亲了。”"]]},{"n":13,"v":[[1,"当那一天，耶稣从房子里出来，坐在海边。"],[2,"有许多人到他那里聚集，他只得上船坐下，众人都站在岸上。"],[3,"他用比喻对他们讲许多道理，说：“有一个撒种的出去撒种。"],[4,"撒的时候，有落在路旁的，飞鸟来吃尽了；"],[5,"有落在土浅石头地上的，土既不深，发苗最快，"],[6,"日头出来一晒，因为没有根，就枯干了；"],[7,"有落在荆棘里的，荆棘长起来，把它挤住了；"],[8,"又有落在好土里的，就结实，有一百倍的，有六十倍的，有三十倍的。"],[9,"有耳可听的，就应当听。”"],[10,"门徒进前来，问耶稣说：“对众人讲话为什么用比喻呢？”"],[11,"耶稣回答说：“因为天国的奥秘，只叫你们知道，不叫他们知道。"],[12,"凡有的，还要加给他，叫他有余；凡没有的，连他所有的也要夺去。"],[13,"所以我用比喻对他们讲，是因他们看也看不见，听也听不见，也不明白。"],[14,"在他们身上，正应了以赛亚的预言，说：‘你们听是要听见，却不明白；看是要看见，却不晓得。"],[15,"因为这百姓油蒙了心，耳朵发沉，眼睛闭着；恐怕眼睛看见，耳朵听见，心里明白，回转过来，我就医治他们。’"],[16,"但你们的眼睛是有福的，因为看见了；你们的耳朵也是有福的，因为听见了。"],[17,"我实在告诉你们：从前有许多先知和义人要看你们所看的，却没有看见；要听你们所听的，却没有听见。”"],[18,"“所以，你们当听这撒种的比喻。"],[19,"凡听见天国道理不明白的，那恶者就来，把所撒在他心里的夺了去，这就是撒在路旁的了；"],[20,"撒在石头地上的，就是人听了道，当下欢喜领受，"],[21,"只因心里没有根，不过是暂时的，及至为道遭了患难，或是受了逼迫，立刻就跌倒了；"],[22,"撒在荆棘里的，就是人听了道，后来有世上的思虑，钱财的迷惑，把道挤住了，不能结实；"],[23,"撒在好地上的，就是人听道明白了，后来结实，有一百倍的，有六十倍的，有三十倍的。”"],[24,"耶稣又设个比喻对他们说：“天国好像人撒好种在田里，"],[25,"及至人睡觉的时候，有仇敌来，将稗子撒在麦子里就走了。"],[26,"到长苗吐穗的时候，稗子也显出来。"],[27,"田主的仆人来告诉他说：‘主啊，你不是撒好种在田里吗？从哪里来的稗子呢？’"],[28,"主人说：‘这是仇敌作的。’仆人说：‘你要我们去薅出来吗？’"],[29,"主人说：‘不必，恐怕薅稗子，连麦子也拔出来。"],[30,"容这两样一齐长，等着收割。当收割的时候，我要对收割的人说：先将稗子薅出来，捆成捆，留着烧，惟有麦子要收在仓里。’”"],[31,"他又设个比喻对他们说：“天国好像一粒芥菜种，有人拿去种在田里。"],[32,"这原是百种里最小的，等到长起来，却比各样的菜都大，且成了树，天上的飞鸟来宿在它的枝上。”"],[33,"他又对他们讲个比喻说：“天国好像面酵，有妇人拿来，藏在三斗面里，直等全团都发起来。”"],[34,"这都是耶稣用比喻对众人说的话；若不用比喻，就不对他们说什么。"],[35,"这是要应验先知的话，说：“我要开口用比喻，把创世以来所隐藏的事发明出来。”"],[36,"当下耶稣离开众人，进了房子。他的门徒进前来，说：“请把田间稗子的比喻讲给我们听。”"],[37,"他回答说：“那撒好种的就是人子，"],[38,"田地就是世界，好种就是天国之子，稗子就是那恶者之子，"],[39,"撒稗子的仇敌就是魔鬼，收割的时候就是世界的末了，收割的人就是天使。"],[40,"将稗子薅出来用火焚烧，世界的末了也要如此。"],[41,"人子要差遣使者，把一切叫人跌倒的和作恶的，从他国里挑出来，"],[42,"丢在火炉里，在那里必要哀哭切齿了。"],[43,"那时，义人在他们父的国里，要发出光来，像太阳一样。有耳可听的，就应当听。”"],[44,"“天国好像宝贝藏在地里，人遇见了就把它藏起来，欢欢喜喜地去变卖一切所有的，买这块地。”"],[45,"“天国又好像买卖人寻找好珠子，"],[46,"遇见一颗重价的珠子，就去变卖他一切所有的，买了这颗珠子。”"],[47,"“天国又好像网撒在海里，聚拢各样水族。"],[48,"网既满了，人就拉上岸来；坐下，拣好的收在器具里，将不好的丢弃了。"],[49,"世界的末了也要这样。天使要出来，从义人中把恶人分别出来，"],[50,"丢在火炉里，在那里必要哀哭切齿了。”"],[51,"耶稣说：“这一切的话你们都明白了吗？”他们说：“我们明白了。”"],[52,"他说：“凡文士受教作天国的门徒，就像一个家主从他库里拿出新旧的东西来。”"],[53,"耶稣说完了这些比喻，就离开那里，"],[54,"来到自己的家乡，在会堂里教训人，甚至他们都希奇，说：“这人从哪里有这等智慧和异能呢？"],[55,"这不是木匠的儿子吗？他母亲不是叫马利亚吗？他弟兄们不是叫雅各、约西（有古卷作“约瑟”）、西门、犹大吗？"],[56,"他妹妹们不是都在我们这里吗？这人从哪里有这一切的事呢？”"],[57,"他们就厌弃他（“厌弃他”原文作“因他跌倒”）。耶稣对他们说：“大凡先知，除了本地本家之外，没有不被人尊敬的。”"],[58,"耶稣因为他们不信，就在那里不多行异能了。"]]},{"n":14,"v":[[1,"那时，分封的王希律听见耶稣的名声，"],[2,"就对臣仆说：“这是施洗的约翰从死里复活，所以这些异能从他里面发出来。”"],[3,"起先希律为他兄弟腓力的妻子希罗底的缘故，把约翰拿住锁在监里。"],[4,"因为约翰曾对他说：“你娶这妇人是不合理的。”"],[5,"希律就想要杀他，只是怕百姓，因为他们以约翰为先知。"],[6,"到了希律的生日，希罗底的女儿在众人面前跳舞，使希律欢喜。"],[7,"希律就起誓，应许随她所求的给她。"],[8,"女儿被母亲所使，就说：“请把施洗约翰的头放在盘子里，拿来给我。”"],[9,"王便忧愁，但因他所起的誓，又因同席的人，就吩咐给她。"],[10,"于是打发人去，在监里斩了约翰，"],[11,"把头放在盘子里，拿来给了女子，女子拿去给她母亲。"],[12,"约翰的门徒来，把尸首领去埋葬了，就去告诉耶稣。"],[13,"耶稣听见了，就上船从那里独自退到野地里去。众人听见，就从各城里步行跟随他。"],[14,"耶稣出来，见有许多的人，就怜悯他们，治好了他们的病人。"],[15,"天将晚的时候，门徒进前来说：“这是野地，时候已经过了，请叫众人散开，他们好往村子里去，自己买吃的。”"],[16,"耶稣说：“不用他们去，你们给他们吃吧！”"],[17,"门徒说：“我们这里只有五个饼、两条鱼。”"],[18,"耶稣说：“拿过来给我。”"],[19,"于是吩咐众人坐在草地上，就拿着这五个饼、两条鱼，望着天祝福，擘开饼，递给门徒，门徒又递给众人。"],[20,"他们都吃，并且吃饱了，把剩下的零碎收拾起来，装满了十二个篮子。"],[21,"吃的人，除了妇女孩子，约有五千。"],[22,"耶稣随即催门徒上船，先渡到那边去，等他叫众人散开。"],[23,"散了众人以后，他就独自上山去祷告。到了晚上，只有他一人在那里。"],[24,"那时，船在海中，因风不顺，被浪摇撼。"],[25,"夜里四更天，耶稣在海面上走，往门徒那里去。"],[26,"门徒看见他在海面上走，就惊慌了，说：“是个鬼怪。”便害怕，喊叫起来。"],[27,"耶稣连忙对他们说：“你们放心，是我，不要怕！”"],[28,"彼得说：“主，如果是你，请叫我从水面上走到你那里去。”"],[29,"耶稣说：“你来吧！”彼得就从船上下去，在水面上走，要到耶稣那里去，"],[30,"只因见风甚大，就害怕，将要沉下去，便喊着说：“主啊，救我！”"],[31,"耶稣赶紧伸手拉住他，说：“你这小信的人哪，为什么疑惑呢？”"],[32,"他们上了船，风就住了。"],[33,"在船上的人都拜他，说：“你真是神的儿子了。”"],[34,"他们过了海，来到革尼撒勒地方。"],[35,"那里的人一认出是耶稣，就打发人到周围地方去，把所有的病人带到他那里，"],[36,"只求耶稣准他们摸他的衣裳繸子，摸着的人就都好了。"]]},{"n":15,"v":[[1,"那时，有法利赛人和文士从耶路撒冷来见耶稣，说："],[2,"“你的门徒为什么犯古人的遗传呢？因为吃饭的时候，他们不洗手。”"],[3,"耶稣回答说：“你们为什么因着你们的遗传，犯神的诫命呢？"],[4,"神说：‘当孝敬父母’，又说：‘咒骂父母的，必治死他。’"],[5,"你们倒说：‘无论何人对父母说，我所当奉给你的，已经作了供献，"],[6,"他就可以不孝敬父母。’这就是你们藉着遗传，废了神的诫命。"],[7,"假冒为善的人哪！以赛亚指着你们说的预言是不错的。他说："],[8,"‘这百姓用嘴唇尊敬我，心却远离我，"],[9,"他们将人的吩咐当作道理教导人，所以拜我也是枉然。’”"],[10,"耶稣就叫了众人来，对他们说：“你们要听，也要明白。"],[11,"入口的不能污秽人，出口的乃能污秽人。”"],[12,"当时，门徒进前来对他说：“法利赛人听见这话不服（“不服”原文作“跌倒”），你知道吗？”"],[13,"耶稣回答说：“凡栽种的物，若不是我天父栽种的，必要拔出来。"],[14,"任凭他们吧！他们是瞎眼领路的，若是瞎子领瞎子，两个人都要掉在坑里。”"],[15,"彼得对耶稣说：“请将这比喻讲给我们听。”"],[16,"耶稣说：“你们到如今还不明白吗？"],[17,"岂不知凡入口的，是运到肚子里，又落在茅厕里吗？"],[18,"惟独出口的，是从心里发出来的，这才污秽人。"],[19,"因为从心里发出来的，有恶念、凶杀、奸淫、苟合、偷盗、妄证、谤讟，"],[20,"这都是污秽人的。至于不洗手吃饭，那却不污秽人。”"],[21,"耶稣离开那里，退到推罗、西顿的境内去。"],[22,"有一个迦南妇人从那地方出来，喊着说：“主啊，大卫的子孙，可怜我！我女儿被鬼附得甚苦。”"],[23,"耶稣却一言不答。门徒进前来，求他说：“这妇人在我们后头喊叫。请打发她走吧！”"],[24,"耶稣说：“我奉差遣，不过是到以色列家迷失的羊那里去。”"],[25,"那妇人来拜他，说：“主啊，帮助我！”"],[26,"他回答说：“不好拿儿女的饼丢给狗吃。”"],[27,"妇人说：“主啊，不错，但是狗也吃它主人桌子上掉下来的碎渣儿。”"],[28,"耶稣说：“妇人，你的信心是大的，照你所要的，给你成全了吧！”从那时候，她女儿就好了。"],[29,"耶稣离开那地方，来到靠近加利利的海边，就上山坐下。"],[30,"有许多人到他那里，带着瘸子、瞎子、哑巴、有残疾的和好些别的病人，都放在他脚前。他就治好了他们。"],[31,"甚至众人都希奇，因为看见哑巴说话，残疾的痊愈，瘸子行走，瞎子看见，他们就归荣耀给以色列的神。"],[32,"耶稣叫门徒来，说：“我怜悯这众人，因为他们同我在这里已经三天，也没有吃的了。我不愿意叫他们饿着回去，恐怕在路上困乏。”"],[33,"门徒说：“我们在这野地，哪里有这么多的饼叫这许多人吃饱呢？”"],[34,"耶稣说：“你们有多少饼？”他们说：“有七个，还有几条小鱼。”"],[35,"他就吩咐众人坐在地上，"],[36,"拿着这七个饼和几条鱼，祝谢了，擘开，递给门徒，门徒又递给众人。"],[37,"众人都吃，并且吃饱了，收拾剩下的零碎，装满了七个筐子。"],[38,"吃的人，除了妇女孩子，共有四千。"],[39,"耶稣叫众人散去，就上船，来到马加丹的境界。"]]},{"n":16,"v":[[1,"法利赛人和撒都该人来试探耶稣，请他从天上显个神迹给他们看。"],[2,"耶稣回答说：“晚上天发红，你们就说，‘天必要晴’；"],[3,"早晨天发红，又发黑，你们就说，‘今日必有风雨’。你们知道分辨天上的气色，倒不能分辨这时候的神迹。"],[4,"一个邪恶淫乱的世代求神迹，除了约拿的神迹以外，再没有神迹给他看。”耶稣就离开他们去了。"],[5,"门徒渡到那边去，忘了带饼。"],[6,"耶稣对他们说：“你们要谨慎，防备法利赛人和撒都该人的酵。”"],[7,"门徒彼此议论说：“这是因为我们没有带饼吧！”"],[8,"耶稣看出来，就说：“你们这小信的人，为什么因为没有饼彼此议论呢？"],[9,"你们还不明白吗？不记得那五个饼分给五千人，又收拾了多少篮子的零碎吗？"],[10,"也不记得那七个饼分给四千人，又收拾了多少筐子的零碎吗？"],[11,"我对你们说：‘要防备法利赛人和撒都该人的酵’，这话不是指着饼说的，你们怎么不明白呢？”"],[12,"门徒这才晓得他说的，不是叫他们防备饼的酵，乃是防备法利赛人和撒都该人的教训。"],[13,"耶稣到了凯撒利亚腓立比的境内，就问门徒说：“人说我人子是谁（有古卷无“我”字）？”"],[14,"他们说：“有人说是施洗的约翰，有人说是以利亚，又有人说是耶利米或是先知里的一位。”"],[15,"耶稣说：“你们说我是谁？”"],[16,"西门彼得回答说：“你是基督，是永生神的儿子。”"],[17,"耶稣对他说：“西门巴约拿，你是有福的！因为这不是属血肉的指示你的，乃是我在天上的父指示的。"],[18,"我还告诉你：你是彼得，我要把我的教会建造在这磐石上，阴间的权柄不能胜过他（“权柄”原文作“门”）。"],[19,"我要把天国的钥匙给你，凡你在地上所捆绑的，在天上也要捆绑；凡你在地上所释放的，在天上也要释放。”"],[20,"当下，耶稣嘱咐门徒，不可对人说他是基督。"],[21,"从此，耶稣才指示门徒，他必须上耶路撒冷去，受长老、祭司长、文士许多的苦，并且被杀，第三日复活。"],[22,"彼得就拉着他，劝他说：“主啊，万不可如此！这事必不临到你身上。”"],[23,"耶稣转过来，对彼得说：“撒但，退我后边去吧！你是绊我脚的，因为你不体贴神的意思，只体贴人的意思。”"],[24,"于是，耶稣对门徒说：“若有人要跟从我，就当舍己，背起他的十字架，来跟从我。"],[25,"因为凡要救自己生命的（“生命”或作“灵魂”。下同），必丧掉生命；凡为我丧掉生命的，必得着生命。"],[26,"人若赚得全世界，赔上自己的生命，有什么益处呢？人还能拿什么换生命呢？"],[27,"人子要在他父的荣耀里，同着众使者降临，那时候，他要照各人的行为报应各人。"],[28,"我实在告诉你们：站在这里的，有人在没尝死味以前，必看见人子降临在他的国里。”"]]},{"n":17,"v":[[1,"过了六天，耶稣带着彼得、雅各和雅各的兄弟约翰暗暗地上了高山，"],[2,"就在他们面前变了形像，脸面明亮如日头，衣裳洁白如光。"],[3,"忽然，有摩西、以利亚向他们显现，同耶稣说话。"],[4,"彼得对耶稣说：“主啊，我们在这里真好！你若愿意，我就在这里搭三座棚：一座为你，一座为摩西，一座为以利亚。”"],[5,"说话之间，忽然有一朵光明的云彩遮盖他们，且有声音从云彩里出来说：“这是我的爱子，我所喜悦的，你们要听他。”"],[6,"门徒听见，就俯伏在地，极其害怕。"],[7,"耶稣进前来，摸他们，说：“起来，不要害怕。”"],[8,"他们举目不见一人，只见耶稣在那里。"],[9,"下山的时候，耶稣吩咐他们说：“人子还没有从死里复活，你们不要将所看见的告诉人。”"],[10,"门徒问耶稣说：“文士为什么说以利亚必须先来？”"],[11,"耶稣回答说：“以利亚固然先来，并要复兴万事；"],[12,"只是我告诉你们，以利亚已经来了，人却不认识他，竟任意待他。人子也将要这样受他们的害。”"],[13,"门徒这才明白耶稣所说的，是指着施洗的约翰。"],[14,"耶稣和门徒到了众人那里，有一个人来见耶稣，跪下，"],[15,"说：“主啊，怜悯我的儿子！他害癫痫的病很苦，屡次跌在火里，屡次跌在水里。"],[16,"我带他到你门徒那里，他们却不能医治他。”"],[17,"耶稣说：“嗳！这又不信、又悖谬的世代啊，我在你们这里要到几时呢？我忍耐你们要到几时呢？把他带到我这里来吧！”"],[18,"耶稣斥责那鬼，鬼就出来，从此孩子就痊愈了。"],[19,"门徒暗暗地到耶稣跟前说：“我们为什么不能赶出那鬼呢？”"],[20,"耶稣说：“是因你们的信心小。我实在告诉你们，你们若有信心像一粒芥菜种，就是对这座山说，‘你从这边挪到那边’，它也必挪去，并且你们没有一件不能作的事了。"],[21,"至于这一类的鬼，若不祷告禁食，他就不出来（或作“不能赶他出来”）。”"],[22,"他们还住在加利利的时候，耶稣对门徒说：“人子将要被交在人手里。"],[23,"他们要杀害他，第三日他要复活。”门徒就大大地忧愁。"],[24,"到了迦百农，有收丁税的人来见彼得说：“你们的先生不纳丁税吗（丁税约有半块钱）？”"],[25,"彼得说：“纳。”他进了屋子，耶稣先向他说：“西门，你的意思如何？世上的君王向谁征收关税、丁税？是向自己的儿子呢，是向外人呢？”"],[26,"彼得说：“是向外人。”耶稣说：“既然如此，儿子就可以免税了。"],[27,"但恐怕触犯他们（“触犯”原文作“绊倒”），你且往海边去钓鱼，把先钓上来的鱼拿起来，开了它的口，必得一块钱，可以拿去给他们，作你我的税银。”"]]},{"n":18,"v":[[1,"当时，门徒进前来，问耶稣说：“天国里谁是最大的？”"],[2,"耶稣便叫一个小孩子来，使他站在他们当中，"],[3,"说：“我实在告诉你们：你们若不回转，变成小孩子的样式，断不得进天国。"],[4,"所以，凡自己谦卑像这小孩子的，他在天国里就是最大的。"],[5,"凡为我的名接待一个像这小孩子的，就是接待我。”"],[6,"“凡使这信我的一个小子跌倒的，倒不如把大磨石拴在这人的颈项上，沉在深海里。"],[7,"这世界有祸了！因为将人绊倒；绊倒人的事是免不了的，但那绊倒人的有祸了！"],[8,"倘若你一只手或是一只脚叫你跌倒，就砍下来丢掉。你缺一只手或是一只脚进入永生，强如有两手两脚被丢在永火里。"],[9,"倘若你一只眼叫你跌倒，就把它剜出来丢掉。你只有一只眼进入永生，强如有两只眼被丢在地狱的火里。”"],[10,"“你们要小心，不可轻看这小子里的一个。我告诉你们，他们的使者在天上常见我天父的面。（有古卷在此有"],[11,"人子来，为要拯救失丧的人。”）"],[12,"一个人若有一百只羊，一只走迷了路，你们的意思如何？他岂不撇下这九十九只，往山里去找那只迷路的羊吗？"],[13,"若是找着了，我实在告诉你们：他为这一只羊欢喜，比为那没有迷路的九十九只欢喜还大呢！"],[14,"你们在天上的父也是这样，不愿意这小子里失丧一个。”"],[15,"“倘若你的弟兄得罪你，你就去趁着只有他和你在一处的时候，指出他的错来。他若听你，你便得了你的弟兄；"],[16,"他若不听，你就另外带一两个人同去，要凭两三个人的口作见证，句句都可定准。"],[17,"若是不听他们，就告诉教会；若是不听教会，就看他像外邦人和税吏一样。”"],[18,"“我实在告诉你们：凡你们在地上所捆绑的，在天上也要捆绑；凡你们在地上所释放的，在天上也要释放。"],[19,"我又告诉你们：若是你们中间有两个人在地上同心合意地求什么事，我在天上的父必为他们成全。"],[20,"因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间。”"],[21,"那时彼得进前来，对耶稣说：“主啊，我弟兄得罪我，我当饶恕他几次呢？到七次可以吗？”"],[22,"耶稣说：“我对你说：不是到七次，乃是到七十个七次。"],[23,"天国好像一个王要和他仆人算账。"],[24,"才算的时候，有人带了一个欠一千万银子的来。"],[25,"因为他没有什么偿还之物，主人吩咐把他和他妻子儿女，并一切所有的都卖了偿还。"],[26,"那仆人就俯伏拜他，说：‘主啊，宽容我，将来我都要还清。’"],[27,"那仆人的主人就动了慈心，把他释放了，并且免了他的债。”"],[28,"“那仆人出来，遇见他的一个同伴欠他十两银子，便揪着他，掐住他的喉咙，说：‘你把所欠的还我！’"],[29,"他的同伴就俯伏央求他说：‘宽容我吧！将来我必还清。’"],[30,"他不肯，竟去把他下在监里，等他还了所欠的债。"],[31,"众同伴看见他所作的事，就甚忧愁，去把这事都告诉了主人。"],[32,"于是，主人叫了他来，对他说：‘你这恶奴才！你央求我，我就把你所欠的都免了。"],[33,"你不应当怜恤你的同伴，像我怜恤你吗？’"],[34,"主人就大怒，把他交给掌刑的，等他还清了所欠的债。"],[35,"你们各人若不从心里饶恕你的弟兄，我天父也要这样待你们了。”"]]},{"n":19,"v":[[1,"耶稣说完了这些话，就离开加利利，来到犹太的境界约旦河外。"],[2,"有许多人跟着他，他就在那里把他们的病人治好了。"],[3,"有法利赛人来试探耶稣说：“人无论什么缘故都可以休妻吗？”"],[4,"耶稣回答说：“那起初造人的，是造男造女，"],[5,"并且说：‘因此，人要离开父母，与妻子连合，二人成为一体。’这经你们没有念过吗？"],[6,"既然如此，夫妻不再是两个人，乃是一体的了。所以，神配合的，人不可分开。”"],[7,"法利赛人说：“这样，摩西为什么吩咐给妻子休书，就可以休她呢？”"],[8,"耶稣说：“摩西因为你们的心硬，所以许你们休妻，但起初并不是这样。"],[9,"我告诉你们：凡休妻另娶的，若不是为淫乱的缘故，就是犯奸淫了；有人娶那被休的妇人，也是犯奸淫了。”"],[10,"门徒对耶稣说：“人和妻子既是这样，倒不如不娶。”"],[11,"耶稣说：“这话不是人都能领受的，惟独赐给谁，谁才能领受。"],[12,"因为有生来是阉人，也有被人阉的，并有为天国的缘故自阉的。这话谁能领受，就可以领受。”"],[13,"那时，有人带着小孩子来见耶稣，要耶稣给他们按手祷告，门徒就责备那些人。"],[14,"耶稣说：“让小孩子到我这里来，不要禁止他们，因为在天国的，正是这样的人。”"],[15,"耶稣给他们按手，就离开那地方去了。"],[16,"有一个人来见耶稣说：“夫子（有古卷作“良善的夫子”），我该作什么善事，才能得永生？”"],[17,"耶稣对他说：“你为什么以善事问我呢？只有一位是善的（有古卷作“你为什么称我是良善的？除了神以外，没有一个良善的”）。你若要进入永生，就当遵守诫命。”"],[18,"他说：“什么诫命？”耶稣说：“就是不可杀人，不可奸淫，不可偷盗，不可作假见证，"],[19,"当孝敬父母，又当爱人如己。”"],[20,"那少年人说：“这一切我都遵守了，还缺少什么呢？”"],[21,"耶稣说：“你若愿意作完全人，可去变卖你所有的，分给穷人，就必有财宝在天上，你还要来跟从我。”"],[22,"那少年人听见这话，就忧忧愁愁地走了，因为他的产业很多。"],[23,"耶稣对门徒说：“我实在告诉你们：财主进天国是难的。"],[24,"我又告诉你们：骆驼穿过针的眼，比财主进神的国还容易呢！”"],[25,"门徒听见这话，就希奇得很，说：“这样谁能得救呢？”"],[26,"耶稣看着他们说：“在人这是不能的，在神凡事都能。”"],[27,"彼得就对他说：“看哪，我们已经撇下所有的跟从你，将来我们要得什么呢？”"],[28,"耶稣说：“我实在告诉你们：你们这跟从我的人，到复兴的时候，人子坐在他荣耀的宝座上，你们也要坐在十二个宝座上，审判以色列十二个支派。"],[29,"凡为我的名撇下房屋或是弟兄、姐妹、父亲、母亲（有古卷添“妻子”）、儿女、田地的，必要得着百倍，并且承受永生。"],[30,"然而，有许多在前的，将要在后；在后的，将要在前。”"]]},{"n":20,"v":[[1,"“因为天国好像家主清早出去，雇人进他的葡萄园作工，"],[2,"和工人讲定一天一钱银子，就打发他们进葡萄园去。"],[3,"约在巳初出去，看见市上还有闲站的人，"],[4,"就对他们说：‘你们也进葡萄园去。所当给的，我必给你们。’他们也进去了。"],[5,"约在午正和申初又出去，也是这样行。"],[6,"约在酉初出去，看见还有人站在那里，就问他们说：‘你们为什么整天在这里闲站呢？’"],[7,"他们说：‘因为没有人雇我们。’他说：‘你们也进葡萄园去。’"],[8,"到了晚上，园主对管事的说：‘叫工人都来，给他们工钱，从后来的起，到先来的为止。’"],[9,"约在酉初雇的人来了，各人得了一钱银子。"],[10,"及至那先雇的来了，他们以为必要多得；谁知也是各得一钱。"],[11,"他们得了，就埋怨家主说："],[12,"‘我们整天劳苦受热，那后来的只作了一小时，你竟叫他们和我们一样吗？’"],[13,"家主回答其中的一人说：‘朋友，我不亏负你，你与我讲定的，不是一钱银子吗？"],[14,"拿你的走吧！我给那后来的和给你一样，这是我愿意的。"],[15,"我的东西难道不可随我的意思用吗？因为我作好人，你就红了眼吗？’"],[16,"这样，那在后的将要在前；在前的将要在后了（有古卷在此有“因为被召的人多，选上的人少”）。”"],[17,"耶稣上耶路撒冷去的时候，在路上把十二个门徒带到一边，对他们说："],[18,"“看哪，我们上耶路撒冷去，人子要被交给祭司长和文士。他们要定他死罪，"],[19,"又交给外邦人，将他戏弄、鞭打、钉在十字架上，第三日他要复活。”"],[20,"那时，西庇太儿子的母亲同她两个儿子上前来拜耶稣，求他一件事。"],[21,"耶稣说：“你要什么呢？”她说：“愿你叫我这两个儿子在你国里，一个坐在你右边，一个坐在你左边。”"],[22,"耶稣回答说：“你们不知道所求的是什么。我将要喝的杯，你们能喝吗？”他们说：“我们能。”"],[23,"耶稣说：“我所喝的杯，你们必要喝；只是坐在我的左右，不是我可以赐的，乃是我父为谁预备的，就赐给谁。”"],[24,"那十个门徒听见，就恼怒他们弟兄二人。"],[25,"耶稣叫了他们来，说：“你们知道外邦人有君王为主治理他们，有大臣操权管束他们。"],[26,"只是在你们中间不可这样。你们中间谁愿为大，就必作你们的用人；"],[27,"谁愿为首，就必作你们的仆人。"],[28,"正如人子来，不是要受人的服侍，乃是要服侍人，并且要舍命，作多人的赎价。”"],[29,"他们出耶利哥的时候，有极多的人跟随他。"],[30,"有两个瞎子坐在路旁，听说是耶稣经过，就喊着说：“主啊，大卫的子孙，可怜我们吧！”"],[31,"众人责备他们，不许他们作声。他们却越发喊着说：“主啊，大卫的子孙，可怜我们吧！”"],[32,"耶稣就站住，叫他们来，说：“要我为你们作什么？”"],[33,"他们说：“主啊，要我们的眼睛能看见。”"],[34,"耶稣就动了慈心，把他们的眼睛一摸，他们立刻看见，就跟从了耶稣。"]]},{"n":21,"v":[[1,"耶稣和门徒将近耶路撒冷，到了伯法其，在橄榄山那里，"],[2,"耶稣就打发两个门徒，对他们说：“你们往对面村子里去，必看见一匹驴拴在那里，还有驴驹同在一处。你们解开，牵到我这里来。"],[3,"若有人对你们说什么，你们就说：‘主要用它。’那人必立时让你们牵来。”"],[4,"这事成就，是要应验先知的话，说："],[5,"“要对锡安的居民（原文作“女子”）说：‘看哪，你的王来到你这里，是温柔的，又骑着驴，就是骑着驴驹子。’”"],[6,"门徒就照耶稣所吩咐的去行，"],[7,"牵了驴和驴驹来，把自己的衣服搭在上面，耶稣就骑上。"],[8,"众人多半把衣服铺在路上，还有人砍下树枝来铺在路上。"],[9,"前行后随的众人喊着说：“和散那归于大卫的子孙（“和散那”原有“求救”的意思，在此乃称颂的话）！奉主名来的，是应当称颂的！高高在上和散那！”"],[10,"耶稣既进了耶路撒冷，合城都惊动了，说：“这是谁？”"],[11,"众人说：“这是加利利拿撒勒的先知耶稣。”"],[12,"耶稣进了神的殿，赶出殿里一切作买卖的人，推倒兑换银钱之人的桌子和卖鸽子之人的凳子；"],[13,"对他们说：“经上记着说：‘我的殿必称为祷告的殿’，你们倒使它成为贼窝了。”"],[14,"在殿里有瞎子、瘸子到耶稣跟前，他就治好了他们。"],[15,"祭司长和文士看见耶稣所行的奇事，又见小孩子在殿里喊着说：“和散那归于大卫的子孙！”就甚恼怒，"],[16,"对他说：“这些人所说的，你听见了吗？”耶稣说：“是的。经上说：‘你从婴孩和吃奶的口中完全了赞美的话。’你们没有念过吗？”"],[17,"于是离开他们，出城到伯大尼去，在那里住宿。"],[18,"早晨回城的时候，他饿了，"],[19,"看见路旁有一棵无花果树，就走到跟前，在树上找不着什么，不过有叶子，就对树说：“从今以后，你永不结果子！”那无花果树就立刻枯干了。"],[20,"门徒看见了，便希奇说：“无花果树怎么立刻枯干了呢？”"],[21,"耶稣回答说：“我实在告诉你们：你们若有信心，不疑惑，不但能行无花果树上所行的事，就是对这座山说，‘你挪开此地，投在海里’，也必成就。"],[22,"你们祷告，无论求什么，只要信，就必得着。”"],[23,"耶稣进了殿，正教训人的时候，祭司长和民间的长老来问他说：“你仗着什么权柄作这些事？给你这权柄的是谁呢？”"],[24,"耶稣回答说：“我也要问你们一句话，你们若告诉我，我就告诉你们我仗着什么权柄作这些事。"],[25,"约翰的洗礼是从哪里来的？是从天上来的？是从人间来的呢？”他们彼此商议说：“我们若说‘从天上来’，他必对我们说，‘这样，你们为什么不信他呢？’"],[26,"若说‘从人间来’，我们又怕百姓，因为他们都以约翰为先知。”"],[27,"于是回答耶稣说：“我们不知道。”耶稣说：“我也不告诉你们我仗着什么权柄作这些事。”"],[28,"又说：“一个人有两个儿子，他来对大儿子说：‘我儿，你今天到葡萄园里去作工。’"],[29,"他回答说：‘我不去’，以后自己懊悔，就去了。"],[30,"又来对小儿子也是这样说。他回答说：‘父啊，我去’，他却不去。"],[31,"你们想这两个儿子，是哪一个遵行父命呢？”他们说：“大儿子。”耶稣说：“我实在告诉你们：税吏和娼妓倒比你们先进神的国。"],[32,"因为约翰遵着义路到你们这里来，你们却不信他；税吏和娼妓倒信他。你们看见了，后来还是不懊悔去信他。”"],[33,"“你们再听一个比喻：有个家主，栽了一个葡萄园，周围圈上篱笆，里面挖了一个压酒池，盖了一座楼，租给园户，就往外国去了。"],[34,"收果子的时候近了，就打发仆人到园户那里去收果子。"],[35,"园户拿住仆人，打了一个，杀了一个，用石头打死一个。"],[36,"主人又打发别的仆人去，比先前更多，园户还是照样待他们。"],[37,"后来打发他的儿子到他们那里去，意思说：‘他们必尊敬我的儿子。’"],[38,"不料，园户看见他儿子，就彼此说：‘这是承受产业的。来吧！我们杀他，占他的产业！’"],[39,"他们就拿住他，推出葡萄园外杀了。"],[40,"园主来的时候，要怎样处治这些园户呢？”"],[41,"他们说：“要下毒手除灭那些恶人，将葡萄园另租给那按着时候交果子的园户。”"],[42,"耶稣说：“经上写着：‘匠人所弃的石头，已作了房角的头块石头。这是主所作的，在我们眼中看为希奇。’这经你们没有念过吗？"],[43,"所以我告诉你们，神的国必从你们夺去，赐给那能结果子的百姓。"],[44,"谁掉在这石头上，必要跌碎；这石头掉在谁的身上，就要把谁砸得稀烂。”"],[45,"祭司长和法利赛人听见他的比喻，就看出他是指着他们说的。"],[46,"他们想要捉拿他，只是怕众人，因为众人以他为先知。"]]},{"n":22,"v":[[1,"耶稣又用比喻对他们说："],[2,"“天国好比一个王为他儿子摆设娶亲的筵席，"],[3,"就打发仆人去，请那些被召的人来赴席；他们却不肯来。"],[4,"王又打发别的仆人，说：‘你们告诉那被召的人，我的筵席已经预备好了，牛和肥畜已经宰了，各样都齐备，请你们来赴席。’"],[5,"那些人不理就走了。一个到自己田里去；一个作买卖去；"],[6,"其余的拿住仆人，凌辱他们，把他们杀了。"],[7,"王就大怒，发兵除灭那些凶手，烧毁他们的城。"],[8,"于是对仆人说：‘喜筵已经齐备，只是所召的人不配。"],[9,"所以你们要往岔路口上去，凡遇见的，都召来赴席。’"],[10,"那些仆人就出去到大路上，凡遇见的，不论善恶都召聚了来，筵席上就坐满了客。"],[11,"王进来观看宾客，见那里有一个没有穿礼服的，"],[12,"就对他说：‘朋友，你到这里来，怎么不穿礼服呢？’那人无言可答。"],[13,"于是王对使唤的人说：‘捆起他的手脚来，把他丢在外边的黑暗里，在那里必要哀哭切齿了。’"],[14,"因为被召的人多，选上的人少。”"],[15,"当时，法利赛人出去，商议怎样就着耶稣的话陷害他，"],[16,"就打发他们的门徒同希律党的人去见耶稣，说：“夫子，我们知道你是诚实人，并且诚诚实实传神的道，什么人你都不徇情面，因为你不看人的外貌。"],[17,"请告诉我们，你的意见如何？纳税给凯撒可以不可以？”"],[18,"耶稣看出他们的恶意，就说：“假冒为善的人哪，为什么试探我？"],[19,"拿一个上税的钱给我看。”他们就拿一个银钱来给他。"],[20,"耶稣说：“这像和这号是谁的？”"],[21,"他们说：“是凯撒的。”耶稣说：“这样，凯撒的物当归给凯撒；神的物当归给神。”"],[22,"他们听见就希奇，离开他走了。"],[23,"撒都该人常说没有复活的事。那天，他们来问耶稣说："],[24,"“夫子，摩西说：‘人若死了，没有孩子，他兄弟当娶他的妻，为哥哥生子立后。’"],[25,"从前在我们这里有弟兄七人。第一个娶了妻，死了，没有孩子，撇下妻子给兄弟。"],[26,"第二、第三，直到第七个，都是如此。"],[27,"末后，妇人也死了。"],[28,"这样，当复活的时候，她是七个人中哪一个的妻子呢？因为他们都娶过她。”"],[29,"耶稣回答说：“你们错了，因为不明白圣经，也不晓得神的大能。"],[30,"当复活的时候，人也不娶，也不嫁，乃像天上的使者一样。"],[31,"论到死人复活，神在经上向你们所说的，你们没有念过吗？"],[32,"他说：‘我是亚伯拉罕的神，以撒的神，雅各的神。’神不是死人的神，乃是活人的神。”"],[33,"众人听见这话，就希奇他的教训。"],[34,"法利赛人听见耶稣堵住了撒都该人的口，他们就聚集。"],[35,"内中有一个人是律法师，要试探耶稣，就问他说："],[36,"“夫子，律法上的诫命，哪一条是最大的呢？”"],[37,"耶稣对他说：“你要尽心、尽性、尽意，爱主你的神。"],[38,"这是诫命中的第一，且是最大的。"],[39,"其次也相仿，就是要爱人如己。"],[40,"这两条诫命是律法和先知一切道理的总纲。”"],[41,"法利赛人聚集的时候，耶稣问他们说："],[42,"“论到基督，你们的意见如何？他是谁的子孙呢？”他们回答说：“是大卫的子孙。”"],[43,"耶稣说：“这样，大卫被圣灵感动，怎么还称他为主，说："],[44,"‘主对我主说：你坐在我的右边，等我把你仇敌放在你的脚下。’"],[45,"大卫既称他为主，他怎么又是大卫的子孙呢？”"],[46,"他们没有一个人能回答一言。从那日以后，也没有人敢再问他什么。"]]},{"n":23,"v":[[1,"那时，耶稣对众人和门徒讲论，"],[2,"说：“文士和法利赛人坐在摩西的位上，"],[3,"凡他们所吩咐你们的，你们都要谨守遵行；但不要效法他们的行为，因为他们能说不能行。"],[4,"他们把难担的重担捆起来，搁在人的肩上，但自己一个指头也不肯动。"],[5,"他们一切所作的事都是要叫人看见，所以将佩戴的经文作宽了，衣裳的繸子作长了；"],[6,"喜爱筵席上的首座，会堂里的高位；"],[7,"又喜爱人在街市上问他安，称呼他拉比（“拉比”就是“夫子”）。"],[8,"但你们不要受拉比的称呼，因为只有一位是你们的夫子，你们都是弟兄；"],[9,"也不要称呼地上的人为父，因为只有一位是你们的父，就是在天上的父；"],[10,"也不要受师尊的称呼，因为只有一位是你们的师尊，就是基督。"],[11,"你们中间谁为大，谁就要作你们的用人。"],[12,"凡自高的，必降为卑；自卑的，必升为高。”"],[13,"“你们这假冒为善的文士和法利赛人有祸了！因为你们正当人前，把天国的门关了，自己不进去，正要进去的人，你们也不容他们进去。（有古卷在此有"],[14,"“你们这假冒为善的文士和法利赛人有祸了！因为你们侵吞寡妇的家产，假意作很长的祷告，所以要受更重的刑罚。”）”"],[15,"“你们这假冒为善的文士和法利赛人有祸了！因为你们走遍洋海陆地，勾引一个人入教，既入了教，却使他作地狱之子，比你们还加倍。”"],[16,"“你们这瞎眼领路的有祸了！你们说：‘凡指着殿起誓的，这算不得什么；只是凡指着殿中金子起誓的，他就该谨守。’"],[17,"你们这无知瞎眼的人哪！什么是大的？是金子呢，还是叫金子成圣的殿呢？"],[18,"你们又说：‘凡指着坛起誓的，这算不得什么；只是凡指着坛上礼物起誓的，他就该谨守。’"],[19,"你们这瞎眼的人哪！什么是大的？是礼物呢，还是叫礼物成圣的坛呢？"],[20,"所以，人指着坛起誓，就是指着坛和坛上一切所有的起誓；"],[21,"人指着殿起誓，就是指着殿和那住在殿里的起誓；"],[22,"人指着天起誓，就是指着神的宝座和那坐在上面的起誓。”"],[23,"“你们这假冒为善的文士和法利赛人有祸了！因为你们将薄荷、茴香、芹菜献上十分之一，那律法上更重的事，就是公义、怜悯、信实，反倒不行了。这更重的是你们当行的，那也是不可不行的。"],[24,"你们这瞎眼领路的，蠓虫你们就滤出来，骆驼你们倒吞下去。”"],[25,"“你们这假冒为善的文士和法利赛人有祸了！因为你们洗净杯盘的外面，里面却盛满了勒索和放荡。"],[26,"你们这瞎眼的法利赛人，先洗净杯盘的里面，好叫外面也干净了。”"],[27,"“你们这假冒为善的文士和法利赛人有祸了！因为你们好像粉饰的坟墓，外面好看，里面却装满了死人的骨头和一切的污秽。"],[28,"你们也是如此，在人前、外面显出公义来，里面却装满了假善和不法的事。”"],[29,"“你们这假冒为善的文士和法利赛人有祸了！因为你们建造先知的坟，修饰义人的墓，说："],[30,"‘若是我们在我们祖宗的时候，必不和他们同流先知的血。’"],[31,"这就是你们自己证明是杀害先知者的子孙了。"],[32,"你们去充满你们祖宗的恶贯吧！"],[33,"你们这些蛇类、毒蛇之种啊！怎能逃脱地狱的刑罚呢？"],[34,"所以我差遣先知和智慧人并文士到你们这里来，有的你们要杀害，要钉十字架；有的你们要在会堂里鞭打，从这城追逼到那城。"],[35,"叫世上所流义人的血，都归到你们身上，从义人亚伯的血起，直到你们在殿和坛中间所杀的巴拉加的儿子撒迦利亚的血为止。"],[36,"我实在告诉你们：这一切的罪都要归到这世代了。”"],[37,"“耶路撒冷啊，耶路撒冷啊！你常杀害先知，又用石头打死那奉差遣到你这里来的人。我多次愿意聚集你的儿女，好像母鸡把小鸡聚集在翅膀底下，只是你们不愿意。"],[38,"看哪，你们的家成为荒场，留给你们。"],[39,"我告诉你们：从今以后，你们不得再见我，直等到你们说：‘奉主名来的，是应当称颂的。’”"]]},{"n":24,"v":[[1,"耶稣出了圣殿，正走的时候，门徒进前来，把殿宇指给他看。"],[2,"耶稣对他们说：“你们不是看见这殿宇吗？我实在告诉你们：将来在这里，没有一块石头留在石头上不被拆毁了。”"],[3,"耶稣在橄榄山上坐着，门徒暗暗地来说：“请告诉我们，什么时候有这些事？你降临和世界的末了，有什么预兆呢？”"],[4,"耶稣回答说：“你们要谨慎，免得有人迷惑你们。"],[5,"因为将来有好些人冒我的名来，说：‘我是基督’，并且要迷惑许多人。"],[6,"你们也要听见打仗和打仗的风声，总不要惊慌，因为这些事是必须有的，只是末期还没有到。"],[7,"民要攻打民，国要攻打国，多处必有饥荒、地震。"],[8,"这都是灾难的起头（“灾难”原文作“生产之难”）。"],[9,"那时，人要把你们陷在患难里，也要杀害你们；你们又要为我的名被万民恨恶。"],[10,"那时，必有许多人跌倒，也要彼此陷害，彼此恨恶，"],[11,"且有好些假先知起来，迷惑多人。"],[12,"只因不法的事增多，许多人的爱心才渐渐冷淡了。"],[13,"惟有忍耐到底的必然得救。"],[14,"这天国的福音要传遍天下，对万民作见证，然后末期才来到。”"],[15,"“你们看见先知但以理所说的‘那行毁坏可憎的’站在圣地（读这经的人须要会意）。"],[16,"那时，在犹太的，应当逃到山上；"],[17,"在房上的，不要下来拿家里的东西；"],[18,"在田里的，也不要回去取衣裳。"],[19,"当那些日子，怀孕的和奶孩子的有祸了！"],[20,"你们应当祈求，叫你们逃走的时候，不遇见冬天或是安息日。"],[21,"因为那时必有大灾难，从世界的起头直到如今，没有这样的灾难，后来也必没有。"],[22,"若不减少那日子，凡有血气的，总没有一个得救的；只是为选民，那日子必减少了。"],[23,"那时，若有人对你们说‘基督在这里’，或说：‘基督在那里’，你们不要信。"],[24,"因为假基督、假先知将要起来，显大神迹、大奇事。倘若能行，连选民也就迷惑了。"],[25,"看哪，我预先告诉你们了。"],[26,"若有人对你们说，‘看哪，基督在旷野里’，你们不要出去；或说，‘看哪，基督在内屋中’，你们不要信。"],[27,"闪电从东边发出，直照到西边。人子降临，也要这样。"],[28,"尸首在哪里，鹰也必聚在那里。”"],[29,"“那些日子的灾难一过去，日头就变黑了，月亮也不放光，众星要从天上坠落，天势都要震动。"],[30,"那时，人子的兆头要显在天上，地上的万族都要哀哭。他们要看见人子有能力，有大荣耀，驾着天上的云降临。"],[31,"他要差遣使者，用号筒的大声，将他的选民从四方（“方”原文作“风”），从天这边到天那边，都招聚了来。”"],[32,"“你们可以从无花果树学个比方：当树枝发嫩长叶的时候，你们就知道夏天近了。"],[33,"这样，你们看见这一切的事，也该知道人子近了，正在门口了。"],[34,"我实在告诉你们：这世代还没有过去，这些事都要成就。"],[35,"天地要废去，我的话却不能废去。”"],[36,"“但那日子、那时辰，没有人知道，连天上的使者也不知道，子也不知道，惟独父知道。"],[37,"挪亚的日子怎样，人子降临也要怎样。"],[38,"当洪水以前的日子，人照常吃喝嫁娶，直到挪亚进方舟的那日，"],[39,"不知不觉洪水来了，把他们全都冲去。人子降临也要这样。"],[40,"那时，两个人在田里，取去一个，撇下一个；"],[41,"两个女人推磨，取去一个，撇下一个。"],[42,"所以，你们要警醒，因为不知道你们的主是哪一天来到。"],[43,"家主若知道几更天有贼来，就必警醒，不容人挖透房屋，这是你们所知道的。"],[44,"所以，你们也要预备，因为你们想不到的时候，人子就来了。”"],[45,"“谁是忠心有见识的仆人，为主人所派，管理家里的人，按时分粮给他们呢？"],[46,"主人来到，看见他这样行，那仆人就有福了。"],[47,"我实在告诉你们：主人要派他管理一切所有的。"],[48,"倘若那恶仆心里说：‘我的主人必来得迟’，"],[49,"就动手打他的同伴，又和酒醉的人一同吃喝。"],[50,"在想不到的日子，不知道的时辰，那仆人的主人要来，"],[51,"重重的处治他（或作“把他腰斩了”），定他和假冒为善的人同罪。在那里必要哀哭切齿了。”"]]},{"n":25,"v":[[1,"“那时，天国好比十个童女拿着灯，出去迎接新郎。"],[2,"其中有五个是愚拙的，五个是聪明的。"],[3,"愚拙的拿着灯，却不预备油；"],[4,"聪明的拿着灯，又预备油在器皿里。"],[5,"新郎迟延的时候，她们都打盹、睡着了。"],[6,"半夜有人喊着说：‘新郎来了，你们出来迎接他！’"],[7,"那些童女就都起来收拾灯。"],[8,"愚拙的对聪明的说：‘请分点油给我们，因为我们的灯要灭了。’"],[9,"聪明的回答说：‘恐怕不够你我用的，不如你们自己到卖油的那里去买吧！’"],[10,"她们去买的时候，新郎到了，那预备好了的，同他进去坐席，门就关了。"],[11,"其余的童女随后也来了，说：‘主啊，主啊，给我们开门！’"],[12,"他却回答说：‘我实在告诉你们：我不认识你们。’"],[13,"所以，你们要警醒，因为那日子、那时辰，你们不知道。”"],[14,"“天国又好比一个人要往外国去，就叫了仆人来，把他的家业交给他们，"],[15,"按着各人的才干，给他们银子，一个给了五千，一个给了二千，一个给了一千，就往外国去了。"],[16,"那领五千的随即拿去作买卖，另外赚了五千；"],[17,"那领二千的也照样另赚了二千；"],[18,"但那领一千的去掘开地，把主人的银子埋藏了。"],[19,"过了许久，那些仆人的主人来了，和他们算账。"],[20,"那领五千银子的又带着那另外的五千来，说：‘主啊，你交给我五千银子，请看，我又赚了五千。’"],[21,"主人说：‘好，你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理，可以进来享受你主人的快乐。’"],[22,"那领二千的也来，说：‘主啊，你交给我二千银子，请看，我又赚了二千。’"],[23,"主人说：‘好，你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理，可以进来享受你主人的快乐。’"],[24,"那领一千的也来，说：‘主啊，我知道你是忍心的人，没有种的地方要收割，没有散的地方要聚敛，"],[25,"我就害怕，去把你的一千银子埋藏在地里。请看，你的原银子在这里。’"],[26,"主人回答说：‘你这又恶又懒的仆人，你既知道我没有种的地方要收割，没有散的地方要聚敛，"],[27,"就当把我的银子放给兑换银钱的人，到我来的时候，可以连本带利收回。"],[28,"夺过他这一千来，给那有一万的。"],[29,"因为凡有的，还要加给他，叫他有余；没有的，连他所有的也要夺过来。"],[30,"把这无用的仆人丢在外面黑暗里，在那里必要哀哭切齿了。’”"],[31,"“当人子在他荣耀里，同着众天使降临的时候，要坐在他荣耀的宝座上。"],[32,"万民都要聚集在他面前。他要把他们分别出来，好像牧羊的分别绵羊、山羊一般；"],[33,"把绵羊安置在右边，山羊在左边。"],[34,"于是，王要向那右边的说：‘你们这蒙我父赐福的，可来承受那创世以来为你们所预备的国。"],[35,"因为我饿了，你们给我吃；渴了，你们给我喝；我作客旅，你们留我住；"],[36,"我赤身露体，你们给我穿；我病了，你们看顾我；我在监里，你们来看我。’"],[37,"义人就回答说：‘主啊，我们什么时候见你饿了，给你吃，渴了，给你喝？"],[38,"什么时候见你作客旅，留你住，或是赤身露体，给你穿？"],[39,"又什么时候见你病了，或是在监里，来看你呢？’"],[40,"王要回答说：‘我实在告诉你们：这些事你们既作在我这弟兄中一个最小的身上，就是作在我身上了。’"],[41,"王又要向那左边的说：‘你们这被咒诅的人，离开我，进入那为魔鬼和他的使者所预备的永火里去！"],[42,"因为我饿了，你们不给我吃；渴了，你们不给我喝；"],[43,"我作客旅，你们不留我住；我赤身露体，你们不给我穿；我病了，我在监里，你们不来看顾我。’"],[44,"他们也要回答说：‘主啊，我们什么时候见你饿了，或渴了，或作客旅，或赤身露体，或病了，或在监里，不伺候你呢？’"],[45,"王要回答说：‘我实在告诉你们：这些事你们既不作在我这弟兄中一个最小的身上，就是不作在我身上了。’"],[46,"这些人要往永刑里去；那些义人，要往永生里去。”"]]},{"n":26,"v":[[1,"耶稣说完了这一切的话，就对门徒说："],[2,"“你们知道，过两天是逾越节，人子将要被交给人，钉在十字架上。”"],[3,"那时，祭司长和民间的长老聚集在大祭司称为该亚法的院里。"],[4,"大家商议要用诡计拿住耶稣杀他；"],[5,"只是说：“当节的日子不可，恐怕民间生乱。”"],[6,"耶稣在伯大尼长大麻风的西门家里，"],[7,"有一个女人拿着一玉瓶极贵的香膏来，趁耶稣坐席的时候，浇在他的头上。"],[8,"门徒看见就很不喜悦，说：“何用这样的枉费呢！"],[9,"这香膏可以卖许多钱周济穷人。”"],[10,"耶稣看出他们的意思，就说：“为什么难为这女人呢？她在我身上作的是一件美事。"],[11,"因为常有穷人和你们同在，只是你们不常有我。"],[12,"她将这香膏浇在我身上，是为我安葬作的。"],[13,"我实在告诉你们：普天之下，无论在什么地方传这福音，也要述说这女人所行的，作个记念。”"],[14,"“当下，十二门徒里有一个称为加略人犹大的，去见祭司长，说："],[15,"“我把他交给你们，你们愿意给我多少钱？”他们就给了他三十块钱。"],[16,"从那时候，他就找机会要把耶稣交给他们。"],[17,"除酵节的第一天，门徒来问耶稣说：“你吃逾越节的筵席，要我们在哪里给你预备？”"],[18,"耶稣说：“你们进城去，到某人那里，对他说，‘夫子说：我的时候快到了，我与门徒要在你家里守逾越节。’”"],[19,"门徒遵着耶稣所吩咐的，就去预备了逾越节的筵席。"],[20,"到了晚上，耶稣和十二个门徒坐席。"],[21,"正吃的时候，耶稣说：“我实在告诉你们：你们中间有一个人要卖我了。”"],[22,"他们就甚忧愁，一个一个地问他说：“主，是我吗？”"],[23,"耶稣回答说：“同我蘸手在盘子里的，就是他要卖我。"],[24,"人子必要去世，正如经上指着他所写的，但卖人子的人有祸了，那人不生在世上倒好。”"],[25,"卖耶稣的犹大问他说：“拉比，是我吗？”耶稣说：“你说的是。”"],[26,"他们吃的时候，耶稣拿起饼来，祝福，就擘开，递给门徒，说：“你们拿着吃，这是我的身体。”"],[27,"又拿起杯来，祝谢了，递给他们，说：“你们都喝这个，"],[28,"因为这是我立约的血，为多人流出来，使罪得赦。"],[29,"但我告诉你们：从今以后我不再喝这葡萄汁，直到我在我父的国里同你们喝新的那日子。”"],[30,"他们唱了诗，就出来往橄榄山去。"],[31,"那时，耶稣对他们说：“今夜，你们为我的缘故都要跌倒。因为经上记着说：‘我要击打牧人，羊就分散了。’"],[32,"但我复活以后，要在你们以先往加利利去。”"],[33,"彼得说：“众人虽然为你的缘故跌倒，我却永不跌倒。”"],[34,"耶稣说：“我实在告诉你：今夜鸡叫以先，你要三次不认我。”"],[35,"彼得说：“我就是必须和你同死，也总不能不认你。”众门徒都是这样说。"],[36,"耶稣同门徒来到一个地方，名叫客西马尼，就对他们说：“你们坐在这里，等我到那边去祷告。”"],[37,"于是带着彼得和西庇太的两个儿子同去，就忧愁起来，极其难过，"],[38,"便对他们说：“我心里甚是忧伤，几乎要死，你们在这里等候，和我一同警醒。”"],[39,"他就稍往前走，俯伏在地祷告说：“我父啊，倘若可行，求你叫这杯离开我；然而，不要照我的意思，只要照你的意思。”"],[40,"来到门徒那里，见他们睡着了，就对彼得说：“怎么样？你们不能同我警醒片时吗？"],[41,"总要警醒祷告，免得入了迷惑。你们心灵固然愿意，肉体却软弱了。”"],[42,"第二次又去祷告说：“我父啊，这杯若不能离开我，必要我喝，就愿你的意旨成全。”"],[43,"又来见他们睡着了，因为他们的眼睛困倦。"],[44,"耶稣又离开他们去了。第三次祷告，说的话还是与先前一样。"],[45,"于是来到门徒那里，对他们说：“现在你们仍然睡觉安歇吧（“吧”或作“吗”）？时候到了，人子被卖在罪人手里了。"],[46,"起来，我们走吧！看哪，卖我的人近了。”"],[47,"说话之间，那十二个门徒里的犹大来了，并有许多人带着刀棒，从祭司长和民间的长老那里与他同来。"],[48,"那卖耶稣的给了他们一个暗号，说：“我与谁亲嘴，谁就是他。你们可以拿住他。”"],[49,"犹大随即到耶稣跟前说：“请拉比安”，就与他亲嘴。"],[50,"耶稣对他说：“朋友，你来要作的事，就作吧！”于是那些人上前，下手拿住耶稣。"],[51,"有跟随耶稣的一个人伸手拔出刀来，将大祭司的仆人砍了一刀，削掉了他一个耳朵。"],[52,"耶稣对他说：“收刀入鞘吧！凡动刀的，必死在刀下。"],[53,"你想我不能求我父现在为我差遣十二营多天使来吗？"],[54,"若是这样，经上所说事情必须如此的话怎么应验呢？”"],[55,"当时，耶稣对众人说：“你们带着刀棒出来拿我，如同拿强盗吗？我天天坐在殿里教训人，你们并没有拿我。"],[56,"但这一切的事成就了，为要应验先知书上的话。”当下，门徒都离开他逃走了。"],[57,"拿耶稣的人把他带到大祭司该亚法那里去，文士和长老已经在那里聚会。"],[58,"彼得远远地跟着耶稣，直到大祭司的院子，进到里面，就和差役同坐，要看这事到底怎样。"],[59,"祭司长和全公会寻找假见证控告耶稣，要治死他。"],[60,"虽有好些人来作假见证，总得不着实据。末后有两个人前来，说："],[61,"“这个人曾说：‘我能拆毁神的殿，三日内又建造起来。’”"],[62,"大祭司就站起来，对耶稣说：“你什么都不回答吗？这些人作见证告你的是什么呢？”"],[63,"耶稣却不言语。大祭司对他说，“我指着永生神叫你起誓告诉我们，你是神的儿子基督不是？”"],[64,"耶稣对他说：“你说的是。然而，我告诉你们，后来你们要看见人子坐在那权能者的右边，驾着天上的云降临。”"],[65,"大祭司就撕开衣服，说：“他说了僭妄的话，我们何必再用见证人呢？这僭妄的话，现在你们都听见了。"],[66,"你们的意见如何？”他们回答说：“他是该死的。”"],[67,"他们就吐唾沫在他脸上，用拳头打他；也有用手掌打他的，说："],[68,"“基督啊，你是先知，告诉我们打你的是谁？”"],[69,"彼得在外面院子里坐着，有一个使女前来说：“你素来也是同那加利利人耶稣一伙的。”"],[70,"彼得在众人面前却不承认，说：“我不知道你说的是什么。”"],[71,"既出去，到了门口，又有一个使女看见他，就对那里的人说：“这个人也是同拿撒勒人耶稣一伙的。”"],[72,"彼得又不承认，并且起誓说：“我不认得那个人。”"],[73,"过了不多的时候，旁边站着的人前来对彼得说：“你真是他们一党的，你的口音把你露出来了。”"],[74,"彼得就发咒起誓地说：“我不认得那个人。”立时，鸡就叫了。"],[75,"彼得想起耶稣所说的话：“鸡叫以先，你要三次不认我。”他就出去痛哭。"]]},{"n":27,"v":[[1,"到了早晨，众祭司长和民间的长老，大家商议要治死耶稣，"],[2,"就把他捆绑，解去交给巡抚彼拉多。"],[3,"这时候，卖耶稣的犹大看见耶稣已经定了罪，就后悔，把那三十块钱拿回来给祭司长和长老，说："],[4,"“我卖了无辜之人的血是有罪了。”他们说：“那与我们有什么相干？你自己承当吧！”"],[5,"犹大就把那银钱丢在殿里，出去吊死了。"],[6,"祭司长拾起银钱来说：“这是血价，不可放在库里。”"],[7,"他们商议，就用那银钱买了窑户的一块田，为要埋葬外乡人。"],[8,"所以那块田直到今日还叫作“血田”。"],[9,"这就应了先知耶利米的话，说：“他们用那三十块钱，就是被估定之人的价钱，是以色列人中所估定的，"],[10,"买了窑户的一块田；这是照着主所吩咐我的。”"],[11,"耶稣站在巡抚面前，巡抚问他说：“你是犹太人的王吗？”耶稣说：“你说的是。”"],[12,"他被祭司长和长老控告的时候，什么都不回答。"],[13,"彼拉多就对他说：“他们作见证告你这么多的事，你没有听见吗？”"],[14,"耶稣仍不回答，连一句话也不说，以致巡抚甚觉希奇。"],[15,"巡抚有一个常例，每逢这节期，随众人所要的，释放一个囚犯给他们。"],[16,"当时有一个出名的囚犯叫巴拉巴。"],[17,"众人聚集的时候，彼拉多就对他们说：“你们要我释放哪一个给你们？是巴拉巴呢？是称为基督的耶稣呢？”"],[18,"巡抚原知道，他们是因为嫉妒才把他解了来。"],[19,"正坐堂的时候，他的夫人打发人来说：“这义人的事你一点不可管，因为我今天在梦中为他受了许多的苦。”"],[20,"祭司长和长老挑唆众人，求释放巴拉巴，除灭耶稣。"],[21,"巡抚对众人说：“这两个人，你们要我释放哪一个给你们呢？”他们说：“巴拉巴。”"],[22,"彼拉多说：“这样，那称为基督的耶稣，我怎么办他呢？”他们都说：“把他钉十字架！”"],[23,"巡抚说：“为什么呢？他作了什么恶事呢？”他们便极力地喊着说：“把他钉十字架！”"],[24,"彼拉多见说也无济于事，反要生乱，就拿水在众人面前洗手，说：“流这义人的血，罪不在我，你们承当吧！”"],[25,"众人都回答说：“他的血归到我们和我们的子孙身上。”"],[26,"于是彼拉多释放巴拉巴给他们，把耶稣鞭打了，交给人钉十字架。"],[27,"巡抚的兵就把耶稣带进衙门，叫全营的兵都聚集在他那里。"],[28,"他们给他脱了衣服，穿上一件朱红色袍子；"],[29,"用荆棘编作冠冕，戴在他头上；拿一根苇子放在他右手里，跪在他面前，戏弄他说：“恭喜，犹太人的王啊！”"],[30,"又吐唾沫在他脸上，拿苇子打他的头。"],[31,"戏弄完了，就给他脱了袍子，仍穿上他自己的衣服，带他出去，要钉十字架。"],[32,"他们出来的时候，遇见一个古利奈人，名叫西门，就勉强他同去，好背着耶稣的十字架。"],[33,"到了一个地方名叫各各他，意思就是髑髅地。"],[34,"兵丁拿苦胆调和的酒给耶稣喝。他尝了，就不肯喝。"],[35,"他们既将他钉在十字架上，就拈阄分他的衣服，"],[36,"又坐在那里看守他。"],[37,"在他头以上安一个牌子，写着他的罪状，说：“这是犹太人的王耶稣。”"],[38,"当时，有两个强盗和他同钉十字架，一个在右边，一个在左边。"],[39,"从那里经过的人讥诮他，摇着头，说："],[40,"“你这拆毁圣殿，三日又建造起来的，可以救自己吧！你如果是神的儿子，就从十字架上下来吧！”"],[41,"祭司长和文士并长老也是这样戏弄他，说："],[42,"“他救了别人，不能救自己。他是以色列的王，现在可以从十字架上下来，我们就信他。"],[43,"他倚靠神，神若喜悦他，现在可以救他，因为他曾说：‘我是神的儿子。’”"],[44,"那和他同钉的强盗也是这样地讥诮他。"],[45,"从午正到申初，遍地都黑暗了。"],[46,"约在申初，耶稣大声喊着说：“以利，以利！拉马撒巴各大尼？”就是说：“我的神！我的神！为什么离弃我？”"],[47,"站在那里的人，有的听见就说：“这个人呼叫以利亚呢！”"],[48,"内中有一个人赶紧跑去，拿海绒蘸满了醋绑在苇子上，送给他喝。"],[49,"其余的人说：“且等着，看以利亚来救他不来。”"],[50,"耶稣又大声喊叫，气就断了。"],[51,"忽然，殿里的幔子从上到下裂为两半，地也震动，磐石也崩裂，"],[52,"坟墓也开了，已睡圣徒的身体，多有起来的。"],[53,"到耶稣复活以后，他们从坟墓里出来，进了圣城，向许多人显现。"],[54,"百夫长和一同看守耶稣的人看见地震并所经历的事，就极其害怕，说：“这真是神的儿子了！”"],[55,"有好些妇女在那里，远远地观看，她们是从加利利跟随耶稣来服侍他的。"],[56,"内中有抹大拉的马利亚，又有雅各和约西的母亲马利亚，并有西庇太两个儿子的母亲。"],[57,"到了晚上，有一个财主，名叫约瑟，是亚利马太来的，他也是耶稣的门徒。"],[58,"这人去见彼拉多，求耶稣的身体，彼拉多就吩咐给他。"],[59,"约瑟取了身体，用干净细麻布裹好，"],[60,"安放在自己的新坟墓里，就是他凿在磐石里的。他又把大石头滚到墓门口，就去了。"],[61,"有抹大拉的马利亚和那个马利亚在那里，对着坟墓坐着。"],[62,"次日，就是预备日的第二天，祭司长和法利赛人聚集，来见彼拉多，说："],[63,"“大人，我们记得那诱惑人的还活着的时候，曾说：‘三日后我要复活。’"],[64,"因此，请吩咐人将坟墓把守妥当，直到第三日，恐怕他的门徒来把他偷了去，就告诉百姓说：‘他从死里复活了。’这样，那后来的迷惑比先前的更利害了。”"],[65,"彼拉多说：“你们有看守的兵，去吧！尽你们所能的把守妥当。”"],[66,"他们就带着看守的兵同去，封了石头，将坟墓把守妥当。"]]},{"n":28,"v":[[1,"安息日将尽，七日的头一日，天快亮的时候，抹大拉的马利亚和那个马利亚来看坟墓。"],[2,"忽然，地大震动，因为有主的使者从天上下来，把石头滚开，坐在上面。"],[3,"他的像貌如同闪电，衣服洁白如雪。"],[4,"看守的人就因他吓得浑身乱战，甚至和死人一样。"],[5,"天使对妇女说：“不要害怕！我知道你们是寻找那钉十字架的耶稣。"],[6,"他不在这里，照他所说的，已经复活了。你们来看安放主的地方。"],[7,"快去告诉他的门徒，说他从死里复活了，并且在你们以先往加利利去，在那里你们要见他。看哪，我已经告诉你们了。”"],[8,"妇女们就急忙离开坟墓，又害怕，又大大地欢喜，跑去要报给他的门徒。"],[9,"忽然，耶稣遇见她们，说：“愿你们平安！”她们就上前抱住他的脚拜他。"],[10,"耶稣对她们说：“不要害怕！你们去告诉我的弟兄，叫他们往加利利去，在那里必见我。”"],[11,"他们去的时候，看守的兵有几个进城去，将所经历的事都报给祭司长。"],[12,"祭司长和长老聚集商议，就拿许多银钱给兵丁，说："],[13,"“你们要这样说：‘夜间我们睡觉的时候，他的门徒来把他偷去了。’"],[14,"倘若这话被巡抚听见，有我们劝他，保你们无事。”"],[15,"兵丁受了银钱，就照所嘱咐他们的去行。这话就传说在犹太人中间，直到今日。"],[16,"十一个门徒往加利利去，到了耶稣约定的山上。"],[17,"他们见了耶稣就拜他，然而还有人疑惑。"],[18,"耶稣进前来，对他们说：“天上地下所有的权柄都赐给我了。"],[19,"所以，你们要去使万民作我的门徒，奉父、子、圣灵的名给他们施洗（或作“给他们施洗，归于父、子、圣灵的名）。"],[20,"凡我所吩咐你们的，都教训他们遵守，我就常与你们同在，直到世界的末了。”"]]}]},{"name":"路加福音","chapters":[{"n":1,"v":[[1,"-"],[2,"提阿非罗大人哪，有好些人提笔作书，述说在我们中间所成就的事，是照传道的人从起初亲眼看见又传给我们的。"],[3,"这些事我既从起头都详细考察了，就定意要按着次序写给你，"],[4,"使你知道所学之道都是确实的。"],[5,"当犹太王希律的时候，亚比雅班里有一个祭司，名叫撒迦利亚。他妻子是亚伦的后人，名叫伊利沙白。"],[6,"他们二人在神面前都是义人，遵行主的一切诫命礼仪，没有可指摘的。"],[7,"只是没有孩子，因为伊利沙白不生育，两个人又年纪老迈了。"],[8,"撒迦利亚按班次，在神面前供祭司的职分，"],[9,"照祭司的规矩掣签，得进主殿烧香。"],[10,"烧香的时候，众百姓在外面祷告。"],[11,"有主的使者站在香坛的右边向他显现。"],[12,"撒迦利亚看见，就惊慌害怕。"],[13,"天使对他说：“撒迦利亚，不要害怕，因为你的祈祷已经被听见了。你的妻子伊利沙白要给你生一个儿子，你要给他起名叫约翰。"],[14,"你必欢喜快乐，有许多人因他出世也必喜乐。"],[15,"他在主面前将要为大，淡酒浓酒都不喝，从母腹里就被圣灵充满了。"],[16,"他要使许多以色列人回转，归于主他们的神。"],[17,"他必有以利亚的心志能力，行在主的前面，叫为父的心转向儿女，叫悖逆的人转从义人的智慧，又为主预备合用的百姓。”"],[18,"撒迦利亚对天使说：“我凭着什么可知道这事呢？我已经老了，我的妻子也年纪老迈了。”"],[19,"天使回答说：“我是站在神面前的加百列，奉差而来对你说话，将这好信息报给你。"],[20,"到了时候，这话必然应验。只因你不信，你必哑巴不能说话，直到这事成就的日子。”"],[21,"百姓等候撒迦利亚，诧异他许久在殿里。"],[22,"及至他出来，不能和他们说话，他们就知道他在殿里见了异象。因为他直向他们打手式，竟成了哑巴。"],[23,"他供职的日子已满，就回家去了。"],[24,"这些日子以后，他的妻子伊利沙白怀了孕，就隐藏了五个月，"],[25,"说：“主在眷顾我的日子，这样看待我，要把我在人间的羞耻除掉。”"],[26,"到了第六个月，天使加百列奉神的差遣往加利利的一座城去，这城名叫拿撒勒，"],[27,"到一个童女那里，是已经许配大卫家的一个人，名叫约瑟。童女的名字叫马利亚。"],[28,"天使进去，对她说：“蒙大恩的女子，我问你安，主和你同在了！”"],[29,"马利亚因这话就很惊慌，又反复思想这样问安是什么意思。"],[30,"天使对她说：“马利亚，不要怕！你在神面前已经蒙恩了。"],[31,"你要怀孕生子，可以给他起名叫耶稣。"],[32,"他要为大，称为至高者的儿子，主神要把他祖大卫的位给他。"],[33,"他要作雅各家的王，直到永远，他的国也没有穷尽。”"],[34,"马利亚对天使说：“我没有出嫁，怎么有这事呢？”"],[35,"天使回答说：“圣灵要临到你身上，至高者的能力要荫庇你，因此所要生的圣者，必称为神的儿子（或作“所要生的必称为圣，称为神的儿子”）。"],[36,"况且你的亲戚伊利沙白，在年老的时候也怀了男胎，就是那素来称为不生育的，现在有孕六个月了。"],[37,"因为出于神的话，没有一句不带能力的。”"],[38,"马利亚说：“我是主的使女，情愿照你的话成就在我身上。”天使就离开她去了。"],[39,"那时候马利亚起身，急忙往山地里去，来到犹大的一座城。"],[40,"进了撒迦利亚的家，问伊利沙白安。"],[41,"伊利沙白一听马利亚问安，所怀的胎就在腹里跳动，伊利沙白且被圣灵充满，"],[42,"高声喊着说：“你在妇女中是有福的，你所怀的胎也是有福的。"],[43,"我主的母到我这里来，这是从哪里得的呢？"],[44,"因为你问安的声音一入我耳，我腹里的胎就欢喜跳动。"],[45,"这相信的女子是有福的，因为主对她所说的话都要应验。”"],[46,"马利亚说：“我心尊主为大，"],[47,"我灵以神我的救主为乐。"],[48,"因为他顾念他使女的卑微，从今以后，万代要称我有福。"],[49,"那有权能的，为我成就了大事，他的名为圣。"],[50,"他怜悯敬畏他的人，直到世世代代。"],[51,"他用膀臂施展大能，那狂傲的人正心里妄想，就被他赶散了。"],[52,"他叫有权柄的失位，叫卑贱的升高，"],[53,"叫饥饿的得饱美食，叫富足的空手回去。"],[54,"他扶助了他的仆人以色列，"],[55,"为要记念亚伯拉罕和他的后裔，施怜悯直到永远，正如从前对我们列祖所说的话。”"],[56,"马利亚和伊利沙白同住约有三个月，就回家去了。"],[57,"伊利沙白的产期到了，就生了一个儿子。"],[58,"邻里亲族听见主向她大施怜悯，就和她一同欢乐。"],[59,"到了第八日，他们来要给孩子行割礼，并要照他父亲的名字，叫他撒迦利亚。"],[60,"他母亲说：“不可，要叫他约翰。”"],[61,"他们说：“你亲族中没有叫这名字的。”"],[62,"他们就向他父亲打手式，问他要叫这孩子什么名字。"],[63,"他要了一块写字的板，就写上说：“他的名字是约翰。”他们便都希奇。"],[64,"撒迦利亚的口立时开了，舌头也舒展了，就说出话来，称颂神。"],[65,"周围居住的人都惧怕。这一切的事就传遍了犹太的山地。"],[66,"凡听见的人都将这事放在心里，说：“这个孩子将来怎么样呢？因为有主与他同在。”"],[67,"他父亲撒迦利亚被圣灵充满了，就预言说："],[68,"“主以色列的神是应当称颂的，因他眷顾他的百姓，为他们施行救赎。"],[69,"在他仆人大卫家中，为我们兴起了拯救的角，"],[70,"（正如主藉着从创世以来，圣先知的口所说的话）"],[71,"拯救我们脱离仇敌和一切恨我们之人的手；"],[72,"向我们列祖施怜悯，记念他的圣约，"],[73,"就是他对我们祖宗亚伯拉罕所起的誓，"],[74,"叫我们既从仇敌手中被救出来，"],[75,"就可以终身在他面前坦然无惧地用圣洁、公义侍奉他。"],[76,"孩子啊，你要称为至高者的先知；因为你要行在主的前面，预备他的道路，"],[77,"叫他的百姓因罪得赦，就知道救恩；"],[78,"因我们神怜悯的心肠，叫清晨的日光从高天临到我们，"],[79,"要照亮坐在黑暗中死荫里的人，把我们的脚引到平安的路上。”"],[80,"那孩子渐渐长大，心灵强健，住在旷野，直到他显明在以色列人面前的日子。"]]},{"n":2,"v":[[1,"当那些日子，凯撒奥古斯都有旨意下来，叫天下人民都报名上册。"],[2,"这是居里扭作叙利亚巡抚的时候，头一次行报名上册的事。"],[3,"众人各归各城，报名上册。"],[4,"约瑟也从加利利的拿撒勒城上犹太去，到了大卫的城，名叫伯利恒。因他本是大卫一族一家的人，"],[5,"要和他所聘之妻马利亚一同报名上册。那时马利亚的身孕已经重了。"],[6,"他们在那里的时候，马利亚的产期到了，"],[7,"就生了头胎的儿子，用布包起来，放在马槽里，因为客店里没有地方。"],[8,"在伯利恒之野地里有牧羊的人，夜间按着更次看守羊群。"],[9,"有主的使者站在他们旁边，主的荣光四面照着他们，牧羊的人就甚惧怕。"],[10,"那天使对他们说：“不要惧怕，我报给你们大喜的信息，是关乎万民的。"],[11,"因今天在大卫的城里，为你们生了救主，就是主基督。"],[12,"你们要看见一个婴孩，包着布，卧在马槽里，那就是记号了。”"],[13,"忽然有一大队天兵同那天使赞美神说："],[14,"“在至高之处荣耀归与神，在地上平安归与他所喜悦的人（有古卷作“喜悦归与人”）。”"],[15,"众天使离开他们升天去了，牧羊的人彼此说：“我们往伯利恒去，看看所成的事，就是主所指示我们的。”"],[16,"他们急忙去了，就寻见马利亚和约瑟，又有那婴孩卧在马槽里。"],[17,"既然看见，就把天使论这孩子的话传开了。"],[18,"凡听见的，就诧异牧羊之人对他们所说的话。"],[19,"马利亚却把这一切的事存在心里，反复思想。"],[20,"牧羊的人回去了，因所听见、所看见的一切事，正如天使向他们所说的，就归荣耀与神，赞美他。"],[21,"满了八天，就给孩子行割礼，与他起名叫耶稣，这就是没有成胎以前，天使所起的名。"],[22,"按摩西律法满了洁净的日子，他们带着孩子上耶路撒冷去，要把他献与主。"],[23,"（正如主的律法上所记：“凡头生的男子必称圣归主。”）"],[24,"又要照主的律法上所说，或用一对斑鸠，或用两只雏鸽献祭。"],[25,"在耶路撒冷有一个人名叫西面。这人又公义又虔诚，素常盼望以色列的安慰者来到，又有圣灵在他身上。"],[26,"他得了圣灵的启示，知道自己未死以前，必看见主所立的基督。"],[27,"他受了圣灵的感动，进入圣殿，正遇见耶稣的父母抱着孩子进来，要照律法的规矩办理。"],[28,"西面就用手接过他来，称颂神说："],[29,"“主啊，如今可以照你的话，释放仆人安然去世，"],[30,"因为我的眼睛已经看见你的救恩，"],[31,"就是你在万民面前所预备的，"],[32,"是照亮外邦人的光，又是你民以色列的荣耀。”"],[33,"孩子的父母因这论耶稣的话就希奇。"],[34,"-"],[35,"西面给他们祝福，又对孩子的母亲马利亚说：“这孩子被立，是要叫以色列中许多人跌倒，许多人兴起；又要作毁谤的话柄，叫许多人心里的意念显露出来；你自己的心也要被刀刺透。”"],[36,"又有女先知名叫亚拿，是亚设支派法内力的女儿，年纪已经老迈，从作童女出嫁的时候，同丈夫住了七年就寡居了。"],[37,"现在已经八十四岁（或作“就寡居了八十四年”），并不离开圣殿，禁食祈求，昼夜侍奉神。"],[38,"正当那时，她进前来称谢神，将孩子的事对一切盼望耶路撒冷得救赎的人讲说。"],[39,"约瑟和马利亚照主的律法办完了一切的事，就回加利利，到自己的城拿撒勒去了。"],[40,"孩子渐渐长大，强健起来，充满智慧，又有神的恩在他身上。"],[41,"每年到逾越节，他父母就上耶路撒冷去。"],[42,"当他十二岁的时候，他们按着节期的规矩上去。"],[43,"守满了节期，他们回去，孩童耶稣仍旧在耶路撒冷。他的父母并不知道，"],[44,"以为他在同行的人中间，走了一天的路程，就在亲族和熟识的人中找他，"],[45,"既找不着，就回耶路撒冷去找他。"],[46,"过了三天，就遇见他在殿里，坐在教师中间，一面听，一面问。"],[47,"凡听见他的，都希奇他的聪明和他的应对。"],[48,"他父母看见就很希奇。他母亲对他说：“我儿，为什么向我们这样行呢？看哪，你父亲和我伤心来找你。”"],[49,"耶稣说：“为什么找我呢？岂不知我应当以我父的事为念吗？（或作“岂不知我应当在我父的家里吗”）？”"],[50,"他所说的这话，他们不明白。"],[51,"他就同他们下去，回到拿撒勒，并且顺从他们。他母亲把这一切的事都存在心里。"],[52,"耶稣的智慧和身量（“身量”或作“年纪”），并神和人喜爱他的心，都一齐增长。"]]},{"n":3,"v":[[1,"凯撒提庇留在位第十五年，本丢彼拉多作犹太巡抚，希律作加利利分封的王，他兄弟腓力作以土利亚和特拉可尼地方分封的王，吕撒聂作亚比利尼分封的王，"],[2,"亚那和该亚法作大祭司。那时，撒迦利亚的儿子约翰在旷野里，神的话临到他。"],[3,"他就来到约旦河一带地方，宣讲悔改的洗礼，使罪得赦。"],[4,"正如先知以赛亚书上所记的话，说：“在旷野有人声喊着说：‘预备主的道，修直他的路。"],[5,"一切山洼都要填满，大小山冈都要削平。弯弯曲曲的地方要改为正直，高高低低的道路要改为平坦。"],[6,"凡有血气的，都要见神的救恩。’”"],[7,"约翰对那出来要受他洗的众人说：“毒蛇的种类！谁指示你们逃避将来的忿怒呢？"],[8,"你们要结出果子来，与悔改的心相称。不要自己心里说：‘有亚伯拉罕为我们的祖宗。’我告诉你们：神能从这些石头中，给亚伯拉罕兴起子孙来。"],[9,"现在斧子已经放在树根上，凡不结好果子的树就砍下来，丢在火里。”"],[10,"众人问他说：“这样，我们当作什么呢？”"],[11,"约翰回答说：“有两件衣裳的，就分给那没有的；有食物的，也当这样行。”"],[12,"又有税吏来要受洗，问他说：“夫子，我们当作什么呢？”"],[13,"约翰说：“除了例定的数目，不要多取。”"],[14,"又有兵丁问他说：“我们当作什么呢？”约翰说：“不要以强暴待人，也不要讹诈人，自己有钱粮就当知足。”"],[15,"百姓指望基督来的时候，人都心里猜疑，或者约翰是基督。"],[16,"约翰说：“我是用水给你们施洗，但有一位能力比我更大的要来，我就是给他解鞋带也不配。他要用圣灵与火给你们施洗。"],[17,"他手里拿着簸箕，要扬净他的场，把麦子收在仓里，把糠用不灭的火烧尽了。”"],[18,"约翰又用许多别的话劝百姓，向他们传福音。"],[19,"只是分封的王希律因他兄弟之妻希罗底的缘故，并因他所行的一切恶事，受了约翰的责备；"],[20,"又另外添了一件，就是把约翰收在监里。"],[21,"众百姓都受了洗，耶稣也受了洗。正祷告的时候，天就开了，"],[22,"圣灵降临在他身上，形状彷佛鸽子，又有声音从天上来，说：“你是我的爱子，我喜悦你！”"],[23,"耶稣开头传道，年纪约有三十岁。依人看来，他是约瑟的儿子，约瑟是希里的儿子，"],[24,"
