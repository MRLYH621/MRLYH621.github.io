希里是玛塔的儿子，玛塔是利未的儿子，利未是麦基的儿子，麦基是雅拿的儿子，雅拿是约瑟的儿子，"],[25,"约瑟是玛他提亚的儿子，玛他提亚是亚摩斯的儿子，亚摩斯是拿鸿的儿子，拿鸿是以斯利的儿子，以斯利是拿该的儿子，"],[26,"拿该是玛押的儿子，玛押是玛他提亚的儿子，玛他提亚是西美的儿子，西美是约瑟的儿子，约瑟是犹大的儿子，犹大是约亚拿的儿子，"],[27,"约亚拿是利撒的儿子，利撒是所罗巴伯的儿子，所罗巴伯是撒拉铁的儿子，撒拉铁是尼利的儿子，尼利是麦基的儿子，"],[28,"麦基是亚底的儿子，亚底是哥桑的儿子，哥桑是以摩当的儿子，以摩当是珥的儿子，珥是约细的儿子，"],[29,"约细是以利以谢的儿子，以利以谢是约令的儿子，约令是玛塔的儿子，玛塔是利未的儿子，"],[30,"利未是西缅的儿子，西缅是犹大的儿子，犹大是约瑟的儿子，约瑟是约南的儿子，约南是以利亚敬的儿子，"],[31,"以利亚敬是米利亚的儿子，米利亚是买南的儿子，买南是玛达他的儿子，玛达他是拿单的儿子，拿单是大卫的儿子，"],[32,"大卫是耶西的儿子，耶西是俄备得的儿子，俄备得是波阿斯的儿子，波阿斯是撒门的儿子，撒门是拿顺的儿子，"],[33,"拿顺是亚米拿达的儿子，亚米拿达是亚兰的儿子，亚兰是希斯仑的儿子，希斯仑是法勒斯的儿子，法勒斯是犹大的儿子，"],[34,"犹大是雅各的儿子，雅各是以撒的儿子，以撒是亚伯拉罕的儿子，亚伯拉罕是他拉的儿子，他拉是拿鹤的儿子，"],[35,"拿鹤是西鹿的儿子，西鹿是拉吴的儿子，拉吴是法勒的儿子，法勒是希伯的儿子，希伯是色拉的儿子，"],[36,"色拉是该南的儿子，该南是亚法撒的儿子，亚法撒是闪的儿子，闪是挪亚的儿子，挪亚是拉麦的儿子，"],[37,"拉麦是玛土撒拉的儿子，玛土撒拉是以诺的儿子，以诺是雅列的儿子，雅列是玛勒列的儿子，玛勒列是该南的儿子，该南是以挪士的儿子，"],[38,"以挪士是塞特的儿子，塞特是亚当的儿子，亚当是神的儿子。"]]},{"n":4,"v":[[1,"耶稣被圣灵充满，从约旦河回来，圣灵将他引到旷野，四十天受魔鬼的试探。"],[2,"那些日子没有吃什么，日子满了，他就饿了。"],[3,"魔鬼对他说：“你若是神的儿子，可以吩咐这块石头变成食物。”"],[4,"耶稣回答说：“经上记着说：‘人活着不是单靠食物，乃是靠神口里所出的一切话。’”"],[5,"魔鬼又领他上了高山，霎时间把天下的万国都指给他看，"],[6,"对他说：“这一切权柄、荣华我都要给你，因为这原是交付我的，我愿意给谁就给谁。"],[7,"你若在我面前下拜，这都要归你。”"],[8,"耶稣说：“经上记着说：当拜主你的神，单要侍奉他。”"],[9,"魔鬼又领他到耶路撒冷去，叫他站在殿顶（“顶”原文作“翅”）上，对他说：“你若是神的儿子，可以从这里跳下去，"],[10,"因为经上记着说：‘主要为你吩咐他的使者保护你。"],[11,"他们要用手托着你，免得你的脚碰在石头上。’”"],[12,"耶稣对他说：“经上说：‘不可试探主你的神。’”"],[13,"魔鬼用完了各样的试探，就暂时离开耶稣。"],[14,"耶稣满有圣灵的能力，回到加利利；他的名声就传遍了四方。"],[15,"他在各会堂里教训人，众人都称赞他。"],[16,"耶稣来到拿撒勒，就是他长大的地方。在安息日，照他平常的规矩进了会堂，站起来要念圣经。"],[17,"有人把先知以赛亚的书交给他，他就打开，找到一处写着说："],[18,"“主的灵在我身上，因为他用膏膏我，叫我传福音给贫穷的人；差遣我报告：被掳的得释放，瞎眼的得看见，叫那受压制的得自由，"],[19,"报告神悦纳人的禧年。”"],[20,"于是把书卷起来，交还执事，就坐下。会堂里的人都定睛看他。"],[21,"耶稣对他们说：“今天这经应验在你们耳中了。”"],[22,"众人都称赞他，并希奇他口中所出的恩言。又说：“这不是约瑟的儿子吗？”"],[23,"耶稣对他们说：“你们必引这俗语向我说：‘医生，你医治自己吧！我们听见你在迦百农所行的事，也当行在你自己家乡里。’”"],[24,"又说：“我实在告诉你们：没有先知在自己家乡被人悦纳的。"],[25,"我对你们说实话：当以利亚的时候，天闭塞了三年零六个月，遍地有大饥荒。那时，以色列中有许多寡妇，"],[26,"以利亚并没有奉差往她们一个人那里去，只奉差往西顿的撒勒法一个寡妇那里去。"],[27,"先知以利沙的时候，以色列中有许多长大麻风的，但内中除了叙利亚国的乃缦，没有一个得洁净的。”"],[28,"会堂里的人听见这话，都怒气满胸，"],[29,"就起来撵他出城。他们的城造在山上，他们带他到山崖，要把他推下去。"],[30,"他却从他们中间直行，过去了。"],[31,"耶稣下到迦百农，就是加利利的一座城，在安息日教训众人。"],[32,"他们很希奇他的教训，因为他的话里有权柄。"],[33,"在会堂里有一个人被污鬼的精气附着，大声喊叫说："],[34,"“唉！拿撒勒的耶稣，我们与你有什么相干？你来灭我们吗？我知道你是谁，乃是神的圣者。”"],[35,"耶稣责备他说：“不要作声，从这人身上出来吧！”鬼把那人摔倒在众人中间，就出来了，却也没有害他。"],[36,"众人都惊讶，彼此对问说：“这是什么道理呢？因为他用权柄能力吩咐污鬼，污鬼就出来。”"],[37,"于是耶稣的名声传遍了周围地方。"],[38,"耶稣出了会堂，进了西门的家。西门的岳母害热病甚重，有人为她求耶稣。"],[39,"耶稣站在她旁边，斥责那热病，热就退了。她立刻起来服侍他们。"],[40,"日落的时候，凡有病人的，不论害什么病，都带到耶稣那里。耶稣按手在他们各人身上，医好他们。"],[41,"又有鬼从好些人身上出来，喊着说：“你是神的儿子！”耶稣斥责他们，不许他们说话，因为他们知道他是基督。"],[42,"天亮的时候，耶稣出来，走到旷野地方。众人去找他，到了他那里，要留住他，不要他离开他们。"],[43,"但耶稣对他们说：“我也必须在别城传神国的福音，因我奉差原是为此。”"],[44,"于是耶稣在加利利的各会堂传道。"]]},{"n":5,"v":[[1,"耶稣站在革尼撒勒湖边，众人拥挤他，要听神的道。"],[2,"他见有两只船湾在湖边，打鱼的人却离开船洗网去了。"],[3,"有一只船是西门的。耶稣就上去，请他把船撑开，稍微离岸，就坐下，从船上教训众人。"],[4,"讲完了，对西门说：“把船开到水深之处，下网打鱼。”"],[5,"西门说：“夫子，我们整夜劳力，并没有打着什么。但依从你的话，我就下网。”"],[6,"他们下了网，就圈住许多鱼，网险些裂开，"],[7,"便招呼那只船上的同伴来帮助。他们就来，把鱼装满了两只船，甚至船要沉下去。"],[8,"西门彼得看见，就俯伏在耶稣膝前，说：“主啊，离开我，我是个罪人！”"],[9,"他和一切同在的人都惊讶这一网所打的鱼。"],[10,"他的伙伴西庇太的儿子雅各、约翰，也是这样。耶稣对西门说：“不要怕！从今以后你要得人了。”"],[11,"他们把两只船拢了岸，就撇下所有的，跟从了耶稣。"],[12,"有一回，耶稣在一个城里，有人满身长了大麻风，看见他，就俯伏在地，求他说：“主若肯，必能叫我洁净了。”"],[13,"耶稣伸手摸他，说：“我肯，你洁净了吧！”大麻风立刻就离了他的身。"],[14,"耶稣嘱咐他：“你切不可告诉人，只要去把身体给祭司察看，又要为你得了洁净，照摩西所吩咐的献上礼物，对众人作证据。”"],[15,"但耶稣的名声越发传扬出去。有极多的人聚集来听道，也指望医治他们的病。"],[16,"耶稣却退到旷野去祷告。"],[17,"有一天耶稣教训人，有法利赛人和教法师在旁边坐着，他们是从加利利各乡村和犹太并耶路撒冷来的。主的能力与耶稣同在，使他能医治病人。"],[18,"有人用褥子抬着一个瘫子，要抬进去放在耶稣面前，"],[19,"却因人多，寻不出法子抬进去，就上了房顶，从瓦间把他连褥子缒到当中，正在耶稣面前。"],[20,"耶稣见他们的信心，就对瘫子说：“你的罪赦了。”"],[21,"文士和法利赛人就议论说：“这说僭妄话的是谁？除了神以外，谁能赦罪呢？”"],[22,"耶稣知道他们所议论的，就说：“你们心里议论的是什么呢？"],[23,"或说：‘你的罪赦了’，或说：‘你起来行走’，哪一样容易呢？"],[24,"但要叫你们知道人子在地上有赦罪的权柄。”就对瘫子说：“我吩咐你起来，拿你的褥子回家去吧！”"],[25,"那人当众人面前立刻起来，拿着他所躺卧的褥子回家去，归荣耀与神。"],[26,"众人都惊奇，也归荣耀与神，并且满心惧怕说：“我们今日看见非常的事了。”"],[27,"这事以后，耶稣出去，看见一个税吏，名叫利未，坐在税关上，就对他说：“你跟从我来！”"],[28,"他就撇下所有的，起来跟从了耶稣。"],[29,"利未在自己家里为耶稣大摆筵席，有许多税吏和别人与他们一同坐席。"],[30,"法利赛人和文士就向耶稣的门徒发怨言说：“你们为什么和税吏并罪人一同吃喝呢？”"],[31,"耶稣对他们说：“无病的人用不着医生，有病的人才用得着。"],[32,"我来本不是召义人悔改，乃是召罪人悔改。”"],[33,"他们说：“约翰的门徒屡次禁食祈祷，法利赛人的门徒也是这样；惟独你的门徒又吃又喝。”"],[34,"耶稣对他们说：“新郎和陪伴之人同在的时候，岂能叫陪伴之人禁食呢？"],[35,"但日子将到，新郎要离开他们，那日他们就要禁食了。”"],[36,"耶稣又设一个比喻，对他们说：“没有人把新衣服撕下一块来，补在旧衣服上。若是这样，就把新的撕破了，并且所撕下来的那块新的和旧的也不相称。"],[37,"也没有人把新酒装在旧皮袋里。若是这样，新酒必将皮袋裂开，酒便漏出来，皮袋也就坏了。"],[38,"但新酒必须装在新皮袋里。"],[39,"没有人喝了陈酒又想喝新的，他总说陈的好。”"]]},{"n":6,"v":[[1,"有一个安息日，耶稣从麦地经过。他的门徒掐了麦穗，用手搓着吃。"],[2,"有几个法利赛人说：“你们为什么作安息日不可作的事呢？”"],[3,"耶稣对他们说：“经上记着大卫和跟从他的人饥饿之时所作的事，连这个你们也没有念过吗？"],[4,"他怎么进了神的殿，拿陈设饼吃，又给跟从的人吃？这饼除了祭司以外，别人都不可吃。”"],[5,"又对他们说：“人子是安息日的主。”"],[6,"又有一个安息日，耶稣进了会堂教训人。在那里有一个人右手枯干了。"],[7,"文士和法利赛人窥探耶稣，在安息日治病不治病，要得把柄去告他。"],[8,"耶稣却知道他们的意念，就对那枯干一只手的人说：“起来！站在当中。”那人就起来站着。"],[9,"耶稣对他们说：“我问你们，在安息日行善行恶，救命害命，哪样是可以的呢？”"],[10,"他就周围看着他们众人，对那人说：“伸出手来！”他把手一伸，手就复了原。"],[11,"他们就满心大怒，彼此商议怎样处治耶稣。"],[12,"那时，耶稣出去上山祷告，整夜祷告神。"],[13,"到了天亮，叫他的门徒来，就从他们中间挑选十二个人，称他们为使徒。"],[14,"这十二个人有西门，耶稣又给他起名叫彼得，还有他兄弟安得烈，又有雅各和约翰、腓力和巴多罗买，"],[15,"马太和多马，亚勒腓的儿子雅各和奋锐党的西门，"],[16,"雅各的儿子犹大（“儿子“或作“兄弟”）和卖主的加略人犹大。"],[17,"耶稣和他们下了山，站在一块平地上。同站的有许多门徒，又有许多百姓，从犹太全地和耶路撒冷并推罗、西顿的海边来，都要听他讲道，又指望医治他们的病。"],[18,"还有被污鬼缠磨的，也得了医治。"],[19,"众人都想要摸他，因为有能力从他身上发出来，医好了他们。"],[20,"耶稣举目看着门徒说：“你们贫穷的人有福了，因为神的国是你们的；"],[21,"你们饥饿的人有福了，因为你们将要饱足；你们哀哭的人有福了，因为你们将要喜笑；"],[22,"人为人子恨恶你们，拒绝你们，辱骂你们，弃掉你们的名，以为是恶，你们就有福了。"],[23,"当那日，你们要欢喜跳跃，因为你们在天上的赏赐是大的，他们的祖宗待先知也是这样。"],[24,"“但你们富足的人有祸了，因为你们受过你们的安慰；"],[25,"你们饱足的人有祸了，因为你们将要饥饿；你们喜笑的人有祸了，因为你们将要哀恸哭泣；"],[26,"人都说你们好的时候，你们就有祸了，因为他们的祖宗待假先知也是这样。”"],[27,"“只是我告诉你们这听道的人，你们的仇敌，要爱他；恨你们的，要待他好；"],[28,"咒诅你们的，要为他祝福；凌辱你们的，要为他祷告。"],[29,"有人打你这边的脸，连那边的脸也由他打。有人夺你的外衣，连里衣也由他拿去。"],[30,"凡求你的，就给他。有人夺你的东西去，不用再要回来。"],[31,"你们愿意人怎样待你们，你们也要怎样待人。"],[32,"你们若单爱那爱你们的人，有什么可酬谢的呢？就是罪人也爱那爱他们的人。"],[33,"你们若善待那善待你们的人，有什么可酬谢的呢？就是罪人也是这样行。"],[34,"你们若借给人，指望从他收回，有什么可酬谢的呢？就是罪人也借给罪人，要如数收回。"],[35,"你们倒要爱仇敌，也要善待他们，并要借给人不指望偿还，你们的赏赐就必大了，你们也必作至高者的儿子，因为他恩待那忘恩的和作恶的。"],[36,"你们要慈悲，像你们的父慈悲一样。”"],[37,"“你们不要论断人，就不被论断；你们不要定人的罪，就不被定罪；你们要饶恕人，就必蒙饶恕（“饶恕”原文作“释放”）。"],[38,"你们要给人，就必有给你们的，并且用十足的升斗，连摇带按、上尖下流地倒在你们怀里；因为你们用什么量器量给人，也必用什么量器量给你们。”"],[39,"耶稣又用比喻对他们说：“瞎子岂能领瞎子，两个人不是都要掉在坑里吗？"],[40,"学生不能高过先生；凡学成了的不过和先生一样。"],[41,"为什么看见你弟兄眼中有刺，却不想自己眼中有梁木呢？"],[42,"你不见自己眼中有梁木，怎能对你弟兄说：‘容我去掉你眼中的刺’呢？你这假冒为善的人，先去掉自己眼中的梁木，然后才能看得清楚，去掉你弟兄眼中的刺。”"],[43,"“因为，没有好树结坏果子，也没有坏树结好果子。"],[44,"凡树木看果子，就可以认出它来。人不是从荆棘上摘无花果，也不是从蒺藜里摘葡萄。"],[45,"善人从他心里所存的善，就发出善来；恶人从他心里所存的恶，就发出恶来。因为心里所充满的，口里就说出来。”"],[46,"“你们为什么称呼我‘主啊，主啊’，却不遵我的话行呢？"],[47,"凡到我这里来，听见我的话就去行的，我要告诉你们他像什么人。"],[48,"他像一个人盖房子，深深地挖地，把根基安在磐石上。到发大水的时候，水冲那房子，房子总不能摇动，因为根基立在磐石上（有古卷作“因为盖造得好”）。"],[49,"惟有听见不去行的，就像一个人在土地上盖房子，没有根基；水一冲，随即倒塌了，并且那房子坏得很大。”"]]},{"n":7,"v":[[1,"耶稣对百姓讲完了这一切的话，就进了迦百农。"],[2,"有一个百夫长所宝贵的仆人，害病快要死了。"],[3,"百夫长风闻耶稣的事，就托犹太人的几个长老，去求耶稣来救他的仆人。"],[4,"他们到了耶稣那里，就切切地求他说：“你给他行这事是他所配得的，"],[5,"因为他爱我们的百姓，给我们建造会堂。”"],[6,"耶稣就和他们同去。离那家不远，百夫长托几个朋友去见耶稣，对他说：“主啊，不要劳动，因你到我舍下，我不敢当！"],[7,"我也自以为不配去见你，只要你说一句话，我的仆人就必好了。"],[8,"因为我在人的权下，也有兵在我以下。对这个说：‘去！’他就去；对那个说：‘来！’他就来；对我的仆人说：‘你作这事！’他就去作。”"],[9,"耶稣听见这话，就希奇他，转身对跟随的众人说：“我告诉你们：这么大的信心，就是在以色列中我也没有遇见过。”"],[10,"那托来的人回到百夫长家里，看见仆人已经好了。"],[11,"过了不多时（有古卷作“次日”），耶稣往一座城去，这城名叫拿因。他的门徒和极多的人与他同行。"],[12,"将近城门，有一个死人被抬出来。这人是他母亲独生的儿子，他母亲又是寡妇，有城里的许多人同着寡妇送殡。"],[13,"主看见那寡妇，就怜悯她，对她说：“不要哭！”"],[14,"于是进前按着杠，抬的人就站住了。耶稣说：“少年人，我吩咐你起来！”"],[15,"那死人就坐起，并且说话。耶稣便把他交给他母亲。"],[16,"众人都惊奇，归荣耀与神说：“有大先知在我们中间兴起来了。”又说：“神眷顾了他的百姓。”"],[17,"他这事的风声就传遍了犹太和周围地方。"],[18,"约翰的门徒把这些事都告诉约翰。"],[19,"他便叫了两个门徒来，打发他们到主那里去，说：“那将要来的是你吗？还是我们等候别人呢？”"],[20,"那两个人来到耶稣那里，说：“施洗的约翰打发我们来问你：‘那将要来的是你吗？还是我们等候别人呢？’”"],[21,"正当那时候，耶稣治好了许多有疾病的，受灾患的，被恶鬼附着的，又开恩叫好些瞎子能看见。"],[22,"耶稣回答说：“你们去把所看见、所听见的事告诉约翰，就是瞎子看见，瘸子行走，长大麻风的洁净，聋子听见，死人复活，穷人有福音传给他们。"],[23,"凡不因我跌倒的，就有福了。”"],[24,"约翰所差来的人既走了，耶稣就对众人讲论约翰说：“你们从前出去到旷野，是要看什么呢？要看风吹动的芦苇吗？"],[25,"你们出去到底是要看什么？要看穿细软衣服的人吗？那穿华丽衣服、宴乐度日的人是在王宫里。"],[26,"你们出去究竟是要看什么？要看先知吗？我告诉你们：是的，他比先知大多了。"],[27,"经上记着说：‘我要差遣我的使者在你前面预备道路。’所说的就是这个人。"],[28,"我告诉你们：凡妇人所生的，没有一个大过约翰的；然而神国里最小的比他还大。”"],[29,"众百姓和税吏既受过约翰的洗，听见这话，就以神为义。"],[30,"但法利赛人和律法师没有受过约翰的洗，竟为自己废弃了神的旨意。（29、30两节或作“众百姓和税吏听见了约翰的话，就受了他的洗，便以神为义；但法利赛人和律法师不受约翰的洗，竟为自己废弃了神的旨意”）。"],[31,"主又说：“这样，我可用什么比这世代的人呢？他们好像什么呢？"],[32,"好像孩童坐在街市上，彼此呼叫说：‘我们向你们吹笛，你们不跳舞；我们向你们举哀，你们不啼哭。’"],[33,"施洗的约翰来，不吃饼，不喝酒，你们说他是被鬼附着的。"],[34,"人子来，也吃也喝，你们说他是贪食好酒的人，是税吏和罪人的朋友。"],[35,"但智慧之子，都以智慧为是。”"],[36,"有一个法利赛人请耶稣和他吃饭，耶稣就到法利赛人家里去坐席。"],[37,"那城里有一个女人，是个罪人，知道耶稣在法利赛人家里坐席，就拿着盛香膏的玉瓶，"],[38,"站在耶稣背后，挨着他的脚哭，眼泪湿了耶稣的脚，就用自己的头发擦干，又用嘴连连亲他的脚，把香膏抹上。"],[39,"请耶稣的法利赛人看见这事，心里说：“这人若是先知，必知道摸他的是谁，是个怎样的女人，乃是个罪人。”"],[40,"耶稣对他说：“西门，我有句话要对你说。”西门说：“夫子，请说。”"],[41,"耶稣说：“一个债主有两个人欠他的债：一个欠五十两银子，一个欠五两银子，"],[42,"因为他们无力偿还，债主就开恩免了他们两个人的债。这两个人哪一个更爱他呢？”"],[43,"西门回答说：“我想是那多得恩免的人。”耶稣说：“你断的不错。”"],[44,"于是转过来向着那女人，便对西门说：“你看见这女人吗？我进了你的家，你没有给我水洗脚，但这女人用眼泪湿了我的脚，用头发擦干；"],[45,"你没有与我亲嘴，但这女人从我进来的时候就不住地用嘴亲我的脚；"],[46,"你没有用油抹我的头，但这女人用香膏抹我的脚。”"],[47,"所以我告诉你，她许多的罪都赦免了，因为她的爱多。但那赦免少的，他的爱就少。”"],[48,"于是对那女人说：“你的罪赦免了。”"],[49,"同席的人心里说：“这是什么人，竟赦免人的罪呢？”"],[50,"耶稣对那女人说：“你的信救了你，平平安安地回去吧！”"]]},{"n":8,"v":[[1,"过了不多日，耶稣周游各城、各乡传道，宣讲神国的福音。和他同去的有十二个门徒，"],[2,"还有被恶鬼所附、被疾病所累、已经治好的几个妇女，内中有称为抹大拉的马利亚，曾有七个鬼从她身上赶出来；"],[3,"又有希律的家宰苦撒的妻子约亚拿，并苏撒拿，和好些别的妇女，都是用自己的财物供给耶稣和门徒。"],[4,"当许多人聚集，又有人从各城里出来见耶稣的时候，耶稣就用比喻说："],[5,"“有一个撒种的出去撒种。撒的时候，有落在路旁的，被人践踏，天上的飞鸟又来吃尽了；"],[6,"有落在磐石上的，一出来就枯干了，因为得不着滋润；"],[7,"有落在荆棘里的，荆棘一同生长，把它挤住了；"],[8,"又有落在好土里的，生长起来，结实百倍。”耶稣说了这些话，就大声说：“有耳可听的，就应当听！”"],[9,"门徒问耶稣说：“这比喻是什么意思呢？”"],[10,"他说：“神国的奥秘只叫你们知道；至于别人，就用比喻，叫他们看也看不见，听也听不明。”"],[11,"“这比喻乃是这样：种子就是神的道。"],[12,"那些在路旁的，就是人听了道，随后魔鬼来，从他们心里把道夺去，恐怕他们信了得救；"],[13,"那些在磐石上的，就是人听道，欢喜领受，但心中没有根，不过暂时相信，及至遇见试炼就退后了，"],[14,"那落在荆棘里的，就是人听了道，走开以后，被今生的思虑、钱财、宴乐挤住了，便结不出成熟的子粒来；"],[15,"那落在好土里的，就是人听了道，持守在诚实、善良的心里，并且忍耐着结实。”"],[16,"“没有人点灯用器皿盖上，或放在床底下，乃是放在灯台上，叫进来的人看见亮光。"],[17,"因为掩藏的事没有不显出来的；隐瞒的事，没有不露出来被人知道的。"],[18,"所以你们应当小心怎样听。因为凡有的，还要加给他；凡没有的，连他自以为有的，也要夺去。”"],[19,"耶稣的母亲和他弟兄来了，因为人多，不得到他跟前。"],[20,"有人告诉他说：“你母亲和你弟兄站在外边，要见你。”"],[21,"耶稣回答说：“听了神之道而遵行的人，就是我的母亲、我的弟兄了。”"],[22,"有一天，耶稣和门徒上了船，对门徒说：“我们可以渡到湖那边去。”他们就开了船。"],[23,"正行的时候，耶稣睡着了。湖上忽然起了暴风，船将满了水，甚是危险。"],[24,"门徒来叫醒了他，说：“夫子，夫子，我们丧命啦！”耶稣醒了，斥责那狂风大浪，风浪就止住，平静了。"],[25,"耶稣对他们说：“你们的信心在哪里呢？”他们又惧怕又希奇，彼此说：“这到底是谁？他吩咐风和水，连风和水也听从他了。”"],[26,"他们到了格拉森（有古卷作“加大拉”）人的地方，就是加利利的对面。"],[27,"耶稣上了岸，就有城里一个被鬼附着的人迎面而来。这个人许久不穿衣服，不住房子，只住在坟茔里。"],[28,"他见了耶稣，就俯伏在他面前，大声喊叫说：“至高神的儿子耶稣，我与你有什么相干？求你不要叫我受苦。”"],[29,"是因耶稣曾吩咐污鬼从那人身上出来。原来这鬼屡次抓住他，他常被人看守，又被铁链和脚镣捆锁。他竟把锁链挣断，被鬼赶到旷野去。"],[30,"耶稣问他说：“你名叫什么？”他说：“我名叫群。”这是因为附着他的鬼多。"],[31,"鬼就央求耶稣，不要吩咐他们到无底坑里去。"],[32,"那里有一大群猪在山上吃食。鬼央求耶稣，准他们进入猪里去。耶稣准了他们。"],[33,"鬼就从那人出来，进入猪里去。于是那群猪闯下山崖，投在湖里淹死了。"],[34,"放猪的看见这事就逃跑了，去告诉城里和乡下的人。"],[35,"众人出来要看是什么事。到了耶稣那里，看见鬼所离开的那人坐在耶稣脚前，穿着衣服，心里明白过来，他们就害怕。"],[36,"看见这事的，便将被鬼附着的人怎么得救告诉他们。"],[37,"格拉森四围的人因为害怕得很，都求耶稣离开他们，耶稣就上船回去了。"],[38,"鬼所离开的那人恳求和耶稣同在，耶稣却打发他回去，说："],[39,"“你回家去，传说神为你作了何等大的事。”他就去满城里传扬耶稣为他作了何等大的事。"],[40,"耶稣回来的时候，众人迎接他，因为他们都等候他。"],[41,"有一个管会堂的，名叫睚鲁，来俯伏在耶稣脚前，求耶稣到他家里去。"],[42,"因他有一个独生女儿，约有十二岁，快要死了。耶稣去的时候，众人拥挤他。"],[43,"有一个女人，患了十二年的血漏，在医生手里花尽了她一切养生的，并没有一人能医好她。"],[44,"她来到耶稣背后，摸他的衣裳繸子，血漏立刻就止住了。"],[45,"耶稣说：“摸我的是谁？”众人都不承认。彼得和同行的人都说：“夫子，众人拥拥挤挤紧靠着你。（有古卷在此有“你还问摸我的是谁吗？”）”"],[46,"耶稣说：“总有人摸我，因我觉得有能力从我身上出去。”"],[47,"那女人知道不能隐藏，就战战兢兢地来俯伏在耶稣脚前，把摸他的缘故和怎样立刻得好了，当着众人都说出来。"],[48,"耶稣对她说：“女儿，你的信救了你，平平安安地去吧！”"],[49,"还说话的时候，有人从管会堂的家里来，说：“你的女儿死了，不要劳动夫子。”"],[50,"耶稣听见就对他说：“不要怕，只要信，你的女儿就必得救！”"],[51,"耶稣到了他的家，除了彼得、约翰、雅各和女儿的父母，不许别人同他进去。"],[52,"众人都为这女儿哀哭捶胸。耶稣说：“不要哭，她不是死了，是睡着了。”"],[53,"他们晓得女儿已经死了，就嗤笑耶稣。"],[54,"耶稣拉着她的手，呼叫说：“女儿，起来吧！”"],[55,"她的灵魂便回来，她就立刻起来了。耶稣吩咐给她东西吃。"],[56,"她的父母惊奇得很。耶稣嘱咐他们，不要把所作的事告诉人。"]]},{"n":9,"v":[[1,"耶稣叫齐了十二个门徒，给他们能力、权柄，制伏一切的鬼，医治各样的病，"],[2,"又差遣他们去宣传神国的道，医治病人。"],[3,"对他们说：“行路的时候，不要带拐杖和口袋，不要带食物和银子，也不要带两件褂子。"],[4,"无论进哪一家，就住在那里，也从那里起行。"],[5,"凡不接待你们的，你们离开那城的时候，要把脚上的尘土跺下去，见证他们的不是。”"],[6,"门徒就出去，走遍各乡，宣传福音，到处治病。"],[7,"分封的王希律听见耶稣所作的一切事，就游移不定，因为有人说是约翰从死里复活，"],[8,"又有人说是以利亚显现，还有人说是古时的一个先知又活了。"],[9,"希律说：“约翰我已经斩了，这却是什么人？我竟听见他这样的事呢？”就想要见他。"],[10,"使徒回来，将所作的事告诉耶稣。耶稣就带他们暗暗地离开那里，往一座城去，那城名叫伯赛大。"],[11,"但众人知道了，就跟着他去。耶稣便接待他们，对他们讲论神国的道，医治那些需医的人。"],[12,"日头快要平西，十二个门徒来对他说：“请叫众人散开，他们好往四面乡村里去借宿，找吃的，因为我们这里是野地。”"],[13,"耶稣说：“你们给他们吃吧！”门徒说：“我们不过有五个饼、两条鱼，若不去为这许多人买食物，就不够。”"],[14,"那时，人数约有五千。耶稣对门徒说：“叫他们一排一排地坐下，每排大约五十个人。”"],[15,"门徒就如此行，叫众人都坐下。"],[16,"耶稣拿着这五个饼、两条鱼，望着天祝福、擘开，递给门徒摆在众人面前。"],[17,"他们就吃，并且都吃饱了，把剩下的零碎收拾起来，装满了十二篮子。"],[18,"耶稣自己祷告的时候，门徒也同他在那里。耶稣问他们说：“众人说我是谁？”"],[19,"他们说：“有人说是施洗的约翰，有人说是以利亚，还有人说是古时的一个先知又活了。”"],[20,"耶稣说：“你们说我是谁？”彼得回答说：“是神所立的基督。”"],[21,"耶稣切切地嘱咐他们，不可将这事告诉人。"],[22,"又说：“人子必须受许多的苦，被长老、祭司长和文士弃绝，并且被杀，第三日复活。”"],[23,"耶稣又对众人说：“若有人要跟从我，就当舍己，天天背起他的十字架来跟从我。"],[24,"因为凡要救自己生命的（“生命”或作“灵魂”。下同），必丧掉生命；凡为我丧掉生命的，必救了生命。"],[25,"人若赚得全世界，却丧了自己，赔上自己，有什么益处呢？"],[26,"凡把我和我的道当作可耻的，人子在自己的荣耀里，并天父与圣天使的荣耀里降临的时候，也要把那人当作可耻的。"],[27,"我实在告诉你们：站在这里的，有人在没尝死味以前，必看见神的国。”"],[28,"说了这话以后约有八天，耶稣带着彼得、约翰、雅各上山去祷告。"],[29,"正祷告的时候，他的面貌就改变了，衣服洁白放光。"],[30,"忽然有摩西、以利亚两个人，同耶稣说话。"],[31,"他们在荣光里显现，谈论耶稣去世的事，就是他在耶路撒冷将要成的事。"],[32,"彼得和他的同伴都打盹，既清醒了，就看见耶稣的荣光，并同他站着的那两个人。"],[33,"二人正要和耶稣分离的时候，彼得对耶稣说：“夫子，我们在这里真好，可以搭三座棚：一座为你，一座为摩西，一座为以利亚。”他却不知道所说的是什么。"],[34,"说这话的时候，有一朵云彩来遮盖他们。他们进入云彩里就惧怕。"],[35,"有声音从云彩里出来，说：“这是我的儿子（有古卷作“这是我的爱子”），我所拣选的，你们要听他。”"],[36,"声音住了，只见耶稣一人在那里。当那些日子，门徒不提所看见的事，一样也不告诉人。"],[37,"第二天，他们下了山，就有许多人迎见耶稣。"],[38,"其中有一人喊叫说：“夫子，求你看顾我的儿子，因为他是我的独生子。"],[39,"他被鬼抓住，就忽然喊叫。鬼又叫他抽风，口中流沫，并且重重地伤害他，难以离开他。"],[40,"我求过你的门徒把鬼赶出去，他们却是不能。”"],[41,"耶稣说：“嗳！这又不信又悖谬的世代啊，我在你们这里，忍耐你们要到几时呢？将你的儿子带到这里来吧！”"],[42,"正来的时候，鬼把他摔倒，叫他重重地抽风。耶稣就斥责那污鬼，把孩子治好了，交给他父亲。"],[43,"众人都诧异神的大能（“大能”或作“威荣”）。耶稣所作的一切事，众人正希奇的时候，耶稣对门徒说："],[44,"“你们要把这些话存在耳中，因为人子将要被交在人手里。”"],[45,"他们不明白这话，意思乃是隐藏的，叫他们不能明白，他们也不敢问这话的意思。"],[46,"门徒中间起了议论：谁将为大。"],[47,"耶稣看出他们心中的议论，就领一个小孩子来，叫他站在自己旁边，"],[48,"对他们说：“凡为我名接待这小孩子的，就是接待我；凡接待我的，就是接待那差我来的。你们中间最小的，他便为大。”"],[49,"约翰说：“夫子，我们看见一个人奉你的名赶鬼，我们就禁止他，因为他不与我们一同跟从你。”"],[50,"耶稣说：“不要禁止他，因为不敌挡你们的，就是帮助你们的。”"],[51,"耶稣被接上升的日子将到，他就定意向耶路撒冷去，"],[52,"便打发使者在他前头走。他们到了撒玛利亚的一个村庄，要为他预备。"],[53,"那里的人不接待他，因他面向耶路撒冷去。"],[54,"他的门徒雅各、约翰看见了，就说：“主啊，你要我们吩咐火从天上降下来烧灭他们，像以利亚所作的吗（有古卷无“像以利亚所作的”）？”"],[55,"耶稣转身责备两个门徒说：“你们的心如何，你们并不知道。"],[56,"人子来不是要灭人的性命（“性命”或作“灵魂”。下同），是要救人的性命。”说着就往别的村庄去了（有古卷只有55节首句，56节末句）。"],[57,"他们走路的时候，有一人对耶稣说：“你无论往哪里去，我要跟从你。”"],[58,"耶稣说：“狐狸有洞，天空的飞鸟有窝，只是人子没有枕头的地方。”"],[59,"又对一个人说：“跟从我来！”那人说：“主，容我先回去埋葬我的父亲。”"],[60,"耶稣说：“任凭死人埋葬他们的死人，你只管去传扬神国的道。”"],[61,"又有一人说：“主，我要跟从你，但容我先去辞别我家里的人。”"],[62,"耶稣说：“手扶着犁向后看的，不配进神的国。”"]]},{"n":10,"v":[[1,"这事以后，主又设立七十个人，差遣他们两个两个地在他前面，往自己所要到的各城、各地方去。"],[2,"就对他们说：“要收的庄稼多，作工的人少。所以你们当求庄稼的主，打发工人出去收他的庄稼。"],[3,"你们去吧！我差你们出去，如同羊羔进入狼群。"],[4,"不要带钱囊，不要带口袋，不要带鞋，在路上也不要问人的安。"],[5,"无论进哪一家，先要说：‘愿这一家平安！’"],[6,"那里若有当得平安的人（“当得平安的人”原文作“平安之子”），你们所求的平安就必临到那家；不然，就归与你们了。"],[7,"你们要住在那家，吃喝他们所供给的，因为工人得工价是应当的。不要从这家搬到那家。"],[8,"无论进哪一城，人若接待你们，给你们摆上什么，你们就吃什么"],[9,"要医治那城里的病人，对他们说：‘神的国临近你们了。’"],[10,"无论进哪一城，人若不接待你们，你们就到街上去，"],[11,"说：‘就是你们城里的尘土粘在我们的脚上，我们也当着你们擦去。虽然如此，你们该知道神的国临近了。’"],[12,"我告诉你们：当审判的日子，所多玛所受的，比那城还容易受呢！”"],[13,"“哥拉汛哪，你有祸了！伯赛大啊，你有祸了！因为在你们中间所行的异能，若行在推罗、西顿，他们早已披麻蒙灰坐在地上悔改了。"],[14,"当审判的日子，推罗、西顿所受的比你们还容易受呢。"],[15,"迦百农啊！你已经升到天上（或作“你将要升到天上吗？”），将来必推下阴间。”"],[16,"又对门徒说：“听从你们的就是听从我；弃绝你们的就是弃绝我；弃绝我的就是弃绝那差我来的。”"],[17,"那七十个人欢欢喜喜地回来说：“主啊，因你的名，就是鬼也服了我们。”"],[18,"耶稣对他们说：“我曾看见撒但从天上坠落，像闪电一样。"],[19,"我已经给你们权柄可以践踏蛇和蝎子，又胜过仇敌一切的能力，断没有什么能害你们。"],[20,"然而不要因鬼服了你们就欢喜，要因你们的名记录在天上欢喜。”"],[21,"正当那时，耶稣被圣灵感动就欢乐，说：“父啊，天地的主，我感谢你！因为你将这些事向聪明通达人就藏起来，向婴孩就显出来。父啊，是的，因为你的美意本是如此。"],[22,"一切所有的都是我父交付我的。除了父，没有人知道子是谁；除了子和子所愿意指示的，没有人知道父是谁。”"],[23,"耶稣转身暗暗地对门徒说：“看见你们所看见的，那眼睛就有福了。"],[24,"我告诉你们：从前有许多先知和君王要看你们所看的，却没有看见；要听你们所听的，却没有听见。”"],[25,"有一个律法师起来试探耶稣说：“夫子，我该作什么才可以承受永生？”"],[26,"耶稣对他说：“律法上写的是什么？你念的是怎样呢？”"],[27,"他回答说：“你要尽心、尽性、尽力、尽意爱主你的神；又要爱邻舍如同自己。”"],[28,"耶稣说：“你回答的是。你这样行，就必得永生。”"],[29,"那人要显明自己有理，就对耶稣说：“谁是我的邻舍呢？”"],[30,"耶稣回答说：“有一个人从耶路撒冷下耶利哥去，落在强盗手中。他们剥去他的衣裳，把他打个半死，就丢下他走了。"],[31,"偶然有一个祭司从这条路下来，看见他，就从那边过去了。"],[32,"又有一个利未人来到这地方，看见他，也照样从那边过去了。"],[33,"惟有一个撒玛利亚人行路来到那里，看见他，就动了慈心，"],[34,"上前用油和酒倒在他的伤处，包裹好了，扶他骑上自己的牲口，带到店里去照应他。"],[35,"第二天，拿出二钱银子来交给店主说：‘你且照应他，此外所费用的，我回来必还你。’"],[36,"你想，这三个人哪一个是落在强盗手中的邻舍呢？”"],[37,"他说：“是怜悯他的。”耶稣说：“你去照样行吧。”"],[38,"他们走路的时候，耶稣进了一个村庄。有一个女人名叫马大，接他到自己家里。"],[39,"她有一个妹子名叫马利亚，在耶稣脚前坐着听他的道。"],[40,"马大伺候的事多，心里忙乱，就进前来说：“主啊，我的妹子留下我一个人伺候，你不在意吗？请吩咐她来帮助我。”"],[41,"耶稣回答说：“马大，马大！你为许多的事思虑烦扰，"],[42,"但是不可少的只有一件，马利亚已经选择那上好的福分，是不能夺去的。”"]]},{"n":11,"v":[[1,"耶稣在一个地方祷告。祷告完了，有个门徒对他说：“求主教导我们祷告，像约翰教导他的门徒。”"],[2,"耶稣说：“你们祷告的时候要说：‘我们在天上的父（有古卷只作“父啊”），愿人都尊你的名为圣。愿你的国降临。愿你的旨意行在地上如同行在天上（有古卷没有“愿你的旨意云云”）。"],[3,"我们日用的饮食，天天赐给我们。"],[4,"赦免我们的罪，因为我们也赦免凡亏欠我们的人。不叫我们遇见试探，救我们脱离凶恶（有古卷无末句）。’”"],[5,"耶稣又说：“你们中间谁有一个朋友半夜到他那里去说：‘朋友，请借给我三个饼，"],[6,"因为我有一个朋友行路，来到我这里，我没有什么给他摆上。’"],[7,"那人在里面回答说：‘不要搅扰我，门已经关闭，孩子们也同我在床上了，我不能起来给你。’"],[8,"我告诉你们：虽不因他是朋友起来给他，但因他情词迫切地直求，就必起来照他所需用的给他。"],[9,"我又告诉你们：你们祈求，就给你们；寻找，就寻见；叩门，就给你们开门。"],[10,"因为凡祈求的，就得着；寻找的，就寻见；叩门的，就给他开门。"],[11,"你们中间作父亲的，谁有儿子求饼，反给他石头呢？求鱼，反拿蛇当鱼给他呢？"],[12,"求鸡蛋，反给他蝎子呢？"],[13,"你们虽然不好，尚且知道拿好东西给儿女，何况天父，岂不更将圣灵给求他的人吗？”"],[14,"耶稣赶出一个叫人哑巴的鬼。鬼出去了，哑巴就说出话来，众人都希奇。"],[15,"内中却有人说：“他是靠着鬼王别西卜赶鬼。”"],[16,"又有人试探耶稣，向他求从天上来的神迹。"],[17,"他晓得他们的意念，便对他们说：“凡一国自相纷争，就成为荒场；凡一家自相纷争，就必败落。"],[18,"若撒但自相纷争，他的国怎能站得住呢？因为你们说我是靠着别西卜赶鬼。"],[19,"我若靠着别西卜赶鬼，你们的子弟赶鬼又靠着谁呢？这样，他们就要断定你们的是非。"],[20,"我若靠着神的能力赶鬼，这就是神的国临到你们了。"],[21,"壮士披挂整齐，看守自己的住宅，他所有的都平安无事。"],[22,"但有一个比他更壮的来，胜过他，就夺去他所倚靠的盔甲、兵器，又分了他的赃。"],[23,"不与我相合的，就是敌我的；不同我收聚的，就是分散的。”"],[24,"“污鬼离了人身，就在无水之地过来过去，寻求安歇之处。既寻不着，便说：‘我要回到我所出来的屋里去。’"],[25,"到了，就看见里面打扫干净，修饰好了，"],[26,"便去另带了七个比自己更恶的鬼来，都进去住在那里。那人末后的景况比先前更不好了。”"],[27,"耶稣正说这话的时候，众人中间有一个女人大声说：“怀你胎的和乳养你的有福了。”"],[28,"耶稣说：“是，却还不如听神之道而遵守的人有福。”"],[29,"当众人聚集的时候，耶稣开讲说：“这世代是一个邪恶的世代，他们求看神迹，除了约拿的神迹以外，再没有神迹给他们看。"],[30,"约拿怎样为尼尼微人成了神迹，人子也要照样为这世代的人成了神迹。"],[31,"当审判的时候，南方的女王要起来定这世代的罪，因为她从地极而来，要听所罗门的智慧话。看哪，在这里有一人比所罗门更大。"],[32,"当审判的时候，尼尼微人要起来定这世代的罪，因为尼尼微人听了约拿所传的就悔改了。看哪，在这里有一人比约拿更大。”"],[33,"“没有人点灯放在地窨子里或是斗底下，总是放在灯台上，使进来的人得见亮光。"],[34,"你眼睛就是身上的灯。你的眼睛若了亮，全身就光明；眼睛若昏花，全身就黑暗。"],[35,"所以你要省察，恐怕你里头的光或者黑暗了。"],[36,"若是你全身光明，毫无黑暗，就必全然光明，如同灯的明光照亮你。”"],[37,"说话的时候，有一个法利赛人请耶稣同他吃饭，耶稣就进去坐席。"],[38,"这法利赛人看见耶稣饭前不洗手便诧异。"],[39,"主对他说：“如今你们法利赛人洗净杯盘的外面，你们里面却满了勒索和邪恶。"],[40,"无知的人哪，造外面的，不也造里面吗？"],[41,"只要把里面的施舍给人，凡物于你们就都洁净了。"],[42,"“你们法利赛人有祸了！因为你们将薄荷、芸香并各样菜蔬献上十分之一，那公义和爱神的事反倒不行了。这原是你们当行的，那也是不可不行的。"],[43,"你们法利赛人有祸了！因为你们喜爱会堂里的首位，又喜爱人在街市上问你们的安。"],[44,"你们有祸了！因为你们如同不显露的坟墓，走在上面的人并不知道。”"],[45,"律法师中有一个回答耶稣说：“夫子，你这样说也把我们糟蹋了。”"],[46,"耶稣说：“你们律法师也有祸了！因为你们把难担的担子放在人身上，自己一个指头却不肯动。"],[47,"你们有祸了！因为你们修造先知的坟墓，那先知正是你们的祖宗所杀的。"],[48,"可见你们祖宗所作的事，你们又证明、又喜欢，因为他们杀了先知，你们修造先知的坟墓。"],[49,"所以神用智慧曾说（“用智慧”或作“的智者”）：‘我要差遣先知和使徒到他们那里去。有的他们要杀害；有的他们要逼迫’，"],[50,"使创世以来，所流众先知血的罪，都要问在这世代的人身上，"],[51,"就是从亚伯的血起，直到被杀在坛和殿中间撒迦利亚的血为止。我实在告诉你们：这都要问在这世代的人身上。"],[52,"你们律法师有祸了！因为你们把知识的钥匙夺了去，自己不进去，正要进去的人，你们也阻挡他们。”"],[53,"耶稣从那里出来，文士和法利赛人就极力地催逼他，引动他多说话，"],[54,"私下窥听，要拿他的话柄。"]]},{"n":12,"v":[[1,"这时，有几万人聚集，甚至彼此践踏。耶稣开讲，先对门徒说：“你们要防备法利赛人的酵，就是假冒为善。"],[2,"掩盖的事，没有不露出来的；隐藏的事，没有不被人知道的。"],[3,"因此，你们在暗中所说的，将要在明处被人听见；在内室附耳所说的，将要在房上被人宣扬。"],[4,"我的朋友，我对你们说：“那杀身体以后不能再作什么的，不要怕他们。"],[5,"我要指示你们当怕的是谁，当怕那杀了以后又有权柄丢在地狱里的。我实在告诉你们：正要怕他。"],[6,"五个麻雀不是卖二分银子吗？但在神面前，一个也不忘记，"],[7,"就是你们的头发，也都被数过了。不要惧怕，你们比许多麻雀还贵重。”"],[8,"我又告诉你们：“凡在人面前认我的，人子在神的使者面前也必认他；"],[9,"在人面前不认我的，人子在神的使者面前也必不认他。"],[10,"凡说话干犯人子的，还可得赦免；惟独亵渎圣灵的，总不得赦免。"],[11,"人带你们到会堂并官府和有权柄的人面前，不要思虑怎么分诉，说什么话；"],[12,"因为正在那时候，圣灵要指教你们当说的话。”"],[13,"众人中有一个人对耶稣说：“夫子，请你吩咐我的兄长和我分开家业。”"],[14,"耶稣说：“你这个人，谁立我作你们断事的官，给你们分家业呢？”"],[15,"于是对众人说：“你们要谨慎自守，免去一切的贪心；因为人的生命不在乎家道丰富。”"],[16,"就用比喻对他们说：“有一个财主，田产丰盛，"],[17,"自己心里思想说：‘我的出产没有地方收藏，怎么办呢？’"],[18,"又说：‘我要这么办：要把我的仓房拆了，另盖更大的，在那里好收藏我一切的粮食和财物，"],[19,"然后要对我的灵魂说：灵魂哪，你有许多财物积存，可作多年的费用，只管安安逸逸地吃喝快乐吧！’"],[20,"神却对他说：‘无知的人哪，今夜必要你的灵魂，你所预备的要归谁呢？’"],[21,"凡为自己积财，在神面前却不富足的，也是这样。”"],[22,"耶稣又对门徒说：“所以我告诉你们：不要为生命忧虑吃什么，为身体忧虑穿什么；"],[23,"因为生命胜于饮食，身体胜于衣裳。"],[24,"你想，乌鸦也不种，也不收，又没有仓，又没有库，神尚且养活它。你们比飞鸟是何等地贵重呢！"],[25,"你们哪一个能用思虑使寿数多加一刻呢（或作“使身量多加一肘呢”）？"],[26,"这最小的事你们尚且不能作，为什么还忧虑其余的事呢？"],[27,"你想，百合花怎么长起来？它也不劳苦，也不纺线。然而我告诉你们：就是所罗门极荣华的时候，他所穿戴的，还不如这花一朵呢！"],[28,"你们这小信的人哪，野地里的草今天还在，明天就丢在炉里，神还给它这样的妆饰，何况你们呢！"],[29,"你们不要求吃什么，喝什么，也不要挂心。"],[30,"这都是外邦人所求的。你们必须用这些东西，你们的父是知道的。"],[31,"你们只要求他的国，这些东西就必加给你们了。"],[32,"你们这小群，不要惧怕，因为你们的父乐意把国赐给你们。"],[33,"你们要变卖所有的周济人，为自己预备永不坏的钱囊，用不尽的财宝在天上，就是贼不能近、虫不能蛀的地方。"],[34,"因为你们的财宝在哪里，你们的心也在那里。”"],[35,"“你们腰里要束上带，灯也要点着。"],[36,"自己好像仆人等候主人从婚姻的筵席上回来。他来到叩门，就立刻给他开门。"],[37,"主人来了，看见仆人警醒，那仆人就有福了。我实在告诉你们：主人必叫他们坐席，自己束上带，进前伺候他们。"],[38,"或是二更天来，或是三更天来，看见仆人这样，那仆人就有福了。"],[39,"家主若知道贼什么时候来，就必警醒，不容贼挖透房屋，这是你们所知道的。"],[40,"你们也要预备，因为你们想不到的时候，人子就来了。”"],[41,"彼得说：“主啊，这比喻是为我们说的呢，还是为众人呢？”"],[42,"主说：“谁是那忠心有见识的管家，主人派他管理家里的人，按时分粮给他们呢？"],[43,"主人来到，看见仆人这样行，那仆人就有福了。"],[44,"我实在告诉你们：主人要派他管理一切所有的。"],[45,"那仆人若心里说：‘我的主人必来得迟’，就动手打仆人和使女，并且吃喝醉酒。"],[46,"在他想不到的日子，不知道的时辰，那仆人的主人要来，重重地处治他（或作“把他腰斩了”），定他和不忠心的人同罪。"],[47,"仆人知道主人的意思，却不预备，又不顺他的意思行，那仆人必多受责打；"],[48,"惟有那不知道的，作了当受责打的事，必少受责打。因为多给谁，就向谁多取；多托谁，就向谁多要。”"],[49,"“我来，要把火丢在地上，倘若已经着起来，不也是我所愿意的吗？"],[50,"我有当受的洗还没有成就，我是何等的迫切呢？"],[51,"你们以为我来，是叫地上太平吗？我告诉你们：不是，乃是叫人纷争。"],[52,"从今以后，一家五个人将要纷争：三个人和两个人相争，两个人和三个人相争；"],[53,"父亲和儿子相争，儿子和父亲相争；母亲和女儿相争，女儿和母亲相争；婆婆和媳妇相争，媳妇和婆婆相争。”"],[54,"耶稣又对众人说：“你们看见西边起了云彩，就说：‘要下一阵雨’，果然就有；"],[55,"起了南风，就说‘将要燥热’，也就有了。"],[56,"假冒为善的人哪，你们知道分辨天地的气色，怎么不知道分辨这时候呢？”"],[57,"“你们又为何不自己审量什么是合理的呢？"],[58,"你同告你的对头去见官，还在路上，务要尽力地和他了结；恐怕他拉你到官面前，官交付差役，差役把你下在监里。"],[59,"我告诉你，若有半文钱没有还清，你断不能从那里出来。”"]]},{"n":13,"v":[[1,"正当那时，有人将彼拉多使加利利人的血搀杂在他们祭物中的事告诉耶稣。"],[2,"耶稣说：“你们以为这些加利利人比众加利利人更有罪，所以受这害吗？"],[3,"我告诉你们，不是的。你们若不悔改，都要如此灭亡！"],[4,"从前西罗亚楼倒塌了，压死十八个人，你们以为那些人比一切住在耶路撒冷的人更有罪吗？"],[5,"我告诉你们，不是的。你们若不悔改，都要如此灭亡！”"],[6,"于是用比喻说：“一个人有一棵无花果树，栽在葡萄园里。他来到树前找果子，却找不着，"],[7,"就对管园的说：‘看哪，我这三年，来到这无花果树前找果子，竟找不着。把它砍了吧，何必白占地土呢！’"],[8,"管园的说：‘主啊，今年且留着，等我周围掘开土，加上粪，"],[9,"以后若结果子便罢，不然，再把它砍了。’”"],[10,"安息日，耶稣在会堂里教训人。"],[11,"有一个女人被鬼附着，病了十八年，腰弯得一点直不起来。"],[12,"耶稣看见，便叫过她来，对她说：“女人，你脱离这病了！”"],[13,"于是用两只手按着她，她立刻直起腰来，就归荣耀与神。"],[14,"管会堂的因为耶稣在安息日治病，就气忿忿地对众人说：“有六日应当作工，那六日之内可以来求医，在安息日却不可。”"],[15,"主说：“假冒为善的人哪，难道你们各人在安息日不解开槽上的牛驴，牵去饮吗？"],[16,"况且这女人本是亚伯拉罕的后裔，被撒但捆绑了这十八年，不当在安息日解开她的绑吗？”"],[17,"耶稣说这话，他的敌人都惭愧了；众人因他所行一切荣耀的事，就都欢喜了。"],[18,"耶稣说：“神的国好像什么？我拿什么来比较呢？"],[19,"好像一粒芥菜种，有人拿去种在园子里，长大成树，天上的飞鸟宿在它的枝上。”"],[20,"又说：“我拿什么来比神的国呢？"],[21,"好比面酵，有妇人拿来藏在三斗面里，直等全团都发起来。”"],[22,"耶稣往耶路撒冷去，在所经过的各城、各乡教训人。"],[23,"有一个人问他说：“主啊，得救的人少吗？”"],[24,"耶稣对众人说：“你们要努力进窄门。我告诉你们：将来有许多人想要进去，却是不能。"],[25,"及至家主起来关了门，你们站在外面叩门，说：‘主啊，给我们开门！’他就回答说：‘我不认识你们，不晓得你们是哪里来的！’"],[26,"那时，你们要说：‘我们在你面前吃过、喝过，你也在我们的街上教训过人。’"],[27,"他要说：‘我告诉你们，我不晓得你们是哪里来的。你们这一切作恶的人离开我去吧！’"],[28,"你们要看见亚伯拉罕、以撒、雅各和众先知都在神的国里，你们却被赶到外面，在那里必要哀哭切齿了。"],[29,"从东、从西、从南、从北将有人来，在神的国里坐席。"],[30,"只是有在后的，将要在前；有在前的，将要在后。”"],[31,"正当那时，有几个法利赛人来对耶稣说：“离开这里去吧！因为希律想要杀你。”"],[32,"耶稣说：“你们去告诉那个狐狸说，今天、明天我赶鬼治病，第三天我的事就成全了。’"],[33,"虽然这样，今天、明天、后天，我必须前行，因为先知在耶路撒冷之外丧命是不能的。"],[34,"耶路撒冷啊，耶路撒冷啊！你常杀害先知，又用石头打死那奉差遣到你这里来的人。我多次愿意聚集你的儿女，好像母鸡把小鸡聚集在翅膀底下，只是你们不愿意。"],[35,"看哪，你们的家成为荒场留给你们。我告诉你们：从今以后，你们不得再见我，直等到你们说‘奉主名来的是应当称颂的。’”"]]},{"n":14,"v":[[1,"安息日，耶稣到一个法利赛人的首领家里去吃饭，他们就窥探他。"],[2,"在他面前有一个患水臌的人。"],[3,"耶稣对律法师和法利赛人说：“安息日治病可以不可以？”"],[4,"他们却不言语。耶稣就治好那人，叫他走了。"],[5,"便对他们说：“你们中间谁有驴或有牛在安息日掉在井里，不立时拉它上来呢？”"],[6,"他们不能对答这话。"],[7,"耶稣见所请的客拣择首位，就用比喻对他们说："],[8,"“你被人请去赴婚姻的筵席，不要坐在首位上，恐怕有比你尊贵的客被他请来。"],[9,"那请你们的人前来对你说：‘让座给这一位吧！’你就羞羞惭惭地退到末位上去了。"],[10,"你被请的时候，就去坐在末位上，好叫那请你的人来对你说：‘朋友，请上座。’那时，你在同席的人面前就有光彩了。"],[11,"因为凡自高的，必降为卑；自卑的，必升为高。”"],[12,"耶稣又对请他的人说：“你摆设午饭或晚饭，不要请你的朋友、弟兄、亲属和富足的邻舍，恐怕他们也请你，你就得了报答。"],[13,"你摆设筵席，倒要请那贫穷的、残废的、瘸腿的、瞎眼的，你就有福了！"],[14,"因为他们没有什么可报答你。到义人复活的时候，你要得着报答。”"],[15,"同席的有一人听见这话，就对耶稣说：“在神国里吃饭的有福了！”"],[16,"耶稣对他说：“有一人摆设大筵席，请了许多客。"],[17,"到了坐席的时候，打发仆人去对所请的人说：‘请来吧！样样都齐备了。’"],[18,"众人一口同音地推辞。头一个说：‘我买了一块地，必须去看看。请你准我辞了。’"],[19,"又有一个说：‘我买了五对牛，要去试一试。请你准我辞了。’"],[20,"又有一个说：‘我才娶了妻，所以不能去。’"],[21,"那仆人回来，把这事都告诉了主人。家主就动怒，对仆人说：‘快出去，到城里大街小巷，领那贫穷的、残废的、瞎眼的、瘸腿的来。’"],[22,"仆人说：‘主啊，你所吩咐的已经办了，还有空座。’"],[23,"主人对仆人说：‘你出去到路上和篱笆那里，勉强人进来，坐满我的屋子。"],[24,"我告诉你们：先前所请的人，没有一个得尝我的筵席。’”"],[25,"有极多的人和耶稣同行。他转过来对他们说："],[26,"“人到我这里来，若不爱我胜过爱自己的父母、妻子、儿女、弟兄、姐妹和自己的性命，就不能作我的门徒（“爱我胜过爱”原文作“恨”）；"],[27,"凡不背着自己十字架跟从我的，也不能作我的门徒。"],[28,"你们哪一个要盖一座楼，不先坐下算计花费，能盖成不能呢？"],[29,"恐怕安了地基，不能成功，看见的人都笑话他，"],[30,"说：‘这个人开了工，却不能完工。’"],[31,"或是一个王出去和别的王打仗，岂不先坐下酌量，能用一万兵去敌那领二万兵来攻打他的吗？"],[32,"若是不能，就趁敌人还远的时候，派使者去求和息的条款。"],[33,"这样，你们无论什么人，若不撇下一切所有的，就不能作我的门徒。”"],[34,"“盐本是好的，盐若失了味，可用什么叫它再咸呢？"],[35,"或用在田里，或堆在粪里，都不合式，只好丢在外面。有耳可听的，就应当听！”"]]},{"n":15,"v":[[1,"众税吏和罪人都挨近耶稣，要听他讲道。"],[2,"法利赛人和文士私下议论说：“这个人接待罪人，又同他们吃饭。”"],[3,"耶稣就用比喻说："],[4,"“你们中间谁有一百只羊失去一只，不把这九十九只撇在旷野，去找那失去的羊，直到找着呢？"],[5,"找着了，就欢欢喜喜地扛在肩上，回到家里，"],[6,"就请朋友邻舍来，对他们说：‘我失去的羊已经找着了，你们和我一同欢喜吧！’"],[7,"我告诉你们：一个罪人悔改，在天上也要这样为他欢喜，较比为九十九个不用悔改的义人欢喜更大。”"],[8,"“或是一个妇人有十块钱，若失落一块，岂不点上灯，打扫屋子，细细地找，直到找着吗？"],[9,"找着了，就请朋友邻舍来，对他们说：‘我失落的那块钱已经找着了，你们和我一同欢喜吧！’"],[10,"我告诉你们：一个罪人悔改，在神的使者面前也是这样为他欢喜。”"],[11,"耶稣又说：“一个人有两个儿子。"],[12,"小儿子对父亲说：‘父亲，请你把我应得的家业分给我。’他父亲就把产业分给他们。"],[13,"过了不多几日，小儿子就把他一切所有的都收拾起来，往远方去了。在那里任意放荡，浪费资财。"],[14,"既耗尽了一切所有的，又遇着那地方大遭饥荒，就穷苦起来。"],[15,"于是去投靠那地方的一个人，那人打发他到田里去放猪。"],[16,"他恨不得拿猪所吃的豆荚充饥，也没有人给他。"],[17,"他醒悟过来，就说：‘我父亲有多少的雇工，口粮有余，我倒在这里饿死吗？"],[18,"我要起来，到我父亲那里去，向他说：父亲，我得罪了天，又得罪了你，"],[19,"从今以后，我不配称为你的儿子，把我当作一个雇工吧！’"],[20,"于是起来，往他父亲那里去。相离还远，他父亲看见，就动了慈心，跑去抱着他的颈项，连连与他亲嘴。"],[21,"儿子说：‘父亲，我得罪了天，又得罪了你，从今以后，我不配称为你的儿子。’"],[22,"父亲却吩咐仆人说：‘把那上好的袍子快拿出来给他穿，把戒指戴在他指头上，把鞋穿在他脚上，"],[23,"把那肥牛犊牵来宰了，我们可以吃喝快乐。"],[24,"因为我这个儿子是死而复活，失而又得的。’他们就快乐起来。"],[25,"那时，大儿子正在田里。他回来离家不远，听见作乐跳舞的声音，"],[26,"便叫过一个仆人来，问是什么事。"],[27,"仆人说：‘你兄弟来了。你父亲因为得他无灾无病地回来，把肥牛犊宰了。’"],[28,"大儿子却生气，不肯进去。他父亲就出来劝他。"],[29,"他对父亲说：‘我服侍你这多年，从来没有违背过你的命，你并没有给我一只山羊羔，叫我和朋友一同快乐。"],[30,"但你这个儿子和娼妓吞尽了你的产业，他一来了，你倒为他宰了肥牛犊。’"],[31,"父亲对他说：‘儿啊，你常和我同在，我一切所有的都是你的；"],[32,"只是你这个兄弟是死而复活、失而又得的，所以我们理当欢喜快乐。’”"]]},{"n":16,"v":[[1,"耶稣又对门徒说：“有一个财主的管家，别人向他主人告他浪费主人的财物。"],[2,"主人叫他来，对他说：‘我听见你这事怎么样呢？把你所经管的交代明白，因你不能再作我的管家。’"],[3,"那管家心里说：‘主人辞我，不用我再作管家，我将来作什么？锄地呢？无力；讨饭呢？怕羞。"],[4,"我知道怎么行，好叫人在我不作管家之后，接我到他们家里去。’"],[5,"于是，把欠他主人债的，一个一个地叫了来，问头一个说：‘你欠我主人多少？’"],[6,"他说：‘一百篓油（每篓约五十斤）。’管家说：‘拿你的账，快坐下，写五十。’"],[7,"又问一个说：‘你欠多少？’他说：‘一百石麦子。’管家说：‘拿你的账写八十。’"],[8,"主人就夸奖这不义的管家作事聪明，因为今世之子，在世事之上，较比光明之子更加聪明。"],[9,"我又告诉你们：要藉着那不义的钱财结交朋友，到了钱财无用的时候，他们可以接你们到永存的帐幕里去。"],[10,"人在最小的事上忠心，在大事上也忠心；在最小的事上不义，在大事上也不义。"],[11,"倘若你们在不义的钱财上不忠心，谁还把那真实的钱财托付你们呢？"],[12,"倘若你们在别人的东西上不忠心，谁还把你们自己的东西给你们呢？”"],[13,"一个仆人不能侍奉两个主，不是恶这个爱那个，就是重这个轻那个；你们不能又侍奉神，又侍奉玛门。”"],[14,"法利赛人是贪爱钱财的，他们听见这一切话，就嗤笑耶稣。"],[15,"耶稣对他们说：“你们是在人面前自称为义的，你们的心，神却知道；因为人所尊贵的，是神看为可憎恶的。"],[16,"律法和先知到约翰为止，从此神国的福音传开了，人人努力要进去。"],[17,"天地废去较比律法的一点一画落空还容易。"],[18,"凡休妻另娶的就是犯奸淫；娶被休之妻的也是犯奸淫。”"],[19,"“有一个财主，穿着紫色袍和细麻布衣服，天天奢华宴乐。"],[20,"又有一个讨饭的，名叫拉撒路，浑身生疮，被人放在财主门口，"],[21,"要得财主桌子上掉下来的零碎充饥，并且狗来舔他的疮。"],[22,"后来那讨饭的死了，被天使带去放在亚伯拉罕的怀里。财主也死了，并且埋葬了。"],[23,"他在阴间受痛苦，举目远远地望见亚伯拉罕，又望见拉撒路在他怀里，"],[24,"就喊着说：‘我祖亚伯拉罕哪，可怜我吧！打发拉撒路来，用指头尖蘸点水，凉凉我的舌头，因为我在这火焰里，极其痛苦。’"],[25,"亚伯拉罕说：‘儿啊，你该回想你生前享过福，拉撒路也受过苦，如今他在这里得安慰，你倒受痛苦。"],[26,"不但这样，并且在你我之间，有深渊限定，以致人要从这边过到你们那边是不能的；要从那边过到我们这边也是不能的。’"],[27,"财主说：‘我祖啊，既是这样，求你打发拉撒路到我父家去，"],[28,"因为我还有五个弟兄，他可以对他们作见证，免得他们也来到这痛苦的地方。’"],[29,"亚伯拉罕说：‘他们有摩西和先知的话可以听从。’"],[30,"他说：‘我祖亚伯拉罕哪，不是的，若有一个从死里复活的，到他们那里去的，他们必要悔改。’"],[31,"亚伯拉罕说：‘若不听从摩西和先知的话，就是有一个从死里复活的，他们也是不听劝。’”"]]},{"n":17,"v":[[1,"耶稣又对门徒说：“绊倒人的事是免不了的，但那绊倒人的有祸了！"],[2,"就是把磨石拴在这人的颈项上，丢在海里，还强如他把这小子里的一个绊倒了。"],[3,"你们要谨慎。若是你的弟兄得罪你，就劝戒他；他若懊悔，就饶恕他。"],[4,"倘若他一天七次得罪你，又七次回转，说：‘我懊悔了’，你总要饶恕他。”"],[5,"使徒对主说：“求主加增我们的信心。”"],[6,"主说：“你们若有信心像一粒芥菜种，就是对这棵桑树说，‘你要拔起根来，栽在海里’，它也必听从你们。”"],[7,"“你们谁有仆人耕地或是放羊，从田里回来，就对他说，‘你快来坐下吃饭’呢？"],[8,"岂不对他说，‘你给我预备晚饭，束上带子伺候我，等我吃喝完了，你才可以吃喝’吗？"],[9,"仆人照所吩咐的去作，主人还谢谢他吗？"],[10,"这样，你们作完了一切所吩咐的，只当说：‘我们是无用的仆人，所作的本是我们应分作的。’”"],[11,"耶稣往耶路撒冷去，经过撒玛利亚和加利利，"],[12,"进入一个村子，有十个长大麻风的迎面而来，远远地站着，"],[13,"高声说：“耶稣，夫子，可怜我们吧！”"],[14,"耶稣看见，就对他们说：“你们去，把身体给祭司察看。”他们去的时候就洁净了。"],[15,"内中有一个见自己已经好了，就回来大声归荣耀与神，"],[16,"又俯伏在耶稣脚前感谢他。这人是撒玛利亚人。"],[17,"耶稣说：“洁净了的不是十个人吗？那九个在哪里呢？"],[18,"除了这外族人，再没有别人回来归荣耀与神吗？”"],[19,"就对那人说：“起来，走吧！你的信救了你了。”"],[20,"法利赛人问：“神的国几时来到？”耶稣回答说：“神的国来到，不是眼所能见的。"],[21,"人也不得说，‘看哪，在这里’，‘看哪，在那里’；因为神的国就在你们心里（“心里”或作“中间”）。”"],[22,"他又对门徒说：“日子将到，你们巴不得看见人子的一个日子，却不得看见。"],[23,"人将要对你们说：‘看哪，在那里’；‘看哪，在这里’。你们不要出去，也不要跟随他们。"],[24,"因为人子在他降临的日子，好像闪电从天这边一闪，直照到天那边。"],[25,"只是他必须先受许多苦，又被这世代弃绝。"],[26,"挪亚的日子怎样，人子的日子也要怎样。"],[27,"那时候的人又吃又喝，又娶又嫁，到挪亚进方舟的那日，洪水就来，把他们全都灭了。"],[28,"又好像罗得的日子，人又吃又喝，又买又卖，又耕种又盖造。"],[29,"到罗得出所多玛的那日，就有火与硫磺从天上降下来，把他们全都灭了。"],[30,"人子显现的日子也要这样。"],[31,"当那日，人在房上，器具在屋里，不要下来拿；人在田里，也不要回家。"],[32,"你们要回想罗得的妻子。"],[33,"凡想要保全生命的，必丧掉生命；凡丧掉生命的，必救活生命。"],[34,"我对你们说：当那一夜，两个人在一个床上，要取去一个，撇下一个；"],[35,"两个女人一同推磨，要取去一个，撇下一个。（有古卷在此有"],[36,"“两个人在田里，要取去一个，撇下一个。”）”"],[37,"门徒说：“主啊，在哪里有这事呢？”耶稣说：“尸首在哪里，鹰也必聚在那里。”"]]},{"n":18,"v":[[1,"耶稣设一个比喻，是要人常常祷告，不可灰心。"],[2,"说：“某城里有一个官，不惧怕神，也不尊重世人。"],[3,"那城里有个寡妇，常到他那里，说：‘我有一个对头，求你给我伸冤。’"],[4,"他多日不准。后来心里说：‘我虽不惧怕神，也不尊重世人；"],[5,"只因这寡妇烦扰我，我就给她伸冤吧，免得她常来缠磨我！’”"],[6,"主说：“你们听这不义之官所说的话。"],[7,"神的选民昼夜呼吁他，他纵然为他们忍了多时，岂不终久给他们伸冤吗？"],[8,"我告诉你们：要快快地给他们伸冤了。然而人子来的时候，遇得见世上有信德吗？”"],[9,"耶稣向那些仗着自己是义人，藐视别人的，设一个比喻，"],[10,"说：“有两个人上殿里去祷告：一个是法利赛人，一个是税吏。"],[11,"法利赛人站着，自言自语地祷告说：‘神啊，我感谢你，我不像别人勒索、不义、奸淫，也不像这个税吏。"],[12,"我一个礼拜禁食两次，凡我所得的，都捐上十分之一。’"],[13,"那税吏远远地站着，连举目望天也不敢，只捶着胸说：‘神啊，开恩可怜我这个罪人！’"],[14,"我告诉你们：这人回家去比那人倒算为义了。因为凡自高的，必降为卑；自卑的，必升为高。”"],[15,"有人抱着自己的婴孩来见耶稣，要他摸他们，门徒看见就责备那些人。"],[16,"耶稣却叫他们来，说：“让小孩子到我这里来，不要禁止他们，因为在神国的正是这样的人。"],[17,"我实在告诉你们：凡要承受神国的，若不像小孩子，断不能进去。”"],[18,"有一个官问耶稣说：“良善的夫子，我该作什么事才可以承受永生？”"],[19,"耶稣对他说：“你为什么称我是良善的？除了神一位之外，再没有良善的。"],[20,"诫命你是晓得的：‘不可奸淫，不可杀人，不可偷盗，不可作假见证，当孝敬父母。’”"],[21,"那人说：“这一切我从小都遵守了。”"],[22,"耶稣听见了，就说：“你还缺少一件：要变卖你一切所有的，分给穷人，就必有财宝在天上，你还要来跟从我。”"],[23,"他听见这话就甚忧愁，因为他很富足。"],[24,"耶稣看见他，就说：“有钱财的人进神的国是何等的难哪！"],[25,"骆驼穿过针的眼比财主进神的国还容易呢！”"],[26,"听见的人说：“这样，谁能得救呢？”"],[27,"耶稣说：“在人所不能的事，在神却能。”"],[28,"彼得说：“看哪，我们已经撇下自己所有的跟从你了。”"],[29,"耶稣说：“我实在告诉你们：人为神的国撇下房屋，或是妻子、弟兄、父母、儿女，"],[30,"没有在今世不得百倍，在来世不得永生的。”"],[31,"耶稣带着十二个门徒，对他们说：“看哪，我们上耶路撒冷去，先知所写的一切事都要成就在人子身上。"],[32,"他将要被交给外邦人。他们要戏弄他，凌辱他，吐唾沫在他脸上，"],[33,"并要鞭打他，杀害他，第三日他要复活。”"],[34,"这些事门徒一样也不懂得，意思乃是隐藏的，他们不晓得所说的是什么。"],[35,"耶稣将近耶利哥的时候，有一个瞎子坐在路旁讨饭，"],[36,"听见许多人经过，就问是什么事。"],[37,"他们告诉他，是拿撒勒人耶稣经过。"],[38,"他就呼叫说：“大卫的子孙耶稣啊，可怜我吧！”"],[39,"在前头走的人就责备他，不许他作声；他却越发喊叫说：“大卫的子孙，可怜我吧！”"],[40,"耶稣站住，吩咐把他领过来，到了跟前，就问他说："],[41,"“你要我为你作什么？”他说：“主啊，我要能看见！”"],[42,"耶稣说：“你可以看见！你的信救了你了。”"],[43,"瞎子立刻看见了，就跟随耶稣，一路归荣耀与神。众人看见这事，也赞美神。"]]},{"n":19,"v":[[1,"耶稣进了耶利哥，正经过的时候，"],[2,"有一个人名叫撒该，作税吏长，是个财主。"],[3,"他要看看耶稣是怎样的人，只因人多，他的身量又矮，所以不得看见，"],[4,"就跑到前头，爬上桑树，要看耶稣，因为耶稣必从那里经过。"],[5,"耶稣到了那里，抬头一看，对他说：“撒该，快下来！今天我必住在你家里。”"],[6,"他就急忙下来，欢欢喜喜地接待耶稣。"],[7,"众人看见，都私下议论说：“他竟到罪人家里去住宿。”"],[8,"撒该站着对主说：“主啊，我把所有的一半给穷人，我若讹诈了谁，就还他四倍。”"],[9,"耶稣说：“今天救恩到了这家，因为他也是亚伯拉罕的子孙。"],[10,"人子来，为要寻找、拯救失丧的人。”"],[11,"众人正在听见这些话的时候，耶稣因为将近耶路撒冷，又因他们以为神的国快要显出来，就另设一个比喻，说："],[12,"“有一个贵胄往远方去，要得国回来，"],[13,"便叫了他的十个仆人来，交给他们十锭银子（“锭”原文作“弥拿”，一“弥拿”约银十两），说：‘你们去作生意，直等我回来。’"],[14,"他本国的人却恨他，打发使者随后去，说：‘我们不愿意这个人作我们的王。’"],[15,"他既得国回来，就吩咐叫那领银子的仆人来，要知道他们作生意赚了多少。"],[16,"头一个上来，说：‘主啊，你的一锭银子已经赚了十锭。’"],[17,"主人说：‘好，良善的仆人，你既在最小的事上有忠心，可以有权柄管十座城。’"],[18,"第二个来，说：‘主啊，你的一锭银子已经赚了五锭。’"],[19,"主人说：‘你也可以管五座城。’"],[20,"又有一个来说：‘主啊，看哪，你的一锭银子在这里，我把它包在手巾里存着。"],[21,"我原是怕你，因为你是严厉的人。没有放下的，还要去拿；没有种下的，还要去收。’"],[22,"主人对他说：‘你这恶仆，我要凭你的口定你的罪。你既知道我是严厉的人，没有放下的，还要去拿，没有种下的，还要去收，"],[23,"为什么不把我的银子交给银行，等我来的时候，连本带利都可以要回来呢？’"],[24,"就对旁边站着的人说：‘夺过他这一锭来，给那有十锭的。’"],[25,"他们说：‘主啊，他已经有十锭了。’"],[26,"主人说：‘我告诉你们：凡有的，还要加给他；没有的，连他所有的，也要夺过来。"],[27,"至于我那些仇敌，不要我作他们王的，把他们拉来，在我面前杀了吧！’”"],[28,"耶稣说完了这话，就在前面走，上耶路撒冷去。"],[29,"将近伯法其和伯大尼，在一座山名叫橄榄山那里，就打发两个门徒，说："],[30,"“你们往对面村子里去，进去的时候，必看见一匹驴驹拴在那里，是从来没有人骑过的，可以解开牵来。"],[31,"若有人问为什么解它，你们就说：‘主要用它。’”"],[32,"打发的人去了，所遇见的，正如耶稣所说的。"],[33,"他们解驴驹的时候，主人问他们说：“解驴驹作什么？”"],[34,"他们说：“主要用它。”"],[35,"他们牵到耶稣那里，把自己的衣服搭在上面，扶着耶稣骑上。"],[36,"走的时候，众人把衣服铺在路上。"],[37,"将近耶路撒冷，正下橄榄山的时候，众门徒因所见过的一切异能，都欢乐起来，大声赞美神，"],[38,"说：“奉主名来的王是应当称颂的！在天上有和平，在至高之处有荣光。”"],[39,"众人中有几个法利赛人对耶稣说：“夫子，责备你的门徒吧！”"],[40,"耶稣说：“我告诉你们：若是他们闭口不说，这些石头必要呼叫起来。”"],[41,"耶稣快到耶路撒冷，看见城，就为它哀哭，"],[42,"说：“巴不得你在这日子知道关系你平安的事，无奈这事现在是隐藏的，叫你的眼看不出来。"],[43,"因为日子将到，你的仇敌必筑起土垒，周围环绕你，四面困住你。"],[44,"并要扫灭你和你里头的儿女，连一块石头也不留在石头上，因你不知道眷顾你的时候。”"],[45,"耶稣进了殿，赶出里头作买卖的人，"],[46,"对他们说：“经上说：‘我的殿必作祷告的殿’，你们倒使它成为贼窝了。”"],[47,"耶稣天天在殿里教训人。祭司长和文士与百姓的尊长都想要杀他，"],[48,"但寻不出法子来，因为百姓都侧耳听他。"]]},{"n":20,"v":[[1,"有一天，耶稣在殿里教训百姓、讲福音的时候，祭司长和文士并长老上前来，"],[2,"问他说：“你告诉我们，你仗着什么权柄作这些事？给你这权柄的是谁呢？”"],[3,"耶稣回答说：“我也要问你们一句话，你们且告诉我，"],[4,"约翰的洗礼是从天上来的，是从人间来的呢？”"],[5,"他们彼此商议说：“我们若说‘从天上来’，他必说，‘你们为什么不信他呢？’"],[6,"若说：‘从人间来’，百姓都要用石头打死我们，因为他们信约翰是先知。”"],[7,"于是回答说：“不知道是从哪里来的。”"],[8,"耶稣说：“我也不告诉你们，我仗着什么权柄作这些事。”"],[9,"耶稣就设比喻对百姓说：“有人栽了一个葡萄园，租给园户，就往外国去住了许久。"],[10,"到了时候，打发一个仆人到园户那里去，叫他们把园中当纳的果子交给他。园户竟打了他，叫他空手回去。"],[11,"又打发一个仆人去，他们也打了他，并且凌辱他，叫他空手回去。"],[12,"又打发第三个仆人去，他们也打伤了他，把他推出去了。"],[13,"园主说：‘我怎么办呢？我要打发我的爱子去，或者他们尊敬他。’"],[14,"不料，园户看见他，就彼此商量说：‘这是承受产业的，我们杀他吧，使产业归于我们！’"],[15,"于是把他推出葡萄园外杀了。这样，葡萄园的主人要怎样处治他们呢？"],[16,"他要来除灭这些园户，将葡萄园转给别人。”听见的人说：“这是万不可的。”"],[17,"耶稣看着他们说：“经上记着：‘匠人所弃的石头已作了房角的头块石头。’这是什么意思呢？"],[18,"凡掉在那石头上的，必要跌碎；那石头掉在谁的身上，就要把谁砸得稀烂。”"],[19,"文士和祭司长看出这比喻是指着他们说的，当时就想要下手拿他，只是惧怕百姓。"],[20,"于是窥探耶稣，打发奸细装作好人，要在他的话上得把柄，好将他交在巡抚的政权之下。"],[21,"奸细就问耶稣说：“夫子，我们晓得你所讲、所传都是正道，也不取人的外貌，乃是诚诚实实传神的道。”"],[22,"“我们纳税给凯撒，可以不可以？”"],[23,"耶稣看出他们的诡诈，就对他们说："],[24,"“拿一个银钱来给我看。这像和这号是谁的？”他们说：“是凯撒的。”"],[25,"耶稣说：“这样，凯撒的物当归给凯撒，神的物当归给神。”"],[26,"他们当着百姓，在这话上得不着把柄，又希奇他的应对，就闭口无言了。"],[27,"撒都该人常说没有复活的事。有几个来问耶稣说："],[28,"“夫子，摩西为我们写着说：‘人若有妻无子就死了，他兄弟当娶他的妻，为哥哥生子立后。’"],[29,"有弟兄七人，第一个娶了妻，没有孩子死了；"],[30,"第二个、第三个也娶过她；"],[31,"那七个人都娶过她，没有留下孩子就死了。"],[32,"后来妇人也死了。"],[33,"这样，当复活的时候，她是哪一个的妻子呢？因为他们七个人都娶过她。”"],[34,"耶稣说：“这世界的人有娶有嫁，"],[35,"惟有算为配得那世界，与从死里复活的人，也不娶也不嫁，"],[36,"因为他们不能再死，和天使一样，既是复活的人，就为神的儿子。"],[37,"至于死人复活，摩西在荆棘篇上称主是亚伯拉罕的神，以撒的神，雅各的神，就指示明白了。"],[38,"神原不是死人的神，乃是活人的神，因为在他那里，人都是活的（“那里”或作“看来”）。”"],[39,"有几个文士说：“夫子，你说得好！”"],[40,"以后他们不敢再问他什么。"],[41,"耶稣对他们说：“人怎么说基督是大卫的子孙呢？"],[42,"诗篇上大卫自己说：‘主对我主说，你坐在我的右边，"],[43,"等我使你仇敌作你的脚凳。’"],[44,"大卫既称他为主，他怎么又是大卫的子孙呢？”"],[45,"众百姓听的时候，耶稣对门徒说："],[46,"“你们要防备文士。他们好穿长衣游行，喜爱人在街市上问他们安，又喜爱会堂里的高位，筵席上的首座；"],[47,"他们侵吞寡妇的家产，假意作很长的祷告。这些人要受更重的刑罚。”"]]},{"n":21,"v":[[1,"耶稣抬头观看，见财主把捐项投在库里，"],[2,"又见一个穷寡妇投了两个小钱，"],[3,"就说：“我实在告诉你们，这穷寡妇所投的比众人还多，"],[4,"因为众人都是自己有余，拿出来投在捐项里；但这寡妇是自己不足，把她一切养生的都投上了。”"],[5,"有人谈论圣殿是用美石和供物妆饰的，"],[6,"耶稣就说：“论到你们所看见的这一切，将来日子到了，在这里没有一块石头留在石头上不被拆毁了。”"],[7,"他们问他说：“夫子，什么时候有这事呢？这事将到的时候，有什么预兆呢？”"],[8,"耶稣说：“你们要谨慎，不要受迷惑，因为将来有好些人冒我的名来，说：‘我是基督’，又说，‘时候近了’，你们不要跟从他们。"],[9,"你们听见打仗和扰乱的事，不要惊惶，因为这些事必须先有，只是末期不能立时就到。”"],[10,"当时耶稣对他们说：“民要攻打民，国要攻打国，"],[11,"地要大大震动，多处必有饥荒、瘟疫，又有可怕的异象和大神迹从天上显现。"],[12,"但这一切的事以先，人要下手拿住你们，逼迫你们，把你们交给会堂，并且收在监里，又为我的名拉你们到君王诸侯面前。"],[13,"但这些事终必为你们的见证。"],[14,"所以，你们当立定心意，不要预先思想怎样分诉，"],[15,"因为我必赐你们口才智慧，是你们一切敌人所敌不住、驳不倒的。"],[16,"连你们的父母、弟兄、亲族、朋友也要把你们交官，你们也有被他们害死的。"],[17,"你们要为我的名被众人恨恶，"],[18,"然而，你们连一根头发也必不损坏。"],[19,"你们常存忍耐，就必保全灵魂（或作“必得生命”）。”"],[20,"“你们看见耶路撒冷被兵围困，就可知道它成荒场的日子近了。"],[21,"那时，在犹太的应当逃到山上，在城里的应当出来，在乡下的不要进城。"],[22,"因为这是报应的日子，使经上所写的都得应验。"],[23,"当那些日子，怀孕的和奶孩子的有祸了，因为将有大灾难降在这地方，也有震怒临到这百姓。"],[24,"他们要倒在刀下，又被掳到各国去。耶路撒冷要被外邦人践踏，直到外邦人的日期满了。”"],[25,"“日、月、星辰要显出异兆，地上的邦国也有困苦，因海中波浪的响声，就慌慌不定。"],[26,"天势都要震动，人想起那将要临到世界的事，就都吓得魂不附体。"],[27,"那时，他们要看见人子有能力，有大荣耀，驾云降临。"],[28,"一有这些事，你们就当挺身昂首，因为你们得赎的日子近了。”"],[29,"-"],[30,"耶稣又设比喻对他们说：“你们看无花果树和各样的树，它发芽的时候，你们一看见，自然晓得夏天近了。"],[31,"这样，你们看见这些事渐渐地成就，也该晓得神的国近了。"],[32,"我实在告诉你们：这世代还没有过去，这些事都要成就。"],[33,"天地要废去，我的话却不能废去。”"],[34,"“你们要谨慎，恐怕因贪食、醉酒，并今生的思虑累住你们的心，那日子就如同网罗忽然临到你们，"],[35,"因为那日子要这样临到全地上一切居住的人。"],[36,"你们要时时警醒，常常祈求，使你们能逃避这一切要来的事，得以站立在人子面前。”"],[37,"耶稣每日在殿里教训人，每夜出城在一座山名叫橄榄山住宿。"],[38,"众百姓清早上圣殿，到耶稣那里，要听他讲道。"]]},{"n":22,"v":[[1,"除酵节，又名逾越节，近了。"],[2,"祭司长和文士想法子怎么才能杀害耶稣，是因他们惧怕百姓。"],[3,"这时，撒但入了那称为加略人犹大的心，他本是十二门徒里的一个。"],[4,"他去和祭司长并守殿官商量，怎么可以把耶稣交给他们。"],[5,"他们欢喜，就约定给他银子。"],[6,"他应允了，就找机会，要趁众人不在跟前的时候把耶稣交给他们。"],[7,"除酵节，须宰逾越羊羔的那一天到了。"],[8,"耶稣打发彼得、约翰说：“你们去为我们预备逾越节的筵席，好叫我们吃。”"],[9,"他们问他说：“要我们在哪里预备？”"],[10,"耶稣说：“你们进了城，必有人拿着一瓶水迎面而来，你们就跟着他，到他所进的房子里去，"],[11,"对那家的主人说：‘夫子说：客房在哪里？我与门徒好在那里吃逾越节的筵席。’"],[12,"他必指给你们摆设整齐的一间大楼，你们就在那里预备。”"],[13,"他们去了，所遇见的正如耶稣所说的，他们就预备了逾越节的筵席。"],[14,"时候到了，耶稣坐席，使徒也和他同坐。"],[15,"耶稣对他们说：“我很愿意在受害以先和你们吃这逾越节的筵席。"],[16,"我告诉你们：我不再吃这筵席，直到成就在神的国里。”"],[17,"耶稣接过杯来，祝谢了，说：“你们拿这个，大家分着喝。"],[18,"我告诉你们：从今以后，我不再喝这葡萄汁，直等神的国来到。”"],[19,"又拿起饼来，祝谢了，就擘开，递给他们，说：“这是我的身体，为你们舍的，你们也应当如此行，为的是记念我。”"],[20,"饭后也照样拿起杯来，说：“这杯是用我血所立的新约，是为你们流出来的。"],[21,"看哪，那卖我之人的手与我一同在桌子上。"],[22,"人子固然要照所预定的去世，但卖人子的人有祸了！”"],[23,"他们就彼此对问，是哪一个要作这事。"],[24,"门徒起了争论：他们中间哪一个可算为大。"],[25,"耶稣说：“外邦人有君王为主治理他们，那掌权管他们的称为恩主。"],[26,"但你们不可这样。你们里头为大的，倒要像年幼的；为首领的，倒要像服侍人的。"],[27,"是谁为大？是坐席的呢？是服侍人的呢？不是坐席的大吗？然而，我在你们中间如同服侍人的。"],[28,"我在磨炼之中，常和我同在的就是你们。"],[29,"我将国赐给你们，正如我父赐给我一样，"],[30,"叫你们在我国里，坐在我的席上吃喝，并且坐在宝座上，审判以色列十二个支派。”"],[31,"主又说：“西门，西门！撒但想要得着你们，好筛你们像筛麦子一样。"],[32,"但我已经为你祈求，叫你不至于失了信心，你回头以后，要坚固你的弟兄。”"],[33,"彼得说：“主啊，我就是同你下监，同你受死，也是甘心。”"],[34,"耶稣说：“彼得，我告诉你，今日鸡还没有叫，你要三次说不认得我。”"],[35,"耶稣又对他们说：“我差你们出去的时候，没有钱囊、没有口袋、没有鞋，你们缺少什么没有？”他们说：“没有。”"],[36,"耶稣说：“但如今有钱囊的可以带着，有口袋的也可以带着，没有刀的要卖衣服买刀。"],[37,"我告诉你们，经上写着说：‘他被列在罪犯之中。’这话必应验在我身上，因为那关系我的事，必然成就。”"],[38,"他们说：“主啊，请看！这里有两把刀。”耶稣说：“够了。”"],[39,"耶稣出来，照常往橄榄山去，门徒也跟随他。"],[40,"到了那地方，就对他们说：“你们要祷告，免得入了迷惑。”"],[41,"于是离开他们约有扔一块石头那么远，跪下祷告，"],[42,"说：“父啊，你若愿意，就把这杯撤去，然而，不要成就我的意思，只要成就你的意思。”"],[43,"有一位天使从天上显现，加添他的力量。"],[44,"耶稣极其伤痛，祷告更加恳切，汗珠如大血点，滴在地上。"],[45,"祷告完了，就起来，到门徒那里，见他们因为忧愁都睡着了，"],[46,"就对他们说：“你们为什么睡觉呢？起来祷告！免得入了迷惑。”"],[47,"说话之间，来了许多人，那十二个门徒里名叫犹大的走在前头，就近耶稣，要与他亲嘴。"],[48,"耶稣对他说：“犹大，你用亲嘴的暗号卖人子吗？”"],[49,"左右的人见光景不好，就说：“主啊，我们拿刀砍可以不可以？”"],[50,"内中有一个人把大祭司的仆人砍了一刀，削掉了他的右耳。"],[51,"耶稣说：“到了这个地步，由他们吧！”就摸那人的耳朵，把他治好了。"],[52,"耶稣对那些来拿他的祭司长和守殿官并长老说：“你们带着刀棒出来拿我，如同拿强盗吗？"],[53,"我天天同你们在殿里，你们不下手拿我。现在却是你们的时候，黑暗掌权了。”"],[54,"他们拿住耶稣，把他带到大祭司的宅里。彼得远远地跟着。"],[55,"他们在院子里生了火，一同坐着，彼得也坐在他们中间。"],[56,"有一个使女看见彼得坐在火光里，就定睛看他，说：“这个人素来也是同那人一伙的。”"],[57,"彼得却不承认，说：“女子，我不认得他。”"],[58,"过了不多的时候，又有一个人看见他，说：“你也是他们一党的。”彼得说：“你这个人！我不是。”"],[59,"约过了一小时，又有一个人极力地说：“他实在是同那人一伙的，因为他也是加利利人。”"],[60,"彼得说：“你这个人！我不晓得你说的是什么。”正说话之间，鸡就叫了。"],[61,"主转过身来看彼得。彼得便想起主对他所说的话：“今日鸡叫以先，你要三次不认我。’"],[62,"他就出去痛哭。"],[63,"看守耶稣的人戏弄他，打他，"],[64,"又蒙着他的眼，问他说：“你是先知，告诉我们打你的是谁？”"],[65,"他们还用许多别的话辱骂他。"],[66,"天一亮，民间的众长老连祭司长带文士都聚会，把耶稣带到他们的公会里，"],[67,"说：“你若是基督，就告诉我们。”耶稣说：“我若告诉你们，你们也不信；"],[68,"我若问你们，你们也不回答。"],[69,"从今以后，人子要坐在神权能的右边。”"],[70,"他们都说：“这样，你是神的儿子吗？”耶稣说：“你们所说的是。”"],[71,"他们说：“何必再用见证呢？他亲口所说的，我们都亲自听见了。”"]]},{"n":23,"v":[[1,"众人都起来，把耶稣解到彼拉多面前，"],[2,"就告他说：“我们见这人诱惑国民，禁止纳税给凯撒，并说自己是基督、是王。”"],[3,"彼拉多问耶稣说：“你是犹太人的王吗？”耶稣回答说：“你说的是。”"],[4,"彼拉多对祭司长和众人说：“我查不出这人有什么罪来。”"],[5,"但他们越发极力地说：“他煽惑百姓，在犹太遍地传道，从加利利起，直到这里了。”"],[6,"彼拉多一听见，就问：“这人是加利利人吗？”"],[7,"既晓得耶稣属希律所管，就把他送到希律那里去。那时希律正在耶路撒冷。"],[8,"希律看见耶稣，就很欢喜，因为听见过他的事，久已想要见他，并且指望看他行一件神迹。"],[9,"于是问他许多的话，耶稣却一言不答。"],[10,"祭司长和文士都站着，极力地告他。"],[11,"希律和他的兵丁就藐视耶稣，戏弄他，给他穿上华丽衣服，把他送回彼拉多那里去。"],[12,"从前希律和彼拉多彼此有仇，在那一天就成了朋友。"],[13,"彼拉多传齐了祭司长和官府并百姓，"],[14,"就对他们说：“你们解这人到我这里，说他是诱惑百姓的。看哪，我也曾将你们告他的事在你们面前审问他，并没有查出他什么罪来，"],[15,"就是希律也是如此，所以把他送回来。可见他没有作什么该死的事，"],[16,"故此，我要责打他，把他释放了。”（有古卷在此有"],[17,"“每逢这节期，巡抚必须释放一个囚犯给他们。”）"],[18,"众人却一齐喊着说：“除掉这个人！释放巴拉巴给我们！”"],[19,"这巴拉巴是因在城里作乱杀人，下在监里的。"],[20,"彼拉多愿意释放耶稣，就又劝解他们。"],[21,"无奈他们喊着说：“钉他十字架！钉他十字架！”"],[22,"彼拉多第三次对他们说：“为什么呢？这人作了什么恶事呢？我并没有查出他什么该死的罪来。所以，我要责打他，把他释放了。”"],[23,"他们大声催逼彼拉多，求他把耶稣钉在十字架上。他们的声音就得了胜。"],[24,"彼拉多这才照他们所求的定案，"],[25,"把他们所求的，那作乱杀人下在监里的释放了，把耶稣交给他们，任凭他们的意思行。"],[26,"带耶稣去的时候，有一个古利奈人西门从乡下来，他们就抓住他，把十字架搁在他身上，叫他背着跟随耶稣。"],[27,"有许多百姓跟随耶稣，内中有好些妇女，妇女们为他号啕痛哭。"],[28,"耶稣转身对她们说：“耶路撒冷的女子，不要为我哭，当为自己和自己的儿女哭。"],[29,"因为日子要到，人必说：‘不生育的和未曾怀胎的，未曾乳养婴孩的，有福了！’"],[30,"那时，人要向大山说：‘倒在我们身上！’向小山说：‘遮盖我们！’"],[31,"这些事既行在有汁水的树上，那枯干的树将来怎么样呢？”"],[32,"又有两个犯人，和耶稣一同带来处死。"],[33,"到了一个地方，名叫髑髅地，就在那里把耶稣钉在十字架上。又钉了两个犯人：一个在左边，一个在右边。"],[34,"当下耶稣说：“父啊，赦免他们！因为他们所作的，他们不晓得。”兵丁就拈阄分他的衣服。"],[35,"百姓站在那里观看。官府也嗤笑他，说：“他救了别人，他若是基督，神所拣选的，可以救自己吧！”"],[36,"兵丁也戏弄他，上前拿醋送给他喝，"],[37,"说：“你若是犹太人的王，可以救自己吧！”"],[38,"在耶稣以上有一个牌子（有古卷在此有“用希腊、罗马、希伯来的文字”）写着：“这是犹太人的王。”"],[39,"那同钉的两个犯人，有一个讥诮他说：“你不是基督吗？可以救自己和我们吧！”"],[40,"那一个就应声责备他说：“你既是一样受刑的，还不怕神吗？"],[41,"我们是应该的，因我们所受的与我们所作的相称，但这个人没有作过一件不好的事。”"],[42,"就说：“耶稣啊，你得国降临的时候，求你记念我！”"],[43,"耶稣对他说：“我实在告诉你：今日你要同我在乐园里了。”"],[44,"那时约有午正，遍地都黑暗了，直到申初，"],[45,"日头变黑了，殿里的幔子从当中裂为两半。"],[46,"耶稣大声喊着说：“父啊，我将我的灵魂交在你手里！”说了这话，气就断了。"],[47,"百夫长看见所成的事，就归荣耀与神，说：“这真是个义人！”"],[48,"聚集观看的众人见了这所成的事，都捶着胸回去了。"],[49,"还有一切与耶稣熟识的人和从加利利跟着他来的妇女们，都远远地站着看这些事。"],[50,"有一个人名叫约瑟，是个议士，为人善良公义。"],[51,"众人所谋所为，他并没有附从。他本是犹太亚利马太城里素常盼望神国的人。"],[52,"这人去见彼拉多，求耶稣的身体；"],[53,"就取下来用细麻布裹好，安放在石头凿成的坟墓里，那里头从来没有葬过人。"],[54,"那日是预备日，安息日也快到了。"],[55,"那些从加利利和耶稣同来的妇女跟在后面，看见了坟墓和他的身体怎样安放。"],[56,"她们就回去，预备了香料香膏。她们在安息日，便遵着诫命安息了。"]]},{"n":24,"v":[[1,"七日的头一日，黎明的时候，那些妇女带着所预备的香料来到坟墓前，"],[2,"看见石头已经从坟墓滚开了。"],[3,"她们就进去，只是不见主耶稣的身体。"],[4,"正在猜疑之间，忽然有两个人站在旁边，衣服放光。"],[5,"妇女们惊怕，将脸伏地。那两个人就对她们说：“为什么在死人中找活人呢？"],[6,"他不在这里，已经复活了。当记念他还在加利利的时候怎样告诉你们，"],[7,"说：‘人子必须被交在罪人手里，钉在十字架上，第三日复活。’”"],[8,"她们就想起耶稣的话来。"],[9,"便从坟墓那里回去，把这一切的事告诉十一个使徒和其余的人。"],[10,"那告诉使徒的，就是抹大拉的马利亚和约亚拿，并雅各的母亲马利亚，还有与她们在一处的妇女。"],[11,"她们这些话，使徒以为是胡言，就不相信。"],[12,"彼得起来，跑到坟墓前，低头往里看，见细麻布独在一处，就回去了，心里希奇所成的事。"],[13,"正当那日，门徒中有两个人往一个村子去，这村子名叫以马忤斯，离耶路撒冷约有二十五里。"],[14,"他们彼此谈论所遇见的这一切事。"],[15,"正谈论相问的时候，耶稣亲自就近他们，和他们同行，"],[16,"只是他们的眼睛迷糊了，不认识他。"],[17,"耶稣对他们说：“你们走路彼此谈论的是什么事呢？”他们就站住，脸上带着愁容。"],[18,"二人中有一个名叫革流巴的回答说：“你在耶路撒冷作客，还不知道这几天在那里所出的事吗？”"],[19,"耶稣说：“什么事呢？”他们说：“就是拿撒勒人耶稣的事。他是个先知，在神和众百姓面前，说话行事都有大能。"],[20,"祭司长和我们的官府竟把他解去，定了死罪，钉在十字架上。"],[21,"但我们素来所盼望要赎以色列民的，就是他。不但如此，而且这事成就，现在已经三天了。"],[22,"再者，我们中间有几个妇女使我们惊奇，她们清早到了坟墓那里，"],[23,"不见他的身体，就回来告诉我们说：‘看见了天使显现，说他活了。’"],[24,"又有我们的几个人往坟墓那里去，所遇见的，正如妇女们所说的，只是没有看见他。”"],[25,"耶稣对他们说：“无知的人哪，先知所说的一切话，你们的心信得太迟钝了。"],[26,"基督这样受害，又进入他的荣耀，岂不是应当的吗？”"],[27,"于是从摩西和众先知起，凡经上所指着自己的话，都给他们讲解明白了。"],[28,"将近他们所去的村子，耶稣好像还要往前行，"],[29,"他们却强留他说：“时候晚了，日头已经平西了，请你同我们住下吧！”耶稣就进去，要同他们住下。"],[30,"到了坐席的时候，耶稣拿起饼来，祝谢了，擘开，递给他们。"],[31,"他们的眼睛明亮了，这才认出他来。忽然耶稣不见了。"],[32,"他们彼此说：“在路上，他和我们说话，给我们讲解圣经的时候，我们的心岂不是火热的吗？”"],[33,"他们就立时起身回耶路撒冷去，正遇见十一个使徒和他们的同人聚集在一处，"],[34,"说：“主果然复活，已经现给西门看了。”"],[35,"两个人就把路上所遇见和擘饼的时候怎么被他们认出来的事，都述说了一遍。"],[36,"正说这话的时候，耶稣亲自站在他们当中，说：“愿你们平安！”"],[37,"他们却惊慌害怕，以为所看见的是魂。"],[38,"耶稣说：“你们为什么愁烦？为什么心里起疑念呢？"],[39,"你们看我的手、我的脚，就知道实在是我了。摸我看看，魂无骨无肉，你们看，我是有的。”"],[40,"说了这话，就把手和脚给他们看。"],[41,"他们正喜得不敢信，并且希奇，耶稣就说：“你们这里有什么吃的没有？”"],[42,"他们便给他一片烧鱼（有古卷在此有“和一块蜜房”）。"],[43,"他接过来，在他们面前吃了。"],[44,"耶稣对他们说：“这就是我从前与你们同在之时所告诉你们的话说：摩西的律法、先知的书和诗篇上所记的，凡指着我的话，都必须应验。”"],[45,"于是耶稣开他们的心窍，使他们能明白圣经。"],[46,"又对他们说：“照经上所写的，基督必受害，第三日从死里复活，"],[47,"并且人要奉他的名传悔改、赦罪的道，从耶路撒冷起直传到万邦。"],[48,"你们就是这些事的见证。"],[49,"我要将我父所应许的降在你们身上，你们要在城里等候，直到你们领受从上头来的能力。”"],[50,"耶稣领他们到伯大尼的对面，就举手给他们祝福。"],[51,"正祝福的时候，他就离开他们，被带到天上去了。"],[52,"他们就拜他，大大的欢喜，回耶路撒冷去。"],[53,"常在殿里称颂神。"]]}]},{"name":"约翰福音","chapters":[{"n":1,"v":[[1,"太初有道，道与神同在，道就是神。"],[2,"这道太初与神同在。"],[3,"万物是藉着他造的；凡被造的，没有一样不是藉着他造的。"],[4,"生命在他里头，这生命就是人的光。"],[5,"光照在黑暗里，黑暗却不接受光。"],[6,"有一个人，是从神那里差来的，名叫约翰。"],[7,"这人来，为要作见证，就是为光作见证，叫众人因他可以信。"],[8,"他不是那光，乃是要为光作见证。"],[9,"那光是真光，照亮一切生在世上的人。"],[10,"他在世界，世界也是藉着他造的，世界却不认识他。"],[11,"他到自己的地方来，自己的人倒不接待他。"],[12,"凡接待他的，就是信他名的人，他就赐他们权柄，作神的儿女。"],[13,"这等人不是从血气生的，不是从情欲生的，也不是从人意生的，乃是从神生的。"],[14,"道成了肉身，住在我们中间，充充满满地有恩典，有真理。我们也见过他的荣光，正是父独生子的荣光。"],[15,"约翰为他作见证，喊着说：“这就是我曾说，‘那在我以后来的，反成了在我以前的，因他本来在我以前。’”"],[16,"从他丰满的恩典里，我们都领受了，而且恩上加恩。"],[17,"律法本是藉着摩西传的，恩典和真理都是由耶稣基督来的。"],[18,"从来没有人看见神，只有在父怀里的独生子将他表明出来。"],[19,"约翰所作的见证记在下面：犹太人从耶路撒冷差祭司和利未人到约翰那里，问他说：“你是谁？”"],[20,"他就明说，并不隐瞒；明说：“我不是基督。”"],[21,"他们又问他说：“这样，你是谁呢？是以利亚吗？”他说：“我不是。”“是那先知吗？”他回答说：“不是。”"],[22,"于是他们说：“你到底是谁？叫我们好回复差我们来的人。你自己说，你是谁？”"],[23,"他说：“我就是那在旷野有人声喊着说：‘修直主的道路’，正如先知以赛亚所说的。”"],[24,"那些人是法利赛人差来的（或作“那差来的是法利赛人”）。"],[25,"他们就问他说：“你既不是基督，不是以利亚，也不是那先知，为什么施洗呢？”"],[26,"约翰回答说：“我是用水施洗，但有一位站在你们中间，是你们不认识的，"],[27,"就是那在我以后来的，我给他解鞋带也不配。”"],[28,"这是在约旦河外伯大尼（有古卷作“伯大巴喇”），约翰施洗的地方作的见证。"],[29,"次日，约翰看见耶稣来到他那里，就说：“看哪，神的羔羊，除去（或作“背负”）世人罪孽的。"],[30,"这就是我曾说‘有一位在我以后来，反成了在我以前的，因他本来在我以前。’"],[31,"我先前不认识他，如今我来用水施洗，为要叫他显明给以色列人。”"],[32,"约翰又作见证说：“我曾看见圣灵彷佛鸽子从天降下，住在他的身上。"],[33,"我先前不认识他，只是那差我来用水施洗的，对我说：‘你看见圣灵降下来，住在谁的身上，谁就是用圣灵施洗的。’"],[34,"我看见了，就证明这是神的儿子。”"],[35,"再次日，约翰同两个门徒站在那里。"],[36,"他见耶稣行走，就说：“看哪，这是神的羔羊！”"],[37,"两个门徒听见他的话，就跟从了耶稣。"],[38,"耶稣转过身来，看见他们跟着，就问他们说：“你们要什么？”他们说：“拉比（“拉比”翻出来就是“夫子”），在哪里住？”"],[39,"耶稣说：“你们来看。”他们就去看他在哪里住，这一天便与他同住。那时约有申正了。"],[40,"听见约翰的话跟从耶稣的那两个人，一个是西门彼得的兄弟安得烈。"],[41,"他先找着自己的哥哥西门，对他说：“我们遇见弥赛亚了（“弥赛亚”翻出来就是“基督”）。”"],[42,"于是领他去见耶稣。耶稣看着他说：“你是约翰的儿子西门（“约翰”马太16章17节称“约拿”），你要称为矶法（“矶法”翻出来就是“彼得”）。”"],[43,"又次日，耶稣想要往加利利去，遇见腓力，就对他说：“来跟从我吧！”"],[44,"这腓力是伯赛大人，和安得烈、彼得同城。"],[45,"腓力找着拿但业，对他说：“摩西在律法上所写的和众先知所记的那一位，我们遇见了，就是约瑟的儿子拿撒勒人耶稣。”"],[46,"拿但业对他说：“拿撒勒还能出什么好的吗？”腓力说：“你来看。”"],[47,"耶稣看见拿但业来，就指着他说：“看哪，这是个真以色列人，他心里是没有诡诈的。”"],[48,"拿但业对耶稣说：“你从哪里知道我呢？”耶稣回答说：“腓力还没有招呼你，你在无花果树底下，我就看见你了。”"],[49,"拿但业说：“拉比，你是神的儿子，你是以色列的王。”"],[50,"耶稣对他说：“因为我说在无花果树底下看见你，你就信吗？你将要看见比这更大的事。”"],[51,"又说：“我实实在在地告诉你们，你们将要看见天开了，神的使者上去下来在人子身上。”"]]},{"n":2,"v":[[1,"第三日，在加利利的迦拿有娶亲的筵席，耶稣的母亲在那里。"],[2,"耶稣和他的门徒也被请去赴席。"],[3,"酒用尽了，耶稣的母亲对他说：“他们没有酒了。”"],[4,"耶稣说：“母亲（原文作“妇人”），我与你有什么相干？我的时候还没有到。”"],[5,"他母亲对用人说：“他告诉你们什么，你们就作什么。”"],[6,"照犹太人洁净的规矩，有六口石缸摆在那里，每口可以盛两三桶水。"],[7,"耶稣对用人说：“把缸倒满了水。”他们就倒满了，直到缸口。"],[8,"耶稣又说：“现在可以舀出来，送给管筵席的。”他们就送了去。"],[9,"管筵席的尝了那水变的酒，并不知道是哪里来的，只有舀水的用人知道。管筵席的便叫新郎来，"],[10,"对他说：“人都是先摆上好酒，等客喝足了，才摆上次的；你倒把好酒留到如今！”"],[11,"这是耶稣所行的头一件神迹，是在加利利的迦拿行的，显出他的荣耀来，他的门徒就信他了。"],[12,"这事以后，耶稣与他的母亲、弟兄和门徒都下迦百农去，在那里住了不多几日。"],[13,"犹太人的逾越节近了，耶稣就上耶路撒冷去。"],[14,"看见殿里有卖牛、羊、鸽子的，并有兑换银钱的人坐在那里。"],[15,"耶稣就拿绳子作成鞭子，把牛羊都赶出殿去，倒出兑换银钱之人的银钱，推翻他们的桌子。"],[16,"又对卖鸽子的说：“把这些东西拿去，不要将我父的殿当作买卖的地方。”"],[17,"他的门徒就想起经上记着说：“我为你的殿心里焦急，如同火烧。”"],[18,"因此犹太人问他说：“你既作这些事，还显什么神迹给我们看呢？”"],[19,"耶稣回答说：“你们拆毁这殿，我三日内要再建立起来。”"],[20,"犹太人便说：“这殿是四十六年才造成的，你三日内就再建立起来吗？”"],[21,"但耶稣这话，是以他的身体为殿。"],[22,"所以到他从死里复活以后，门徒就想起他说过这话，便信了圣经和耶稣所说的。"],[23,"当耶稣在耶路撒冷过逾越节的时候，有许多人看见他所行的神迹，就信了他的名。"],[24,"耶稣却不将自己交托他们，因为他知道万人；"],[25,"也用不着谁见证人怎样，因他知道人心里所存的。"]]},{"n":3,"v":[[1,"有一个法利赛人，名叫尼哥底母，是犹太人的官。"],[2,"这人夜里来见耶稣，说：“拉比，我们知道你是由神那里来作师傅的，因为你所行的神迹，若没有神同在，无人能行。”"],[3,"耶稣回答说：“我实实在在地告诉你：人若不重生，就不能见神的国。”"],[4,"尼哥底母说：“人已经老了，如何能重生呢？岂能再进母腹生出来吗？”"],[5,"耶稣说：“我实实在在地告诉你：人若不是从水和圣灵生的，就不能进神的国。"],[6,"从肉身生的，就是肉身；从灵生的，就是灵。"],[7,"我说：‘你们必须重生’，你不要以为希奇。"],[8,"风随着意思吹，你听见风的响声，却不晓得从哪里来，往哪里去。凡从圣灵生的，也是如此。”"],[9,"尼哥底母问他说：“怎能有这事呢？”"],[10,"耶稣回答说：“你是以色列人的先生，还不明白这事吗？"],[11,"我实实在在地告诉你：我们所说的，是我们知道的；我们所见证的，是我们见过的；你们却不领受我们的见证。"],[12,"我对你们说地上的事，你们尚且不信；若说天上的事，如何能信呢？"],[13,"除了从天降下仍旧在天的人子，没有人升过天。"],[14,"摩西在旷野怎样举蛇，人子也必照样被举起来，"],[15,"叫一切信他的都得永生（或作“叫一切信的人在他里面得永生”）。"],[16,"神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。"],[17,"因为神差他的儿子降世，不是要定世人的罪（或作“审判世人”。下同），乃是要叫世人因他得救。"],[18,"信他的人，不被定罪；不信的人，罪已经定了，因为他不信神独生子的名。"],[19,"光来到世间，世人因自己的行为是恶的，不爱光倒爱黑暗，定他们的罪就是在此。"],[20,"凡作恶的便恨光，并不来就光，恐怕他的行为受责备；"],[21,"但行真理的必来就光，要显明他所行的是靠神而行。”"],[22,"这事以后，耶稣和门徒到了犹太地，在那里居住施洗。"],[23,"约翰在靠近撒冷的哀嫩也施洗，因为那里水多，众人都去受洗。"],[24,"那时约翰还没有下在监里。"],[25,"约翰的门徒和一个犹太人辩论洁净的礼，"],[26,"就来见约翰说：“拉比，从前同你在约旦河外你所见证的那位，现在施洗，众人都往他那里去了。”"],[27,"约翰说：“若不是从天上赐的，人就不能得什么。"],[28,"我曾说：‘我不是基督，是奉差遣在他前面的’，你们自己可以给我作见证。"],[29,"娶新妇的就是新郎，新郎的朋友站着听见新郎的声音就甚喜乐，故此我这喜乐满足了。"],[30,"他必兴旺，我必衰微。”"],[31,"“从天上来的是在万有之上；从地上来的是属乎地，他所说的也是属乎地。从天上来的是在万有之上。"],[32,"他将所见所闻的见证出来，只是没有人领受他的见证。"],[33,"那领受他见证的，就印上印，证明神是真的。"],[34,"神所差来的，就说神的话，因为神赐圣灵给他，是没有限量的。"],[35,"父爱子，已将万有交在他手里。"],[36,"信子的人有永生；不信子的人得不着永生（原文作“不得见永生”），神的震怒常在他身上。”"]]},{"n":4,"v":[[1,"主知道法利赛人听见他收门徒施洗比约翰还多"],[2,"（其实不是耶稣亲自施洗，乃是他的门徒施洗。）"],[3,"他就离了犹太，又往加利利去。"],[4,"必须经过撒玛利亚。"],[5,"于是到了撒玛利亚的一座城，名叫叙加，靠近雅各给他儿子约瑟的那块地。"],[6,"在那里有雅各井。耶稣因走路困乏，就坐在井旁。那时约有午正。"],[7,"有一个撒玛利亚的妇人来打水，耶稣对她说：“请你给我水喝。”"],[8,"那时门徒进城买食物去了。"],[9,"撒玛利亚的妇人对他说：“你既是犹太人，怎么向我一个撒玛利亚妇人要水喝呢？”原来犹太人和撒玛利亚人没有来往。"],[10,"耶稣回答说：“你若知道神的恩赐，和对你说‘给我水喝’的是谁，你必早求他，他也必早给了你活水。”"],[11,"妇人说：“先生，没有打水的器具，井又深，你从哪里得活水呢？"],[12,"我们的祖宗雅各将这井留给我们，他自己和儿子并牲畜也都喝这井里的水，难道你比他还大吗？”"],[13,"耶稣回答说：“凡喝这水的，还要再渴；"],[14,"人若喝我所赐的水，就永远不渴。我所赐的水要在他里头成为泉源，直涌到永生。”"],[15,"妇人说：“先生，请把这水赐给我，叫我不渴，也不用来这么远打水。”"],[16,"耶稣说：“你去叫你丈夫也到这里来。”"],[17,"妇人说：“我没有丈夫。”耶稣说：“你说没有丈夫，是不错的。"],[18,"你已经有五个丈夫，你现在有的，并不是你的丈夫，你这话是真的。”"],[19,"妇人说：“先生，我看出你是先知。"],[20,"我们的祖宗在这山上礼拜，你们倒说，应当礼拜的地方是在耶路撒冷。”"],[21,"耶稣说：“妇人，你当信我。时候将到，你们拜父也不在这山上，也不在耶路撒冷。"],[22,"你们所拜的，你们不知道；我们所拜的，我们知道，因为救恩是从犹太人出来的。"],[23,"时候将到，如今就是了，那真正拜父的，要用心灵和诚实拜他，因为父要这样的人拜他。"],[24,"神是个灵（或无“个”字），所以拜他的，必须用心灵和诚实拜他。”"],[25,"妇人说：“我知道弥赛亚（就是那称为基督的）要来，他来了，必将一切的事都告诉我们。”"],[26,"耶稣说：“这和你说话的就是他。”"],[27,"当下门徒回来，就希奇耶稣和一个妇人说话。只是没有人说：“你是要什么？”或说：“你为什么和她说话？”"],[28,"那妇人就留下水罐子，往城里去，对众人说："],[29,"“你们来看，有一个人将我素来所行的一切事都给我说出来了，莫非这就是基督吗？”"],[30,"众人就出城往耶稣那里去。"],[31,"这其间，门徒对耶稣说：“拉比，请吃。”"],[32,"耶稣说：“我有食物吃，是你们不知道的。”"],[33,"门徒就彼此对问说：“莫非有人拿什么给他吃吗？”"],[34,"耶稣说：“我的食物就是遵行差我来者的旨意，作成他的工。"],[35,"你们岂不说：‘到收割的时候还有四个月’吗？我告诉你们：举目向田观看，庄稼已经熟了（原文作“发白”），可以收割了。"],[36,"收割的人得工价，积蓄五谷到永生，叫撒种的和收割的一同快乐。"],[37,"俗语说：‘那人撒种，这人收割’，这话可见是真的。"],[38,"我差你们去收你们所没有劳苦的；别人劳苦，你们享受他们所劳苦的。”"],[39,"那城里有好些撒玛利亚人信了耶稣，因为那妇人作见证说：“他将我素来所行的一切事都给我说出来了。”"],[40,"于是撒玛利亚人来见耶稣，求他在他们那里住下，他便在那里住了两天。"],[41,"因耶稣的话，信的人就更多了。"],[42,"便对妇人说：“现在我们信，不是因为你的话，是我们亲自听见了，知道这真是救世主。”"],[43,"过了那两天，耶稣离了那地方，往加利利去。"],[44,"因为耶稣自己作过见证说：“先知在本地是没有人尊敬的。”"],[45,"到了加利利，加利利人既然看见他在耶路撒冷过节所行的一切事，就接待他，因为他们也是上去过节。"],[46,"耶稣又到了加利利的迦拿，就是他从前变水为酒的地方。有一个大臣，他的儿子在迦百农患病。"],[47,"他听见耶稣从犹太到了加利利，就来见他，求他下去医治他的儿子，因为他儿子快要死了。"],[48,"耶稣就对他说：“若不看见神迹奇事，你们总是不信。”"],[49,"那大臣说：“先生，求你趁着我的孩子还没有死就下去。”"],[50,"耶稣对他说：“回去吧！你的儿子活了。”那人信耶稣所说的话，就回去了。"],[51,"正下去的时候，他的仆人迎见他，说他的儿子活了。"],[52,"他就问什么时候见好的。他们说：“昨日未时热就退了。”"],[53,"他便知道这正是耶稣对他说“你儿子活了”的时候；他自己和全家就都信了。"],[54,"这是耶稣在加利利行的第二件神迹，是他从犹太回去以后行的。"]]},{"n":5,"v":[[1,"这事以后，到了犹太人的一个节期。耶稣就上耶路撒冷去。"],[2,"在耶路撒冷，靠近羊门有一个池子，希伯来话叫作毕士大，旁边有五个廊子。"],[3,"里面躺着瞎眼的、瘸腿的、血气枯干的许多病人。（有古卷在此有“等候水动，"],[4,"因为有天使按时下池子搅动那水，水动之后，谁先下去，无论害什么病就痊愈了。”）"],[5,"在那里有一个人，病了三十八年。"],[6,"耶稣看见他躺着，知道他病了许久，就问他说：“你要痊愈吗？”"],[7,"病人回答说：“先生，水动的时候，没有人把我放在池子里；我正去的时候，就有别人比我先下去。”"],[8,"耶稣对他说：“起来，拿你的褥子走吧！”"],[9,"那人立刻痊愈，就拿起褥子来走了。"],[10,"那天是安息日，所以犹太人对那医好的人说：“今天是安息日，你拿褥子是不可的。”"],[11,"他却回答说：“那使我痊愈的对我说，‘拿你的褥子走吧。’”"],[12,"他们问他说：“对你说‘拿褥子走’的是什么人？”"],[13,"那医好的人不知道是谁，因为那里的人多，耶稣已经躲开了。"],[14,"后来耶稣在殿里遇见他，对他说：“你已经痊愈了，不要再犯罪，恐怕你遭遇的更加利害。”"],[15,"那人就去告诉犹太人，使他痊愈的是耶稣。"],[16,"所以犹太人逼迫耶稣，因为他在安息日作了这事。"],[17,"耶稣就对他们说：“我父作事直到如今，我也作事。”"],[18,"所以犹太人越发想要杀他，因他不但犯了安息日，并且称神为他的父，将自己和神当作平等。"],[19,"耶稣对他们说：“我实实在在地告诉你们：子凭着自己不能作什么，惟有看见父所作的，子才能作；父所作的事，子也照样作。"],[20,"父爱子，将自己所作的一切事指给他看，还要将比这更大的事指给他看，叫你们希奇。"],[21,"父怎样叫死人起来，使他们活着，子也照样随自己的意思使人活着。"],[22,"父不审判什么人，乃将审判的事全交与子，"],[23,"叫人都尊敬子如同尊敬父一样。不尊敬子的，就是不尊敬差子来的父。"],[24,"我实实在在地告诉你们：那听我话、又信差我来者的，就有永生，不至于定罪，是已经出死入生了。"],[25,"我实实在在地告诉你们：时候将到，现在就是了，死人要听见神儿子的声音，听见的人就要活了。"],[26,"因为父怎样在自己有生命，就赐给他儿子也照样在自己有生命；"],[27,"并且因为他是人子，就赐给他行审判的权柄。"],[28,"你们不要把这事看作希奇，时候要到，凡在坟墓里的，都要听见他的声音，就出来。"],[29,"行善的复活得生，作恶的复活定罪。”"],[30,"“我凭着自己不能作什么，我怎么听见，就怎么审判。我的审判也是公平的，因为我不求自己的意思，只求那差我来者的意思。”"],[31,"“我若为自己作见证，我的见证就不真；"],[32,"另有一位给我作见证，我也知道他给我作的见证是真的。"],[33,"你们曾差人到约翰那里，他为真理作过见证。"],[34,"其实我所受的见证不是从人来的，然而我说这些话，为要叫你们得救。"],[35,"约翰是点着的明灯，你们情愿暂时喜欢他的光。"],[36,"但我有比约翰更大的见证，因为父交给我要我成就的事，就是我所作的事，这便见证我是父所差来的。"],[37,"差我来的父也为我作过见证。你们从来没有听见他的声音，也没有看见他的形像。"],[38,"你们并没有他的道存在心里，因为他所差来的，你们不信。"],[39,"你们查考圣经（或作“应当查考圣经”），因你们以为内中有永生，给我作见证的就是这经。"],[40,"然而你们不肯到我这里来得生命。”"],[41,"“我不受从人来的荣耀。"],[42,"但我知道你们心里没有神的爱。"],[43,"我奉我父的名来，你们并不接待我；若有别人奉自己的名来，你们倒要接待他。"],[44,"你们互相受荣耀，却不求从独一之神来的荣耀，怎能信我呢？"],[45,"不要想我在父面前要告你们，有一位告你们的，就是你们所仰赖的摩西。"],[46,"你们如果信摩西，也必信我，因为他书上有指着我写的话。"],[47,"你们若不信他的书，怎能信我的话呢？”"]]},{"n":6,"v":[[1,"这事以后，耶稣渡过加利利海，就是提比哩亚海。"],[2,"有许多人因为看见他在病人身上所行的神迹，就跟随他。"],[3,"耶稣上了山，和门徒一同坐在那里。"],[4,"那时犹太人的逾越节近了。"],[5,"耶稣举目看见许多人来，就对腓力说：“我们从哪里买饼叫这些人吃呢？”"],[6,"他说这话是要试验腓力，他自己原知道要怎样行。"],[7,"腓力回答说：“就是二十两银子的饼，叫他们各人吃一点，也是不够的。”"],[8,"有一个门徒，就是西门彼得的兄弟安得烈，对耶稣说："],[9,"“在这里有一个孩童，带着五个大麦饼、两条鱼，只是分给这许多人，还算什么呢？”"],[10,"耶稣说：“你们叫众人坐下。”原来那地方的草多，众人就坐下，数目约有五千。"],[11,"耶稣拿起饼来祝谢了，就分给那坐着的人，分鱼也是这样，都随着他们所要的。"],[12,"他们吃饱了，耶稣对门徒说：“把剩下的零碎收拾起来，免得有糟蹋的。”"],[13,"他们便将那五个大麦饼的零碎，就是众人吃了剩下的，收拾起来，装满了十二个篮子。"],[14,"众人看见耶稣所行的神迹，就说：“这真是那要到世间来的先知。”"],[15,"耶稣既知道众人要来强逼他作王，就独自又退到山上去了。"],[16,"到了晚上，他的门徒下海边去，"],[17,"上了船，要过海往迦百农去。天已经黑了，耶稣还没有来到他们那里。"],[18,"忽然狂风大作，海就翻腾起来。"],[19,"门徒摇橹约行了十里多路，看见耶稣在海面上走，渐渐近了船，他们就害怕。"],[20,"耶稣对他们说：“是我，不要怕！”"],[21,"门徒就喜欢接他上船，船立时到了他们所要去的地方。"],[22,"第二日，站在海那边的众人，知道那里没有别的船，只有一只小船；又知道耶稣没有同他的门徒上船，乃是门徒自己去的。"],[23,"然而有几只小船从提比哩亚来，靠近主祝谢后分饼给人吃的地方。"],[24,"众人见耶稣和门徒都不在那里，就上了船，往迦百农去找耶稣。"],[25,"既在海那边找着了，就对他说：“拉比，是几时到这里来的？”"],[26,"耶稣回答说：“我实实在在地告诉你们：你们找我，并不是因见了神迹，乃是因吃饼得饱。"],[27,"不要为那必坏的食物劳力，要为那存到永生的食物劳力，就是人子要赐给你们的，因为人子是父神所印证的。”"],[28,"众人问他说：“我们当行什么，才算作神的工呢？”"],[29,"耶稣回答说：“信神所差来的，这就是作神的工。”"],[30,"他们又说：“你行什么神迹，叫我们看见就信你？你到底作什么事呢？"],[31,"我们的祖宗在旷野吃过吗哪，如经上写着说：‘他从天上赐下粮来给他们吃。’”"],[32,"耶稣说：“我实实在在地告诉你们：那从天上来的粮不是摩西赐给你们的，乃是我父将天上来的真粮赐给你们。"],[33,"因为神的粮就是那从天上降下来赐生命给世界的。”"],[34,"他们说：“主啊，常将这粮赐给我们。”"],[35,"耶稣说：“我就是生命的粮，到我这里来的，必定不饿；信我的，永远不渴。"],[36,"只是我对你们说过，你们已经看见我，还是不信。"],[37,"凡父所赐给我的人，必到我这里来；到我这里来的，我总不丢弃他。"],[38,"因为我从天上降下来，不是要按自己的意思行，乃是要按那差我来者的意思行。"],[39,"差我来者的意思就是：他所赐给我的，叫我一个也不失落，在末日却叫他复活。"],[40,"因为我父的意思是叫一切见子而信的人得永生，并且在末日我要叫他复活。”"],[41,"犹太人因为耶稣说“我是从天上降下来的粮”，就私下议论他说："],[42,"“这不是约瑟的儿子耶稣吗？他的父母我们岂不认得吗？他如今怎么说‘我是从天上降下来的’呢？”"],[43,"耶稣回答说：“你们不要大家议论。"],[44,"若不是差我来的父吸引人，就没有能到我这里来的；到我这里来的，在末日我要叫他复活。"],[45,"在先知书上写着说：‘他们都要蒙神的教训。’凡听见父之教训又学习的，就到我这里来。"],[46,"这不是说有人看见过父，惟独从神来的，他看见过父。"],[47,"我实实在在地告诉你们，信的人有永生。"],[48,"我就是生命的粮。"],[49,"你们的祖宗在旷野吃过吗哪，还是死了。"],[50,"这是从天上降下来的粮，叫人吃了就不死。"],[51,"我是从天上降下来生命的粮；人若吃这粮，就必永远活着。我所要赐的粮，就是我的肉，为世人之生命所赐的。”"],[52,"因此，犹太人彼此争论说：“这个人怎能把他的肉给我们吃呢？”"],[53,"耶稣说：“我实实在在地告诉你们：你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面。"],[54,"吃我肉喝我血的人就有永生，在末日我要叫他复活。"],[55,"我的肉真是可吃的，我的血真是可喝的。"],[56,"吃我肉喝我血的人常在我里面，我也常在他里面。"],[57,"永活的父怎样差我来，我又因父活着；照样，吃我肉的人也要因我活着。"],[58,"这就是从天上降下来的粮。吃这粮的人，就永远活着，不像你们的祖宗吃过吗哪还是死了。”"],[59,"这些话是耶稣在迦百农会堂里教训人说的。"],[60,"他的门徒中有好些人听见了，就说：“这话甚难，谁能听呢？”"],[61,"耶稣心里知道门徒为这话议论，就对他们说：“这话是叫你们厌弃吗（“厌弃”原文作“跌倒”）？"],[62,"倘或你们看见人子升到他原来所在之处，怎么样呢？"],[63,"叫人活着的乃是灵，肉体是无益的。我对你们所说的话就是灵，就是生命。"],[64,"只是你们中间有不信的人。”耶稣从起头就知道谁不信他，谁要卖他。"],[65,"耶稣又说：“所以我对你们说过，若不是蒙我父的恩赐，没有人能到我这里来。”"],[66,"从此，他门徒中多有退去的，不再和他同行。"],[67,"耶稣就对那十二个门徒说：“你们也要去吗？”"],[68,"西门彼得回答说：“主啊，你有永生之道，我们还归从谁呢？"],[69,"我们已经信了，又知道你是神的圣者。”"],[70,"耶稣说：“我不是拣选了你们十二个门徒吗？但你们中间有一个是魔鬼。”"],[71,"耶稣这话是指着加略人西门的儿子犹大说的，他本是十二个门徒里的一个，后来要卖耶稣的。"]]},{"n":7,"v":[[1,"这事以后，耶稣在加利利游行，不愿在犹太游行，因为犹太人想要杀他。"],[2,"当时犹太人的住棚节近了。"],[3,"耶稣的弟兄就对他说：“你离开这里上犹太去吧！叫你的门徒也看见你所行的事。"],[4,"人要显扬名声，没有在暗处行事的，你如果行这些事，就当将自己显明给世人看。”"],[5,"因为连他的弟兄说这话，是因为不信他。"],[6,"耶稣就对他们说:“我的时候还没有到，你们的时候常是方便的。"],[7,"世人不能恨你们，却是恨我，因为我指证他们所作的事是恶的。"],[8,"你们上去过节吧！我现在不上去过这节，因为我的时候还没有满。”"],[9,"耶稣说了这话，仍旧住在加利利。"],[10,"但他弟兄上去以后，他也上去过节，不是明去，似乎是暗去的。"],[11,"正在节期，犹太人寻找耶稣说：“他在哪里？”"],[12,"众人为他纷纷议论，有的说：“他是好人。”有的说：“不然，他是迷惑众人的。”"],[13,"只是没有人明明地讲论他，因为怕犹太人。"],[14,"到了节期，耶稣上殿里去教训人。"],[15,"犹太人就希奇说：“这个人没有学过，怎么明白书呢？”"],[16,"耶稣说：“我的教训不是我自己的，乃是那差我来者的。"],[17,"人若立志遵着他的旨意行，就必晓得这教训或是出于神，或是我凭着自己说的。"],[18,"人凭着自己说，是求自己的荣耀；惟有求那差他来者的荣耀，这人是真的，在他心里没有不义。"],[19,"摩西岂不是传律法给你们吗？你们却没有一个人守律法。为什么想要杀我呢？”"],[20,"众人回答说：“你是被鬼附着了，谁想要杀你？”"],[21,"耶稣说：“我作了一件事，你们都以为希奇。"],[22,"摩西传割礼给你们（其实不是从摩西起的，乃是从祖先起的），因此你们也在安息日给人行割礼。"],[23,"人若在安息日受割礼，免得违背摩西的律法，我在安息日叫一个人全然好了，你们就向我生气吗？"],[24,"不可按外貌断定是非，总要按公平断定是非。”"],[25,"耶路撒冷人中有的说：“这不是他们想要杀的人吗？"],[26,"你看他还明明地讲道，他们也不向他说什么，难道官长真知道这是基督吗？"],[27,"然而我们知道这个人从哪里来；只是基督来的时候，没有人知道他从哪里来。”"],[28,"那时，耶稣在殿里教训人，大声说：“你们也知道我，也知道我从哪里来；我来并不是由于自己，但那差我来的是真的。你们不认识他。"],[29,"我却认识他，因为我是从他来的，他也是差了我来。”"],[30,"他们就想要捉拿耶稣，只是没有人下手，因为他的时候还没有到。"],[31,"但众人中间有好些信他的，说：“基督来的时候，他所行的神迹岂能比这人所行的更多吗？”"],[32,"法利赛人听见众人为耶稣这样纷纷议论，祭司长和法利赛人就打发差役去捉拿他。"],[33,"于是耶稣说：“我还有不多的时候和你们同在，以后就回到差我来的那里去。"],[34,"你们要找我，却找不着；我所在的地方你们不能到。”"],[35,"犹太人就彼此对问说：“这人要往哪里去，叫我们找不着呢？难道他要往散住希腊中的犹太人那里去教训希腊人吗？"],[36,"他说：‘你们要找我，却找不着；我所在的地方，你们不能到’，这话是什么意思呢？”"],[37,"节期的末日，就是最大之日，耶稣站着高声说：“人若渴了，可以到我这里来喝。"],[38,"信我的人，就如经上所说‘从他腹中要流出活水的江河来。’”"],[39,"耶稣这话是指着信他之人要受圣灵说的，那时还没有赐下圣灵来，因为耶稣尚未得着荣耀。"],[40,"众人听见这话，有的说：“这真是那先知。”"],[41,"有的说：“这是基督。”但也有的说：“基督岂是从加利利出来的吗？"],[42,"经上岂不是说‘基督是大卫的后裔，从大卫本乡伯利恒出来的’吗？”"],[43,"于是众人因着耶稣起了纷争。"],[44,"其中有人要捉拿他，只是无人下手。"],[45,"差役回到祭司长和法利赛人那里，他们对差役说：“你们为什么没有带他来呢？”"],[46,"差役回答说：“从来没有像他这样说话的。”"],[47,"法利赛人说：“你们也受了迷惑吗？"],[48,"官长或是法利赛人岂有信他的呢？"],[49,"但这些不明白律法的百姓是被咒诅的。”"],[50,"内中有尼哥底母，就是从前去见耶稣的，对他们说："],[51,"“不先听本人的口供，不知道他所作的事，难道我们的律法还定他的罪吗？”"],[52,"他们回答说：“你也是出于加利利吗？你且去查考，就可知道加利利没有出过先知。”"],[53,"-"]]},{"n":8,"v":[[1,"于是各人都回家去了，耶稣却往橄榄山去。"],[2,"清早又回到殿里，众百姓都到他那里去，他就坐下教训他们。"],[3,"文士和法利赛人带着一个行淫时被拿的妇人来，叫她站在当中。"],[4,"就对耶稣说：“夫子，这妇人是正行淫之时被拿的。"],[5,"摩西在律法上吩咐我们，把这样的妇人用石头打死。你说该把她怎么样呢？”"],[6,"他们说这话，乃试探耶稣，要得着告他的把柄。耶稣却弯着腰用指头在地上画字。"],[7,"他们还是不住地问他，耶稣就直起腰来，对他们说：“你们中间谁是没有罪的，谁就可以先拿石头打她。”"],[8,"于是又弯着腰用指头在地上画字。"],[9,"他们听见这话，就从老到少一个一个地都出去了，只剩下耶稣一人，还有那妇人仍然站在当中。"],[10,"耶稣就直起腰来，对她说：“妇人，那些人在哪里呢？没有人定你的罪吗？”"],[11,"她说：“主啊，没有。”耶稣说：“我也不定你的罪，去吧！从此不要再犯罪了。”"],[12,"耶稣又对众人说：“我是世界的光。跟从我的，就不在黑暗里走，必要得着生命的光。”"],[13,"法利赛人对他说：“你是为自己作见证，你的见证不真。”"],[14,"耶稣说：“我虽然为自己作见证，我的见证还是真的，因我知道我从哪里来，往哪里去；你们却不知道我从哪里来，往哪里去。"],[15,"你们是以外貌（原文作“凭肉身”）判断人，我却不判断人。"],[16,"就是判断人，我的判断也是真的，因为不是我独自在这里，还有差我来的父与我同在。"],[17,"你们的律法上也记着说：‘两个人的见证是真的。’"],[18,"我是为自己作见证，还有差我来的父也是为我作见证。”"],[19,"他们就问他说：“你的父在哪里？”耶稣回答说：“你们不认识我，也不认识我的父；若是认识我，也就认识我的父。”"],[20,"这些话是耶稣在殿里的库房教训人时所说的，也没有人拿他，因为他的时候还没有到。"],[21,"耶稣又对他们说：“我要去了，你们要找我，并且你们要死在罪中；我所去的地方，你们不能到。”"],[22,"犹太人说：“他说‘我所去的地方，你们不能到’，难道他要自尽吗？”"],[23,"耶稣对他们说：“你们是从下头来的，我是从上头来的；你们是属这世界的，我不是属这世界的。"],[24,"所以我对你们说，你们要死在罪中。你们若不信我是基督，必要死在罪中。”"],[25,"他们就问他说：“你是谁？”耶稣对他们说：“就是我从起初所告诉你们的。"],[26,"我有许多事讲论你们，判断你们，但那差我来的是真的，我在他那里所听见的，我就传给世人。”"],[27,"他们不明白耶稣是指着父说的。"],[28,"所以耶稣说：“你们举起人子以后，必知道我是基督，并且知道我没有一件事是凭着自己作的。我说这些话，乃是照着父所教训我的。"],[29,"那差我来的，是与我同在；他没有撇下我独自在这里，因为我常作他所喜悦的事。”"],[30,"耶稣说这话的时候，就有许多人信他。"],[31,"耶稣对信他的犹太人说：“你们若常常遵守我的道，就真是我的门徒。"],[32,"你们必晓得真理，真理必叫你们得以自由。”"],[33,"他们回答说：“我们是亚伯拉罕的后裔，从来没有作过谁的奴仆，你怎么说‘你们必得以自由’呢？”"],[34,"耶稣回答说：“我实实在在地告诉你们：所有犯罪的，就是罪的奴仆。"],[35,"奴仆不能永远住在家里，儿子是永远住在家里。"],[36,"所以天父的儿子若叫你们自由，你们就真自由了。"],[37,"我知道你们是亚伯拉罕的子孙，你们却想要杀我，因为你们心里容不下我的道。"],[38,"我所说的是在我父那里看见的；你们所行的是在你们的父那里听见的。”"],[39,"他们说：“我们的父就是亚伯拉罕。”耶稣说：“你们若是亚伯拉罕的儿子，就必行亚伯拉罕所行的事。"],[40,"我将在神那里所听见的真理告诉了你们，现在你们却想要杀我。这不是亚伯拉罕所行的事。"],[41,"你们是行你们父所行的事。”他们说：“我们不是从淫乱生的，我们只有一位父，就是神。”"],[42,"耶稣说：“倘若神是你们的父，你们就必爱我，因为我本是出于神，也是从神而来，并不是由着自己来，乃是他差我来。"],[43,"你们为什么不明白我的话呢？无非是因你们不能听我的道。"],[44,"你们是出于你们的父魔鬼，你们父的私欲，你们偏要行。他从起初是杀人的，不守真理，因他心里没有真理；他说谎是出于自己，因他本来是说谎的，也是说谎之人的父。”"],[45,"“我将真理告诉你们，你们就因此不信我。"],[46,"你们中间谁能指证我有罪呢？我既然将真理告诉你们，为什么不信我呢？"],[47,"出于神的，必听神的话；你们不听，因为你们不是出于神。”"],[48,"犹太人回答说：“我们说你是撒玛利亚人，并且是鬼附着的，这话岂不正对吗？”"],[49,"耶稣说：“我不是鬼附着的，我尊敬我的父，你们倒轻慢我。"],[50,"我不求自己的荣耀，有一位为我求荣耀定是非的。"],[51,"我实实在在地告诉你们：人若遵守我的道，就永远不见死。”"],[52,"犹太人对他说：“现在我们知道你是鬼附着的。亚伯拉罕死了，众先知也死了，你还说‘人若遵守我的道，就永远不尝死味。’"],[53,"难道你比我们的祖宗亚伯拉罕还大吗？他死了，众先知也死了，你将自己当作什么人呢？”"],[54,"耶稣回答说：“我若荣耀自己，我的荣耀就算不得什么；荣耀我的乃是我的父，就是你们所说是你们的神。"],[55,"你们未曾认识他，我却认识他；我若说不认识他，我就是说谎的，像你们一样；但我认识他，也遵守他的道。"],[56,"你们的祖宗亚伯拉罕欢欢喜喜地仰望我的日子，既看见了，就快乐。”"],[57,"犹太人说：“你还没有五十岁，岂见过亚伯拉罕呢？”"],[58,"耶稣说：“我实实在在地告诉你们：还没有亚伯拉罕就有了我。”"],[59,"于是他们拿石头要打他，耶稣却躲藏，从殿里出去了。"]]},{"n":9,"v":[[1,"耶稣过去的时候，看见一个人生来是瞎眼的。"],[2,"门徒问耶稣说：“拉比，这人生来是瞎眼的，是谁犯了罪？是这人呢？是他父母呢？”"],[3,"耶稣回答说：“也不是这人犯了罪，也不是他父母犯了罪，是要在他身上显出神的作为来。"],[4,"趁着白日，我们必须作那差我来者的工；黑夜将到，就没有人能作工了。"],[5,"我在世上的时候，是世上的光。”"],[6,"耶稣说了这话，就吐唾沫在地上，用唾沫和泥抹在瞎子的眼睛上，"],[7,"对他说：“你往西罗亚池子里去洗”（“西罗亚”翻出来，就是“奉差遣”）。他去一洗，回头就看见了。"],[8,"他的邻舍和那素常见他是讨饭的，就说：“这不是那从前坐着讨饭的人吗？”"],[9,"有人说：“是他。”又有人说：“不是，却是像他。”他自己说：“是我。”"],[10,"他们对他说：“你的眼睛是怎么开的呢？”"],[11,"他回答说：“有一个人名叫耶稣，他和泥抹我的眼睛，对我说：‘你往西罗亚池子去洗’；我去一洗，就看见了。”"],[12,"他们说：“那个人在哪里？”他说：“我不知道。”"],[13,"他们把从前瞎眼的人带到法利赛人那里。"],[14,"耶稣和泥开他眼睛的日子是安息日。"],[15,"法利赛人也问他是怎么得看见的。瞎子对他们说：“他把泥抹在我的眼睛上，我去一洗，就看见了。”"],[16,"法利赛人中有的说：“这个人不是从神来的，因为他不守安息日。”又有人说：“一个罪人怎能行这样的神迹呢？”他们就起了纷争。"],[17,"他们又对瞎子说：“他既然开了你的眼睛，你说他是怎样的人呢？”他说：“是个先知。”"],[18,"犹太人不信他从前是瞎眼，后来能看见的，等到叫了他的父母来，"],[19,"问他们说：“这是你们的儿子吗？你们说他生来是瞎眼的，如今怎么能看见了呢？”"],[20,"他父母回答说：“他是我们的儿子，生来就瞎眼，这是我们知道的。"],[21,"至于他如今怎么能看见，我们却不知道；是谁开了他的眼睛，我们也不知道。他已经成了人，你们问他吧！他自己必能说。”"],[22,"他父母说这话，是怕犹太人，因为犹太人已经商议定了，若有认耶稣是基督的，要把他赶出会堂。"],[23,"因此他父母说：“他已经成了人，你们问他吧！”"],[24,"所以法利赛人第二次叫了那从前瞎眼的人来，对他说：“你该将荣耀归给神，我们知道这人是个罪人。”"],[25,"他说：“他是个罪人不是，我不知道；有一件事我知道，从前我是眼瞎的，如今能看见了。”"],[26,"他们就问他说：“他向你作什么？是怎么开了你的眼睛呢？”"],[27,"他回答说：“我方才告诉你们，你们不听，为什么又要听呢？莫非你们也要作他的门徒吗？”"],[28,"他们就骂他说：“你是他的门徒，我们是摩西的门徒。"],[29,"神对摩西说话，是我们知道的；只是这个人，我们不知道他从哪里来。”"],[30,"那人回答说：“他开了我的眼睛，你们竟不知道他从哪里来，这真是奇怪！"],[31,"我们知道神不听罪人，惟有敬奉神、遵行他旨意的，神才听他。"],[32,"从创世以来，未曾听见有人把生来是瞎子的眼睛开了。"],[33,"这人若不是从神来的，什么也不能作。”"],[34,"他们回答说：“你全然生在罪孽中，还要教训我们吗？”于是把他赶出去了。"],[35,"耶稣听说他们把他赶出去，后来遇见他，就说：“你信神的儿子吗？”"],[36,"他回答说：“主啊，谁是神的儿子，叫我信他呢？”"],[37,"耶稣说：“你已经看见他，现在和你说话的就是他。”"],[38,"他说：“主啊，我信！”就拜耶稣。"],[39,"耶稣说：“我为审判到这世上来，叫不能看见的，可以看见；能看见的，反瞎了眼。”"],[40,"同他在那里的法利赛人听见这话，就说：“难道我们也瞎了眼吗？”"],[41,"耶稣对他们说：“你们若瞎了眼，就没有罪了；但如今你们说‘我们能看见’，所以你们的罪还在。”"]]},{"n":10,"v":[[1,"“我实实在在地告诉你们：人进羊圈，不从门进去，倒从别处爬进去，那人就是贼，就是强盗。"],[2,"从门进去的，才是羊的牧人。"],[3,"看门的就给他开门，羊也听他的声音。他按着名叫自己的羊，把羊领出来。"],[4,"既放出自己的羊来，就在前头走，羊也跟着他，因为认得他的声音。"],[5,"羊不跟着生人，因为不认得他的声音，必要逃跑。”"],[6,"耶稣将这比喻告诉他们，但他们不明白所说的是什么意思。"],[7,"所以耶稣又对他们说：“我实实在在地告诉你们：我就是羊的门。"],[8,"凡在我以先来的，都是贼，是强盗，羊却不听他们。"],[9,"我就是门，凡从我进来的，必然得救，并且出入得草吃。"],[10,"盗贼来，无非要偷窃、杀害、毁坏；我来了，是要叫羊（或作“人”）得生命，并且得的更丰盛。"],[11,"我是好牧人，好牧人为羊舍命。"],[12,"若是雇工，不是牧人，羊也不是他自己的，他看见狼来，就撇下羊逃走。狼抓住羊，赶散了羊群。"],[13,"雇工逃走，因他是雇工，并不顾念羊。"],[14,"我是好牧人，我认识我的羊，我的羊也认识我。"],[15,"正如父认识我，我也认识父一样，并且我为羊舍命。"],[16,"我另外有羊，不是这圈里的；我必须领它们来，它们也要听我的声音，并且要合成一群，归一个牧人了。"],[17,"我父爱我，因我将命舍去，好再取回来。"],[18,"没有人夺我的命去，是我自己舍的。我有权柄舍了，也有权柄取回来，这是我从我父所受的命令。”"],[19,"犹太人为这些话又起了纷争。"],[20,"内中有好些人说：“他是被鬼附着，而且疯了，为什么听他呢？”"],[21,"又有人说：“这不是鬼附之人所说的话，鬼岂能叫瞎子的眼睛开了呢？”"],[22,"在耶路撒冷有修殿节，是冬天的时候。"],[23,"耶稣在殿里所罗门的廊下行走。"],[24,"犹太人围着他，说：“你叫我们犹疑不定到几时呢？你若是基督，就明明地告诉我们。”"],[25,"耶稣回答说：“我已经告诉你们，你们不信。我奉我父之名所行的事可以为我作见证。"],[26,"只是你们不信，因为你们不是我的羊。"],[27,"我的羊听我的声音，我也认识他们，他们也跟着我。"],[28,"我又赐给他们永生，他们永不灭亡，谁也不能从我手里把他们夺去。"],[29,"我父把羊赐给我，他比万有都大，谁也不能从我父手里把他们夺去。"],[30,"我与父原为一。”"],[31,"犹太人又拿起石头来要打他。"],[32,"耶稣对他们说：“我从父显出许多善事给你们看，你们是为哪一件拿石头打我呢？”"],[33,"犹太人回答说：“我们不是为善事拿石头打你，是为你说僭妄的话；又为你是个人，反将自己当作神。”"],[34,"耶稣说：“你们的律法上岂不是写着‘我曾说你们是神’吗？"],[35,"经上的话是不能废的。若那些承受神道的人，尚且称为神；"],[36,"父所分别为圣，又差到世间来的，他自称是神的儿子，你们还向他说‘你说僭妄的话’吗？"],[37,"我若不行我父的事，你们就不必信我；"],[38,"我若行了，你们纵然不信我，也当信这些事，叫你们又知道又明白父在我里面，我也在父里面。”"],[39,"他们又要拿他，他却逃出他们的手走了。"],[40,"耶稣又往约旦河外去，到了约翰起初施洗的地方，就住在那里。"],[41,"有许多人来到他那里，他们说：“约翰一件神迹没有行过，但约翰指着这人所说的一切话都是真的。”"],[42,"在那里信耶稣的人就多了。"]]},{"n":11,"v":[[1,"有一个患病的人，名叫拉撒路，住在伯大尼，就是马利亚和她姐姐马大的村庄。"],[2,"这马利亚就是那用香膏抹主，又用头发擦他脚的，患病的拉撒路是她的兄弟。"],[3,"她姐妹两个就打发人去见耶稣说：“主啊，你所爱的人病了。”"],[4,"耶稣听见就说：“这病不至于死，乃是为神的荣耀，叫神的儿子因此得荣耀。”"],[5,"耶稣素来爱马大和她妹子并拉撒路，"],[6,"听见拉撒路病了，就在所居之地仍住了两天。"],[7,"然后对门徒说：“我们再往犹太去吧！”"],[8,"门徒说：“拉比，犹太人近来要拿石头打你，你还往那里去吗？”"],[9,"耶稣回答说：“白日不是有十二小时吗？人在白日走路，就不至跌倒，因为看见这世上的光；"],[10,"若在黑夜走路，就必跌倒，因为他没有光。”"],[11,"耶稣说了这话，随后对他们说：“我们的朋友拉撒路睡了，我去叫醒他。”"],[12,"门徒说：“主啊，他若睡了，就必好了。”"],[13,"耶稣这话是指着他死说的，他们却以为是说照常睡了。"],[14,"耶稣就明明地告诉他们说：“拉撒路死了。"],[15,"我没有在那里就欢喜，这是为你们的缘故，好叫你们相信。如今我们可以往他那里去吧！”"],[16,"多马，又称为低土马，就对那同作门徒的说：“我们也去和他同死吧！”"],[17,"耶稣到了，就知道拉撒路在坟墓里已经四天了。"],[18,"伯大尼离耶路撒冷不远，约有六里路。"],[19,"有好些犹太人来看马大和马利亚，要为她们的兄弟安慰她们。"],[20,"马大听见耶稣来了，就出去迎接他，马利亚却仍然坐在家里。"],[21,"马大对耶稣说：“主啊，你若早在这里，我兄弟必不死。"],[22,"就是现在，我也知道，你无论向神求什么，神也必赐给你。”"],[23,"耶稣说：“你兄弟必然复活。”"],[24,"马大说：“我知道在末日复活的时候，他必复活。”"],[25,"耶稣对她说：“复活在我，生命也在我；信我的人，虽然死了，也必复活。"],[26,"凡活着信我的人必永远不死。你信这话吗？”"],[27,"马大说：“主啊，是的，我信你是基督，是神的儿子，就是那要临到世界的。”"],[28,"马大说了这话，就回去暗暗地叫她妹子马利亚说：“夫子来了，叫你。”"],[29,"马利亚听见了，就急忙起来，到耶稣那里去。"],[30,"那时，耶稣还没有进村子，仍在马大迎接他的地方。"],[31,"那些同马利亚在家里安慰她的犹太人，见她急忙起来出去，就跟着她，以为她要往坟墓那里去哭。"],[32,"马利亚到了耶稣那里，看见他，就俯伏在他脚前，说：“主啊，你若早在这里，我兄弟必不死。”"],[33,"耶稣看见她哭，并看见与她同来的犹太人也哭，就心里悲叹，又甚忧愁，"],[34,"便说：“你们把他安放在哪里？”他们回答说：“请主来看。”"],[35,"耶稣哭了。"],[36,"犹太人就说：“你看他爱这人是何等恳切。”"],[37,"其中有人说：“他既然开了瞎子的眼睛，岂不能叫这人不死吗？”"],[38,"耶稣又心里悲叹，来到坟墓前。那坟墓是个洞，有一块石头挡着。"],[39,"耶稣说：“你们把石头挪开。”那死人的姐姐马大对他说：“主啊，他现在必是臭了，因为他死了已经四天了。”"],[40,"耶稣说：“我不是对你说过，你若信，就必看见神的荣耀吗？”"],[41,"他们就把石头挪开。耶稣举目望天说：“父啊，我感谢你，因为你已经听我！"],[42,"我也知道你常听我。但我说这话，是为周围站着的众人，叫他们信是你差了我来。”"],[43,"说了这话，就大声呼叫说：“拉撒路出来！”"],[44,"那死人就出来了，手脚裹着布，脸上包着手巾。耶稣对他们说：“解开，叫他走！”"],[45,"那些来看马利亚的犹太人见了耶稣所作的事，就多有信他的。"],[46,"但其中也有去见法利赛人的，将耶稣所作的事告诉他们。"],[47,"祭司长和法利赛人聚集公会，说：“这人行好些神迹，我们怎么办呢？"],[48,"若这样由着他，人人都要信他，罗马人也要来夺我们的地土和我们的百姓。”"],[49,"内中有一个人，名叫该亚法，本年作大祭司，对他们说：“你们不知道什么。"],[50,"独不想一个人替百姓死，免得通国灭亡，就是你们的益处。”"],[51,"他这话不是出于自己，是因他本年作大祭司，所以预言耶稣将要替这一国死。"],[52,"也不但替这一国死，并要将神四散的子民都聚集归一。"],[53,"从那日起他们就商议要杀耶稣。"],[54,"所以耶稣不再显然行在犹太人中间，就离开那里往靠近旷野的地方去。到了一座城，名叫以法莲，就在那里和门徒同住。"],[55,"犹太人的逾越节近了，有许多人从乡下上耶路撒冷去，要在节前洁净自己。"],[56,"他们就寻找耶稣，站在殿里彼此说：“你们的意思如何？他不来过节吗？”"],[57,"那时，祭司长和法利赛人早已吩咐说：“若有人知道耶稣在哪里，就要报明，好去拿他。”"]]},{"n":12,"v":[[1,"逾越节前六日，耶稣来到伯大尼，就是他叫拉撒路从死里复活之处。"],[2,"有人在那里给耶稣预备筵席，马大伺候，拉撒路也在那同耶稣坐席的人中。"],[3,"马利亚就拿着一斤极贵的真哪哒香膏抹耶稣的脚，又用自己头发去擦，屋里就满了膏的香气。"],[4,"有一个门徒，就是那将要卖耶稣的加略人犹大，"],[5,"说：“这香膏为什么不卖三十两银子周济穷人呢？”"],[6,"他说这话，并不是挂念穷人，乃因他是个贼，又带着钱囊，常取其中所存的。"],[7,"耶稣说：“由她吧！她是为我安葬之日存留的。"],[8,"因为常有穷人和你们同在，只是你们不常有我。”"],[9,"有许多犹太人知道耶稣在那里，就来了，不但是为耶稣的缘故，也是要看他从死里所复活的拉撒路。"],[10,"但祭司长商议连拉撒路也要杀了，"],[11,"因有好些犹太人为拉撒路的缘故，回去信了耶稣。"],[12,"第二天，有许多上来过节的人，听见耶稣将到耶路撒冷，"],[13,"就拿着棕树枝，出去迎接他，喊着说：“和散那！奉主名来的以色列王是应当称颂的。”"],[14,"耶稣得了一个驴驹，就骑上，如经上所记的说："],[15,"“锡安的民哪（“民”原文作“女子”），不要惧怕，你的王骑着驴驹来了。”"],[16,"这些事门徒起先不明白，等到耶稣得了荣耀以后，才想起这话是指着他写的，并且众人果然向他这样行了。"],[17,"当耶稣呼唤拉撒路叫他从死复活出坟墓的时候，同耶稣在那里的众人就作见证。"],[18,"众人因听见耶稣行了这神迹，就去迎接他。"],[19,"法利赛人彼此说：“看哪，你们是徒劳无益，世人都随从他去了。”"],[20,"那时，上来过节礼拜的人中，有几个希腊人。"],[21,"他们来见加利利伯赛大的腓力，求他说：“先生，我们愿意见耶稣。”"],[22,"腓力去告诉安得烈，安得烈同腓力去告诉耶稣。"],[23,"耶稣说：“人子得荣耀的时候到了。"],[24,"我实实在在地告诉你们：一粒麦子不落在地里死了，仍旧是一粒；若是死了，就结出许多子粒来。"],[25,"爱惜自己生命的，就失丧生命；在这世上恨恶自己生命的，就要保守生命到永生。"],[26,"若有人服侍我，就当跟从我；我在哪里，服侍我的人也要在那里；若有人服侍我，我父必尊重他。”"],[27,"“我现在心里忧愁，我说什么才好呢？父啊，救我脱离这时候，但我原是为这时候来的。"],[28,"父啊，愿你荣耀你的名。”当时就有声音从天上来说：“我已经荣耀了我的名，还要再荣耀。”"],[29,"站在旁边的众人听见，就说：“打雷了。”还有人说：“有天使对他说话。”"],[30,"耶稣说：“这声音不是为我，是为你们来的。"],[31,"现在这世界受审判，这世界的王要被赶出去。"],[32,"我若从地上被举起来，就要吸引万人来归我。”"],[33,"耶稣这话原是指着自己将要怎样死说的。"],[34,"众人回答说：“我们听见律法上有话说基督是永存的，你怎么说人子必须被举起来呢？这人子是谁呢？”"],[35,"耶稣对他们说：“光在你们中间还有不多的时候，应当趁着有光行走，免得黑暗临到你们；那在黑暗里行走的，不知道往何处去。"],[36,"你们应当趁着有光，信从这光，使你们成为光明之子。”耶稣说了这话，就离开他们，隐藏了。"],[37,"他虽然在他们面前行了许多神迹，他们还是不信他。"],[38,"这是要应验先知以赛亚的话，说：“主啊，我们所传的有谁信呢？主的膀臂向谁显露呢？”"],[39,"他们所以不能信，因为以赛亚又说："],[40,"“主叫他们瞎了眼、硬了心，免得他们眼睛看见，心里明白，回转过来，我就医治他们。”"],[41,"以赛亚因为看见他的荣耀，就指着他说这话。"],[42,"虽然如此，官长中却有好些信他的，只因法利赛人的缘故，就不承认，恐怕被赶出会堂。"],[43,"这是因他们爱人的荣耀过于爱神的荣耀。"],[44,"耶稣大声说：“信我的，不是信我，乃是信那差我来的。"],[45,"人看见我，就是看见那差我来的。"],[46,"我到世上来，乃是光，叫凡信我的，不住在黑暗里。"],[47,"若有人听见我的话不遵守，我不审判他。我来本不是要审判世界，乃是要拯救世界。"],[48,"弃绝我、不领受我话的人，有审判他的，就是我所讲的道在末日要审判他。"],[49,"因为我没有凭着自己讲，惟有差我来的父已经给我命令，叫我说什么，讲什么。"],[50,"我也知道他的命令就是永生。故此，我所讲的话正是照着父对我所说的。”"]]},{"n":13,"v":[[1,"逾越节以前，耶稣知道自己离世归父的时候到了，他既然爱世间属自己的人，就爱他们到底。"],[2,"吃晚饭的时候（魔鬼已将卖耶稣的意思放在西门的儿子加略人犹大心里），"],[3,"耶稣知道父已将万有交在他手里，且知道自己是从神出来的，又要归到神那里去，"],[4,"就离席站起来脱了衣服，拿一条手巾束腰。"],[5,"随后把水倒在盆里，就洗门徒的脚，并用自己所束的手巾擦干。"],[6,"挨到西门彼得，彼得对他说：“主啊，你洗我的脚吗？”"],[7,"耶稣回答说：“我所作的，你如今不知道，后来必明白。”"],[8,"彼得说：“你永不可洗我的脚。”耶稣说：“我若不洗你，你就与我无份了。”"],[9,"西门彼得说：“主啊，不但我的脚，连手和头也要洗。”"],[10,"耶稣说：“凡洗过澡的人，只要把脚一洗，全身就干净了；你们是干净的，然而不都是干净的。”"],[11,"耶稣原知道要卖他的是谁，所以说：“你们不都是干净的。”"],[12,"耶稣洗完了他们的脚，就穿上衣服，又坐下，对他们说：“我向你们所作的，你们明白吗？"],[13,"你们称呼我夫子，称呼我主，你们说的不错，我本来是。"],[14,"我是你们的主，你们的夫子，尚且洗你们的脚，你们也当彼此洗脚。"],[15,"我给你们作了榜样，叫你们照着我向你们所作的去作。"],[16,"我实实在在地告诉你们：仆人不能大于主人，差人也不能大于差他的人。"],[17,"你们既知道这事，若是去行就有福了。"],[18,"我这话不是指着你们众人说的，我知道我所拣选的是谁。现在要应验经上的话，说：‘同我吃饭的人，用脚踢我。’"],[19,"如今事情还没有成就，我要先告诉你们，叫你们到事情成就的时候，可以信我是基督。"],[20,"我实实在在地告诉你们：有人接待我所差遣的，就是接待我；接待我，就是接待那差遣我的。”"],[21,"耶稣说了这话，心里忧愁，就明说：“我实实在在地告诉你们：你们中间有一个人要卖我了。”"],[22,"门徒彼此对看，猜不透所说的是谁。"],[23,"有一个门徒，是耶稣所爱的，侧身挨近耶稣的怀里。"],[24,"西门彼得点头对他说：“你告诉我们，主是指着谁说的。”"],[25,"那门徒便就势靠着耶稣的胸膛，问他说：“主啊，是谁呢？”"],[26,"耶稣回答说：“我蘸一点饼给谁，就是谁。”耶稣就蘸了一点饼递给加略人西门的儿子犹大。"],[27,"他吃了以后，撒但就入了他的心。耶稣便对他说：“你所作的快作吧！”"],[28,"同席的人，没有一个知道是为什么对他说这话。"],[29,"有人因犹大带着钱囊，以为耶稣是对他说：“你去买我们过节所应用的东西”，或是叫他拿什么周济穷人。"],[30,"犹大受了那点饼，立刻就出去。那时候是夜间了。"],[31,"他既出去，耶稣就说：“如今人子得了荣耀，神在人子身上也得了荣耀。"],[32,"神要因自己荣耀人子，并且要快快地荣耀他。"],[33,"小子们，我还有不多的时候与你们同在，后来你们要找我，但我所去的地方你们不能到。这话我曾对犹太人说过，如今也照样对你们说。"],[34,"我赐给你们一条新命令，乃是叫你们彼此相爱；我怎样爱你们，你们也要怎样相爱。"],[35,"你们若有彼此相爱的心，众人因此就认出你们是我的门徒了。”"],[36,"西门彼得问耶稣说：“主往哪里去？”耶稣回答说：“我所去的地方，你现在不能跟我去，后来却要跟我去。”"],[37,"彼得说：“主啊，我为什么现在不能跟你去？我愿意为你舍命。”"],[38,"耶稣说：“你愿意为我舍命吗？我实实在在地告诉你：鸡叫以先，你要三次不认我。”"]]},{"n":14,"v":[[1,"“你们心里不要忧愁，你们信神，也当信我。"],[2,"在我父的家里有许多住处；若是没有，我就早已告诉你们了。我去原是为你们预备地方去。"],[3,"我若去为你们预备了地方，就必再来接你们到我那里去；我在那里，叫你们也在那里。"],[4,"我往哪里去，你们知道；那条路，你们也知道（有古卷作“我往哪里去，你们知道那条路”）。”"],[5,"多马对他说：“主啊，我们不知道你往哪里去，怎么知道那条路呢？”"],[6,"耶稣说：“我就是道路、真理、生命，若不藉着我，没有人能到父那里去。"],[7,"你们若认识我，也就认识我的父。从今以后，你们认识他，并且已经看见他。”"],[8,"腓力对他说：“求主将父显给我们看，我们就知足了。”"],[9,"耶稣对他说：“腓力，我与你们同在这样长久，你还不认识我吗？人看见了我，就是看见了父，你怎么说：‘将父显给我们看’呢？"],[10,"我在父里面，父在我里面，你不信吗？我对你们所说的话，不是凭着自己说的，乃是住在我里面的父作他自己的事。"],[11,"你们当信我，我在父里面，父在我里面；即或不信，也当因我所作的事信我。"],[12,"我实实在在地告诉你们：我所作的事，信我的人也要作；并且要作比这更大的事，因为我往父那里去。"],[13,"你们奉我的名无论求什么，我必成就，叫父因儿子得荣耀。"],[14,"你们若奉我的名求什么，我必成就。”"],[15,"你们若爱我，就必遵守我的命令。"],[16,"我要求父，父就另外赐给你们一位保惠师（或作“训慰师”。下同），叫他永远与你们同在，"],[17,"就是真理的圣灵，乃世人不能接受的。因为不见他，也不认识他；你们却认识他，因他常与你们同在，也要在你们里面。"],[18,"我不撇下你们为孤儿。我必到你们这里来。"],[19,"还有不多的时候，世人不再看见我；你们却看见我，因为我活着，你们也要活着。"],[20,"到那日你们就知道我在父里面，你们在我里面，我也在你们里面。"],[21,"有了我的命令又遵守的，这人就是爱我的；爱我的必蒙我父爱他， 我也要爱他，并且要向他显现。”"],[22,"犹大（不是加略人犹大）问耶稣说：“主啊，为什么要向我们显现，不向世人显现呢？”"],[23,"耶稣回答说：“人若爱我，就必遵守我的道，我父也必爱他，并且我们要到他那里去，与他同住。"],[24,"不爱我的人就不遵守我的道，你们所听见的道不是我的，乃是差我来之父的道。”"],[25,"“我还与你们同住的时候，已将这些话对你们说了。"],[26,"但保惠师，就是父因我的名所要差来的圣灵，他要将一切的事指教你们，并且要叫你们想起我对你们所说的一切话。"],[27,"我留下平安给你们，我将我的平安赐给你们。我所赐的，不像世人所赐的，你们心里不要忧愁，也不要胆怯。"],[28,"你们听见我对你们说了，我去还要到你们这里来。你们若爱我，因我到父那里去，就必喜乐，因为父是比我大的。"],[29,"现在事情还没有成就，我预先告诉你们，叫你们到事情成就的时候，就可以信。"],[30,"以后我不再和你们多说话，因为这世界的王将到，他在我里面是毫无所有，"],[31,"但要叫世人知道我爱父，并且父怎样吩咐我，我就怎样行。起来，我们走吧！”"]]},{"n":15,"v":[[1,"“我是真葡萄树，我父是栽培的人。"],[2,"凡属我不结果子的枝子，他就剪去；凡结果子的，他就修理干净，使枝子结果子更多。"],[3,"现在你们因我讲给你们的道，已经干净了。"],[4,"你们要常在我里面，我也常在你们里面。枝子若不常在葡萄树上，自己就不能结果子；你们若不常在我里面，也是这样。"],[5,"我是葡萄树，你们是枝子；常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能作什么。"],[6,"人若不常在我里面，就像枝子丢在外面枯干，人拾起来，扔在火里烧了。"],[7,"你们若常在我里面，我的话也常在你们里面；凡你们所愿意的，祈求就给你们成就。"],[8,"你们多结果子，我父就因此得荣耀，你们也就是我的门徒了。"],[9,"我爱你们，正如父爱我一样，你们要常在我的爱里。"],[10,"你们若遵守我的命令，就常在我的爱里；正如我遵守了我父的命令，常在他的爱里。”"],[11,"“这些事我已经对你们说了，是要叫我的喜乐存在你们心里，并叫你们的喜乐可以满足。"],[12,"你们要彼此相爱，像我爱你们一样，这就是我的命令。"],[13,"人为朋友舍命，人的爱心没有比这个大的。"],[14,"你们若遵行我所吩咐的，就是我的朋友了。"],[15,"以后我不再称你们为仆人，因仆人不知道主人所作的事；我乃称你们为朋友，因我从我父所听见的，已经都告诉你们了。"],[16,"不是你们拣选了我，是我拣选了你们；并且分派你们去结果子，叫你们的果子常存，使你们奉我的名，无论向父求什么，他就赐给你们。"],[17,"我这样吩咐你们，是要叫你们彼此相爱。”"],[18,"“世人若恨你们，你们知道（或作“该知道”）恨你们以先，已经恨我了。"],[19,"你们若属世界，世界必爱属自己的；只因你们不属世界，乃是我从世界中拣选了你们，所以世界就恨你们。"],[20,"你们要记念我从前对你们所说的话：‘仆人不能大于主人。’他们若逼迫了我，也要逼迫你们；若遵守了我的话，也要遵守你们的话。"],[21,"但他们因我的名要向你们行这一切的事，因为他们不认识那差我来的。"],[22,"我若没有来教训他们，他们就没有罪；但如今他们的罪无可推诿了。"],[23,"恨我的，也恨我的父。"],[24,"我若没有在他们中间行过别人未曾行的事，他们就没有罪；但如今连我与我的父，他们也看见也恨恶了。"],[25,"这要应验他们律法上所写的话，说：‘他们无故地恨我。’"],[26,"但我要从父那里差保惠师来，就是从父出来真理的圣灵，他来了，就要为我作见证。"],[27,"你们也要作见证，因为你们从起头就与我同在。”"]]},{"n":16,"v":[[1,"“我已将这些事告诉你们，使你们不至于跌倒。"],[2,"人要把你们赶出会堂，并且时候将到，凡杀你们的，就以为是侍奉神。"],[3,"他们这样行，是因未曾认识父，也未曾认识我。"],[4,"我将这事告诉你们，是叫你们到了时候，可以想起我对你们说过了。我起先没有将这事告诉你们，因为我与你们同在。"],[5,"现今我往差我来的父那里去，你们中间并没有人问我：‘你往哪里去？’"],[6,"只因我将这事告诉你们，你们就满心忧愁。"],[7,"然而我将真情告诉你们，我去是与你们有益的。我若不去，保惠师就不到你们这里来；我若去，就差他来。"],[8,"他既来了，就要叫世人为罪、为义、为审判，自己责备自己。"],[9,"为罪，是因他们不信我；"],[10,"为义，是因我往父那里去，你们就不再见我；"],[11,"为审判，是因这世界的王受了审判。”"],[12,"“我还有好些事要告诉你们，但你们现在担当不了（或作“不能领会”）。"],[13,"只等真理的圣灵来了，他要引导你们明白（原文作“进入”）一切的真理，因为他不是凭自己说的，乃是把他所听见的都说出来，并要把将来的事告诉你们。"],[14,"他要荣耀我，因为他要将受于我的告诉你们。"],[15,"凡父所有的，都是我的，所以我说，他要将受于我的告诉你们。”"],[16,"“等不多时，你们就不得见我；再等不多时，你们还要见我。”"],[17,"有几个门徒就彼此说：“他对我们说：‘等不多时，你们就不得见我；再等不多时，你们还要见我’；又说：‘因我往父那里去。’这是什么意思呢？”"],[18,"门徒彼此说：“他说‘等不多时’，到底是什么意思呢？我们不明白他所说的话。”"],[19,"耶稣看出他们要问他，就说：“我说：‘等不多时，你们就不得见我；再等不多时，你们还要见我’，你们为这话彼此相问吗？"],[20,"我实实在在地告诉你们：你们将要痛哭、哀号，世人倒要喜乐；你们将要忧愁，然而你们的忧愁要变为喜乐。"],[21,"妇人生产的时候就忧愁，因为她的时候到了；既生了孩子，就不再记念那苦楚，因为欢喜世上生了一个人。"],[22,"你们现在也是忧愁，但我要再见你们，你们的心就喜乐了，这喜乐也没有人能夺去。"],[23,"到那日，你们什么也就不问我了。我实实在在地告诉你们：你们若向父求什么，他必因我的名赐给你们。"],[24,"向来你们没有奉我的名求什么，如今你们求就必得着，叫你们的喜乐可以满足。”"],[25,"“这些事，我是用比喻对你们说的；时候将到，我不再用比喻对你们说，乃要将父明明地告诉你们。"],[26,"到那日，你们要奉我的名祈求；我并不对你们说，我要为你们求父。"],[27,"父自己爱你们，因为你们已经爱我，又信我是从父出来的。"],[28,"我从父出来，到了世界；我又离开世界，往父那里去。”"],[29,"门徒说：“如今你是明说，并不用比喻了。"],[30,"现在我们晓得你凡事都知道，也不用人问你，因此我们信你是从神出来的。”"],[31,"耶稣说：“现在你们信吗？"],[32,"看哪，时候将到，且是已经到了，你们要分散，各归自己的地方去，留下我独自一人；其实我不是独自一人，因为有父与我同在。"],[33,"我将这些事告诉你们，是要叫你们在我里面有平安。在世上你们有苦难，但你们可以放心，我已经胜了世界。”"]]},{"n":17,"v":[[1,"耶稣说了这话，就举目望天说：“父啊，时候到了，愿你荣耀你的儿子，使儿子也荣耀你；"],[2,"正如你曾赐给他权柄管理凡有血气的，叫他将永生赐给你所赐给他的人。"],[3,"认识你独一的真神，并且认识你所差来的耶稣基督，这就是永生。"],[4,"我在地上已经荣耀你，你所托付我的事，我已成全了。"],[5,"父啊，现在求你使我同你享荣耀，就是未有世界以先我同你所有的荣耀。”"],[6,"“你从世上赐给我的人，我已将你的名显明与他们。他们本是你的，你将他们赐给我，他们也遵守了你的道。"],[7,"如今他们知道，凡你所赐给我的，都是从你那里来的；"],[8,"因为你所赐给我的道，我已经赐给他们。他们也领受了，又确实知道，我是从你出来的，并且信你差了我来。"],[9,"我为他们祈求，不为世人祈求，却为你所赐给我的人祈求，因他们本是你的。"],[10,"凡是我的都是你的，你的也是我的，并且我因他们得了荣耀。"],[11,"从今以后，我不在世上，他们却在世上，我往你那里去。圣父啊，求你因你所赐给我的名保守他们，叫他们合而为一，像我们一样。"],[12,"我与他们同在的时候，因你所赐给我的名保守了他们，我也护卫了他们；其中除了那灭亡之子，没有一个灭亡的，好叫经上的话得应验。"],[13,"现在我往你那里去，我还在世上说这话，是叫他们心里充满我的喜乐。"],[14,"我已将你的道赐给他们，世界又恨他们；因为他们不属世界，正如我不属世界一样。"],[15,"我不求你叫他们离开世界，只求你保守他们脱离那恶者（或作“脱离罪恶”）。"],[16,"他们不属世界，正如我不属世界一样。"],[17,"求你用真理使他们成圣，你的道就是真理。"],[18,"你怎样差我到世上，我也照样差他们到世上。"],[19,"我为他们的缘故，自己分别为圣，叫他们也因真理成圣。”"],[20,"“我不但为这些人祈求，也为那些因他们的话信我的人祈求，"],[21,"使他们都合而为一。正如你父在我里面，我在你里面，使他们也在我们里面，叫世人可以信你差了我来。"],[22,"你所赐给我的荣耀，我已赐给他们，使他们合而为一，像我们合而为一。"],[23,"我在他们里面，你在我里面，使他们完完全全地合而为一，叫世人知道你差了我来，也知道你爱他们如同爱我一样。"],[24,"父啊，我在哪里，愿你所赐给我的人也同我在那里，叫他们看见你所赐给我的荣耀；因为创立世界以前，你已经爱我了。"],[25,"公义的父啊，世人未曾认识你，我却认识你，这些人也知道你差了我来。"],[26,"我已将你的名指示他们，还要指示他们，使你所爱我的爱在他们里面，我也在他们里面。”"]]},{"n":18,"v":[[1,"耶稣说了这话，就同门徒出去，过了汲沦溪，在那里有一个园子，他和门徒进去了。"],[2,"卖耶稣的犹大也知道那地方，因为耶稣和门徒屡次上那里去聚集。"],[3,"犹大领了一队兵和祭司长并法利赛人的差役，拿着灯笼、火把、兵器，就来到园里。"],[4,"耶稣知道将要临到自己的一切事，就出来对他们说：“你们找谁？”"],[5,"他们回答说：“找拿撒勒人耶稣。”耶稣说：“我就是。”卖他的犹大也同他们站在那里。"],[6,"耶稣一说“我就是”，他们就退后倒在地上。"],[7,"他又问他们说：“你们找谁？”他们说：“找拿撒勒人耶稣。”"],[8,"耶稣说：“我已经告诉你们，我就是。你们若找我，就让这些人去吧！”"],[9,"这要应验耶稣从前的话，说：“你所赐给我的人，我没有失落一个。”"],[10,"西门彼得带着一把刀，就拔出来，将大祭司的仆人砍了一刀，削掉他的右耳，那仆人名叫马勒古。"],[11,"耶稣就对彼得说：“收刀入鞘吧！我父所给我的那杯，我岂可不喝呢？”"],[12,"那队兵和千夫长并犹太人的差役就拿住耶稣，把他捆绑了，"],[13,"先带到亚那面前，因为亚那是本年作大祭司该亚法的岳父。"],[14,"这该亚法就是从前向犹太人发议论说“一个人替百姓死是有益的”那位。"],[15,"西门彼得跟着耶稣，还有一个门徒跟着。那门徒是大祭司所认识的，他就同耶稣进了大祭司的院子。"],[16,"彼得却站在门外；大祭司所认识的那个门徒出来，和看门的使女说了一声，就领彼得进去。"],[17,"那看门的使女对彼得说：“你不也是这人的门徒吗？”他说：“我不是。”"],[18,"仆人和差役因为天冷，就生了炭火，站在那里烤火，彼得也同他们站着烤火。"],[19,"大祭司就以耶稣的门徒和他的教训盘问他。"],[20,"耶稣回答说：“我从来是明明地对世人说话，我常在会堂和殿里，就是犹太人聚集的地方教训人；我在暗地里并没有说什么。"],[21,"你为什么问我呢？可以问那听见的人，我对他们说的是什么；我所说的，他们都知道。”"],[22,"耶稣说了这话，旁边站着的一个差役用手掌打他，说：“你这样回答大祭司吗？”"],[23,"耶稣说：“我若说得不是，你可以指证那不是；我若说得是，你为什么打我呢？”"],[24,"亚那就把耶稣解到大祭司该亚法那里，仍是捆着解去的。"],[25,"西门彼得正站着烤火，有人对他说：“你不也是他的门徒吗？”彼得不承认，说：“我不是。”"],[26,"有大祭司的一个仆人，是彼得削掉耳朵那人的亲属，说：“我不是看见你同他在园子里吗？”"],[27,"彼得又不承认。立时鸡就叫了。"],[28,"众人将耶稣从该亚法那里往衙门内解去，那时天还早，他们自己却不进衙门，恐怕染了污秽，不能吃逾越节的筵席。"],[29,"彼拉多就出来，到他们那里，说：“你们告这人是为什么事呢？”"],[30,"他们回答说：“这人若不是作恶的，我们就不把他交给你。”"],[31,"彼拉多说：“你们自己带他去，按着你们的律法审问他吧！”犹太人说：“我们没有杀人的权柄。”"],[32,"这要应验耶稣所说自己将要怎样死的话了。"],[33,"彼拉多又进了衙门，叫耶稣来，对他说：“你是犹太人的王吗？”"],[34,"耶稣回答说：“这话是你自己说的，还是别人论我对你说的呢？”"],[35,"彼拉多说：“我岂是犹太人呢？你本国的人和祭司长把你交给我，你作了什么事呢？”"],[36,"耶稣回答说：“我的国不属这世界；我的国若属这世界，我的臣仆必要争战，使我不至于被交给犹太人；只是我的国不属这世界。”"],[37,"彼拉多就对他说：“这样，你是王吗？”耶稣回答说：“你说我是王，我为此而生，也为此来到世间，特为给真理作见证；凡属真理的人就听我的话。”"],[38,"彼拉多说：“真理是什么呢？”说了这话，又出来到犹太人那里，对他们说：“我查不出他有什么罪来，"],[39,"但你们有个规矩，在逾越节要我给你们释放一个人，你们要我给你们释放犹太人的王吗？”"],[40,"他们又喊着说：“不要这人，要巴拉巴！”这巴拉巴是个强盗。"]]},{"n":19,"v":[[1,"当下彼拉多将耶稣鞭打了。"],[2,"兵丁用荆棘编作冠冕戴在他头上，给他穿上紫袍，"],[3,"又挨近他说：“恭喜犹太人的王啊！”他们就用手掌打他。"],[4,"彼拉多又出来对众人说：“我带他出来见你们，叫你们知道我查不出他有什么罪来。”"],[5,"耶稣出来，戴着荆棘冠冕，穿着紫袍。彼拉多对他们说：“你们看这个人。”"],[6,"祭司长和差役看见他，就喊着说：“钉他十字架！钉他十字架！”彼拉多说：“你们自己把他钉十字架吧！我查不出他有什么罪来。”"],[7,"犹太人回答说：“我们有律法。按那律法，他是该死的。因他以自己为神的儿子。”"],[8,"彼拉多听见这话，越发害怕。"],[9,"又进衙门，对耶稣说：“你是哪里来的？”耶稣却不回答。"],[10,"彼拉多说：“你不对我说话吗？你岂不知我有权柄释放你，也有权柄把你钉十字架吗？”"],[11,"耶稣回答说：“若不是从上头赐给你的，你就毫无权柄办我，所以把我交给你的那人，罪更重了。”"],[12,"从此彼拉多想要释放耶稣，无奈犹太人喊着说：“你若释放这个人，就不是凯撒的忠臣（原文作“朋友”）。凡以自己为王的，就是背叛凯撒了。”"],[13,"彼拉多听见这话，就带耶稣出来，到了一个地方，名叫铺华石处，希伯来话叫厄巴大，就在那里坐堂。"],[14,"那日是预备逾越节的日子，约有午正，彼拉多对犹太人说：“看哪，这是你们的王。”"],[15,"他们喊着说：“除掉他，除掉他！钉他在十字架上！”彼拉多说：“我可以把你们的王钉十字架吗？”祭司长回答说：“除了凯撒，我们没有王。”"],[16,"于是，彼拉多将耶稣交给他们去钉十字架。"],[17,"他们就把耶稣带了去。耶稣背着自己的十字架出来，到了一个地方，名叫髑髅地，希伯来话叫各各他。"],[18,"他们就在那里钉他在十字架上，还有两个人和他一同钉着，一边一个，耶稣在中间。"],[19,"彼拉多又用牌子写了一个名号，安在十字架上，写的是：“犹太人的王，拿撒勒人耶稣。”"],[20,"有许多犹太人念这名号，因为耶稣被钉十字架的地方，与城相近，并且是用希伯来、罗马、希腊三样文字写的。"],[21,"犹太人的祭司长就对彼拉多说：“不要写‘犹太人的王’，要写‘他自己说我是犹太人的王。’”"],[22,"彼拉多说：“我所写的，我已经写上了。”"],[23,"兵丁既然将耶稣钉在十字架上，就拿他的衣服分为四份，每兵一份；又拿他的里衣，这件里衣原来没有缝儿，是上下一片织成的。"],[24,"他们就彼此说：“我们不要撕开，只要拈阄，看谁得着。”这要应验经上的话说：“他们分了我的外衣，为我的里衣拈阄。”兵丁果然作了这事。"],[25,"站在耶稣十字架旁边的，有他母亲与他母亲的姐妹，并革罗罢的妻子马利亚和抹大拉的马利亚。"],[26,"耶稣见母亲和他所爱的那门徒站在旁边，就对他母亲说：“母亲（原文作“妇人”），看你的儿子！”"],[27,"又对那门徒说：“看你的母亲！”从此那门徒就接她到自己家里去了。"],[28,"这事以后，耶稣知道各样的事已经成了，为要使经上的话应验，就说：“我渴了！”"],[29,"有一个器皿盛满了醋，放在那里，他们就拿海绒蘸满了醋，绑在牛膝草上，送到他口。"],[30,"耶稣尝（原文作“受”）了那醋，就说：“成了！”，便低下头，将灵魂交付神了。"],[31,"犹太人因这日是预备日，又因那安息日是个大日，就求彼拉多叫人打断他们的腿，把他们拿去，免得尸首当安息日留在十字架上。"],[32,"于是兵丁来，把头一个人的腿，并与耶稣同钉第二个人的腿都打断了。"],[33,"只是来到耶稣那里，见他已经死了，就不打断他的腿。"],[34,"惟有一个兵拿枪扎他的肋旁，随即有血和水流出来。"],[35,"看见这事的那人就作见证，他的见证也是真的，并且他知道自己所说的是真的，叫你们也可以信。"],[36,"这些事成了，为要应验经上的话说：“他的骨头一根也不可折断。”"],[37,"经上又有一句说：“他们要仰望自己所扎的人。”"],[38,"这些事以后，有亚利马太人约瑟，是耶稣的门徒，只因怕犹太人，就暗暗地作门徒。他来求彼拉多，要把耶稣的身体领去。彼拉多允准，他就把耶稣的身体领去了。"],[39,"又有尼哥底母，就是先前夜里去见耶稣的，带着没药和沉香约有一百斤前来。"],[40,"他们就照犹太人殡葬的规矩，把耶稣的身体用细麻布加上香料裹好了。"],[41,"在耶稣钉十字架的地方有一个园子，园子里有一座新坟墓，是从来没有葬过人的。"],[42,"只因是犹太人的预备日，又因那坟墓近，他们就把耶稣安放在那里。"]]},{"n":20,"v":[[1,"七日的第一日清早，天还黑的时候，抹大拉的马利亚来到坟墓那里，看见石头从坟墓挪开了，"],[2,"就跑来见西门彼得和耶稣所爱的那个门徒，对他们说：“有人把主从坟墓里挪了去，我们不知道放在哪里。”"],[3,"彼得和那门徒就出来，往坟墓那里去。"],[4,"两个人同跑，那门徒比彼得跑得更快，先到了坟墓，"],[5,"低头往里看，就见细麻布还放在那里，只是没有进去。"],[6,"西门彼得随后也到了，进坟墓里去，就看见细麻布还放在那里；"],[7,"又看见耶稣的裹头巾没有和细麻布放在一处，是另在一处卷着。"],[8,"先到坟墓的那门徒也进去，看见就信了。"],[9,"因为他们还不明白圣经的意思，就是耶稣必要从死里复活。"],[10,"于是两个门徒回自己的住处去了。"],[11,"马利亚却站在坟墓外面哭，哭的时候，低头往坟墓里看，"],[12,"就见两个天使，穿着白衣，在安放耶稣身体的地方坐着，一个在头，一个在脚。"],[13,"天使对她说：“妇人，你为什么哭？”她说：“因为有人把我主挪了去，我不知道放在哪里。”"],[14,"说了这话，就转过身来，看见耶稣站在那里，却不知道是耶稣。"],[15,"耶稣问她说：“妇人，为什么哭？你找谁呢？”马利亚以为是看园的，就对他说：“先生，若是你把他移了去，请告诉我你把他放在哪里，我便去取他。”"],[16,"耶稣说：“马利亚！”马利亚就转过来，用希伯来话对他说：“拉波尼（拉波尼就是夫子的意思）！”"],[17,"耶稣说：“不要摸我，因我还没有升上去见我的父。你往我弟兄那里去，告诉他们说：我要升上去见我的父，也是你们的父；见我的神，也是你们的神。”"],[18,"抹大拉的马利亚就去告诉门徒说：“我已经看见了主。”她又将主对她说的这话告诉他们。"],[19,"那日（就是七日的第一日）晚上，门徒所在的地方，因怕犹太人，门都关了。耶稣来站在当中，对他们说：“愿你们平安！”"],[20,"说了这话，就把手和肋旁指给他们看。门徒看见主，就喜乐了。"],[21,"耶稣又对他们说：“愿你们平安！父怎样差遣了我，我也照样差遣你们。”"],[22,"说了这话，就向他们吹一口气，说：“你们受圣灵。"],[23,"你们赦免谁的罪，谁的罪就赦免了；你们留下谁的罪，谁的罪就留下了。”"],[24,"那十二个门徒中，有称为低土马的多马，耶稣来的时候，他没有和他们同在。"],[25,"那些门徒就对他说：“我们已经看见主了。”多马却说：“我非看见他手上的钉痕，用指头探入那钉痕，又用手探入他的肋旁，我总不信。”"],[26,"过了八日，门徒又在屋里，多马也和他们同在。门都关了。耶稣来站在当中说：“愿你们平安！”"],[27,"就对多马说：“伸过你的指头来，摸（“摸”原文作“看”）我的手；伸出你的手来，探入我的肋旁。不要疑惑，总要信。”"],[28,"多马说：“我的主，我的神！”"],[29,"耶稣对他说：“你因看见了我才信；那没有看见就信的有福了。”"],[30,"耶稣在门徒面前另外行了许多神迹，没有记在这书上。"],[31,"但记这些事，要叫你们信耶稣是基督，是神的儿子，并且叫你们信了他，就可以因他的名得生命。"]]},{"n":21,"v":[[1,"这些事以后，耶稣在提比哩亚海边又向门徒显现。他怎样显现记在下面。"],[2,"有西门彼得和称为低土马的多马，并加利利的迦拿人拿但业，还有西庇太的两个儿子，又有两个门徒，都在一处。"],[3,"西门彼得对他们说：“我打鱼去。”他们说：“我们也和你同去。”他们就出去，上了船，那一夜并没有打着什么。"],[4,"天将亮的时候，耶稣站在岸上，门徒却不知道是耶稣。"],[5,"耶稣就对他们说：“小子，你们有吃的没有？”他们回答说：“没有。”"],[6,"耶稣说：“你们把网撒在船的右边，就必得着。”他们便撒下网去，竟拉不上来了，因为鱼甚多。"],[7,"耶稣所爱的那门徒对彼得说：“是主！”那时西门彼得赤着身子，一听见是主，就束上一件外衣，跳在海里。"],[8,"其余的门徒离岸不远，约有二百肘（古代以肘为尺，一肘约有今时尺半）。就在小船上把那网鱼拉过来。"],[9,"他们上了岸，就看见那里有炭火，上面有鱼，又有饼。"],[10,"耶稣对他们说：“把刚才打的鱼拿几条来。”"],[11,"西门彼得就去（或作“上船”），把网拉到岸上，那网满了大鱼，共一百五十三条。鱼虽这样多，网却没有破。"],[12,"耶稣说：“你们来吃早饭。”门徒中没有一个敢问他“你是谁？”，因为知道是主。"],[13,"耶稣就来拿饼和鱼给他们。"],[14,"耶稣从死里复活以后向门徒显现，这是第三次。"],[15,"他们吃完了早饭，耶稣对西门彼得说：“约翰的儿子西门（“约翰”在马太16章17节称“约拿”），你爱我比这些更深吗？”彼得说：“主啊，是的，你知道我爱你。”耶稣对他说：“你喂养我的小羊。”"],[16,"耶稣第二次又对他说：“约翰的儿子西门，你爱我吗？”彼得说：“主啊，是的，你知道我爱你。”耶稣说：“你牧养我的羊。”"],[17,"第三次对他说：“约翰的儿子西门，你爱我吗？”彼得因为耶稣第三次对他说：“你爱我吗”，就忧愁，对耶稣说：“主啊，你是无所不知的，你知道我爱你。”耶稣说：“你喂养我的羊。"],[18,"我实实在在地告诉你：你年少的时候，自己束上带子，随意往来；但年老的时候，你要伸出手来，别人要把你束上，带你到不愿意去的地方。”"],[19,"耶稣说这话，是指着彼得要怎样死，荣耀神。说了这话，就对他说：“你跟从我吧！”"],[20,"彼得转过来，看见耶稣所爱的那门徒跟着，就是在晚饭的时候，靠着耶稣胸膛说：“主啊，卖你的是谁”的那门徒。"],[21,"彼得看见他，就问耶稣说：“主啊，这人将来如何？”"],[22,"耶稣对他说：“我若要他等到我来的时候，与你何干？你跟从我吧！”"],[23,"于是这话传在弟兄中间，说那门徒不死；其实耶稣不是说他不死，乃是说：“我若要他等到我来的时候，与你何干？”"],[24,"为这些事作见证，并且记载这些事的，就是这门徒，我们也知道他的见证是真的。"],[25,"耶稣所行的事还有许多；若是一一的都写出来，我想，所写的书就是世界也容不下了。"]]}]},{"name":"罗马书","chapters":[{"n":1,"v":[[1,"耶稣基督的仆人保罗，奉召为使徒，特派传神的福音。"],[2,"这福音是神从前藉众先知在圣经上所应许的。"],[3,"论到他儿子我主耶稣基督，按肉体说，是从大卫后裔生的；"],[4,"按圣善的灵说，因从死里复活，以大能显明是神的儿子。"],[5,"我们从他受了恩惠并使徒的职分，在万国之中叫人为他的名信服真道；"],[6,"其中也有你们这蒙召属耶稣基督的人。"],[7,"我写信给你们在罗马为神所爱、奉召作圣徒的众人。愿恩惠、平安从我们的父神并主耶稣基督，归与你们！"],[8,"第一，我靠着耶稣基督，为你们众人感谢我的神，因你们的信德传遍了天下。"],[9,"我在他儿子福音上，用心灵所侍奉的神，可以见证我怎样不住地提到你们；"],[10,"在祷告之间常常恳求，或者照神的旨意，终能得平坦的道路往你们那里去。"],[11,"因为我切切地想见你们，要把些属灵的恩赐分给你们，使你们可以坚固。"],[12,"这样，我在你们中间，因你与我彼此的信心，就可以同得安慰。"],[13,"弟兄们，我不愿意你们不知道，我屡次定意往你们那里去，要在你们中间得些果子，如同在其余的外邦人中一样，只是到如今仍有阻隔。"],[14,"无论是希腊人、化外人、聪明人、愚拙人，我都欠他们的债。"],[15,"所以情愿尽我的力量，将福音也传给你们在罗马的人。"],[16,"我不以福音为耻；这福音本是神的大能，要救一切相信的，先是犹太人，后是希腊人。"],[17,"因为神的义正在这福音上显明出来；这义是本于信，以致于信。如经上所记：“义人必因信得生。”"],[18,"原来，神的忿怒，从天上显明在一切不虔不义的人身上，就是那些行不义阻挡真理的人。"],[19,"神的事情，人所能知道的，原显明在人心里，因为神已经给他们显明。"],[20,"自从造天地以来，神的永能和神性是明明可知的，虽是眼不能见，但藉着所造之物就可以晓得，叫人无可推诿。"],[21,"因为他们虽然知道神，却不当作神荣耀他，也不感谢他。他们的思念变为虚妄，无知的心就昏暗了。"],[22,"自称为聪明，反成了愚拙；"],[23,"将不能朽坏之神的荣耀变为偶像，彷佛必朽坏的人和飞禽、走兽、昆虫的样式。"],[24,"所以，神任凭他们逞着心里的情欲行污秽的事，以致彼此玷辱自己的身体。"],[25,"他们将神的真实变为虚谎，去敬拜侍奉受造之物，不敬奉那造物的主。主乃是可称颂的，直到永远。阿们！"],[26,"因此，神任凭他们放纵可羞耻的情欲。他们的女人把顺性的用处变为逆性的用处；"],[27,"男人也是如此，弃了女人顺性的用处，欲火攻心，彼此贪恋，男和男行可羞耻的事，就在自己身上受这妄为当得的报应。"],[28,"他们既然故意不认识神，神就任凭他们存邪僻的心，行那些不合理的事；"],[29,"装满了各样不义、邪恶、贪婪、恶毒（或作“阴毒”），满心是嫉妒、凶杀、争竞、诡诈、毒恨，"],[30,"又是谗毁的、背后说人的、怨恨神的（或作“被神所憎恶的”）、侮慢人的、狂傲的、自夸的、捏造恶事的、违背父母的、"],[31,"无知的、背约的、无亲情的、不怜悯人的。"],[32,"他们虽知道神判定行这样事的人是当死的，然而他们不但自己去行，还喜欢别人去行。"]]},{"n":2,"v":[[1,"你这论断人的，无论你是谁，也无可推诿。你在什么事上论断人，就在什么事上定自己的罪，因你这论断人的，自己所行却和别人一样。"],[2,"我们知道这样行的人，神必照真理审判他。"],[3,"你这人哪，你论断行这样事的人，自己所行的却和别人一样，你以为能逃脱神的审判吗？"],[4,"还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？"],[5,"你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致神震怒，显他公义审判的日子来到。"],[6,"他必照各人的行为报应各人。"],[7,"凡恒心行善，寻求荣耀、尊贵和不能朽坏之福的，就以永生报应他们；"],[8,"惟有结党不顺从真理，反顺从不义的，就以忿怒、恼恨报应他们。"],[9,"将患难、困苦加给一切作恶的人，先是犹太人，后是希腊人；"],[10,"却将荣耀、尊贵、平安加给一切行善的人，先是犹太人，后是希腊人。"],[11,"因为神不偏待人。"],[12,"凡没有律法犯了罪的，也必不按律法灭亡；凡在律法以下犯了罪的，也必按律法受审判。"],[13,"（原来在神面前，不是听律法的为义，乃是行律法的称义。"],[14,"没有律法的外邦人若顺着本性行律法上的事，他们虽然没有律法，自己就是自己的律法。"],[15,"这是显出律法的功用刻在他们心里，他们是非之心同作见证，并且他们的思念互相较量，或以为是，或以为非。）"],[16,"就在神藉耶稣基督审判人隐秘事的日子，照着我的福音所言。"],[17,"你称为犹太人，又倚靠律法，且指着神夸口；"],[18,"既从律法中受了教训，就晓得神的旨意，也能分别是非（或作“也喜爱那美好的事”）；"],[19,"又深信自己是给瞎子领路的，是黑暗中人的光，"],[20,"是蠢笨人的师傅，是小孩子的先生，在律法上有知识和真理的模范。"],[21,"你既是教导别人，还不教导自己吗？你讲说人不可偷窃，自己还偷窃吗？"],[22,"你说人不可奸淫，自己还奸淫吗？你厌恶偶像，自己还偷窃庙中之物吗？"],[23,"你指着律法夸口，自己倒犯律法玷辱神吗？"],[24,"神的名在外邦人中，因你们受了亵渎，正如经上所记的。"],[25,"你若是行律法的，割礼固然于你有益；若是犯律法的，你的割礼就算不得割礼。"],[26,"所以那未受割礼的，若遵守律法的条例，他虽然未受割礼，岂不算是有割礼吗？"],[27,"而且那本来未受割礼的，若能全守律法，岂不是要审判你这有仪文和割礼竟犯律法的人吗？"],[28,"因为外面作犹太人的，不是真犹太人；外面肉身的割礼，也不是真割礼。"],[29,"惟有里面作的，才是真犹太人；真割礼也是心里的，在乎灵，不在乎仪文。这人的称赞不是从人来的，乃是从神来的。"]]},{"n":3,"v":[[1,"这样说来，犹太人有什么长处，割礼有什么益处呢？"],[2,"凡事大有好处，第一是神的圣言交托他们。"],[3,"即便有不信的，这有何妨呢？难道他们的不信，就废掉神的信吗？"],[4,"断乎不能！不如说，神是真实的，人都是虚谎的。如经上所记：“你责备人的时候，显为公义；被人议论的时候，可以得胜。”"],[5,"我且照着人的常话说，我们的不义若显出神的义来，我们可以怎么说呢？神降怒，是他不义吗？"],[6,"断乎不是！若是这样，神怎能审判世界呢？"],[7,"若神的真实，因我的虚谎越发显出他的荣耀，为什么我还受审判，好像罪人呢？"],[8,"为什么不说，我们可以作恶以成善呢？这是毁谤我们的人说我们有这话。这等人定罪是该当的。"],[9,"这却怎么样呢？我们比他们强吗？决不是的！因我们已经证明：犹太人和希腊人都在罪恶之下。"],[10,"就如经上所记：“没有义人，连一个也没有；"],[11,"没有明白的，没有寻求神的；"],[12,"都是偏离正路，一同变为无用。没有行善的，连一个也没有。"],[13,"他们的喉咙是敞开的坟墓，他们用舌头弄诡诈，嘴唇里有虺蛇的毒气，"],[14,"满口是咒骂苦毒；"],[15,"杀人流血，他们的脚飞跑，"],[16,"所经过的路，便行残害暴虐的事；"],[17,"平安的路，他们未曾知道；"],[18,"他们眼中不怕神。”"],[19,"我们晓得律法上的话，都是对律法以下之人说的，好塞住各人的口，叫普世的人都伏在神审判之下。"],[20,"所以凡有血气的，没有一个因行律法能在神面前称义，因为律法本是叫人知罪。"],[21,"但如今，神的义在律法以外已经显明出来，有律法和先知为证。"],[22,"就是神的义，因信耶稣基督加给一切相信的人，并没有分别。"],[23,"因为世人都犯了罪，亏缺了神的荣耀，"],[24,"如今却蒙神的恩典，因基督耶稣的救赎，就白白地称义。"],[25,"神设立耶稣作挽回祭，是凭着耶稣的血，藉着人的信，要显明神的义。因为他用忍耐的心，宽容人先时所犯的罪，"],[26,"好在今时显明他的义，使人知道他自己为义，也称信耶稣的人为义。"],[27,"既是这样，哪里能夸口呢？没有可夸的了。用何法没有的呢？是用立功之法吗？不是，乃用信主之法。"],[28,"所以（有古卷作“因为”）我们看定了，人称义是因着信，不在乎遵行律法。"],[29,"难道神只作犹太人的神吗？不也是作外邦人的神吗？是的，也作外邦人的神。"],[30,"神既是一位，他就要因信称那受割礼的为义，也要因信称那未受割礼的为义。"],[31,"这样，我们因信废了律法吗？断乎不是！更是坚固律法。"]]},{"n":4,"v":[[1,"如此说来，我们的祖宗亚伯拉罕凭着肉体得了什么呢？"],[2,"倘若亚伯拉罕是因行为称义，就有可夸的，只是在神面前并无可夸。"],[3,"经上说什么呢？说：“亚伯拉罕信神，这就算为他的义。”"],[4,"作工的得工价，不算恩典，乃是该得的；"],[5,"惟有不作工的，只信称罪人为义的神，他的信就算为义。"],[6,"正如大卫称那在行为以外蒙神算为义的人是有福的。"],[7,"他说：“得赦免其过、遮盖其罪的，这人是有福的；"],[8,"主不算为有罪的，这人是有福的。”"],[9,"如此看来，这福是单加给那受割礼的人吗？不也是加给那未受割礼的人吗？因我们所说，亚伯拉罕的信，就算为他的义。"],[10,"是怎么算的呢？是在他受割礼的时候呢？是在他未受割礼的时候呢？不是在受割礼的时候，乃是在未受割礼的时候。"],[11,"并且他受了割礼的记号，作他未受割礼的时候因信称义的印证，叫他作一切未受割礼而信之人的父，使他们也算为义；"],[12,"又作受割礼之人的父，就是那些不但受割礼，并且按我们的祖宗亚伯拉罕，未受割礼而信之踪迹去行的人。"],[13,"因为神应许亚伯拉罕和他后裔必得承受世界，不是因律法，乃是因信而得的义。"],[14,"若是属乎律法的人才得为后嗣，信就归于虚空，应许也就废弃了。"],[15,"因为律法是惹动忿怒的（或作“叫人受刑的”），哪里没有律法，那里就没有过犯。"],[16,"所以人得为后嗣是本乎信，因此就属乎恩，叫应许定然归给一切后裔，不但归给那属乎律法的，也归给那效法亚伯拉罕之信的。"],[17,"亚伯拉罕所信的，是那叫死人复活、使无变为有的神，他在主面前作我们世人的父。如经上所记：“我已经立你作多国的父。”"],[18,"他在无可指望的时候，因信仍有指望，就得以作多国的父，正如先前所说：“你的后裔将要如此。”"],[19,"他将近百岁的时候，虽然想到自己的身体如同已死，撒拉的生育已经断绝，他的信心还是不软弱；"],[20,"并且仰望神的应许，总没有因不信，心里起疑惑，反倒因信，心里得坚固，将荣耀归给神。"],[21,"且满心相信神所应许的必能作成。"],[22,"所以这就算为他的义。"],[23,"“算为他义”的这句话，不是单为他写的，"],[24,"也是为我们将来得算为义之人写的，就是我们这信神使我们的主耶稣从死里复活的人。"],[25,"耶稣被交给人，是为我们的过犯；复活，是为叫我们称义（或作“耶稣是为我们的过犯交付了，是为我们称义复活了”）。"]]},{"n":5,"v":[[1
