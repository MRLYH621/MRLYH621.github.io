<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LYH · 投资 / 项目 / 书籍</title>
<meta name="description" content="LYH 的索引页 — 投资、项目、书籍。">
<meta name="theme-color" content="#0b0d0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d0f'/%3E%3Ctext x='31' y='45' font-size='38' font-family='Georgia,serif' text-anchor='middle' fill='%23f2f0ea'%3EL%3C/text%3E%3Ccircle cx='52' cy='14' r='5' fill='%23a6c2b6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d0f; --ink:#f2f0ea; --muted:#7d838b; --line:#24272c;
  --accent:#a6c2b6; --hover:rgba(255,255,255,.035); --panel:#101316;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
}
body[data-theme="light"]{
  --bg:#f5f4f0; --ink:#17191c; --muted:#74787f; --line:#dcdad3;
  --accent:#3f6d5d; --hover:rgba(0,0,0,.03); --panel:#eceae4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}

.wrap{max-width:940px;margin:0 auto;padding:0 40px;min-height:100vh;
  display:flex;flex-direction:column}

header{display:flex;align-items:center;justify-content:space-between;
  padding:32px 0 0;flex:none}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--muted)}
.theme{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
  background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);
  cursor:pointer;padding:0;transition:border-color .2s,transform .3s}
.theme:hover{border-color:var(--accent);transform:rotate(30deg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

main{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(56px,11vh,120px) 0 clamp(40px,8vh,80px)}
h1{font-size:clamp(76px,15vw,150px);line-height:.9;font-weight:600;
  letter-spacing:-.07em;margin-bottom:clamp(40px,7vh,72px)}
h1 .dot{color:var(--accent)}

.list{border-top:1px solid var(--line)}
.entry-wrap{border-bottom:1px solid var(--line);
  animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
.entry-wrap:nth-child(1){animation-delay:.08s}
.entry-wrap:nth-child(2){animation-delay:.16s}
.entry-wrap:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.entry{width:100%;display:grid;align-items:center;gap:20px;
  grid-template-columns:52px 1fr auto 28px;
  padding:26px 12px 26px 8px;background:transparent;border:0;color:inherit;
  font:inherit;text-align:left;cursor:pointer;position:relative;
  transition:background .25s,padding-left .3s}
.entry::before{content:"";position:absolute;left:0;top:16%;bottom:16%;width:2px;
  background:var(--accent);transform:scaleY(0);transform-origin:center;
  transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.entry:hover{background:var(--hover);padding-left:16px}
.entry:hover::before,.entry[aria-expanded="true"]::before{transform:scaleY(1)}
.entry[aria-expanded="true"]{background:var(--hover)}
.entry[aria-expanded="true"]:hover{background:var(--panel)}

.idx{font-family:var(--serif);font-size:15px;color:var(--muted);
  transition:color .25s;letter-spacing:.02em}
.label{display:flex;align-items:baseline;gap:16px;min-width:0}
.zh{font-size:clamp(28px,4.4vw,40px);font-weight:600;letter-spacing:-.03em;
  transition:color .25s,transform .3s;white-space:nowrap}
.en{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);
  white-space:nowrap}
.count{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em}
.arrow{font-size:20px;color:var(--muted);justify-self:end;
  transition:transform .3s,color .25s}
.entry:hover .zh{transform:translateX(6px)}
.entry:hover .arrow{transform:translateX(6px);color:var(--accent)}
.entry:hover .idx,.entry:hover .count{color:var(--ink)}
.entry[aria-expanded="true"] .zh,
.entry[aria-expanded="true"] .idx{color:var(--accent)}
.entry[aria-expanded="true"] .arrow{transform:rotate(90deg);color:var(--accent)}
.entry[aria-expanded="true"]:hover .arrow{transform:rotate(90deg) translateX(4px)}

.panel{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .42s cubic-bezier(.2,.8,.2,1)}
.entry-wrap.open .panel{grid-template-rows:1fr}
.clip{overflow:hidden;min-height:0}
.panel-body{padding:4px 0 34px 72px;opacity:0;transform:translateY(-8px);
  transition:opacity .32s .06s,transform .32s .06s}
.entry-wrap.open .panel-body{opacity:1;transform:none}

.item{display:grid;grid-template-columns:170px 1fr auto;gap:2px 18px;
  align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-size:15px;font-weight:600}
.item .d{font-size:13px;color:var(--muted);line-height:1.7}
.item .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  color:var(--accent);white-space:nowrap;justify-self:end;grid-row:1}
.item a:hover .t{color:var(--accent)}
.chapters{grid-column:2;display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.chapters span{font-size:12px;color:var(--muted)}
.chapters span+span::before{content:"· ";color:var(--accent)}

footer{flex:none;display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;padding:22px 0 30px;
  border-top:1px solid var(--line);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.foot{display:flex;gap:22px}
.foot a{transition:color .2s}
.foot a:hover{color:var(--accent)}

@media(max-width:640px){
  .wrap{padding:0 20px}
  main{padding:48px 0 40px}
  h1{margin-bottom:44px}
  .entry{grid-template-columns:34px 1fr 22px;gap:12px;padding:22px 4px}
  .entry:hover{padding-left:8px}
  .count{display:none}
  .label{flex-direction:column;gap:2px;align-items:flex-start}
  .zh{font-size:30px}
  .en{font-size:9px}
  .panel-body{padding:2px 0 26px 34px}
  .item{grid-template-columns:1fr auto;gap:4px 12px}
  .item .d,.chapters{grid-column:1 / -1}
  .item .tag{grid-column:2;grid-row:1}
  footer{font-size:9.5px}
  .foot{gap:14px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">LYH / INDEX</span>
    <button class="theme" id="themeBtn" aria-label="切换深浅主题" title="切换深浅主题"></button>
  </header>

  <main>
    <h1>LYH<span class="dot">.</span></h1>
    <div class="list" id="list"></div>
  </main>

  <footer>
    <span>© <span id="year"></span> LYH</span>
    <span class="foot" id="foot"></span>
  </footer>
</div>

<script>
/* ========== 只改这里 ==========
   sections 顺序即页面顺序；items 是点击展开后的条目。
   给条目加 u: "https://..." 或 u: "github" 即可整行变成链接。
   ================================ */
const SITE = {
  name: "LYH",
  githubUser: "MRLYH621",
  email: "307169825@qq.com",
  sections: [
    {
      key: "invest", zh: "投资", en: "INVESTING",
      items: [
        { t: "长期主义不是不动", d: "关于持有、耐心，以及什么时候该承认自己想错了。", tag: "方法论" },
        { t: "记录一次判断失误", d: "把错误写下来，比记住赚钱的时刻更有用。", tag: "复盘" },
        { t: "复利真正难的地方", d: "不是收益率，是时间和不中断。", tag: "复利" }
      ]
    },
    {
      key: "projects", zh: "项目", en: "PROJECTS",
      items: [
        { t: "AI 写作助手", d: "把零散素材整理成可发布的长文。", tag: "WEB / 2026" },
        { t: "数据小工具", d: "把重复的手工整理自动化，重点是省时间。", tag: "TOOL" },
        { t: "还在实验的", d: "没做完也先放上来，记录想法有时比展示成果更有意思。", tag: "LAB" }
      ]
    },
    {
      key: "books", zh: "书籍", en: "WRITING",
      items: [
        { t: "关于经验与时间", d: "写作中 · 把这几年写过的想法收成一本书。", chapters: ["经验不等于收入", "时间的对数感", "慢慢来，比较快"] },
        { t: "第二本 · 待定", d: "构思中 · 还在攒素材，先留个位置。", chapters: ["主题待定", "素材收集中"] }
      ]
    }
  ]
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const resolve = (u) => u === "github" ? `https://github.com/${encodeURIComponent(SITE.githubUser)}` : u;
const pad = (n) => String(n).padStart(2, "0");

$('#year').textContent = new Date().getFullYear();
document.title = `${SITE.name} · ${SITE.sections.map(s => s.zh).join(" / ")}`;

$('#list').innerHTML = SITE.sections.map((s, i) => {
  const rows = s.items.map(it => {
    const chapters = (it.chapters || []).length
      ? `<div class="chapters">${it.chapters.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : "";
    const inner = `<span class="t">${esc(it.t)}</span>
      <span class="d">${esc(it.d)}</span>
      ${chapters}
      ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}`;
    return it.u
      ? `<a class="item" href="${esc(resolve(it.u))}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="item">${inner}</div>`;
  }).join("");
  return `<div class="entry-wrap" data-key="${esc(s.key)}">
    <button class="entry" type="button" aria-expanded="false"
      aria-controls="panel-${esc(s.key)}" id="tab-${esc(s.key)}">
      <span class="idx">${pad(i + 1)}</span>
      <span class="label"><span class="zh">${esc(s.zh)}</span><span class="en">${esc(s.en)}</span></span>
      <span class="count">${pad(s.items.length)}</span>
      <span class="arrow" aria-hidden="true">→</span>
    </button>
    <div class="panel" id="panel-${esc(s.key)}" role="region" aria-labelledby="tab-${esc(s.key)}">
      <div class="clip"><div class="panel-body">${rows}</div></div>
    </div>
  </div>`;
}).join('');

$('#foot').innerHTML =
  `<a href="${esc(resolve('github'))}" target="_blank" rel="noopener">GITHUB ↗</a>` +
  `<a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>`;

/* 手风琴：同时只展开一个；Esc 收起 */
const wraps = Array.from(document.querySelectorAll('.entry-wrap'));
function setOpen(wrap, open) {
  wrap.classList.toggle('open', open);
  wrap.querySelector('.entry').setAttribute('aria-expanded', String(open));
}
wraps.forEach(wrap => {
  wrap.querySelector('.entry').addEventListener('click', () => {
    const willOpen = !wrap.classList.contains('open');
    wraps.forEach(w => setOpen(w, false));
    if (willOpen) setOpen(wrap, true);
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const open = wraps.find(w => w.classList.contains('open'));
    if (open) { setOpen(open, false); open.querySelector('.entry').focus(); }
  }
});

/* 主题 */
const btn = $('#themeBtn');
const KEY = 'lyh-v3-theme';
function applyTheme(light) {
  document.body.dataset.theme = light ? 'light' : '';
  $('meta[name="theme-color"]').content = light ? '#f5f4f0' : '#0b0d0f';
  btn.setAttribute('aria-label', light ? '切换到深色主题' : '切换到浅色主题');
}
let light = localStorage.getItem(KEY) === 'light';
applyTheme(light);
btn.addEventListener('click', () => {
  light = !light;
  localStorage.setItem(KEY, light ? 'light' : 'dark');
  applyTheme(light);
});
</script>
</body>
</html>
