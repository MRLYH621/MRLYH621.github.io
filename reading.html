<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书籍阅读 · LYH</title>
<style>
:root{
  --bg:#0e1117; --panel:#161b22; --card:#1b2230; --card2:#212a3b;
  --line:#2d3748; --text:#e6edf3; --muted:#93a1b5; --dim:#6b7a90;
  --accent:#d4a94e; --done:#3fb950; --donebg:#15301f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:0 0 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{padding:30px 0 18px;border-bottom:1px solid var(--line)}
.kicker{color:var(--accent);font-size:12px;letter-spacing:2px;font-weight:600}
h1{font-size:25px;font-weight:700;margin:8px 0 6px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px;max-width:820px}
.sub a{color:var(--accent);text-decoration:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 2px}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px 10px 0 0;padding:11px 16px;font-size:13px;cursor:pointer;position:relative;top:1px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card);color:var(--text);border-bottom-color:var(--card);font-weight:600}
.tab .cnt{font-size:11px;color:var(--dim);margin-left:6px}
.tab.on .cnt{color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr) 150px;gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .lab{color:var(--muted);font-size:12px}
.stat .num{font-size:26px;font-weight:700;margin-top:2px}
.stat .num small{font-size:13px;color:var(--dim);font-weight:400}
.stat.pct .num{color:var(--accent)}
.stat.dn .num{color:var(--done)}
.ringbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .rtxt{position:absolute;text-align:center;font-size:12px;font-weight:600;color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 13px;color:var(--text);font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--text)}
.btn.on{background:var(--accent);color:#1a1305;border-color:var(--accent);font-weight:600}
.btn.danger:hover{border-color:#e05a5a;color:#e05a5a}
.eras{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--dim)}
.chip.on{color:#0e1117;font-weight:600;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:background .15s,border-color .15s;overflow:hidden}
.card:hover{background:var(--card2);border-color:var(--dim)}
.card.done{background:var(--donebg);border-color:#2c6b3c}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .idx{color:var(--dim);font-size:11px;min-width:26px;font-variant-numeric:tabular-nums;padding-top:3px}
.card .body{flex:1;min-width:0}
.card .cn{font-size:14.5px;font-weight:600;line-height:1.4}
.card .en{color:var(--muted);font-size:11.5px;margin-top:2px;font-style:italic;word-break:break-word}
.card .au{color:var(--dim);font-size:11.5px;margin-top:5px}
.card .meta{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 8px;border-radius:20px;color:#0e1117;font-weight:600}
.yr{font-size:10.5px;color:var(--dim)}
.box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--dim);flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px}
.card.done .box{background:var(--done);border-color:var(--done)}
.card.done .box::after{content:"";width:5px;height:9px;border:solid #0e1117;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
.card.done .cn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.note{color:#c9a86a;font-size:11px;margin-top:7px;line-height:1.5}
.empty{text-align:center;color:var(--dim);padding:50px 0;font-size:14px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1.8}
.list .grid{grid-template-columns:1fr}
.list .card{padding:9px 14px}
.list .card .top{align-items:center}
.list .card .body{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.list .card .en{margin-top:0;flex:1}
.list .card .meta{margin-top:0}
@media(max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .ringbox{grid-column:span 2;padding:14px 0}
  h1{font-size:20px}
  .tab{padding:9px 12px;font-size:12px}
  .list .card .body{display:block}
  .list .card .en{margin-top:2px}
}
/* ---------- 阅读感受 ---------- */
.card .feel{display:inline-flex;align-items:center;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:3px 9px;font-size:11px;margin-top:9px;cursor:pointer;transition:.15s;max-width:100%}
.card .feel:hover{border-color:var(--accent);color:var(--accent)}
.card .feel.has{background:#3a2f17;border-color:#8a6d2f;color:#f0c96b}
.card .feel.bible{text-decoration:none;border-color:#7a5c2e;color:#d4a94e;background:rgba(212,169,78,.08)}
.card .feel.bible:hover{background:#d4a94e;color:#1a1305;border-color:#d4a94e}
.mask{position:fixed;inset:0;background:rgba(6,9,14,.74);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(660px,100%);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.modal .mk{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:600}
.modal h2{font-size:21px;margin:6px 0 2px;line-height:1.35}
.modal .men{color:var(--muted);font-size:12px;font-style:italic;word-break:break-word}
.modal .mau{color:var(--dim);font-size:12px;margin-top:5px}
.modal .x{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:32px;height:32px;font-size:19px;cursor:pointer;flex:none;line-height:1}
.modal .x:hover{border-color:var(--accent);color:var(--accent)}
.modal label{display:block;color:var(--muted);font-size:12px;margin:18px 0 7px}
.modal textarea{width:100%;min-height:210px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;font-size:14px;line-height:1.75;outline:none;resize:vertical;font-family:inherit}
.modal textarea:focus{border-color:var(--accent)}
.modal .stars{display:flex;gap:6px}
.modal .stars span{font-size:26px;cursor:pointer;color:var(--line);line-height:1;transition:.1s}
.modal .stars span:hover{transform:scale(1.15)}
.modal .stars span.on{color:var(--accent)}
.modal .mf{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.modal .saved{color:var(--done);font-size:12px;margin-right:auto;opacity:0;transition:opacity .2s}
.modal .saved.show{opacity:1}
.modal .mf .btn{padding:10px 18px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
  <div class="kicker">COLUMBIA UNIVERSITY · CORE CURRICULUM</div>
  <a href="index.html" style="color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px">← 返回主页</a>
  </div>
  <h1>哥大核心课程 · 经典阅读清单</h1>
  <p class="sub" id="desc"></p>
</header>

<div class="tabs" id="tabs"></div>

<div class="stats">
  <div class="stat"><div class="lab">全部书目</div><div class="num" id="sTotal">0 <small>部</small></div></div>
  <div class="stat dn"><div class="lab">已读</div><div class="num" id="sDone">0</div></div>
  <div class="stat"><div class="lab">未读</div><div class="num" id="sLeft">0</div></div>
  <div class="stat pct"><div class="lab">完成度</div><div class="num" id="sPct">0%</div></div>
  <div class="ringbox">
    <svg width="118" height="118" viewBox="0 0 118 118">
      <circle cx="59" cy="59" r="48" fill="none" stroke="#2d3748" stroke-width="9"/>
      <circle id="ring" cx="59" cy="59" r="48" fill="none" stroke="#d4a94e" stroke-width="9" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
    </svg>
    <div class="rtxt" id="ringTxt">0 / 0</div>
  </div>
</div>

<div class="toolbar">
  <input class="search" id="q" placeholder="搜索书名 / 作者（中英文均可）…">
  <button class="btn on" data-f="all">全部</button>
  <button class="btn" data-f="todo">未读</button>
  <button class="btn" data-f="done">已读</button>
  <button class="btn" data-f="note">有感受</button>
  <button class="btn" id="viewBtn">切换列表</button>
  <button class="btn" id="exportBtn">导出本 tab</button>
  <button class="btn" id="exportAllBtn">导出全部</button>
  <button class="btn danger" id="resetBtn">重置本 tab</button>
</div>
<div class="eras" id="eras"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">没有符合条件的书目</div>

<footer id="footer"></footer>
</div>

<div class="mask" id="mask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mcn">
    <div class="mh">
      <div>
        <div class="mk">READING NOTE · 阅读感受</div>
        <h2 id="mcn"></h2>
        <div class="men" id="men"></div>
        <div class="mau" id="mau"></div>
      </div>
      <button class="x" id="mClose" aria-label="关闭">×</button>
    </div>
    <label>我的评分</label>
    <div class="stars" id="stars"></div>
    <label>阅读感受 · 摘录 · 想法（自动保存）</label>
    <textarea id="mtxt" placeholder="读完这本书，哪句话击中了你？和你的处境有什么关系？随便写，写给自己看。"></textarea>
    <div class="mf">
      <span class="saved" id="msaved">✓ 已保存</span>
      <button class="btn danger" id="mDel">删除感受</button>
      <button class="btn" id="mDone">关闭</button>
    </div>
  </div>
</div>

function hasNote(d){const n=notes[cur][noteKey(d)];return !!(n&&(n.text||n.rate))}
function match(d){
  if(cat&&d[4]!==cat)return false;
  if(filter==='done'&&!done[cur].has(bookKey(d)))return false;
  if(filter==='todo'&&done[cur].has(bookKey(d)))return false;
  if(filter==='note'&&!hasNote(d))return false;
  if(q&&!(d[0]+d[1]+d[2]+d[3]+(d[6]||'')).toLowerCase().includes(q))return false;
  return true;
}
function render(){
  const t=curTab(),g=$('#grid');g.innerHTML='';let n=0;
  t.items.forEach((d,i)=>{
    if(!match(d))return;n++;
    const isDone=done[cur].has(bookKey(d));
    const el=document.createElement('div');el.className='card'+(isDone?' done':'');
    el.title=[d[0],d[2],d[5]&&('年代/年份 '+d[5]),d[6]].filter(Boolean).join(' · ');
    el.innerHTML='<div class="top"><div class="idx">'+(i+1<10?'0':'')+(i+1)+'</div>'+
      '<div class="body"><div class="cn">'+esc(d[3])+'</div><div class="en">'+esc(d[2])+'</div>'+
      '<div class="au">'+esc(d[1])+'</div><div class="meta">'+
      '<span class="tag" style="background:'+catColor(t,d[4])+'">'+esc(d[4])+'</span>'+
      (d[5]?'<span class="yr">'+esc(d[5])+'</span>':'')+'</div>'+
      (d[6]?'<div class="note">'+esc(d[6])+'</div>':'')+
      (bibleVol(d)?'<a class="feel bible" data-bible="1" href="bible.html?b='+encodeURIComponent(bibleVol(d))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 读原文 · 和合本</a>':'')+
      '<button class="feel'+(hasNote(d)?' has':'')+'" data-note="1">'+(hasNote(d)?'✎ 查看/编辑感受':'＋ 写阅读感受')+'</button>'+
      '</div><div class="box"></div></div>';
    el.querySelector('[data-note]').onclick=ev=>{ev.stopPropagation();openNote(d)};
    el.onclick=()=>{isDone?done[cur].delete(bookKey(d)):done[cur].add(bookKey(d));save(cur);updateStats();render()};
    g.appendChild(el);
  });
  $('#empty').style.display=n?'none':'block';
  document.body.classList.toggle('list',listView);
}
function updateStats(){
  const t=curTab(),c=done[cur].size,total=t.items.length,left=total-c,pct=total?Math.round(c/total*100):0;
  $('#sTotal').innerHTML=total+' <small>部</small>';
  $('#sDone').textContent=c;$('#sLeft').textContent=left;$('#sPct').textContent=pct+'%';
  $('#ring').setAttribute('stroke-dashoffset',(RING*(1-pct/100)).toFixed(1));
  $('#ringTxt').textContent=c+' / '+total;
}
/* ---------- 阅读感受弹窗 ---------- */
function openNote(d){
  noteBook=d;
  const k=noteKey(d),n=notes[cur][k]||{};
  $('#mcn').textContent=d[3];
  $('#men').textContent=d[2];
  $('#mau').textContent=[d[1],d[4],d[5]&&('年代 '+d[5])].filter(Boolean).join(' · ');
  $('#mtxt').value=n.text||'';
  renderStars(n.rate||0);
  $('#mask').classList.add('show');
  setTimeout(()=>$('#mtxt').focus(),40);
}
function renderStars(n){
  const box=$('#stars');box.innerHTML='';
  for(let i=1;i<=5;i++){
    const s=document.createElement('span');
    s.textContent='★';s.className=i<=n?' on':'';
    s.title=i+' 星';
    s.onclick=()=>{
      const k=noteKey(noteBook);
      notes[cur][k]=Object.assign({text:$('#mtxt').value},notes[cur][k]||{},{rate:(notes[cur][k]||{}).rate===i?0:i});
      if(!notes[cur][k].text&&!notes[cur][k].rate)delete notes[cur][k];
      saveNotes();renderStars((notes[cur][k]||{}).rate||0);flashSaved();render();
    };
    box.appendChild(s);
  }
}
let savedTimer=null;
function flashSaved(){const el=$('#msaved');el.classList.add('show');clearTimeout(savedTimer);savedTimer=setTimeout(()=>el.classList.remove('show'),1200)}
function saveCurrentNote(){
  if(!noteBook)return;
  const k=noteKey(noteBook),text=$('#mtxt').value.trim(),old=notes[cur][k]||{};
  if(text||old.rate){notes[cur][k]=Object.assign({},old,{text,ts:Date.now()})}
  else delete notes[cur][k];
  saveNotes();flashSaved();
}
function closeNote(){saveCurrentNote();$('#mask').classList.remove('show');noteBook=null;render()}
function renderAll(){renderTabs();renderDesc();renderCats();updateStats();render()}
function download(lines,name){
  const b=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportTab(id){
  const t=TABS.find(x=>x.id===id),ds=done[id],ns=notes[id]||{};
  const lines=[t.name+' · 阅读记录','导出时间：'+new Date().toLocaleString('zh-CN'),'已读：'+ds.size+' / '+t.items.length,'','【已读】'];
  t.items.forEach((d,i)=>{if(ds.has(bookKey(d)))lines.push((i+1)+'. '+d[3]+' — '+d[1]+' ('+d[2]+')')});
  lines.push('','【未读】');
  t.items.forEach((d,i)=>{if(!ds.has(bookKey(d)))lines.push((i+1)+'. '+d[3]+' — '+d[1]+' ('+d[2]+')')});
  const noted=t.items.filter(d=>{const n=ns[id+'|'+d[0]+'|'+d[2]];return n&&(n.text||n.rate)});
  if(noted.length){
    lines.push('','【阅读感受 · 共 '+noted.length+' 条】');
    noted.forEach((d,i)=>{
      const n=ns[id+'|'+d[0]+'|'+d[2]];
      lines.push('──── '+(i+1)+'. '+d[3]+' — '+d[1]+(n.rate?(' · '+n.rate+'★'):''),n.text||'（仅评分）','');
    });
  }
  return lines;
}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render();
});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#viewBtn').onclick=e=>{listView=!listView;e.target.textContent=listView?'切换卡片':'切换列表';render()};
$('#mClose').onclick=closeNote;
$('#mDone').onclick=closeNote;
$('#mask').onclick=e=>{if(e.target===$('#mask'))closeNote()};
$('#mtxt').addEventListener('input',saveCurrentNote);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mask').classList.contains('show'))closeNote()});
$('#mDel').onclick=()=>{
  if(!noteBook)return;
  const k=noteKey(noteBook);
  if(confirm('确定删除《'+noteBook[3]+'》的阅读感受？此操作不可撤销。')){
    delete notes[cur][k];saveNotes();$('#mtxt').value='';renderStars(0);render();
    $('#mask').classList.remove('show');noteBook=null;
  }
};
$('#resetBtn').onclick=()=>{
  const t=curTab();
  if(confirm('确定清空【'+t.name+'】的全部阅读记录和阅读感受？此操作不可撤销。')){
    done[cur].clear();save(cur);notes[cur]={};saveNotes();updateStats();render();
  }
};
$('#exportBtn').onclick=()=>download(exportTab(cur),tFileName(cur));
$('#exportAllBtn').onclick=()=>{
  const out=[];TABS.forEach(t=>{out.push('','════════ '+t.name+' ════════');out.push(...exportTab(t.id))});
  out.unshift('哥大核心课程 · 全部经典阅读记录');download(out,'哥大经典_全部阅读记录.txt');
};
function tFileName(id){const t=TABS.find(x=>x.id===id);return '哥大_'+t.name.replace(/[·\s]/g,'')+'_阅读记录.txt'}
renderAll();
</script>
</body>
</html>
